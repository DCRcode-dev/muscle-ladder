<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>DCR Gym</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════════
   DCR GYM  ·  Ultra-Luxury Biometric Interface  ·  Phase 1-5 Production Rewrite
   ═══════════════════════════════════════════════════════════════════════════════ */

:root {
  /* ── OKLCH Perceptual Palette (prevents muddy grey mid-tones) ── */
  --bg:             oklch(97.8% 0.008 72);     /* #FAF7F2 vellum */
  --card:           oklch(100% 0 0);           /* pure white */
  --border:         oklch(91.2% 0.012 72);     /* #EDE8E0 warm divide */
  --accent:         oklch(58.5% 0.210 32);     /* #F04E23 terracotta */
  --green:          oklch(72.3% 0.190 145);    /* #22C55E emerald */
  --charcoal:       oklch(22.8% 0.018 42);     /* #2A2421 warm espresso */
  --muted:          oklch(72.0% 0.030 60);     /* #B8A99A sand */
  --text:           oklch(22.8% 0.018 42);     /* #2A2421 */
  --text-secondary: oklch(44.0% 0.025 55);     /* #6B6259 mid-warm */
  --gold:           oklch(70.0% 0.110 82);     /* #C9A84C antique gold */
  --glow-coral:     oklch(72% 0.140 32);       /* silhouette bloom fill */
  --glow-peach:     oklch(84% 0.090 52);       /* silhouette mid fill */

  /* ── Typography ── */
  --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-hero: 'Cormorant Garamond', 'Didot', 'Bodoni MT', Georgia, serif;
  --font-mono: 'Courier New', 'Courier', monospace;

  /* ── Golden Ratio Spatial Scale (×8 / ×13 / ×21 / ×34 / ×55) ── */
  --space-xs:  8px;
  --space-sm: 13px;
  --space-md: 21px;
  --space-lg: 34px;
  --space-xl: 55px;

  /* ── 5-Step Mathematically Smooth Shadow Stack ── */
  --shadow:
    0 1px  2px rgba(42,36,33,0.040),
    0 2px  6px rgba(42,36,33,0.036),
    0 4px 12px rgba(42,36,33,0.028),
    0 8px 24px rgba(42,36,33,0.018),
    0 16px 40px rgba(42,36,33,0.010);
  --shadow-deep:
    0 2px  4px rgba(42,36,33,0.060),
    0 4px 12px rgba(42,36,33,0.055),
    0 8px 24px rgba(42,36,33,0.045),
    0 16px 48px rgba(42,36,33,0.030),
    0 32px 80px rgba(42,36,33,0.018);
  --shadow-cta:
    0 2px  4px rgba(42,36,33,0.100),
    0 4px 12px rgba(42,36,33,0.090),
    0 8px 24px rgba(42,36,33,0.075),
    0 16px 40px rgba(42,36,33,0.055),
    0 24px 64px rgba(42,36,33,0.030);

  /* ── Shape ── */
  --radius:    24px;
  --radius-sm: 16px;

  /* ── Layout ── */
  --nav-h:    72px;
  --header-h: 64px;
}

/* ── Global resets ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100svh; max-height: 100svh; overflow: hidden;
  background: var(--bg);
  font-family: var(--font-body);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  font-feature-settings: "liga" 1, "dlig" 1;
}

#app { height: 100svh; overflow: hidden; position: relative; background: transparent; }

/* ── Micro-noise grain overlay  (0.025 opacity per spec) ── */
#app::after {
  content: '';
  position: fixed; inset: 0; z-index: 999; pointer-events: none;
  opacity: 0.025; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 128px 128px;
}

/* ── Screen transitions ── */
.screen {
  position: absolute; inset: 0;
  background: var(--bg);
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  will-change: transform, opacity;
  transition: transform 350ms cubic-bezier(0.16,1,0.3,1),
              opacity  350ms cubic-bezier(0.16,1,0.3,1);
  opacity: 0; pointer-events: none; z-index: 0;
}
.screen.active        { transform: translateX(0);   opacity: 1; pointer-events: all; z-index: 10; }
.screen.slide-out-left  { transform: translateX(-30%); opacity: 0; pointer-events: none; }
.screen.slide-out-right { transform: translateX(30%);  opacity: 0; pointer-events: none; }
.screen.slide-in-right  { transform: translateX(30%);  opacity: 0; pointer-events: none; }
.screen.slide-in-left   { transform: translateX(-30%); opacity: 0; pointer-events: none; }
.screen-content { padding-bottom: calc(var(--nav-h) + 24px); }
body.rest-active .screen-content { padding-bottom: calc(var(--nav-h) + 88px); }

/* ── Bottom nav ── */
#bottom-nav {
  position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 400px;
  background: rgba(250,247,242,0.82);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-radius: 24px;
  box-shadow: var(--shadow-deep);
  display: flex; align-items: center; justify-content: space-around;
  height: 56px; z-index: 100; padding: 0 8px;
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; flex: 1; padding: 8px; border: none;
  background: none; cursor: pointer;
  color: var(--muted); font-size: 10px;
  font-family: var(--font-body);
  transition: color 350ms cubic-bezier(0.16,1,0.3,1);
  min-height: 44px; justify-content: center;
  letter-spacing: 0.04em;
}
.nav-btn.active { color: var(--charcoal); }
.nav-btn svg { width: 20px; height: 20px; stroke-width: 1.5; }

/* ── Masthead gear icon ── */
.masthead-gear {
  position: absolute; top: 48px; right: 28px;
  background: none; border: none; cursor: pointer; padding: 8px;
  color: var(--muted); opacity: 0.55;
  transition: opacity 200ms ease, transform 300ms ease;
  -webkit-tap-highlight-color: transparent;
}
.masthead-gear:active { transform: rotate(45deg); opacity: 1; }
.masthead-gear svg { width: 18px; height: 18px; display: block; }

/* ── Analysis screen ── */
#screen-analysis { overflow: hidden; height: 100svh; }
.analysis-wrap {
  display: flex; flex-direction: column;
  height: 100svh;
  padding: 52px 28px calc(var(--nav-h) + 20px);
  box-sizing: border-box;
  justify-content: space-between;
}
.analysis-eyebrow {
  font-family: var(--font-body); font-size: 10px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--muted); opacity: 0.6;
  flex-shrink: 0;
}
/* Ring zone */
.analysis-ring-zone {
  display: flex; flex-direction: column; align-items: center;
  flex-shrink: 0; padding-top: 4px;
}
.analysis-ring-container {
  position: relative; width: 160px; height: 160px;
}
.analysis-ring-container svg {
  width: 160px; height: 160px; display: block;
}
.analysis-ring-score {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  pointer-events: none;
}
.analysis-ring-number {
  font-family: 'Cormorant Garamond', serif; font-size: 2.8rem;
  font-weight: 300; font-style: italic; line-height: 1;
  color: var(--charcoal); letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums lining-nums;
}
.analysis-ring-label {
  font-family: var(--font-body); font-size: 9px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted); opacity: 0.65; margin-top: 3px;
}
.analysis-factor-label {
  font-family: var(--font-body); font-size: 9.5px; letter-spacing: 0.08em;
  color: var(--muted); opacity: 0.55; margin-top: 10px; font-style: italic;
  text-align: center;
}
/* Vitals row */
.analysis-vitals-row {
  display: flex; align-items: baseline; justify-content: center;
  gap: 12px; flex-shrink: 0;
}
.analysis-vital-block { text-align: center; }
.analysis-vital-num {
  font-family: 'Cormorant Garamond', serif; font-size: 2.4rem;
  font-weight: 300; font-style: italic; line-height: 1;
  color: var(--charcoal); letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums lining-nums;
}
.analysis-vital-unit {
  font-family: var(--font-body); font-size: 10px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted); opacity: 0.6;
}
.analysis-vitals-sep {
  font-family: var(--font-body); font-size: 18px; color: var(--border);
  opacity: 0.5; padding-bottom: 4px;
}
/* Chart zone */
.analysis-chart-zone { flex: 1; min-height: 0; display: flex; flex-direction: column; padding-top: 8px; }
.analysis-chart-label {
  font-size: 9px; text-transform: uppercase; letter-spacing: 0.16em;
  color: var(--muted); opacity: 0.55; margin-bottom: 8px; flex-shrink: 0;
}
.analysis-chart-legend {
  display: flex; gap: 14px; margin-bottom: 8px; flex-shrink: 0;
}
.analysis-legend-item {
  display: flex; align-items: center; gap: 5px;
  font-family: var(--font-body); font-size: 8.5px; letter-spacing: 0.08em;
  color: var(--muted); opacity: 0.7; text-transform: lowercase;
}
.analysis-legend-dot {
  width: 14px; height: 1.5px; border-radius: 1px; flex-shrink: 0;
}
.analysis-chart-svg-wrap { flex: 1; min-height: 0; }
.analysis-chart-svg-wrap svg { width: 100%; height: 100%; display: block; }
/* Connect / sync footer */
.analysis-connect-link {
  font-family: var(--font-body); font-size: 9.5px; letter-spacing: 0.12em;
  text-transform: lowercase; color: var(--muted); opacity: 0.45;
  background: none; border: none; cursor: pointer; padding: 0;
  text-decoration: underline; text-underline-offset: 3px;
  flex-shrink: 0; text-align: center;
}
.analysis-connect-link:active { opacity: 1; }

/* ── Analysis HUD bar ── */
.analysis-eyebrow-row {
  display: flex; align-items: center; justify-content: space-between;
  flex-shrink: 0;
}
.analysis-hud-right {
  display: flex; align-items: center; gap: 6px;
}
.analysis-hud-dot {
  width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
}
.analysis-hud-dot.live {
  background: oklch(72.3% 0.190 145);
  animation: hud-pulse 2.8s ease-in-out infinite;
}
.analysis-hud-dot.stale {
  background: oklch(62% 0.155 38);
  opacity: 0.7;
}
@keyframes hud-pulse {
  0%, 100% { box-shadow: 0 0 0 0 oklch(72.3% 0.190 145 / 0.45); }
  55%       { box-shadow: 0 0 0 4px oklch(72.3% 0.190 145 / 0); }
}
.analysis-hud-meta {
  font-family: var(--font-body); font-size: 8.5px; letter-spacing: 0.09em;
  color: var(--muted); opacity: 0.45; text-transform: lowercase;
}
.analysis-hud-refresh {
  font-family: var(--font-body); font-size: 9px; letter-spacing: 0.10em;
  text-transform: lowercase; color: var(--muted); opacity: 0.35;
  background: none; border: none; cursor: pointer; padding: 0 0 0 4px;
  transition: opacity 0.2s;
}
.analysis-hud-refresh:active { opacity: 0.9; }
@keyframes hud-spin {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}

/* ── Post-workout insight card ── */
.insight-card {
  margin: 16px 16px 0;
  background: rgba(250,247,242,0.90);
  backdrop-filter: blur(12px) saturate(1.2);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px 18px;
  box-shadow: 0 2px 12px rgba(44,36,26,0.06), 0 8px 32px rgba(44,36,26,0.04);
}
.insight-card-eyebrow {
  font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.18em;
  color: var(--muted); opacity: 0.6; margin-bottom: 8px;
}
.insight-card-body {
  font-size: 12.5px; line-height: 1.65; color: var(--text-secondary);
  font-family: var(--font-body);
}
.insight-card-body strong {
  color: var(--charcoal); font-weight: 600;
}
.insight-card-meta {
  margin-top: 10px; font-size: 9.5px; color: var(--muted);
  opacity: 0.5; letter-spacing: 0.06em;
}

/* ── Splash — hard-coded inside #app, purely cosmetic ── */
#splash {
  position: absolute; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; transition: opacity 350ms ease-out;
  pointer-events: none;
}

/* ── Onboarding ── */
.ob-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 100%;
  padding: 56px 28px 72px; text-align: center;
}
.ob-eyebrow {
  font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.18em; color: var(--muted); margin-bottom: 24px;
}
.ob-question {
  font-family: var(--font-hero); font-size: 2.5rem; font-weight: 600;
  font-style: italic; color: var(--charcoal);
  line-height: 1.12; margin-bottom: 10px;
}
.ob-hint {
  font-size: 14px; color: var(--text-secondary);
  margin-bottom: 44px; line-height: 1.55;
}
.ob-dots { display: flex; gap: 6px; margin-bottom: 40px; }
.ob-dot {
  width: 5px; height: 5px; border-radius: 3px;
  background: var(--border);
  transition: all 380ms cubic-bezier(0.34,1.56,0.64,1);
}
.ob-dot.active { background: var(--accent); width: 22px; }
.ob-pill-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; width: 100%; max-width: 360px; margin-bottom: 32px;
}
.ob-pill {
  background: transparent; border: 1.5px solid var(--border);
  border-radius: 20px; padding: 20px 14px;
  cursor: pointer; text-align: left;
  transition: all 350ms cubic-bezier(0.16,1,0.3,1);
}
.ob-pill:active { transform: scale(0.96); }
.ob-pill.selected {
  border-color: var(--accent);
  background: rgba(240,78,35,0.04);
  box-shadow: 0 0 0 4px rgba(240,78,35,0.10), 0 8px 28px rgba(240,78,35,0.18);
}
.ob-pill-days {
  font-family: var(--font-hero); font-size: 2.4rem; font-weight: 700;
  color: var(--accent); line-height: 1;
}
.ob-pill-sub {
  font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-secondary); margin-top: 4px;
}
.ob-pill-name { font-size: 10.5px; color: var(--muted); margin-top: 5px; line-height: 1.35; }
.ob-cta {
  width: 100%; max-width: 300px; padding: 18px 28px;
  border-radius: 20px; border: none;
  background: var(--charcoal); color: #fff;
  font-family: var(--font-body); font-size: 15px; font-weight: 600;
  cursor: pointer; box-shadow: var(--shadow-cta);
  transition: transform 150ms, box-shadow 150ms; margin-bottom: 12px;
}
.ob-cta:active { transform: scale(0.97); }
.ob-cta-ghost {
  background: none; border: none; color: var(--muted);
  font-size: 14px; cursor: pointer; padding: 12px 20px;
  font-family: var(--font-body); transition: color 150ms;
}

/* ── Buttons ── */
.btn {
  display: block; width: 100%; padding: 16px 24px;
  border-radius: 16px; border: none;
  font-family: var(--font-body); font-size: 16px; font-weight: 600;
  cursor: pointer; transition: all 0.2s cubic-bezier(0.25,1,0.5,1);
  min-height: 52px;
}
.btn:active { transform: scale(0.97); opacity: 0.9; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--border); color: var(--text-secondary); }
.btn-ghost { background: none; color: var(--muted); border: 1px solid var(--border); }

/* ── HOME SCREEN — Premium 3-Zone Layout ── */
#screen-home {
  overflow: hidden !important;
  height: 100svh !important; max-height: 100svh !important;
  background: var(--bg) !important;
}
#screen-home.premium-home-wrapper {
  overflow: hidden !important;
}
.premium-home-wrapper {
  display: flex !important; flex-direction: column !important;
  justify-content: space-between !important; align-items: center !important;
  height: 100svh !important; max-height: 100svh !important; width: 100% !important;
  padding: 52px 32px calc(20px + 64px + 16px) !important;
  background: var(--bg) !important;
  box-sizing: border-box !important; overflow: hidden !important;
  position: relative !important;
}
.premium-masthead {
  display: flex !important; flex-direction: column !important;
  align-items: center !important; width: 100% !important; flex-shrink: 0 !important;
}
.premium-masthead .brand-title {
  font-family: 'Cormorant Garamond', 'Didot', serif !important;
  font-size: 3.0rem !important; font-style: italic !important;
  font-weight: 300 !important; letter-spacing: -0.01em !important;
  color: var(--charcoal) !important; line-height: 1.1 !important;
  font-feature-settings: "liga" 1, "dlig" 1 !important;
  margin-bottom: 4px !important;
}
.premium-totem-container {
  width: 100% !important; height: 44svh !important; max-height: 44svh !important;
  display: flex !important; align-items: center !important; justify-content: center !important;
  position: relative !important; background: transparent !important;
  flex-shrink: 0 !important; overflow: hidden !important;
}
.premium-totem-container svg {
  height: 100% !important; width: auto !important;
  max-height: 42svh !important; max-width: 100% !important;
  display: block !important; margin: 0 auto !important;
  background: transparent !important;
  filter: drop-shadow(0 24px 50px rgba(42,36,33,0.05))
          drop-shadow(0 6px 16px rgba(184,169,154,0.18)) !important;
  animation: silhBreathe 4s ease-in-out infinite !important;
  transform-origin: center 55% !important;
}
.premium-totem-container svg path {
  transition: all 600ms cubic-bezier(0.16,1,0.3,1) !important;
}
.premium-totem-container div {
  background: transparent !important;
}
.premium-metrics-strip {
  width: 100% !important; text-align: center !important;
  margin: 12px 0 !important; flex-shrink: 0 !important;
}
.premium-metrics-grid {
  display: flex !important; justify-content: center !important;
  align-items: center !important; gap: 16px !important;
  font-family: 'Cormorant Garamond', serif !important;
  font-size: 1.1rem !important; font-style: italic !important;
  color: var(--charcoal) !important;
}
.premium-metrics-grid .metric-item {
  display: flex !important; align-items: center !important; gap: 6px !important;
}
.premium-metrics-grid .metric-item svg {
  width: 18px !important; height: 18px !important;
  fill: none !important; stroke: var(--charcoal) !important;
  stroke-width: 1.5 !important; stroke-linecap: round !important;
  stroke-linejoin: round !important; flex-shrink: 0 !important;
  max-height: none !important; filter: none !important;
  display: inline-block !important;
}
.premium-metrics-grid span {
  font-family: var(--font-body) !important;
  font-size: 0.85rem !important; font-weight: 700 !important;
  font-style: normal !important; color: var(--charcoal) !important;
  font-variant-numeric: tabular-nums lining-nums !important;
  margin-left: 2px !important;
}
.premium-resume {
  width: 100%; display: flex; align-items: center;
  justify-content: space-between; gap: 10px; flex-shrink: 0;
}
.premium-resume-info { flex: 1; min-width: 0; }
.premium-resume-label {
  font-size: 0.58rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 2px;
}
.premium-resume-name {
  font-size: 13px; font-weight: 600; color: var(--charcoal);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.premium-resume-btns { display: flex; gap: 6px; flex-shrink: 0; }
.premium-resume-btns button {
  padding: 8px 14px; border-radius: 12px; font-size: 11px;
  font-weight: 600; border: none; cursor: pointer;
  font-family: var(--font-body); min-height: 36px;
  transition: opacity 200ms, transform 150ms;
}
.premium-resume-btns button:active { opacity: 0.7; transform: scale(0.96); }
.premium-resume-continue { background: var(--charcoal); color: #fff; }
.premium-resume-discard  { background: rgba(42,36,33,0.07); color: var(--text-secondary); }
.premium-action-pill {
  background: var(--charcoal) !important; color: #FFFFFF !important;
  border: none !important; border-radius: 32px !important;
  padding: 20px 0 !important; width: 100% !important; max-width: 320px !important;
  text-align: center !important; font-weight: 700 !important;
  letter-spacing: 0.25em !important; font-size: 0.78rem !important;
  text-transform: uppercase !important; font-family: var(--font-body) !important;
  box-shadow: var(--shadow-cta) !important;
  cursor: pointer !important; flex-shrink: 0 !important;
  display: block !important;
  transition: transform 400ms cubic-bezier(0.16,1,0.3,1),
              box-shadow 400ms cubic-bezier(0.16,1,0.3,1) !important;
}
.premium-action-pill:active {
  transform: scale(0.96) !important;
  box-shadow: 0 4px 16px rgba(42,36,33,0.12) !important;
}

/* Kill-list: hide all legacy home containers */
#screen-home .stats-row, #screen-home .next-card, #screen-home .heatmap-section,
#screen-home .home-header, #screen-home .gauge-section, #screen-home .stat-chips,
#screen-home .hero-card, #screen-home .deload-banner, #screen-home .metric-card,
#screen-home .dashboard-card, #screen-home .resume-strip,
#screen-home .home-cta-wrap, #screen-home .editorial-home,
#screen-home .home-root { display: none !important; }

/* ── Muscle silhouette — breathing animation ── */
@keyframes silhBreathe {
  0%, 100% { transform: scaleY(1.000) scaleX(1.000); }
  50%       { transform: scaleY(1.006) scaleX(0.999); }
}
.totem-breathe {
  animation: silhBreathe 4s ease-in-out infinite;
  transform-origin: center 55%;
}
.muscle-group { cursor: pointer; transition: filter 350ms cubic-bezier(0.16,1,0.3,1); }
.muscle-group:active { filter: brightness(1.18); }
@keyframes musclePulse { 0%,100%{opacity:1} 50%{opacity:0.52} }
.muscle-pulse { animation: musclePulse 2.2s ease-in-out infinite; }

/* ── Pearl ripple celebration ── */
@keyframes pearlRippleA {
  0%   { r: 18; opacity: 0.58; stroke-width: 2; }
  100% { r: 155; opacity: 0; stroke-width: 0.5; }
}
@keyframes pearlRippleB {
  0%   { r: 18; opacity: 0.42; stroke-width: 1.5; }
  100% { r: 125; opacity: 0; stroke-width: 0.5; }
}
@keyframes pearlRippleC {
  0%   { r: 18; opacity: 0.28; stroke-width: 1; }
  100% { r: 95; opacity: 0; stroke-width: 0.5; }
}
.ripple-a { animation: pearlRippleA 2.8s ease-out infinite; }
.ripple-b { animation: pearlRippleB 2.8s ease-out 0.72s infinite; }
.ripple-c { animation: pearlRippleC 2.8s ease-out 1.44s infinite; }

/* ── Page header ── */
.page-header { padding: 52px 24px 16px; }
.page-header h1 { font-size: 28px; font-weight: 700; }
.section-gap { height: 16px; }
.section-label {
  font-size: 10px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 1.5px; margin-bottom: 12px;
}

/* ── Next session card ── */
.next-card {
  margin: 0 24px 20px; background: var(--charcoal);
  border-radius: 20px; padding: 20px; cursor: pointer;
  position: relative; overflow: hidden;
}
.next-card::before {
  content: ''; position: absolute; top: -20px; right: -20px;
  width: 80px; height: 80px;
  background: var(--accent); border-radius: 50%; opacity: 0.15;
}
.next-card-label {
  font-size: 10px; color: rgba(255,255,255,0.5);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
}
.next-card-name {
  font-family: var(--font-hero); font-size: 26px; font-weight: 600;
  color: #fff; font-style: italic;
}
.next-card-meta { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 6px; }
.next-card-cta {
  position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
  background: var(--accent); border-radius: 12px; padding: 10px 16px;
  color: #fff; font-size: 13px; font-weight: 600;
}

/* ── Workout header ── */
#workout-header {
  background: rgba(250,247,242,0.72);
  backdrop-filter: blur(12px) saturate(1.3);
  -webkit-backdrop-filter: blur(12px) saturate(1.3);
  border-bottom: 1px solid rgba(42,36,33,0.06);
  color: var(--charcoal);
  position: sticky; top: 0; z-index: 50;
  padding: 32px 20px 10px;
}
.wh-session {
  font-family: var(--font-hero) !important; font-style: italic !important;
  font-size: 1.5rem !important; text-align: center !important;
  color: var(--charcoal) !important; flex: 1; margin-bottom: 0 !important;
}
.wh-top { display: flex; align-items: center; justify-content: space-between; }
.wh-duration {
  font-size: 28px; font-weight: 700; color: var(--charcoal); line-height: 1;
  font-variant-numeric: tabular-nums lining-nums;
}
.wh-progress { display: flex; gap: 4px; margin-top: 12px; }
.wh-seg {
  flex: 1; height: 3px; background: rgba(42,36,33,0.12);
  border-radius: 2px; transition: background 300ms;
}
.wh-seg.done { background: var(--accent); }
.wh-seg.active { background: rgba(240,78,35,0.5); }
.wh-pct-badge {
  width: 54px; height: 54px; border-radius: 50%;
  background: rgba(42,36,33,0.05); border: 1.5px solid rgba(42,36,33,0.12);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: all 450ms ease; flex-shrink: 0;
}
.wh-pct-badge.complete {
  background: var(--accent); border-color: var(--accent);
  box-shadow: 0 0 16px rgba(240,78,35,0.45);
}
.wh-pct-num {
  font-size: 15px; font-weight: 700; color: var(--charcoal);
  line-height: 1; letter-spacing: -0.5px;
  font-variant-numeric: tabular-nums;
}
.wh-pct-unit {
  font-size: 9px; color: rgba(42,36,33,0.45);
  letter-spacing: 0.08em; margin-top: 2px; text-transform: uppercase;
}
.wh-pct-badge.complete .wh-pct-num,
.wh-pct-badge.complete .wh-pct-unit { color: #fff !important; }

/* Travel toggle */
.travel-toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  margin: 12px 0 0; padding-top: 10px;
  border-top: 1px solid rgba(42,36,33,0.08);
}
.travel-toggle-lbl { font-size: 12px; color: rgba(42,36,33,0.5); }
.toggle-switch { position: relative; width: 40px; height: 22px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0; background: rgba(42,36,33,0.2);
  border-radius: 11px; cursor: pointer; transition: background 200ms;
}
.toggle-slider::before {
  content: ''; position: absolute; width: 16px; height: 16px;
  left: 3px; top: 3px; background: #fff;
  border-radius: 8px; transition: transform 200ms;
}
.toggle-switch input:checked + .toggle-slider { background: var(--accent); }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }
.travel-toggle-row.dismissing {
  overflow: hidden;
  transition: opacity 200ms ease, max-height 250ms ease,
              margin-top 250ms ease, padding-top 250ms ease;
  opacity: 0 !important; max-height: 0 !important;
  margin-top: 0 !important; padding-top: 0 !important;
}
#workout-header.travel-locked { padding-bottom: 8px !important; }

/* ── Rest timer HUD — non-blocking persistent ticker ── */
#rest-banner {
  position: fixed;
  bottom: calc(var(--nav-h) + 16px);
  left: 50%; transform: translateX(-50%) translateY(20px);
  width: calc(100% - 32px); max-width: 400px;
  z-index: 150;
  /* Luxury glassmorphism */
  background: rgba(250, 247, 242, 0.82);
  backdrop-filter: blur(12px) saturate(1.5);
  -webkit-backdrop-filter: blur(12px) saturate(1.5);
  border: 1px solid rgba(240, 78, 35, 0.18);
  border-radius: 22px;
  box-shadow:
    0 2px 8px  rgba(42,36,33,0.055),
    0 8px 28px rgba(42,36,33,0.045),
    0 0 0 1px rgba(255,255,255,0.55) inset;
  padding: 12px 16px 12px 14px;
  display: none; align-items: center; gap: 12px;
  opacity: 0;
  transition: transform 380ms cubic-bezier(0.34,1.56,0.64,1),
              opacity 260ms cubic-bezier(0.16,1,0.3,1);
  pointer-events: all;
}
#rest-banner.visible {
  display: flex;
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}
/* Accent pulse strip along top edge */
#rest-banner::before {
  content: ''; position: absolute; top: 0; left: 24px; right: 24px;
  height: 1.5px; background: var(--accent); border-radius: 0 0 2px 2px; opacity: 0.55;
}
/* SVG ring container */
#rest-hud-ring {
  position: relative; width: 44px; height: 44px; flex-shrink: 0;
}
#rest-hud-ring svg {
  width: 44px; height: 44px; transform: rotate(-90deg); display: block;
}
#rest-hud-track {
  fill: none; stroke: oklch(22.8% 0.018 42 / 0.10); stroke-width: 2.5; stroke-linecap: round;
}
#rest-hud-fill {
  fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round;
  transition: stroke-dashoffset 200ms linear;
}
#rest-hud-digit-wrap {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
}
#rest-hud-digit {
  font-family: var(--font-body); font-size: 9px; font-weight: 700;
  color: var(--accent); line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.3px;
}
/* Label: RESTING · 01:45 */
.rest-hud-label-wrap { flex: 1; overflow: hidden; }
.rest-hud-word {
  font-family: var(--font-body); font-size: 8.5px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--muted); opacity: 0.55; margin-bottom: 3px;
}
#rest-countdown {
  font-family: var(--font-hero); font-size: 28px; font-weight: 300;
  font-style: italic; color: var(--charcoal); line-height: 1;
  font-variant-numeric: tabular-nums lining-nums;
  letter-spacing: -0.02em;
}
@keyframes restPulse { 0%,100%{opacity:1} 50%{opacity:0.65} }
.rest-info { flex: 1; overflow: hidden; }
.rest-next {
  font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rest-after {
  font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rest-skip {
  background: rgba(42,36,33,0.06); border: 1px solid rgba(42,36,33,0.10);
  border-radius: 12px; padding: 8px 16px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: lowercase;
  color: var(--text-secondary); cursor: pointer; flex-shrink: 0;
  font-family: var(--font-body);
  transition: background 150ms, border-color 150ms;
}
.rest-skip:active { background: rgba(42,36,33,0.12); }
.rest-plus {
  background: rgba(240,78,35,0.10); border: 1px solid rgba(240,78,35,0.20);
  border-radius: 10px; padding: 6px 10px; font-size: 11px; font-weight: 700;
  color: var(--accent); cursor: pointer; flex-shrink: 0;
  transition: background 150ms; letter-spacing: 0.3px;
  font-family: var(--font-body);
}
.rest-plus:active { background: rgba(240,78,35,0.22); }

/* ── Ambient rest overlay — DISABLED: replaced by non-blocking HUD ── */
#rest-overlay {
  display: none !important;
  pointer-events: none !important;
  opacity: 0 !important;
  visibility: hidden !important;
}
#rest-overlay.visible { display: none !important; }
#rest-ring-wrap { position: relative; width: 192px; height: 192px; }
#rest-ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
#rest-ring-track { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 3; }
#rest-ring-fill {
  fill: none; stroke: rgba(240,78,35,0.72);
  stroke-width: 3; stroke-linecap: round;
  transition: stroke-dashoffset 240ms linear;
}
#rest-overlay-time {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
}
#rest-overlay-digits {
  font-family: var(--font-hero); font-size: 58px; font-weight: 700;
  color: #fff; line-height: 1; letter-spacing: -2px;
  font-variant-numeric: tabular-nums;
}
#rest-overlay-label {
  font-size: 0.62rem; text-transform: uppercase;
  letter-spacing: 0.22em; color: rgba(255,255,255,0.38); margin-top: 4px;
}
#rest-overlay-next {
  font-size: 13px; color: rgba(255,255,255,0.72);
  text-align: center; max-width: 260px; line-height: 1.45; padding: 0 24px;
}
#rest-overlay-skip {
  background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.14);
  border-radius: 24px; padding: 12px 32px; font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,0.5); cursor: pointer; font-family: var(--font-body);
  transition: background 150ms; margin-top: 4px;
}
#rest-overlay-skip:active { background: rgba(255,255,255,0.18); }
#rest-overlay-add {
  background: rgba(240,78,35,0.18); border: 1px solid rgba(240,78,35,0.28);
  border-radius: 24px; padding: 10px 28px; font-size: 12px; font-weight: 700;
  color: var(--accent); cursor: pointer; font-family: var(--font-body);
  letter-spacing: 0.04em; transition: background 150ms;
}
#rest-overlay-add:active { background: rgba(240,78,35,0.32); }

/* ── Active workout pill ── */
#workout-pill {
  position: fixed; bottom: calc(var(--nav-h) + 12px);
  left: 16px; right: 16px; z-index: 140;
  background: var(--charcoal); border-radius: 20px;
  box-shadow: var(--shadow-deep);
  padding: 14px 16px 14px 20px;
  display: none; align-items: center; gap: 14px;
  transform: translateY(20px); opacity: 0;
  transition: transform 350ms cubic-bezier(0.34,1.56,0.64,1), opacity 250ms ease;
  cursor: pointer;
}
#workout-pill.visible { display: flex; transform: translateY(0); opacity: 1; }
#workout-pill::before {
  content: ''; position: absolute; top: 0; left: 20px; right: 20px;
  height: 2px; background: var(--accent); border-radius: 0 0 2px 2px; opacity: 0.7;
}
.pill-dot {
  width: 8px; height: 8px; border-radius: 4px;
  background: var(--accent); flex-shrink: 0;
  animation: pillPulse 1.5s ease-in-out infinite;
}
@keyframes pillPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.45;transform:scale(0.7)} }
.pill-session {
  font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9);
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pill-dur {
  font-family: var(--font-hero); font-size: 22px; font-weight: 700;
  color: var(--accent); min-width: 58px; line-height: 1;
  flex-shrink: 0; font-variant-numeric: tabular-nums;
}
.pill-resume {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px; padding: 7px 14px; font-size: 12px; font-weight: 600;
  color: rgba(255,255,255,0.6); flex-shrink: 0;
}

/* ── Exercise cards ── */
.exercise-list { padding: 12px 16px 0; }
.ex-card {
  background: var(--card); border-radius: 16px;
  margin-bottom: 10px; overflow: hidden;
  box-shadow: 0 2px 12px rgba(42,36,33,0.06);
  border: none;
  transition: opacity 350ms cubic-bezier(0.16,1,0.3,1),
              transform 350ms cubic-bezier(0.16,1,0.3,1),
              box-shadow 350ms cubic-bezier(0.16,1,0.3,1);
}
.ex-card.expanded {
  box-shadow: 0 4px 20px rgba(42,36,33,0.10), 0 -3px 0 0 var(--accent) inset;
}
.ex-card.completed {
  box-shadow: -3px 0 0 0 var(--green), 0 2px 12px rgba(42,36,33,0.06);
}
.ex-card.dimmed { opacity: 0.5; transform: scale(0.98); }
.ex-card-header {
  display: flex; align-items: center; padding: 14px 16px;
  cursor: pointer; min-height: 60px; gap: 12px;
}
.ex-card-header-left { flex: 1; }
.ex-name { font-size: 15px; font-weight: 600; color: var(--text); transition: color 200ms; }
.ex-card.completed .ex-name { text-decoration: line-through; color: var(--muted); }
.ex-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
.muscle-badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  letter-spacing: 0.4px; text-transform: uppercase;
  border-radius: 6px; padding: 2px 7px; margin-bottom: 4px;
}
.ex-card-actions { display: flex; align-items: center; gap: 8px; }
.ex-cue-btn {
  width: 28px; height: 28px; border-radius: 14px;
  border: 1px solid var(--border); background: none;
  color: var(--muted); font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.ex-graph-btn {
  width: 28px; height: 28px; border-radius: 14px;
  border: 1px solid var(--border); background: none;
  color: var(--muted); font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ex-chevron {
  width: 20px; height: 20px; color: var(--muted);
  transition: transform 300ms ease-out; flex-shrink: 0;
  stroke-width: 1.5;
}
.ex-card.expanded .ex-chevron { transform: rotate(180deg); }
.ex-card.completed .ex-chevron { color: var(--green); }
.ex-check { color: var(--green); }
.ex-last-perf { font-size: 11px; color: var(--muted); margin-top: 2px; font-style: italic; }

/* Card body */
.ex-body { max-height: 0; overflow: hidden; transition: max-height 300ms ease-out; }
.ex-card.expanded .ex-body { max-height: 900px; }
.ex-body-inner { padding: 0 16px 16px; }
.warmup-hint { font-style: italic; font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.ex-notes {
  font-style: italic; font-size: 12px; color: var(--muted);
  margin-bottom: 10px; outline: none; width: 100%;
  background: none; border: none; font-family: var(--font-body); cursor: text;
}
.ex-notes:focus { color: var(--text); }

/* ── Inline note toggle button ── */
.ex-note-btn {
  width: 28px; height: 28px; border-radius: 14px;
  border: 1px solid var(--border); background: none;
  color: var(--muted); cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: color 150ms, border-color 150ms, background 150ms;
}
.ex-note-btn:active { background: rgba(42,36,33,0.06); }
.ex-note-btn.has-note { color: var(--accent); border-color: rgba(240,78,35,0.35); }

/* ── Inline note panel ── */
.ex-note-panel {
  max-height: 0; overflow: hidden;
  transition: max-height 280ms cubic-bezier(0.16,1,0.3,1);
  margin-top: 0;
}
.ex-note-panel.open { max-height: 120px; }
.ex-note-area {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--border); border-radius: 12px;
  background: rgba(250,247,242,0.85);
  font-family: var(--font-body); font-size: 12.5px;
  color: var(--text); line-height: 1.55;
  resize: none; outline: none;
  margin-top: 10px; margin-bottom: 6px;
  font-style: italic;
  transition: border-color 150ms;
  min-height: 60px;
}
.ex-note-area:focus { border-color: rgba(240,78,35,0.45); font-style: normal; }
.ex-note-area::placeholder { color: var(--muted); opacity: 0.6; font-style: italic; }

/* Set rows */
.set-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; position: relative; }
.set-num { font-size: 12px; color: var(--muted); width: 22px; flex-shrink: 0;
  font-variant-numeric: tabular-nums; }
.set-input {
  flex: 1; height: 44px; border: 1px solid var(--border);
  border-radius: 10px; text-align: center;
  font-size: 16px; font-weight: 600; font-family: var(--font-body);
  background: var(--bg); color: var(--text); outline: none;
  transition: all 0.2s cubic-bezier(0.25,1,0.5,1);
  -webkit-appearance: none;
  font-variant-numeric: tabular-nums;
}
.set-input:focus { border-color: var(--accent); }
.set-input.logged { background: #F0FDF4; border-color: var(--green); color: var(--green); }
.set-sep { font-size: 12px; color: var(--muted); }
.set-log-btn {
  width: 44px; height: 44px; border-radius: 12px; border: none;
  background: var(--accent); color: #fff; font-size: 18px;
  cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background 150ms;
}
.set-log-btn.logged { background: var(--green); }
.set-log-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
.set-hint { font-size: 11px; color: var(--muted); margin-top: -4px; margin-bottom: 6px; padding-left: 30px; font-style: italic; }
.rest-time-row { display: flex; align-items: center; gap: 6px; font-style: normal; padding-left: 0; }
.rest-time-display {
  font-size: 12px; font-weight: 600; color: var(--text); cursor: pointer;
  border-bottom: 1px dashed var(--border); padding-bottom: 1px; transition: color 150ms;
}
.rest-time-display:hover { color: var(--accent); border-color: var(--accent); }
.rest-time-input {
  font-size: 12px; font-weight: 600; width: 52px;
  border: none; border-bottom: 1.5px solid var(--accent);
  background: none; color: var(--text); outline: none;
  text-align: center; font-family: var(--font-body); padding: 0 2px 1px;
}
.technique-badge {
  display: inline-block; background: var(--accent); color: #fff;
  font-size: 10px; font-weight: 600; border-radius: 8px;
  padding: 2px 8px; margin-left: 8px;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.set-ripple {
  position: absolute; inset: 0; border-radius: 10px;
  background: rgba(34,197,94,0.2); opacity: 0; pointer-events: none;
  animation: ripple 400ms ease-out forwards;
}
@keyframes ripple { 0%{opacity:1} 100%{opacity:0;transform:scale(1.05)} }
.set-trend {
  padding-left: 30px; margin-top: -2px; margin-bottom: 4px;
  font-size: 10.5px; font-variant-numeric: tabular-nums;
  display: flex; align-items: center; gap: 4px; color: var(--muted);
}
.trend-arrow-up   { color: #C4944A; font-size: 11px; }
.trend-arrow-down { color: #C4876E; font-size: 11px; }

/* Plate calculator */
.plate-popover { background: var(--charcoal); color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 12px; margin-top: 6px; }
.plate-popover .plate-title { font-size: 10px; color: rgba(255,255,255,0.5); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.plate-row { display: flex; flex-wrap: wrap; gap: 4px; }
.plate-chip { background: rgba(255,255,255,0.1); border-radius: 6px; padding: 3px 8px; font-weight: 600; }
.plate-chip.orange { background: rgba(240,78,35,0.4); }

/* Overload nudge */
.overload-nudge {
  background: linear-gradient(135deg, #FFF7ED, #FFEDD5);
  border: 1px solid #FED7AA; border-radius: 12px;
  padding: 10px 14px; margin-bottom: 10px;
  font-size: 13px; color: #92400E;
  display: flex; align-items: center; gap: 8px;
}
.weight-suggestion { font-style: italic; font-size: 11px; color: var(--muted); margin-bottom: 6px; padding-left: 30px; }
.overload-next { background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #166534; margin-top: 8px; }

/* ── Bottom sheet ── */
.bottom-sheet-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 200; opacity: 0; transition: opacity 250ms; pointer-events: none;
}
.bottom-sheet-overlay.visible { opacity: 1; pointer-events: all; }
.bottom-sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card); border-radius: 24px 24px 0 0;
  z-index: 201; max-height: 80vh; overflow-y: auto;
  transform: translateY(100%); transition: transform 300ms ease-out;
  padding: 0 20px 40px;
}
.bottom-sheet.visible { transform: translateY(0); }
.bs-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 20px; }
.bs-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.bs-section-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.sub-card { background: var(--card); border-radius: 12px; margin-bottom: 8px; overflow: hidden; box-shadow: var(--shadow); }
.sub-card-header { padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
.sub-card-name { font-size: 14px; font-weight: 500; }
.sub-card-tag { font-size: 10px; color: var(--muted); background: var(--border); border-radius: 6px; padding: 2px 6px; }
.sub-card-body { padding: 0 14px; max-height: 0; overflow: hidden; transition: max-height 200ms ease-out; }
.sub-card.open .sub-card-body { max-height: 120px; padding-bottom: 12px; }
.sub-card-detail { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.sub-use-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 40px; }
.highlighted { background: #FFF7ED; border: 1px solid #FED7AA; }
.cue-section { margin-bottom: 14px; }
.cue-section h4 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.cue-section p { font-size: 14px; color: var(--text); line-height: 1.6; }
.cue-tip { background: #FFF7ED; border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 13px; color: #92400E; margin-top: 8px; }

/* ── Finish screen ── */
#finish-screen {
  position: fixed; inset: 0; background: var(--bg); z-index: 300;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 48px 24px 40px;
}
.finish-headline {
  font-family: var(--font-hero); font-style: italic;
  font-size: 48px; font-weight: 700; color: var(--charcoal);
  margin-bottom: 4px; text-align: center;
}
.finish-session-label { font-size: 13px; color: var(--muted); margin-bottom: 32px; text-align: center; }
.finish-plan-table { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px; }
.finish-row { border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
.finish-row-done-prior { background: rgba(42,36,33,0.03); border: 1px solid rgba(42,36,33,0.06); }
.finish-row-done-prior .fr-name { text-decoration: line-through; color: rgba(42,36,33,0.28); font-size: 14px; }
.finish-row-done-prior .fr-date { font-size: 11px; color: rgba(42,36,33,0.22); }
.finish-row-done-prior .fr-icon { opacity: 0.25; }
.finish-row-remaining { background: rgba(42,36,33,0.05); border: 1px solid rgba(42,36,33,0.08); }
.finish-row-remaining .fr-name { color: rgba(42,36,33,0.55); font-size: 14px; }
.finish-row-remaining .fr-date { font-size: 11px; color: rgba(42,36,33,0.35); }
.finish-row-now {
  background: linear-gradient(135deg, #FFFDF0 0%, #FFF9DC 50%, #FFFBEA 100%);
  border: 1px solid rgba(212,175,55,0.35);
  box-shadow: 0 4px 20px rgba(212,175,55,0.18), inset 0 1px 0 rgba(255,255,255,0.9);
}
.finish-row-now .fr-name { font-size: 15px; font-weight: 700; color: var(--charcoal); }
.finish-row-now .fr-date { font-size: 11px; color: rgba(140,100,20,0.8); font-weight: 500; }
.finish-row-now::after {
  content: ''; position: absolute; top: 0; left: -60%;
  width: 40%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,215,0,0.18), transparent);
  animation: goldSweep 2.8s ease-in-out infinite 0.5s;
}
@keyframes goldSweep { 0%{left:-60%} 100%{left:130%} }
.fr-icon { font-size: 16px; flex-shrink: 0; width: 24px; text-align: center; }
.fr-info { flex: 1; }
.fr-name { font-weight: 500; }
.fr-date { margin-top: 1px; }
.finish-stats-row { display: flex; gap: 10px; width: 100%; max-width: 360px; margin-bottom: 28px; }
.finish-stat { flex: 1; background: var(--card); border-radius: 14px; padding: 14px 10px; text-align: center; box-shadow: var(--shadow); }
.finish-stat-val {
  font-size: 20px; font-weight: 700; color: var(--charcoal);
  font-variant-numeric: tabular-nums lining-nums;
}
.finish-stat-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

/* ── Milestone screen ── */
#milestone-screen {
  position: fixed; inset: 0; z-index: 350;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 24px;
  background: linear-gradient(135deg, #FAF7F2 0%, #FFF0E8 50%, #FAF7F2 100%);
}
.milestone-n {
  font-family: var(--font-hero); font-size: 140px; font-weight: 700;
  color: var(--accent); line-height: 1; opacity: 0.15; position: absolute;
}
.milestone-content { position: relative; text-align: center; }
.milestone-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
.milestone-title { font-family: var(--font-hero); font-size: 44px; font-weight: 700; color: var(--charcoal); margin-bottom: 16px; }
.milestone-quote { font-family: var(--font-hero); font-style: italic; font-size: 20px; color: var(--text-secondary); margin-bottom: 40px; line-height: 1.5; }

/* ── HISTORY SCREEN ── */
.history-tabs {
  display: flex; gap: 0; margin: 16px 24px;
  background: var(--border); border-radius: 12px; padding: 3px;
}
.hist-tab {
  flex: 1; padding: 8px; text-align: center;
  font-size: 13px; font-weight: 500; border-radius: 10px;
  cursor: pointer; transition: background 200ms, color 200ms;
  color: var(--muted); border: none; background: none;
}
.hist-tab.active { background: var(--card); color: var(--text); box-shadow: var(--shadow); }

/* ── Completion Gauge Bars (Progress tab) ── */
.completion-gauges { padding: 4px 20px 0; }
.completion-gauges-hdr {
  font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); padding: 20px 0 14px;
}
.gauge-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 0; border-bottom: 1px solid oklch(22.8% 0.018 42 / 0.04);
}
.gauge-row:last-child { border-bottom: none; }
.gauge-muscle {
  font-size: 12px; font-weight: 600; color: var(--charcoal);
  width: 84px; flex-shrink: 0; letter-spacing: -0.01em;
}
/* SVG arc dial — true tapered stroke-linecap:round needle */
.gauge-arc-wrap { flex: 1; height: 24px; display: flex; align-items: center; }
.gauge-arc-wrap svg { width: 100%; height: 24px; overflow: visible; display: block; }
.gauge-arc-track {
  fill: none;
  stroke: oklch(22.8% 0.018 42 / 0.09);
  stroke-width: 2.5;
  stroke-linecap: round;
}
.gauge-arc-fill {
  fill: none;
  stroke-width: 2.5;
  stroke-linecap: round;
  stroke: oklch(58.5% 0.210 32);
  filter: drop-shadow(0 0 3px oklch(58.5% 0.210 32 / 0.50));
  transition: stroke-dashoffset 750ms cubic-bezier(0.34,1.36,0.64,1);
}
.gauge-arc-fill.is-full {
  stroke: oklch(72.3% 0.190 145);
  filter: drop-shadow(0 0 5px oklch(72.3% 0.190 145 / 0.60));
}
.gauge-pct-label {
  font-size: 10px; font-weight: 700;
  color: oklch(22.8% 0.018 42 / 0.38);
  width: 32px; text-align: right; flex-shrink: 0;
  font-variant-numeric: tabular-nums lining-nums;
}

/* ── 5-Week Calendar (Workouts tab) ── */
.cal-section { padding: 0 16px 48px; margin-top: 8px; }
.cal-section-hdr {
  font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 16px;
}
.cal-dow-header { display: flex; gap: 5px; padding: 0 0 8px 31px; }
.cal-dow-cell {
  flex: 1; text-align: center; font-size: 9px;
  color: rgba(42,36,33,0.28); letter-spacing: 0.06em; text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
.cal-grid { display: flex; flex-direction: column; gap: 5px; }
.cal-week-row { display: flex; align-items: center; gap: 5px; }
.cal-week-lbl {
  font-size: 7.5px; color: rgba(42,36,33,0.26); width: 26px; flex-shrink: 0;
  letter-spacing: 0.04em; text-transform: uppercase; text-align: right;
}
.cal-days-row { display: flex; gap: 5px; flex: 1; min-width: 0; }
.cal-day-cell {
  flex: 1; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; position: relative; cursor: default;
  transition: transform 150ms ease; min-width: 0;
}
.cal-day-blank  { background: transparent; }
.cal-day-open   { background: rgba(42,36,33,0.045); }
.cal-day-done   {
  background: var(--charcoal);
  box-shadow: 0 4px 16px rgba(42,36,33,0.22); cursor: pointer;
}
.cal-day-done:active { transform: scale(0.86); }
.cal-day-num {
  font-size: clamp(9px, 2.4vw, 13px); font-weight: 600;
  font-variant-numeric: tabular-nums; line-height: 1;
}
.cal-day-blank .cal-day-num  { color: rgba(42,36,33,0.13); }
.cal-day-open .cal-day-num   { color: rgba(42,36,33,0.24); }
.cal-day-done .cal-day-num   { color: rgba(255,255,255,0.94); }

/* Calendar day popup */
#cal-popup {
  position: fixed; inset: 0;
  background: rgba(10,10,20,0.52);
  backdrop-filter: blur(22px) saturate(1.5);
  -webkit-backdrop-filter: blur(22px) saturate(1.5);
  z-index: 650; display: none; align-items: center; justify-content: center;
  padding: 32px 24px; opacity: 0; transition: opacity 280ms ease;
}
#cal-popup.visible { opacity: 1; }
#cal-popup-panel {
  width: 100%; max-width: 340px;
  background: linear-gradient(145deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.16) 100%);
  border: 1px solid rgba(255,255,255,0.58);
  border-radius: 28px;
  box-shadow: 0 40px 100px rgba(0,0,0,0.42),
              inset 0 1.5px 0 rgba(255,255,255,0.75),
              inset 0 -1px 0 rgba(255,255,255,0.12);
  padding: 28px 24px 32px;
  transform: translateY(24px) scale(0.95);
  transition: transform 380ms cubic-bezier(0.34,1.56,0.64,1);
  position: relative;
}
#cal-popup.visible #cal-popup-panel { transform: translateY(0) scale(1); }
.cal-popup-close {
  position: absolute; top: 16px; right: 16px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(42,36,33,0.10); border: 1px solid rgba(42,36,33,0.08);
  cursor: pointer; font-size: 13px; color: var(--charcoal);
  display: flex; align-items: center; justify-content: center;
}
.cal-popup-date {
  font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(42,36,33,0.42); margin-bottom: 6px;
}
.cal-popup-session {
  font-family: var(--font-hero); font-style: italic;
  font-size: 28px; font-weight: 600;
  color: var(--charcoal); line-height: 1.1; margin-bottom: 4px;
}
.cal-popup-prog {
  font-size: 10px; color: rgba(42,36,33,0.38);
  text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 20px;
}
.cal-popup-stats { display: flex; gap: 10px; }
.cal-popup-stat {
  flex: 1; background: rgba(255,255,255,0.42);
  border-radius: 12px; padding: 12px 10px;
  border: 1px solid rgba(255,255,255,0.62); text-align: center;
}
.cal-popup-stat-val { font-size: 16px; font-weight: 700; color: var(--charcoal); font-variant-numeric: tabular-nums; }
.cal-popup-stat-lbl {
  font-size: 9px; color: rgba(42,36,33,0.42);
  text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px;
}

/* ── Liquid glass progress graph modal ── */
#graph-backdrop {
  position: fixed; inset: 0;
  background: rgba(10,10,20,0.45);
  backdrop-filter: blur(28px) saturate(1.6);
  -webkit-backdrop-filter: blur(28px) saturate(1.6);
  z-index: 600; display: flex; align-items: center; justify-content: center;
  padding: 24px; opacity: 0; pointer-events: none;
  transition: opacity 300ms ease;
}
#graph-backdrop.visible { opacity: 1; pointer-events: all; }
#graph-panel {
  width: 100%; max-width: 370px;
  background: linear-gradient(145deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.13) 100%);
  border: 1px solid rgba(255,255,255,0.50);
  border-radius: 28px;
  box-shadow: 0 40px 100px rgba(0,0,0,0.45),
              0 8px 24px rgba(0,0,0,0.20),
              inset 0 1.5px 0 rgba(255,255,255,0.70),
              inset 0 -1px 0 rgba(255,255,255,0.12);
  padding: 28px 24px 32px;
  transform: translateY(24px) scale(0.96);
  transition: transform 380ms cubic-bezier(0.34,1.56,0.64,1);
  position: relative; overflow: hidden;
}
#graph-backdrop.visible #graph-panel { transform: translateY(0) scale(1); }
#graph-panel::before {
  content: ''; position: absolute; top: -60%; left: -40%;
  width: 180%; height: 180%;
  background: conic-gradient(from 180deg at 50% 50%,
    rgba(255,255,255,0.09) 0deg, transparent 60deg,
    rgba(255,255,255,0.05) 120deg, transparent 180deg,
    rgba(255,255,255,0.07) 240deg, transparent 300deg,
    rgba(255,255,255,0.09) 360deg);
  animation: glassShimmer 6s linear infinite; pointer-events: none;
}
@keyframes glassShimmer { to { transform: rotate(360deg); } }
.graph-close {
  position: absolute; top: 18px; right: 18px;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(42,36,33,0.10); border: 1px solid rgba(42,36,33,0.08);
  cursor: pointer; font-size: 14px; color: var(--charcoal);
  display: flex; align-items: center; justify-content: center;
}
.graph-ex-title {
  font-family: var(--font-hero); font-style: italic;
  font-size: 22px; font-weight: 600; color: var(--charcoal);
  margin-bottom: 2px; position: relative;
}
.graph-meta {
  font-size: 10px; color: rgba(42,36,33,0.45);
  text-transform: uppercase; letter-spacing: 1.2px;
  margin-bottom: 20px; position: relative;
}
.graph-no-data { font-size: 13px; color: rgba(42,36,33,0.45); font-style: italic; margin: 24px 0; text-align: center; position: relative; }
.graph-svg-wrap { position: relative; width: 100%; }
.graph-stat-row { display: flex; gap: 12px; margin-top: 20px; position: relative; }
.graph-stat {
  flex: 1; background: rgba(255,255,255,0.35);
  border-radius: 14px; padding: 12px;
  border: 1px solid rgba(255,255,255,0.5);
}
.graph-stat-val { font-size: 18px; font-weight: 700; color: var(--charcoal); font-variant-numeric: tabular-nums; }
.graph-stat-lbl { font-size: 9px; color: rgba(42,36,33,0.45); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }

/* ── Muscle glass overlay ── */
#muscle-graph-overlay {
  position: fixed; inset: 0;
  background: oklch(8% 0.012 260 / 0.54);
  backdrop-filter: blur(28px) saturate(1.8);
  -webkit-backdrop-filter: blur(28px) saturate(1.8);
  z-index: 700; display: none; align-items: center; justify-content: center;
  padding: 24px; opacity: 0; transition: opacity 300ms ease;
}
#muscle-graph-overlay.visible { opacity: 1; }
/* silhouette focus vignette — inactive muscles fade */
.muscle-group { transition: opacity 500ms cubic-bezier(0.16,1,0.3,1); }
.silhouette-focus-active .muscle-group { opacity: 0.5; }
.silhouette-focus-active .muscle-group.muscle-focused { opacity: 1 !important; }
/* recovery rings + ghost trace */
.mg-recovery-rings { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
.mg-ring-label { font-size: 9.5px; color: rgba(255,255,255,0.42); font-family: var(--font-mono); letter-spacing: 0.06em; margin-left: 4px; }
.mg-ghost-trace { opacity: 0.25; }
#muscle-graph-panel {
  width: 100%; max-width: 340px;
  background: linear-gradient(145deg, rgba(255,255,255,0.32) 0%, rgba(255,255,255,0.15) 100%);
  border: 1px solid rgba(255,255,255,0.55);
  border-radius: 28px;
  box-shadow: 0 40px 100px oklch(0% 0 0 / 0.44),
              inset 0 1.5px 0 rgba(255,255,255,0.75),
              inset 0 -1px 0 rgba(255,255,255,0.12);
  padding: 28px 24px 32px; position: relative;
  transform: scale(0.82); transform-origin: center center;
  transition: transform 400ms cubic-bezier(0.34,1.56,0.64,1);
}
#muscle-graph-overlay.visible #muscle-graph-panel { transform: scale(1); }
.mg-close {
  position: absolute; top: 18px; right: 18px;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(42,36,33,0.10); border: 1px solid rgba(42,36,33,0.08);
  cursor: pointer; font-size: 14px; color: var(--charcoal);
  display: flex; align-items: center; justify-content: center;
}
.mg-muscle-title {
  font-family: var(--font-hero); font-style: italic;
  font-size: 26px; font-weight: 700; color: var(--charcoal); margin-bottom: 2px;
}
.mg-meta {
  font-size: 10px; color: rgba(42,36,33,0.45);
  text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 18px;
}
.mg-stat-row { display: flex; gap: 10px; margin-top: 18px; }
.mg-stat {
  flex: 1; background: rgba(255,255,255,0.38);
  border-radius: 14px; padding: 12px;
  border: 1px solid rgba(255,255,255,0.55);
}
.mg-stat-val { font-size: 18px; font-weight: 700; color: var(--charcoal); font-variant-numeric: tabular-nums; }
.mg-stat-lbl { font-size: 9px; color: rgba(42,36,33,0.45); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }
.mg-insight {
  margin-top: 12px; padding: 10px 12px;
  background: rgba(240,78,35,0.07);
  border-radius: 10px; font-size: 11.5px;
  color: rgba(42,36,33,0.72); line-height: 1.5;
  border-left: 2px solid rgba(240,78,35,0.3);
  position: relative;
}
.mg-train-btn {
  display: inline-block; margin-top: 14px; padding: 9px 18px;
  background: var(--charcoal); color: #fff;
  border-radius: 16px; font-size: 12px; font-weight: 600;
  letter-spacing: 0.08em; cursor: pointer; border: none;
  font-family: var(--font-body);
  transition: transform 150ms, opacity 150ms;
}
.mg-train-btn:active { transform: scale(0.96); opacity: 0.9; }

/* ── Program picker ── */
.prog-picker-header { padding: 56px 24px 16px; }
.prog-picker-header h2 { font-size: 28px; font-weight: 700; }
.prog-picker-header p { font-size: 14px; color: var(--muted); margin-top: 4px; }
.day-selector { display: flex; gap: 8px; padding: 0 24px 20px; overflow-x: auto; }
.day-chip {
  flex-shrink: 0; padding: 8px 18px; border-radius: 20px;
  border: 1.5px solid var(--border); font-size: 14px; font-weight: 500;
  cursor: pointer; transition: all 150ms; background: var(--card); color: var(--text-secondary);
}
.day-chip.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
.prog-list { padding: 0 16px; }
.prog-card {
  background: var(--card); border-radius: 16px; margin-bottom: 10px;
  padding: 16px; box-shadow: var(--shadow); cursor: pointer;
  display: flex; align-items: center; gap: 14px;
  border: 2px solid transparent; transition: border-color 150ms;
}
.prog-card:active { border-color: var(--accent); }
.prog-card-days {
  width: 44px; height: 44px; border-radius: 12px; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; font-weight: 700; color: var(--accent); flex-shrink: 0;
}
.prog-card-info h3 { font-size: 15px; font-weight: 600; }
.prog-card-info p { font-size: 12px; color: var(--muted); margin-top: 3px; }

/* ── Session picker ── */
.session-list { padding: 0 16px; }
.session-card {
  background: var(--card); border-radius: 16px; margin-bottom: 10px;
  padding: 16px; box-shadow: var(--shadow); cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
}
.session-card h3 { font-size: 15px; font-weight: 600; }
.session-card p { font-size: 12px; color: var(--muted); margin-top: 3px; }
.sess-done-chip { font-size: 10px; color: var(--green); background: rgba(34,197,94,0.1); border-radius: 8px; padding: 2px 7px; font-weight: 600; }
.sess-next-badge { font-size: 10px; color: #fff; background: var(--charcoal); border-radius: 8px; padding: 2px 7px; font-weight: 600; letter-spacing: 0.2px; }
.session-card.next-session { background: var(--charcoal); box-shadow: 0 4px 20px rgba(0,0,0,0.18); }
.session-card.next-session h3 { color: #fff; }
.session-card.next-session p { color: rgba(255,255,255,0.5); }
.session-card.next-session .preview-btn { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: rgba(255,255,255,0.7); }
.session-card.next-session .start-arrow { color: var(--accent); }

/* ── Back button ── */
.back-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--muted); font-size: 15px; cursor: pointer; padding: 8px 0; margin-bottom: 8px; }

/* ── Settings ── */
.settings-section { margin: 16px; background: var(--card); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); }
.settings-section-title { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding: 14px 16px 8px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-top: 1px solid var(--border); min-height: 52px; }
.settings-row:first-of-type { border-top: none; }
.settings-row label { font-size: 14px; color: var(--text); }
.settings-row input[type=text], .settings-row input[type=url] { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; width: 160px; font-family: var(--font-body); outline: none; }
.settings-row input:focus { border-color: var(--accent); }
.settings-danger { color: #EF4444 !important; }

/* ── Empty state ── */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
.empty-title { font-family: var(--font-hero); font-size: 36px; font-weight: 700; color: var(--charcoal); margin-bottom: 12px; }
.empty-sub { font-size: 14px; color: var(--muted); margin-bottom: 32px; font-style: italic; }

/* ── Progress row ── */
.progress-table { margin: 0 16px; }
.prog-row { display: flex; align-items: center; gap: 10px; padding: 12px; background: var(--card); border-radius: 14px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow); min-height: 56px; }
.prog-row-muscle { font-size: 14px; font-weight: 500; flex: 1; }
.prog-row-sparkline { width: 60px; height: 24px; }
.prog-row-1rm { font-size: 13px; font-weight: 600; color: var(--text); text-align: right; min-width: 50px; font-variant-numeric: tabular-nums; }
.status-dot { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; }
.dot-green { background: var(--green); }
.dot-amber { background: #F59E0B; }
.dot-red { background: #EF4444; }

/* ── Shimmer ── */
@keyframes luxShimmer {
  0%   { background-position: -200% center; }
  100% { background-position:  200% center; }
}
.btn-shimmer {
  background: linear-gradient(90deg, var(--accent) 20%, #ff7a52 50%, var(--accent) 80%) !important;
  background-size: 200% auto !important;
  animation: luxShimmer 220ms ease-out forwards !important;
}

/* ── Confetti canvas ── */
#confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 299; }

/* ── Deload banner ── */
.deload-banner { margin: 0 24px 16px; background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 14px; padding: 12px 16px; font-size: 13px; color: #92400E; }

/* ── Stats / metrics ── */
.stats-row { display: flex; gap: 0; margin: 0 24px 20px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.stat-item { flex: 1; padding: 14px 10px; text-align: center; border-right: 1px solid var(--border); }
.stat-item:last-child { border-right: none; }
.stat-val { font-size: 22px; font-weight: 700; color: var(--charcoal); font-variant-numeric: tabular-nums lining-nums; }
.stat-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

/* Tabular lining for all numeric metrics globally */
.stat-val, .wh-duration, .rest-countdown, #rest-overlay-digits,
.pill-dur, .mg-stat-val, .graph-stat-val, .cal-popup-stat-val,
.gauge-pct-label, .finish-stat-val {
  font-variant-numeric: tabular-nums lining-nums;
}

/* Deceleration timing on all interactive surfaces */
.screen        { transition-timing-function: cubic-bezier(0.16,1,0.3,1) !important; }
.muscle-group  { transition: filter 350ms cubic-bezier(0.16,1,0.3,1) !important; }
.ob-pill       { transition-timing-function: cubic-bezier(0.16,1,0.3,1) !important; }

/* ── Install prompt suppressed — native Android Chrome ── */
.install-prompt, #install-prompt { display: none !important; }

     it on-screen. Silent failures are now impossible. -->
<script>
window.onerror = function(msg, url, line, col, error) {
  var splash = document.getElementById('splash');
  if (splash) splash.style.display = 'none';
  document.body.innerHTML =
    '<div style="padding:40px;font-family:monospace;background:#FAF7F2;color:oklch(45% 0.16 30);min-height:100vh;box-sizing:border-box">' +
    '<h2 style="font-family:Cormorant Garamond,serif;font-style:italic;font-weight:400;color:oklch(25% 0.01 40);margin:0 0 24px">[DCR Gym] Script Error</h2>' +
    '<p><b>Fault:</b> ' + msg + '</p>' +
    '<p><b>Location:</b> Line ' + line + ', Col ' + col + '</p>' +
    '<pre style="background:#fff;padding:16px;border-radius:6px;overflow-x:auto;border:1px solid #ddd;font-size:11px;white-space:pre-wrap">' + (error ? error.stack : '') + '</pre>' +
    '<button onclick="localStorage.clear();location.reload()" style="margin-top:20px;padding:12px 24px;background:oklch(25% 0.01 40);color:#fff;border:none;border-radius:30px;cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:lowercase;font-family:monospace">reset cache &amp; reload</button>' +
    '</div>';
  return false;
};
console.log('[DCRGym] Error guard active.');
</script>

// Helper: get programs by days per week
function getProgramsByDays(days) {
  return PROGRAMS.filter(p => p.daysPerWeek === days);
}

// Helper: get program by id
function getProgramById(id) {
  return PROGRAMS.find(p => p.id === id);
}

// Helper: get session by id
function getSessionById(programId, sessionId) {
  const prog = getProgramById(programId);
  if (!prog) return null;
  return prog.sessions.find(s => s.id === sessionId);
}

function parseRestSeconds(r) {
  if (!r) return 90;
  r = r.toLowerCase();
  if (r.includes('30') && r.includes('60')) return 30;
  if (r.includes('0') && r.includes('1 min')) return 0;
  const m = r.match(/(\d+)[^0-9]*(?:–|-)[^0-9]*(\d+)\s*min/);
  if (m) return parseInt(m[1]) * 60;
  const s = r.match(/(\d+)\s*sec/);
  if (s) return parseInt(s[1]);
  const mm = r.match(/(\d+)\s*min/);
  if (mm) return parseInt(mm[1]) * 60;
  return 90;
}

// ── Utility functions ────────────────────────────────────────────────────────
function normalizeEx(name) {
  return (name || '').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function resolveAlias(name) {
  const n = normalizeEx(name);
  return EX_ALIASES[n] || n;
}
function stripSuperset(name) {
  return (name || '').replace(/^Superset \d+:\s*/i, '').trim();
}
function exercisesMatch(a, b) {
  a = resolveAlias(stripSuperset(a));
  b = resolveAlias(stripSuperset(b));
  if (a === b) return true;
  if (a.includes(b) || b.includes(a)) return true;
  // strip parentheticals
  const strip = s => s.replace(/\s*\([^)]*\)/g,'').trim();
  if (strip(a) === strip(b)) return true;
  if (strip(a).includes(strip(b)) || strip(b).includes(strip(a))) return true;
  return false;
}
function getMuscle(name) {
  const n = normalizeEx(stripSuperset(name));
  for (const [k,v] of Object.entries(MUSCLE_MAP)) {
    if (normalizeEx(k) === n) return v;
  }
  return 'Other';
}
function isBarbell(name) {
  return BARBELL_EX.has(normalizeEx(stripSuperset(name)));
}
function epley1RM(w, r) {
  if (!r || r === 0) return w;
  return Math.round(w * (1 + r / 30));
}
function formatDuration(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function formatKg(kg) {
  return Number.isInteger(kg) ? `${kg}` : kg.toFixed(1);
}
function plateCalc(totalKg, barKg = 20) {
  const available = [25,20,15,10,5,2.5,1.25];
  let perSide = (totalKg - barKg) / 2;
  if (perSide < 0) return null;
  const plates = [];
  for (const p of available) {
    while (perSide >= p - 0.001) {
      plates.push(p);
      perSide -= p;
    }
  }
  return plates;
}

// ── localStorage ─────────────────────────────────────────────────────────────
// Safe Storage Sandbox Proxy — survives WebKit/Safari sandbox DOMException traps
// Falls back to an in-memory store so the app keeps running even if storage is locked.
const LS = {
  get(k, def = null) {
    try {
      const v = localStorage.getItem(k);
      return v !== null ? JSON.parse(v) : def;
    } catch(e) {
      console.warn('[DCR Gym Shell] Storage read trapped, using memory fallback', e);
      return window.__dcr_sandbox_store?.[k] ?? def;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(k, JSON.stringify(v));
    } catch(e) {
      if (!window.__dcr_sandbox_store) window.__dcr_sandbox_store = {};
      window.__dcr_sandbox_store[k] = v;
      console.warn('[DCR Gym Shell] Storage write trapped, isolated to memory sandbox', e);
    }
  },
  remove(k) {
    try {
      localStorage.removeItem(k);
    } catch(e) {
      if (window.__dcr_sandbox_store) delete window.__dcr_sandbox_store[k];
    }
  },
};
