}
.premium-resume-btns button:active { opacity: 0.7; transform: scale(0.96); }
.premium-resume-continue { background: var(--charcoal); color: #fff; }
.premium-resume-discard  { background: rgba(42,36,33,0.07); color: var(--text-secondary); }
.premium-action-pill {
  background: var(--charcoal) !important; color: #FFFFFF !important;
  border: none !important; border-radius: 32px !important;
  padding: 14px 24px !important; width: 100% !important; max-width: 320px !important;
  box-sizing: border-box !important;
  text-align: center !important; font-weight: 700 !important;
  letter-spacing: 0.12em !important; font-size: 0.78rem !important;
  text-transform: uppercase !important; font-family: var(--font-body) !important;
  box-shadow: var(--shadow-cta) !important;
  cursor: pointer !important; flex-shrink: 0 !important;
  display: block !important;
  transition: transform 400ms cubic-bezier(0.16,1,0.3,1),
              box-shadow 400ms cubic-bezier(0.16,1,0.3,1) !important;
}
.premium-action-pill:active {
  transform: scale(0.96) !important;
  box-shadow: 0 4px 16px rgba(42,36,33,0.12) !important;
}

/* Kill-list: hide all legacy home containers */
#screen-home .stats-row, #screen-home .next-card, #screen-home .heatmap-section,
#screen-home .home-header, #screen-home .gauge-section, #screen-home .stat-chips,
#screen-home .hero-card, #screen-home .deload-banner, #screen-home .metric-card,
#screen-home .dashboard-card, #screen-home .resume-strip,
#screen-home .home-cta-wrap, #screen-home .editorial-home,
#screen-home .home-root { display: none !important; }

/* ── Muscle silhouette — breathing animation ── */
@keyframes silhBreathe {
  0%, 100% { transform: scaleY(1.000) scaleX(1.000); }
  50%       { transform: scaleY(1.006) scaleX(0.999); }
}
.totem-breathe {
  animation: silhBreathe 4s ease-in-out infinite;
  transform-origin: center 55%;
}
.muscle-group { cursor: pointer; transition: filter 350ms cubic-bezier(0.16,1,0.3,1); }
.muscle-group:active { filter: brightness(1.18); }
@keyframes musclePulse { 0%,100%{opacity:1} 50%{opacity:0.58} }
.muscle-pulse { animation: musclePulse 2.8s ease-in-out infinite; }

/* Hairline region outlines — shapes stay identifiable at a glance */
.muscle-group path, .muscle-group ellipse, .muscle-group circle, .muscle-group rect {
  stroke: oklch(35% 0.02 45 / 0.10); stroke-width: 0.5;
}

/* Micro-legend beneath the figure */
.totem-legend {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  margin: 2px 0 0; font-size: 9px; letter-spacing: 0.13em;
  text-transform: uppercase; color: var(--muted);
}
.tl-dot { width: 7px; height: 7px; border-radius: 4px; display: inline-block; margin-right: 5px; vertical-align: 0; }
.tl-behind { background: oklch(48% 0.130 35 / 0.85); }
.tl-track  { background: oklch(70% 0.110 82 / 0.86); }
.tl-done   { background: oklch(56% 0.075 145); box-shadow: 0 0 6px oklch(56% 0.075 145 / 0.55); }

/* ── Pearl ripple celebration ── */
@keyframes pearlRippleA {
  0%   { r: 18; opacity: 0.58; stroke-width: 2; }
  100% { r: 155; opacity: 0; stroke-width: 0.5; }
}
@keyframes pearlRippleB {
  0%   { r: 18; opacity: 0.42; stroke-width: 1.5; }
  100% { r: 125; opacity: 0; stroke-width: 0.5; }
}
@keyframes pearlRippleC {
  0%   { r: 18; opacity: 0.28; stroke-width: 1; }
  100% { r: 95; opacity: 0; stroke-width: 0.5; }
}
.ripple-a { animation: pearlRippleA 2.8s ease-out infinite; }
.ripple-b { animation: pearlRippleB 2.8s ease-out 0.72s infinite; }
.ripple-c { animation: pearlRippleC 2.8s ease-out 1.44s infinite; }

/* ── Page header ── */
.page-header { padding: 52px 24px 16px; }
.page-header h1 { font-size: 28px; font-weight: 700; }
.section-gap { height: 16px; }
.section-label {
  font-size: 10px; color: var(--muted); text-transform: uppercase;
  letter-spacing: 1.5px; margin-bottom: 12px;
}

/* ── Next session card ── */
.next-card {
  margin: 0 24px 20px; background: var(--charcoal);
  border-radius: 20px; padding: 20px; cursor: pointer;
  position: relative; overflow: hidden;
}
.next-card::before {
  content: ''; position: absolute; top: -20px; right: -20px;
  width: 80px; height: 80px;
  background: var(--accent); border-radius: 50%; opacity: 0.15;
}
.next-card-label {
  font-size: 10px; color: rgba(255,255,255,0.5);
  text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px;
}
.next-card-name {
  font-family: var(--font-hero); font-size: 26px; font-weight: 600;
  color: #fff; font-style: italic;
}
.next-card-meta { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 6px; }
.next-card-cta {
  position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
  background: var(--accent); border-radius: 12px; padding: 10px 16px;
  color: #fff; font-size: 13px; font-weight: 600;
}

/* ── Workout header ── */
#workout-header {
  /* The cockpit — the high-focus biometric telemetry header. */
  background: var(--surface-glass-dark);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  color: #FAF7F2;
  position: sticky; top: 0; z-index: 50;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 14px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.18);
}
.wh-session {
  font-family: var(--font-hero) !important; font-style: italic !important;
  font-size: 1.5rem !important; text-align: center !important;
  color: rgba(250,247,242,0.85) !important; flex: 1; margin-bottom: 0 !important;
  letter-spacing: -0.01em;
}
.wh-top { display: flex; align-items: center; justify-content: space-between; }
.wh-duration {
  font-family: var(--font-mono);
  font-size: 36px; font-weight: 300; color: #FAF7F2; line-height: 1;
  font-variant-numeric: tabular-nums lining-nums;
  letter-spacing: -0.02em;
}
.wh-progress { display: flex; gap: 4px; margin-top: 12px; }
.wh-seg {
  flex: 1; height: 3.5px; background: rgba(250,247,242,0.16);
  border-radius: 2px; transition: background 300ms var(--ease);
}
.wh-seg.done { background: var(--accent-kinetic); }
.wh-seg.active { background: rgba(240,78,35,0.6); }
.wh-pct-badge {
  width: 52px; height: 52px; border-radius: 50%;
  background: rgba(250,247,242,0.06); border: 1.5px solid rgba(250,247,242,0.18);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: all 450ms var(--ease-spring); flex-shrink: 0;
}
.wh-pct-badge.complete {
  background: var(--accent-kinetic); border-color: var(--accent-kinetic);
  box-shadow: 0 0 18px rgba(240,78,35,0.55);
}
.wh-pct-num {
  font-family: var(--font-mono);
  font-size: 15px; font-weight: 600; color: #FAF7F2;
  line-height: 1; letter-spacing: -0.5px;
  font-variant-numeric: tabular-nums lining-nums;
}
.wh-pct-unit {
  font-size: 9px; color: rgba(250,247,242,0.55);
  letter-spacing: 0.08em; margin-top: 2px; text-transform: uppercase;
}
.wh-pct-badge.complete .wh-pct-num,
.wh-pct-badge.complete .wh-pct-unit { color: #fff !important; }

/* Travel toggle */
.travel-toggle-row {
  display: flex; align-items: center; justify-content: space-between;
  margin: 12px 0 0; padding-top: 10px;
  border-top: 1px solid rgba(250,247,242,0.08);
}
.travel-toggle-lbl { font-size: 12px; color: rgba(250,247,242,0.5); }
.toggle-switch { position: relative; width: 40px; height: 22px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0; background: rgba(42,36,33,0.2);
  border-radius: 11px; cursor: pointer; transition: background 200ms;
}
.toggle-slider::before {
  content: ''; position: absolute; width: 16px; height: 16px;
  left: 3px; top: 3px; background: #fff;
  border-radius: 8px; transition: transform 200ms;
}
.toggle-switch input:checked + .toggle-slider { background: var(--accent-kinetic); }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(18px); }
.travel-toggle-row.dismissing {
  overflow: hidden;
  transition: opacity 200ms ease, max-height 250ms ease,
              margin-top 250ms ease, padding-top 250ms ease;
  opacity: 0 !important; max-height: 0 !important;
  margin-top: 0 !important; padding-top: 0 !important;
}
#workout-header.travel-locked { padding-bottom: 8px !important; }

/* ── Rest Island — Dynamic-Island-style floating capsule, top-center ── */
#rest-island {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  left: 50%;
  transform: translateX(-50%) translateY(-80px) scale(0.92);
  z-index: 400;
  background: var(--surface-glass-dark);
  backdrop-filter: blur(24px) saturate(1.8);
  -webkit-backdrop-filter: blur(24px) saturate(1.8);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 28px;
  display: flex; align-items: center; gap: 10px;
  padding: 8px 18px 8px 12px;
  max-width: 184px;
  box-shadow: 0 12px 36px rgba(0, 0, 0, 0.32), 0 2px 6px rgba(0, 0, 0, 0.16);
  opacity: 0;
  pointer-events: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  user-select: none; -webkit-user-select: none;
  transition: transform 420ms var(--spring-snappy),
              opacity   260ms var(--spring-snappy),
              max-width 340ms var(--spring-snappy),
              background 340ms var(--spring-snappy);
}
#rest-island.visible {
  transform: translateX(-50%) translateY(0) scale(1);
  opacity: 1;
  pointer-events: auto;
}
#rest-island.expanded { max-width: min(92vw, 390px); }
#rest-island.go { background: #154D2B; border-color: rgba(74, 222, 128, 0.4); }
#rest-island:active { transform: translateX(-50%) translateY(0) scale(0.96); }
#rest-hud-ring { position: relative; width: 36px; height: 36px; flex-shrink: 0; }
#rest-hud-ring svg { width: 36px; height: 36px; transform: rotate(-90deg); display: block; }
#rest-hud-track {
  fill: none; stroke: rgba(250,247,242,0.16); stroke-width: 3; stroke-linecap: round;
}
#rest-hud-fill {
  fill: none; stroke: var(--accent-timer); stroke-width: 3; stroke-linecap: round;
  transition: stroke-dashoffset 200ms linear, stroke 340ms;
}
#rest-island.go #rest-hud-fill { stroke: #4ADE80; }
#rest-countdown {
  font-family: var(--font-mono); font-size: 20px; font-weight: 600;
  color: #FAF7F2; line-height: 1;
  font-variant-numeric: tabular-nums lining-nums;
  letter-spacing: -0.02em; flex-shrink: 0;
}
#rest-island.go #rest-countdown { color: #BBF7D0; }
#ri-detail {
  display: flex; align-items: center; gap: 8px;
  max-width: 0; opacity: 0; overflow: hidden;
  transition: max-width 340ms var(--spring-snappy),
              opacity   240ms var(--spring-snappy) 60ms;
  white-space: nowrap;
}
#rest-island.expanded #ri-detail,
#rest-island.go #ri-detail { max-width: 270px; opacity: 1; }
#ri-next {
  font-size: 11.5px; line-height: 1.35; color: rgba(250,247,242,0.85);
  white-space: normal; max-width: 158px;
  overflow: hidden; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical;
}
.ri-btn {
  border: none; border-radius: 14px; padding: 7px 12px;
  font-family: var(--font-body); font-size: 11px; font-weight: 700;
  cursor: pointer; flex-shrink: 0; letter-spacing: 0.02em;
  -webkit-tap-highlight-color: transparent;
  transition: transform 160ms var(--spring-snappy), background 160ms;
}
.ri-btn:active { transform: scale(0.92); }
.ri-add  { background: rgba(240,78,35,0.28);  color: #FFC0B0; }
.ri-skip { background: rgba(250,247,242,0.16); color: rgba(250,247,242,0.85); }
@keyframes islandGoPulse {
  0%,100% { box-shadow: 0 12px 36px rgba(0,0,0,0.32), 0 0 0 0 rgba(74,222,128,0.4); }
  50%     { box-shadow: 0 12px 36px rgba(0,0,0,0.32), 0 0 0 10px rgba(74,222,128,0); }
}
#rest-island.go { animation: islandGoPulse 1.6s var(--ease) infinite; }

/* ── Custom number pad — designed input surface for sweaty thumbs ── */
#numpad {
  position: fixed; left: 0; right: 0;
  bottom: 0; z-index: 500;
  background: rgba(250,247,242,0.96);
  backdrop-filter: blur(24px) saturate(1.6);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  border-radius: 28px 28px 0 0;
  box-shadow: 0 -2px 10px rgba(42,36,33,0.06), 0 -12px 48px rgba(42,36,33,0.15);
  padding: 0 16px calc(env(safe-area-inset-bottom, 0px) + 12px);
  transform: translateY(105%);
  transition: transform var(--dur-slow) var(--spring-snappy);
  touch-action: manipulation;
}
#numpad.open { transform: translateY(0); }
.np-grab { padding: 8px 0 4px; display: flex; justify-content: center; cursor: pointer; }
.np-grab-bar { width: 38px; height: 4px; border-radius: 2px; background: rgba(42,36,33,0.18); }
.np-chips { display: flex; gap: 8px; padding: 4px 2px 10px; }
.np-chip {
  flex: 1; padding: 11px 0; border-radius: 14px;
  border: 1px solid var(--border); background: var(--card);
  font-family: var(--font-mono); font-size: 14px; font-weight: 600;
  color: var(--text-secondary); cursor: pointer;
  font-variant-numeric: tabular-nums lining-nums;
  -webkit-tap-highlight-color: transparent;
  box-shadow: var(--shadow-sm);
  transition: transform var(--dur-instant) var(--ease), background var(--dur-fast);
}
.np-chip:active { transform: scale(0.93); background: var(--surface-sunken); }
.np-chip.np-up { color: var(--accent-kinetic); border-color: rgba(240,78,35,0.28); }
.np-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.np-key {
  height: 52px; border-radius: 14px; border: none;
  background: var(--card); box-shadow: var(--shadow-sm);
  font-family: var(--font-mono); font-size: 24px; font-weight: 400;
  color: var(--text-primary); cursor: pointer;
  font-variant-numeric: tabular-nums lining-nums;
  -webkit-tap-highlight-color: transparent;
  transition: transform 120ms var(--spring-snappy), background 120ms;
}
.np-key:active { transform: scale(0.93); background: var(--surface-sunken); }
.np-del { font-size: 18px; color: var(--text-secondary); }
.np-action {
  width: 100%; margin-top: 10px; padding: 16px;
  border: none; border-radius: 18px;
  background: var(--accent-kinetic); color: #fff;
  font-family: var(--font-body); font-size: 16px; font-weight: 600;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  box-shadow: var(--shadow-md);
  transition: transform var(--dur-fast) var(--spring-snappy), background var(--dur-fast);
}
.np-action:active { transform: scale(0.97); }
.np-action.np-log { background: var(--accent-success); }
body.numpad-open .exercise-list { padding-bottom: 330px; }
body.numpad-open #bottom-nav { transform: translateX(-50%) translateY(140%); }
#bottom-nav { transition: transform var(--dur-slow) var(--ease); }
.set-input.np-focus, .warmup-input.np-focus {
  border-color: var(--accent-kinetic) !important;
  box-shadow: 0 0 0 3px rgba(240,78,35,0.18);
}

/* ── Active workout pill ── */
#workout-pill {
  position: fixed; bottom: calc(var(--nav-h) + 12px);
  left: 16px; right: 16px; z-index: 140;
  background: var(--charcoal); border-radius: 20px;
  box-shadow: var(--shadow-deep);
  padding: 14px 16px 14px 20px;
  display: none; align-items: center; gap: 14px;
  transform: translateY(20px); opacity: 0;
  transition: transform var(--dur-slow) var(--ease), opacity var(--dur-med) var(--ease);
  cursor: pointer;
}
#workout-pill.visible { display: flex; transform: translateY(0); opacity: 1; }
#workout-pill::before {
  content: ''; position: absolute; top: 0; left: 20px; right: 20px;
  height: 2px; background: var(--accent); border-radius: 0 0 2px 2px; opacity: 0.7;
}
.pill-dot {
  width: 8px; height: 8px; border-radius: 4px;
  background: var(--accent); flex-shrink: 0;
  animation: pillPulse 1.5s ease-in-out infinite;
}
@keyframes pillPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.45;transform:scale(0.7)} }
.pill-session {
  font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.9);
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pill-dur {
  font-family: var(--font-hero); font-size: 22px; font-weight: 700;
  color: var(--accent); min-width: 58px; line-height: 1;
  flex-shrink: 0; font-variant-numeric: tabular-nums;
}
.pill-resume {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px; padding: 7px 14px; font-size: 12px; font-weight: 600;
  color: rgba(255,255,255,0.6); flex-shrink: 0;
}

/* ── Exercise cards ── */
.exercise-list { padding: 12px 16px 0; }
.ex-card {
  background: var(--surface-card); border-radius: 20px;
  margin-bottom: 12px; overflow: hidden;
  box-shadow: var(--shadow-sm);
  border: 1px solid var(--border-subtle);
  transition: opacity 350ms var(--spring-snappy),
              transform 350ms var(--spring-snappy),
              box-shadow 350ms var(--spring-snappy),
              border-color 300ms var(--ease);
}
.ex-card.expanded {
  box-shadow: var(--shadow-md);
  border-color: var(--border-strong);
}
.ex-card.completed {
  box-shadow: var(--shadow-sm);
  border-left: 4px solid var(--accent-success);
}
.ex-card.dimmed { opacity: 0.5; transform: scale(0.98); }
.ex-card-header {
  display: flex; align-items: center; padding: 16px 18px;
  cursor: pointer; min-height: 64px; gap: 12px;
}
.ex-card-header-left { flex: 1; }
.ex-name { font-size: 16px; font-weight: 600; color: var(--text-primary); transition: color 200ms; letter-spacing: -0.01em; }
.ex-card.completed .ex-name { text-decoration: line-through; color: var(--text-tertiary); }
.ex-meta { font-size: 12.5px; color: var(--text-secondary); margin-top: 4px; }
.muscle-badge {
  display: inline-block; font-size: 10px; font-weight: 700;
  letter-spacing: 0.4px; text-transform: uppercase;
  border-radius: 6px; padding: 2px 7px; margin-bottom: 4px;
}
.ex-card-actions { display: flex; align-items: center; gap: 8px; }
.ex-cue-btn {
  width: 32px; height: 32px; border-radius: 16px;
  border: 1px solid var(--border-subtle); background: var(--surface-card);
  color: var(--text-secondary); font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 150ms, transform 120ms;
}
.ex-cue-btn:active { transform: scale(0.92); background: var(--surface-sunken); }
.ex-graph-btn {
  width: 32px; height: 32px; border-radius: 16px;
  border: 1px solid var(--border-subtle); background: var(--surface-card);
  color: var(--text-secondary); font-size: 12px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 150ms, transform 120ms;
}
.ex-graph-btn:active { transform: scale(0.92); background: var(--surface-sunken); }
.ex-chevron {
  width: 20px; height: 20px; color: var(--text-tertiary);
  transition: transform 300ms var(--ease); flex-shrink: 0;
  stroke-width: 1.8;
}
.ex-card.expanded .ex-chevron { transform: rotate(180deg); }
.ex-card.completed .ex-chevron { color: var(--accent-success); }
.ex-check { color: var(--accent-success); font-weight: 700; }
.ex-last-perf { font-size: 11.5px; color: var(--text-tertiary); margin-top: 3px; font-style: italic; }

/* Card body */
.ex-body { max-height: 0; overflow: hidden; transition: max-height 320ms var(--ease); }
.ex-card.expanded .ex-body { max-height: 900px; }
.ex-body-inner { padding: 0 16px 18px; }
.warmup-hint { font-style: italic; font-size: 12px; color: var(--text-tertiary); margin-bottom: 10px; }

/* ── Warm-up set row ── */
.warmup-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  padding: 8px 12px; border-radius: 14px; min-width: 0; box-sizing: border-box;
  background: var(--surface-sunken);
  border: 1px dashed var(--border-strong);
}
.warmup-label {
  font-size: 10px; font-family: var(--font-mono); letter-spacing: 0.12em;
  color: var(--text-tertiary); text-transform: uppercase; white-space: nowrap; flex-shrink: 0;
  font-weight: 600;
}
.warmup-input {
  flex: 1; min-width: 0; height: 38px; border: 1px solid var(--border); border-radius: 10px;
  text-align: center; font-size: 15px; font-weight: 600; font-family: var(--font-mono);
  background: var(--card); color: var(--text-primary); outline: none; box-sizing: border-box;
  font-variant-numeric: tabular-nums lining-nums;
}
.warmup-sep { font-size: 13px; color: var(--text-tertiary); flex-shrink: 0; }
.warmup-dismiss {
  width: 28px; height: 28px; flex-shrink: 0; border: none; background: none;
  cursor: pointer; color: var(--text-tertiary); font-size: 16px; line-height: 1;
  display: flex; align-items: center; justify-content: center; border-radius: 50%;
  transition: background 150ms, color 150ms;
}
.warmup-dismiss:active { background: var(--border-subtle); color: var(--text-primary); }
.ex-notes {
  font-style: italic; font-size: 12px; color: var(--text-tertiary);
  margin-bottom: 10px; outline: none; width: 100%;
  background: none; border: none; font-family: var(--font-body); cursor: text;
}
.ex-notes:focus { color: var(--text-primary); }

/* ── Inline note toggle button ── */
.ex-note-btn {
  width: 32px; height: 32px; border-radius: 16px;
  border: 1px solid var(--border-subtle); background: var(--surface-card);
  color: var(--text-secondary); cursor: pointer; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: color 150ms, border-color 150ms, background 150ms, transform 120ms;
}
.ex-note-btn:active { transform: scale(0.92); background: var(--surface-sunken); }
.ex-note-btn.has-note { color: var(--accent-kinetic); border-color: rgba(240,78,35,0.35); }

/* ── Inline note panel ── */
.ex-note-panel {
  max-height: 0; overflow: hidden;
  transition: max-height 280ms var(--spring-snappy);
  margin-top: 0;
}
.ex-note-panel.open { max-height: 130px; }
.ex-note-area {
  width: 100%; padding: 12px 14px;
  border: 1px solid var(--border); border-radius: 14px;
  background: var(--surface-sunken);
  font-family: var(--font-body); font-size: 13px;
  color: var(--text-primary); line-height: 1.55;
  resize: none; outline: none;
  margin-top: 10px; margin-bottom: 6px;
  font-style: italic;
  transition: border-color 150ms;
  min-height: 64px;
}
.ex-note-area:focus { border-color: var(--accent-kinetic); font-style: normal; }
.ex-note-area::placeholder { color: var(--text-tertiary); opacity: 0.7; font-style: italic; }

/* Set rows */
.set-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  position: relative;
  width: 100%;
  min-width: 0;
  box-sizing: border-box;
  padding: 4px 6px;
  border-radius: 14px;
  transition: background var(--dur-smooth) var(--ease);
}
.set-input { min-width: 0; flex: 1 1 0; box-sizing: border-box; }
.set-num {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 600;
  color: var(--text-tertiary);
  width: 22px;
  flex-shrink: 0;
  text-align: center;
  font-variant-numeric: tabular-nums lining-nums;
}
.set-input {
  flex: 1;
  min-width: 0;
  height: 44px;
  border: 1px solid var(--border);
  border-radius: 12px;
  text-align: center;
  font-size: 16.5px;
  font-weight: 600;
  font-family: var(--font-mono);
  background: var(--surface-canvas);
  color: var(--text-primary);
  outline: none;
  box-sizing: border-box;
  box-shadow: var(--shadow-sm);
  transition: all var(--dur-fast) var(--ease);
  -webkit-appearance: none;
  font-variant-numeric: tabular-nums lining-nums;
}
.set-input:focus {
  border-color: var(--accent-kinetic);
  box-shadow: 0 0 0 3px rgba(240,78,35,0.16);
}
.set-input.logged {
  background: oklch(72.3% 0.190 145 / 0.10);
  border-color: var(--accent-success);
  color: var(--accent-success);
  box-shadow: none;
}
.set-sep { font-size: 13px; color: var(--text-tertiary); }
.set-log-btn {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  border: none;
  background: var(--accent-kinetic);
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  margin-left: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
  transition: transform var(--dur-smooth) var(--spring-bounce),
              background var(--dur-smooth) var(--ease),
              box-shadow var(--dur-smooth) var(--ease);
}
.set-log-btn:active { transform: scale(0.92); }
.set-log-btn.logged {
  background: var(--accent-success);
  transform: scale(1.0);
}
.set-log-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }
.set-hint { font-size: 11.5px; color: var(--text-tertiary); margin-top: -4px; margin-bottom: 6px; padding-left: 30px; font-style: italic; }
.rest-time-row { display: flex; align-items: center; gap: 6px; font-style: normal; padding-left: 0; }
.rest-time-display {
  font-size: 12.5px; font-weight: 600; color: var(--text-primary); cursor: pointer;
  border-bottom: 1px dashed var(--border-strong); padding-bottom: 1px; transition: color 150ms;
}
.rest-time-display:hover { color: var(--accent-kinetic); border-color: var(--accent-kinetic); }
.rest-time-input {
  font-size: 12.5px; font-weight: 600; width: 54px;
  border: none; border-bottom: 1.5px solid var(--accent-kinetic);
  background: none; color: var(--text-primary); outline: none;
  text-align: center; font-family: var(--font-body); padding: 0 2px 1px;
}
.technique-badge {
  display: inline-block; background: var(--accent-kinetic); color: #fff;
  font-size: 10px; font-weight: 600; border-radius: 8px;
  padding: 2px 8px; margin-left: 8px;
  text-transform: uppercase; letter-spacing: 0.3px;
}
.set-ripple {
  position: absolute; inset: 0; border-radius: 12px;
  background: rgba(34,197,94,0.2); opacity: 0; pointer-events: none;
  animation: ripple 400ms var(--ease) forwards;
}
@keyframes ripple { 0%{opacity:1} 100%{opacity:0;transform:scale(1.04)} }
.set-trend {
  padding-left: 30px; margin-top: -2px; margin-bottom: 4px;
  font-size: 10.5px; font-variant-numeric: tabular-nums lining-nums;
  display: flex; align-items: center; gap: 4px; color: var(--text-tertiary);
}
.trend-arrow-up   { color: #C4944A; font-size: 11px; font-weight: 700; }
.trend-arrow-down { color: #C4876E; font-size: 11px; font-weight: 700; }

/* Plate calculator */
.plate-popover {
  background: var(--card); color: var(--text);
  border-radius: 14px; padding: 10px 14px 11px; font-size: 12px; margin-top: 6px;
  box-shadow: var(--shadow-deep); border: 0.5px solid var(--border);
}
.plate-popover .plate-title { font-size: 9.5px; color: var(--muted); margin-bottom: 2px; text-transform: uppercase; letter-spacing: 0.09em; }
.plate-total { font-size: 11.5px; color: var(--text-secondary); text-align: center; margin-top: 5px; font-variant-numeric: tabular-nums; }
.plate-total strong { font-weight: 600; color: var(--text); }

/* Overload nudge */
.overload-nudge {
  background: linear-gradient(135deg, #FFF7ED, #FFEDD5);
  border: 1px solid #FED7AA; border-radius: 12px;
  padding: 10px 14px; margin-bottom: 10px;
  font-size: 13px; color: #92400E;
  display: flex; align-items: center; gap: 8px;
}
.weight-suggestion { font-style: italic; font-size: 11px; color: var(--muted); margin-bottom: 6px; padding-left: 30px; }
.overload-next { background: #F0FDF4; border: 1px solid #BBF7D0; border-radius: 10px; padding: 8px 12px; font-size: 12px; color: #166534; margin-top: 8px; }

/* ── Bottom sheet ── */
.bottom-sheet-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 200; opacity: 0; transition: opacity 250ms; pointer-events: none;
}
.bottom-sheet-overlay.visible { opacity: 1; pointer-events: all; }
.bottom-sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--card); border-radius: 24px 24px 0 0;
  z-index: 201; max-height: 80vh; overflow-y: auto;
  transform: translateY(100%); transition: transform 300ms ease-out;
  padding: 0 20px 40px;
}
.bottom-sheet.visible { transform: translateY(0); }
.bs-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 20px; }
.bs-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.bs-section-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
.sub-card { background: var(--card); border-radius: 12px; margin-bottom: 8px; overflow: hidden; box-shadow: var(--shadow); }
.sub-card-header { padding: 12px 14px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; min-height: 44px; }
.sub-card-name { font-size: 14px; font-weight: 500; }
.sub-card-tag { font-size: 10px; color: var(--muted); background: var(--border); border-radius: 6px; padding: 2px 6px; }
.sub-card-body { padding: 0 14px; max-height: 0; overflow: hidden; transition: max-height 200ms ease-out; }
.sub-card.open .sub-card-body { max-height: 120px; padding-bottom: 12px; }
.sub-card-detail { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; }
.sub-use-btn { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: 10px; padding: 10px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 40px; }
.highlighted { background: #FFF7ED; border: 1px solid #FED7AA; }
.cue-section { margin-bottom: 14px; }
.cue-section h4 { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
.cue-section p { font-size: 14px; color: var(--text); line-height: 1.6; }
.cue-tip { background: #FFF7ED; border-left: 3px solid var(--accent); border-radius: 0 10px 10px 0; padding: 10px 14px; font-size: 13px; color: #92400E; margin-top: 8px; }

/* ── Exercise picker sheet — library search, set/rep picker (Decisions 1,2,6,7) ── */
.bs-sub { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin: -8px 0 16px; }
.bs-search {
  width: 100%; box-sizing: border-box; padding: 11px 14px; min-height: 44px;
  border: 1px solid var(--border); border-radius: 12px; background: #fff;
  font-size: 14px; font-family: var(--font-body); color: var(--text);
  margin-bottom: 12px; -webkit-appearance: none; outline: none;
  transition: border-color 160ms ease;
}
.bs-search:focus { border-color: var(--accent); }
.bs-search::placeholder { color: var(--muted); }
.lib-section { margin-bottom: 14px; }
.lib-muscle-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); font-weight: 600; margin: 14px 2px 6px; }
.lib-empty { font-size: 13px; color: var(--muted); font-style: italic; text-align: center; padding: 18px 4px; }

.srp { margin: 4px 0 8px; }
.srp-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 2px; border-bottom: 1px solid var(--border); }
.srp-row:last-child { border-bottom: none; }
.srp-lbl { font-size: 15px; font-weight: 600; color: var(--text); }
.srp-hint { font-size: 11px; font-weight: 400; color: var(--muted); margin-left: 3px; }
.srp-stepper { display: flex; align-items: center; gap: 6px; }
.srp-btn {
  width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--border);
  background: #fff; color: var(--text); font-size: 22px; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent;
  transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
}
.srp-btn:active { transform: scale(0.92); border-color: var(--accent); background: #FFF7ED; }
.srp-val { min-width: 52px; text-align: center; font-size: 22px; font-weight: 700; color: var(--charcoal); font-variant-numeric: tabular-nums lining-nums; }
.srp-preview {
  text-align: center; font-family: var(--font-hero); font-style: italic;
  font-size: 34px; color: var(--accent); margin: 8px 0 14px;
  font-variant-numeric: tabular-nums lining-nums; letter-spacing: 0.5px;
}

/* ── Additions in the workout list (Decisions 4,5) ── */
.add-group-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); font-weight: 600; margin: 18px 2px 8px; }
.ex-card-add { position: relative; }
.ex-card-add::before { content: ''; position: absolute; top: 14px; bottom: 14px; left: 0; width: 3px; border-radius: 0 3px 3px 0; background: rgba(240,78,35,0.32); }
.ex-remove-btn { color: var(--muted); }
.ex-remove-btn:active { color: #C0432A; }
.add-ex-pill {
  width: 100%; box-sizing: border-box; margin: 10px 0 6px; padding: 16px;
  border-radius: 16px; border: 1.5px dashed rgba(240,78,35,0.38); background: #fff;
  color: var(--accent); font-size: 15px; font-weight: 600; font-family: var(--font-body);
  cursor: pointer; box-shadow: var(--shadow); min-height: 56px;
  display: flex; align-items: center; justify-content: center; gap: 9px;
  -webkit-tap-highlight-color: transparent; transition: background 140ms ease, border-color 140ms ease, transform 120ms ease;
}
.add-ex-pill:active { background: #FFF7ED; border-color: var(--accent); transform: scale(0.99); }
.add-ex-plus { font-size: 20px; font-weight: 400; line-height: 1; }

/* ── History popup: grouped exercise list (Decisions 3,5) ── */
.cal-ex-list { margin-top: 16px; border-top: 1px solid var(--border); padding-top: 10px; text-align: left; max-height: 38vh; overflow-y: auto; }
.cal-ex-group-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); font-weight: 600; margin: 12px 0 4px; }
.cal-ex-group-add { color: var(--accent); }
.cal-ex-row { display: flex; align-items: baseline; gap: 8px; padding: 6px 0; font-size: 13.5px; }
.cal-ex-check { color: #22C55E; font-size: 11px; flex-shrink: 0; }
.cal-ex-name { flex: 1; color: var(--text); }
.cal-ex-sub { font-size: 11px; color: var(--muted); font-style: italic; margin-left: 6px; }
.cal-ex-vol { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums lining-nums; flex-shrink: 0; }

/* ── Finish screen ── */
#finish-screen {
  position: fixed; inset: 0; background: var(--surface-canvas); z-index: 300;
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 48px 24px 40px;
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
}
.finish-headline {
  font-family: var(--font-hero); font-style: italic;
  font-size: 52px; font-weight: 600; color: var(--text-primary);
  margin-bottom: 4px; text-align: center; letter-spacing: -0.02em;
}
.finish-session-label {
  font-size: 13px; color: var(--text-secondary); margin-bottom: 24px;
  text-align: center; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600;
}
.finish-plan-table { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
.finish-row { border-radius: 16px; padding: 14px 18px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden; }
.finish-row-done-prior { background: var(--surface-sunken); border: 1px solid var(--border-subtle); }
.finish-row-done-prior .fr-name { text-decoration: line-through; color: var(--text-tertiary); font-size: 14px; }
.finish-row-done-prior .fr-date { font-size: 11px; color: var(--text-tertiary); }
.finish-row-done-prior .fr-icon { opacity: 0.4; }
.finish-row-remaining { background: var(--surface-sunken); border: 1px solid var(--border-subtle); opacity: 0.75; }
.finish-row-remaining .fr-name { color: var(--text-secondary); font-size: 14px; }
.finish-row-remaining .fr-date { font-size: 11px; color: var(--text-tertiary); }
.finish-row-now {
  background: linear-gradient(135deg, rgba(201, 168, 76, 0.14) 0%, rgba(201, 168, 76, 0.04) 100%);
  border: 1px solid rgba(201, 168, 76, 0.45);
  box-shadow: 0 4px 20px rgba(201, 168, 76, 0.16), inset 0 1px 0 rgba(255,255,255,0.9);
}
.finish-row-now .fr-name { font-size: 15px; font-weight: 700; color: var(--text-primary); }
.finish-row-now .fr-date { font-size: 11.5px; color: rgba(160, 120, 20, 0.9); font-weight: 600; }
.finish-row-now::after {
  content: ''; position: absolute; top: 0; left: -60%;
  width: 40%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,215,0,0.22), transparent);
  animation: goldSweep 2.8s ease-in-out infinite 0.5s;
}
@keyframes goldSweep { 0%{left:-60%} 100%{left:130%} }
.fr-icon { font-size: 16px; flex-shrink: 0; width: 24px; text-align: center; }
.fr-info { flex: 1; }
.fr-name { font-weight: 600; }
.fr-date { margin-top: 2px; }
.finish-stats-row { display: flex; gap: 10px; width: 100%; max-width: 380px; margin-bottom: 24px; }
.finish-stat {
  flex: 1; background: var(--surface-card); border-radius: 16px; padding: 16px 10px; text-align: center;
  box-shadow: var(--shadow-sm); border: 1px solid var(--border-subtle);
}
.finish-stat-val {
  font-family: var(--font-mono); font-size: 21px; font-weight: 600; color: var(--text-primary);
  font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.02em;
}
.finish-stat-lbl { font-size: 9.5px; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; font-weight: 600; }

/* ── Milestone screen ── */
#milestone-screen {
  position: fixed; inset: 0; z-index: 350;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 40px 24px;
  background: linear-gradient(135deg, #FAF7F2 0%, #FFF0E8 50%, #FAF7F2 100%);
}
.milestone-n {
  font-family: var(--font-hero); font-size: 140px; font-weight: 700;
  color: var(--accent); line-height: 1; opacity: 0.15; position: absolute;
}
.milestone-content { position: relative; text-align: center; }
.milestone-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
.milestone-title { font-family: var(--font-hero); font-size: 44px; font-weight: 700; color: var(--charcoal); margin-bottom: 16px; }
.milestone-quote { font-family: var(--font-hero); font-style: italic; font-size: 20px; color: var(--text-secondary); margin-bottom: 40px; line-height: 1.5; }

/* ── HISTORY SCREEN ── */
/* ── True iOS segmented control — one sliding raised thumb ── */
.history-tabs {
  display: flex; gap: 0; margin: 16px 24px;
  background: var(--border); border-radius: 13px; padding: 3px;
  position: relative; isolation: isolate;
}
.history-tabs::before {
  content: ''; position: absolute; z-index: 0;
  top: 3px; bottom: 3px; left: 3px;
  width: calc(50% - 3px);
  background: var(--card); border-radius: 10px;
  box-shadow: 0 1px 3px rgba(42,36,33,0.10), 0 3px 8px rgba(42,36,33,0.06);
  transition: transform var(--dur-med) var(--ease);
}
.history-tabs:has(.hist-tab:nth-child(2).active)::before { transform: translateX(100%); }
.hist-tab {
  flex: 1; padding: 8px; text-align: center;
  font-size: 13px; font-weight: 500; border-radius: 10px;
  cursor: pointer; transition: color var(--dur-med) var(--ease);
  color: var(--muted); border: none; background: none;
  position: relative; z-index: 1;
  -webkit-tap-highlight-color: transparent;
}
.hist-tab.active { color: var(--text); font-weight: 600; }

/* ── Bio-Data Matrix Grid (Progress tab) ── */
.progress-grid-wrap {
  padding: 4px 16px 8px;
  display: flex;
  flex-direction: column;
}
.bio-matrix {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(4, 1fr);
  border-radius: 15px;
  overflow: hidden;
  box-shadow:
    0 2px 8px rgba(42,36,33,0.07),
    0 6px 24px rgba(42,36,33,0.05),
    inset 0 0 0 0.5px rgba(42,36,33,0.08);
  /* fixed height so it never scrolls — fills space between tabs and nav */
  height: calc(100svh - var(--header-h) - var(--nav-h) - 80px);
  max-height: 560px;
}
.bm-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 8px 3px 8px;
  gap: 5px;
  position: relative;
  overflow: hidden;
}
.bm-tile::after {
  content: '';
  position: absolute; inset: 0;
  border-right: 0.5px solid rgba(42,36,33,0.065);
  border-bottom: 0.5px solid rgba(42,36,33,0.065);
  pointer-events: none;
}
.bm-tile.ta { background: #E0E0E0; }
.bm-tile.tb { background: #FAF7F2; }
/* Ghost tiles removed from DOM — no CSS needed */
.bm-ring-box {
  flex-shrink: 0;
  /* 40% larger: baseline 54px → 76px */
  width: min(76px, calc((100vw - 32px) / 4 - 6px));
  height: min(76px, calc((100vw - 32px) / 4 - 6px));
}
.bm-ring-box svg { width: 100%; height: 100%; display: block; overflow: visible; }
.bm-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 8px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--charcoal);
  opacity: 0.65;
  text-align: center;
  line-height: 1;
  flex-shrink: 0;
}
.bm-label.complete { color: oklch(52% 0.18 145); opacity: 1; font-weight: 700; }

/* ── 5-Week Calendar (Workouts tab) ── */
.cal-section { padding: 0 16px 48px; margin-top: 8px; }
.cal-section-hdr {
  font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 16px;
}
.cal-dow-header { display: flex; gap: 5px; padding: 0 0 8px 31px; }
.cal-dow-cell {
  flex: 1; text-align: center; font-size: 9px;
  color: rgba(42,36,33,0.28); letter-spacing: 0.06em; text-transform: uppercase;
  font-variant-numeric: tabular-nums;
}
.cal-grid { display: flex; flex-direction: column; gap: 5px; }
.cal-week-row { display: flex; align-items: center; gap: 5px; }
.cal-week-lbl {
  font-size: 7.5px; color: rgba(42,36,33,0.26); width: 26px; flex-shrink: 0;
  letter-spacing: 0.04em; text-transform: uppercase; text-align: right;
}
.cal-days-row { display: flex; gap: 5px; flex: 1; min-width: 0; }
.cal-day-cell {
  flex: 1; aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; position: relative; cursor: default;
  transition: transform 150ms ease; min-width: 0;
}
.cal-day-blank  { background: transparent; }
.cal-day-open   { background: rgba(42,36,33,0.045); }
.cal-day-done   {
  background: var(--charcoal);
  box-shadow: 0 4px 16px rgba(42,36,33,0.22); cursor: pointer;
}
.cal-day-done:active { transform: scale(0.86); }
.cal-day-num {
  font-size: clamp(9px, 2.4vw, 13px); font-weight: 600;
  font-variant-numeric: tabular-nums; line-height: 1;
}
.cal-day-blank .cal-day-num  { color: rgba(42,36,33,0.13); }
.cal-day-open .cal-day-num   { color: rgba(42,36,33,0.24); }
.cal-day-done .cal-day-num   { color: rgba(255,255,255,0.94); }

/* Calendar day popup */
#cal-popup {
  position: fixed; inset: 0;
  background: rgba(36,28,22,0.46);
  backdrop-filter: blur(20px) saturate(1.25);
  -webkit-backdrop-filter: blur(20px) saturate(1.25);
  z-index: 650; display: none; align-items: center; justify-content: center;
  padding: 32px 24px; opacity: 0; transition: opacity 280ms ease;
}
#cal-popup.visible { opacity: 1; }
#cal-popup-panel {
  width: 100%; max-width: 340px;
  background: linear-gradient(150deg, #F4ECDD 0%, #E8DAC4 100%);
  border: 1px solid rgba(42,36,33,0.12);
  border-radius: 28px;
  box-shadow: 0 30px 80px rgba(46,34,24,0.34),
              inset 0 1.5px 0 rgba(255,255,255,0.55),
              inset 0 -1px 0 rgba(120,96,64,0.10);
  padding: 28px 24px 32px;
  transform: translateY(24px) scale(0.95);
  transition: transform var(--dur-slow) var(--ease);
  position: relative;
}
#cal-popup.visible #cal-popup-panel { transform: translateY(0) scale(1); }
.cal-popup-close {
  position: absolute; top: 16px; right: 16px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(42,36,33,0.10); border: 1px solid rgba(42,36,33,0.08);
  cursor: pointer; font-size: 13px; color: var(--charcoal);
  display: flex; align-items: center; justify-content: center;
}
.cal-popup-date {
  font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase;
  color: rgba(42,36,33,0.58); margin-bottom: 6px;
}
.cal-popup-session {
  font-family: var(--font-hero); font-style: italic;
  font-size: 28px; font-weight: 600;
  color: var(--charcoal); line-height: 1.1; margin-bottom: 4px;
}
.cal-popup-prog {
  font-size: 10px; color: rgba(42,36,33,0.52);
  text-transform: uppercase; letter-spacing: 0.12em; margin-bottom: 20px;
}
.cal-popup-stats { display: flex; gap: 10px; }
.cal-popup-stat {
  flex: 1; background: #FBF6EC;
  border-radius: 12px; padding: 12px 10px;
  border: 1px solid rgba(42,36,33,0.08); text-align: center;
}
.cal-popup-stat-val { font-size: 16px; font-weight: 700; color: var(--charcoal); font-variant-numeric: tabular-nums; }
.cal-popup-stat-lbl {
  font-size: 9px; color: rgba(42,36,33,0.58);
  text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px;
}

/* ── Liquid glass progress graph modal ── */
#graph-backdrop {
  position: fixed; inset: 0;
  background: rgba(10,10,20,0.45);
  backdrop-filter: blur(28px) saturate(1.6);
  -webkit-backdrop-filter: blur(28px) saturate(1.6);
  z-index: 600; display: flex; align-items: center; justify-content: center;
  padding: 24px; opacity: 0; pointer-events: none;
  transition: opacity 300ms ease;
}
#graph-backdrop.visible { opacity: 1; pointer-events: all; }
#graph-panel {
  width: 100%; max-width: 370px;
  background: linear-gradient(145deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.13) 100%);
  border: 1px solid rgba(255,255,255,0.50);
  border-radius: 28px;
  box-shadow: 0 40px 100px rgba(0,0,0,0.45),
              0 8px 24px rgba(0,0,0,0.20),
              inset 0 1.5px 0 rgba(255,255,255,0.70),
              inset 0 -1px 0 rgba(255,255,255,0.12);
  padding: 28px 24px 32px;
  transform: translateY(24px) scale(0.96);
  transition: transform var(--dur-slow) var(--ease);
  position: relative; overflow: hidden;
}
#graph-backdrop.visible #graph-panel { transform: translateY(0) scale(1); }
#graph-panel::before {
  content: ''; position: absolute; top: -60%; left: -40%;
  width: 180%; height: 180%;
  background: conic-gradient(from 180deg at 50% 50%,
    rgba(255,255,255,0.09) 0deg, transparent 60deg,
    rgba(255,255,255,0.05) 120deg, transparent 180deg,
    rgba(255,255,255,0.07) 240deg, transparent 300deg,
    rgba(255,255,255,0.09) 360deg);
  animation: glassShimmer 6s linear infinite; pointer-events: none;
}
@keyframes glassShimmer { to { transform: rotate(360deg); } }
.graph-close {
  position: absolute; top: 18px; right: 18px;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(42,36,33,0.10); border: 1px solid rgba(42,36,33,0.08);
  cursor: pointer; font-size: 14px; color: var(--charcoal);
  display: flex; align-items: center; justify-content: center;
}
.graph-ex-title {
  font-family: var(--font-hero); font-style: italic;
  font-size: 22px; font-weight: 600; color: var(--charcoal);
  margin-bottom: 2px; position: relative;
}
.graph-meta {
  font-size: 10px; color: rgba(42,36,33,0.45);
  text-transform: uppercase; letter-spacing: 1.2px;
  margin-bottom: 20px; position: relative;
}
.graph-no-data { font-size: 13px; color: rgba(42,36,33,0.45); font-style: italic; margin: 24px 0; text-align: center; position: relative; }
.graph-svg-wrap { position: relative; width: 100%; }
.graph-stat-row { display: flex; gap: 12px; margin-top: 20px; position: relative; }
.graph-stat {
  flex: 1; background: rgba(255,255,255,0.35);
  border-radius: 14px; padding: 12px;
  border: 1px solid rgba(255,255,255,0.5);
}
.graph-stat-val { font-size: 18px; font-weight: 700; color: var(--charcoal); font-variant-numeric: tabular-nums; }
.graph-stat-lbl { font-size: 9px; color: rgba(42,36,33,0.45); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }

/* ── Muscle glass overlay ── */
#muscle-graph-overlay {
  position: fixed; inset: 0;
  background: oklch(8% 0.012 260 / 0.54);
  backdrop-filter: blur(28px) saturate(1.8);
  -webkit-backdrop-filter: blur(28px) saturate(1.8);
  z-index: 700; display: none; align-items: center; justify-content: center;
  padding: 24px; opacity: 0; transition: opacity 300ms ease;
}
#muscle-graph-overlay.visible { opacity: 1; }
/* silhouette focus vignette — inactive muscles fade */
.muscle-group { transition: opacity 500ms cubic-bezier(0.16,1,0.3,1); }
.silhouette-focus-active .muscle-group { opacity: 0.5; }
.silhouette-focus-active .muscle-group.muscle-focused { opacity: 1 !important; }
/* recovery rings + ghost trace */
.mg-recovery-rings { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
.mg-ring-label { font-size: 9.5px; color: rgba(255,255,255,0.42); font-family: var(--font-mono); letter-spacing: 0.06em; margin-left: 4px; }
.mg-ghost-trace { opacity: 0.25; }
#muscle-graph-panel {
  /* Solid white instrument card — the grey frost is dead */
  width: 100%; max-width: 344px;
  background: var(--card);
  border-radius: 28px;
  box-shadow: var(--shadow-deep);
  padding: 24px 22px 20px; position: relative;
  transform: scale(0.82); transform-origin: center center;
  transition: transform var(--dur-slow) var(--ease);
}
#muscle-graph-overlay.visible #muscle-graph-panel { transform: scale(1); }
.mg-close {
  position: absolute; top: 16px; right: 16px;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(42,36,33,0.05); border: none;
  cursor: pointer; font-size: 14px; color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  z-index: 2; -webkit-tap-highlight-color: transparent;
  transition: transform var(--dur-fast) var(--ease);
}
.mg-close:active { transform: scale(0.92); }
.mg-head { display: flex; align-items: flex-start; justify-content: space-between; padding-right: 36px; margin-bottom: 12px; }
.mg-muscle-title {
  font-family: var(--font-hero); font-style: italic;
  font-size: 27px; font-weight: 600; color: var(--charcoal); line-height: 1.05;
}
.mg-meta {
  font-size: 9.5px; color: var(--muted);
  text-transform: uppercase; letter-spacing: 0.12em; margin-top: 3px;
}
.mg-delta {
  font-size: 21px; font-weight: 300; letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; padding-top: 4px;
}
.mg-delta-up   { color: var(--green); }
.mg-delta-down { color: var(--terracotta); }
.mg-delta-none { font-family: var(--font-hero); font-style: italic; font-size: 14px; color: var(--muted); }
.mg-switcher {
  display: flex; gap: 6px; overflow-x: auto; margin: 0 -22px 14px; padding: 2px 22px 6px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.mg-switcher::-webkit-scrollbar { display: none; }
.mg-chip {
  flex-shrink: 0; padding: 6px 13px; border-radius: 15px;
  border: 1px solid var(--border); background: var(--card);
  font-size: 11.5px; font-weight: 500; color: var(--text-secondary);
  font-family: var(--font-body); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--dur-fast) var(--ease);
}
.mg-chip:active { transform: scale(0.95); }
.mg-chip.active { background: var(--charcoal); border-color: var(--charcoal); color: #FAF7F2; font-weight: 600; }
.mg-chart-wrap { margin-bottom: 4px; }
.mg-empty {
  font-family: var(--font-hero); font-style: italic; font-size: 14px;
  color: var(--muted); margin: 26px 0; text-align: center;
}
.mg-line-draw {
  stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: mgLineDraw 720ms var(--ease) 80ms forwards;
}
.mg-area-draw { opacity: 0; animation: mgAreaIn 540ms var(--ease) 420ms forwards; }
@keyframes mgLineDraw { to { stroke-dashoffset: 0; } }
@keyframes mgAreaIn   { to { opacity: 1; } }
.mg-driver {
  font-size: 12px; color: var(--text-secondary); line-height: 1.5;
  padding: 9px 12px; margin-top: 6px;
  background: rgba(240,78,35,0.055); border-radius: 11px;
}
.mg-driver strong { font-weight: 600; color: var(--text); }
.mg-driver-up   { color: var(--green); font-weight: 600; }
.mg-driver-down { color: var(--terracotta); font-weight: 600; }
.mg-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; }
.mg-range { display: flex; background: var(--border); border-radius: 10px; padding: 2px; gap: 0; }
.mg-range-btn {
  border: none; background: none; padding: 5px 12px; border-radius: 8px;
  font-size: 11px; font-weight: 600; color: var(--muted); cursor: pointer;
  font-family: var(--font-body); -webkit-tap-highlight-color: transparent;
  transition: all var(--dur-fast) var(--ease);
}
.mg-range-btn.active { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(42,36,33,0.10); }
.mg-now { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.mg-now strong { color: var(--text-secondary); font-weight: 600; }

/* ── Program picker ── */
.prog-picker-header { padding: calc(env(safe-area-inset-top, 0px) + 32px) 24px 16px; }
.prog-picker-header h2 { font-family: var(--font-hero); font-size: 32px; font-weight: 600; font-style: italic; color: var(--text-primary); letter-spacing: -0.015em; }
.prog-picker-header p { font-size: 14px; color: var(--text-secondary); margin-top: 4px; }
.day-selector { display: flex; gap: 8px; padding: 4px 24px 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.day-chip {
  flex-shrink: 0; padding: 8px 18px; border-radius: 20px;
  border: 1px solid var(--border-subtle); font-size: 13.5px; font-weight: 600;
  cursor: pointer; transition: all 150ms var(--spring-snappy); background: var(--surface-card); color: var(--text-secondary);
  box-shadow: var(--shadow-sm);
}
.day-chip:active { transform: scale(0.94); }
.day-chip.selected { background: var(--accent-kinetic); border-color: var(--accent-kinetic); color: #fff; box-shadow: 0 4px 14px rgba(240,78,35,0.32); }
.prog-list { padding: 0 16px; }
.prog-card {
  background: var(--surface-card); border-radius: 20px; margin-bottom: 12px;
  padding: 18px 20px; box-shadow: var(--shadow-sm); cursor: pointer;
  display: flex; align-items: center; gap: 16px;
  border: 1px solid var(--border-subtle);
  transition: transform 160ms var(--spring-snappy), box-shadow 160ms, border-color 160ms;
}
.prog-card:active { transform: scale(0.98); border-color: var(--accent-kinetic); }
.prog-card-days {
  width: 48px; height: 48px; border-radius: 14px; background: var(--surface-sunken);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: 20px; font-weight: 700; color: var(--accent-kinetic); flex-shrink: 0;
  font-variant-numeric: tabular-nums lining-nums;
}
.prog-card-info h3 { font-size: 16px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
.prog-card-info p { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; }

/* ── Session picker ── */
.session-list { padding: 0 16px; }
.session-card {
  background: var(--surface-card); border-radius: 20px; margin-bottom: 12px;
  padding: 18px 20px; box-shadow: var(--shadow-sm); cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  border: 1px solid var(--border-subtle);
  transition: transform 160ms var(--spring-snappy), box-shadow 160ms;
}
.session-card:active { transform: scale(0.98); }
.session-card h3 { font-size: 16px; font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
.session-card p { font-size: 12.5px; color: var(--text-secondary); margin-top: 3px; }
.sess-done-chip { font-size: 10.5px; color: var(--accent-success); background: oklch(72.3% 0.190 145 / 0.12); border-radius: 8px; padding: 3px 8px; font-weight: 600; }
.sess-next-badge { font-size: 10px; color: #fff; background: var(--accent-kinetic); border-radius: 8px; padding: 3px 8px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.session-card.next-session { background: var(--surface-glass-dark); border-color: rgba(255,255,255,0.14); box-shadow: var(--shadow-lg); }
.session-card.next-session h3 { color: #FAF7F2; }
.session-card.next-session p { color: rgba(250,247,242,0.65); }
.session-card.next-session .preview-btn { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.22); color: #FAF7F2; }
.session-card.next-session .start-arrow { color: var(--accent-kinetic); }

/* ── Back button ── */
.back-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--text-secondary); font-size: 15px; font-weight: 500; cursor: pointer; padding: 8px 0; margin-bottom: 8px; }

/* ── Settings ── */
.settings-section { margin: 20px 16px; background: var(--surface-card); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border-subtle); }
.settings-section-title { font-size: 11.5px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.09em; padding: 18px 18px 10px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; min-height: 54px; position: relative; }
.settings-row + .settings-row::before { content: ''; position: absolute; top: 0; left: 18px; right: 0; height: 0.5px; background: var(--border-subtle); }
.settings-row:active { background: var(--surface-sunken); }
.settings-row:first-of-type { border-top: none; }
.settings-row label { font-size: 14.5px; color: var(--text-primary); font-weight: 500; }
.settings-row input[type=text], .settings-row input[type=url] { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; width: 160px; font-family: var(--font-body); outline: none; background: var(--surface-canvas); }
.settings-row input:focus { border-color: var(--accent-kinetic); }
.settings-danger { color: var(--accent-danger) !important; }

/* ── Empty state ── */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
.empty-title { font-family: var(--font-hero); font-size: 36px; font-weight: 600; font-style: italic; color: var(--text-primary); margin-bottom: 12px; }
.empty-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 32px; font-style: italic; }

/* ── Progress row ── */
.progress-table { margin: 0 16px; }
.prog-row { display: flex; align-items: center; gap: 10px; padding: 14px; background: var(--surface-card); border-radius: 16px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow-sm); min-height: 56px; border: 1px solid var(--border-subtle); }
.prog-row-muscle { font-size: 14px; font-weight: 500; flex: 1; }
.prog-row-sparkline { width: 60px; height: 24px; }
.prog-row-1rm { font-size: 13px; font-weight: 600; color: var(--text); text-align: right; min-width: 50px; font-variant-numeric: tabular-nums; }
.status-dot { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; }
.dot-green { background: var(--green); }
.dot-amber { background: #F59E0B; }
.dot-red { background: #EF4444; }

/* ── Shimmer ── */
@keyframes luxShimmer {
  0%   { background-position: -200% center; }
  100% { background-position:  200% center; }
}
.btn-shimmer {
  background: linear-gradient(90deg, var(--accent) 20%, #ff7a52 50%, var(--accent) 80%) !important;
  background-size: 200% auto !important;
  animation: luxShimmer 220ms ease-out forwards !important;
}

/* ── Confetti canvas ── */
#confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 299; }

/* ── Deload banner ── */
.deload-banner { margin: 0 24px 16px; background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 14px; padding: 12px 16px; font-size: 13px; color: #92400E; }

/* ── Stats / metrics ── */
.stats-row { display: flex; gap: 0; margin: 0 24px 20px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.stat-item { flex: 1; padding: 14px 10px; text-align: center; border-right: 1px solid var(--border); }
.stat-item:last-child { border-right: none; }

.gauge-pct-label, .finish-stat-val {

.ob-pill       { transition-timing-function: cubic-bezier(0.16,1,0.3,1) !important; }

<!-- SCRIPT BLOCK 1: Global error interceptor.
     Catches any parse or runtime fault in subsequent blocks and renders
     it on-screen. Silent failures are now impossible. -->
<script>
window.onerror = function(msg, url, line, col, error) {
  var splash = document.getElementById('splash');
  if (splash) splash.style.display = 'none';
  document.body.innerHTML =
    '<div style="padding:40px;font-family:monospace;background:#FAF7F2;color:oklch(45% 0.16 30);min-height:100vh;box-sizing:border-box">' +
    '<h2 style="font-family:Cormorant Garamond,serif;font-style:italic;font-weight:400;color:oklch(25% 0.01 40);margin:0 0 24px">[DCR Gym] Script Error</h2>' +
    '<p><b>Fault:</b> ' + msg + '</p>' +
    '<p><b>Location:</b> Line ' + line + ', Col ' + col + '</p>' +
    '<pre style="background:#fff;padding:16px;border-radius:6px;overflow-x:auto;border:1px solid #ddd;font-size:11px;white-space:pre-wrap">' + (error ? error.stack : '') + '</pre>' +
    '<button onclick="(function(){if(\'caches\' in window){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}; if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}; setTimeout(function(){location.reload(true)},300)})()" style="margin-top:20px;padding:12px 24px;background:oklch(25% 0.01 40);color:#fff;border:none;border-radius:30px;cursor:pointer;font-size:12px;letter-spacing:1px;text-transform:lowercase;font-family:monospace">clear cache &amp; reload</button>' +
    '<p style="margin-top:12px;font-size:10px;color:oklch(50% 0.01 40);font-family:monospace">your workout history is preserved — only app cache is cleared</p>' +
    '</div>';
  return false;
};
console.log('[DCRGym] Error guard active.');
</script>

// Helper: get programs by days per week
function getProgramsByDays(days) {
  return PROGRAMS.filter(p => p.daysPerWeek === days);
}

// Helper: get program by id
function getProgramById(id) {
  return PROGRAMS.find(p => p.id === id);
}

// Helper: get session by id
function getSessionById(programId, sessionId) {
  const prog = getProgramById(programId);
  if (!prog) return null;
  return prog.sessions.find(s => s.id === sessionId);
}

// Export for use in app
if (typeof module !== 'undefined') module.exports = { PROGRAMS, getProgramsByDays, getProgramById, getSessionById };

// ── Per-exercise rest seconds ────────────────────────────────────────────────
function parseRestSeconds(r) {
  if (!r) return 90;
  r = r.toLowerCase();
  if (r.includes('30') && r.includes('60')) return 30;
  if (r.includes('0') && r.includes('1 min')) return 0;
  const m = r.match(/(\d+)[^0-9]*(?:–|-)[^0-9]*(\d+)\s*min/);
  if (m) return parseInt(m[1]) * 60;
  const s = r.match(/(\d+)\s*sec/);
  if (s) return parseInt(s[1]);
  const mm = r.match(/(\d+)\s*min/);
  if (mm) return parseInt(mm[1]) * 60;
  return 90;
}

// ── Utility functions ────────────────────────────────────────────────────────
function stripParentheticals(s) {
  return (s || '').replace(/\s*\([^)]*\)/g, '').trim();
}
function normalizeEx(name) {
  return (name || '').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function resolveAlias(name) {
  const raw = stripParentheticals(stripSuperset(name));
  const n = normalizeEx(raw);
  const mapped = EX_ALIASES[n] || n;
  return normalizeEx(mapped);
}
function stripSuperset(name) {
  return (name || '').replace(/^Superset\s*([0-9]+|[A-Za-z])?:\s*/i, '').trim();
}
// Exact exercise matching — NO loose substring containment. Exercises must strictly
// match identical canonical names, exact aliases, or parenthetical-stripped forms.
function exercisesMatch(a, b) {
  if (!a || !b) return false;
  const rawA = stripSuperset(a);
  const rawB = stripSuperset(b);
  const normA = normalizeEx(rawA);
  const normB = normalizeEx(rawB);
  if (normA === normB) return true;

  const aliasA = resolveAlias(rawA);
  const aliasB = resolveAlias(rawB);
  if (aliasA === aliasB) return true;

  const noParA = normalizeEx(stripParentheticals(rawA));
  const noParB = normalizeEx(stripParentheticals(rawB));
  if (noParA === noParB) return true;

  const noParAliasA = resolveAlias(noParA);
  const noParAliasB = resolveAlias(noParB);
  if (noParAliasA === noParAliasB) return true;

  return false;
}
function getMuscle(name) {
  const n = normalizeEx(stripSuperset(name));
  for (const [k,v] of Object.entries(MUSCLE_MAP)) {
    if (normalizeEx(k) === n) return v;
  }
  const alias = resolveAlias(name);
  if (MUSCLE_MAP[alias]) return MUSCLE_MAP[alias];
  return 'Other';
}
function getExerciseInfo(name) {
  const norm = normalizeEx(stripSuperset(name));
  const exact = EXERCISE_LIBRARY.find(it => normalizeEx(it.name) === norm);
  if (exact) return exact;
  const aliasNorm = resolveAlias(stripSuperset(name));
  const aliasMatch = EXERCISE_LIBRARY.find(it => normalizeEx(it.name) === aliasNorm);
  if (aliasMatch) return aliasMatch;
  const noParNorm = normalizeEx(stripParentheticals(stripSuperset(name)));
  const noParMatch = EXERCISE_LIBRARY.find(it => normalizeEx(it.name) === noParNorm);
  if (noParMatch) return noParMatch;
  return { name: stripSuperset(name), muscle: getMuscle(name), subMuscle: getMuscle(name), tag: 'Gym' };
}
function getSubMuscle(name) {
  const info = getExerciseInfo(name);
  return (info && info.subMuscle) ? info.subMuscle : getMuscle(name);
}
function getExactSubstitutes(exName) {
  const cur = getExerciseInfo(exName);
  const curNorm = normalizeEx(cur.name);
  if (!cur.subMuscle) return [];
  return EXERCISE_LIBRARY.filter(it => it.subMuscle === cur.subMuscle && normalizeEx(it.name) !== curNorm);
}
function isBarbell(name) {
  return BARBELL_EX.has(normalizeEx(stripSuperset(name)));
}
function epley1RM(w, r) {
  if (!r || r === 0) return w;
  return Math.round(w * (1 + r / 30));
}
function formatDuration(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function getWeightUnit() {
  const s = getSettings();
  return (s && s.weightUnit) ? s.weightUnit : 'lb';
}
function formatWeight(val) {
  if (val == null || isNaN(val)) return '0';
  return Number.isInteger(val) ? `${val}` : val.toFixed(1);
}
function formatKg(val) {
  return formatWeight(val);
}
function plateCalc(totalW, barW = null) {
  const unit = getWeightUnit();
  if (barW === null) barW = unit === 'lb' ? 45 : 20;
  const available = unit === 'lb' ? [45, 35, 25, 10, 5, 2.5] : [25, 20, 15, 10, 5, 2.5, 1.25];
  let perSide = (totalW - barW) / 2;
  if (perSide < 0) return null;
  const plates = [];
  for (const p of available) {
    while (perSide >= p - 0.001) {
      plates.push(p);
      perSide -= p;
    }
  }
  return plates;
}

// ── localStorage ─────────────────────────────────────────────────────────────
// Safe Storage Sandbox Proxy — survives WebKit/Safari sandbox DOMException traps
// Falls back to an in-memory store so the app keeps running even if storage is locked.
const LS = {
  get(k, def = null) {
    try {
      const v = localStorage.getItem(k);
      return v !== null ? JSON.parse(v) : def;
    } catch(e) {
      console.warn('[DCR Gym Shell] Storage read trapped, using memory fallback', e);
      return window.__dcr_sandbox_store?.[k] ?? def;
    }
  },
  set(k, v) {
    try {
      localStorage.setItem(k, JSON.stringify(v));
    } catch(e) {
      if (!window.__dcr_sandbox_store) window.__dcr_sandbox_store = {};
      window.__dcr_sandbox_store[k] = v;
      console.warn('[DCR Gym Shell] Storage write trapped, isolated to memory sandbox', e);
    }
  },
  remove(k) {
    try {
      localStorage.removeItem(k);
    } catch(e) {
      if (window.__dcr_sandbox_store) delete window.__dcr_sandbox_store[k];
    }
  },
};

// ── Bulletproof persistence core ─────────────────────────────────────────────
// Schema-versioned, non-destructive, with rolling last-good backup.
// History must survive every app update. Period.
const SCHEMA_VERSION = 3;
const APP_BUILD = '2026.09.01 · ota-16 · fix-session-start-and-warmup-runtime';

function convertHistoryWeightsToLbs(hist) {
  if (!Array.isArray(hist)) return 0;
  let count = 0;
  for (const w of hist) {
    if (!w || !w.sets) continue;
    for (const sets of Object.values(w.sets)) {
      if (!Array.isArray(sets)) continue;
      for (const s of sets) {
        if (s && typeof s.w === 'number' && s.w > 0) {
          s.w = Math.round(s.w * 2.20462 * 2) / 2;
          count++;
        }
      }
    }
  }
  return count;
}

function convertHistoryUnits(targetUnit) {
  const currentHist = getHistory();
  if (!currentHist || currentHist.length === 0) return;
  const factor = targetUnit === 'lb' ? 2.20462 : (1 / 2.20462);
  for (const w of currentHist) {
    if (!w || !w.sets) continue;
    for (const sets of Object.values(w.sets)) {
      if (!Array.isArray(sets)) continue;
      for (const s of sets) {
        if (s && typeof s.w === 'number' && s.w > 0) {
          s.w = targetUnit === 'lb'
            ? Math.round(s.w * factor * 2) / 2
            : Math.round(s.w * factor * 10) / 10;
        }
      }
    }
  }
  saveHistory(currentHist);
  const settings = getSettings();
  settings.weightUnit = targetUnit;
  saveSettings(settings);
}

function migrateStorage() {
  const v = LS.get('dcrgym_schema_version', 1);

  // Ensure body measurements are initialized
  getMeasurements();

  if (v >= SCHEMA_VERSION) return;

  // Rolling last-good backup BEFORE any mutation — recoverable from Settings
  const hist = getHistory();
  if (hist.length > 0) {
    LS.set('dcrgym_history_backup', { at: Date.now(), fromVersion: v, history: hist });
  }

  // v1 → v2: backfill _name onto every working set so exercise identity is a
  // stored fact, never a derived guess.
  if (v < 2) {
    let stamped = 0;
    for (const w of hist) {
      if (!w || !w.sets || !w.programId || w.programId === 'import') continue;
      const prog = PROGRAMS.find(p => p.id === w.programId);
      if (!prog) continue;
      const sess = prog.sessions.find(s => s.id === w.sessionId);
      if (!sess) continue;
      for (const [key, sets] of Object.entries(w.sets)) {
        if (!Array.isArray(sets) || key.endsWith('_wu')) continue;
        if (sets.some(s => s && s._name)) continue;
        const exIdx = parseInt(key.split('_').pop());
        if (isNaN(exIdx) || !sess.exercises[exIdx]) continue;
        const nm = stripSuperset(sess.exercises[exIdx].name);
        for (const s of sets) { if (s && s.r > 0) { s._name = nm; stamped++; } }
      }
    }
    if (stamped > 0) saveHistory(hist);
  }

  // v2 → v3: convert logged weights from kg to lbs & set default weightUnit to 'lb'
  if (v < 3) {
    const currentHist = getHistory();
    const convertedCount = convertHistoryWeightsToLbs(currentHist);
    if (convertedCount > 0) saveHistory(currentHist);

    // Convert live active workout if present
    const liveWorkout = LS.get('dcrgym_current_workout');
    if (liveWorkout && liveWorkout.sets) {
      for (const sets of Object.values(liveWorkout.sets)) {
        if (!Array.isArray(sets)) continue;
        for (const s of sets) {
          if (s && typeof s.w === 'number' && s.w > 0) {
            s.w = Math.round(s.w * 2.20462 * 2) / 2;
          }
        }
      }
      if (liveWorkout.drafts) {
        for (const draft of Object.values(liveWorkout.drafts)) {
          if (draft && draft.w !== '' && !isNaN(parseFloat(draft.w))) {
            draft.w = String(Math.round(parseFloat(draft.w) * 2.20462 * 2) / 2);
          }
        }
      }
      LS.set('dcrgym_current_workout', liveWorkout);
    }

    const settings = getSettings();
    settings.weightUnit = 'lb';
    saveSettings(settings);
  }

  LS.set('dcrgym_schema_version', SCHEMA_VERSION);
}

// Additions are keyed by a STABLE id (`add_${id}`), not array position — so
// removing one mid-session never re-points another card's logged sets.
function additionByKey(key) {
  if (!key || key.indexOf('add_') !== 0) return null;
  const id = parseInt(key.slice(4));
  return (ST.workoutAdditions || []).find(a => a && a.id === id) || null;
}

// Live exercise identity — travel swap and session substitution aware.
// THE name that gets stamped on sets and used for history lookup.
// ── Auto-substitution engine ──────────────────────────────────────────────────
function getTravelExDetails(subName) {
  const norm = normalizeEx(subName);
  for (const val of Object.values(TRAVEL_MAP)) {
    if (normalizeEx(val.name) === norm) return val;
  }
  return null;
}

function autoSubstituteExercise(key, exIdx, ex) {
  const originalName = stripSuperset(ex.name);
  const muscle = getMuscle(originalName);
  const candidates = SUB_LIBRARY[muscle] || [];
  const isTravel = ST.travelMode;
  const targetTag = isTravel ? 'Travel' : 'Gym';

  const match = candidates.find(c => {
    const norm = normalizeEx(c.name);
    if (c.tag !== targetTag) return false;
    if (ST.blacklistedExercises.has(norm)) return false;
    if (norm === normalizeEx(originalName)) return false;
    // Must not be the currently active auto-sub name (avoid loops)
    const currentDisplay = liveExName(key, ex);
    if (norm === normalizeEx(currentDisplay)) return false;
    return true;
  });

  if (match) {
    ST.workoutAutoSubs[key] = match.name;
    if (isTravel) {
      const details = getTravelExDetails(match.name);
      ST.workoutAutoSubMeta[key] = {
        sets: details ? details.sets : (ex.workingSets || 3),
        reps: details ? details.reps : (ex.reps || '12–15')
      };
    } else {
      ST.workoutAutoSubMeta[key] = {
        sets: ex.workingSets || 3,
        reps: ex.reps || '8–10'
      };
    }
    return true;
  }
  return false;
}

function applyAutoSubstitutions() {
  if (!ST.workoutAutoSubs) ST.workoutAutoSubs = {};
  if (!ST.workoutAutoSubMeta) ST.workoutAutoSubMeta = {};
  
  // Clear previous auto-substitutions
  for (const k in ST.workoutAutoSubs) delete ST.workoutAutoSubs[k];
  for (const k in ST.workoutAutoSubMeta) delete ST.workoutAutoSubMeta[k];

  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (!sess) return;

  sess.exercises.forEach((ex, exIdx) => {
    const key = `${sess.id}_${exIdx}`;
    if (ST.workoutSubs && ST.workoutSubs[key]) return; // Skip if manually subbed

    const originalName = stripSuperset(ex.name);
    let displayName = originalName;
    if (ST.travelMode) {
      const travel = TRAVEL_MAP[normalizeEx(originalName)];
      if (travel) displayName = travel.name;
    }

    if (ST.blacklistedExercises.has(normalizeEx(displayName))) {
      autoSubstituteExercise(key, exIdx, ex);
    }
  });
}

function liveExName(key, ex) {
  // Additions own their identity outright — never travel/sub-mapped.
  if (key && key.indexOf('add_') === 0) {
    const a = additionByKey(key);
    return a ? a.name : (ex ? stripSuperset(ex.name) : '');
  }
  const name = stripSuperset(ex.name);
  if (ST.workoutSubs && ST.workoutSubs[key]) return ST.workoutSubs[key];
  if (ST.workoutAutoSubs && ST.workoutAutoSubs[key]) return ST.workoutAutoSubs[key];
  const travel = ST.travelMode && TRAVEL_MAP[normalizeEx(name)];
  if (travel) return travel.name;
  return name;
}

// Effective set count / rep range for a slot — honours custom counts on a
// substituted slot (Decision 2) and addition cards, else the programmed value.
function effSetCount(key, ex) {
  if (key && key.indexOf('add_') === 0) {
    const a = additionByKey(key);
    return a ? a.sets : 3;
  }
  if (ST.workoutSubs && ST.workoutSubs[key] && ST.workoutSubMeta && ST.workoutSubMeta[key] && ST.workoutSubMeta[key].sets)
    return ST.workoutSubMeta[key].sets;
  if (ST.workoutAutoSubs && ST.workoutAutoSubs[key] && ST.workoutAutoSubMeta && ST.workoutAutoSubMeta[key] && ST.workoutAutoSubMeta[key].sets)
    return ST.workoutAutoSubMeta[key].sets;
  return (ex && ex.workingSets) || 3;
}
function effReps(key, ex) {
  if (key && key.indexOf('add_') === 0) {
    const a = additionByKey(key);
    return a ? a.reps : '8–10';
  }
  if (ST.workoutSubs && ST.workoutSubs[key] && ST.workoutSubMeta && ST.workoutSubMeta[key] && ST.workoutSubMeta[key].reps)
    return ST.workoutSubMeta[key].reps;
  if (ST.workoutAutoSubs && ST.workoutAutoSubs[key] && ST.workoutAutoSubMeta && ST.workoutAutoSubMeta[key] && ST.workoutAutoSubMeta[key].reps)
    return ST.workoutAutoSubMeta[key].reps;
  const name = ex ? stripSuperset(ex.name) : '';
  const travel = ST.travelMode && TRAVEL_MAP[normalizeEx(name)];
  if (travel) return travel.reps;
  return (ex && ex.reps) || '8–10';
}
// Resolve the exercise descriptor behind any workout key (program slot or
// addition). Returns {ex,name,isAddition,exIdx,addId} or null.
function slotForKey(key) {
  if (key && key.indexOf('add_') === 0) {
    const a = additionByKey(key);
    if (!a) return null;
    return { ex: { name: a.name, workingSets: a.sets, reps: a.reps, rest: a.rest || '2–3 min', substitutions: [] },
             name: a.name, isAddition: true, addId: a.id };
  }
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  const exIdx = parseInt(key.split('_').pop());
  const ex = sess && sess.exercises[exIdx];
  if (!ex) return null;
  return { ex, name: stripSuperset(ex.name), isAddition: false, exIdx };
}

}

let NP = { el: null, key: null, si: null, exIdx: null, field: 'w', isWu: false, fresh: true };

function openNumpad(inputEl, key, si, exIdx, field, isWu = false) {
  NP = { el: inputEl, key, si, exIdx, field, isWu, fresh: true };
  document.querySelectorAll('.np-focus').forEach(e => e.classList.remove('np-focus'));

    chipsEl.innerHTML = field === 'w'
      ? `<button class="np-chip" onclick="npAdjust(-5)">−5</button>
         <button class="np-chip" onclick="npAdjust(-2.5)">−2.5</button>
         <button class="np-chip np-up" onclick="npAdjust(2.5)">+2.5</button>
         <button class="np-chip np-up" onclick="npAdjust(5)">+5</button>`
      : `<button class="np-chip" onclick="npAdjust(-1)">−1</button>
         <button class="np-chip np-up" onclick="npAdjust(1)">+1</button>`;
  }
  const action = document.getElementById('np-action');
  if (action) {
    action.textContent = field === 'w' ? 'Next · reps' : '✓ Log set';
    action.classList.toggle('np-log', field === 'r');

function closeNumpad() {
  const np = document.getElementById('numpad');
  if (np) np.classList.remove('open');
  document.body.classList.remove('numpad-open');
  document.querySelectorAll('.np-focus').forEach(e => e.classList.remove('np-focus'));
  NP.el = null;
}

function _npCommitDraft() {
  if (!NP.key) return;
  if (NP.isWu) markDraftWu(NP.key); else markDraft(NP.key, NP.si);
}

function npAdjust(delta) {
  if (!NP.el) return;
  const cur = parseFloat(NP.el.value) || 0;
  let v = Math.max(0, cur + delta);
  v = NP.field === 'r' ? Math.round(v) : Math.round(v * 2) / 2;
  NP.el.value = Number.isInteger(v) ? String(v) : v.toFixed(1);
  NP.fresh = false;
  haptic('tick');
  _npCommitDraft();
}

function npKey(k) {
  if (!NP.el) return;
  let v = String(NP.el.value || '');
  if (k === 'del')      v = NP.fresh ? '' : v.slice(0, -1);
  else if (k === '.') {
    if (NP.field === 'r') return;                  // no decimals on reps
    if (NP.fresh) v = '0.';
    else if (!v.includes('.')) v += '.';
  } else {
    v = NP.fresh ? k : (v + k);                    // first key replaces — select-all semantics
  }
  if (v.length > 6) return;
  NP.fresh = false;
  NP.el.value = v;
  haptic('tick');
  _npCommitDraft();
}

function numpadAction() {
  if (!NP.el) return;
  const { key, si, exIdx, field, isWu } = NP;
  if (isWu) {
    if (field === 'w') {
      const ri = document.getElementById('wuri-' + key);
      if (ri) openNumpad(ri, key, 0, exIdx, 'r', true);
    } else { closeNumpad(); logWarmup(key); }
    return;
  }
  if (field === 'w') {
    const ri = document.getElementById('ri-' + key + '-' + si);
    if (ri) openNumpad(ri, key, si, exIdx, 'r', false);
  } else { closeNumpad(); logSet(key, si, exIdx); }
}
