function buildBiometricChart(fb) {
  const R  = fb.trailingReadiness || [];
  const SL = fb.trailingSleep     || [];
  const HV = fb.trailingHRV       || [];
  const N  = Math.max(R.length, SL.length, HV.length, 0);

  if (N < 2) {
    return `<svg viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
      <text x="150" y="52" text-anchor="middle" font-family="'Cormorant Garamond',serif"
        font-style="italic" font-size="13" fill="#8C8680" opacity="0.45">
        complete more sessions to build your trail
      </text></svg>`;
  }

  const DAYS_SHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const today      = new Date();
  const labels     = [];
  for (let i = N - 1; i >= 0; i--) {
    const d = new Date(today); d.setDate(today.getDate() - i);
    labels.push(DAYS_SHORT[d.getDay()]);
  }

  const W = 300, H = 100, PX = 16, PT = 8, LH = 14;
  const chartH = H - PT - LH;
  const uid = 'c' + Math.random().toString(36).slice(2, 6);

  function normSeries(arr) {
    const sl = arr.slice(-N);
    // Pad if shorter
    while (sl.length < N) sl.unshift(sl[0] ?? 0);
    const mn = Math.min(...sl), mx = Math.max(...sl);
    const rng = mx - mn || 1;
    return sl.map(v => (v - mn) / rng);
  }

  function catmullRom(pts) {
    if (pts.length < 2) return '';
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[Math.max(0, i - 1)];
      const p1 = pts[i], p2 = pts[i + 1];
      const p3 = pts[Math.min(pts.length - 1, i + 2)];
      const cp1x = p1[0] + (p2[0] - p0[0]) / 6;
      const cp1y = p1[1] + (p2[1] - p0[1]) / 6;
      const cp2x = p2[0] - (p3[0] - p1[0]) / 6;
      const cp2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ` C${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`;
    }
    return d;
  }

  function toPoints(norm) {
    return norm.map((v, i) => [
      PX + (i / (N - 1)) * (W - PX * 2),
      PT + (1 - v) * chartH
    ]);
  }

  function areaClose(path, pts) {
    const lx = pts[pts.length - 1][0].toFixed(1);
    const by = (PT + chartH).toFixed(1);
    return `${path} L${lx},${by} L${pts[0][0].toFixed(1)},${by} Z`;
  }

  const rN  = normSeries(R);
  const slN = normSeries(SL);
  const hvN = normSeries(HV);
  const rPts  = toPoints(rN);
  const slPts = toPoints(slN);
  const hvPts = toPoints(hvN);
  const rPath  = catmullRom(rPts);
  const slPath = catmullRom(slPts);
  const hvPath = catmullRom(hvPts);

  // Tick marks + labels
  const ticks = labels.map((lbl, i) => {
    const x = PX + (i / (N - 1)) * (W - PX * 2);
    return `
      <line x1="${x.toFixed(1)}" y1="${(PT + chartH + 1).toFixed(1)}"
            x2="${x.toFixed(1)}" y2="${(PT + chartH + 3).toFixed(1)}"
        stroke="#8C8680" stroke-width="0.75" opacity="0.35"/>
      <text x="${x.toFixed(1)}" y="${H - 1}" text-anchor="middle"
        font-family="var(--font-body,monospace)" font-size="7" letter-spacing="0.06em"
        fill="#8C8680" opacity="0.50">${lbl}</text>`;
  }).join('');

  // Today vertical rule
  const todayX = (W - PX).toFixed(1);

  return `<svg id="ana-trail-svg-${uid}" data-uid="${uid}"
      viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
      width="100%" height="100%" preserveAspectRatio="none">
    <defs>
      <linearGradient id="gr-r-${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#28A745" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#28A745" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gr-sl-${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#B8860B" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="#B8860B" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="gr-hv-${uid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%"   stop-color="#1A5276" stop-opacity="0.16"/>
        <stop offset="100%" stop-color="#1A5276" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- Today rule -->
    <line x1="${todayX}" y1="${PT}" x2="${todayX}" y2="${(PT + chartH).toFixed(1)}"
      stroke="#8C8680" stroke-width="0.6" opacity="0.18" stroke-dasharray="2.5,3"/>

    <!-- HRV band -->
    <path d="${areaClose(hvPath, hvPts)}" fill="url(#gr-hv-${uid})"/>
    <path d="${hvPath}" fill="none" stroke="#1A5276"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.70"/>

    <!-- Sleep band -->
    <path d="${areaClose(slPath, slPts)}" fill="url(#gr-sl-${uid})"/>
    <path d="${slPath}" fill="none" stroke="#B8860B"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.72"/>

    <!-- Readiness band (topmost) -->
    <path d="${areaClose(rPath, rPts)}" fill="url(#gr-r-${uid})"/>
    <path d="${rPath}" fill="none" stroke="#28A745"
      stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.92"/>

    <!-- Pointer (hidden by default) -->
    <line id="ana-ptr-${uid}" x1="0" y1="${PT}" x2="0" y2="${(PT + chartH).toFixed(1)}"
      stroke="#1A1714" stroke-width="0.75" opacity="0.22" stroke-dasharray="2,3"
      display="none"/>

    <!-- Data point dots at each day -->
    ${rPts.map((p, i) => `
      <circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.2"
        fill="#28A745" opacity="0.80"
        style="filter:drop-shadow(0 0 2px #28A74580)"/>
    `).join('')}

    ${ticks}
  </svg>`;
}

function initChartHover(fb) {
  const body    = document.getElementById('ana-chart-body');
  const popover = document.getElementById('ana-popover');
  if (!body || !popover) return;

  const svgEl = body.querySelector('svg');
  if (!svgEl) return;

  const R  = fb.trailingReadiness || [];
  const SL = fb.trailingSleep     || [];
  const HV = fb.trailingHRV       || [];
  const N  = Math.max(R.length, SL.length, HV.length, 0);
  if (N < 2) return;

  const uid    = svgEl.dataset.uid;
  const ptr    = document.getElementById(`ana-ptr-${uid}`);
  const W      = 300, PX = 16;
  const chartW = W - PX * 2;

  const DAYS_LONG = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const today = new Date();

  function getDayLabel(idxFromEnd) {
    const d = new Date(today);
    d.setDate(today.getDate() - idxFromEnd);
    return DAYS_LONG[d.getDay()];
  }

  function onMove(clientX) {
    const rect   = svgEl.getBoundingClientRect();
    const relX   = (clientX - rect.left) / rect.width; // 0–1
    const normX  = (relX * W - PX) / chartW;           // 0–1 within chart
    const idx    = Math.round(Math.max(0, Math.min(1, normX)) * (N - 1));
    const svgX   = PX + (idx / (N - 1)) * chartW;

    if (ptr) {
      ptr.setAttribute('x1', svgX.toFixed(1));
      ptr.setAttribute('x2', svgX.toFixed(1));
      ptr.setAttribute('display', 'block');
    }

    const rVal  = R[R.length  - N + idx]  ?? null;
    const slVal = SL[SL.length - N + idx] ?? null;
    const hvVal = HV[HV.length - N + idx] ?? null;
    const dayName = getDayLabel(N - 1 - idx);

    popover.innerHTML = `
      <div class="ana-popover-day">${dayName}</div>
      <div class="ana-popover-row">
        <div class="ana-popover-dot" style="background:#28A745"></div>
        Readiness
        <span class="ana-popover-val">${rVal !== null ? rVal : '–'}</span>
      </div>
      <div class="ana-popover-row">
        <div class="ana-popover-dot" style="background:#B8860B"></div>
        Sleep
        <span class="ana-popover-val">${slVal !== null ? slVal : '–'}</span>
      </div>
      <div class="ana-popover-row">
        <div class="ana-popover-dot" style="background:#1A5276"></div>
        HRV
        <span class="ana-popover-val">${hvVal !== null ? hvVal : '–'}</span>
      </div>`;

    popover.classList.add('visible');

    // Position popover: keep it inside bounds
    const bodyRect = body.getBoundingClientRect();
    const px = clientX - bodyRect.left + 10;
    const py = 10;
    const maxLeft = bodyRect.width - 148;
    popover.style.left = `${Math.max(4, Math.min(px, maxLeft))}px`;
    popover.style.top  = `${py}px`;
  }

  body.addEventListener('mousemove',  e => onMove(e.clientX));
  body.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e.touches[0].clientX); }, { passive: false });
  body.addEventListener('mouseleave', () => {
    popover.classList.remove('visible');
    if (ptr) ptr.setAttribute('display','none');
  });
  body.addEventListener('touchend',   () => {
    setTimeout(() => {
      popover.classList.remove('visible');
      if (ptr) ptr.setAttribute('display','none');
    }, 1800);
  });
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  GOOGLE HEALTH API — DIRECT CLIENT (Google Identity Services)            ║
// ║  The Health API rejects tokens that mix health scopes with broad scopes  ║
// ║  (DISALLOWED_OAUTH_SCOPES), which kills any Apps Script proxy. So the    ║
// ║  PWA talks to health.googleapis.com itself: GIS token client, public     ║
// ║  client ID (no secret — by design), token carries ONLY health scopes.    ║
// ║  Sheets sync stays on Apps Script, untouched.                            ║
// ╚══════════════════════════════════════════════════════════════════════════╝
const GH_CLIENT_ID = '__GH_CLIENT_ID__';
const GH_SCOPES = [
  'https://www.googleapis.com/auth/googlehealth.sleep.readonly',
  'https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly',
  'https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly',
].join(' ');
const GH_API = 'https://health.googleapis.com/v4/users/me';

function ghTokenValid() {
  const t = LS.get('dcrgym_gh_token', null);
  return (t && t.token && t.exp && t.exp > Date.now() + 60000) ? t.token : null;
}

function _ghLoadGis() {
  return new Promise((resolve, reject) => {
    if (window.google && google.accounts && google.accounts.oauth2) return resolve();
    const s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.onload = () => resolve();
    s.onerror = () => reject(new Error('GIS load failed'));
    document.head.appendChild(s);
  });
}

// interactive=true must be called from a user gesture (the connect chip tap)
async function ghGetToken(interactive) {
  const cached = ghTokenValid();
  if (cached) return cached;
  if (!GH_CLIENT_ID || GH_CLIENT_ID.indexOf('__') === 0) return null; // not configured
  await _ghLoadGis();
  return new Promise((resolve) => {
    try {
      const tc = google.accounts.oauth2.initTokenClient({
        client_id: GH_CLIENT_ID,
        scope: GH_SCOPES,
        callback: (resp) => {
          if (resp && resp.access_token) {
            LS.set('dcrgym_gh_token', { token: resp.access_token, exp: Date.now() + ((resp.expires_in || 3500) * 1000) });
            LS.set('dcrgym_gh_connected', true);
            resolve(resp.access_token);
          } else resolve(null);
        },
        error_callback: () => resolve(null),
      });
      tc.requestAccessToken({ prompt: interactive ? '' : 'none' });
    } catch(e) { resolve(null); }
  });
}

async function ghFetch(token, path, params) {
  let url = GH_API + path;
  if (params) {
    url += (url.includes('?') ? '&' : '?') + Object.entries(params)
      .map(([k, v]) => k + '=' + encodeURIComponent(v)).join('&');
  }
  const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token, Accept: 'application/json' } });
  if (res.status === 401 || res.status === 403) { LS.set('dcrgym_gh_token', null); throw new Error('auth-' + res.status); }
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

const GH_NUM_KEYS  = ['bpm', 'beatsPerMinute', 'rmssd', 'milliseconds', 'dailyRmssd', 'value', 'percentage', 'avg', 'average'];
const GH_SKIP_KEYS = { interval:1, sampleTime:1, civilTime:1, civilStartTime:1, civilEndTime:1, date:1, time:1, dataSource:1, name:1, createTime:1, updateTime:1, metadata:1 };

function ghFirstNumber(node, depth = 0) {
  if (node === null || node === undefined || depth > 4) return null;
  if (typeof node === 'number' && isFinite(node)) return node;
  if (typeof node === 'string' && node !== '' && isFinite(Number(node))) return Number(node);
  if (typeof node !== 'object') return null;
  for (const k of GH_NUM_KEYS) {
    if (node[k] !== undefined) { const v = ghFirstNumber(node[k], depth + 1); if (v !== null) return v; }
  }
  for (const k in node) {
    if (GH_SKIP_KEYS[k]) continue;
    const v = ghFirstNumber(node[k], depth + 1);
    if (v !== null) return v;
  }
  return null;
}

function ghLocalDate(d) {
  const dt = d ? new Date(d) : new Date();
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}

function ghSleepEndDate(s) {
  if (s.interval && s.interval.civilEndTime && s.interval.civilEndTime.date) {
    const d = s.interval.civilEndTime.date;
    return d.year + '-' + String(d.month).padStart(2, '0') + '-' + String(d.day).padStart(2, '0');
  }
  if (s.interval && s.interval.endTime) return ghLocalDate(s.interval.endTime);
  return null;
}

function ghComputeSleepScore(totalMins, deepMins, remMins, efficiency) {
  if (!totalMins || totalMins < 90) return null;
  const durScore  = totalMins < 300 ? (totalMins/300)*40 : totalMins < 420 ? 40+((totalMins-300)/120)*30 : totalMins <= 540 ? 70+((totalMins-420)/120)*25 : 95-((totalMins-540)/60)*5;
  const deepScore = deepMins ? Math.min(100, (deepMins/totalMins)*100/0.18) : 40;
  const remScore  = remMins  ? Math.min(100, (remMins/totalMins)*100/0.20)  : 40;
  const effScore  = efficiency ? Math.min(100, efficiency) : 80;
  return Math.max(0, Math.min(100, Math.round(Math.min(durScore,95)*0.35 + deepScore*0.30 + remScore*0.20 + effScore*0.15)));
}

function ghComputeReadiness(rhr, hrv, sleepScore) {
  const pillars = [];
  if (sleepScore !== null && sleepScore !== undefined) pillars.push(['sleep quality', sleepScore]);
  if (hrv !== null && hrv !== undefined)               pillars.push(['hrv recovery', Math.min(100, Math.round((hrv / 80) * 100))]);
  if (rhr !== null && rhr !== undefined)               pillars.push(['resting heart rate', Math.max(0, Math.round(100 - (rhr - 45)))]);
  if (!pillars.length) return { score: null, factor: null };
  const avg = Math.round(pillars.reduce((s, p) => s + p[1], 0) / pillars.length);
  return { score: Math.max(0, Math.min(100, avg)), factor: pillars.sort((a, b) => a[1] - b[1])[0][0] };
}

// Three requests total: sleep (7d reconciled), RHR (7d), HRV (7d) — bucketed
// client-side into today's payload + trailing sparkline arrays.
async function ghPullAll(token) {
  const today = ghLocalDate();
  const weekAgo = ghLocalDate(Date.now() - 7 * 86400000);

  const [sleepData, rhrData, hrvData, spo2Data] = await Promise.all([
    ghFetch(token, '/dataTypes/sleep/dataPoints:reconcile', {
      dataSourceFamily: 'users/me/dataSourceFamilies/google-wearables',
      filter: `sleep.interval.civil_end_time >= "${weekAgo}"`,
    }).catch(e => { if (String(e.message).indexOf('auth') === 0) throw e; return null; }),
    ghFetch(token, '/dataTypes/daily-resting-heart-rate/dataPoints', {
      filter: `daily_resting_heart_rate.sample_time.civil_time >= "${weekAgo}T00:00:00"`, page_size: 31,
    }).catch(e => { if (String(e.message).indexOf('auth') === 0) throw e; return null; }),
    ghFetch(token, '/dataTypes/daily-heart-rate-variability/dataPoints', {
      filter: `daily_heart_rate_variability.sample_time.civil_time >= "${weekAgo}T00:00:00"`, page_size: 31,
    }).catch(e => { if (String(e.message).indexOf('auth') === 0) throw e; return null; }),
    ghFetch(token, '/dataTypes/daily-oxygen-saturation/dataPoints', {
      filter: `daily_oxygen_saturation.sample_time.civil_time >= "${weekAgo}T00:00:00"`, page_size: 31,
    }).catch(() => null),
  ]);

  // Sleep by end-date — keep the best (main/longest) session per day
  const sleepByDay = {};
  ((sleepData && sleepData.dataPoints) || []).forEach(p => {
    const s = p.sleep || {};
    const day = ghSleepEndDate(s);
    if (!day || !s.summary) return;
    const mins = parseInt(s.summary.minutesAsleep || 0, 10);
    const rank = ((s.metadata && s.metadata.main) ? 100000 : 0) + mins;
    if (!sleepByDay[day] || rank > sleepByDay[day]._rank) {
      let deep = null, rem = null, light = null;
      (s.summary.stagesSummary || []).forEach(st => {
        const m = parseInt(st.minutes || 0, 10);
        if (st.type === 'DEEP') deep = m;
        if (st.type === 'REM') rem = m;
        if (st.type === 'LIGHT') light = m;
      });
      const total  = parseInt(s.summary.minutesAsleep || 0, 10) || null;
      const period = parseInt(s.summary.minutesInSleepPeriod || 0, 10);
      const eff    = (total && period) ? Math.round((total / period) * 100) : null;
      sleepByDay[day] = { _rank: rank, score: ghComputeSleepScore(total, deep, rem, eff), deep, rem, light, total };
    }
  });

  // Daily metrics by date
  function byDay(data, camelKey) {
    const out = {};
    ((data && data.dataPoints) || []).forEach(p => {
      const node = p[camelKey] || p;
      let day = null;
      const stp = node.sampleTime || (node[camelKey] && node[camelKey].sampleTime);
      if (stp && stp.civilTime && stp.civilTime.date) {
        const d = stp.civilTime.date;
        day = d.year + '-' + String(d.month).padStart(2, '0') + '-' + String(d.day).padStart(2, '0');
      } else if (stp && stp.physicalTime) day = ghLocalDate(stp.physicalTime);
      else if (node.interval && node.interval.startTime) day = ghLocalDate(node.interval.startTime);
      const v = ghFirstNumber(node);
      if (day && v !== null && out[day] === undefined) out[day] = Math.round(v * 10) / 10;
    });
    return out;
  }
  const rhrByDay  = byDay(rhrData,  'dailyRestingHeartRate');
  const hrvByDay  = byDay(hrvData,  'dailyHeartRateVariability');
  const spo2ByDay = byDay(spo2Data, 'dailyOxygenSaturation');

  // Trailing 7-day arrays (oldest → today)
  const trailingReadiness = [], trailingSleep = [], trailingHRV = [];
  for (let i = 6; i >= 0; i--) {
    const day = ghLocalDate(Date.now() - i * 86400000);
    const slp = sleepByDay[day] || {};
    const rd  = ghComputeReadiness(rhrByDay[day] ?? null, hrvByDay[day] ?? null, slp.score ?? null);
    trailingReadiness.push(rd.score);
    trailingSleep.push(slp.score ?? null);
    trailingHRV.push(hrvByDay[day] ?? null);
  }

  const tSleep = sleepByDay[today] || {};
  const tRhr = rhrByDay[today] ?? null;
  const tHrv = hrvByDay[today] ?? null;
  const readiness = ghComputeReadiness(tRhr, tHrv, tSleep.score ?? null);

  return {
    readinessScore:    readiness.score,
    readinessFactor:   readiness.factor,
    sleepScore:        tSleep.score ?? null,
    restingHR:         tRhr,
    hrv:               tHrv,
    spo2:              spo2ByDay[today] ?? null,
    deepSleepMinutes:  tSleep.deep ?? null,
    remSleepMinutes:   tSleep.rem ?? null,
    lightSleepMinutes: tSleep.light ?? null,
    fetchedAt:         today,
    trailingReadiness, trailingSleep, trailingHRV,
    source: 'google-health-direct',
  };
}

// User-gesture entry point — the reconnect chip calls this
function ghConnect() { fetchFitbitData(true, true); }

async function fetchFitbitData(force = false, interactive = false) {
  // Cache-first: skip only if we have a fresh successful fetch from today AND not forced
  if (!force) {
    const today = ghLocalDate();
    if (ST.fitbit.fetchedAt === today && ST.fitbit.connected) return;
  }

  // Spin the refresh button + skeleton shimmer on the pods
  const btn = document.querySelector('.ana-refresh-btn') || document.querySelector('#ana-refresh');
  if (btn) {
    btn.style.animation = 'ana-spin 0.9s linear infinite';
    btn.style.opacity   = '0.65';
    btn.disabled        = true;
  }
  const anaScr = document.getElementById('screen-analysis');
  if (anaScr) anaScr.classList.add('ana-loading');

  try {
    let token = ghTokenValid();
    if (!token) {
      // Silent attempt if previously connected; interactive only from the chip tap
      const wasConnected = LS.get('dcrgym_gh_connected', false);
      if (interactive || wasConnected) token = await ghGetToken(interactive);
    }
    if (!token) {
      ST.fitbit.connected = false;
      ST.fitbit.authUrl = null;
      if (ST.screen === 'analysis') renderAnalysis();
      return;
    }
    const payload = await ghPullAll(token);
    Object.assign(ST.fitbit, payload, { connected: true, lastSync: Date.now() });
    LS.set('dcrgym_fitbit', ST.fitbit);
    if (ST.screen === 'analysis') renderAnalysis();
    if (ST.screen === 'home') renderHome();   // boarding-pass readiness chip stays current
  } catch(e) {
    console.error('[DCR Gym] Health fetch failed:', e.message);
    if (String(e.message).indexOf('auth') === 0) {
      ST.fitbit.connected = false;
      if (ST.screen === 'analysis') renderAnalysis();
    }
    if (btn) {
      btn.style.animation = '';
      btn.style.opacity   = '0.30';
      btn.disabled        = false;
    }
  } finally {
    if (anaScr) anaScr.classList.remove('ana-loading');
  }
}

function exportCSV() {
  const hist = getHistory();
  let csv = 'Date,Program,Session,Exercise,Set,Weight,Reps\n';
  for (const w of hist) {
    const prog = PROGRAMS.find(p => p.id === w.programId);
    if (!prog) continue;
    const sess = prog.sessions.find(s => s.id === w.sessionId);
    if (!sess) continue;
    const date = new Date(w.endTime).toISOString().split('T')[0];
    for (const [key, sets] of Object.entries(w.sets || {})) {
      const exIdx = parseInt(key.split('_').pop());
      const ex = sess.exercises[exIdx];
      if (!ex) continue;
      sets.forEach((s, i) => {
        csv += `${date},${prog.name},${sess.name},${stripSuperset(ex.name)},${i+1},${s.w||0},${s.r||0}\n`;
      });
    }
  }
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'dcrgym-history.csv'; a.click();
  URL.revokeObjectURL(url);
}

function importStrongCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) { noticeSheet('Import failed', 'No data found in that CSV.'); return; }

    // Auto-detect separator
    const sep = lines[0].includes(';') ? ';' : ',';

    // Read header row and map column names → indices dynamically.
    // This handles all Strong export versions regardless of column order.
    const header = lines[0].split(sep).map(c => c.replace(/^"|"$/g,'').trim().toLowerCase());
    const col = name => header.findIndex(h => h === name || h.startsWith(name));
    const colDate     = col('date');
    const colExName   = col('exercise name');
    const colSetOrder = col('set order');
    const colWeight   = header.findIndex(h => h.startsWith('weight'));
    const colReps     = col('reps');

    if (colDate === -1 || colExName === -1 || colReps === -1) {
      noticeSheet('Import failed', 'Could not detect the required columns (Date, Exercise Name, Reps). Is this a Strong CSV export?');
      return;
    }

    const hist = getHistory();
    let parsed = 0;
    let currentDate = null, currentWorkout = null;

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(sep).map(c => c.replace(/^"|"$/g,'').trim());
      const dateStr   = cols[colDate]     || '';
      const exName    = cols[colExName]   || '';
      const setType   = colSetOrder !== -1 ? (cols[colSetOrder] || '') : '';
      const weightStr = colWeight  !== -1 ? (cols[colWeight]   || '0') : '0';
      const repsStr   = cols[colReps]     || '';

      if (!dateStr || !exName) continue;
      if (setType === 'W' || setType === 'Note' || exName === 'Rest Timer') continue;

      const date = new Date(dateStr).getTime();
      if (isNaN(date)) continue;

      if (!currentWorkout || currentDate !== dateStr) {
        if (currentWorkout) hist.push(currentWorkout);
        currentDate = dateStr;
        currentWorkout = { id: date.toString(), programId: 'import', sessionId: 'import', sessionName: 'Strong Import', startTime: date, endTime: date + 3600000, duration: 3600, travelMode: false, sets: {} };
        parsed++;
      }

      const clean = exName.replace(/\s*\([^)]*\)/g,'').trim();
      const key = 'import_' + clean.replace(/\s/g,'_').toLowerCase();
      if (!currentWorkout.sets[key]) currentWorkout.sets[key] = [];
      currentWorkout.sets[key].push({ w: parseFloat(weightStr)||0, r: parseInt(repsStr)||0, ts: date, _name: clean });
    }

    if (currentWorkout) hist.push(currentWorkout);
    saveHistory(hist);
    noticeSheet('Import complete', 'Imported ' + parsed + ' workouts from Strong.');
    input.value = '';
  };
  reader.readAsText(file);
}

  // 1. Persist selection
  if (onboardProg) {
    ST.defaultProgram = onboardProg;
    LS.set('dcrgym_default_prog', onboardProg);

  if (obEl) { obEl.innerHTML = ''; obEl.style.display = 'none'; obEl.classList.remove('active'); }

  // 3. requestAnimationFrame — let browser repaint cleared state before mounting home
  requestAnimationFrame(() => {
    Maps('home');

}

async function pullFromSheets() {
  const s = getSettings();
  if (!s.sheets) return;
  try {
    const resp = await fetch(s.sheets + '?action=pullState');
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.ok && Array.isArray(data.history) && data.history.length > 0) {
      const local = getHistory();
      const merged = mergeHistories(local, data.history);
      if (merged.length > local.length) saveHistory(merged);
    }
  } catch(e) { /* silent — background op */ }
}

// ── Sync queue — queue-first persistence layer ────────────────────────────────
// Every payload is enqueued before the fetch attempt. On fetch success, it is
// dequeued. On any failure (online or offline), it stays queued and drains on
// next boot or on connectivity restore. Nothing is ever silently dropped.

function enqueueSyncPayload(payload) {
  let queue = LS.get('dcrgym_sync_queue', []);
  // Deduplicate by action + ts to avoid pile-up on retries
  const key = (payload.action || '') + (payload.ts || '');
  if (key && queue.some(i => (i.payload.action || '') + (i.payload.ts || '') === key)) return;
  queue.push({ payload, ts: Date.now() });
  // Cap at 50 entries — keep newest, drop oldest saveState entries first
  if (queue.length > 50) {
    const saveStateIdxs = queue.map((i,n) => i.payload.action==='saveState'?n:-1).filter(n=>n>=0);
    if (saveStateIdxs.length > 1) queue.splice(saveStateIdxs[0], 1); // drop oldest saveState
    else queue.shift(); // drop oldest entry
  }
  LS.set('dcrgym_sync_queue', queue);
}

function dequeueSyncPayload(payload) {
  const key = (payload.action || '') + (payload.ts || '');
  if (!key) return;
  const queue = LS.get('dcrgym_sync_queue', []);
  const filtered = queue.filter(i => (i.payload.action || '') + (i.payload.ts || '') !== key);
  LS.set('dcrgym_sync_queue', filtered);
}

async function drainSyncQueue() {
  const s = getSettings();
  if (!s.sheets) return;
  const queue = LS.get('dcrgym_sync_queue', []);
  if (!queue.length) return;
  const failed = [];
  for (const item of queue) {
    try {
      const resp = await fetch(s.sheets, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(item.payload)
      });
      if (!resp.ok) failed.push(item);
      // success — item is NOT added to failed → effectively dequeued
    } catch(e) { failed.push(item); }
  }
  LS.set('dcrgym_sync_queue', failed);
}

// Drain on connectivity restore AND on every boot (see bootstrapApp)
window.addEventListener('online', () => { drainSyncQueue().catch(() => {}); });

// ── JSON full-fidelity backup export ─────────────────────────────────────────
function exportJSON() {
  const hist = getHistory();
  const blob = new Blob([JSON.stringify({ version: 2, exportedAt: Date.now(), history: hist }, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url; a.download = `dcrgym-backup-${date}.json`; a.click();
  URL.revokeObjectURL(url);
}

// ── JSON full-fidelity backup import ─────────────────────────────────────────
function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const incoming = Array.isArray(data) ? data : (data.history || []);
      if (!incoming.length) { noticeSheet('Restore failed', 'No workout history found in this backup file.'); return; }
      const local  = getHistory();
      const merged = mergeHistories(local, incoming);
      const added  = merged.length - local.length;
      saveHistory(merged);
      bgSyncToSheets().catch(() => {});
      noticeSheet('Backup restored', `Restored ${added} new workout${added !== 1 ? 's' : ''} from backup. Total: ${merged.length}.`);
    } catch(err) {
      noticeSheet('Restore failed', 'Could not read that backup file. Make sure it is a valid DCR Gym JSON export.');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

async function bgSyncToSheets() {
  const s = getSettings();
  if (!s.sheets) return;
  const hist = getHistory();

  // ── Full state blob ───────────────────────────────────────────────────────
  // Queue-first: enqueue immediately as insurance, then attempt live fetch.
  // If fetch succeeds, dequeue. If it fails for ANY reason (online or offline),
  // the payload stays in the queue and will be drained on next boot or reconnect.
  const statePayload = { action: 'saveState', history: hist, ts: Date.now() };
  enqueueSyncPayload(statePayload);
  try {
    const r = await fetch(s.sheets, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(statePayload)
    });
    if (r.ok) dequeueSyncPayload(statePayload);
  } catch(e) { /* stays queued — will drain on next boot */ }

  // ── Human-readable workout rows ───────────────────────────────────────────
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(ss => ss.id === ST.currentSession);
  if (prog && sess && hist.length > 0) {
    const last = hist[hist.length - 1];
    const exercises = sess.exercises.map((ex, i) => {
      const key = `${sess.id}_${i}`;
      const sets = (last.sets[key] || []).filter(s => s && s.r > 0 && !key.endsWith('_wu')).map(s => ({ weight: s.w, reps: s.r }));
      return { name: stripSuperset(ex.name), sets };
    }).filter(ex => ex.sets.length);
    const rowPayload = {
      action: 'syncWorkouts',
      workouts: [{
        id: last.id, date: last.endTime,
        programName: prog.name, sessionName: sess.name,
        duration: last.duration,
        totalE1RM: getSessionE1RM(last, prog),
        totalSets: exercises.reduce((n, e) => n + e.sets.length, 0),
        exercises
      }]
    };
    enqueueSyncPayload(rowPayload);
    try {
      const r2 = await fetch(s.sheets, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(rowPayload)
      });
      if (r2.ok) dequeueSyncPayload(rowPayload);
    } catch(e) { /* stays queued */ }
  }
}

async function manualSync() {
  const btn = document.getElementById('sync-now-btn');
  if (btn) { btn.textContent = 'Syncing…'; btn.disabled = true; }
  const s = getSettings();
  if (!s.sheets) { if (btn) { btn.textContent = 'No URL set'; btn.disabled = false; } return; }
  try {
    await Promise.all([pullFromSheets(), bgSyncToSheets()]);
    if (btn) { btn.textContent = 'Synced ✓'; setTimeout(()=>{ btn.textContent='Sync Now'; btn.disabled=false; }, 2000); }
  } catch(e) {
    if (btn) { btn.textContent = 'Error'; btn.disabled = false; }
  }
}

async function recoverFromCloud() {
  const btn = document.getElementById('recover-btn');
  const s = getSettings();
  if (!s.sheets) {
    if (btn) { btn.textContent = 'No URL set'; setTimeout(()=>{ btn.textContent='Recover ↓'; }, 2000); }
    return;
  }
  if (btn) { btn.textContent = 'Pulling…'; btn.disabled = true; }
  try {
    const before = getHistory().length;
    await pullFromSheets();
    const after = getHistory().length;
    const added = after - before;
    if (btn) {
      btn.textContent = added > 0 ? `Restored ${added} workout${added!==1?'s':''}` : 'Up to date ✓';
      setTimeout(()=>{ btn.textContent='Recover ↓'; btn.disabled=false; }, 3000);
    }
    if (added > 0) {
      // Refresh home & history screens to reflect recovered data
      renderHome();
      if (ST.screen === 'history') renderHistory();
    }
  } catch(e) {
    if (btn) { btn.textContent = 'Failed'; btn.disabled = false; }
  }
}

function mergeHistories(local, remote) {
  const map = new Map();
  for (const w of local) if (w.id) map.set(w.id, w);
  for (const w of remote) if (w.id && !map.has(w.id)) map.set(w.id, w);
  return [...map.values()].sort((a, b) => (a.endTime||0) - (b.endTime||0));
}


function checkWeekComplete() {
  const progId = ST.defaultProgram;
  if (!progId) return false;
  const prog = PROGRAMS.find(p => p.id === progId);
  if (!prog) return false;
  const weekStart = (() => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); })();
  const doneThisWeek = new Set(getHistory().filter(w => w.programId === progId && w.endTime >= weekStart).map(w => w.sessionId));
  return prog.sessions.every(s => doneThisWeek.has(s.id));
}

// ── Gatekeeper — verifies (and injects if missing) all required UI root elements ──
// ── Synchronous bootstrap — shell is hard-coded in HTML, no dynamic injection ─
// ── Fault-tolerant bootstrap — all state access inside try/catch, LS proxy only ──
function bootstrapApp() {
  console.log('[DCR Gym Shell] Dispatching boot loop...');

  const splash = document.getElementById('splash');
  const home   = document.getElementById('screen-home');
  const nav    = document.getElementById('bottom-nav');

  // Schema migration — versioned, non-destructive, backs up before touching
  // anything. History survives every app update.
  try { migrateStorage(); } catch(e) { console.warn('[DCR Gym Shell] Migration deferred:', e); }

  // Background-flush — the instant the app is backgrounded or killed, the live
  // workout snapshot is written synchronously. Zero-loss guarantee.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveNow();
  });
  window.addEventListener('pagehide', () => saveNow());

  // ── System back gesture → in-app navigation (never kills the app) ─────────
  // Overlays unwind first, then screens. Maps() pushes screen states.
  try { history.replaceState({ screen: 'home' }, '', '#home'); } catch(e) {}
  window.addEventListener('popstate', (e) => {
    // 1. An open layer always absorbs the back gesture
    const sheet = document.getElementById('bottom-sheet');
    if (sheet && sheet.classList.contains('visible')) { __closeSheetDom(); return; }
    const mg = document.getElementById('muscle-graph-overlay');
    if (mg && mg.classList.contains('visible')) { _closeMuscleGraphDom(); return; }
    const gb = document.getElementById('graph-backdrop');
    if (gb && gb.style.display === 'flex') { closeProgressGraph(); return; }
    // 2. Then navigate to the state's screen
    const target = (e.state && e.state.screen) || 'home';
    if (target !== ST.screen) {
      window.__navFromPop = true;
      try { Maps(target); } finally { window.__navFromPop = false; }
    }
  });

  // State hydration — fully wrapped, LS proxy handles any storage exceptions
  try {
    ST.defaultProgram = LS.get('dcrgym_default_prog');
    // Auto-migrate URL — replace any old script URL with the current V9 deployment
    const CURRENT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcAKZDYOzbSJ1a5OjqYRo9OyL9OIhEhoos8a4aQE5MB68atj7XAWQeyTuulmB6UFUt/exec';
    const storedSettings = LS.get('dcrgym_settings', null);
    if (storedSettings && storedSettings.sheets && storedSettings.sheets !== CURRENT_SCRIPT_URL) {
      storedSettings.sheets = CURRENT_SCRIPT_URL;
      LS.set('dcrgym_settings', storedSettings);
    }
    getSettings();
    // Fitbit hydration — restore last known values; fetchFitbitData will overwrite on tab open
    const storedFitbit = LS.get('dcrgym_fitbit', null);
    if (storedFitbit && typeof storedFitbit === 'object') {
      // Only restore if the stored data was from today — discard stale cached sessions
      const today = new Date().toISOString().slice(0, 10);
      if (storedFitbit.fetchedAt === today) {
        Object.assign(ST.fitbit, storedFitbit);
      } else {
        // Stale cache — clear it so renderAnalysis shows dashes until live fetch completes
        LS.set('dcrgym_fitbit', null);
      }
    }
  } catch(e) {
    console.warn('[DCR Gym Shell] State hydration fault (non-fatal):', e);
  }

  // Service worker — fire-and-forget
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(r => { ST.swReg = r; }).catch(() => {});
  }

  // ── Silent auto-pull from Sheets on every app open ────────────────────────
  pullFromSheets().catch(() => {});

  // ── Drain any pending sync queue items (offline → online recovery) ────────
  drainSyncQueue();

  // Dismiss splash — belt-and-suspenders: remove active class, zero z-index
  if (splash) {
    splash.classList.remove('active');
    splash.style.display = 'none';
    splash.style.pointerEvents = 'none';
    splash.style.zIndex = '-1';
  }

  // Routing — uses LS proxy, no raw localStorage calls
  try {
    const _ob = LS.get('dcrgym_onboarded');
    const onboarded = _ob === true || _ob === 'true';

    if (!onboarded) {
      console.log('[DCR Gym Shell] First launch → onboarding');
      onboardStep = 0;
      onboardProg = null;
      renderOnboarding();
    } else {
      console.log('[DCR Gym Shell] Returning user → home');
      if (home) home.style.display = 'block';
      if (nav)  nav.style.display  = 'flex';
      Maps('home');
    }
  } catch(err) {
    console.error('[DCR Gym Shell] Router fault:', err);
    document.body.innerHTML =
      '<div style="padding:40px;font-family:sans-serif;background:#FAF7F2;color:oklch(44% 0.025 55);min-height:100vh">' +
      '<h2 style="font-family:serif;font-style:italic">[System Boot Fault]</h2>' +
      '<p style="margin-top:10px">' + err.message + '</p>' +
      '<pre style="background:#fff;padding:12px;font-size:11px;overflow-x:auto;margin-top:10px">' + (err.stack || '') + '</pre>' +
      '<button onclick="(function(){if(\'caches\' in window){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}; if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}; setTimeout(function(){location.reload(true)},300)})()" style="margin-top:20px;padding:10px 20px;background:#2A2421;color:#fff;border:none;border-radius:8px;cursor:pointer">Clear Cache &amp; Reload</button>' +
      '<p style="margin-top:8px;font-size:11px;color:#888;font-family:sans-serif">Workout history is preserved.</p>' +
      '</div>';
    return;
  }

  // Background sync — idle, never blocks render path
  setTimeout(() => { pullFromSheets().catch(() => {}); }, 2500);
}

// Isolated fail-safe dispatcher — handles all readyState variants on WebKit/Safari
function runBootSequence() {
  console.log('[DCR Gym Shell] Dispatched main boot loop.');
  try {
    bootstrapApp();
  } catch(fatalError) {
    console.error('[DCR Gym Shell] Boot failed:', fatalError);
    document.body.innerHTML =
      '<div style="padding:40px;font-family:sans-serif;background:#FAF7F2;color:oklch(44% 0.025 55);min-height:100vh">' +
      '<h2 style="font-family:serif;font-style:italic">[System Boot Fault]</h2>' +
      '<p style="margin-top:10px">' + fatalError.message + '</p>' +
      '<pre style="background:#fff;padding:12px;font-size:11px;overflow-x:auto;margin-top:10px">' + (fatalError.stack || '') + '</pre>' +
      '<button onclick="(function(){if(\'caches\' in window){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}; if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}; setTimeout(function(){location.reload(true)},300)})()" style="margin-top:20px;padding:10px 20px;background:#2A2421;color:#fff;border:none;border-radius:8px;cursor:pointer">Clear Cache &amp; Reload</button>' +
      '<p style="margin-top:8px;font-size:11px;color:#888;font-family:sans-serif">Workout history is preserved.</p>' +
      '</div>';
  }
}

// Target all document readyState variants — critical for iOS WebView + Safari
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(runBootSequence, 1);
} else {
  window.addEventListener('load', runBootSequence);
}
</script>
