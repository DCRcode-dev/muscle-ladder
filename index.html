// ── Interactive Plate Calculator Sheet ─────────────────────────────────────────
let _currentPlateCalcKey = null;
let _currentPlateCalcWeight = 45;

function showPlateCalcSheet(name, key, defaultWeight) {
  _currentPlateCalcKey = key;
  const unit = getWeightUnit();
  const barW = unit === 'lb' ? 45 : 20;
  let w = parseFloat(defaultWeight);
  if (isNaN(w) || w < barW) {
    const inp = key ? document.getElementById('wi-' + key + '-0') : null;
    w = (inp && parseFloat(inp.value)) || (getLastPerformance(name) && getLastPerformance(name)[0] ? parseFloat(getLastPerformance(name)[0].w) : barW * 3);
  }
  if (isNaN(w) || w < barW) w = barW;
  _currentPlateCalcWeight = w;

  const html = `
    <div class="plate-calc-container" style="padding: 4px 0 16px;">
      <div class="action-sheet-header">
        <div class="action-sheet-title" style="font-size: var(--fs-xl);">Plate Calculator</div>
        <div class="action-sheet-meta">${name || 'Barbell Exercise'} · ${barW} ${unit} Olympic Bar</div>
      </div>
      <div id="plate-calc-visual" style="margin: 12px 0;">
        ${renderPlatePopover(_currentPlateCalcWeight)}
      </div>
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin: 16px 0 20px;">
        ${unit === 'lb' ? `
        <button class="btn-sheet-ghost pill-btn" onclick="adjustPlateCalcWeight(-10)">-10</button>
        <button class="btn-sheet-ghost pill-btn" onclick="adjustPlateCalcWeight(-5)">-5</button>
        ` : `
        <button class="btn-sheet-ghost pill-btn" onclick="adjustPlateCalcWeight(-5)">-5</button>
        <button class="btn-sheet-ghost pill-btn" onclick="adjustPlateCalcWeight(-2.5)">-2.5</button>
        `}
        <div style="min-width: 110px; text-align: center; font-family: var(--font-mono); font-size: var(--fs-xl); font-weight: 700; color: var(--text-primary); font-variant-numeric: tabular-nums;" id="plate-calc-weight-lbl">
          ${_currentPlateCalcWeight} <span style="font-size: var(--fs-md); color: var(--text-tertiary); font-weight: 500;">${unit}</span>
        </div>
        ${unit === 'lb' ? `
        <button class="btn-sheet-ghost pill-btn" onclick="adjustPlateCalcWeight(5)">+5</button>
        <button class="btn-sheet-ghost pill-btn" onclick="adjustPlateCalcWeight(10)">+10</button>
        ` : `
        <button class="btn-sheet-ghost pill-btn" onclick="adjustPlateCalcWeight(2.5)">+2.5</button>
        <button class="btn-sheet-ghost pill-btn" onclick="adjustPlateCalcWeight(5)">+5</button>
        `}
      </div>
      <div style="display: flex; gap: 8px;">
        ${key ? `<button class="btn btn-primary" style="flex: 1;" onclick="applyPlateCalcWeight('${key}')">Apply to Exercise</button>` : ''}
        <button class="btn btn-sheet-ghost" style="${key ? '' : 'width: 100%;'}" onclick="closeSheet()">Close</button>
      </div>
    </div>
  `;
  openSheet(html);
}

function adjustPlateCalcWeight(delta) {
  const unit = getWeightUnit();
  const barW = unit === 'lb' ? 45 : 20;
  _currentPlateCalcWeight = Math.max(barW, Math.round((_currentPlateCalcWeight + delta) * 10) / 10);
  const vis = document.getElementById('plate-calc-visual');
  const lbl = document.getElementById('plate-calc-weight-lbl');
  if (vis) vis.innerHTML = renderPlatePopover(_currentPlateCalcWeight);
  if (lbl) lbl.innerHTML = `${_currentPlateCalcWeight} <span style="font-size: var(--fs-md); color: var(--text-tertiary); font-weight: 500;">${unit}</span>`;
  haptic('tick');
}

function applyPlateCalcWeight(key) {
  if (!key) { closeSheet(); return; }
  let applied = false;
  const slot = slotForKey(key);
  const totalSets = effSetCount(key, slot ? slot.ex : null);
  for (let si = 0; si < totalSets; si++) {
    const wi = document.getElementById('wi-' + key + '-' + si);
    if (wi && !wi.classList.contains('logged')) {
      wi.value = _currentPlateCalcWeight;
      markDraft(key, si);
      applied = true;
      break;
    }
  }
  if (!applied) {
    const wi = document.getElementById('wi-' + key + '-0');
    if (wi) { wi.value = _currentPlateCalcWeight; markDraft(key, 0); }
  }
  closeSheet();
  haptic('set');
}

function renderPlatePopover(totalW) {
  const unit = getWeightUnit();
  const barW = unit === 'lb' ? 45 : 20;
  const plates = plateCalc(parseFloat(totalW) || 0, barW);
  if (!plates || plates.length === 0) return `<div class="plate-popover"><div class="plate-title">${barW}${unit} bar · no plates</div></div>`;
  // Drawn to scale — height & width proportional to the real plates
  const GEO = unit === 'lb' ? {
    45:  [52, 12, 'oklch(40% 0.01 40)'],
    35:  [46, 11, 'oklch(48% 0.01 40)'],
    25:  [40, 10, 'oklch(56% 0.01 40)'],
    10:  [32, 8,  'oklch(64% 0.01 40)'],
    5:   [24, 6,  'oklch(72% 0.01 40)'],
    2.5: [16, 5,  'oklch(78% 0.02 60)'],
  } : {
    25:   [46, 9,  'oklch(58.5% 0.210 32)'],
    20:   [42, 9,  'oklch(28% 0.018 45)'],
    15:   [36, 8,  'oklch(42% 0.025 55)'],
    10:   [30, 7,  'oklch(54% 0.030 60)'],
    5:    [24, 6,  'oklch(64% 0.030 60)'],
    2.5:  [18, 5,  'oklch(71% 0.030 60)'],
    1.25: [14, 4,  'oklch(77% 0.025 65)'],
  };
  const H = 60, midY = H / 2;
  let x = 16;
  let svgPlates = '';
  for (const p of plates) {
    const [ph, pw, col] = GEO[p] || [16, 5, 'oklch(72% 0.03 60)'];
    svgPlates += `<rect x="${x}" y="${(midY - ph / 2).toFixed(1)}" width="${pw}" height="${ph}" rx="2.2" fill="${col}"/>
      <rect x="${x + 1.2}" y="${(midY - ph / 2 + 2).toFixed(1)}" width="1.6" height="${ph - 4}" rx="0.8" fill="rgba(255,255,255,0.14)"/>`;
    x += pw + 2.5;
  }
  const W = Math.max(x + 16, 132);
  const perSide = plates.reduce((a, b) => a + b, 0);
  const labels = plates.map(p => Number.isInteger(p) ? p : p.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')).join(' · ');
  return `<div class="plate-popover">
    <div class="plate-title">Each side · ${barW} ${unit} bar</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:100%;height:${H}px;display:block;margin:4px auto 0" aria-hidden="true">
      <rect x="0" y="${midY - 3}" width="${W}" height="6" rx="3" fill="oklch(82% 0.012 70)"/>
      <rect x="8" y="${midY - 7}" width="5" height="14" rx="2" fill="oklch(68% 0.02 70)"/>
      ${svgPlates}
    </svg>
    <div class="plate-total"><strong>${Number.isInteger(perSide) ? perSide : perSide.toFixed(1)} ${unit}</strong> per side · ${labels}</div>
  </div>`;
}

function calcVolume() {
  let v = 0;
  for (const [key, sets] of Object.entries(ST.workoutSets)) {
    if (key.endsWith('_wu') || !Array.isArray(sets)) continue;
    for (const s of sets) {
      if (s && s.w > 0 && s.r > 0) v += s.w * s.r;
    }
  }
  return Math.round(v);
}

function updateProgressBadge() {
  if (!ST.currentSession) return;
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  if (!prog) return;
  const sess = prog.sessions.find(s => s.id === ST.currentSession);
  if (!sess) return;
  const exList = sess.exercises || [];
  const total = exList.length;
  const done = exList.filter((_, i) => ST.completedCards.has(`${sess.id}_${i}`)).length;
  const remaining = total - done;

  const numEl = document.getElementById('wh-pct-num');
  if (numEl) {
    numEl.textContent = remaining === 0 ? '✓ Complete' : `${remaining} left`;
    numEl.classList.toggle('complete', remaining === 0);
  }

  const volEl = document.getElementById('wh-vol-num');
  if (volEl) {
    const vol = Math.round(dispW(calcVolume()));
    volEl.innerHTML = `${vol.toLocaleString()} <span style="font-size:var(--fs-sm);font-weight:500;">${getWeightUnit()}</span>`;
  }

  const segs = document.querySelectorAll('.wh-seg');
  exList.forEach((_, i) => {
    const k = `${sess.id}_${i}`;
    if (segs[i]) {
      segs[i].classList.toggle('done', ST.completedCards.has(k));
    }
  });

  const legacyBadge = document.getElementById('wh-pct');
  if (legacyBadge) legacyBadge.classList.toggle('complete', remaining === 0);
}


// ── Workout actions ───────────────────────────────────────────────────────────
function toggleCard(key) {
  const isExpanded = ST.expandedCards.has(key);
  // Collapse all other cards first (accordion)
  for (const k of [...ST.expandedCards]) {
    if (k !== key) {
      ST.expandedCards.delete(k);
      const c = document.getElementById('excard-' + k);
      if (c) c.classList.remove('expanded');
    }
  }
  // Toggle the tapped card
  if (isExpanded) {
    ST.expandedCards.delete(key);
  } else {
    ST.expandedCards.add(key);
  }
  const card = document.getElementById('excard-' + key);
  if (!card) return;
  const nowExpanded = ST.expandedCards.has(key);
  card.classList.toggle('expanded', nowExpanded);

  // Spotlight: dim all other non-completed cards
  document.querySelectorAll('.ex-card').forEach(c => {
    if (c.id !== 'excard-' + key) {
      c.classList.toggle('dimmed', nowExpanded && !c.classList.contains('completed'));
    }
  });

  // Auto-highlight first unlogged weight input on expand without summoning system keyboard
  if (nowExpanded) {
    setTimeout(() => {
      const inputs = card.querySelectorAll('.set-input:not(.logged)');
      for (const inp of inputs) {
        if (inp.id && inp.id.startsWith('wi-')) { break; }
      }
    }, 320);
  }
}

function shimmerBtn(btn) {
  btn.classList.add('btn-shimmer');
  setTimeout(() => btn.classList.remove('btn-shimmer'), 220);
}

function setTravel(on) {
  ST.travelMode = on;
  // Travel wins over saved defaults (a hotel gym can't honour a machine default); defaults come back when it's off.
  clearDefaultSubsWithoutSets();
  applySlotDefaults(); // with travel on, only re-adds slots that have no travel alternative
  applyAutoSubstitutions();
  saveNow();
  renderWorkout();
}

function getHistoricalBestE1RM(name) {
  if (!name) return 0;
  let best = 0;
  for (const w of getHistory()) {
    if (!w || !w.sets || w._dupOf) continue;
    for (const [key, sets] of Object.entries(w.sets)) {
      if (key.endsWith('_wu') || !Array.isArray(sets)) continue;
      const fallbackName = resolveWorkoutSetExName(w, key, sets);
      for (const s of sets) {
        if (!s || !s.w || !s.r || s.w <= 0 || s.r <= 0 || s._suspect) continue; // ota-31: flagged typos never set the bar
        const sName = s._name || fallbackName;
        if (sName && exercisesMatch(name, sName)) {
          const e1rm = s.w * (1 + s.r / 30);
          if (e1rm > best) best = e1rm;
        }
      }
    }
  }
  return best;
}

function logSet(key, si, exIdx, force) {
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (!sess) return;
  // Resolve from the key so additions (add_N) and subbed slots work uniformly
  const isAdd = typeof key === 'string' && key.indexOf('add_') === 0;
  const slot = slotForKey(key);
  if (!slot) return;
  const ex = slot.ex;
  const wi = document.getElementById('wi-' + key + '-' + si);
  const ri = document.getElementById('ri-' + key + '-' + si);
  if (!wi || !ri) return;
  const w = storeW(parseFloat(wi.value) || 0); // ota-31 (E): typed in the shown unit, saved in the stored unit
  const r = parseInt(ri.value) || 0;
  if (r === 0) { openNumpad(ri, key, si, exIdx, 'r'); return; }

  // ota-31 (B): an unusual number gets a quick check. It never blocks.
  if (!force) {
    const _nm = liveExName(key, ex);
    const _prevHere = (ST.workoutSets[key] || []).slice(0, si).filter(Boolean).pop();
    const _mem = getZoneMemory(_nm, effReps(key, ex), { excludeId: ST.editingWorkoutId, sessionId: ST.currentSession });
    const _memE = _mem.entry || _mem.anyLast;
    const _ref = _prevHere || (_memE && (_memE.sets[si] || _memE.sets[_memE.sets.length - 1])) || null;
    const _why = inputCheckReason(w, r, _ref, effReps(key, ex));
    if (_why) {
      confirmSheet({
        title: 'Double-check this set?',
        body: `${_why} Log ${w > 0 ? formatWeight(dispW(w)) + ' ' + getWeightUnit() : 'bodyweight'} × ${r} anyway?`,
        confirmLabel: 'Log anyway',
        cancelLabel: 'Fix it',
        onConfirm: () => { logSet(key, si, exIdx, true); },
        onCancel: () => { try { wi.focus(); } catch (e) {} },
      });
      return;
    }
  }

  // Lock travel mode after first set
  const wasLocked = ST.travelLocked;
  ST.travelLocked = true;

  // Dismiss travel toggle from DOM on first ever set logged
  if (!wasLocked) {
    const tRow = document.querySelector('.travel-toggle-row');
    if (tRow) {
      tRow.classList.add('dismissing');
      tRow.style.maxHeight = tRow.offsetHeight + 'px'; // freeze before collapse
      requestAnimationFrame(() => { tRow.style.maxHeight = '0'; });
      setTimeout(() => { tRow.remove(); }, 260);
    }
    const hdr = document.getElementById('workout-header');
    if (hdr) hdr.classList.add('travel-locked');
  }

  if (!ST.workoutSets[key]) ST.workoutSets[key] = [];
  
  const exName = liveExName(key, ex);
  const curE1rm = w * (1 + r / 30);
  const prevBestE1rm = getHistoricalBestE1RM(exName);
  // ota-31 (G): bodyweight lifts (0 lb) set records by reps.
  const prevBestBW = w > 0 ? 0 : getBestBodyweightReps(exName);
  const isPR = w > 0 ? (prevBestE1rm > 0 && curE1rm > (prevBestE1rm + 0.5)) : (prevBestBW > 0 && r > prevBestBW);

  // ota-30: rir is always written (0 = failure) so "0" is distinguishable from "not recorded" on older sets;
  // _tgt stamps the rep range this set was logged against (weight memory by rep range).
  ST.workoutSets[key][si] = { w, r, ts: Date.now(), _name: exName, _isPR: isPR, rir: 0, _tgt: String(effReps(key, ex)) };
  if (force) ST.workoutSets[key][si]._checked = true;

  // Draft for this set is now committed — clear it
  if (ST.workoutDrafts) delete ST.workoutDrafts[key + '-' + si];

  // Synchronous save — on disk before the ripple finishes
  saveNow();

  // Haptic
  if (isPR) {
    haptic('pr');
    prCelebrate(document.getElementById('setrow-' + key + '-' + si));   // ota-34 (11)
  } else {
    haptic('set');
  }
  playSound('set');

  // Update UI for this set row
  wi.classList.add('logged');
  ri.classList.add('logged');
  const row = document.getElementById('setrow-' + key + '-' + si);
  if (row) {
    row.classList.remove('active-focus');
    row.classList.add('is-logged');
    const btn = row.querySelector('.set-log-btn');
    if (btn) {
      btn.classList.add('logged');
      btn.innerHTML = checkSVG();
      btn.setAttribute('aria-label', 'Undo set ' + (si + 1));
      btn.onclick = () => unlogSet(key, si, exIdx);
      if (!document.getElementById('rir-' + key + '-' + si)) btn.insertAdjacentHTML('beforebegin', rirPillsHTML(key, si, 0));
    }

    if (isPR) {
      const nextEl = row.nextElementSibling;
      if (!nextEl || !nextEl.classList.contains('pr-toast')) {
        const prToast = document.createElement('div');
        prToast.className = 'pr-toast';
        prToast.innerHTML = `✦ New Record · ${w > 0 ? formatWeight(dispW(w)) + ' ' + getWeightUnit() : 'Bodyweight'} × ${r}`;
        row.insertAdjacentElement('afterend', prToast);
      }
    }
  }

  // Auto-advance active focus to next unlogged set in this card
  const totalSets = effSetCount(key, ex);
  for (let nextSi = si + 1; nextSi < totalSets; nextSi++) {
    const nextRow = document.getElementById('setrow-' + key + '-' + nextSi);
    const nextWi = document.getElementById('wi-' + key + '-' + nextSi);
    if (nextRow && nextWi && !nextWi.classList.contains('logged')) {
      nextRow.classList.add('active-focus');
      break;
    }
  }
  // Ripple
  if (row) {
    const ripple = document.createElement('div');
    ripple.className = 'set-ripple';
    row.style.position = 'relative';
    row.appendChild(ripple);
    setTimeout(() => ripple.remove(), 400);
  }

  // Update progress badge
  updateProgressBadge();

  // Check if exercise complete
  const loggedSets = ST.workoutSets[key] || [];
  const doneCount = loggedSets.filter(Boolean).length;

  if (doneCount >= totalSets) {
    // Auto-collapse with delay
    ST.completedCards.add(key);
    haptic('exercise');
    setTimeout(() => {
      ST.expandedCards.delete(key);
      const card = document.getElementById('excard-' + key);
      if (card) {
        card.classList.remove('expanded');
        card.classList.add('completed');
        const nameEl = card.querySelector('.ex-name');
        if (nameEl) nameEl.innerHTML = liveExName(key, ex) + ' <span class="ex-check">✓</span>';
      }
      // Update progress bar + badge — programmed segments only
      if (!isAdd) {
        const segs = document.querySelectorAll('.wh-seg');
        if (segs[exIdx]) segs[exIdx].classList.add('done');
      }
      updateProgressBadge();

      // Auto-advance to next programmed exercise (additions don't auto-advance)
      if (!isAdd) {
        const _prog = PROGRAMS.find(p => p.id === ST.currentProgram);
        const _sess = _prog && _prog.sessions.find(s => s.id === ST.currentSession);
        if (_sess) {
          const nextIdx = exIdx + 1;
          if (nextIdx < _sess.exercises.length) {
            const nextKey = `${_sess.id}_${nextIdx}`;
            if (!ST.completedCards.has(nextKey)) {
              setTimeout(() => {
                toggleCard(nextKey);
                const nextCard = document.getElementById('excard-' + nextKey);
                if (nextCard) nextCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }, 250);
            }
          }
        }
      }
    }, 300);
  }

  // Progression verdict for next time (RIR-gated) — updates in place, and again if RIR is tapped after.
  if (doneCount >= totalSets) refreshVerdict(key);

  // Rest timer
  const name = stripSuperset(ex.name);
  const restTimes = getRestTimes();
  const restSec = restTimes[normalizeEx(name)] || parseRestSeconds(ex.rest);
  const unit = getWeightUnit();
  if (restSec > 0) {
    // Build next-set info text
    let nextText = '', afterText = '';
    const isLastSet = si === totalSets - 1;
    if (isLastSet) {
      // Find next programmed exercise (additions have no programmed successor)
      const nextExIdx = exIdx + 1;
      if (!isAdd && nextExIdx < sess.exercises.length) {
        const nextEx = sess.exercises[nextExIdx];
        const nextKey = `${sess.id}_${nextExIdx}`;
        const nextName = liveExName(nextKey, nextEx);
        const nextMem = getZoneMemory(nextName, effReps(nextKey, nextEx), { excludeId: ST.editingWorkoutId, sessionId: ST.currentSession });
        const nextW = nextMem.entry && nextMem.entry.sets[0] ? formatWeight(dispW(nextMem.entry.sets[0].w)) + ' ' + unit
          : (nextMem.estimate ? '~' + formatWeight(dispW(nextMem.estimate.w)) + ' ' + unit : (nextMem.anyLast && nextMem.anyLast.sets[0] ? formatWeight(dispW(nextMem.anyLast.sets[0].w)) + ' ' + unit : '?'));
        nextText = 'Exercise done ✓  Up next: ' + nextName + ' · ' + nextW;
      } else {
        nextText = 'Last exercise done ✓';
      }
    } else {
      const nextSi = si + 1;
      const preW = ST.workoutSets[key] && ST.workoutSets[key][si] ? ST.workoutSets[key][si].w : w;
      nextText = 'Next: Set ' + (nextSi + 1) + ' · ' + formatWeight(dispW(preW)) + ' ' + unit + ' × ' + r;
      if (si === totalSets - 2) {
        // Second to last — also show next programmed exercise
        const nextExIdx = exIdx + 1;
        if (!isAdd && nextExIdx < sess.exercises.length) {
          const nextEx = sess.exercises[nextExIdx];
          afterText = 'After: ' + stripSuperset(nextEx.name);
        }
      }
    }
    startRestTimer(restSec, name, nextText, afterText, isLastSet);
  }
}

// ── Warm-up set: log (saves to _wu key, no rest timer) ───────────────────────
function logWarmup(key) {
  const wuwi = document.getElementById('wuwi-' + key);
  const wuri = document.getElementById('wuri-' + key);
  if (!wuwi || !wuri) return;
  const w = storeW(parseFloat(wuwi.value) || 0);
  const r = parseInt(wuri.value) || 0;
  if (!r) { openNumpad(wuri, key, 0, 0, 'r', true); return; }
  const wuKey = key + '_wu';
  if (!ST.workoutSets[wuKey]) ST.workoutSets[wuKey] = [];
  // No _name on warm-ups — they must stay invisible to the prefill engine
  ST.workoutSets[wuKey][0] = { w, r, ts: Date.now() };
  if (ST.workoutDrafts) delete ST.workoutDrafts[key + '-wu'];
  saveNow();
  haptic('tick');
  // Visual confirmation — briefly tint the row
  const row = document.getElementById('wurow-' + key);
  if (row) {
    row.style.background = 'oklch(88% 0.06 145 / 0.25)';
    row.style.borderColor = 'oklch(72% 0.19 145 / 0.4)';
    setTimeout(() => { row.style.background = ''; row.style.borderColor = ''; }, 600);
  }
}

// ── Warm-up set: dismiss (in-memory, no localStorage) ────────────────────────
function dismissWarmup(e, key, exNameNorm) {
  e.stopPropagation();
  ST.dismissedWarmups.add(exNameNorm);
  delete ST.workoutSets[key + '_wu'];
  if (ST.workoutDrafts) delete ST.workoutDrafts[key + '-wu'];
  saveNow();
  const row = document.getElementById('wurow-' + key);
  if (row) { row.style.opacity = '0'; row.style.maxHeight = '0'; row.style.margin = '0'; row.style.padding = '0'; setTimeout(() => row.remove(), 260); }
}

function unlogSet(key, si, exIdx) {
  if (!ST.workoutSets[key]) return;
  ST.workoutSets[key][si] = null;
  saveNow();
  haptic('undo');   // ota-34 (10)

  // Update UI
  const wi = document.getElementById('wi-' + key + '-' + si);
  const ri = document.getElementById('ri-' + key + '-' + si);
  const row = document.getElementById('setrow-' + key + '-' + si);
  const btn = row && row.querySelector('.set-log-btn');
  if (wi) wi.classList.remove('logged');
  if (ri) ri.classList.remove('logged');
  if (btn) {
    btn.classList.remove('logged');
    btn.innerHTML = UI_ICON.arrow;
    btn.setAttribute('aria-label', 'Log set ' + (si + 1));
    btn.onclick = () => logSet(key, si, exIdx);
  }
  const pills = document.getElementById('rir-' + key + '-' + si);
  if (pills) pills.remove();
  if (row) row.classList.remove('is-logged');
  const staleVerdict = document.querySelector('#excard-' + key + ' .verdict');
  if (staleVerdict && /Next time/.test(staleVerdict.textContent)) staleVerdict.remove();
  if (row) {
    const prToast = row.nextElementSibling;
    if (prToast && prToast.classList.contains('pr-toast')) prToast.remove();
    // Clear other focus in card and focus this row
    const card = document.getElementById('excard-' + key);
    if (card) card.querySelectorAll('.set-row').forEach(r => r.classList.remove('active-focus'));
    row.classList.add('active-focus');
  }

  // Un-complete the card if it was marked done; re-expand so user can see sets
  const isAdd = typeof key === 'string' && key.indexOf('add_') === 0;
  const slot = slotForKey(key);
  if (slot) {
    const ex = slot.ex;
    const totalSets = effSetCount(key, ex);
    const remaining = (ST.workoutSets[key] || []).filter(Boolean).length;
    if (remaining < totalSets) {
      ST.completedCards.delete(key);
      ST.expandedCards.add(key);
      const card = document.getElementById('excard-' + key);
      if (card) {
        card.classList.remove('completed');
        card.classList.add('expanded');
        const nameEl = card.querySelector('.ex-name');
        if (nameEl) nameEl.innerHTML = liveExName(key, ex);
      }
      if (!isAdd) {
        const segs = document.querySelectorAll('.wh-seg');
        if (segs[exIdx]) segs[exIdx].classList.remove('done');
      }
    }
  }
  updateProgressBadge();
}

function editRestTime(key, exIdx, el) {
  const slot = slotForKey(key);
  if (!slot) return;
  const ex = slot.ex;
  const name = slot.name;
  const restTimes = getRestTimes();
  const current = restTimes[normalizeEx(name)] || parseRestSeconds(ex.rest);

  // Replace the display with an inline seconds input
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'rest-time-input';
  input.value = current;
  input.min = 0;
  input.inputMode = 'numeric';
  el.replaceWith(input);
  input.focus();
  input.select();

  const commit = () => {
    const secs = parseInt(input.value);
    if (!isNaN(secs) && secs >= 0) {
      restTimes[normalizeEx(name)] = secs;
      saveRestTimes(restTimes);
    }
    const display = document.createElement('span');
    display.className = 'rest-time-display';
    display.id = 'rest-lbl-' + key;
    display.title = 'Tap to edit';
    display.textContent = formatDuration(isNaN(secs) || secs < 0 ? current : secs);
    display.onclick = () => editRestTime(key, exIdx, display);
    input.replaceWith(display);
  };

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } if (e.key === 'Escape') { input.value = current; input.blur(); } });
}

function subsSheetHTML() {
  const ctx = ST._lib || {};

function escAttr(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;'); }

function libListHTML(filter, collapsed) {
  const q = (filter || '').trim();
  const eq = (ST._lib && ST._lib.mode === 'sub' && ST._lib.equip) || 'All';
  let items = EXERCISE_LIBRARY.filter(it => libMatches(it, q) && (eq === 'All' || equipOf(it) === eq));
  const addBtn = q ? `<button class="lib-add-custom" onclick="showCustomExerciseSheet('${escAttr(q)}')">${UI_ICON.plus}<span>Add “${escHtml(q)}” as a new exercise</span></button>` : '';
  if (items.length === 0) return `<div class="lib-empty">No exercises match “${escHtml(q)}”.</div>${addBtn}`;
  if (q) return items.slice(0, 60).map(it => libCard(it.name, it.muscle, it.tag, it.subMuscle)).join('') + addBtn;
  if (collapsed) return `<div class="lib-empty">Type to search ${EXERCISE_LIBRARY.length} exercises.</div>`;
  const order = ['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Core','Traps','Forearms','Adductors'];
  const byMuscle = {};
  for (const it of items) { (byMuscle[it.muscle] = byMuscle[it.muscle] || []).push(it); }
  const muscles = Object.keys(byMuscle).sort((a,b) => { const ia = order.indexOf(a), ib = order.indexOf(b); return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib); });
  return muscles.map(m => `<details class="lib-more"><summary>${m} (${byMuscle[m].length})</summary><div class="lib-section">` + byMuscle[m].map(it => libCard(it.name, it.muscle, it.tag, it.subMuscle)).join('') + `</div></details>`).join('');
}

// One row per exercise: name, its weight for TODAY's rep range (or an estimate), tap to pick.
function libCard(name, muscle, tag, subMuscle = null, badge = '') {
  const unit = getWeightUnit();
  const ctx = ST._lib || {};
  let reps = null;
  if (ctx.mode === 'sub' && ctx.key) reps = effTargetForKey(ctx.key);
  const mem = getZoneMemory(name, reps, {});
  let detail;
  if (mem.entry) {
    const e = mem.entry;
    detail = `${mem.zone ? ZONE_LABEL[mem.zone] + ' ' + zoneRangeLabel(mem.zone, e.target) + ' · ' : ''}${formatWeight(dispW(Number(e.sets[0].w) || 0))} ${unit} × ${e.sets.map(s => s.r).join(', ')} · ${relDay(e.endTime)}`;
  } else if (mem.estimate) {
    detail = `${ZONE_LABEL[mem.zone]} · est. ${formatWeight(dispW(mem.estimate.w))} ${unit} from your other sets`;
    badge = badge || 'Estimate';
  } else if (mem.anyLast) {
    detail = `${formatWeight(dispW(Number(mem.anyLast.sets[0].w) || 0))} ${unit} × ${mem.anyLast.sets[0].r} · ${relDay(mem.anyLast.endTime)}`;
  } else {
    detail = 'No history yet';
  }
  const info = getExerciseInfo(name);
  const eq = equipOf(info && info.name ? info : name);
  return `
  <button class="opt-row" onclick="chooseExercise('${escAttr(name)}')">
    <span class="opt-main"><b>${escHtml(name)}</b><small>${detail}</small></span>
    <span class="opt-side">${badge ? `<em>${badge}</em>` : ''}<i>${eq}${info && info.custom ? ' · yours' : ''}</i></span>
  </button>`;
}

    <div class="equip-chips wrap">${muscles.map(m => `<button aria-pressed="${m === c.muscle}" onclick="ST._custom.muscle='${m}';ST._custom.subMuscle=null;setSheetBody(customExerciseHTML())">${m}</button>`).join('')}</div>
    <div class="bs-section-lbl">Target</div>
    <div class="equip-chips wrap">${subs.map(sm => `<button aria-pressed="${sm === c.subMuscle}" onclick="ST._custom.subMuscle='${escAttr(sm)}';setSheetBody(customExerciseHTML())">${sm}</button>`).join('')}</div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="saveCustomFromSheet()">Save and use it</button>
    <button class="btn btn-sheet-ghost" onclick="backToLib()">Back to list</button>`;
}
function saveCustomFromSheet() {
  const c = ST._custom || {};
  const nmEl = document.getElementById('custom-name');
  const name = String((nmEl && nmEl.value) || c.name || '').replace(/[<>"`\\]/g, '').trim().slice(0, 60);
  if (!name) return;
  const existing = EXERCISE_LIBRARY.find(it => normalizeEx(it.name) === normalizeEx(name));
  if (!existing) saveCustomExercise(name, c.muscle, c.subMuscle);
  chooseExercise(existing ? existing.name : name);
}

// Step 2 — pick a custom set/rep count before committing (Decision 2)
function chooseExercise(name) {
  ST._lib = ST._lib || {};
  const ctx = ST._lib;
  let defSets = 3, defReps = 10;
  if (ctx.mode === 'sub' && ctx.key) {
    const slot = slotForKey(ctx.key);
    if (slot) {
      defSets = slot.ex.workingSets || 3;
      const m = String(slot.ex.reps || '10').match(/(\d+)\s*$/);
      defReps = m ? parseInt(m[1]) : 10;
      // Keep the slot's rep RANGE (e.g. 12–15) unless the user changes reps, so progression keeps a range.
      if (/\d\s*[–-]\s*\d/.test(String(slot.ex.reps || ''))) ctx._range = String(slot.ex.reps);
      else ctx._range = null;
    }
  }
  ST._pick = { name: name, sets: defSets, reps: defReps, range: ctx.mode === 'sub' ? (ctx._range || null) : null };
  setSheetBody(pickerHTML());
}

function pickerHTML() {
  const p = ST._pick || { name: '', sets: 3, reps: 10 };
  const ctx = ST._lib || {};
  const isSub = ctx.mode === 'sub';
  const title = isSub ? `Swap to ${escHtml(p.name)}` : `Add ${escHtml(p.name)}`;
  const confirmLbl = isSub ? (ctx.persist ? 'Use it and make default' : 'Use it today') : 'Add to workout';
  return `
    <div class="bs-title">${title}</div>
    <div class="bs-sub">${isSub ? (ctx.persist ? `Saved as your default for this slot. Restore ${escHtml(ctx.name || 'the program exercise')} any time from Swap.` : `Just for today. Back to ${escHtml(ctx.name || 'the program exercise')} next time.`) : 'Set your own volume. Additions log after your programmed exercises.'}</div>
    <div class="srp">
      <div class="srp-row">
        <span class="srp-lbl">Sets</span>
        <div class="srp-stepper">
          <button class="srp-btn" onclick="pickAdjust('sets',-1)">−</button>
          <span class="srp-val" id="srp-sets">${p.sets}</span>
          <button class="srp-btn srp-up" onclick="pickAdjust('sets',1)">+</button>
        </div>
      </div>
      <div class="srp-row">
        <span class="srp-lbl">Reps <span class="srp-hint">target</span></span>
        <div class="srp-stepper">
          <button class="srp-btn" onclick="pickAdjust('reps',-1)">−</button>
          <span class="srp-val" id="srp-reps">${p.range ? p.range : p.reps}</span>
          <button class="srp-btn srp-up" onclick="pickAdjust('reps',1)">+</button>
        </div>
      </div>
    </div>
    <div class="srp-preview" id="srp-preview">${p.sets} × ${p.range ? p.range : p.reps}</div>
    <button class="btn btn-primary" style="margin-top:6px" onclick="confirmPick()">${confirmLbl}</button>
    <button class="btn btn-sheet-ghost" onclick="backToLib()">Back to list</button>
  `;
}

function pickAdjust(field, delta) {
  const p = ST._pick;
  if (!p) return;
  if (field === 'sets') p.sets = Math.max(1, Math.min(10, p.sets + delta));
  else { p.reps = Math.max(1, Math.min(50, p.reps + delta)); p.range = null; }
  const se = document.getElementById('srp-sets'); if (se) se.textContent = p.sets;
  const re = document.getElementById('srp-reps'); if (re) re.textContent = p.range || p.reps;
  const pv = document.getElementById('srp-preview'); if (pv) pv.textContent = p.sets + ' × ' + (p.range || p.reps);
  haptic('tick');
}

function backToLib() {
  const ctx = ST._lib || {};
  setSheetBody(ctx.mode === 'add' ? addSheetHTML() : subsSheetHTML());
}

function confirmPick() {
  const p = ST._pick, ctx = ST._lib || {};
  if (!p) return;
  if (ctx.mode === 'sub') applySubstitution(ctx.key, ctx.exIdx, p.name, p.sets, String(p.range || p.reps), !!ctx.persist);
  else applyAddition(p.name, p.sets, String(p.reps));
}

// ota-30 fix: sets already logged on a slot are NEVER deleted by a swap. They move to an
// "added exercise" under the name they were logged with, so history keeps them exactly.
function preserveLoggedSlotSets(key) {
  const sets = ST.workoutSets[key];
  const hasLogged = Array.isArray(sets) && sets.some(s => s && s.r > 0);
  const wu = ST.workoutSets[key + '_wu'];
  const hasWu = Array.isArray(wu) && wu.some(s => s && s.r > 0);
  if (!hasLogged) {
    if (hasWu) { /* warm-up only: keep it on the slot, it is never counted as a working set */ }
    return null;
  }
  const slot = slotForKey(key);
  const priorName = (sets.find(s => s && s._name) || {})._name || (slot ? liveExName(key, slot.ex) : 'Exercise');
  if (!ST.workoutAdditions) ST.workoutAdditions = [];
  const id = ST.workoutAdditions.reduce((m, a) => Math.max(m, a.id), -1) + 1;
  const priorReps = slot ? String(effReps(key, slot.ex)) : '8–10';
  ST.workoutAdditions.push({ id, name: priorName, muscle: getMuscle(priorName), sets: Math.max(sets.filter(Boolean).length, 1), reps: priorReps, rest: (slot && slot.ex.rest) || '2–3 min', _fromSwap: key });
  const nk = 'add_' + id;
  ST.workoutSets[nk] = sets.map(s => s ? { ...s } : s).filter(s => s && s.r > 0);
  delete ST.workoutSets[key];
  if (hasWu) { ST.workoutSets[nk + '_wu'] = wu; delete ST.workoutSets[key + '_wu']; }
  ST.completedCards.add(nk);
  return nk;
}

function applySubstitution(key, exIdx, subName, sets, reps, makeDefault) {
  const slot = slotForKey(key);
  if (!ST.workoutSubs) ST.workoutSubs = {};
  if (!ST.workoutSubMeta) ST.workoutSubMeta = {};
  if (!ST.workoutSubSource) ST.workoutSubSource = {};
  preserveLoggedSlotSets(key);
  ST.workoutSubs[key] = subName;
  ST.workoutSubMeta[key] = { sets: sets, reps: String(reps) };
  if (makeDefault && slot && !slot.isAddition) {
    const d = getSlotDefaults();
    d[key] = { name: subName, sets: sets, reps: String(reps), since: Date.now(), from: stripSuperset(slot.ex.name) };
    saveSlotDefaults(d);
    ST.workoutSubSource[key] = 'default';
  } else {
    delete ST.workoutSubSource[key];
  }
  if (ST.workoutDrafts) { for (const k of Object.keys(ST.workoutDrafts)) { if (k.indexOf(key + '-') === 0) delete ST.workoutDrafts[k]; } }
  if (ST.workoutZoneView) delete ST.workoutZoneView[key];
  ST.completedCards.delete(key);
  ST.expandedCards.add(key);
  // Leave a note only where none exists (never overwrite one he wrote).
  if (slot) { const notes = getNotes(); const nk = normalizeEx(slot.name); if (!notes[nk] || /^Using: /.test(notes[nk])) { notes[nk] = 'Using: ' + subName; saveNotes(notes); } }
  saveNow();
  closeSheet(true);
  renderWorkout();
}

function applyAddition(name, sets, reps) {
  if (!ST.workoutAdditions) ST.workoutAdditions = [];
  const id = ST.workoutAdditions.reduce((m, a) => Math.max(m, a.id), -1) + 1;
  ST.workoutAdditions.push({ id: id, name: name, muscle: getMuscle(name), sets: sets, reps: String(reps), rest: '2–3 min' });
  saveNow();
  closeSheet(true);
  renderWorkout();
  setTimeout(() => {
    const k = 'add_' + id;
    if (!ST.expandedCards.has(k)) toggleCard(k);
    const c = document.getElementById('excard-' + k);
    if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 80);
}

function removeAddition(e, id, confirmed) {
  if (e && e.stopPropagation) e.stopPropagation();
  const idx = (ST.workoutAdditions || []).findIndex(a => a && a.id === id);
  if (idx < 0) return;
  const key = 'add_' + id;
  // ota-30: removing an addition that already has logged sets asks first
  const logged = (ST.workoutSets[key] || []).filter(s => s && s.r > 0).length;
  if (logged && !confirmed) {
    confirmSheet({ title: 'Remove logged sets?', body: `<strong>${escHtml(ST.workoutAdditions[idx].name)}</strong> has ${logged} logged set${logged > 1 ? 's' : ''} in this workout. Removing it drops them from today's workout.`,
      confirmLabel: 'Remove it', cancelLabel: 'Keep it', destructive: true, onConfirm: () => removeAddition(null, id, true) });
    return;
  }
  ST.workoutAdditions.splice(idx, 1);
  delete ST.workoutSets[key];
  delete ST.workoutSets[key + '_wu'];
  if (ST.workoutDrafts) { for (const k of Object.keys(ST.workoutDrafts)) { if (k.indexOf(key + '-') === 0) delete ST.workoutDrafts[k]; } }
  if (ST.workoutNotes) delete ST.workoutNotes[key];
  ST.completedCards.delete(key);
  ST.expandedCards.delete(key);
  saveNow();
  renderWorkout();
}

function revertSubstitution(key) { restoreProgramExercise(key, false); }
// Back to the program exercise. forGood also removes the saved default for this slot.
function restoreProgramExercise(key, forGood) {
  preserveLoggedSlotSets(key);
  if (ST.workoutSubs) delete ST.workoutSubs[key];
  if (ST.workoutSubMeta) delete ST.workoutSubMeta[key];
  if (ST.workoutSubSource) delete ST.workoutSubSource[key];
  if (ST.workoutZoneView) delete ST.workoutZoneView[key];
  if (forGood) { const d = getSlotDefaults(); if (d[key]) { delete d[key]; saveSlotDefaults(d); } }
  if (ST.workoutDrafts) { for (const k of Object.keys(ST.workoutDrafts)) { if (k.indexOf(key + '-') === 0) delete ST.workoutDrafts[k]; } }
  ST.completedCards.delete(key);
  applyAutoSubstitutions();
  saveNow();
  closeSheet(false);
  renderWorkout();
}

function openSheet(html) {
  if (document.activeElement && typeof document.activeElement.blur === 'function') {
    document.activeElement.blur();
  }
  document.getElementById('sheet-content').innerHTML = html;
  document.getElementById('sheet-overlay').classList.add('visible');
  document.getElementById('bottom-sheet').classList.add('visible');
  document.body.style.overflow = 'hidden';
  // Back gesture closes the sheet, not the app — avoid duplicate sheet history states
  try {
    if (!history.state || history.state.overlay !== 'sheet') {
      history.pushState({ screen: ST.screen, overlay: 'sheet' }, '', '#sheet');
    }
  } catch(e) {}
}

function closeSheet(unwindHistory = true) {
  __closeSheetDom();
  if (unwindHistory && history.state && history.state.overlay === 'sheet') {
    try { history.back(); } catch(e) {}
  }
}

function __closeSheetDom() {
  const overlay = document.getElementById('sheet-overlay');
  const sheet = document.getElementById('bottom-sheet');
  if (overlay) overlay.classList.remove('visible');
  if (sheet) sheet.classList.remove('visible');
  document.body.style.overflow = '';
  ST.openSubCard = null;
}

// ── Sheet drag-to-dismiss — iOS physics: follow the finger, rubber-band up,
//    release past threshold dismisses, otherwise springs home. ──────────────
(function initSheetDrag() {
  const sheet = document.getElementById('bottom-sheet');
  if (!sheet) return;
  let startY = 0, curY = 0, dragging = false;
  sheet.addEventListener('touchstart', (e) => {
    const content = document.getElementById('sheet-content');
    // Drag starts from the handle zone, or anywhere once content is at scroll top
    if (content && content.scrollTop > 2 && !e.target.closest('.bs-handle')) return;
    if (e.target.closest('input, textarea, button')) return;
    dragging = true; startY = curY = e.touches[0].clientY;
    sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    curY = e.touches[0].clientY;
    let dy = curY - startY;
    if (dy < 0) dy = -Math.pow(-dy, 0.72);   // rubber-band resistance upward
    sheet.style.transform = `translateY(${Math.max(dy, -26)}px)`;
  }, { passive: true });
  const release = () => {
    if (!dragging) return;
    dragging = false;
    const dy = curY - startY;
    if (dy > 88) {
      haptic('tick');
      sheet.style.transition = 'transform 220ms cubic-bezier(0.16, 1, 0.3, 1)';
      sheet.style.transform = 'translateY(100%)';
      setTimeout(() => {
        sheet.style.transition = '';
        sheet.style.transform = '';
        closeSheet();
      }, 220);
    } else {
      sheet.style.transition = 'transform 260ms cubic-bezier(0.16, 1, 0.3, 1)';
      sheet.style.transform = '';
      setTimeout(() => { sheet.style.transition = ''; }, 260);
    }
  };
  sheet.addEventListener('touchend', release);
  sheet.addEventListener('touchcancel', release);
})();

// ── Workout flow ──────────────────────────────────────────────────────────────
// Three-way guard. The old code silently clobbered an in-progress workout when
// you tapped the SAME session card — total loss of logged sets. Never again:
//  · no unfinished workout            → start fresh
//  · unfinished, same session         → Resume / Restart sheet (no silent reset)
//  · unfinished, different session    → themed confirm; archives sets first
function startWorkoutFromHome(progId, sessId) {
  const existing = LS.get('dcrgym_current_workout');
  const hasLogged = existing && existing.sets &&
    Object.values(existing.sets).some(arr => Array.isArray(arr) && arr.some(s => s && s.r > 0));
  const isPast = existing && (existing.editingWorkoutId || existing.isBackdated);

  if (existing && isPast) {
    confirmSheet({
      title: 'Unfinished session',
      body: existing.editingWorkoutId
        ? 'You have an unfinished edit session. Starting a new workout will discard your edits.'
        : 'You have an unfinished backdated workout draft. Starting a new workout will discard this draft.',
      confirmLabel: 'Start new workout',
      cancelLabel: 'Keep current',
      onConfirm: () => {
        LS.remove('dcrgym_current_workout');
        beginWorkout(progId, sessId);
      }
    });
    return;
  }

  if (existing && existing.programId === progId && existing.sessionId === sessId && hasLogged) {
    confirmSheet({
      title: 'Workout in progress',
      body: `You have an unfinished <strong>${escHtml(existing.sessionName || 'session')}</strong> with logged sets. Pick up where you left off?`,
      confirmLabel: 'Resume workout',
      secondaryLabel: 'Restart from zero',
      cancelLabel: 'Not now',
      onConfirm: () => resumeWorkout(),
      onSecondary: () => {
        archiveWorkoutToHistory(existing);
        LS.remove('dcrgym_current_workout');
        beginWorkout(progId, sessId);
      },
    });
    return;
  }

  if (existing && (existing.programId !== progId || existing.sessionId !== sessId) && hasLogged) {
    confirmSheet({
      title: 'Unfinished workout',
      body: `Your logged sets from <strong>${escHtml(existing.sessionName || 'the previous session')}</strong> will be saved to history before starting fresh.`,
      confirmLabel: 'Start new workout',
      cancelLabel: 'Keep current',
      onConfirm: () => {
        archiveWorkoutToHistory(existing);
        LS.remove('dcrgym_current_workout');
        beginWorkout(progId, sessId);
      },
    });
    return;
  }

  if (existing) LS.remove('dcrgym_current_workout'); // empty shell — nothing to lose
  beginWorkout(progId, sessId);
}

function beginWorkout(progId, sessId) {
  ST.workoutCommitted = false; // fresh live workout — re-enable snapshot autosave
  ST.editingWorkoutId = null;
  ST.isBackdated = false;
  ST.workoutEnd = null;
  cancelRestTimer();
  ST.currentProgram = progId;
  ST.currentSession = sessId;
  ST.travelMode = false;
  ST.travelLocked = false;
  ST.workoutSets   = {};
  ST.workoutNotes  = {};   // reset session-scoped notes for fresh workout
  ST.workoutDrafts = {};
  ST.workoutSubs   = {};
  ST.workoutSubMeta = {};
  ST.workoutAutoSubs = {};
  ST.workoutAutoSubMeta = {};
  ST.workoutAdditions = [];
  ST.workoutSubSource = {};
  ST.workoutZoneView = {};
  ST.expandedCards = new Set();
  ST.completedCards = new Set();
  ST.durationSecs = 0;
  ST.workoutStart = Date.now();
  ST.workoutStartedAt = ST.workoutStart; // ota-32
  if (ST.durationTimer) clearInterval(ST.durationTimer);
  ST.durationTimer = setInterval(() => {
    ST.durationSecs = Math.floor((Date.now() - ST.workoutStart) / 1000);
    const el = document.getElementById('wh-dur');
    if (el) el.textContent = formatDuration(ST.durationSecs);
    const pd = document.getElementById('pill-dur');
    if (pd) pd.textContent = formatDuration(ST.durationSecs);
    if (ST.durationSecs % 30 === 0) checkIdleWorkout(); // ota-31 (D)
  }, 1000);
  // Wake lock
  if (navigator.wakeLock) {
    navigator.wakeLock.request('screen').then(wl => { ST.wakeLock = wl; }).catch(() => {});
  }
  applySlotDefaults();
  applyAutoSubstitutions();
  saveNow();
  Maps('workout');
}

function resumeWorkout() {
  const saved = LS.get('dcrgym_current_workout');
  if (!saved) return;
  ST.workoutCommitted = false; // resuming a live workout — re-enable snapshot autosave
  ST.currentProgram = saved.programId;
  ST.currentSession = saved.sessionId;
  ST.workoutSets = saved.sets || {};
  ST.workoutDrafts = saved.drafts || {};   // typed-but-unlogged values come back
  ST.workoutSubs   = saved.subs   || {};   // session substitutions come back
  ST.workoutSubMeta = saved.subMeta || {}; // custom set/rep on substituted slots come back
  ST.workoutAutoSubs = saved.autoSubs || {};
  ST.workoutAutoSubMeta = saved.autoSubMeta || {};
  ST.workoutAdditions = saved.additions || []; // accessory additions come back
  ST.workoutSubSource = saved.subSource || {};
  ST.workoutZoneView = {};
  ST.workoutNotes  = saved.notes  || {};   // session notes come back
  ST.travelMode = saved.travelMode || false;
  ST.travelLocked = saved.travelLocked || false;
  applyAutoSubstitutions();
  
  ST.editingWorkoutId = saved.editingWorkoutId || null;
  ST.isBackdated = saved.isBackdated || false;
  ST.workoutEnd = saved.workoutEnd || null;
  ST.durationSecs = saved.durationSecs || 0;
  // ota-32: reopening used to reset the start to "now", which moved Monday's Pull to Thursday. Keep the real one.
  ST.workoutStartedAt = (!ST.editingWorkoutId && !ST.isBackdated) ? (trueStartOf(saved) || null) : null;
  
  if (ST.editingWorkoutId || ST.isBackdated) {
    ST.workoutStart = saved.startTime || Date.now();
    if (ST.durationTimer) clearInterval(ST.durationTimer);
    ST.durationTimer = null;
  } else {
    ST.workoutStart = Date.now() - (saved.durationSecs || 0) * 1000;
    if (ST.durationTimer) clearInterval(ST.durationTimer);
    ST.durationTimer = setInterval(() => {
      ST.durationSecs = Math.floor((Date.now() - ST.workoutStart) / 1000);
      const el = document.getElementById('wh-dur');
      if (el) el.textContent = formatDuration(ST.durationSecs);
      const pd = document.getElementById('pill-dur');
      if (pd) pd.textContent = formatDuration(ST.durationSecs);
      if (ST.durationSecs % 30 === 0) checkIdleWorkout(); // ota-31 (D)
    }, 1000);
  }
  
  ST.expandedCards = new Set(saved.expandedCards || []);
  ST.completedCards = new Set(saved.completedCards || []);
  
  if (!ST.editingWorkoutId && !ST.isBackdated && navigator.wakeLock) {
    navigator.wakeLock.request('screen').then(wl => ST.wakeLock = wl).catch(()=>{});
  }
  
  // Restore rest timer — island reappears with correct ring progress
  const savedEnd = LS.get('dcrgym_rest_end');
  if (savedEnd && savedEnd > Date.now()) {
    ST.restActive = true;
    ST.restExpired = false;
    ST.restEndTime = savedEnd;
    ST.restDuration = LS.get('dcrgym_rest_dur', 0) || 0;
    ST.restNextText = LS.get('dcrgym_rest_next') || '';
    document.body.classList.add('rest-active');
    if (ST.restTicker) clearInterval(ST.restTicker);
    ST.restTicker = setInterval(tickRest, 250);
    renderRestIsland();
  }
  Maps('workout');
}

function discardWorkout() {
  const saved = LS.get('dcrgym_current_workout');
  if (!saved) return;
  const isPast = saved.editingWorkoutId || saved.isBackdated;
  const hasLogged = saved.sets &&
    Object.values(saved.sets).some(arr => Array.isArray(arr) && arr.some(s => s && s.r > 0));
  
  if (isPast) {
    confirmSheet({
      title: saved.editingWorkoutId ? 'Discard edits?' : 'Delete draft?',
      body: saved.editingWorkoutId 
        ? 'Any changes you made will be discarded. The original workout remains untouched.'
        : 'Are you sure? This backdated workout draft will be permanently deleted.',
      confirmLabel: 'Delete Draft',
      destructive: true,
      onConfirm: () => {
        LS.remove('dcrgym_current_workout');
        renderHome();
      }
    });
    return;
  }
  
  if (!hasLogged) {
    LS.remove('dcrgym_current_workout');
    renderHome();
    return;
  }
  
  openSheet(`
    <div class="bs-title">Discard Active Workout?</div>
    <div style="font-size:var(--fs-md);color:var(--text-secondary);margin-bottom:18px;line-height:1.45;">
      You have an unfinished workout session. Do you want to permanently delete this workout or archive your logged sets?
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn" style="background:#C04E2A;color:#fff;padding:12px;font-size:var(--fs-md);border-radius:12px;" onclick="confirmDeleteDraftWorkout()">Delete Workout Permanently</button>
      <button class="btn btn-primary" style="padding:12px;font-size:var(--fs-md);border-radius:12px;" onclick="archiveAndExitSavedWorkout()">Save & Exit</button>
      <button class="btn btn-sheet-ghost" style="padding:12px;font-size:var(--fs-md);border-radius:12px;" onclick="closeSheet()">Keep Training</button>
    </div>
  `);
}

function confirmDeleteDraftWorkout() {
  closeSheet(false);
  confirmSheet({
    title: 'Are you sure?',
    body: 'Are you sure you want to delete this workout? All progress and logged sets from this session will be permanently erased.',
    confirmLabel: 'Yes, Delete',
    cancelLabel: 'Keep Workout',
    destructive: true,
    onConfirm: () => {
      LS.remove('dcrgym_current_workout');
      renderHome();
    }
  });
}

function archiveAndExitSavedWorkout() {
  closeSheet(true);
  const saved = LS.get('dcrgym_current_workout');
  if (saved) archiveWorkoutToHistory(saved);
  LS.remove('dcrgym_current_workout');
  renderHome();
}

let _saveTimeout = null;
function autoSave() {
  // Debounced variant — high-frequency callers only. Checkmarks use saveNow().
  clearTimeout(_saveTimeout);
  _saveTimeout = setTimeout(saveNow, 400);
}

function abandonPrompt() {
  // Leave workout without discarding — timer keeps running, pill appears
  saveNow();
  Maps('home');
}

function cancelWorkout() {
  const hasLogged = Object.values(ST.workoutSets || {})
    .some(arr => Array.isArray(arr) && arr.some(s => s && s.r > 0));
  const isPast = ST.editingWorkoutId || ST.isBackdated;
  
  if (isPast) {
    confirmSheet({
      title: ST.editingWorkoutId ? 'Discard edits?' : 'Delete draft?',
      body: ST.editingWorkoutId
        ? 'Any changes you made will be discarded. The original workout remains untouched.'
        : 'Are you sure? This backdated workout draft will be permanently deleted.',
      confirmLabel: 'Discard',
      cancelLabel: 'Keep editing',
      destructive: true,
      onConfirm: () => {
        _cleanExitWorkout(true);
      }
    });
    return;
  }

  if (!hasLogged) {
    _cleanExitWorkout(false);
    return;
  }

  openSheet(`
    <div class="bs-title">Exit Workout?</div>
    <div style="font-size:var(--fs-md);color:var(--text-secondary);margin-bottom:18px;line-height:1.45;">
      You have logged sets in this workout. Would you like to permanently delete this session or save your progress?
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;">
      <button class="btn" style="background:#C04E2A;color:#fff;padding:12px;font-size:var(--fs-md);border-radius:12px;" onclick="promptConfirmDeleteLiveWorkout()">Delete Workout</button>
      <button class="btn btn-primary" style="padding:12px;font-size:var(--fs-md);border-radius:12px;" onclick="saveAndExitLiveWorkout()">Save & Exit</button>
      <button class="btn btn-sheet-ghost" style="padding:12px;font-size:var(--fs-md);border-radius:12px;" onclick="closeSheet()">Keep Training</button>
    </div>
  `);
}

function promptConfirmDeleteLiveWorkout() {
  closeSheet(false);
  confirmSheet({
    title: 'Are you sure?',
    body: 'Are you sure you want to delete this workout? All progress from this session will be permanently erased and nothing will be saved to your history.',
    confirmLabel: 'Delete Permanently',
    cancelLabel: 'Cancel',
    destructive: true,
    onConfirm: () => {
      _cleanExitWorkout(false);
    }
  });
}

function saveAndExitLiveWorkout() {
  closeSheet(false);
  archiveWorkoutToHistory(buildWorkoutPayload());
  _cleanExitWorkout(false);
}

function _cleanExitWorkout(toHistory) {
  if (ST.durationTimer) clearInterval(ST.durationTimer);
  ST.durationTimer = null;
  if (ST.wakeLock) ST.wakeLock.release().catch(()=>{});
  cancelRestTimer();
  LS.remove('dcrgym_current_workout');
  ST.currentProgram = null; ST.currentSession = null;
  ST.editingWorkoutId = null; ST.isBackdated = false; ST.workoutEnd = null;
  ST.workoutSets = {}; ST.workoutStart = null; ST.durationSecs = 0;
  ST.workoutDrafts = {}; ST.workoutSubs = {}; ST.workoutNotes = {};
  ST.workoutSubMeta = {}; ST.workoutAutoSubs = {}; ST.workoutAutoSubMeta = {};
  ST.workoutAdditions = [];
  ST.expandedCards = new Set(); ST.completedCards = new Set();
  ST.travelMode = false; ST.travelLocked = false;
  Maps(toHistory ? 'history' : 'home');
}

function finishWorkout() {
  // Guard: warn if exercises incomplete — themed sheet, not a system dialog
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (sess) {
    const total = sess.exercises.length;
    const done = sess.exercises.filter((_, i) => ST.completedCards.has(`${sess.id}_${i}`)).length;
    if (done < total) {
      confirmSheet({
        title: 'Finish early?',
        body: `You've completed <strong>${done} of ${total}</strong> exercises. Everything logged so far will be saved.`,
        confirmLabel: 'Finish workout',
        cancelLabel: 'Keep training',
        onConfirm: () => commitWorkout(),
      });
      return;
    }
  }
  commitWorkout();
}

function commitWorkout() {
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (ST.durationTimer) clearInterval(ST.durationTimer);
  if (ST.wakeLock) ST.wakeLock.release().catch(()=>{});
  cancelRestTimer();
  // ota-32 (2): Finish pressed 2+ hours after the last set, or on a later day → it ends at the last set,
  // so it stays on the day it was done.
  if (!ST.editingWorkoutId && !ST.isBackdated) {
    const tStart = liveTrueStart();
    if (tStart) ST.workoutStart = tStart;
    const lastT = liveLastSetTs();
    if (!ST._endedAtLastSet && lastT && (Date.now() - lastT >= AUTO_FINISH_MS || localDateKey(Date.now()) !== localDateKey(tStart || lastT))) {
      const st = Math.min(tStart || lastT, lastT);
      ST.workoutStart = st;
      ST.workoutEnd = lastT;
      ST.durationSecs = Math.max(60, Math.round((lastT - st) / 1000) + 60);
      ST._endedAtLastSet = true;
    }
  }
  const duration = ST.durationSecs;

  // Save to history
  const hist = getHistory();
  // Previous same session for comparison (prog/sess already declared above)
  const prevSame = hist.filter(w => isCompletedProgramWorkout(w) && w.sessionId === ST.currentSession && String(w.id) !== String(ST.editingWorkoutId)).slice(-1)[0];
  const prevDur = prevSame ? prevSame.duration : null;

  // Biggest gain (matched by exercise identity so substituted or reordered slots never compare wrong lifts)
  let biggestGain = null;
  if (prevSame && prevSame.sets) {
    let maxGain = 0;
    for (const [key, sets] of Object.entries(ST.workoutSets)) {
      if (!Array.isArray(sets) || key.endsWith('_wu')) continue;
      const exIdx = parseInt(key.split('_').pop());
      const ex = sess && sess.exercises[exIdx];
      const gainName = (sets.find(s => s && s._name) || {})._name || (ex && stripSuperset(ex.name));
      if (!gainName) continue;
      let prevMax = 0;
      for (const [pKey, pSets] of Object.entries(prevSame.sets)) {
        if (!Array.isArray(pSets) || pKey.endsWith('_wu')) continue;
        const pName = resolveWorkoutSetExName(prevSame, pKey, pSets);
        if (pName && exercisesMatch(gainName, pName)) {
          for (const ps of pSets) {
            if (ps && ps.r > 0 && ps.w > prevMax) prevMax = ps.w;
          }
        }
      }
      const curMax = sets.reduce((m,s)=>Math.max(m,(s && s.r > 0 && s.w)||0),0);
      // Only a real gain if there was a prior load to beat — skips first-time
      // additions/exercises that would otherwise read as a spurious "+Xkg".
      if (prevMax > 0 && curMax - prevMax > maxGain) { maxGain = curMax - prevMax; biggestGain = { name: gainName, gain: maxGain }; }
    }
  }

  let entry;
  if (ST.editingWorkoutId) {
    const idx = hist.findIndex(w => String(w.id) === String(ST.editingWorkoutId));
    if (idx !== -1) {
      const original = hist[idx];
      // ota-31 (C): changed sets keep their original values (_orig); removed ones are archived, never dropped.
      entry = applyEditToEntry(original, {
        duration,
        travelMode: ST.travelMode,
        sets: ST.workoutSets,
        notes: { ...ST.workoutNotes },
        subs: ST.workoutSubs || {},
        subMeta: ST.workoutSubMeta || {},
        subSource: ST.workoutSubSource || {},
        additions: ST.workoutAdditions || [],
        completedCards: [...ST.completedCards],
        startTime: ST.workoutStart,
        endTime: ST.workoutEnd || (ST.workoutStart + duration * 1000)
      });
      hist[idx] = entry;
    } else {
      entry = {
        id: ST.editingWorkoutId,
        programId: ST.currentProgram,
        sessionId: ST.currentSession,
        sessionName: sess ? sess.name : '',
        startTime: ST.workoutStart,
        endTime: ST.workoutEnd || (ST.workoutStart + duration * 1000),
        duration,
        travelMode: ST.travelMode,
        sets: ST.workoutSets,
        notes: { ...ST.workoutNotes },
        subs: ST.workoutSubs || {},
        subMeta: ST.workoutSubMeta || {},
        subSource: ST.workoutSubSource || {},
        additions: ST.workoutAdditions || [],
        completedCards: [...ST.completedCards],
      };
      hist.push(entry);
    }
  } else {
    const id = Date.now().toString();
    const startTime = ST.workoutStart || Date.now() - duration * 1000;
    const endTime = ST.isBackdated ? (startTime + duration * 1000) : ((ST._endedAtLastSet && ST.workoutEnd) ? ST.workoutEnd : Date.now());
    const sameSets = findSameSetsWorkout(hist, ST.workoutSets, null); // ota-31 (C): duplicate guard
    if (sameSets) entry = sameSets;
    else entry = {
      id,
      programId: ST.currentProgram,
      sessionId: ST.currentSession,
      sessionName: sess ? sess.name : '',
      startTime,
      endTime,
      duration,
      travelMode: ST.travelMode,
      sets: ST.workoutSets,
      notes: { ...ST.workoutNotes },
      subs: ST.workoutSubs || {},
      subMeta: ST.workoutSubMeta || {},
      subSource: ST.workoutSubSource || {},
      additions: ST.workoutAdditions || [],
      completedCards: [...ST.completedCards],
      _unitLb: getStoreUnit() === 'lb',
    };
    if (!sameSets && ST._endedAtLastSet) entry._endedAtLastSet = true;

    if (!sameSets) hist.push(entry);
  }
  ST._endedAtLastSet = false;

  if (ST.currentProgram && ST.currentProgram !== 'import' && PROGRAMS.some(p => p.id === ST.currentProgram)) {
    ST.defaultProgram = ST.currentProgram;
    LS.set('dcrgym_default_prog', ST.currentProgram);
    idbSet('dcrgym_default_prog', ST.currentProgram);
  }

  saveHistory(hist);
  LS.remove('dcrgym_current_workout');
  // Workout is committed: block any in-flight saveNow (pending draft/save debounce,
  // visibilitychange, pagehide) from re-creating the snapshot — otherwise the
  // "Continue" pill reappears on Home after finishing. currentSession/currentProgram
  // intentionally stay set; the finish screen below still reads them.
  ST.workoutCommitted = true;
  clearTimeout(_draftTimeout);
  clearTimeout(_saveTimeout);

  const wasEditing = !!ST.editingWorkoutId;
  const wasBackdated = !!ST.isBackdated;

  ST.editingWorkoutId = null;
  ST.isBackdated = false;
  ST.workoutEnd = null;
  ST.workoutDrafts = {};
  ST.workoutSubs   = {};
  ST.workoutSubMeta = {};
  ST.workoutSubSource = {};
  ST.workoutZoneView = {};
  ST.workoutAdditions = [];
  
  bgSyncToSheets(entry);

  if (wasEditing || wasBackdated) {
    ST.currentProgram = null;
    ST.currentSession = null;
    ST.workoutSets = {};
    ST.workoutStart = null;
    ST.completedCards = new Set();
    ST.expandedCards = new Set();
    ST.durationSecs = 0;
    Maps('history');
    return;
  }

  // e1RM delta vs previous same session
  const currentProg = PROGRAMS.find(p => p.id === ST.currentProgram);
  const curE1RM  = getSessionE1RM(entry, currentProg);
  const prevEntry = getPrevSessionEntry(ST.currentSession, entry.id);
  const prevE1RM  = prevEntry ? getSessionE1RM(prevEntry, currentProg) : 0;
  let e1rmDelta = null;
  if (curE1RM > 0 && prevE1RM > 0) {
    e1rmDelta = Math.round(((curE1RM - prevE1RM) / prevE1RM) * 100);
  }


  ST.lastSummary = { entryId: entry.id, duration, prevDur, biggestGain, e1rmDelta, curE1RM, programId: ST.currentProgram, sessionId: ST.currentSession };
  const wasAuto = !!ST._autoFinished; ST._autoFinished = false;

  // Belt-and-suspenders: workout is fully done. Null the live session markers
  // so that saveNow() is blocked and the floating workout-pill is hidden immediately.
  ST.currentSession = null;
  ST.workoutStart = null;
  if (ST.durationTimer) {
    clearInterval(ST.durationTimer);
    ST.durationTimer = null;
  }

  if (wasAuto) { Maps('home'); autoFinishNotice(entry); return; } // ota-32 (2): saved quietly, he sees a note on Home

  const milestone = checkMilestone();
  if (milestone) {
    ST.milestoneN = milestone;
    showMilestone();
  } else {
    showFinish();
  }

  // PWA install: handled natively via Chrome "Add to Home screen"
}

// ── Finish screen ─────────────────────────────────────────────────────────────
function showFinish() {
  playSound('finish');
  haptic('finish');
  const s = ST.lastSummary || {};
  const progId = s.programId || ST.currentProgram;
  const sessId = s.sessionId || ST.currentSession;
  const prog = PROGRAMS.find(p => p.id === progId);
  const sess = prog && prog.sessions.find(ss => ss.id === sessId);
  const unit = getWeightUnit();

  // Extract session stats & PRs from the completed workout entry
  const hist = getHistory();
  const lastEntry = (s.entryId && hist.find(w => String(w.id) === String(s.entryId))) || hist[hist.length - 1];
  let totalVol = 0;
  let totalSetsDone = 0;
  const prsHit = [];
  if (lastEntry && lastEntry.sets) {
    for (const [k, sets] of Object.entries(lastEntry.sets)) {
      if (k.endsWith('_wu') || !Array.isArray(sets)) continue;
      for (const st of sets) {
        if (st && st.r > 0) {
          if (st.w > 0 && !st._suspect) totalVol += (st.w * st.r);
          totalSetsDone++;
          if (st._isPR) {
            prsHit.push(`${escHtml(st._name || 'Movement')} · ${st.w > 0 ? formatWeight(dispW(st.w)) + ' ' + unit : 'Bodyweight'} × ${st.r}`);
          }
        }
      }
    }
  }

  totalVol = dispW(totalVol);
  const volStr = Math.round(totalVol).toLocaleString();
  const durText = formatDuration(s.duration || 0);
  const nextTimeHTML = nextTimePlanHTML(lastEntry); // ota-31 item 2

  // Program session timeline across current rotation pass
  const msPerDay = 86400000;
  const doneThisWeek = {};
  if (prog) {
    const rot = getProgramRotationState(prog, hist);
    const displayMap = rot.displayDoneMap || {};
    for (const [sid, info] of Object.entries(displayMap)) {
      if (sid !== sessId && info && info.endTime) {
        doneThisWeek[sid] = info.endTime;
      }
    }
  }

  const tableRows = prog ? prog.sessions.map(ps => {
    const isNow = ps.id === sessId;
    const priorDone = doneThisWeek[ps.id];
    if (isNow) {
      return `<div class="finish-row finish-row-now">
        <div class="fr-icon">✦</div>
        <div class="fr-info">
          <div class="fr-name">${ps.name}</div>
          <div class="fr-date">Just completed · ${durText}</div>
        </div>
      </div>`;
    } else if (priorDone) {
      const daysAgo = Math.floor((Date.now() - priorDone) / msPerDay);
      const dateLabel = daysAgo === 0 ? 'Today' : daysAgo === 1 ? 'Yesterday' : daysAgo + ' days ago';
      return `<div class="finish-row finish-row-done-prior">
        <div class="fr-icon fr-icon-prior">✓</div>
        <div class="fr-info">
          <div class="fr-name">${ps.name}</div>
          <div class="fr-date">${dateLabel}</div>
        </div>
      </div>`;
    } else {
      return `<div class="finish-row finish-row-remaining">
        <div class="fr-icon">·</div>
        <div class="fr-info">
          <div class="fr-name">${ps.name}</div>
          <div class="fr-date">${ps.exercises.length} movements</div>
        </div>
      </div>`;
    }
  }).join('') : '';

  let prSectionHTML = '';
  if (prsHit.length > 0) {
    prSectionHTML = `
      <div style="margin: 0 auto 16px; padding: 14px 18px; border-radius: 18px; background: linear-gradient(135deg, rgba(234,179,8,0.15), rgba(240,78,35,0.12)); border: 1px solid rgba(234,179,8,0.38); max-width: 340px; text-align: left;">
        <div style="font-size: var(--fs-sm); font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #B45309; margin-bottom: 6px;">✦ New Records Established</div>
        ${prsHit.map(pr => `<div style="font-size: var(--fs-md); font-weight: 600; color: var(--text-primary); margin-bottom: 3px;">• ${pr}</div>`).join('')}
      </div>
    `;
  }

  // e1RM delta badge
  let e1rmBadgeHTML = '';
  if (s.e1rmDelta !== null && s.e1rmDelta !== undefined) {
    const up = s.e1rmDelta >= 0;
    e1rmBadgeHTML = `
      <div style="margin:0 auto 16px;padding:10px 18px;border-radius:14px;
        background:${up ? 'rgba(16, 185, 129, 0.08)' : 'rgba(239, 68, 68, 0.08)'};
        border:1px solid ${up ? 'rgba(16, 185, 129, 0.25)' : 'rgba(239, 68, 68, 0.25)'};
        text-align:center;max-width:340px">
        <div style="font-family:var(--font-mono);font-size:var(--fs-xl);font-weight:700;
          color:${up ? 'var(--accent-success)' : 'var(--accent-destructive)'};">
          ${up ? '▲' : '▼'} ${up ? '+' : ''}${s.e1rmDelta}%
        </div>
        <div style="font-size:var(--fs-sm);color:var(--text-tertiary);margin-top:2px;">Progression Delta vs Previous Session</div>
      </div>`;
  }

  const el = document.createElement('div');
  el.id = 'finish-screen';
  el.innerHTML = `
    <div class="finish-headline">Session Complete.</div>
    <div class="finish-session-label">${sess ? sess.name : 'Workout'} · ${prog ? prog.name : ''}</div>
    ${prSectionHTML}
    ${e1rmBadgeHTML}
    <div class="finish-stats-row" style="margin-bottom: 14px;">
      <div class="finish-stat"><div class="finish-stat-val">${durText}</div><div class="finish-stat-lbl">Duration</div></div>
      <div class="finish-stat"><div class="finish-stat-val">${volStr} ${unit}</div><div class="finish-stat-lbl">Tonnage</div></div>
      <div class="finish-stat"><div class="finish-stat-val">${totalSetsDone}</div><div class="finish-stat-lbl">Sets Logged</div></div>
    </div>
    ${(s.duration > 0 && totalVol > 0) ? `
      <div style="font-size:var(--fs-sm);color:var(--text-secondary);margin: -4px 0 14px;">
        <strong style="color:var(--text-primary);">${Math.round(totalVol / Math.max(1, (s.duration / 60)))}</strong> ${unit}/min workout density
      </div>` : ''}
    ${nextTimeHTML}
    ${prog ? `<div class="finish-plan-table">${tableRows}</div>` : ''}
    <button class="btn btn-primary" style="max-width:360px;width:100%;font-size:var(--fs-md);padding:14px;" onclick="dismissFinish()">Back to Home</button>
  `;
  document.body.appendChild(el);
  requestAnimationFrame(() => tickStats(el));
}

function dismissFinish() {
  const el = document.getElementById('finish-screen');
  if (el) el.remove();
  stopConfetti();
  // Belt-and-suspenders: workout is fully done and we're leaving for Home. Null the
  // live-session markers saveNow() keys off, so even outside the workoutCommitted
  // guard nothing (late timer, visibilitychange, pagehide) can resurrect the
  // snapshot / "Continue" pill. currentProgram stays for the Home silhouette/streak.
  ST.currentSession = null;
  ST.workoutStart = null;
  ST.workoutSets = {};
  ST.completedCards = new Set();
  ST.expandedCards = new Set();
  ST.durationSecs = 0;
  Maps('home');
}

// ── Confetti ──────────────────────────────────────────────────────────────────
let confettiFrame = null;
let confettiParticles = [];

function launchConfetti(dramatic) {
  const canvas = document.getElementById('confetti-canvas');
  if (!canvas || !canvas.getContext) return;
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  if (!ctx) return;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#F04E23','#FFB347','#FAF7F2','#1A1A1A','#F59E0B'];
  confettiParticles = [];
  const count = dramatic ? 200 : 100;
  for (let i = 0; i < count; i++) {
    confettiParticles.push({
      x: Math.random() * canvas.width,
      y: -10 - Math.random() * 100,
      w: 6 + Math.random() * 8,
      h: 10 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * (dramatic ? 5 : 3),
      vr: (Math.random() - 0.5) * 8,
      opacity: 1,
    });
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of confettiParticles) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.1;
      if (p.y < canvas.height + 20) { alive = true; }
      else { p.opacity -= 0.02; }
      if (p.opacity <= 0) continue;
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if (alive) confettiFrame = requestAnimationFrame(draw);
    else stopConfetti();
  }
  if (confettiFrame) cancelAnimationFrame(confettiFrame);
  confettiFrame = requestAnimationFrame(draw);
}

function stopConfetti() {
  if (confettiFrame) { cancelAnimationFrame(confettiFrame); confettiFrame = null; }
  const canvas = document.getElementById('confetti-canvas');
  if (canvas) canvas.style.display = 'none';
}

// ── Progress graph (liquid glass modal) ───────────────────────────────────────
function showProgressGraph(e, exName) {
  if (e && e.stopPropagation) e.stopPropagation();
  const unit = getWeightUnit();
  const hist = getHistory().filter(w => w && w.sets);
  
  // Gather weekly best weight for this exercise across all programs, additions & imports
  const weekData = {};
  for (const w of hist) {
    for (const [key, sets] of Object.entries(w.sets)) {
      if (key.endsWith('_wu') || !sets || sets.length === 0) continue;

      let storedName = null;
      for (const s of sets) {
        if (s && s._name) { storedName = s._name; break; }
      }
      if (!storedName && w.subs && w.subs[key]) {
        storedName = w.subs[key];
      }
      if (!storedName && key.startsWith('add_') && w.additions) {
        const addIdx = parseInt(key.slice(4));
        if (w.additions[addIdx]) storedName = w.additions[addIdx].name;
        else {
          const foundAdd = w.additions.find(a => a && (a.id === key || a.name === exName || (a.name && exercisesMatch(a.name, exName))));
          if (foundAdd) storedName = foundAdd.name;
        }
      }
      if (!storedName && key.startsWith('import_')) {
        storedName = key.slice(7).replace(/_/g, ' ');
      }
      if (!storedName && w.programId && w.programId !== 'import') {
        const prog = PROGRAMS.find(p => p.id === w.programId);
        if (prog) {
          const sess = prog.sessions.find(s => s.id === w.sessionId);
          if (sess) {
            const exIdx = parseInt(key.split('_').pop());
            if (!isNaN(exIdx) && sess.exercises[exIdx]) {
              storedName = stripSuperset(sess.exercises[exIdx].name);
            }
          }
        }
      }

      if (!storedName) continue;
      if (!exercisesMatch(exName, storedName)) continue;

      const weekKey = Math.floor((w.endTime || Date.now()) / (7 * 24 * 3600 * 1000));
      if (w._dupOf) continue;
      for (const s of sets) {
        if (!s || s.w == null || s.w === '' || Number(s.w) <= 0 || s._suspect) continue;
        const wVal = dispW(Number(s.w));
        if (!weekData[weekKey] || wVal > weekData[weekKey].w) {
          weekData[weekKey] = { w: wVal, r: s.r };
        }
      }
    }
  }

  const weekKeys = Object.keys(weekData).sort((a,b)=>a-b).slice(-8);
  const points = weekKeys.map(k => weekData[k]);
  const hasData = points.length >= 1;

  // Build SVG chart
  let chartHtml = '';
  if (points.length >= 2) {
    const W = 322, H = 120;
    const vals = points.map(p => p.w);
    const maxW = Math.max(...vals), minW = Math.min(...vals);
    const range = maxW - minW || 1;
    const pad = { l: 8, r: 8, t: 16, b: 28 };
    const chartW = W - pad.l - pad.r, chartH = H - pad.t - pad.b;

    const xs = vals.map((_, i) => pad.l + (i / (vals.length - 1)) * chartW);
    const ys = vals.map(v => pad.t + chartH - ((v - minW) / range) * chartH);

    // Area fill path
    const linePts = xs.map((x, i) => `${x},${ys[i]}`).join(' ');
    const areaPath = `M${xs[0]},${ys[0]} ` + xs.map((x,i)=>`L${x},${ys[i]}`).join(' ') + ` L${xs[xs.length-1]},${H-pad.b} L${xs[0]},${H-pad.b} Z`;

    // Week labels — just show "W-N" from most recent
    const labels = weekKeys.map((_, i) => {
      const weeksAgo = weekKeys.length - 1 - i;
      return weeksAgo === 0 ? 'Now' : `-${weeksAgo}w`;
    });

    // Grid lines
    const gridLines = [0, 0.5, 1].map(f => {
      const y = pad.t + chartH * (1 - f);
      const val = Math.round(minW + f * range);
      return `<line x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}" stroke="rgba(26,26,26,0.07)" stroke-width="1"/>
              <text x="${pad.l}" y="${y - 3}" font-size="8" fill="rgba(26,26,26,0.35)" font-family="-apple-system,sans-serif">${val} ${unit}</text>`;
    }).join('');

    chartHtml = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F04E23" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#F04E23" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <path d="${areaPath}" fill="url(#areaGrad)"/>
      <polyline points="${linePts}" fill="none" stroke="#F04E23" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${xs.map((x,i) => `<circle cx="${x}" cy="${ys[i]}" r="${i===vals.length-1?5:3}" fill="${i===vals.length-1?'#F04E23':'rgba(240,78,35,0.45)'}"/>`).join('')}
      ${labels.map((lbl, i) => `<text x="${xs[i]}" y="${H - 4}" text-anchor="middle" font-size="9" fill="rgba(26,26,26,0.4)" font-family="-apple-system,sans-serif">${lbl}</text>`).join('')}
    </svg>`;
  } else if (points.length === 1) {
    chartHtml = `<div class="graph-no-data">1 session logged (${points[0].w} ${unit}) — keep going to see your trend.</div>`;
  } else {
    chartHtml = `<div class="graph-no-data">No history yet for this exercise.</div>`;
  }

  const latestW = hasData ? points[points.length-1].w + ' ' + unit : '—';
  const peakW = hasData ? Math.max(...points.map(p=>p.w)) + ' ' + unit : '—';
  const diffVal = points.length >= 2 ? (points[points.length-1].w - points[0].w) : 0;
  const trend = points.length >= 2
    ? (diffVal >= 0 ? `↑ +${diffVal} ${unit} over ${points.length}w` : `↓ ${diffVal} ${unit}`)
    : '—';

  document.getElementById('graph-content').innerHTML = `
    <div class="graph-ex-title">${escHtml(exName)}</div>
    <div class="graph-meta">Progressive Overload · Max Weight / Week</div>
    <div class="graph-svg-wrap">${chartHtml}</div>
    <div class="graph-stat-row">
      <div class="graph-stat"><div class="graph-stat-val">${latestW}</div><div class="graph-stat-lbl">Latest</div></div>
      <div class="graph-stat"><div class="graph-stat-val">${peakW}</div><div class="graph-stat-lbl">Peak</div></div>
      <div class="graph-stat" style="flex:1.5"><div class="graph-stat-val" style="font-size:var(--fs-md)">${trend}</div><div class="graph-stat-lbl">Trend</div></div>
    </div>
  `;
  const bd = document.getElementById('graph-backdrop');
  bd.style.display = 'flex';
  requestAnimationFrame(() => bd.classList.add('visible'));
  try {
    if (history.state && history.state.overlay) {
      history.replaceState({ screen: ST.screen, overlay: 'graph' }, '', '#graph');
    } else if (!history.state || history.state.overlay !== 'graph') {
      history.pushState({ screen: ST.screen, overlay: 'graph' }, '', '#graph');
    }
  } catch(err) {}
}
