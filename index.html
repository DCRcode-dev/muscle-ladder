  background: linear-gradient(145deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.13) 100%);
  border: 1px solid rgba(255,255,255,0.50);
  border-radius: 28px;
  box-shadow: 0 40px 100px rgba(0,0,0,0.45),
              0 8px 24px rgba(0,0,0,0.20),
              inset 0 1.5px 0 rgba(255,255,255,0.70),
              inset 0 -1px 0 rgba(255,255,255,0.12);
  padding: 28px 24px 32px;
  transform: translateY(24px) scale(0.96);
  transition: transform var(--dur-slow) var(--ease);
  position: relative; overflow: hidden;
}
#graph-backdrop.visible #graph-panel { transform: translateY(0) scale(1); }
#graph-panel::before {
  content: ''; position: absolute; top: -60%; left: -40%;
  width: 180%; height: 180%;
  background: conic-gradient(from 180deg at 50% 50%,
    rgba(255,255,255,0.09) 0deg, transparent 60deg,
    rgba(255,255,255,0.05) 120deg, transparent 180deg,
    rgba(255,255,255,0.07) 240deg, transparent 300deg,
    rgba(255,255,255,0.09) 360deg);
  animation: glassShimmer 6s linear infinite; pointer-events: none;
}
@keyframes glassShimmer { to { transform: rotate(360deg); } }
.graph-close {
  position: absolute; top: 18px; right: 18px;
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(42,36,33,0.10); border: 1px solid rgba(42,36,33,0.08);
  cursor: pointer; font-size: var(--fs-md); color: var(--charcoal);
  display: flex; align-items: center; justify-content: center;
}
.graph-ex-title {
  font-family: var(--font-hero); font-style: italic;
  font-size: var(--fs-xl); font-weight: 600; color: var(--charcoal);
  margin-bottom: 2px; position: relative;
}
.graph-meta {
  font-size: var(--fs-xs); color: rgba(42,36,33,0.45);
  text-transform: uppercase; letter-spacing: 1.2px;
  margin-bottom: 20px; position: relative;
}
.graph-no-data { font-size: var(--fs-md); color: rgba(42,36,33,0.45); font-style: italic; margin: 24px 0; text-align: center; position: relative; }
.graph-svg-wrap { position: relative; width: 100%; }
.graph-stat-row { display: flex; gap: 12px; margin-top: 20px; position: relative; }
.graph-stat {
  flex: 1; background: rgba(255,255,255,0.35);
  border-radius: 14px; padding: 12px;
  border: 1px solid rgba(255,255,255,0.5);
}
.graph-stat-val { font-size: var(--fs-xl); font-weight: 700; color: var(--charcoal); font-variant-numeric: tabular-nums; }
.graph-stat-lbl { font-size: var(--fs-xs); color: rgba(42,36,33,0.45); text-transform: uppercase; letter-spacing: 0.8px; margin-top: 2px; }

/* ── Muscle glass overlay ── */
#muscle-graph-overlay {
  position: fixed; inset: 0;
  background: oklch(8% 0.012 260 / 0.54);
  backdrop-filter: blur(28px) saturate(1.8);
  -webkit-backdrop-filter: blur(28px) saturate(1.8);
  z-index: 700; display: none; align-items: center; justify-content: center;
  padding: 24px; opacity: 0; transition: opacity 300ms ease;
}
#muscle-graph-overlay.visible { opacity: 1; }
/* silhouette focus vignette — inactive muscles fade */
.muscle-group { transition: opacity 500ms cubic-bezier(0.16,1,0.3,1); }
.silhouette-focus-active .muscle-group { opacity: 0.5; }
.silhouette-focus-active .muscle-group.muscle-focused { opacity: 1 !important; }
/* recovery rings + ghost trace */
.mg-recovery-rings { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
.mg-ring-label { font-size: var(--fs-xs); color: rgba(255,255,255,0.42); font-family: var(--font-mono); letter-spacing: 0.06em; margin-left: 4px; }
.mg-ghost-trace { opacity: 0.25; }
#muscle-graph-panel {
  width: 100%; max-width: 380px; max-height: 88vh;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--surface-card);
  border: 1px solid var(--border-subtle);
  border-radius: 28px;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.28);
  padding: 22px 20px 20px; position: relative;
  transform: scale(0.88); transform-origin: center center;
  transition: transform var(--dur-slow) var(--spring-snappy);
  color: var(--text-primary);
}
#muscle-graph-overlay.visible #muscle-graph-panel { transform: scale(1); }
.mg-close {
  position: absolute; top: 16px; right: 16px;
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--surface-sunken); border: 1px solid var(--border-subtle);
  cursor: pointer; font-size: var(--fs-md); color: var(--text-secondary);
  display: flex; align-items: center; justify-content: center;
  z-index: 2; -webkit-tap-highlight-color: transparent;
  transition: transform var(--dur-fast) var(--ease);
}
.mg-close:active { transform: scale(0.92); }
.mg-head { display: flex; align-items: flex-start; justify-content: space-between; padding-right: 36px; margin-bottom: 8px; }
.mg-muscle-title {
  font-family: var(--font-hero); font-style: italic;
  font-size: 28px; font-weight: 600; color: var(--text-primary); line-height: 1.05;
}
.mg-meta {
  font-size: var(--fs-xs); color: var(--text-tertiary);
  text-transform: uppercase; letter-spacing: 0.12em; margin-top: 3px; font-weight: 700;
}
.mg-delta {
  font-family: var(--font-mono); font-size: var(--fs-md); font-weight: 700;
  font-variant-numeric: tabular-nums lining-nums; white-space: nowrap; padding-top: 4px;
}
.mg-delta-up   { color: var(--accent-success); }
.mg-delta-down { color: var(--accent-kinetic); }
.mg-delta-none { font-family: var(--font-hero); font-style: italic; font-size: var(--fs-md); color: var(--text-tertiary); }
.mg-switcher {
  display: flex; gap: 6px; overflow-x: auto; margin: 4px -20px 12px; padding: 2px 20px 6px;
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
}
.mg-switcher::-webkit-scrollbar { display: none; }
.mg-chip {
  flex-shrink: 0; padding: 6px 14px; border-radius: 16px;
  border: 1px solid var(--border-subtle); background: var(--surface-card);
  font-size: var(--fs-sm); font-weight: 600; color: var(--text-secondary);
  font-family: var(--font-body); cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: all var(--dur-fast) var(--spring-snappy);
  box-shadow: var(--shadow-sm);
}
.mg-chip:active { transform: scale(0.94); }
.mg-chip.active { background: var(--accent-kinetic); border-color: var(--accent-kinetic); color: #fff; box-shadow: 0 2px 8px rgba(240,78,35,0.30); }
.mg-stats-row {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; margin: 10px 0 14px;
}
.mg-stat-box {
  background: var(--surface-sunken); border: 1px solid var(--border-subtle);
  border-radius: 14px; padding: 10px 8px; text-align: center;
}
.mg-stat-lbl {
  font-size: var(--fs-xs); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-tertiary); margin-bottom: 4px;
}
.mg-stat-num {
  font-family: var(--font-mono); font-size: var(--fs-md); font-weight: 700;
  color: var(--text-primary); font-variant-numeric: tabular-nums lining-nums;
}
.mg-chart-wrap { margin-bottom: 6px; background: var(--surface-sunken); border-radius: 16px; padding: 10px 8px; border: 1px solid var(--border-subtle); }
.mg-empty {
  font-family: var(--font-hero); font-style: italic; font-size: var(--fs-md);
  color: var(--text-tertiary); margin: 26px 0; text-align: center;
}
.mg-line-draw {
  stroke-dasharray: 1; stroke-dashoffset: 1;
  animation: mgLineDraw 720ms var(--ease) 80ms forwards;
}
.mg-area-draw { opacity: 0; animation: mgAreaIn 540ms var(--ease) 420ms forwards; }
@keyframes mgLineDraw { to { stroke-dashoffset: 0; } }
@keyframes mgAreaIn   { to { opacity: 1; } }
.mg-driver-list {
  display: flex; flex-direction: column; gap: 8px; margin-top: 10px;
}
.mg-driver-card {
  background: var(--surface-sunken); border: 1px solid var(--border-subtle);
  border-radius: 14px; padding: 10px 14px; display: flex;
  justify-content: space-between; align-items: center;
}
.mg-dc-name { font-size: var(--fs-sm); font-weight: 600; color: var(--text-primary); }
.mg-dc-sub { font-size: var(--fs-xs); color: var(--text-tertiary); margin-top: 2px; }
.mg-dc-val {
  font-family: var(--font-mono); font-size: var(--fs-md); font-weight: 700;
  color: var(--accent-kinetic); text-align: right; font-variant-numeric: tabular-nums lining-nums;
}
.mg-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.mg-range { display: flex; background: var(--surface-sunken); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 2px; gap: 0; }
.mg-range-btn {
  border: none; background: none; padding: 5px 12px; border-radius: 8px;
  font-size: var(--fs-sm); font-weight: 600; color: var(--text-tertiary); cursor: pointer;
  font-family: var(--font-body); -webkit-tap-highlight-color: transparent;
  transition: all var(--dur-fast) var(--ease);
}
.mg-range-btn.active { background: var(--surface-card); color: var(--text-primary); box-shadow: var(--shadow-sm); }
.mg-now { font-size: var(--fs-sm); color: var(--text-tertiary); font-variant-numeric: tabular-nums; }
.mg-now strong { color: var(--text-primary); font-weight: 600; }

/* ── Program picker ── */
.prog-picker-header { padding: calc(env(safe-area-inset-top, 0px) + 32px) 24px 16px; }
.prog-picker-header h2 { font-family: var(--font-hero); font-size: 32px; font-weight: 600; font-style: italic; color: var(--text-primary); letter-spacing: -0.015em; }
.prog-picker-header p { font-size: var(--fs-md); color: var(--text-secondary); margin-top: 4px; }
.day-selector { display: flex; gap: 8px; padding: 4px 24px 20px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.day-chip {
  flex-shrink: 0; padding: 8px 18px; border-radius: 20px;
  border: 1px solid var(--border-subtle); font-size: var(--fs-md); font-weight: 600;
  cursor: pointer; transition: all 150ms var(--spring-snappy); background: var(--surface-card); color: var(--text-secondary);
  box-shadow: var(--shadow-sm);
}
.day-chip:active { transform: scale(0.94); }
.day-chip.selected { background: var(--accent-kinetic); border-color: var(--accent-kinetic); color: #fff; box-shadow: 0 4px 14px rgba(240,78,35,0.32); }
.prog-list { padding: 0 16px; }
.prog-card {
  background: var(--surface-card); border-radius: 20px; margin-bottom: 12px;
  padding: 18px 20px; box-shadow: var(--shadow-sm); cursor: pointer;
  display: flex; align-items: center; gap: 16px;
  border: 1px solid var(--border-subtle);
  transition: transform 160ms var(--spring-snappy), box-shadow 160ms, border-color 160ms;
}
.prog-card:active { transform: scale(0.98); border-color: var(--accent-kinetic); }
.prog-card-days {
  width: 48px; height: 48px; border-radius: 14px; background: var(--surface-sunken);
  display: flex; align-items: center; justify-content: center;
  font-family: var(--font-mono); font-size: var(--fs-xl); font-weight: 700; color: var(--accent-kinetic); flex-shrink: 0;
  font-variant-numeric: tabular-nums lining-nums;
}
.prog-card-info h3 { font-size: var(--fs-lg); font-weight: 600; color: var(--text-primary); letter-spacing: -0.01em; }
.prog-card-info p { font-size: var(--fs-sm); color: var(--text-secondary); margin-top: 3px; }


/* ── Settings ── */
.settings-section { margin: 20px 16px; background: var(--surface-card); border-radius: 20px; overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border-subtle); }
.settings-section-title { font-size: var(--fs-sm); font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.09em; padding: 18px 18px 10px; }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; min-height: 54px; position: relative; }
.settings-row + .settings-row::before { content: ''; position: absolute; top: 0; left: 18px; right: 0; height: 0.5px; background: var(--border-subtle); }
.settings-row:active { background: var(--surface-sunken); }
.settings-row:first-of-type { border-top: none; }
.settings-row label { font-size: var(--fs-md); color: var(--text-primary); font-weight: 500; }
.settings-row input[type=text], .settings-row input[type=url] { border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; font-size: var(--fs-md); width: 160px; font-family: var(--font-body); outline: none; background: var(--surface-canvas); }
.settings-row input:focus { border-color: var(--accent-kinetic); }
.settings-danger { color: var(--accent-danger) !important; }

/* ── Empty state ── */
.empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 24px; text-align: center; }
.empty-title { font-family: var(--font-hero); font-size: 36px; font-weight: 600; font-style: italic; color: var(--text-primary); margin-bottom: 12px; }
.empty-sub { font-size: var(--fs-md); color: var(--text-secondary); margin-bottom: 32px; font-style: italic; }

/* ── Progress row ── */
.progress-table { margin: 0 16px; }
.prog-row { display: flex; align-items: center; gap: 10px; padding: 14px; background: var(--surface-card); border-radius: 16px; margin-bottom: 8px; cursor: pointer; box-shadow: var(--shadow-sm); min-height: 56px; border: 1px solid var(--border-subtle); }
.prog-row-muscle { font-size: var(--fs-md); font-weight: 500; flex: 1; }
.prog-row-sparkline { width: 60px; height: 24px; }
.prog-row-1rm { font-size: var(--fs-md); font-weight: 600; color: var(--text); text-align: right; min-width: 50px; font-variant-numeric: tabular-nums; }
.status-dot { width: 8px; height: 8px; border-radius: 4px; flex-shrink: 0; }
.dot-green { background: var(--green); }
.dot-amber { background: #F59E0B; }
.dot-red { background: #EF4444; }

/* ── Shimmer ── */
@keyframes luxShimmer {
  0%   { background-position: -200% center; }
  100% { background-position:  200% center; }
}
.btn-shimmer {
  background: linear-gradient(90deg, var(--accent) 20%, #ff7a52 50%, var(--accent) 80%) !important;
  background-size: 200% auto !important;
  animation: luxShimmer 220ms ease-out forwards !important;
}

/* ── Confetti canvas ── */
#confetti-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 299; }

/* ── Deload banner ── */
.deload-banner { margin: 0 24px 16px; background: #FFF7ED; border: 1px solid #FED7AA; border-radius: 14px; padding: 12px 16px; font-size: var(--fs-md); color: #92400E; }

/* ── Stats / metrics ── */
.stats-row { display: flex; gap: 0; margin: 0 24px 20px; background: var(--card); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
.stat-item { flex: 1; padding: 14px 10px; text-align: center; border-right: 1px solid var(--border); }
.stat-item:last-child { border-right: none; }
.stat-val { font-size: var(--fs-xl); font-weight: 300; color: var(--charcoal); font-variant-numeric: tabular-nums lining-nums; letter-spacing: -0.01em; }
.stat-lbl { font-size: var(--fs-xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

/* Tabular lining for all numeric metrics globally */
.stat-val, .wh-duration, #rest-countdown,
.pill-dur, .mg-stat-val, .graph-stat-val, .cal-popup-stat-val,
.gauge-pct-label, .finish-stat-val {
  font-variant-numeric: tabular-nums lining-nums;
}

/* Deceleration timing on all interactive surfaces */
.screen        { transition-timing-function: cubic-bezier(0.16,1,0.3,1) !important; }
.muscle-group  { transition: filter 350ms cubic-bezier(0.16,1,0.3,1) !important; }
.ob-pill       { transition-timing-function: cubic-bezier(0.16,1,0.3,1) !important; }

/* ── Install prompt suppressed — native Android Chrome ── */
.install-prompt, #install-prompt { display: none !important; }



/* ═══════════════════════════════════════════════════════════════════════════════
   ota-30 · Premium cream ("Vellum") — workout card, sets, swap sheet.
   Cream stays the main look. Colour is reserved for state: copper = active, sage = done.
   Calendar popup, silhouette and home are intentionally untouched.
   ═══════════════════════════════════════════════════════════════════════════════ */
:root {
  --font-body: 'Manrope', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  --sage:        #5f8a5c;
  --sage-ink:    #4f7a4c;
  --sage-bg:     rgba(95, 138, 92, 0.12);
  --hold-ink:    #a9832e;
  --hold-bg:     rgba(169, 131, 46, 0.12);
  --tile:        oklch(95.4% 0.010 72);
  --tile-strong: oklch(93% 0.013 72);
  --line-soft:   rgba(36, 32, 28, 0.06);
  --shadow-md:
    0 1px 2px rgba(42,36,33,0.04),
    0 6px 18px rgba(42,36,33,0.07),
    0 18px 40px rgba(42,36,33,0.05);
}
body { font-family: var(--font-body); -webkit-font-smoothing: antialiased; }

/* Card surface: borderless, soft depth */
.ex-card {
  border: 0; border-radius: 22px;
  box-shadow: 0 1px 0 var(--line-soft) inset, 0 4px 14px rgba(42,36,33,0.05);
}
.ex-card.expanded { border: 0; box-shadow: var(--shadow-md); }
.ex-card.completed { border-left: 0; box-shadow: inset 0 0 0 1.5px rgba(95,138,92,0.30), 0 4px 14px rgba(42,36,33,0.04); }
.ex-card-header { padding: 16px 16px 14px 18px; align-items: flex-start; }
.ex-kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.ex-name { font-size: var(--fs-lg); font-weight: 700; letter-spacing: -0.015em; line-height: 1.25; }
.ex-card.completed .ex-name { text-decoration: none; color: var(--sage-ink); }
.ex-meta { font-size: var(--fs-sm); color: var(--text-secondary); font-weight: 500; margin-top: 3px; font-variant-numeric: tabular-nums; }
.ex-check-pill { font-size: var(--fs-xs); letter-spacing: .06em; color: var(--sage-ink); background: var(--sage-bg); border-radius: 999px; padding: 2px 8px; }
.ex-card.completed .ex-chevron { color: var(--sage); }
.ex-sub-note { display: flex; align-items: center; gap: 6px; font-size: var(--fs-sm); font-weight: 600; color: var(--text-secondary); margin-top: 3px; font-style: normal; }
.ex-sub-note svg { width: 13px; height: 13px; flex-shrink: 0; color: var(--accent-kinetic); }
.ex-cue-btn, .ex-graph-btn, .ex-menu-btn, .ex-note-btn { border: 0; background: var(--tile); }
.ex-note-btn.has-note { border: 0; }

/* Muscle label: text with a small tonal dot instead of a pastel chip */
.muscle-badge {
  background: transparent !important; color: var(--text-secondary) !important;
  display: inline-flex; align-items: center; gap: 6px; padding: 0; margin: 0;
  font-size: var(--fs-sm); font-weight: 700; letter-spacing: .03em; text-transform: none;
}
.muscle-badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--mdot, #a39b92); opacity: .85; }

/* Weight memory chips (by rep range) */
.zone-chips { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.zone-chip {
  flex: 1 1 0; min-width: 120px; text-align: left; border: 0; cursor: pointer; font: inherit;
  border-radius: 12px; padding: 7px 10px; background: var(--tile); color: var(--text-secondary);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.zone-chip b { display: block; font-size: var(--fs-xs); font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
.zone-chip span { display: block; font-size: var(--fs-sm); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.zone-chip[aria-pressed="true"] { background: color-mix(in oklab, var(--accent-kinetic) 12%, var(--surface-card)); color: var(--text-primary); }
.zone-chip[aria-pressed="true"] b { color: var(--accent-kinetic); }
.zone-chip.empty span { font-style: italic; font-weight: 500; }
.ex-last-perf { font-style: normal; font-weight: 500; font-variant-numeric: tabular-nums; }

/* Progression verdict */
.verdict { display: flex; gap: 10px; align-items: flex-start; margin: 2px 0 12px; padding: 10px 12px; border-radius: 14px; background: var(--sage-bg); font-size: var(--fs-md); line-height: 1.4; color: var(--text-primary); }
.verdict svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; color: var(--sage); }
.verdict strong { color: var(--sage-ink); font-weight: 700; }
.verdict.hold { background: var(--hold-bg); }
.verdict.hold svg, .verdict.hold strong { color: var(--hold-ink); }
.verdict.build { background: var(--tile); }
.verdict.build svg, .verdict.build strong { color: var(--text-secondary); }

/* Set rows: borderless number tiles, round log button */
.set-row {
  display: grid; grid-template-columns: 20px minmax(0,1fr) minmax(0,1fr) auto; align-items: center;
  gap: 8px; padding: 5px 6px 5px 2px; margin-bottom: 6px; border: 0; border-radius: 16px;
}
.set-row.active-focus {
  border: 0; background: color-mix(in oklab, var(--accent-kinetic) 6%, transparent);
  box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--accent-kinetic) 55%, transparent);
}
.set-row.is-logged { background: var(--sage-bg); }
.set-num { width: auto; font-family: var(--font-body); font-size: var(--fs-sm); font-weight: 700; color: var(--text-ghost); }
.set-row.active-focus .set-num { color: var(--accent-kinetic); }
.set-tile { position: relative; display: block; min-width: 0; }
.set-tile::after {
  content: attr(data-unit); position: absolute; right: 9px; bottom: 9px; pointer-events: none;
  font-size: var(--fs-xs); font-weight: 600; color: var(--text-tertiary); letter-spacing: 0;
}
.set-tile .set-input {
  width: 100%; height: 48px; border: 0; border-radius: 12px; box-shadow: none;
  background: var(--tile); color: var(--text-primary);
  font-family: var(--font-body); font-size: var(--fs-xl); font-weight: 700; letter-spacing: -0.02em;
  padding: 0 26px 0 8px; text-align: center; font-variant-numeric: tabular-nums;
}
.set-tile .set-input::placeholder { color: var(--text-ghost); font-size: var(--fs-md); font-weight: 600; }
.set-tile .set-input:focus, .set-tile .set-input.np-focus { box-shadow: inset 0 0 0 2px var(--accent-kinetic); border: 0; }
.set-tile.sugg .set-input { box-shadow: inset 0 0 0 1.5px color-mix(in oklab, var(--sage) 55%, transparent); color: var(--sage-ink); background: var(--surface-card); }
.set-tile.est .set-input { background: transparent; box-shadow: inset 0 0 0 1.5px var(--tile-strong); color: var(--text-secondary); }
.set-tile.est::before { content: "est."; position: absolute; left: 8px; top: 5px; font-size: var(--fs-xs); font-weight: 800; letter-spacing: .06em; color: var(--text-tertiary); text-transform: uppercase; }
.set-input.logged { background: transparent !important; color: var(--sage-ink) !important; box-shadow: none !important; border: 0; }
.set-row.is-logged .set-tile::after { color: var(--sage); opacity: .8; }
.set-act { display: flex; align-items: center; gap: 6px; }
.set-log-btn {
  width: 46px; height: 46px; border-radius: 50%; margin-left: 0;
  background: var(--accent-kinetic); color: #fff; box-shadow: 0 2px 8px color-mix(in oklab, var(--accent-kinetic) 30%, transparent);
}
.set-log-btn svg { width: 20px; height: 20px; }
.set-log-btn.logged { background: var(--sage); color: #fff; box-shadow: none; }

/* RIR pills */
.rir-pills { display: inline-flex; gap: 3px; padding: 3px; border-radius: 999px; background: var(--surface-card); box-shadow: 0 0 0 1px var(--line-soft); }
.rir-pill { width: 28px; height: 28px; border-radius: 50%; border: 0; cursor: pointer; background: transparent; color: var(--text-secondary); font: 700 var(--fs-sm) var(--font-body); font-variant-numeric: tabular-nums; }
.rir-pill[aria-pressed="true"] { background: var(--sage); color: #fff; }
.set-row.is-last.is-logged .rir-pills { box-shadow: 0 0 0 1.5px color-mix(in oklab, var(--sage) 55%, transparent); }
.rir-gate { font-size: var(--fs-sm); line-height: 1.4; color: var(--text-tertiary); padding: 2px 4px 0 28px; }
.ex-foot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft); display: flex; align-items: center; justify-content: space-between; }
.ex-foot-lbl { font-size: var(--fs-sm); color: var(--text-tertiary); font-weight: 600; }
.plate-calc-trigger { border: 0; background: var(--tile); border-radius: 999px; padding: 6px 11px; gap: 6px; }
.plate-calc-trigger svg { width: 14px; height: 14px; }
.warmup-row { border-radius: 14px; }

@media (max-width: 350px) {
  .set-tile .set-input { font-size: var(--fs-xl); padding: 0 6px; }
  .set-tile::after { display: none; }
  .rir-pill { width: 26px; height: 26px; }
  .set-log-btn { width: 42px; height: 42px; }
}

/* Swap / library sheet */
.bs-title { letter-spacing: -0.015em; margin-bottom: 8px; }
.bs-sub { margin: 0 0 14px; color: var(--text-secondary); }
.bs-section-lbl { font-size: var(--fs-xs); font-weight: 800; letter-spacing: .08em; color: var(--text-tertiary); margin: 18px 2px 6px; }
.swap-head .bs-sub strong { color: var(--accent-kinetic); font-weight: 700; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 3px; border-radius: 12px; background: var(--tile); }
.seg button { border: 0; cursor: pointer; font: 700 var(--fs-md) var(--font-body); padding: 10px 6px; border-radius: 10px; background: transparent; color: var(--text-secondary); min-height: 40px; }
.seg button[aria-pressed="true"] { background: var(--surface-card); color: var(--text-primary); box-shadow: 0 1px 3px rgba(42,36,33,.12); }
.seg-note { font-size: var(--fs-sm); color: var(--text-secondary); margin: 7px 2px 0; }
.restore-row { display: grid; gap: 6px; margin-bottom: 12px; }
.restore-one { width: 100%; margin-bottom: 12px; }
.equip-chips { display: flex; gap: 6px; overflow-x: auto; margin: 14px 0 2px; padding-bottom: 2px; scrollbar-width: none; }
.equip-chips.wrap { flex-wrap: wrap; overflow: visible; margin-top: 4px; }
.equip-chips::-webkit-scrollbar { display: none; }
.equip-chips button { flex-shrink: 0; border: 0; cursor: pointer; font: 700 var(--fs-sm) var(--font-body); padding: 7px 12px; border-radius: 999px; background: var(--tile); color: var(--text-secondary); min-height: 32px; }
.equip-chips button[aria-pressed="true"] { background: var(--text-primary); color: var(--surface-card); }
.lib-section { display: flex; flex-direction: column; }
.opt-row {
  display: flex; justify-content: space-between; align-items: center; gap: 10px; width: 100%;
  border: 0; border-top: 1px solid var(--line-soft); background: transparent; cursor: pointer;
  padding: 11px 2px; min-height: 56px; text-align: left; font: inherit; color: var(--text-primary);
}
.lib-section .opt-row:first-child { border-top: 0; }
.opt-row:active { background: var(--tile); }
.opt-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.opt-main b { font-size: var(--fs-md); font-weight: 700; letter-spacing: -0.01em; }
.opt-main small { font-size: var(--fs-sm); color: var(--text-secondary); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.opt-side { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; flex-shrink: 0; }
.opt-side em { font-style: normal; font-size: var(--fs-xs); font-weight: 800; color: var(--accent-kinetic); letter-spacing: .03em; }
.opt-side i { font-style: normal; font-size: var(--fs-xs); font-weight: 600; color: var(--text-tertiary); }
.lib-more { margin-top: 12px; }
.lib-more summary { cursor: pointer; list-style: none; font-size: var(--fs-md); font-weight: 700; color: var(--text-secondary); padding: 10px 2px; border-top: 1px solid var(--line-soft); }
.lib-more summary::-webkit-details-marker { display: none; }
.lib-more summary::after { content: " +"; color: var(--text-tertiary); }
.lib-more[open] summary::after { content: " −"; }
.lib-add-custom { display: flex; align-items: center; gap: 8px; width: 100%; margin-top: 10px; padding: 12px; border: 1.5px dashed var(--border-strong); border-radius: 14px; background: transparent; cursor: pointer; font: 700 var(--fs-md) var(--font-body); color: var(--text-primary); }
.lib-add-custom svg { width: 16px; height: 16px; color: var(--accent-kinetic); }
.bs-search { border-radius: 12px; }

@media (prefers-reduced-motion: no-preference) {
  .rir-pill, .zone-chip, .seg button, .set-log-btn, .equip-chips button { transition: background .18s ease, color .18s ease, transform .2s var(--spring-bounce); }
  .set-log-btn.logged svg { animation: ota30-check .32s var(--spring-bounce); }
}
@keyframes ota30-check { from { transform: scale(.4) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }

/* ── ota-31: ledger batch (cream base, sage = done) ─────────────────────── */
.sync-badge { display:flex; align-items:center; gap:8px; width:calc(100% - 32px); margin:4px 16px 10px; padding:9px 12px; border-radius:14px; border:1px solid var(--border-strong); background:var(--surface-raised); color:var(--text-secondary); font:500 var(--fs-sm) var(--font-body); text-align:left; cursor:pointer; }
.sync-badge .sb-dot { width:8px; height:8px; border-radius:50%; background:var(--accent-timer); flex-shrink:0; }
.sync-badge .sb-text { flex:1; min-width:0; }
.sync-badge .sb-cta { color:var(--accent); font-weight:600; white-space:nowrap; }
.sync-badge:disabled { opacity:.7; }
.next-time-card { width:100%; max-width:360px; margin:0 auto 14px; padding:12px 14px; border-radius:16px; background:var(--surface-raised); border:1px solid var(--border); text-align:left; }
.next-time-card .nt-title { font:700 var(--fs-xs) var(--font-body); letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:6px; }
.next-time-card .nt-line { font-size:var(--fs-md); line-height:1.45; color:var(--text-primary); margin:2px 0; }
.next-time-card .nt-line b { font-weight:600; }
.next-time-card .nt-line.up b { color:var(--sage-ink); }
.next-time-card .nt-line.hold b { color:var(--text-secondary); }
.next-time-card .nt-line.build b { color:var(--accent); }
.cal-cmp { font-size:var(--fs-sm); margin:-2px 0 6px 26px; color:var(--text-tertiary); font-variant-numeric:tabular-nums; }
.cal-cmp.up { color:var(--sage-ink); }
.cal-cmp.down { color:var(--accent); }
.cal-ex-note { font-size:var(--fs-sm); font-style:italic; color:var(--text-secondary); margin:-2px 0 6px 26px; }
.cal-flag-line { font-size:var(--fs-sm); color:var(--text-secondary); background:var(--surface-sunken); border-radius:10px; padding:6px 8px; margin:0 0 6px 26px; }
.cal-flag-btn { margin-left:6px; border:1px solid var(--border-strong); background:var(--card); border-radius:8px; padding:2px 8px; font-size:var(--fs-sm); cursor:pointer; }
.cal-dup-note { font-size:var(--fs-sm); color:var(--text-secondary); background:var(--surface-sunken); border-radius:10px; padding:6px 10px; margin-top:8px; }
.whfc-dup { color:var(--text-tertiary); font-style:italic; }
.premium-resume-idle { font-size:var(--fs-sm); color:var(--text-tertiary); margin-top:2px; }
.premium-resume-continue.secondary { background:transparent; color:var(--charcoal); border:1px solid var(--border-strong); }
.ex-card.muscle-jump { box-shadow:0 0 0 2px var(--sage), var(--shadow-sm); transition:box-shadow .6s ease; }
.ota31-toast { position:fixed; left:50%; bottom:calc(92px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--surface-glass-dark); color:#fff; padding:9px 14px; border-radius:12px; font-size:var(--fs-md); z-index:9999; max-width:86vw; text-align:center; pointer-events:none; }

/* ── ota-34 (8): one type scale. Five text sizes; big display numbers keep their own size. ── */
:root {
  --fs-xs: 10px;   /* labels, captions */
  --fs-sm: 12px;   /* secondary text */
  --fs-md: 14px;   /* body */
  --fs-lg: 16px;   /* emphasis, list titles */
  --fs-xl: 20px;   /* section headings, stat numbers */
}
.t-sm { font-size: var(--fs-sm); }
.in-field { width:100%; padding:6px; border:1px solid var(--border); border-radius:6px; }
.in-field-lg { width:100%; padding:8px; border:1px solid var(--border); border-radius:8px; }
.btn-sm { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 12px; font-size:var(--fs-sm); cursor:pointer; color:var(--text-primary); }
.settings-sub { font-weight:normal; color:var(--muted); font-size:var(--fs-sm); }
.grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.pill-btn { padding:8px 12px; font-size:var(--fs-md); font-weight:700; border-radius:12px; }
.fix-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0 0; font-size:var(--fs-sm); color:var(--text-secondary); }
.fix-item span { min-width:0; }

/* ── ota-34 (1): workouts this month ── */
.hist-month-card { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:18px; padding:14px 16px 12px; margin:0 16px 16px; box-shadow:var(--shadow-sm); }
.hm-top { display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.hm-top .hsi-label { margin:0; }
.hm-val { font-family:var(--font-mono); font-variant-numeric:tabular-nums lining-nums; white-space:nowrap; }
.hm-count { font-size:var(--fs-xl); font-weight:700; color:var(--text-primary); }
.hm-of { font-size:var(--fs-md); color:var(--text-tertiary); font-weight:600; }
.hm-bar { height:8px; border-radius:6px; background:var(--border); margin:10px 0 8px; overflow:hidden; }
.hm-fill { height:100%; border-radius:6px; background:oklch(70% 0.110 82 / 0.86); transition:width 600ms cubic-bezier(0.16,1,0.3,1); }
.hm-fill.hm-done { background:oklch(56% 0.075 145 / 0.92); }
.hm-sub { font-size:var(--fs-sm); color:var(--text-tertiary); }

/* ── ota-34 (3): strength by muscle ── */
.growth-card { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:20px; padding:14px 16px; margin:0 16px 16px; box-shadow:var(--shadow-sm); }
.gc-head { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:6px; }
.gc-head .hsi-label { margin:0; }
.gc-sub { font-size:var(--fs-sm); color:var(--text-tertiary); }
.gc-body { display:flex; flex-direction:column; align-items:center; gap:10px; }
.gc-figure { width:100%; max-width:260px; }
.gc-figure svg { width:100%; height:auto; display:block; }
.gc-legend { display:flex; flex-wrap:wrap; justify-content:center; gap:6px 14px; font-size:var(--fs-sm); color:var(--text-secondary); }
.gc-legend > div { display:flex; align-items:center; gap:6px; }
.gc-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.gc-legend > .gc-hint { flex-basis:100%; justify-content:center; color:var(--text-tertiary); font-size:var(--fs-xs); margin-top:2px; }

/* ── ota-35: Progress tabs and the monthly chart ── */
.history-tabs.three::before { width:calc((100% - 6px) / 3); }
.history-tabs.three:has(.hist-tab:nth-child(2).active)::before { transform:translateX(100%); }
.history-tabs.three:has(.hist-tab:nth-child(3).active)::before { transform:translateX(200%); }
button.hist-month-card { display:block; width:calc(100% - 32px); text-align:left; font:inherit; color:inherit; cursor:pointer; -webkit-tap-highlight-color:transparent; }
button.hist-month-card:active { transform:scale(0.99); }
.hm-chev { margin-left:8px; font-size:var(--fs-lg); color:var(--text-tertiary); font-weight:400; }
.month-chart-card { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:20px; padding:14px 16px 10px; margin:0 16px 16px; box-shadow:var(--shadow-sm); }
.mc-svg { width:100%; height:auto; display:block; margin:6px 0 4px; overflow:visible; }
.mc-grid { stroke:var(--border-subtle); stroke-width:1; }
.mc-axis { font-family:var(--font-mono); font-size:var(--fs-xs); fill:var(--text-tertiary); }
.mc-axis-now { fill:var(--text-primary); font-weight:700; }
.mc-val { font-family:var(--font-mono); font-size:var(--fs-xs); fill:var(--text-secondary); font-weight:600; }
.mc-bar { fill:oklch(70% 0.110 82 / 0.86); }
.mc-bar.mc-hit { fill:oklch(56% 0.075 145 / 0.92); }
.mc-bar.mc-now { opacity:0.55; }
.mc-target { stroke:oklch(48% 0.130 35 / 0.75); stroke-width:1.2; stroke-dasharray:4 3; }
.mc-target-label { font-family:var(--font-mono); font-size:var(--fs-xs); fill:oklch(48% 0.130 35); font-weight:600; }
.mc-note { font-size:var(--fs-xs); color:var(--text-tertiary); line-height:1.4; }
.mc-summary { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:12px 0 6px; padding-top:10px; border-top:1px solid var(--border-subtle); font-size:var(--fs-sm); color:var(--text-secondary); }
.mc-summary b { color:var(--text-primary); font-family:var(--font-mono); }
.mc-list { display:flex; flex-direction:column; }
.mc-row { display:grid; grid-template-columns:1fr auto 64px; gap:10px; align-items:baseline; padding:9px 0; border-top:1px solid var(--border-subtle); font-size:var(--fs-md); color:var(--text-primary); }
.mc-row-n { font-size:var(--fs-sm); color:var(--text-tertiary); }
.mc-row-r { text-align:right; font-family:var(--font-mono); font-weight:700; color:oklch(60% 0.100 75); }
.mc-row-hit .mc-row-r { color:oklch(50% 0.080 145); }
.mc-row-u { font-size:var(--fs-xs); font-weight:500; color:var(--text-tertiary); }
.mc-so-far { font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:0.12em; color:var(--text-tertiary); margin-left:4px; }
.mc-empty { margin:0 16px; padding:28px 16px; text-align:center; color:var(--text-tertiary); font-size:var(--fs-md); }

/* ── ota-34 (9): loading placeholders ── */
.skel-wrap { padding-left:20px; padding-right:20px; }
.skel { background:linear-gradient(90deg, oklch(93% 0.010 72) 25%, oklch(96.5% 0.008 72) 50%, oklch(93% 0.010 72) 75%); background-size:200% 100%; border-radius:10px; animation:skelShimmer 1.3s ease-in-out infinite; }
.skel-line { height:12px; margin:12px 0; }
.skel-title { height:30px; margin:10px 0 22px; border-radius:12px; }
.skel-figure { height:300px; width:62%; margin:0 auto 20px; border-radius:80px 80px 40px 40px; }
.skel-card { height:72px; margin:0 0 16px; border-radius:18px; }
@keyframes skelShimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }

/* ── ota-34 (11): motion ── */

<!-- SCRIPT BLOCK 1: Global error interceptor.
     Catches any parse or runtime fault in subsequent blocks and renders
     it on-screen. Silent failures are now impossible. -->
<script>
window.onerror = function(msg, url, line, col, error) {
  var splash = document.getElementById('splash');
  if (splash) splash.style.display = 'none';
  document.body.innerHTML =
    '<div style="padding:40px;font-family:monospace;background:#FAF7F2;color:oklch(45% 0.16 30);min-height:100vh;box-sizing:border-box">' +
    '<h2 style="font-family:Cormorant Garamond,serif;font-style:italic;font-weight:400;color:oklch(25% 0.01 40);margin:0 0 24px">[DCR Gym] Script Error</h2>' +
    '<p><b>Fault:</b> ' + msg + '</p>' +
    '<p><b>Location:</b> Line ' + line + ', Col ' + col + '</p>' +
    '<pre style="background:#fff;padding:16px;border-radius:6px;overflow-x:auto;border:1px solid #ddd;font-size:var(--fs-sm);white-space:pre-wrap">' + (error ? error.stack : '') + '</pre>' +
    '<button onclick="(function(){if(\'caches\' in window){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}; if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}; setTimeout(function(){location.reload(true)},300)})()" style="margin-top:20px;padding:12px 24px;background:oklch(25% 0.01 40);color:#fff;border:none;border-radius:30px;cursor:pointer;font-size:var(--fs-sm);letter-spacing:1px;text-transform:lowercase;font-family:monospace">clear cache &amp; reload</button>' +
    '<p style="margin-top:12px;font-size:var(--fs-xs);color:oklch(50% 0.01 40);font-family:monospace">your workout history is preserved — only app cache is cleared</p>' +
    '</div>';
  return false;
};
console.log('[DCRGym] Error guard active.');
</script>

// Helper: get programs by days per week
function getProgramsByDays(days) {
  return PROGRAMS.filter(p => p.daysPerWeek === days);
}

// Helper: get program by id
function getProgramById(id) {
  return PROGRAMS.find(p => p.id === id);
}

// Helper: get session by id
function getSessionById(programId, sessionId) {
  const prog = getProgramById(programId);
  if (!prog) return null;
  return prog.sessions.find(s => s.id === sessionId);
}

// Export for use in app

// Merge: base repository first, extension skipped where the name (or an alias of a library name) already exists.
const EXERCISE_LIBRARY = (() => {
  const seen = new Set(EXERCISE_REPOSITORY.map(it => normalizeEx(it.name)));
  const out = [...EXERCISE_REPOSITORY];
  for (const it of EXERCISE_REPOSITORY_EXT) {
    const n = normalizeEx(it.name);
    if (seen.has(n) || (EX_ALIASES[n] && seen.has(normalizeEx(EX_ALIASES[n])))) continue;
    seen.add(n); out.push(it);
  }
  return out.sort((a, b) => a.name.localeCompare(b.name));
})();

  MUSCLE_MAP[normalizeEx(it.name)] = it.muscle;
});

// ── Per-exercise rest seconds ────────────────────────────────────────────────
function parseRestSeconds(r) {
  if (!r) return 90;
  r = r.toLowerCase();
  if (r.includes('30') && r.includes('60')) return 30;
  if (r.includes('0') && r.includes('1 min')) return 0;
  const m = r.match(/(\d+)[^0-9]*(?:–|-)[^0-9]*(\d+)\s*min/);
  if (m) return parseInt(m[1]) * 60;
  const s = r.match(/(\d+)\s*sec/);
  if (s) return parseInt(s[1]);
  const mm = r.match(/(\d+)\s*min/);
  if (mm) return parseInt(mm[1]) * 60;
  return 90;
}

// ── Utility functions ────────────────────────────────────────────────────────
function stripParentheticals(s) {
  return (s || '').replace(/\s*\([^)]*\)/g, '').trim();
}
function normalizeEx(name) {
  return (name || '').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function resolveAlias(name) {
  const raw = stripParentheticals(stripSuperset(name));
  const n = normalizeEx(raw);
  const mapped = EX_ALIASES[n] || n;
  return normalizeEx(mapped);
}
function stripSuperset(name) {
  return (name || '').replace(/^Superset\s*([0-9]+|[A-Za-z])?:\s*/i, '').trim();
}
// Exact exercise matching — NO loose substring containment. Exercises must strictly
// match identical canonical names, exact aliases, or parenthetical-stripped forms.
function exercisesMatch(a, b) {
  if (!a || !b) return false;
  const rawA = stripSuperset(a);
  const rawB = stripSuperset(b);
  const normA = normalizeEx(rawA);
  const normB = normalizeEx(rawB);
  if (normA === normB) return true;

  const aliasA = resolveAlias(rawA);
  const aliasB = resolveAlias(rawB);
  if (aliasA === aliasB) return true;

  const noParA = normalizeEx(stripParentheticals(rawA));
  const noParB = normalizeEx(stripParentheticals(rawB));
  if (noParA === noParB) return true;

  const noParAliasA = resolveAlias(noParA);
  const noParAliasB = resolveAlias(noParB);
  if (noParAliasA === noParAliasB) return true;

  return false;
}
function getMuscle(name) {
  const n = normalizeEx(stripSuperset(name));
  for (const [k,v] of Object.entries(MUSCLE_MAP)) {
    if (normalizeEx(k) === n) return v;
  }
  const alias = resolveAlias(name);
  if (MUSCLE_MAP[alias]) return MUSCLE_MAP[alias];
  return 'Other';
}
function getExerciseInfo(name) {
  const norm = normalizeEx(stripSuperset(name));
  const exact = EXERCISE_LIBRARY.find(it => normalizeEx(it.name) === norm);
  if (exact) return exact;
  const aliasNorm = resolveAlias(stripSuperset(name));
  const aliasMatch = EXERCISE_LIBRARY.find(it => normalizeEx(it.name) === aliasNorm);
  if (aliasMatch) return aliasMatch;
  const noParNorm = normalizeEx(stripParentheticals(stripSuperset(name)));
  const noParMatch = EXERCISE_LIBRARY.find(it => normalizeEx(it.name) === noParNorm);
  if (noParMatch) return noParMatch;
  return { name: stripSuperset(name), muscle: getMuscle(name), subMuscle: getMuscle(name), tag: 'Gym' };
}
function getSubMuscle(name) {
  const info = getExerciseInfo(name);
  return (info && info.subMuscle) ? info.subMuscle : getMuscle(name);
}
function getExactSubstitutes(exName) {
  const cur = getExerciseInfo(exName);
  const curNorm = normalizeEx(cur.name);
  if (!cur.subMuscle) return [];
  return EXERCISE_LIBRARY.filter(it => it.subMuscle === cur.subMuscle && normalizeEx(it.name) !== curNorm);
}
function isBarbell(name) {
  const norm = normalizeEx(stripSuperset(name));
  const alias = resolveAlias(norm);
  return BARBELL_EX.has(norm) || BARBELL_EX.has(alias);
}
function epley1RM(w, r) {
  if (!r || r === 0) return w;
  return Math.round(w * (1 + r / 30));
}
function formatDuration(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}
function getWeightUnit() {
  const s = getSettings();
  // ota-31 (E): displayUnit only changes how numbers are SHOWN. weightUnit stays the unit history is stored in.
  return (s && s.displayUnit) ? s.displayUnit : ((s && s.weightUnit) ? s.weightUnit : 'lb');
}
function formatWeight(val) {
  if (val == null || isNaN(val)) return '0';
  return Number.isInteger(val) ? `${val}` : val.toFixed(1);
}
function formatKg(val) {
  return formatWeight(val);
}
function plateCalc(totalW, barW = null) {
  const unit = getWeightUnit();
  if (barW === null) barW = unit === 'lb' ? 45 : 20;
  const available = unit === 'lb' ? [45, 35, 25, 10, 5, 2.5] : [25, 20, 15, 10, 5, 2.5, 1.25];
  let perSide = (totalW - barW) / 2;
  if (perSide < 0) return null;
  const plates = [];
  for (const p of available) {
    while (perSide >= p - 0.001) {
      plates.push(p);
      perSide -= p;
    }
  }
  return plates;
}

// ── IndexedDB Vault (Dual-Layer Persistence) ──────────────────────────────────
const IDB_NAME = 'DCRGymDB';
const IDB_STORE = 'vault';
function getIDB() {
  return new Promise((resolve) => {
    if (!window.indexedDB) return resolve(null);
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => resolve(null);
  });
}
async function idbGet(key) {
  try {
    const db = await getIDB();
    if (!db) return null;
    return new Promise((resolve) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const store = tx.objectStore(IDB_STORE);
      const req = store.get(key);
      req.onsuccess = () => resolve(req.result != null ? req.result : null);
      req.onerror = () => resolve(null);
    });
  } catch(e) { return null; }
}
async function idbSet(key, val) {
  if (IS_PREVIEW) return;   // ota-36: preview never writes
  try {
    const db = await getIDB();
    if (!db) return;
    const tx = db.transaction(IDB_STORE, 'readwrite');
    const store = tx.objectStore(IDB_STORE);
    store.put(val, key);
  } catch(e) {}
}

// ── localStorage ─────────────────────────────────────────────────────────────
// Safe Storage Sandbox Proxy — survives WebKit/Safari sandbox DOMException traps
// Falls back to an in-memory store so the app keeps running even if storage is locked.
// ota-36: a build opened at …/preview/ is a look-only copy. It reads the real data on this phone
// but every save stays in memory, nothing is sent to the Sheet, and closing it leaves no trace.
const IS_PREVIEW = (() => { try { return /\/preview\/(index\.html)?$/.test(location.pathname); } catch (e) { return false; } })();
const LS = {
  get(k, def = null) {
    if (IS_PREVIEW && window.__dcr_preview_store && Object.prototype.hasOwnProperty.call(window.__dcr_preview_store, k)) {
      const pv = window.__dcr_preview_store[k]; return pv === undefined ? def : JSON.parse(pv);
    }
    try {
      const v = localStorage.getItem(k);
      return v !== null ? JSON.parse(v) : def;
    } catch(e) {
      console.warn('[DCR Gym Shell] Storage read trapped, using memory fallback', e);
      return window.__dcr_sandbox_store?.[k] ?? def;
    }
  },
  set(k, v) {
    if (IS_PREVIEW) { (window.__dcr_preview_store = window.__dcr_preview_store || {})[k] = JSON.stringify(v); return; }
    try {
      localStorage.setItem(k, JSON.stringify(v));
    } catch(e) {
      if (!window.__dcr_sandbox_store) window.__dcr_sandbox_store = {};
      window.__dcr_sandbox_store[k] = v;
      console.warn('[DCR Gym Shell] Storage write trapped, isolated to memory sandbox', e);
    }
  },
  remove(k) {
    if (IS_PREVIEW) { (window.__dcr_preview_store = window.__dcr_preview_store || {})[k] = undefined; return; }
    try {
      localStorage.removeItem(k);
    } catch(e) {
      if (window.__dcr_sandbox_store) delete window.__dcr_sandbox_store[k];
    }
    if (k === 'dcrgym_current_workout') {
      try { idbSet('dcrgym_current_workout', null); } catch(e) {}
    }
  },
};

// ── History helpers ───────────────────────────────────────────────────────────
function getHistory() { return LS.get('dcrgym_history', []); }
function saveHistory(h, opts) {
  const arr = Array.isArray(h)
    ? [...h].sort((a, b) => ((a && (a.endTime || a.startTime)) || 0) - ((b && (b.endTime || b.startTime)) || 0))
    : [];
  // ota-36 guard: a save may never make workouts disappear unless he deleted them (or cleared
  // history himself). Anything else is a bug, so the old copy is kept and nothing is written.
  if (!(opts && opts.allowDrop)) {
    const cur = LS.get('dcrgym_history', []);
    if (Array.isArray(cur) && arr.length < cur.length) {
      const keep = new Set(arr.map(w => String(w && w.id)));
      const del = new Set((LS.get('dcrgym_deleted_ids', []) || []).map(String));
      const lost = cur.filter(w => w && w.id != null && !keep.has(String(w.id)) && !del.has(String(w.id)) && !del.has(String(w.endTime)));
      if (lost.length) {
        console.warn('[DCR Gym] save refused: it would drop ' + lost.length + ' workout(s)');
        LS.set('dcrgym_save_refused', { at: Date.now(), build: APP_BUILD, ids: lost.slice(0, 20).map(w => String(w.id)), from: cur.length, to: arr.length });
        return false;
      }
    }
  }
  LS.set('dcrgym_history', arr);
  idbSet('dcrgym_history', arr);
  return true;
}
function getNotes() { return LS.get('dcrgym_notes', {}); }
function saveNotes(n) { LS.set('dcrgym_notes', n); idbSet('dcrgym_notes', n); }
function getRestTimes() { return LS.get('dcrgym_rest', {}); }

  if (!m || !Array.isArray(m) || m.length === 0) {
    LS.set('dcrgym_measurements', INITIAL_MEASUREMENTS);
    return INITIAL_MEASUREMENTS;
  }
  return m;
}
function saveMeasurements(m) { LS.set('dcrgym_measurements', m); idbSet('dcrgym_measurements', m); }

// ── Bulletproof persistence core ─────────────────────────────────────────────
// Schema-versioned, non-destructive, with rolling last-good backup.
// History must survive every app update. Period.
const SCHEMA_VERSION = 3;
const APP_BUILD = '2026.11.27 · ota-38 · start-fix';
const KG_TO_LB_CUTOFF_MS = 1788000000000; // Workouts before Sep 2026 were logged in kg; Sep 2026+ are already in lbs

function hasLoggedWorkingSets(w) {
  if (!w || !w.sets || typeof w.sets !== 'object') return false;
  return Object.entries(w.sets).some(([k, arr]) => !k.endsWith('_wu') && Array.isArray(arr) && arr.some(s => s && s.r > 0));
}

function isCompletedProgramWorkout(w, progId) {
  if (!w || w.partial || w._dupOf) return false;
  if (progId && w.programId !== progId) return false;
  return hasLoggedWorkingSets(w);
}

function resolveWorkoutSetExName(w, key, sets) {
  if (Array.isArray(sets)) {
    const withName = sets.find(s => s && s._name);
    if (withName && withName._name) return withName._name;
  }
  if (w && w.subs && w.subs[key]) return w.subs[key];
  if (w && key && key.startsWith('add_') && Array.isArray(w.additions)) {
    const addId = parseInt(key.slice(4));
    const found = w.additions.find(a => a && a.id === addId) || w.additions[addId];
    if (found && found.name) return found.name;
  }
  if (key && key.startsWith('import_')) {
    return key.slice(7).replace(/_/g, ' ');
  }
  if (w && w.programId && w.programId !== 'import') {
    const prog = PROGRAMS.find(p => p.id === w.programId);
    const sess = prog && prog.sessions.find(s => s.id === w.sessionId);
    const exIdx = parseInt(String(key).split('_').pop());
    if (sess && !isNaN(exIdx) && sess.exercises[exIdx]) {
      return stripSuperset(sess.exercises[exIdx].name);
    }
  }
  return '';
}

function normalizeWorkoutUnits(w) {
  if (!w || !w.sets) return w;

  // Self-heal Oct 4 & Oct 5 recovered WorkoutLog sessions if saved by an earlier build
  if (String(w.id) === '1791237876738' && w.sets) {
    const s3 = Array.isArray(w.sets.p14_s2_3) && w.sets.p14_s2_3[0];
    const s4 = Array.isArray(w.sets.p14_s2_4) && w.sets.p14_s2_4[0];
    if (s3 && s4 && s3._name === 'Dragon Flag' && s4._name === 'Seated Calf Raise') {
      const tmp = w.sets.p14_s2_3;
      w.sets.p14_s2_3 = w.sets.p14_s2_4;
      w.sets.p14_s2_4 = tmp;
    }
    if (w.travelMode === undefined) w.travelMode = false;
    if (!w.subs) w.subs = { p14_s2_1: 'Hack Squat' };
    if (!w.subMeta) w.subMeta = { p14_s2_1: { sets: 3, reps: '8' } };
    if (!w.additions) w.additions = [];
    if (!w.completedCards) w.completedCards = Object.keys(w.sets).filter(k => !k.endsWith('_wu'));
  } else if (String(w.id) === '1791119907286' && w.sets) {
    if (w.travelMode === undefined) w.travelMode = false;
    if (!w.subs) w.subs = {};
    if (!w.subMeta) w.subMeta = {};
    if (!w.additions) w.additions = [];
    if (!w.completedCards) w.completedCards = Object.keys(w.sets).filter(k => !k.endsWith('_wu'));
  }

  // Strip 0-rep dummy rows and deduplicate reconstructed import_* keys when real slot keys exist
  if (w.sets && typeof w.sets === 'object') {
    const nonImportNames = [];
    for (const [k, arr] of Object.entries(w.sets)) {
      if (!Array.isArray(arr)) continue;
      if (!k.endsWith('_wu')) {
        w.sets[k] = arr.filter(s => s && s.r > 0);
        if (w.sets[k].length === 0) {
          delete w.sets[k];
          continue;
        }
      }
      if (!k.startsWith('import_') && !k.endsWith('_wu')) {
        const nm = resolveWorkoutSetExName(w, k, w.sets[k]);
        if (nm) nonImportNames.push(nm);
      }
    }
    if (w.programId && w.programId !== 'import' && nonImportNames.length > 0) {
      for (const [k, arr] of Object.entries(w.sets)) {
        if (!k.startsWith('import_')) continue;
        const impName = resolveWorkoutSetExName(w, k, arr);
        if (!impName || nonImportNames.some(n => exercisesMatch(n, impName))) {
          delete w.sets[k];
        }
      }
    }
  }

  if (w._unitLb) return w;
  const endT = Number(w.endTime || w.startTime || 0);
  if (endT > 0 && endT < KG_TO_LB_CUTOFF_MS) {
    for (const sets of Object.values(w.sets)) {
      if (!Array.isArray(sets)) continue;
      for (const s of sets) {
        if (s && typeof s.w === 'number' && s.w > 0) {
          s.w = Math.round(s.w * 2.20462 * 2) / 2;
        }
      }
    }
    w._unitLb = true;
  } else if (endT >= KG_TO_LB_CUTOFF_MS) {
    w._unitLb = true;
  }
  return w;
}

function backfillNotesFromHistory(histInput) {
  const hist = Array.isArray(histInput) ? histInput : getHistory();
  if (!hist || hist.length === 0) return 0;
  const notes = getNotes();
  let updated = 0;
  const sorted = [...hist].sort((a, b) => ((b && b.endTime) || 0) - ((a && a.endTime) || 0));
  for (const w of sorted) {
    if (!w || !w.notes || typeof w.notes !== 'object') continue;
    for (const [key, val] of Object.entries(w.notes)) {
      const text = typeof val === 'string' ? val.trim() : '';
      if (!text) continue;
      const exName = resolveWorkoutSetExName(w, key, w.sets && w.sets[key]);
      const normKey = normalizeEx(exName || key);
      if (normKey && !notes[normKey]) {
        notes[normKey] = text;
        updated++;
      }
    }
  }
  if (updated > 0) saveNotes(notes);
  return updated;
}

function convertHistoryWeightsToLbs(hist) {
  if (!Array.isArray(hist)) return 0;
  let count = 0;
  for (const w of hist) {
    if (!w || !w.sets) continue;
    if (w._unitLb) continue;
    const endT = Number(w.endTime || w.startTime || 0);
    // Only convert pre-Sep 2026 kg workouts; never double-convert Sep/Oct 2026+ lb workouts
    if (endT >= KG_TO_LB_CUTOFF_MS) {
      w._unitLb = true;
      continue;
    }
    for (const sets of Object.values(w.sets)) {
      if (!Array.isArray(sets)) continue;
      for (const s of sets) {
        if (s && typeof s.w === 'number' && s.w > 0) {
          s.w = Math.round(s.w * 2.20462 * 2) / 2;
          count++;
        }
      }
    }
    w._unitLb = true;
  }
  return count;
}

function convertHistoryUnits(targetUnit) {
  // ota-31 (E): converting used to rewrite every saved weight. Now it only changes the display.
  if (targetUnit === 'lb' || targetUnit === 'kg') { setDisplayUnit(targetUnit); return; }
  return _legacyConvertHistoryUnits(targetUnit);
}
function _legacyConvertHistoryUnits(targetUnit) {
  if (getSettings().weightUnit === targetUnit) return;
  const currentHist = getHistory();
  if (!currentHist || currentHist.length === 0) {
    const settings = getSettings();
    settings.weightUnit = targetUnit;
    saveSettings(settings);
    return;
  }
  const factor = targetUnit === 'lb' ? 2.20462 : (1 / 2.20462);
  for (const w of currentHist) {
    if (!w || !w.sets) continue;
    for (const sets of Object.values(w.sets)) {
      if (!Array.isArray(sets)) continue;
      for (const s of sets) {
        if (s && typeof s.w === 'number' && s.w > 0) {
          s.w = targetUnit === 'lb'
            ? Math.round(s.w * factor * 2) / 2
            : Math.round(s.w * factor * 10) / 10;
        }
      }
    }
    w._unitLb = (targetUnit === 'lb');
  }
  saveHistory(currentHist);
  const settings = getSettings();
  settings.weightUnit = targetUnit;
  saveSettings(settings);
}

function migrateStorage() {
  const v = LS.get('dcrgym_schema_version', 1);

  // Ensure body measurements are initialized
  getMeasurements();

  if (v >= SCHEMA_VERSION) return;

  // Rolling last-good backup BEFORE any mutation — recoverable from Settings
  const hist = getHistory();
  if (hist.length > 0) {
    LS.set('dcrgym_history_backup', { at: Date.now(), fromVersion: v, history: hist });
  }

  // v1 → v2: backfill _name onto every working set so exercise identity is a
  // stored fact, never a derived guess.
  if (v < 2) {
    let stamped = 0;
    for (const w of hist) {
      if (!w || !w.sets || !w.programId || w.programId === 'import') continue;
      const prog = PROGRAMS.find(p => p.id === w.programId);
      if (!prog) continue;
      const sess = prog.sessions.find(s => s.id === w.sessionId);
      if (!sess) continue;
      for (const [key, sets] of Object.entries(w.sets)) {
        if (!Array.isArray(sets) || key.endsWith('_wu')) continue;
        if (sets.some(s => s && s._name)) continue;
        const exIdx = parseInt(key.split('_').pop());
        if (isNaN(exIdx) || !sess.exercises[exIdx]) continue;
        const nm = stripSuperset(sess.exercises[exIdx].name);
        for (const s of sets) { if (s && s.r > 0) { s._name = nm; stamped++; } }
      }
    }
    if (stamped > 0) saveHistory(hist);
  }

  // v2 → v3: convert legacy pre-Sep 2026 kg weights to lbs & set default weightUnit to 'lb'
  if (v < 3) {
    const currentHist = getHistory();
    const convertedCount = convertHistoryWeightsToLbs(currentHist);
    if (convertedCount > 0) saveHistory(currentHist);

    const settings = getSettings();
    settings.weightUnit = 'lb';
    saveSettings(settings);
  }

  LS.set('dcrgym_schema_version', SCHEMA_VERSION);
}

function inferDefaultProgramFromHistory(hist) {
  const arr = Array.isArray(hist) ? hist : getHistory();
  const sorted = [...arr]
    .filter(w => w && !w.partial && w.programId && w.programId !== 'import' && PROGRAMS.some(p => p.id === w.programId) && hasLoggedWorkingSets(w))
    .sort((a, b) => (b.endTime || 0) - (a.endTime || 0));
  if (sorted.length > 0) return sorted[0].programId;
  return null;
}

function ensureActiveProgram() {
  let progId = ST.defaultProgram || LS.get('dcrgym_default_prog') || ST.currentProgram;
  if (!progId || !PROGRAMS.some(p => p.id === progId)) {
    progId = inferDefaultProgramFromHistory();
  }
  if (progId && PROGRAMS.some(p => p.id === progId)) {
    ST.defaultProgram = progId;
    if (!ST.currentProgram) ST.currentProgram = progId;
    if (LS.get('dcrgym_default_prog') !== progId) {
      LS.set('dcrgym_default_prog', progId);
      idbSet('dcrgym_default_prog', progId);
    }
    return progId;
  }
  return null;
}

// Compute current rotation-pass state for a program across week boundaries.
// Session checkmarks (✓) persist across Sundays until ALL sessions in prog.sessions
// have been completed in the current pass, then roll into a fresh pass.
function getProgramRotationState(prog, histInput) {
  if (!prog || !Array.isArray(prog.sessions) || prog.sessions.length === 0) {
    return { doneMap: {}, displayDoneMap: {}, cycleWorkouts: [], completedCount: 0, totalSessions: 0, nextSession: null, nextSessionId: null, isFirst: true, justCompletedFullCycle: false };
  }
  const totalSessions = prog.sessions.length;
  const validSessIds = new Set(prog.sessions.map(s => s.id));
  const hist = Array.isArray(histInput) ? histInput : getHistory();
  const progHist = hist
    .filter(w => isCompletedProgramWorkout(w, prog.id) && validSessIds.has(w.sessionId))
    .sort((a, b) => (a.endTime || 0) - (b.endTime || 0));

  if (progHist.length === 0) {
    return {
      doneMap: {},
      displayDoneMap: {},
      cycleWorkouts: [],
      completedCount: 0,
      totalSessions,
      nextSession: prog.sessions[0],
      nextSessionId: prog.sessions[0].id,
      isFirst: true,
      justCompletedFullCycle: false
    };
  }

  // ota-35 (his rule): a round starts with the plan's first session and ends with its last one
  // (Upper … Legs). The first session always opens a new round; the last one closes it, and
  // whatever comes after a closed round starts the next one. Nothing in history is changed.
  let doneInCycle = {};
  let cycleWorkouts = [];
  let justCompletedFullCycle = false;
  const nowMs = Date.now();
  const firstSessId = prog.sessions[0].id, lastSessId = prog.sessions[totalSessions - 1].id;

  for (const w of progHist) {
    if (justCompletedFullCycle || (w.sessionId === firstSessId && cycleWorkouts.length)) {
      doneInCycle = {};
      cycleWorkouts = [];
      justCompletedFullCycle = false;
    }
    const endT = w.endTime || w.startTime || nowMs;
    const daysAgo = Math.max(0, Math.floor((nowMs - endT) / 86400000));
    doneInCycle[w.sessionId] = { daysAgo, endTime: endT, workout: w };
    cycleWorkouts.push(w);
    if (w.sessionId === lastSessId) justCompletedFullCycle = true;
  }

  // Once the round is closed, checkmarks clear for the next one
  const activeDoneMap = justCompletedFullCycle ? {} : { ...doneInCycle };
  const lastW = progHist[progHist.length - 1];
  const lastIdx = prog.sessions.findIndex(s => s.id === lastW.sessionId);
  let nextIdx = justCompletedFullCycle ? 0 : (lastIdx + 1) % totalSessions;
  const activeCount = Object.keys(activeDoneMap).length;
  if (activeCount > 0 && activeCount < totalSessions) {
    for (let step = 1; step <= totalSessions; step++) {
      const candIdx = (lastIdx + step) % totalSessions;
      const candId = prog.sessions[candIdx].id;
      if (!activeDoneMap[candId]) {
        nextIdx = candIdx;
        break;
      }
    }
  }
  const nextSession = prog.sessions[nextIdx] || prog.sessions[0];

  return {
    doneMap: activeDoneMap,
    displayDoneMap: doneInCycle,
    cycleWorkouts,
    completedCount: activeCount,
    totalSessions,
    nextSession,
    nextSessionId: nextSession.id,
    isFirst: false,
    justCompletedFullCycle,
    lastWorkout: lastW
  };
}

// Additions are keyed by a STABLE id (`add_${id}`), not array position — so
// removing one mid-session never re-points another card's logged sets.
function additionByKey(key) {
  if (!key || key.indexOf('add_') !== 0) return null;
  const id = parseInt(key.slice(4));
  return (ST.workoutAdditions || []).find(a => a && a.id === id) || null;
}

// Live exercise identity — travel swap and session substitution aware.
// THE name that gets stamped on sets and used for history lookup.
// ── Auto-substitution engine ──────────────────────────────────────────────────
function getTravelExDetails(subName) {
  const norm = normalizeEx(subName);
  for (const val of Object.values(TRAVEL_MAP)) {
    if (normalizeEx(val.name) === norm) return val;
  }
  return null;
}

function autoSubstituteExercise(key, exIdx, ex) {
  const originalName = stripSuperset(ex.name);
  const muscle = getMuscle(originalName);
  // ota-30 fix: SUB_LIBRARY never existed (blacklisting threw). Candidates now come from the
  // program's own substitutes, then the same exact target, then the same muscle.
  const progSubs = ((ex && ex.substitutions) || []).filter(n => n && n.trim()).map(n => { const it = getExerciseInfo(n); return { name: it.name || n, tag: it.tag || 'Gym' }; });
  const sameTarget = getExactSubstitutes(originalName);
  const sameMuscle = EXERCISE_LIBRARY.filter(it => it.muscle === muscle);
  const candidates = [...progSubs, ...sameTarget, ...sameMuscle];
  const isTravel = ST.travelMode;
  const targetTag = isTravel ? 'Travel' : 'Gym';

  const match = candidates.find(c => {
    const norm = normalizeEx(c.name);
    if ((c.tag || 'Gym') !== targetTag) return false;
    if (ST.blacklistedExercises.has(norm)) return false;
    if (norm === normalizeEx(originalName)) return false;
    // Must not be the currently active auto-sub name (avoid loops)
    const currentDisplay = liveExName(key, ex);
    if (norm === normalizeEx(currentDisplay)) return false;
    return true;
  });

  if (match) {
    ST.workoutAutoSubs[key] = match.name;
    if (isTravel) {
      const details = getTravelExDetails(match.name);
      ST.workoutAutoSubMeta[key] = {
        sets: details ? details.sets : (ex.workingSets || 3),
        reps: details ? details.reps : (ex.reps || '12–15')
      };
    } else {
      ST.workoutAutoSubMeta[key] = {
        sets: ex.workingSets || 3,
        reps: ex.reps || '8–10'
      };
    }
    return true;
  }
  return false;
}

function applyAutoSubstitutions() {
  if (!ST.workoutAutoSubs) ST.workoutAutoSubs = {};
  if (!ST.workoutAutoSubMeta) ST.workoutAutoSubMeta = {};
  
  // Clear previous auto-substitutions
  for (const k in ST.workoutAutoSubs) delete ST.workoutAutoSubs[k];
  for (const k in ST.workoutAutoSubMeta) delete ST.workoutAutoSubMeta[k];

  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (!sess) return;

  sess.exercises.forEach((ex, exIdx) => {
    const key = `${sess.id}_${exIdx}`;
    if (ST.workoutSubs && ST.workoutSubs[key]) return; // Skip if manually subbed

    const originalName = stripSuperset(ex.name);
    let displayName = originalName;
    if (ST.travelMode) {
      const travel = TRAVEL_MAP[normalizeEx(originalName)];
      if (travel) displayName = travel.name;
    }

    if (ST.blacklistedExercises.has(normalizeEx(displayName))) {
      autoSubstituteExercise(key, exIdx, ex);
    }
  });
}

function liveExName(key, ex) {
  // Additions own their identity outright — never travel/sub-mapped.
  if (key && key.indexOf('add_') === 0) {
    const a = additionByKey(key);
    return a ? a.name : (ex ? stripSuperset(ex.name) : '');
  }
  const name = stripSuperset(ex.name);
  if (ST.workoutSubs && ST.workoutSubs[key]) return ST.workoutSubs[key];
  if (ST.workoutAutoSubs && ST.workoutAutoSubs[key]) return ST.workoutAutoSubs[key];
  const travel = ST.travelMode && TRAVEL_MAP[normalizeEx(name)];
  if (travel) return travel.name;
  return name;
}

// Effective set count / rep range for a slot — honours custom counts on a
// substituted slot (Decision 2) and addition cards, else the programmed value.
function effSetCount(key, ex) {
  if (key && key.indexOf('add_') === 0) {
    const a = additionByKey(key);
    return a ? a.sets : 3;
  }
  if (ST.workoutSubs && ST.workoutSubs[key] && ST.workoutSubMeta && ST.workoutSubMeta[key] && ST.workoutSubMeta[key].sets)
    return ST.workoutSubMeta[key].sets;
  if (ST.workoutAutoSubs && ST.workoutAutoSubs[key] && ST.workoutAutoSubMeta && ST.workoutAutoSubMeta[key] && ST.workoutAutoSubMeta[key].sets)
    return ST.workoutAutoSubMeta[key].sets;
  return (ex && ex.workingSets) || 3;
}
function effReps(key, ex) {
  if (key && key.indexOf('add_') === 0) {
    const a = additionByKey(key);
    return a ? a.reps : '8–10';
  }
  if (ST.workoutSubs && ST.workoutSubs[key] && ST.workoutSubMeta && ST.workoutSubMeta[key] && ST.workoutSubMeta[key].reps)
    return ST.workoutSubMeta[key].reps;
  if (ST.workoutAutoSubs && ST.workoutAutoSubs[key] && ST.workoutAutoSubMeta && ST.workoutAutoSubMeta[key] && ST.workoutAutoSubMeta[key].reps)
    return ST.workoutAutoSubMeta[key].reps;
  const name = ex ? stripSuperset(ex.name) : '';
  const travel = ST.travelMode && TRAVEL_MAP[normalizeEx(name)];
  if (travel) return travel.reps;
  return (ex && ex.reps) || '8–10';
}
// Resolve the exercise descriptor behind any workout key (program slot or
// addition). Returns {ex,name,isAddition,exIdx,addId} or null.
function slotForKey(key) {
  if (key && key.indexOf('add_') === 0) {
    const a = additionByKey(key);
    if (!a) return null;
    return { ex: { name: a.name, workingSets: a.sets, reps: a.reps, rest: a.rest || '2–3 min', substitutions: [] },
             name: a.name, isAddition: true, addId: a.id };
  }
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  const exIdx = parseInt(key.split('_').pop());
  const ex = sess && sess.exercises[exIdx];
  if (!ex) return null;
  return { ex, name: stripSuperset(ex.name), isAddition: false, exIdx };
}

// Single source of truth for the live-workout snapshot
function buildWorkoutPayload() {
  return {
    v: SCHEMA_VERSION,
    programId: ST.currentProgram,
    sessionId: ST.currentSession,
    sessionName: (() => { const p=PROGRAMS.find(pp=>pp.id===ST.currentProgram); const s=p&&p.sessions.find(ss=>ss.id===ST.currentSession); return (s && s.name) || 'Workout'; })(),
    sets: ST.workoutSets,
    drafts: ST.workoutDrafts || {},
    subs: ST.workoutSubs || {},
    subMeta: ST.workoutSubMeta || {},
    autoSubs: ST.workoutAutoSubs || {},
    autoSubMeta: ST.workoutAutoSubMeta || {},
    subSource: ST.workoutSubSource || {},
    additions: ST.workoutAdditions || [],
    notes: ST.workoutNotes || {},
    travelMode: ST.travelMode,
    travelLocked: ST.travelLocked,
    durationSecs: ST.durationSecs,
    expandedCards: [...ST.expandedCards],
    completedCards: [...ST.completedCards],
    startTime: ST.workoutStart,
    startedAt: ST.workoutStartedAt || null,   // ota-32: the real start, kept when the workout is reopened later
    editingWorkoutId: ST.editingWorkoutId || null,
    isBackdated: ST.isBackdated || false,
    workoutEnd: ST.workoutEnd || null
  };
}

// Synchronous, un-debounced write — called on every set checkmark and on
// visibilitychange. A logged set is on disk before the ripple finishes.
function saveNow() {
  if (ST.workoutCommitted) return; // committed/finished — never resurrect the live snapshot
  if (!ST.currentSession || !ST.workoutStart) return;
  const payload = buildWorkoutPayload();
  LS.set('dcrgym_current_workout', payload);
  idbSet('dcrgym_current_workout', payload);
}

  if (snapshot.editingWorkoutId) {
    const idx = hist.findIndex(w => String(w.id) === String(snapshot.editingWorkoutId));
    if (idx !== -1) {

    id: (snapshot.startTime || Date.now()).toString(),
    programId: snapshot.programId,
    sessionId: snapshot.sessionId,
    sessionName: snapshot.sessionName || '',
    startTime: startT,
    endTime: endT,
    duration: (lastTs && !snapshot.isBackdated) ? Math.max(60, Math.round((lastTs - startT) / 1000) + 60) : (snapshot.durationSecs || snapshot.duration || 0),
    _archived: { at: Date.now(), endedAt: lastTs ? 'last set' : 'archive time', liveDurationSecs: snapshot.durationSecs || 0 },

function getLastPerformance(exName) {
  const found = getLastPerformanceFull(exName);
  return found ? found.sets : null;
}

function getLastPerformanceFull(exName) {
  if (!exName) return null;
  const hist = getHistory()
    .filter(w => w && w.sets)
    .sort((a, b) => (b.endTime || 0) - (a.endTime || 0));

  for (const w of hist) {
    for (const [key, sets] of Object.entries(w.sets)) {
      if (key.endsWith('_wu') || !sets || sets.length === 0) continue;

      let storedName = null;
      // 1. Check set objects for stored _name
      for (const s of sets) {
        if (s && s._name) { storedName = s._name; break; }
      }

      // 2. Check substitutions in the workout entry
      if (!storedName && w.subs && w.subs[key]) {
        storedName = w.subs[key];
      }

      // 3. Check additions in the workout entry
      if (!storedName && key.startsWith('add_') && w.additions) {
        const addIdx = parseInt(key.slice(4));
        if (w.additions[addIdx]) storedName = w.additions[addIdx].name;
        else {
          const foundAdd = w.additions.find(a => a && (a.id === key || a.name === exName || (a.name && exercisesMatch(a.name, exName))));
          if (foundAdd) storedName = foundAdd.name;
        }
      }

      // 4. Derive from import key
      if (!storedName && key.startsWith('import_')) {
        storedName = key.slice(7).replace(/_/g, ' ');
      }

      // 5. Program structure lookup
      if (!storedName && w.programId && w.programId !== 'import') {
        const prog = PROGRAMS.find(p => p.id === w.programId);
        if (prog) {
          const sess = prog.sessions.find(s => s.id === w.sessionId);
          if (sess) {
            const exIdx = parseInt(key.split('_').pop());
            if (!isNaN(exIdx) && sess.exercises[exIdx]) {
              storedName = stripSuperset(sess.exercises[exIdx].name);
            }
          }
        }
      }

      if (!storedName) continue;

      if (exercisesMatch(exName, storedName)) {
        const ws = sets.filter(s => s && s.r > 0 && (s.w != null && s.w !== ''));
        if (ws.length > 0) return { sets: ws, endTime: w.endTime || 0 };
      }
    }
  }
  return null;
}

  const has = (...ws) => ws.some(w => n.indexOf(' ' + w) !== -1);

  if (has('banded', 'band ', 'resistance band')) return 'Band';
  if (it && it.tag === 'Travel') return 'Bodyweight';
  if (has('hammer strength', 'plate loaded', 'pendulum', 'belt squat', 't bar', 'landmine', 'v squat', 'meadow')) return 'Plate-loaded';
  if (has('cable', 'rope', 'pulldown', 'pull in', 'crossover', 'facepull', 'face pull', 'pressdown', 'pushdown', 'pull through', 'woodchop', 'pallof', 'bayesian')) return 'Cable';

  if (has('dumbbell', 'db ', 'goblet', 'kettlebell', 'kroc', 'farmer', 'suitcase')) return 'Dumbbell';

// Rep ranges → zone. Heavy: top ≤ 8 · Moderate: 9–12 · Light: ≥ 13. Time-based targets have no zone.

// Target rep range a past slot was trained against. Order: stamped on the set (ota-30+),
// the swap's custom reps, the addition's reps, the program slot. Never written back.
function workoutSlotTarget(w, key, sets) {

  if (stamped) return stamped._tgt;

  if (key.indexOf('add_') === 0 && Array.isArray(w.additions)) {

function getZoneMemory(exName, reps, opts = {}) {
