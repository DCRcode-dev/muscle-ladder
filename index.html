// ── Confetti ──────────────────────────────────────────────────────────────────
let confettiFrame = null;
let confettiParticles = [];

function launchConfetti(dramatic) {
  const canvas = document.getElementById('confetti-canvas');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const colors = ['#F04E23','#FFB347','#FAF7F2','#1A1A1A','#F59E0B'];
  confettiParticles = [];
  const count = dramatic ? 200 : 100;
  for (let i = 0; i < count; i++) {
    confettiParticles.push({
      x: Math.random() * canvas.width,
      y: -10 - Math.random() * 100,
      w: 6 + Math.random() * 8,
      h: 10 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * (dramatic ? 5 : 3),
      vr: (Math.random() - 0.5) * 8,
      opacity: 1,
    });
  }
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    for (const p of confettiParticles) {
      p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.1;
      if (p.y < canvas.height + 20) { alive = true; }
      else { p.opacity -= 0.02; }
      if (p.opacity <= 0) continue;
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    }
    if (alive) confettiFrame = requestAnimationFrame(draw);
    else stopConfetti();
  }
  if (confettiFrame) cancelAnimationFrame(confettiFrame);
  confettiFrame = requestAnimationFrame(draw);
}

function stopConfetti() {
  if (confettiFrame) { cancelAnimationFrame(confettiFrame); confettiFrame = null; }
  const canvas = document.getElementById('confetti-canvas');
  if (canvas) canvas.style.display = 'none';
}

// ── Progress graph (liquid glass modal) ───────────────────────────────────────
function showProgressGraph(e, exName) {
  if (e) e.stopPropagation();
  const hist = getHistory();
  // Gather weekly best weight for this exercise
  const weekData = {};
  for (const w of hist) {
    if (!w.sets) continue;
    const wProg = PROGRAMS.find(p => p.id === w.programId);
    if (!wProg) continue;
    const wSess = wProg.sessions.find(s => s.id === w.sessionId);
    if (!wSess) continue;
    for (const [key, sets] of Object.entries(w.sets)) {
      const exIdx = parseInt(key.split('_').pop());
      const ex = wSess.exercises[exIdx];
      if (!ex) continue;
      if (!exercisesMatch(exName, stripSuperset(ex.name))) continue;
      const weekKey = Math.floor(w.endTime / (7*24*3600*1000));
      for (const s of sets) {
        if (!s || !s.w) continue;
        if (!weekData[weekKey] || s.w > weekData[weekKey].w) weekData[weekKey] = { w: s.w, r: s.r };
      }
    }
  }

  const weekKeys = Object.keys(weekData).sort((a,b)=>a-b).slice(-8);
  const points = weekKeys.map(k => weekData[k]);
  const hasData = points.length >= 1;

  // Build SVG chart
  let chartHtml = '';
  if (points.length >= 2) {
    const W = 322, H = 120;
    const vals = points.map(p => p.w);
    const maxW = Math.max(...vals), minW = Math.min(...vals);
    const range = maxW - minW || 1;
    const pad = { l: 8, r: 8, t: 16, b: 28 };
    const chartW = W - pad.l - pad.r, chartH = H - pad.t - pad.b;

    const xs = vals.map((_, i) => pad.l + (i / (vals.length - 1)) * chartW);
    const ys = vals.map(v => pad.t + chartH - ((v - minW) / range) * chartH);

    // Area fill path
    const linePts = xs.map((x, i) => `${x},${ys[i]}`).join(' ');
    const areaPath = `M${xs[0]},${ys[0]} ` + xs.map((x,i)=>`L${x},${ys[i]}`).join(' ') + ` L${xs[xs.length-1]},${H-pad.b} L${xs[0]},${H-pad.b} Z`;

    // Week labels — just show "W-N" from most recent
    const labels = weekKeys.map((_, i) => {
      const weeksAgo = weekKeys.length - 1 - i;
      return weeksAgo === 0 ? 'Now' : `-${weeksAgo}w`;
    });

    // Grid lines
    const gridLines = [0, 0.5, 1].map(f => {
      const y = pad.t + chartH * (1 - f);
      const val = Math.round(minW + f * range);
      return `<line x1="${pad.l}" y1="${y}" x2="${W - pad.r}" y2="${y}" stroke="rgba(26,26,26,0.07)" stroke-width="1"/>
              <text x="${pad.l}" y="${y - 3}" font-size="8" fill="rgba(26,26,26,0.35)" font-family="-apple-system,sans-serif">${val}kg</text>`;
    }).join('');

    // Dot on last point
    const lastX = xs[xs.length - 1], lastY = ys[ys.length - 1];

    chartHtml = `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#F04E23" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#F04E23" stop-opacity="0.02"/>
        </linearGradient>
      </defs>
      ${gridLines}
      <path d="${areaPath}" fill="url(#areaGrad)"/>
      <polyline points="${linePts}" fill="none" stroke="#F04E23" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${xs.map((x,i) => `<circle cx="${x}" cy="${ys[i]}" r="${i===vals.length-1?5:3}" fill="${i===vals.length-1?'#F04E23':'rgba(240,78,35,0.45)'}"/>`).join('')}
      ${labels.map((lbl, i) => `<text x="${xs[i]}" y="${H - 4}" text-anchor="middle" font-size="9" fill="rgba(26,26,26,0.4)" font-family="-apple-system,sans-serif">${lbl}</text>`).join('')}
    </svg>`;
  } else if (points.length === 1) {
    chartHtml = `<div class="graph-no-data">1 session logged — keep going to see your trend.</div>`;
  } else {
    chartHtml = `<div class="graph-no-data">No history yet for this exercise.</div>`;
  }

  const latestW = hasData ? points[points.length-1].w + 'kg' : '—';
  const peakW = hasData ? Math.max(...points.map(p=>p.w)) + 'kg' : '—';
  const trend = points.length >= 2 ? (points[points.length-1].w >= points[0].w ? '↑ ' + (points[points.length-1].w - points[0].w) + 'kg over ' + points.length + ' weeks' : '↓ ' + (points[0].w - points[points.length-1].w) + 'kg') : '—';

  document.getElementById('graph-content').innerHTML = `
    <div class="graph-ex-title">${exName}</div>
    <div class="graph-meta">Progressive Overload · Max Weight / Week</div>
    <div class="graph-svg-wrap">${chartHtml}</div>
    <div class="graph-stat-row">
      <div class="graph-stat"><div class="graph-stat-val">${latestW}</div><div class="graph-stat-lbl">Latest</div></div>
      <div class="graph-stat"><div class="graph-stat-val">${peakW}</div><div class="graph-stat-lbl">Peak</div></div>
      <div class="graph-stat" style="flex:1.5"><div class="graph-stat-val" style="font-size:14px">${trend}</div><div class="graph-stat-lbl">Trend</div></div>
    </div>
  `;
  const bd = document.getElementById('graph-backdrop');
  bd.style.display = 'flex';
  requestAnimationFrame(() => bd.classList.add('visible'));
}

function renderProgressGauges() {
  const progId = ST.defaultProgram || ST.currentProgram;
  const prog = progId ? PROGRAMS.find(p => p.id === progId) : null;

  if (!prog) {
    return `<div class="empty-state">
      <div class="empty-title">DCR Gym</div>
      <div class="empty-sub">Select a program to track completion.</div>
      <button class="btn btn-primary" style="width:200px" onclick="Maps('prog')">Choose Program</button>
    </div>`;
  }

  // Scheduled sets per muscle across the full program week
  const scheduledSets = {};
  for (const sess of prog.sessions) {
    for (const ex of sess.exercises) {
      const muscle = getMuscle(stripSuperset(ex.name));
      if (muscle === 'Other') continue;
      scheduledSets[muscle] = (scheduledSets[muscle] || 0) + (ex.workingSets || 3);
    }
  }

  // Completed sets this week per muscle
  const weekStart = (() => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); })();
  const completedSets = {};
  for (const w of getHistory()) {
    if (w.programId !== progId || w.endTime < weekStart || !w.sets) continue;
    const wp = PROGRAMS.find(p => p.id === w.programId);
    if (!wp) continue;
    const ws = wp.sessions.find(s => s.id === w.sessionId);
    if (!ws) continue;
    for (const [key, sets] of Object.entries(w.sets)) {
      const exIdx = parseInt(key.split('_').pop());
      const ex = ws.exercises[exIdx];
      if (!ex) continue;
      const muscle = getMuscle(stripSuperset(ex.name));
      if (muscle === 'Other') continue;
      completedSets[muscle] = (completedSets[muscle] || 0) + (sets || []).filter(Boolean).length;
    }
  }

  // Sort by completion pct desc
  const muscles = Object.keys(scheduledSets).sort((a, b) => {
    const pa = (completedSets[a] || 0) / (scheduledSets[a] || 1);
    const pb = (completedSets[b] || 0) / (scheduledSets[b] || 1);
    return pb - pa;
  });

  // SVG arc gauge builder — stroke-linecap:round tapered dials per mandate
  function buildArcGauge(pct, isFull) {
    const R = 7;                          // arc radius
    const cx = 12, cy = 12;              // centre of 24×24 viewBox
    const circ = 2 * Math.PI * R;        // full circumference
    const trackDash  = circ * 0.82;      // 82% arc (open at bottom)
    const fillDash   = trackDash * Math.min(pct / 100, 1);
    const rotate     = -90 + (360 * 0.09); // start at ~10% from top

    return `<svg viewBox="0 0 24 24" style="width:24px;height:24px;flex-shrink:0;display:block">
      <circle cx="${cx}" cy="${cy}" r="${R}"
        fill="none"
        stroke="oklch(91.2% 0.012 72)"
        stroke-width="2"
        stroke-linecap="round"
        stroke-dasharray="${trackDash.toFixed(2)} ${circ.toFixed(2)}"
        transform="rotate(${rotate} ${cx} ${cy})"/>
      <circle cx="${cx}" cy="${cy}" r="${R}"
        fill="none"
        stroke="${isFull ? 'oklch(72.3% 0.190 145)' : 'oklch(58.5% 0.210 32)'}"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-dasharray="${fillDash.toFixed(2)} ${circ.toFixed(2)}"
        transform="rotate(${rotate} ${cx} ${cy})"
        style="filter:drop-shadow(0 0 ${isFull ? 5 : 3}px ${isFull ? 'oklch(72.3% 0.190 145 / 0.60)' : 'oklch(58.5% 0.210 32 / 0.50)'});transition:stroke-dasharray 750ms cubic-bezier(0.34,1.36,0.64,1)"/>
    </svg>`;
  }

  const gaugesHTML = muscles.length ? `
  <div class="completion-gauges">
    <div class="completion-gauges-hdr">Weekly Set Completion</div>
    ${muscles.map(m => {
      const scheduled = scheduledSets[m] || 0;
      const completed = Math.min(completedSets[m] || 0, scheduled);
      const pct = scheduled > 0 ? Math.round((completed / scheduled) * 100) : 0;
      const isFull = pct >= 100;
      return `<div class="gauge-row">
        <div class="gauge-muscle">${m}</div>
        <div class="gauge-arc-wrap">${buildArcGauge(pct, isFull)}</div>
        <div class="gauge-pct-label" style="${isFull ? 'color:oklch(72.3% 0.190 145)' : ''}">${pct}%</div>
      </div>`;
    }).join('')}
  </div>` : `<div style="padding:24px 20px;font-size:13px;color:var(--muted);font-style:italic">No exercises found for this program.</div>`;

  return gaugesHTML;
}

function renderFiveWeekCalendar() {
  const hist = getHistory();
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  // Map dateKey → array of workout entries
  const workoutByDay = {};
  for (const w of hist) {
    const d = new Date(w.endTime);
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if (!workoutByDay[key]) workoutByDay[key] = [];
    workoutByDay[key].push(w);
  }

  // Anchor to end of current week (Saturday)
  const currentDow = today.getDay();
  const weekEnd = new Date(today);
  weekEnd.setDate(today.getDate() + (6 - currentDow));

  const dows = ['S','M','T','W','T','F','S'];

  let weeksHTML = '';
  for (let wk = 4; wk >= 0; wk--) {
    const weekLabel = wk === 0 ? 'now' : `-${wk}w`;
    let daysHTML = '';
    for (let dow = 0; dow < 7; dow++) {
      const d = new Date(weekEnd);
      d.setDate(weekEnd.getDate() - wk * 7 - (6 - dow));
      const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      const dayNum = d.getDate();
      const isFuture = d > today;
      const workouts = workoutByDay[key] || [];
      const hasWorkout = workouts.length > 0;

      if (isFuture) {
        daysHTML += `<div class="cal-day-cell cal-day-blank"><span class="cal-day-num">${dayNum}</span></div>`;
      } else if (hasWorkout) {
        const w = workouts[0];
        const sessName = (w.sessionName || 'Workout').replace(/'/g, "\\'");
        const dateStr  = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }).replace(/'/g, "\\'");
        const dur  = formatDuration(w.duration || 0);
        const vol  = Math.round(Object.values(w.sets || {}).flat().filter(Boolean).reduce((s, x) => s + (x.w||0)*(x.r||0), 0));
        daysHTML += `<div class="cal-day-cell cal-day-done"
          onclick="openCalDay('${sessName}','${dateStr}','${dur}','${vol}kg')"
          title="${sessName}">
          <span class="cal-day-num">${dayNum}</span>
        </div>`;
      } else {
        daysHTML += `<div class="cal-day-cell cal-day-open"><span class="cal-day-num">${dayNum}</span></div>`;
      }
    }
    weeksHTML += `<div class="cal-week-row">
      <div class="cal-week-lbl">${weekLabel}</div>
      <div class="cal-days-row">${daysHTML}</div>
    </div>`;
  }

  return `<div class="cal-section">
    <div class="cal-section-hdr">5-Week Training Calendar</div>
    <div class="cal-dow-header">
      ${dows.map(d => `<div class="cal-dow-cell">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${weeksHTML}</div>
  </div>`;
}

function renderSparkline(values) {
  if (!values || values.length < 2) return '<line x1="0" y1="12" x2="60" y2="12" stroke="#E8E0D5" stroke-width="1.5"/>';
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * 58 + 1;
    const y = 22 - ((v - min) / range) * 20;
    return `${x},${y}`;
  }).join(' ');
  return `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function showMuscleDetail(muscle) {

  const insight = p.dot === 'red' && p.daysSince >= 7 ? `${muscle} hasn't been worked in ${p.daysSince} days. Get it in this week.`
    : p.dot === 'red' ? `${muscle} has been flat for 3+ sessions. Consider pushing intensity or adding a set.`
    : p.dot === 'amber' ? `${muscle} has been flat for 2 sessions. Try adding 2.5kg next time.`
    : `${muscle} is progressing well. Keep it up.`;
  openSheet(`

    ${chartSvg}

    <div style="margin-top:16px;font-size:13px;color:var(--text-secondary)">Current 1RM estimate: <b>${p.latest > 0 ? p.latest + 'kg' : 'No data'}</b></div>
  `);
}

function renderDetailChart(values) {
  if (values.length < 2) return '';
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * 298 + 1;
    const y = 95 - ((v - min) / range) * 85;
    return `${x},${y}`;
  }).join(' ');
  return `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function buildTrailingChart(fb) {
  const R  = fb.trailingReadiness || [];
  const SL = fb.trailingSleep     || [];
  const HV = fb.trailingHRV       || [];
  const N  = Math.min(R.length, SL.length, HV.length);
  if (N < 2) return `<svg viewBox="0 0 300 110" xmlns="http://www.w3.org/2000/svg">
    <text x="150" y="55" text-anchor="middle" font-family="'Cormorant Garamond',serif"
      font-style="italic" font-size="13" fill="oklch(60% 0.018 55)" opacity="0.45">
      complete more days to build your trail
    </text></svg>`;

  // Real calendar day labels — today rightmost, trailing N days
  const DAYS = ['S','M','T','W','T','F','S'];
  const today = new Date();
  const dayLabels = [];
  for (let i = N - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(today.getDate() - i);
    dayLabels.push(DAYS[d.getDay()]);
  }

  const W = 300, H = 110, PAD_X = 8, PAD_TOP = 8, LABEL_H = 18;
  const chartH = H - PAD_TOP - LABEL_H;

  function normalizeSeries(arr) {
    const slice = arr.slice(-N);
    const mn = Math.min(...slice), mx = Math.max(...slice);
    const rng = mx - mn || 1;
    return slice.map(v => (v - mn) / rng);
  }

  function buildPath(normalized) {
    return normalized.map((v, i) => {
      const x = PAD_X + (i / (N - 1)) * (W - PAD_X * 2);
      const y = PAD_TOP + (1 - v) * chartH;
      return `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
  }

  const rNorm  = normalizeSeries(R);
  const slNorm = normalizeSeries(SL);
  const hvNorm = normalizeSeries(HV);

  // X-axis tick labels
  const ticksHTML = dayLabels.map((lbl, i) => {
    const x = PAD_X + (i / (N - 1)) * (W - PAD_X * 2);
    return `<text x="${x.toFixed(1)}" y="${H - 2}" text-anchor="middle"
      font-family="var(--font-body,monospace)" font-size="8" letter-spacing="0.04em"
      fill="oklch(60% 0.018 55)" opacity="0.5">${lbl}</text>`;
  }).join('');

  // Micro crosshair at today (rightmost point)
  const todayX = (W - PAD_X).toFixed(1);
  const crosshair = `<line x1="${todayX}" y1="${PAD_TOP}" x2="${todayX}" y2="${H - LABEL_H}"
    stroke="oklch(60% 0.018 55)" stroke-width="0.5" opacity="0.18" stroke-dasharray="2,2"/>`;

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    ${crosshair}
    <path d="${buildPath(slNorm)}" fill="none" stroke="oklch(55% 0.08 240)"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
    <path d="${buildPath(hvNorm)}" fill="none" stroke="oklch(72% 0.14 85)"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
    <path d="${buildPath(rNorm)}" fill="none" stroke="oklch(58.5% 0.210 32)"
      stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${ticksHTML}
  </svg>`;
}

async function fetchFitbitData(force = false) {
  const s = getSettings();
  if (!s.sheets) return;

  // Cache-first: if today's data is already stored and this isn't a forced pull, skip
  if (!force) {
    const today = new Date().toISOString().slice(0, 10);
    if (ST.fitbit.fetchedAt === today) return;
  }

  // Animate the ↻ button into loading state if visible
  const btn = document.querySelector('.analysis-hud-refresh');
  if (btn) {
    btn.textContent = '↻';
    btn.style.animation = 'hud-spin 0.9s linear infinite';
    btn.disabled = true;
    btn.style.opacity = '0.65';
  }

  const fitbitEndpoint = s.sheets + '?action=getFitbit';
  try {
    const res = await fetch(fitbitEndpoint, { method: 'GET' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (data && data.fitbit) {
      Object.assign(ST.fitbit, data.fitbit, { connected: true, lastSync: Date.now() });
      LS.set('dcrgym_fitbit', ST.fitbit);
      if (ST.screen === 'analysis') renderAnalysis();
    }
  } catch(e) {
    console.warn('[DCR Gym] Fitbit fetch failed (non-fatal):', e);
    // Reset button on failure without full re-render
    if (btn) {
      btn.style.animation = '';
      btn.disabled = false;
      btn.style.opacity = '0.35';
    }
  }
}

function exportCSV() {
  const hist = getHistory();
  let csv = 'Date,Program,Session,Exercise,Set,Weight,Reps\n';
  for (const w of hist) {
    const prog = PROGRAMS.find(p => p.id === w.programId);
    if (!prog) continue;
    const sess = prog.sessions.find(s => s.id === w.sessionId);
    if (!sess) continue;
    const date = new Date(w.endTime).toISOString().split('T')[0];
    for (const [key, sets] of Object.entries(w.sets || {})) {
      const exIdx = parseInt(key.split('_').pop());
      const ex = sess.exercises[exIdx];
      if (!ex) continue;
      sets.forEach((s, i) => {
        csv += `${date},${prog.name},${sess.name},${stripSuperset(ex.name)},${i+1},${s.w||0},${s.r||0}\n`;
      });
    }
  }
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'dcrgym-history.csv'; a.click();
  URL.revokeObjectURL(url);
}

function importStrongCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) { alert('No data found in CSV.'); return; }

    // Auto-detect separator
    const sep = lines[0].includes(';') ? ';' : ',';

    // Read header row and map column names → indices dynamically.
    // This handles all Strong export versions regardless of column order.
    const header = lines[0].split(sep).map(c => c.replace(/^"|"$/g,'').trim().toLowerCase());
    const col = name => header.findIndex(h => h === name || h.startsWith(name));
    const colDate     = col('date');
    const colExName   = col('exercise name');
    const colSetOrder = col('set order');
    const colWeight   = header.findIndex(h => h.startsWith('weight'));
    const colReps     = col('reps');

    if (colDate === -1 || colExName === -1 || colReps === -1) {
      alert('Could not detect required columns (Date, Exercise Name, Reps). Is this a Strong CSV export?');
      return;
    }

    const hist = getHistory();
    let parsed = 0;
    let currentDate = null, currentWorkout = null;

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(sep).map(c => c.replace(/^"|"$/g,'').trim());
      const dateStr   = cols[colDate]     || '';
      const exName    = cols[colExName]   || '';
      const setType   = colSetOrder !== -1 ? (cols[colSetOrder] || '') : '';
      const weightStr = colWeight  !== -1 ? (cols[colWeight]   || '0') : '0';
      const repsStr   = cols[colReps]     || '';

      if (!dateStr || !exName) continue;
      if (setType === 'W' || setType === 'Note' || exName === 'Rest Timer') continue;

      const date = new Date(dateStr).getTime();
      if (isNaN(date)) continue;

      if (!currentWorkout || currentDate !== dateStr) {
        if (currentWorkout) hist.push(currentWorkout);
        currentDate = dateStr;
        currentWorkout = { id: date.toString(), programId: 'import', sessionId: 'import', sessionName: 'Strong Import', startTime: date, endTime: date + 3600000, duration: 3600, travelMode: false, sets: {} };
        parsed++;
      }

      const clean = exName.replace(/\s*\([^)]*\)/g,'').trim();
      const key = 'import_' + clean.replace(/\s/g,'_').toLowerCase();
      if (!currentWorkout.sets[key]) currentWorkout.sets[key] = [];
      currentWorkout.sets[key].push({ w: parseFloat(weightStr)||0, r: parseInt(repsStr)||0, ts: date, _name: clean });
    }

    if (currentWorkout) hist.push(currentWorkout);
    saveHistory(hist);
    alert('Imported ' + parsed + ' workouts from Strong.');
    input.value = '';
  };
  reader.readAsText(file);
}

function requestNotif() {
  if (!('Notification' in window)) { alert('Notifications not supported in this browser.'); return; }
  Notification.requestPermission().then(perm => {
    ST.notifEnabled = perm === 'granted';
    renderSettings();
  });
}

// ── Onboarding ────────────────────────────────────────────────────────────────
let onboardStep = 0;
let onboardProg = null;

function renderOnboarding() {
  const el = document.getElementById('screen-home');
  if (!el) {
    console.error('[DCRGym] renderOnboarding: #screen-home not found in pre-rendered shell');
    return;
  }
  el.style.display = 'block';

  // Each step "wakes up" the app — vellum → warm amber → energised terracotta bloom
  const bgGradients = [
    'radial-gradient(ellipse at 60% 20%, #FAF7F2 0%, #F0EBE3 100%)',
    'radial-gradient(ellipse at 40% 55%, #FFF3EB 0%, #FAF0E6 60%, #F0EBE3 100%)',
    'radial-gradient(ellipse at 52% 40%, #FFF8F4 0%, #FFF0E9 55%, #F5EDE4 100%)',
  ];

  const dots = n => `<div class="ob-dots">
    ${[0,1,2].map(i=>`<div class="ob-dot${i===n?' active':''}"></div>`).join('')}
  </div>`;

  const steps = [
    // Step 0 — Welcome
    () => `<div class="ob-screen">
      <div class="ob-eyebrow">Jeff Nippard · The Muscle Ladder</div>
      <div class="ob-question">Your program.<br>In your pocket.</div>
      <div class="ob-hint">All 8 Muscle Ladder programs, pre-loaded.<br>Progressive overload, tracked automatically.</div>
      ${dots(0)}
      <button class="ob-cta" onclick="nextOnboard()">Get Started →</button>
    </div>`,

    // Step 1 — Program selection via glowing pills
    () => `<div class="ob-screen">
      <div class="ob-eyebrow">Step 1 of 2</div>
      <div class="ob-question">How many days<br>can you train?</div>
      <div class="ob-hint" style="margin-bottom:28px">Tap a program to continue.</div>
      ${dots(1)}
      <div class="ob-pill-grid">
        ${PROGRAMS.map(p => `
          <div class="ob-pill ${onboardProg === p.id ? 'selected' : ''}"
               onclick="selectOnboardProgAndAdvance('${p.id}')">
            <div class="ob-pill-days">${p.daysPerWeek}</div>
            <div class="ob-pill-sub">days / week</div>
            <div class="ob-pill-name">${p.name}</div>
          </div>`).join('')}
      </div>
    </div>`,

    // Step 2 — Notifications
    () => `<div class="ob-screen">
      <div class="ob-eyebrow">Step 2 of 2</div>
      <div class="ob-question">Stay<br>locked in.</div>
      <div class="ob-hint">Get a "Lock In DCR!" alert when your rest timer ends — even with your screen off.</div>
      ${dots(2)}
      <button class="ob-cta" onclick="enableNotifOnboard()">Enable Notifications</button>
      <button class="ob-cta-ghost" onclick="finishOnboard()">Skip for now</button>
    </div>`,
  ];

  el.innerHTML = steps[onboardStep] ? steps[onboardStep]() : '';

  // Slow-reveal background transition — "waking up" the app
  requestAnimationFrame(() => {
    el.style.transition = 'background 600ms ease';
    el.style.background = bgGradients[onboardStep] || bgGradients[0];
  });

  el.style.display = 'block';
  el.classList.add('active');
  document.getElementById('bottom-nav').style.display = 'none';
}

function selectOnboardProg(id) {
  onboardProg = id;
  renderOnboarding();
}

function selectOnboardProgAndAdvance(id) {
  onboardProg = id;
  onboardStep++;
  renderOnboarding();
}

function nextOnboard() {
  onboardStep++;
  if (onboardStep >= 3) { finishOnboard(); return; }
  renderOnboarding();
}

function enableNotifOnboard() {
  if ('Notification' in window) {
    Notification.requestPermission().then(p => { ST.notifEnabled = p === 'granted'; });
  }
  finishOnboard();
}

function finishOnboard() {
  // 1. Persist selection
  if (onboardProg) {
    ST.defaultProgram = onboardProg;
    LS.set('dcrgym_default_prog', onboardProg);
  }
  LS.set('dcrgym_onboarded', true);

  // 2. Clear onboarding content from screen-home
  const obEl = document.getElementById('screen-home');
  if (obEl) { obEl.innerHTML = ''; obEl.style.display = 'none'; obEl.classList.remove('active'); }

  // 3. requestAnimationFrame — let browser repaint cleared state before mounting home
  requestAnimationFrame(() => {
    Maps('home');
  });
}

// ── Program / session helpers ─────────────────────────────────────────────────
function previewSession(progId, sessId) {
  const prog = PROGRAMS.find(p => p.id === progId);
  const sess = prog && prog.sessions.find(s => s.id === sessId);
  if (!sess) return;
  const restTimes = getRestTimes();
  const rows = sess.exercises.map((ex, i) => {
    const name = stripSuperset(ex.name);
    const muscle = getMuscle(name);
    const c = MUSCLE_COLORS[muscle] || MUSCLE_COLORS.Other;
    const restSec = restTimes[normalizeEx(name)] || parseRestSeconds(ex.rest);
    const last = getLastPerformance(name);
    const lastText = last && last[0] ? `${last[0].w}kg × ${last[0].r}` : '—';
    return `<div style="display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--border)">
      <div style="flex:1">
        <div style="font-size:14px;font-weight:600;margin-bottom:3px">${name}</div>
        <div style="font-size:12px;color:var(--muted)">${ex.workingSets||3} × ${ex.reps} · ${formatDuration(restSec)} rest · Last: ${lastText}</div>
      </div>
      <span class="muscle-badge" style="background:${c.bg};color:${c.color};flex-shrink:0">${muscle}</span>
    </div>`;
  }).join('');
  openSheet(`
    <div class="bs-title">${sess.name}</div>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">${sess.exercises.length} exercises · ${prog.name}</div>
    ${rows}
    <div style="margin-top:20px">
      <button class="btn btn-primary" onclick="closeSheet();startWorkoutFromHome('${progId}','${sessId}')">Start This Workout</button>
    </div>
  `);
}

function setDayFilter(n) {
  ST.programFilter = n;
  renderProg();
}

function selectProgram(id) {
  ST.currentProgram = id;
  ST.defaultProgram = id;
  LS.set('dcrgym_default_prog', id);

// ── Cloud sync (bidirectional) ────────────────────────────────────────────────
async function pullFromSheets() {
  const s = getSettings();
  if (!s.sheets) return;
  try {
    const resp = await fetch(s.sheets + '?action=pullState');
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.ok && Array.isArray(data.history) && data.history.length > 0) {
      const local = getHistory();
      const merged = mergeHistories(local, data.history);
      if (merged.length > local.length) saveHistory(merged);
    }
  } catch(e) { /* silent — background op */ }
}

async function bgSyncToSheets() {
  const s = getSettings();
  if (!s.sheets) return;
  const hist = getHistory();
  try {
    // Save full state blob for bidirectional sync
    fetch(s.sheets, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ action:'saveState', history:hist, ts:Date.now() })
    });
    // Also push human-readable rows
    const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
    const sess = prog && prog.sessions.find(ss => ss.id === ST.currentSession);
    if (prog && sess && hist.length > 0) {
      const last = hist[hist.length - 1];
      const exercises = sess.exercises.map((ex, i) => {
        const key = `${sess.id}_${i}`;
        const sets = (last.sets[key] || []).filter(Boolean).map(s => ({weight:s.w, reps:s.r}));
        return { name: stripSuperset(ex.name), sets };
      }).filter(ex => ex.sets.length);
      fetch(s.sheets, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({
          action: 'syncWorkouts',
          workouts: [{
            id: last.id,
            date: last.endTime,
            programName: prog.name,
            sessionName: sess.name,
            duration: last.duration,
            totalVolume: calcVolume(),
            totalSets: exercises.reduce((n,e)=>n+e.sets.length,0),
            exercises
          }]
        })
      });
    }
  } catch(e) { /* silent */ }
}

async function manualSync() {
  const btn = document.getElementById('sync-now-btn');
  if (btn) { btn.textContent = 'Syncing…'; btn.disabled = true; }
  const s = getSettings();
  if (!s.sheets) { if (btn) { btn.textContent = 'No URL set'; btn.disabled = false; } return; }
  try {
    await Promise.all([pullFromSheets(), bgSyncToSheets()]);
    if (btn) { btn.textContent = 'Synced ✓'; setTimeout(()=>{ btn.textContent='Sync Now'; btn.disabled=false; }, 2000); }
  } catch(e) {
    if (btn) { btn.textContent = 'Error'; btn.disabled = false; }
  }
}

function mergeHistories(local, remote) {
  const map = new Map();
  for (const w of local) if (w.id) map.set(w.id, w);
  for (const w of remote) if (w.id && !map.has(w.id)) map.set(w.id, w);
  return [...map.values()].sort((a, b) => (a.endTime||0) - (b.endTime||0));
}


function checkWeekComplete() {
  const progId = ST.defaultProgram;
  if (!progId) return false;
  const prog = PROGRAMS.find(p => p.id === progId);
  if (!prog) return false;
  const weekStart = (() => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); })();
  const doneThisWeek = new Set(getHistory().filter(w => w.programId === progId && w.endTime >= weekStart).map(w => w.sessionId));
  return prog.sessions.every(s => doneThisWeek.has(s.id));
}

// ── Gatekeeper — verifies (and injects if missing) all required UI root elements ──
// ── Synchronous bootstrap — shell is hard-coded in HTML, no dynamic injection ─
// ── Fault-tolerant bootstrap — all state access inside try/catch, LS proxy only ──
function bootstrapApp() {
  console.log('[DCR Gym Shell] Dispatching boot loop...');

  const splash = document.getElementById('splash');
  const home   = document.getElementById('screen-home');
  const nav    = document.getElementById('bottom-nav');

  // State hydration — fully wrapped, LS proxy handles any storage exceptions
  try {
    ST.defaultProgram = LS.get('dcrgym_default_prog');
    getSettings();
    // Fitbit hydration — merge stored biometric data over defaults
    const storedFitbit = LS.get('dcrgym_fitbit', null);
    if (storedFitbit && typeof storedFitbit === 'object') {
      Object.assign(ST.fitbit, storedFitbit);
    }
  } catch(e) {
    console.warn('[DCR Gym Shell] State hydration fault (non-fatal):', e);
  }

  // Service worker — fire-and-forget
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(r => { ST.swReg = r; }).catch(() => {});
  }

  // Dismiss splash — belt-and-suspenders: remove active class, zero z-index
  if (splash) {
    splash.classList.remove('active');
    splash.style.display = 'none';
    splash.style.pointerEvents = 'none';
    splash.style.zIndex = '-1';
  }

  // Routing — uses LS proxy, no raw localStorage calls
  try {
    const _ob = LS.get('dcrgym_onboarded');
    const onboarded = _ob === true || _ob === 'true';

    if (!onboarded) {
      console.log('[DCR Gym Shell] First launch → onboarding');
      onboardStep = 0;
      onboardProg = null;
      renderOnboarding();
    } else {
      console.log('[DCR Gym Shell] Returning user → home');
      if (home) home.style.display = 'block';
      if (nav)  nav.style.display  = 'flex';
      Maps('home');
    }
  } catch(err) {
    console.error('[DCR Gym Shell] Router fault:', err);
    document.body.innerHTML =
      '<div style="padding:40px;font-family:sans-serif;background:#FAF7F2;color:oklch(44% 0.025 55);min-height:100vh">' +
      '<h2 style="font-family:serif;font-style:italic">[System Boot Fault]</h2>' +
      '<p style="margin-top:10px">' + err.message + '</p>' +
      '<pre style="background:#fff;padding:12px;font-size:11px;overflow-x:auto;margin-top:10px">' + (err.stack || '') + '</pre>' +
      '<button onclick="localStorage.clear();location.reload()" style="margin-top:20px;padding:10px 20px;background:#2A2421;color:#fff;border:none;border-radius:8px;cursor:pointer">Reset Application Cache</button>' +
      '</div>';
    return;
  }

  // Background sync — idle, never blocks render path
  setTimeout(() => { pullFromSheets().catch(() => {}); }, 2500);
}

// Isolated fail-safe dispatcher — handles all readyState variants on WebKit/Safari
function runBootSequence() {
  console.log('[DCR Gym Shell] Dispatched main boot loop.');
  try {
    bootstrapApp();
  } catch(fatalError) {
    console.error('[DCR Gym Shell] Boot failed:', fatalError);
    document.body.innerHTML =
      '<div style="padding:40px;font-family:sans-serif;background:#FAF7F2;color:oklch(44% 0.025 55);min-height:100vh">' +
      '<h2 style="font-family:serif;font-style:italic">[System Boot Fault]</h2>' +
      '<p style="margin-top:10px">' + fatalError.message + '</p>' +
      '<pre style="background:#fff;padding:12px;font-size:11px;overflow-x:auto;margin-top:10px">' + (fatalError.stack || '') + '</pre>' +
      '<button onclick="localStorage.clear();location.reload()" style="margin-top:20px;padding:10px 20px;background:#2A2421;color:#fff;border:none;border-radius:8px;cursor:pointer">Reset Application Cache</button>' +
      '</div>';
  }
}

// Target all document readyState variants — critical for iOS WebView + Safari
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(runBootSequence, 1);
} else {
  window.addEventListener('load', runBootSequence);
}
