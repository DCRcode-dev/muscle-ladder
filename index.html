// ── Workout renderer ──────────────────────────────────────────────────────────
// ── Single exercise card (program slot OR accessory addition) ───────────────
// Extracted so additions reuse the exact same logging/prefill/rest/overload UI.
// isAddition=true → key is `add_${n}`, resolves via ST.workoutAdditions.
function exerciseCardHTML(ex, key, i, isAddition) {
  const notes = getNotes();
  const restTimes = getRestTimes();
  const unit = getWeightUnit();
  const name = isAddition ? liveExName(key, ex) : stripSuperset(ex.name);
  const isExpanded = ST.expandedCards.has(key);
  const isCompleted = ST.completedCards.has(key);
  const muscle = getMuscle(name);
  const barbell = isBarbell(name);
  const cueAvail = !!FORM_CUES[normalizeEx(name)];
  const travel = !isAddition && ST.travelMode && TRAVEL_MAP[normalizeEx(name)];
  const displayName = liveExName(key, ex);
  const subbed = !isAddition && ST.workoutSubs && ST.workoutSubs[key];
  const autoSubbed = !isAddition && ST.workoutAutoSubs && ST.workoutAutoSubs[key];
  const loggedSets = ST.workoutSets[key] || [];

  // Sets count / reps — honours custom counts on subbed slots & additions
  const totalSets = effSetCount(key, ex);
  const reps = effReps(key, ex);

  // Last performance (pre-fill) — looked up by the EFFECTIVE exercise identity across all workouts.
  const lastPerfFull = getLastPerformanceFull(displayName);
  const lastPerf = lastPerfFull ? lastPerfFull.sets : null;

  // Overload nudge check
  let overloadNudge = '';
  if (loggedSets.length === totalSets && totalSets > 0) {
    const topRep = parseInt((reps.match(/(\d+)$/) || ['',reps])[1]);
    if (!isNaN(topRep) && loggedSets.every(s => s.r >= topRep)) {
      overloadNudge = `<div class="overload-nudge">⬆ All sets hit ${topRep} reps — increase weight next session!</div>`;
    }
  }

  // ── Build set rows with trend micro-indicators ───────────────────────────
  let histAvgW = null;
  if (lastPerf && lastPerf.length > 0) {
    const wArr = lastPerf.filter(s => s && s.w > 0).map(s => s.w);
    if (wArr.length > 0) histAvgW = wArr.reduce((a, b) => a + b, 0) / wArr.length;
  }

  let setRows = '';
  for (let si = 0; si < totalSets; si++) {
    const logged = loggedSets[si];
    const lastSet = lastPerf && (lastPerf[si] != null ? lastPerf[si] : lastPerf[lastPerf.length - 1]);
    const draft = !logged && ST.workoutDrafts && ST.workoutDrafts[key + '-' + si];
    const preW = logged ? logged.w : (draft && draft.w !== '' ? draft.w : (lastSet != null && lastSet.w != null ? lastSet.w : ''));
    const preR = logged ? logged.r : (draft && draft.r !== '' ? draft.r : (lastSet != null && lastSet.r != null ? lastSet.r : (ex && ex.reps ? (parseInt((ex.reps.match(/(\d+)$/) || ['', '8'])[1]) || 8) : '')));
    const isLastSet = si === totalSets - 1;
    const tech = isLastSet && ex.lastSetTechnique ? `<span class="technique-badge">${ex.lastSetTechnique}</span>` : '';
    const isLogged = !!logged;
    const plateHtml = barbell && isExpanded && ST.openPlate === `${key}_${si}` ? renderPlatePopover(preW || 0) : '';

    let trendHtml = '';
    if (!isLogged && histAvgW !== null && preW !== '' && Number(preW) > 0) {
      const diff = Number(preW) - histAvgW;
      const absDiff = Math.abs(diff);
      if (absDiff >= 0.5) {
        const arrow   = diff > 0 ? '↑' : '↓';
        const cls     = diff > 0 ? 'trend-arrow-up' : 'trend-arrow-down';
        const diffStr = (diff > 0 ? '+' : '') + diff.toFixed(1) + ' ' + unit + ' vs avg';
        trendHtml = `<div class="set-trend">
          <span class="${cls}">${arrow}</span>
          <span>${diffStr}</span>
        </div>`;
      }
    }

    setRows += `
    <div class="set-row" id="setrow-${key}-${si}">
      <div class="set-num">${si+1}</div>
      <input class="set-input${isLogged?' logged':''}" id="wi-${key}-${si}" type="text" inputmode="none"
        value="${preW}" placeholder="${unit}" autocomplete="off"
        onclick="openNumpad(this,'${key}',${si},${i},'w')"
        oninput="markDraft('${key}',${si})"
        ${barbell?`onfocus="showPlate('${key}',${si})" onblur="hidePlate('${key}',${si})"`:''}>
      <div class="set-sep">×</div>
      <input class="set-input${isLogged?' logged':''}" id="ri-${key}-${si}" type="text" inputmode="none"
        value="${preR}" placeholder="reps" autocomplete="off"
        onclick="openNumpad(this,'${key}',${si},${i},'r')"
        oninput="markDraft('${key}',${si})">
      <button class="set-log-btn${isLogged?' logged':''}" onclick="${isLogged ? `unlogSet('${key}',${si},${i})` : `logSet('${key}',${si},${i})`}"
        >${isLogged ? checkSVG() : '→'}</button>
    </div>
    ${trendHtml}
    ${tech ? `<div style="padding-left:30px;margin-bottom:6px">${tech}</div>` : ''}
    ${plateHtml}`;
  }

  // Warm-up set row — one interactive row; hidden if user dismissed for this exercise
  const wuKey = `${key}_wu`;
  const wuDismissed = ST.dismissedWarmups.has(normalizeEx(name));
  const wuLogged = ST.workoutSets[wuKey] && ST.workoutSets[wuKey][0];
  const wuDraft = !wuLogged && ST.workoutDrafts && ST.workoutDrafts[key + '-wu'];
  const wuPreW = wuLogged ? wuLogged.w : (wuDraft && wuDraft.w !== '' ? wuDraft.w : (lastPerf && lastPerf[0] && lastPerf[0].w != null ? Math.round(Number(lastPerf[0].w) * 0.5) : ''));
  const wuPreR = wuLogged ? wuLogged.r : (wuDraft && wuDraft.r !== '' ? wuDraft.r : '');
  const warmupRowHtml = (!wuDismissed) ? `
    <div class="warmup-row" id="wurow-${key}">
      <span class="warmup-label">warm-up</span>
      <input class="warmup-input" id="wuwi-${key}" type="text" inputmode="none"
        value="${wuPreW}" placeholder="${unit}" autocomplete="off"
        onclick="openNumpad(this,'${key}',0,${i},'w',true)" oninput="markDraftWu('${key}')">
      <span class="warmup-sep">×</span>
      <input class="warmup-input" id="wuri-${key}" type="text" inputmode="none"
        value="${wuPreR}" placeholder="reps" autocomplete="off"
        onclick="openNumpad(this,'${key}',0,${i},'r',true)" oninput="markDraftWu('${key}')">
      <button class="warmup-dismiss" onclick="dismissWarmup(event,'${key}','${normalizeEx(name)}')" title="Remove warm-up">✕</button>
    </div>` : '';

  const noteKey = normalizeEx(name);
  const noteVal = notes[noteKey] || '';
  const restSec = restTimes[normalizeEx(name)] || parseRestSeconds(ex.rest);

  return `
  <div class="ex-card${isExpanded?' expanded':''}${isCompleted?' completed':''}${isAddition?' ex-card-add':''}" id="excard-${key}">
    <div class="ex-card-header" onclick="toggleCard('${key}')">
      <div class="ex-card-header-left">
        <div class="ex-name">${displayName} ${isCompleted ? '<span class="ex-check">✓</span>' : ''}</div>
        ${subbed ? `<div class="ex-sub-note">⇄ swapped from ${name}</div>` : 
          (autoSubbed ? `<div class="ex-sub-note">⇄ auto-swapped from ${name} (blacklisted)</div>` : 
          (isAddition ? `<div class="ex-sub-note">✚ added exercise</div>` : ''))}
        ${muscleBadgeHtml(muscle)}
        ${lastPerf ? `<div class="ex-last-perf">${lastPerf[lastPerf.length-1].w} ${unit} × ${lastPerf[lastPerf.length-1].r} · ${relDay(lastPerfFull.endTime)}</div>` : ''}
        <div class="ex-meta">${totalSets} × ${reps} · ${formatDuration(restSec)} rest</div>
      </div>
      <div class="ex-card-actions">
        <button class="ex-graph-btn" onclick="showProgressGraph(event,'${name}')" title="Progress">⬆</button>
        ${cueAvail || true ? `<button class="ex-cue-btn" onclick="showCue(event,'${key}',${i})">?</button>` : ''}
        ${isAddition ? `<button class="ex-cue-btn ex-remove-btn" onclick="removeAddition(event,${i})" title="Remove">✕</button>` : `
          <button class="ex-cue-btn" onclick="showSubs(event,'${key}',${i})" title="Substitutions">⇄</button>
          <button class="ex-cue-btn ex-remove-btn" onclick="blacklistExercisePrompt(event,'${key}')" title="Never show again">✕</button>
        `}
        <button class="ex-note-btn${(ST.workoutNotes[key] || noteVal) ? ' has-note' : ''}" id="notebtn-${key}"
          onclick="toggleNotePanel(event,'${key}','${noteKey}')" title="Add note">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
          </svg>
        </button>
        <svg class="ex-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div class="ex-body">
      <div class="ex-body-inner">
        ${warmupRowHtml}
        ${overloadNudge}
        ${setRows}
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
          <div class="set-hint rest-time-row">
            <span style="color:var(--muted)">Rest</span>
            <span class="rest-time-display" id="rest-lbl-${key}" onclick="editRestTime('${key}',${i},this)" title="Tap to edit">${formatDuration(restSec)}</span>
          </div>
        </div>
        <!-- Inline note panel — revealed by header pen icon -->
        <div class="ex-note-panel${(ST.workoutNotes[key] || noteVal) ? ' open' : ''}" id="notepanel-${key}">
          <textarea class="ex-note-area" id="noteinput-${key}"
            placeholder="Session notes…"
            oninput="saveSessionNote('${key}','${noteKey}',this.value)"
          >${ST.workoutNotes[key] !== undefined ? ST.workoutNotes[key] : noteVal}</textarea>
        </div>
      </div>
    </div>
  </div>`;
}

function renderWorkout() {
  const el = document.getElementById('screen-workout');
  if (!el) return;
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (!prog || !sess) { Maps('home'); return; }
  const exList = sess.exercises;
  const notes = getNotes();
  const restTimes = getRestTimes();

  // Build exercise HTML — programmed slots first, then accessory additions
  const exCards = exList.map((ex, i) => exerciseCardHTML(ex, `${sess.id}_${i}`, i, false)).join('');
  const allProgDone = exList.length > 0 && exList.every((_, idx) => ST.completedCards.has(`${sess.id}_${idx}`));
  let addCards = '';
  if (ST.workoutAdditions && ST.workoutAdditions.length) {
    addCards = `<div class="add-group-lbl">✚ Additions</div>` +
      ST.workoutAdditions.map((a) => {
        const slot = slotForKey('add_' + a.id);
        return slot ? exerciseCardHTML(slot.ex, 'add_' + a.id, a.id, true) : '';
      }).join('');
  }
  const addPill = allProgDone
    ? `<button class="add-ex-pill" onclick="showAddSheet()"><span class="add-ex-plus">+</span> Add Exercise</button>`
    : '';

  const headerModeLabel = ST.editingWorkoutId ? 'Editing Workout' : (ST.isBackdated ? 'Past Workout' : 'Active Workout');
  const showDateHeader = ST.editingWorkoutId || ST.isBackdated;
  const finishBtnText = ST.editingWorkoutId ? 'Save Changes' : (ST.isBackdated ? 'Save Workout' : 'Finish Workout');

  el.innerHTML = `
  <div id="workout-header${ST.travelLocked?' travel-locked':''}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <button onclick="cancelWorkout()" style="background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 8px 4px 0;flex-shrink:0;font-family:var(--font-body);width:44px;text-align:left">✕</button>
      <div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:0;">
        <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:rgba(250,247,242,0.42);margin-bottom:2px;">
          ${headerModeLabel}
        </div>
        <div class="wh-session" style="margin-bottom:0 !important;font-size:1.3rem !important;flex:none !important;line-height:1.1;">${sess.name}</div>
        ${showDateHeader ? `
          <div style="font-size:11px;color:var(--accent);margin-top:4px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,0.08);padding:2px 8px;border-radius:20px;" onclick="editWorkoutDateTime()">
            📅 ${new Date(ST.workoutStart).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })} <span style="font-size:9px;opacity:0.8;">(edit)</span>
          </div>
        ` : ''}
      </div>
      <div style="width:44px;flex-shrink:0"></div>
    </div>
    <div class="wh-top">
      <div class="wh-duration" id="wh-dur" ${showDateHeader ? 'onclick="editWorkoutDateTime()" style="cursor:pointer;"' : ''}>${formatDuration(ST.durationSecs)}</div>
      ${(()=>{
        const total = exList.length;
        const done = exList.filter((_,i)=>ST.completedCards.has(`${sess.id}_${i}`)).length;
        const remaining = total - done;
        return `<div class="wh-pct-badge${remaining===0?' complete':''}" id="wh-pct">
          <div class="wh-pct-num" id="wh-pct-num">${remaining}</div>
          <div class="wh-pct-unit">left</div>
        </div>`;
      })()}
    </div>
    <div class="wh-progress">
      ${exList.map((_,i)=>{
        const k=`${sess.id}_${i}`;
        return `<div class="wh-seg${ST.completedCards.has(k)?' done':''}"></div>`;
      }).join('')}
    </div>
    ${!ST.travelLocked ? `
    <div class="travel-toggle-row">
      <span class="travel-toggle-lbl">✈ Travel Mode (no gym)</span>
      <label class="toggle-switch">
        <input type="checkbox" ${ST.travelMode?'checked':''} onchange="setTravel(this.checked)">
        <span class="toggle-slider"></span>
      </label>
    </div>` : ''}
  </div>
  <div class="exercise-list">${exCards}${addCards}${addPill}</div>
  <div style="padding:16px 16px calc(var(--nav-h) + 28px)">
    <button class="btn btn-primary" onclick="shimmerBtn(this);setTimeout(()=>finishWorkout(),220)">${finishBtnText}</button>
  </div>`;

  // Restore rest timer if active
  if (ST.restActive) {
    const remaining = Math.ceil((ST.restEndTime - Date.now())/1000);
    if (remaining > 0) {
      setTimeout(renderRestBanner, 100);
      if (!ST.restTicker) ST.restTicker = setInterval(tickRest, 250);
    } else {
      cancelRestTimer();
    }
  }

  // Auto-open first uncompleted exercise if nothing is expanded
  if (ST.expandedCards.size === 0) {
    const firstIdx = exList.findIndex((_, i) => !ST.completedCards.has(`${sess.id}_${i}`));
    if (firstIdx !== -1) {
      const firstKey = `${sess.id}_${firstIdx}`;
      ST.expandedCards.add(firstKey);
      const firstCard = document.getElementById('excard-' + firstKey);
      if (firstCard) firstCard.classList.add('expanded');
    }
  }
}

function renderPlatePopover(totalW) {
  const unit = getWeightUnit();
  const barW = unit === 'lb' ? 45 : 20;
  const plates = plateCalc(parseFloat(totalW) || 0, barW);
  if (!plates || plates.length === 0) return `<div class="plate-popover"><div class="plate-title">${barW}${unit} bar · no plates</div></div>`;
  // Drawn to scale — height & width proportional to the real plates
  const GEO = unit === 'lb' ? {
    45:  [52, 12, 'oklch(40% 0.01 40)'],
    35:  [46, 11, 'oklch(48% 0.01 40)'],
    25:  [40, 10, 'oklch(56% 0.01 40)'],
    10:  [32, 8,  'oklch(64% 0.01 40)'],
    5:   [24, 6,  'oklch(72% 0.01 40)'],
    2.5: [16, 5,  'oklch(78% 0.02 60)'],
  } : {
    25:   [46, 9,  'oklch(58.5% 0.210 32)'],
    20:   [42, 9,  'oklch(28% 0.018 45)'],
    15:   [36, 8,  'oklch(42% 0.025 55)'],
    10:   [30, 7,  'oklch(54% 0.030 60)'],
    5:    [24, 6,  'oklch(64% 0.030 60)'],
    2.5:  [18, 5,  'oklch(71% 0.030 60)'],
    1.25: [14, 4,  'oklch(77% 0.025 65)'],
  };
  const H = 60, midY = H / 2;
  let x = 16;
  let svgPlates = '';
  for (const p of plates) {
    const [ph, pw, col] = GEO[p] || [16, 5, 'oklch(72% 0.03 60)'];
    svgPlates += `<rect x="${x}" y="${(midY - ph / 2).toFixed(1)}" width="${pw}" height="${ph}" rx="2.2" fill="${col}"/>
      <rect x="${x + 1.2}" y="${(midY - ph / 2 + 2).toFixed(1)}" width="1.6" height="${ph - 4}" rx="0.8" fill="rgba(255,255,255,0.14)"/>`;
    x += pw + 2.5;
  }
  const W = Math.max(x + 16, 132);
  const perSide = plates.reduce((a, b) => a + b, 0);
  const labels = plates.map(p => Number.isInteger(p) ? p : p.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')).join(' · ');
  return `<div class="plate-popover">
    <div class="plate-title">Each side · ${barW} ${unit} bar</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:100%;height:${H}px;display:block;margin:4px auto 0" aria-hidden="true">
      <rect x="0" y="${midY - 3}" width="${W}" height="6" rx="3" fill="oklch(82% 0.012 70)"/>
      <rect x="8" y="${midY - 7}" width="5" height="14" rx="2" fill="oklch(68% 0.02 70)"/>
      ${svgPlates}
    </svg>
    <div class="plate-total"><strong>${Number.isInteger(perSide) ? perSide : perSide.toFixed(1)} ${unit}</strong> per side · ${labels}</div>
  </div>`;
}

function calcVolume() {
  let v = 0;
  for (const sets of Object.values(ST.workoutSets)) {
    for (const s of sets) v += (s.w||0)*(s.r||0);
  }
  return Math.round(v);
}

function updateProgressBadge() {
  const badge = document.getElementById('wh-pct');
  const numEl = document.getElementById('wh-pct-num');
  if (!badge || !numEl || !ST.currentSession) return;
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  if (!prog) return;
  const sess = prog.sessions.find(s => s.id === ST.currentSession);
  if (!sess) return;
  const exList = sess.exercises || [];
  const total = exList.length;
  const done = exList.filter((_, i) => ST.completedCards.has(`${sess.id}_${i}`)).length;
  const remaining = total - done;
  numEl.textContent = remaining;
  badge.classList.toggle('complete', remaining === 0);
}


// ── Workout actions ───────────────────────────────────────────────────────────
function toggleCard(key) {
  const isExpanded = ST.expandedCards.has(key);
  // Collapse all other cards first (accordion)
  for (const k of [...ST.expandedCards]) {
    if (k !== key) {
      ST.expandedCards.delete(k);
      const c = document.getElementById('excard-' + k);
      if (c) c.classList.remove('expanded');
    }
  }
  // Toggle the tapped card
  if (isExpanded) {
    ST.expandedCards.delete(key);
  } else {
    ST.expandedCards.add(key);
  }
  const card = document.getElementById('excard-' + key);
  if (!card) return;
  const nowExpanded = ST.expandedCards.has(key);
  card.classList.toggle('expanded', nowExpanded);

  // Spotlight: dim all other non-completed cards
  document.querySelectorAll('.ex-card').forEach(c => {
    if (c.id !== 'excard-' + key) {
      c.classList.toggle('dimmed', nowExpanded && !c.classList.contains('completed'));
    }
  });

  // Auto-focus first unlogged weight input on expand
  if (nowExpanded) {
    setTimeout(() => {
      const inputs = card.querySelectorAll('.set-input:not(.logged)');
      for (const inp of inputs) {
        if (inp.id && inp.id.startsWith('wi-')) { inp.focus(); inp.select(); break; }
      }
    }, 320);
  }
}

function shimmerBtn(btn) {
  btn.classList.add('btn-shimmer');
  setTimeout(() => btn.classList.remove('btn-shimmer'), 220);
}

function setTravel(on) {
  ST.travelMode = on;
  applyAutoSubstitutions();
  saveNow();
  renderWorkout();
}

function showPlate(key, si) {
  ST.openPlate = key + '_' + si;
  const wi = document.getElementById('wi-' + key + '-' + si);
  const val = wi ? wi.value : 0;
  const row = document.getElementById('setrow-' + key + '-' + si);
  if (!row) return;
  let pop = row.nextElementSibling;
  if (pop && pop.classList.contains('plate-popover')) pop.remove();
  const html = renderPlatePopover(val);
  const div = document.createElement('div');
  div.innerHTML = html;
  row.insertAdjacentElement('afterend', div.firstElementChild);
}

function hidePlate(key, si) {
  setTimeout(() => {
    const row = document.getElementById('setrow-' + key + '-' + si);
    if (!row) return;
    const pop = row.nextElementSibling;
    if (pop && pop.classList.contains('plate-popover')) pop.remove();
  }, 200);
}

function logSet(key, si, exIdx) {
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (!sess) return;
  // Resolve from the key so additions (add_N) and subbed slots work uniformly
  const isAdd = typeof key === 'string' && key.indexOf('add_') === 0;
  const slot = slotForKey(key);
  if (!slot) return;
  const ex = slot.ex;
  const wi = document.getElementById('wi-' + key + '-' + si);
  const ri = document.getElementById('ri-' + key + '-' + si);
  if (!wi || !ri) return;
  const w = parseFloat(wi.value) || 0;
  const r = parseInt(ri.value) || 0;
  if (r === 0) { ri.focus(); return; }

  // Lock travel mode after first set
  const wasLocked = ST.travelLocked;
  ST.travelLocked = true;

  // Dismiss travel toggle from DOM on first ever set logged
  if (!wasLocked) {
    const tRow = document.querySelector('.travel-toggle-row');
    if (tRow) {
      tRow.classList.add('dismissing');
      tRow.style.maxHeight = tRow.offsetHeight + 'px'; // freeze before collapse
      requestAnimationFrame(() => { tRow.style.maxHeight = '0'; });
      setTimeout(() => { tRow.remove(); }, 260);
    }
    const hdr = document.getElementById('workout-header');
    if (hdr) hdr.classList.add('travel-locked');
  }

  if (!ST.workoutSets[key]) ST.workoutSets[key] = [];
  // _name stamped at write time — exercise identity is a stored fact, never a
  // derived guess. Travel-swap and substitution aware.
  ST.workoutSets[key][si] = { w, r, ts: Date.now(), _name: liveExName(key, ex) };

  // Draft for this set is now committed — clear it
  if (ST.workoutDrafts) delete ST.workoutDrafts[key + '-' + si];

  // Synchronous save — on disk before the ripple finishes
  saveNow();

  // Haptic
  haptic('set');
  playSound('set');

  // Update UI for this set row
  wi.classList.add('logged');
  ri.classList.add('logged');
  const btn = wi.closest('.set-row') && wi.closest('.set-row').querySelector('.set-log-btn');
  if (btn) { btn.classList.add('logged'); btn.innerHTML = checkSVG(); }

  // Ripple
  const row = document.getElementById('setrow-' + key + '-' + si);
  if (row) {
    const ripple = document.createElement('div');
    ripple.className = 'set-ripple';
    row.style.position = 'relative';
    row.appendChild(ripple);
    setTimeout(() => ripple.remove(), 400);
  }

  // Update progress badge
  updateProgressBadge();

  // Check if exercise complete
  const totalSets = effSetCount(key, ex);
  const loggedSets = ST.workoutSets[key] || [];
  const doneCount = loggedSets.filter(Boolean).length;

  if (doneCount >= totalSets) {
    // Auto-collapse with delay
    ST.completedCards.add(key);
    haptic('exercise');
    setTimeout(() => {
      ST.expandedCards.delete(key);
      const card = document.getElementById('excard-' + key);
      if (card) {
        card.classList.remove('expanded');
        card.classList.add('completed');
        const nameEl = card.querySelector('.ex-name');
        if (nameEl) nameEl.innerHTML = liveExName(key, ex) + ' <span class="ex-check">✓</span>';
      }
      // Update progress bar + badge — programmed segments only
      if (!isAdd) {
        const segs = document.querySelectorAll('.wh-seg');
        if (segs[exIdx]) segs[exIdx].classList.add('done');
      }
      updateProgressBadge();

      // Auto-advance to next programmed exercise (additions don't auto-advance)
      if (!isAdd) {
        const _prog = PROGRAMS.find(p => p.id === ST.currentProgram);
        const _sess = _prog && _prog.sessions.find(s => s.id === ST.currentSession);
        if (_sess) {
          const nextIdx = exIdx + 1;
          if (nextIdx < _sess.exercises.length) {
            const nextKey = `${_sess.id}_${nextIdx}`;
            if (!ST.completedCards.has(nextKey)) {
              setTimeout(() => {
                toggleCard(nextKey);
                const nextCard = document.getElementById('excard-' + nextKey);
                if (nextCard) nextCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
              }, 250);
            }
          }
        }
      }
    }, 300);
  }

  // Check overload nudge
  const reps = effReps(key, ex);
  const topRep = parseInt((reps.match(/(\d+)$/) || ['', '10'])[1]);
  if (doneCount >= totalSets && !isNaN(topRep) && loggedSets.every(s => s && s.r >= topRep)) {
    const body = document.querySelector('#excard-' + key + ' .ex-body-inner');
    if (body && !body.querySelector('.overload-nudge')) {
      const nudge = document.createElement('div');
      nudge.className = 'overload-nudge';
      nudge.textContent = '⬆ All sets hit ' + topRep + ' reps — increase weight next session!';
      body.prepend(nudge);
    }
  }

  // Rest timer
  const name = stripSuperset(ex.name);
  const restTimes = getRestTimes();
  const restSec = restTimes[normalizeEx(name)] || parseRestSeconds(ex.rest);
  const unit = getWeightUnit();
  if (restSec > 0) {
    // Build next-set info text
    let nextText = '', afterText = '';
    const isLastSet = si === totalSets - 1;
    if (isLastSet) {
      // Find next programmed exercise (additions have no programmed successor)
      const nextExIdx = exIdx + 1;
      if (!isAdd && nextExIdx < sess.exercises.length) {
        const nextEx = sess.exercises[nextExIdx];
        const nextName = liveExName(`${sess.id}_${nextExIdx}`, nextEx);
        const nextLast = getLastPerformance(nextName);
        const nextW = nextLast && nextLast[0] ? nextLast[0].w + ' ' + unit : '?';
        nextText = 'Exercise done ✓  Up next: ' + nextName + ' · ' + nextW;
      } else {
        nextText = 'Last exercise done ✓';
      }
    } else {
      const nextSi = si + 1;
      const preW = ST.workoutSets[key] && ST.workoutSets[key][si] ? ST.workoutSets[key][si].w : w;
      nextText = 'Next: Set ' + (nextSi + 1) + ' · ' + preW + ' ' + unit + ' × ' + r;
      if (si === totalSets - 2) {
        // Second to last — also show next programmed exercise
        const nextExIdx = exIdx + 1;
        if (!isAdd && nextExIdx < sess.exercises.length) {
          const nextEx = sess.exercises[nextExIdx];
          afterText = 'After: ' + stripSuperset(nextEx.name);
        }
      }
    }
    startRestTimer(restSec, name, nextText, afterText, isLastSet);
  }
}

// ── Warm-up set: log (saves to _wu key, no rest timer) ───────────────────────
function logWarmup(key) {
  const wuwi = document.getElementById('wuwi-' + key);
  const wuri = document.getElementById('wuri-' + key);
  if (!wuwi || !wuri) return;
  const w = parseFloat(wuwi.value) || 0;
  const r = parseInt(wuri.value) || 0;
  if (!r) { wuri.focus(); return; }
  const wuKey = key + '_wu';
  if (!ST.workoutSets[wuKey]) ST.workoutSets[wuKey] = [];
  // No _name on warm-ups — they must stay invisible to the prefill engine
  ST.workoutSets[wuKey][0] = { w, r, ts: Date.now() };
  if (ST.workoutDrafts) delete ST.workoutDrafts[key + '-wu'];
  saveNow();
  haptic('tick');
  // Visual confirmation — briefly tint the row
  const row = document.getElementById('wurow-' + key);
  if (row) {
    row.style.background = 'oklch(88% 0.06 145 / 0.25)';
    row.style.borderColor = 'oklch(72% 0.19 145 / 0.4)';
    setTimeout(() => { row.style.background = ''; row.style.borderColor = ''; }, 600);
  }
}

// ── Warm-up set: dismiss (in-memory, no localStorage) ────────────────────────
function dismissWarmup(e, key, exNameNorm) {
  e.stopPropagation();
  ST.dismissedWarmups.add(exNameNorm);
  delete ST.workoutSets[key + '_wu'];
  if (ST.workoutDrafts) delete ST.workoutDrafts[key + '-wu'];
  saveNow();
  const row = document.getElementById('wurow-' + key);
  if (row) { row.style.opacity = '0'; row.style.maxHeight = '0'; row.style.margin = '0'; row.style.padding = '0'; setTimeout(() => row.remove(), 260); }
}

function unlogSet(key, si, exIdx) {
  if (!ST.workoutSets[key]) return;
  ST.workoutSets[key][si] = null;
  saveNow();

  // Update UI
  const wi = document.getElementById('wi-' + key + '-' + si);
  const ri = document.getElementById('ri-' + key + '-' + si);
  const row = document.getElementById('setrow-' + key + '-' + si);
  const btn = row && row.querySelector('.set-log-btn');
  if (wi) wi.classList.remove('logged');
  if (ri) ri.classList.remove('logged');
  if (btn) {
    btn.classList.remove('logged');
    btn.textContent = '→';
    btn.onclick = () => logSet(key, si, exIdx);
  }

  // Un-complete the card if it was marked done; re-expand so user can see sets
  const isAdd = typeof key === 'string' && key.indexOf('add_') === 0;
  const slot = slotForKey(key);
  if (slot) {
    const ex = slot.ex;
    const totalSets = effSetCount(key, ex);
    const remaining = (ST.workoutSets[key] || []).filter(Boolean).length;
    if (remaining < totalSets) {
      ST.completedCards.delete(key);
      ST.expandedCards.add(key);
      const card = document.getElementById('excard-' + key);
      if (card) {
        card.classList.remove('completed');
        card.classList.add('expanded');
        const nameEl = card.querySelector('.ex-name');
        if (nameEl) nameEl.innerHTML = liveExName(key, ex);
      }
      if (!isAdd) {
        const segs = document.querySelectorAll('.wh-seg');
        if (segs[exIdx]) segs[exIdx].classList.remove('done');
      }
    }
  }
  updateProgressBadge();
}

function editRestTime(key, exIdx, el) {
  const slot = slotForKey(key);
  if (!slot) return;
  const ex = slot.ex;
  const name = slot.name;
  const restTimes = getRestTimes();
  const current = restTimes[normalizeEx(name)] || parseRestSeconds(ex.rest);

  // Replace the display with an inline seconds input
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'rest-time-input';
  input.value = current;
  input.min = 0;
  input.inputMode = 'numeric';
  el.replaceWith(input);
  input.focus();
  input.select();

  const commit = () => {
    const secs = parseInt(input.value);
    if (!isNaN(secs) && secs >= 0) {
      restTimes[normalizeEx(name)] = secs;
      saveRestTimes(restTimes);
    }
    const display = document.createElement('span');
    display.className = 'rest-time-display';
    display.id = 'rest-lbl-' + key;
    display.title = 'Tap to edit';
    display.textContent = formatDuration(isNaN(secs) || secs < 0 ? current : secs);
    display.onclick = () => editRestTime(key, exIdx, display);
    input.replaceWith(display);
  };

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } if (e.key === 'Escape') { input.value = current; input.blur(); } });
}

function saveNote(nameKey, text) {
  const notes = getNotes();
  notes[nameKey] = text.trim();
  saveNotes(notes);
}

// ── Inline session-scoped note panel ─────────────────────────────────────────
function toggleNotePanel(e, key, nameKey) {
  e.stopPropagation();
  const panel = document.getElementById('notepanel-' + key);
  const btn   = document.getElementById('notebtn-'   + key);
  if (!panel) return;
  const opening = !panel.classList.contains('open');
  panel.classList.toggle('open', opening);
  if (opening) {
    // Focus the textarea after CSS transition completes
    setTimeout(() => {
      const ta = document.getElementById('noteinput-' + key);
      if (ta) ta.focus();
    }, 290);
  }
}

function saveSessionNote(key, nameKey, text) {
  // Session-scoped: stored in ST.workoutNotes[key]
  ST.workoutNotes[key] = text;
  // Also persist to global per-exercise notes for pre-fill across sessions
  const notes = getNotes();
  notes[nameKey] = text.trim();
  saveNotes(notes);
  autoSave(); // notes ride the live snapshot too — survive any reload
  // Update icon state
  const btn = document.getElementById('notebtn-' + key);
  if (btn) btn.classList.toggle('has-note', text.trim().length > 0);
}

function showCue(e, key, exIdx) {
  e.stopPropagation();
  // Resolve the EFFECTIVE exercise — a subbed slot shows the sub's cues, an
  // addition shows its own; falls back gracefully when no cues exist.
  const slot = slotForKey(key);
  if (!slot) return;
  const ex = slot.ex;
  const name = liveExName(key, ex);
  const cue = FORM_CUES[normalizeEx(name)];
  const content = cue ? `
    <div class="cue-section"><h4>Setup</h4><p>${cue.setup}</p></div>
    <div class="cue-section"><h4>Execution</h4><p>${cue.execution}</p></div>
    <div class="cue-section"><h4>Common Mistakes</h4><p>${cue.mistakes}</p></div>
    <div class="cue-tip">💡 DCR Tip: ${cue.tip}</div>
  ` : `<p style="color:var(--muted);font-style:italic">No specific cues yet — focus on controlled reps and good form.</p>`;
  openSheet(`<div class="bs-title">${name}</div>${content}`);
}

// ── Exercise picker sheet — substitution (Decisions 1,2,3) & additions (4,5,6,7).
//    One bottom sheet, one mental model: Nippard picks (subs only) on top,
//    full searchable library below; choosing opens a custom set/rep picker.
function setSheetBody(html) {
  const el = document.getElementById('sheet-content');
  if (el) el.innerHTML = html;
  ST.openSubCard = null;
}

function blacklistExercisePrompt(e, key) {
  if (e && e.stopPropagation) e.stopPropagation();
  const slot = slotForKey(key);
  if (!slot) return;
  
  const displayName = liveExName(key, slot.ex);
  confirmSheet({
    title: 'Never show this exercise?',
    body: `Are you sure you want to blacklist <strong>${displayName}</strong>? It will not be shown again, and the app will automatically substitute it in the future.`,
    confirmLabel: 'Blacklist exercise',
    cancelLabel: 'Keep it',
    destructive: true,
    onConfirm: () => {
      ST.blacklistedExercises.add(normalizeEx(displayName));
      LS.set('dcrgym_blacklist', [...ST.blacklistedExercises]);
      applyAutoSubstitutions();
      saveNow();
      renderWorkout();
    }
  });
}

function showSubs(e, key, exIdx) {
  if (e && e.stopPropagation) e.stopPropagation();
  const slot = slotForKey(key);
  if (!slot || slot.isAddition) return;
  const rawName = stripSuperset(slot.ex.name);
  ST._lib = { mode: 'sub', key: key, exIdx: exIdx, name: rawName, muscle: getMuscle(rawName) };
  openSheet(subsSheetHTML());
}

function subsSheetHTML() {
  const ctx = ST._lib || {};
  const slot = slotForKey(ctx.key);
  const ex = slot ? slot.ex : null;
  const name = ctx.name || '';
  const exInfo = getExerciseInfo(name);
  const subMuscle = exInfo.subMuscle || getMuscle(name);
  const activeSub = ST.workoutSubs && ST.workoutSubs[ctx.key];

  // 1. Exact Target Muscle Substitutes (matching exact subMuscle biomechanics)
  const exactSubs = getExactSubstitutes(name);
  const exactHtml = exactSubs.length
    ? exactSubs.slice(0, 8).map(it => libCard(it.name, it.muscle, it.tag, it.subMuscle)).join('')
    : '';

  // 2. Program Recommended Substitutes (if programmed)
  const nippardSubs = ((ex && ex.substitutions) || []).filter(s => s && s.trim());
  const nippardHtml = nippardSubs.map(s => {
    const sInfo = getExerciseInfo(s);
    return libCard(s, sInfo.muscle, 'Program', sInfo.subMuscle);
  }).join('');

  return `
    <div class="bs-title">Swap ${name}</div>
    <div class="bs-sub" style="margin-bottom:12px;font-size:12px;color:var(--muted)">Target: <strong style="color:var(--charcoal)">${subMuscle}</strong> · ${exInfo.muscle}</div>
    ${activeSub ? `<button class="btn btn-sheet-secondary" style="margin-bottom:14px" onclick="revertSubstitution('${ctx.key}')">↩ Back to ${name}</button>` : ''}
    ${nippardSubs.length ? `
      <div class="bs-section-lbl">Program Recommended</div>
      <div class="lib-section" style="margin-bottom:14px">${nippardHtml}</div>` : ''}
    ${exactSubs.length ? `
      <div class="bs-section-lbl">Exact Muscle Substitutes (${subMuscle})</div>
      <div class="lib-section" style="margin-bottom:14px">${exactHtml}</div>` : ''}
    <div class="bs-section-lbl">All Exercises (${EXERCISE_LIBRARY.length})</div>
    <input class="bs-search" id="lib-search" type="text" placeholder="Search by name, muscle, equipment…" autocomplete="off" oninput="filterLib(this.value)">
    <div id="lib-list">${libListHTML('')}</div>
  `;
}

function showAddSheet() {
  ST._lib = { mode: 'add' };
  openSheet(addSheetHTML());
}

function addSheetHTML() {
  return `
    <div class="bs-title">Add Exercise</div>
    <div class="bs-sub">Accessory work — logs after your programmed exercises and counts toward weekly volume.</div>
    <div class="bs-section-lbl">All Exercises (${EXERCISE_LIBRARY.length})</div>
    <input class="bs-search" id="lib-search" type="text" placeholder="Search by name, muscle, equipment…" autocomplete="off" oninput="filterLib(this.value)">
    <div id="lib-list">${libListHTML('')}</div>
  `;
}

function libListHTML(filter) {
  const f = normalizeEx(filter || '');
  let items = EXERCISE_LIBRARY;
  if (f) {
    items = items.filter(it =>
      normalizeEx(it.name).indexOf(f) !== -1 ||
      normalizeEx(it.muscle).indexOf(f) !== -1 ||
      (it.subMuscle && normalizeEx(it.subMuscle).indexOf(f) !== -1) ||
      (it.tag && normalizeEx(it.tag).indexOf(f) !== -1)
    );
  }
  if (items.length === 0) return `<div class="lib-empty">No exercises match "${filter}".</div>`;
  if (f) return items.map(it => libCard(it.name, it.muscle, it.tag, it.subMuscle)).join('');

  // Browsing (no filter) → grouped by major muscle
  const order = ['Chest','Back','Shoulders','Biceps','Triceps','Quads','Hamstrings','Glutes','Calves','Core','Traps','Forearms','Adductors'];
  const byMuscle = {};
  for (const it of items) { (byMuscle[it.muscle] = byMuscle[it.muscle] || []).push(it); }
  const muscles = Object.keys(byMuscle).sort((a,b) => {
    const ia = order.indexOf(a), ib = order.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  return muscles.map(m => `<div class="lib-muscle-lbl">${m} (${byMuscle[m].length})</div>` + byMuscle[m].map(it => libCard(it.name, it.muscle, it.tag, it.subMuscle)).join('')).join('');
}

function libCard(name, muscle, tag, subMuscle = null) {
  const unit = getWeightUnit();
  const last = getLastPerformance(name);
  const lastText = last && last[0] ? `${last[0].w} ${unit} × ${last[0].r} last time` : 'No history yet';
  const id = name.replace(/[^a-zA-Z0-9]/g, '_');
  const badgeSub = subMuscle || getSubMuscle(name);
  return `
  <div class="sub-card" id="subcard-${id}">
    <div class="sub-card-header" onclick="toggleSubCard('${id}')">
      <span class="sub-card-name">${name}</span>
      <div style="display:flex;gap:4px;align-items:center">
        ${badgeSub ? `<span class="sub-card-tag" style="background:rgba(42,36,33,0.06);color:var(--text-secondary);font-size:9.5px">${badgeSub}</span>` : ''}
        <span class="sub-card-tag">${muscle}</span>
      </div>
    </div>
    <div class="sub-card-body">
      <div class="sub-card-detail">${lastText}</div>
      <button class="sub-use-btn" onclick="chooseExercise('${name.replace(/'/g, "\\'")}')">Use This Exercise</button>
    </div>
  </div>`;
}

function filterLib(val) {
  const list = document.getElementById('lib-list');
  if (list) list.innerHTML = libListHTML(val);
  ST.openSubCard = null;
}

function toggleSubCard(id) {
  const card = document.getElementById('subcard-' + id);
  if (!card) return;
  if (ST.openSubCard && ST.openSubCard !== id) {
    const prev = document.getElementById('subcard-' + ST.openSubCard);
    if (prev) prev.classList.remove('open');
  }
  card.classList.toggle('open');
  ST.openSubCard = card.classList.contains('open') ? id : null;
}

// Step 2 — pick a custom set/rep count before committing (Decision 2)
function chooseExercise(name) {
  ST._lib = ST._lib || {};
  const ctx = ST._lib;
  let defSets = 3, defReps = 10;
  if (ctx.mode === 'sub' && ctx.key) {
    const slot = slotForKey(ctx.key);
    if (slot) {
      defSets = slot.ex.workingSets || 3;
      const m = String(slot.ex.reps || '10').match(/(\d+)\s*$/);
      defReps = m ? parseInt(m[1]) : 10;
    }
  }
  ST._pick = { name: name, sets: defSets, reps: defReps };
  setSheetBody(pickerHTML());
}

function pickerHTML() {
  const p = ST._pick || { name: '', sets: 3, reps: 10 };
  const ctx = ST._lib || {};
  const isSub = ctx.mode === 'sub';
  const title = isSub ? `Swap → ${p.name}` : `Add ${p.name}`;
  const confirmLbl = isSub ? 'Use this exercise' : 'Add to workout';
  return `
    <div class="bs-title">${title}</div>
    <div class="bs-sub">Set your own volume — substitutes &amp; additions aren't locked to the programmed structure.</div>
    <div class="srp">
      <div class="srp-row">
        <span class="srp-lbl">Sets</span>
        <div class="srp-stepper">
          <button class="srp-btn" onclick="pickAdjust('sets',-1)">−</button>
          <span class="srp-val" id="srp-sets">${p.sets}</span>
          <button class="srp-btn srp-up" onclick="pickAdjust('sets',1)">+</button>
        </div>
      </div>
      <div class="srp-row">
        <span class="srp-lbl">Reps <span class="srp-hint">target</span></span>
        <div class="srp-stepper">
          <button class="srp-btn" onclick="pickAdjust('reps',-1)">−</button>
          <span class="srp-val" id="srp-reps">${p.reps}</span>
          <button class="srp-btn srp-up" onclick="pickAdjust('reps',1)">+</button>
        </div>
      </div>
    </div>
    <div class="srp-preview" id="srp-preview">${p.sets} × ${p.reps}</div>
    <button class="btn btn-primary" style="margin-top:6px" onclick="confirmPick()">${confirmLbl}</button>
    <button class="btn btn-sheet-ghost" onclick="backToLib()">← Back to list</button>
  `;
}

function pickAdjust(field, delta) {
  const p = ST._pick;
  if (!p) return;
  if (field === 'sets') p.sets = Math.max(1, Math.min(10, p.sets + delta));
  else p.reps = Math.max(1, Math.min(50, p.reps + delta));
  const se = document.getElementById('srp-sets'); if (se) se.textContent = p.sets;
  const re = document.getElementById('srp-reps'); if (re) re.textContent = p.reps;
  const pv = document.getElementById('srp-preview'); if (pv) pv.textContent = p.sets + ' × ' + p.reps;
  haptic('tick');
}

function backToLib() {
  const ctx = ST._lib || {};
  setSheetBody(ctx.mode === 'add' ? addSheetHTML() : subsSheetHTML());
}

function confirmPick() {
  const p = ST._pick, ctx = ST._lib || {};
  if (!p) return;
  if (ctx.mode === 'sub') applySubstitution(ctx.key, ctx.exIdx, p.name, p.sets, String(p.reps));
  else applyAddition(p.name, p.sets, String(p.reps));
}

function applySubstitution(key, exIdx, subName, sets, reps) {
  const slot = slotForKey(key);
  if (!ST.workoutSubs) ST.workoutSubs = {};
  if (!ST.workoutSubMeta) ST.workoutSubMeta = {};
  ST.workoutSubs[key] = subName;
  ST.workoutSubMeta[key] = { sets: sets, reps: String(reps) };
  // Different movement now — drop any sets/drafts logged under the prior identity
  delete ST.workoutSets[key];
  delete ST.workoutSets[key + '_wu'];
  if (ST.workoutDrafts) { for (const k of Object.keys(ST.workoutDrafts)) { if (k.indexOf(key + '-') === 0) delete ST.workoutDrafts[k]; } }
  ST.completedCards.delete(key);
  ST.expandedCards.add(key);
  if (slot) { const notes = getNotes(); notes[normalizeEx(slot.name)] = 'Using: ' + subName; saveNotes(notes); }
  saveNow();
  closeSheet();
  renderWorkout();
}

function applyAddition(name, sets, reps) {
  if (!ST.workoutAdditions) ST.workoutAdditions = [];
  const id = ST.workoutAdditions.reduce((m, a) => Math.max(m, a.id), -1) + 1;
  ST.workoutAdditions.push({ id: id, name: name, muscle: getMuscle(name), sets: sets, reps: String(reps), rest: '2–3 min' });
  saveNow();
  closeSheet();
  renderWorkout();
  setTimeout(() => {
    const k = 'add_' + id;
    if (!ST.expandedCards.has(k)) toggleCard(k);
    const c = document.getElementById('excard-' + k);
    if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 80);
}

function removeAddition(e, id) {
  if (e && e.stopPropagation) e.stopPropagation();
  const idx = (ST.workoutAdditions || []).findIndex(a => a && a.id === id);
  if (idx < 0) return;
  const key = 'add_' + id;
  ST.workoutAdditions.splice(idx, 1);
  delete ST.workoutSets[key];
  delete ST.workoutSets[key + '_wu'];
  if (ST.workoutDrafts) { for (const k of Object.keys(ST.workoutDrafts)) { if (k.indexOf(key + '-') === 0) delete ST.workoutDrafts[k]; } }
  if (ST.workoutNotes) delete ST.workoutNotes[key];
  ST.completedCards.delete(key);
  ST.expandedCards.delete(key);
  saveNow();
  renderWorkout();
}

function revertSubstitution(key) {
  if (ST.workoutSubs) delete ST.workoutSubs[key];
  if (ST.workoutSubMeta) delete ST.workoutSubMeta[key];
  delete ST.workoutSets[key];
  delete ST.workoutSets[key + '_wu'];
  if (ST.workoutDrafts) { for (const k of Object.keys(ST.workoutDrafts)) { if (k.indexOf(key + '-') === 0) delete ST.workoutDrafts[k]; } }
  ST.completedCards.delete(key);
  saveNow();
  closeSheet();
  renderWorkout();
}

function openSheet(html) {
  document.getElementById('sheet-content').innerHTML = html;
  document.getElementById('sheet-overlay').classList.add('visible');
  document.getElementById('bottom-sheet').classList.add('visible');
  document.body.style.overflow = 'hidden';
  // Back gesture closes the sheet, not the app
  try { history.pushState({ screen: ST.screen, overlay: 'sheet' }, '', '#sheet'); } catch(e) {}
}

function closeSheet() {
  // If our overlay state is on the stack, unwind via back so history stays clean
  if (history.state && history.state.overlay === 'sheet') {
    try { history.back(); return; } catch(e) {}
  }
  __closeSheetDom();
}

function __closeSheetDom() {
  document.getElementById('sheet-overlay').classList.remove('visible');
  document.getElementById('bottom-sheet').classList.remove('visible');
  document.body.style.overflow = '';
  ST.openSubCard = null;
}

// ── Sheet drag-to-dismiss — iOS physics: follow the finger, rubber-band up,
//    release past threshold dismisses, otherwise springs home. ──────────────
(function initSheetDrag() {
  const sheet = document.getElementById('bottom-sheet');
  if (!sheet) return;
  let startY = 0, curY = 0, dragging = false;
  sheet.addEventListener('touchstart', (e) => {
    const content = document.getElementById('sheet-content');
    // Drag starts from the handle zone, or anywhere once content is at scroll top
    if (content && content.scrollTop > 2 && !e.target.closest('.bs-handle')) return;
    if (e.target.closest('input, textarea, button')) return;
    dragging = true; startY = curY = e.touches[0].clientY;
    sheet.style.transition = 'none';
  }, { passive: true });
  sheet.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    curY = e.touches[0].clientY;
    let dy = curY - startY;
    if (dy < 0) dy = -Math.pow(-dy, 0.72);   // rubber-band resistance upward
    sheet.style.transform = `translateY(${Math.max(dy, -26)}px)`;
  }, { passive: true });
  const release = () => {
    if (!dragging) return;
    dragging = false;
    const dy = curY - startY;
    sheet.style.transition = '';
    sheet.style.transform = '';
    if (dy > 88) { haptic('tick'); closeSheet(); }
  };
  sheet.addEventListener('touchend', release);
  sheet.addEventListener('touchcancel', release);
})();

// ── Workout flow ──────────────────────────────────────────────────────────────
// Three-way guard. The old code silently clobbered an in-progress workout when
// you tapped the SAME session card — total loss of logged sets. Never again:
//  · no unfinished workout            → start fresh
//  · unfinished, same session         → Resume / Restart sheet (no silent reset)
//  · unfinished, different session    → themed confirm; archives sets first
function startWorkoutFromHome(progId, sessId) {
  const existing = LS.get('dcrgym_current_workout');
  const hasLogged = existing && existing.sets &&
    Object.values(existing.sets).some(arr => Array.isArray(arr) && arr.some(s => s && s.r > 0));
  const isPast = existing && (existing.editingWorkoutId || existing.isBackdated);

  if (existing && isPast) {
    confirmSheet({
      title: 'Unfinished session',
      body: existing.editingWorkoutId
        ? 'You have an unfinished edit session. Starting a new workout will discard your edits.'
        : 'You have an unfinished backdated workout draft. Starting a new workout will discard this draft.',
      confirmLabel: 'Start new workout',
      cancelLabel: 'Keep current',
      onConfirm: () => {
        LS.remove('dcrgym_current_workout');
        beginWorkout(progId, sessId);
      }
    });
    return;
  }

  if (existing && existing.programId === progId && existing.sessionId === sessId && hasLogged) {
    confirmSheet({
      title: 'Workout in progress',
      body: `You have an unfinished <strong>${existing.sessionName || 'session'}</strong> with logged sets. Pick up where you left off?`,
      confirmLabel: 'Resume workout',
      secondaryLabel: 'Restart from zero',
      cancelLabel: 'Not now',
      onConfirm: () => resumeWorkout(),
      onSecondary: () => {
        archiveWorkoutToHistory(existing);
        LS.remove('dcrgym_current_workout');
        beginWorkout(progId, sessId);
      },
    });
    return;
  }

  if (existing && (existing.programId !== progId || existing.sessionId !== sessId) && hasLogged) {
    confirmSheet({
      title: 'Unfinished workout',
      body: `Your logged sets from <strong>${existing.sessionName || 'the previous session'}</strong> will be saved to history before starting fresh.`,
      confirmLabel: 'Start new workout',
      cancelLabel: 'Keep current',
      onConfirm: () => {
        archiveWorkoutToHistory(existing);
        LS.remove('dcrgym_current_workout');
        beginWorkout(progId, sessId);
      },
    });
    return;
  }

  if (existing) LS.remove('dcrgym_current_workout'); // empty shell — nothing to lose
  beginWorkout(progId, sessId);
}

function beginWorkout(progId, sessId) {
  ST.workoutCommitted = false; // fresh live workout — re-enable snapshot autosave
  ST.currentProgram = progId;
  ST.currentSession = sessId;
  ST.travelMode = false;
  ST.travelLocked = false;
  ST.workoutSets   = {};
  ST.workoutNotes  = {};   // reset session-scoped notes for fresh workout
  ST.workoutDrafts = {};
  ST.workoutSubs   = {};
  ST.workoutSubMeta = {};
  ST.workoutAutoSubs = {};
  ST.workoutAutoSubMeta = {};
  ST.workoutAdditions = [];
  ST.expandedCards = new Set();
  ST.completedCards = new Set();
  ST.durationSecs = 0;
  ST.workoutStart = Date.now();
  if (ST.durationTimer) clearInterval(ST.durationTimer);
  ST.durationTimer = setInterval(() => {
    ST.durationSecs = Math.floor((Date.now() - ST.workoutStart) / 1000);
    const el = document.getElementById('wh-dur');
    if (el) el.textContent = formatDuration(ST.durationSecs);
    const pd = document.getElementById('pill-dur');
    if (pd) pd.textContent = formatDuration(ST.durationSecs);
  }, 1000);
  // Wake lock
  if (navigator.wakeLock) {
    navigator.wakeLock.request('screen').then(wl => { ST.wakeLock = wl; }).catch(() => {});
  }
  applyAutoSubstitutions();
  saveNow();
  Maps('workout');
}

function resumeWorkout() {
  const saved = LS.get('dcrgym_current_workout');
  if (!saved) return;
  ST.workoutCommitted = false; // resuming a live workout — re-enable snapshot autosave
  ST.currentProgram = saved.programId;
  ST.currentSession = saved.sessionId;
  ST.workoutSets = saved.sets || {};
  ST.workoutDrafts = saved.drafts || {};   // typed-but-unlogged values come back
  ST.workoutSubs   = saved.subs   || {};   // session substitutions come back
  ST.workoutSubMeta = saved.subMeta || {}; // custom set/rep on substituted slots come back
  ST.workoutAutoSubs = saved.autoSubs || {};
  ST.workoutAutoSubMeta = saved.autoSubMeta || {};
  ST.workoutAdditions = saved.additions || []; // accessory additions come back
  ST.workoutNotes  = saved.notes  || {};   // session notes come back
  ST.travelMode = saved.travelMode || false;
  ST.travelLocked = saved.travelLocked || false;
  applyAutoSubstitutions();
  
  ST.editingWorkoutId = saved.editingWorkoutId || null;
  ST.isBackdated = saved.isBackdated || false;
  ST.workoutEnd = saved.workoutEnd || null;
  ST.durationSecs = saved.durationSecs || 0;
  
  if (ST.editingWorkoutId || ST.isBackdated) {
    ST.workoutStart = saved.startTime || Date.now();
    if (ST.durationTimer) clearInterval(ST.durationTimer);
    ST.durationTimer = null;
  } else {
    ST.workoutStart = Date.now() - (saved.durationSecs || 0) * 1000;
    if (ST.durationTimer) clearInterval(ST.durationTimer);
    ST.durationTimer = setInterval(() => {
      ST.durationSecs = Math.floor((Date.now() - ST.workoutStart) / 1000);
      const el = document.getElementById('wh-dur');
      if (el) el.textContent = formatDuration(ST.durationSecs);
      const pd = document.getElementById('pill-dur');
      if (pd) pd.textContent = formatDuration(ST.durationSecs);
    }, 1000);
  }
  
  ST.expandedCards = new Set(saved.expandedCards || []);
  ST.completedCards = new Set(saved.completedCards || []);
  
  if (!ST.editingWorkoutId && !ST.isBackdated && navigator.wakeLock) {
    navigator.wakeLock.request('screen').then(wl => ST.wakeLock = wl).catch(()=>{});
  }
  
  // Restore rest timer — island reappears with correct ring progress
  const savedEnd = LS.get('dcrgym_rest_end');
  if (savedEnd && savedEnd > Date.now()) {
    ST.restActive = true;
    ST.restExpired = false;
    ST.restEndTime = savedEnd;
    ST.restDuration = LS.get('dcrgym_rest_dur', 0) || 0;
    ST.restNextText = LS.get('dcrgym_rest_next') || '';
    document.body.classList.add('rest-active');
    if (ST.restTicker) clearInterval(ST.restTicker);
    ST.restTicker = setInterval(tickRest, 250);
    renderRestIsland();
  }
  Maps('workout');
}

function discardWorkout() {
  const saved = LS.get('dcrgym_current_workout');
  if (!saved) return;
  const isPast = saved.editingWorkoutId || saved.isBackdated;
  const hasLogged = saved.sets &&
    Object.values(saved.sets).some(arr => Array.isArray(arr) && arr.some(s => s && s.r > 0));
  
  if (isPast) {
    confirmSheet({
      title: saved.editingWorkoutId ? 'Discard edits?' : 'Discard draft?',
      body: saved.editingWorkoutId 
        ? 'Any changes you made will be discarded. The original workout remains untouched.'
        : 'This backdated workout draft will be permanently deleted.',
      confirmLabel: 'Discard',
      destructive: true,
      onConfirm: () => {
        LS.remove('dcrgym_current_workout');
        renderHome();
      }
    });
    return;
  }
  
  if (!hasLogged) {
    LS.remove('dcrgym_current_workout');
    renderHome();
    return;
  }
  confirmSheet({
    title: 'Discard workout?',
    body: 'Your logged sets will be archived to history first — nothing is thrown away.',
    confirmLabel: 'Discard',
    destructive: true,
    onConfirm: () => {
      archiveWorkoutToHistory(saved);
      LS.remove('dcrgym_current_workout');
      renderHome();
    },
  });
}

let _saveTimeout = null;
function autoSave() {
  // Debounced variant — high-frequency callers only. Checkmarks use saveNow().
  clearTimeout(_saveTimeout);
  _saveTimeout = setTimeout(saveNow, 400);
}

function abandonPrompt() {
  // Leave workout without discarding — timer keeps running, pill appears
  saveNow();
  Maps('home');
}

function cancelWorkout() {
  const hasLogged = Object.values(ST.workoutSets || {})
    .some(arr => Array.isArray(arr) && arr.some(s => s && s.r > 0));
  const isPast = ST.editingWorkoutId || ST.isBackdated;
  
  confirmSheet({
    title: isPast ? 'Discard changes?' : 'Cancel this workout?',
    body: isPast
      ? (ST.editingWorkoutId ? 'Any changes you made will be discarded. The original workout remains untouched.' : 'This backdated workout draft will be permanently deleted.')
      : (hasLogged ? 'Your logged sets will be archived to history first — nothing is thrown away.' : 'Nothing logged yet — the session will simply close.'),
    confirmLabel: isPast ? 'Discard' : 'Cancel workout',
    cancelLabel: isPast ? 'Keep editing' : 'Keep training',
    destructive: true,
    onConfirm: () => {
      if (hasLogged && !isPast) archiveWorkoutToHistory(buildWorkoutPayload());
      if (ST.durationTimer) clearInterval(ST.durationTimer);
      ST.durationTimer = null;
      if (ST.wakeLock) ST.wakeLock.release().catch(()=>{});
      cancelRestTimer();
      LS.remove('dcrgym_current_workout');
      ST.currentProgram = null; ST.currentSession = null;
      ST.editingWorkoutId = null; ST.isBackdated = false; ST.workoutEnd = null;
      ST.workoutSets = {}; ST.workoutStart = null; ST.durationSecs = 0;
      ST.workoutDrafts = {}; ST.workoutSubs = {}; ST.workoutNotes = {};
      ST.workoutSubMeta = {}; ST.workoutAdditions = [];
      ST.expandedCards = new Set(); ST.completedCards = new Set();
      ST.travelMode = false; ST.travelLocked = false;
      Maps(isPast ? 'history' : 'home');
    },
  });
}

// ── Post-workout insight engine ───────────────────────────────────────────────
function generateInsightCard(entry, duration) {
  const fb      = ST.fitbit;
  const sleep   = fb.sleepScore;
  const hrv     = fb.hrv;
  const rhr     = fb.restingHR;
  const readiness = fb.readinessScore;

  // ── Card 1: Readiness Synthesis ───────────────────────────────────────────
  let synthesisTag  = 'readiness synthesis';
  let synthesisBody = '';

  if (readiness >= 85) {
    synthesisBody = `Programmed training parameters sustained completely against a commanding <strong>${readiness}%</strong> systemic readiness pool. Central nervous system recovery efficiency remains exceptional. Conditions favor progressive overload on your next neuro-load block.`;
  } else if (readiness >= 75) {
    synthesisBody = `Volume profile executed within a steady <strong>${readiness}%</strong> readiness baseline. Autonomic reserve is intact — standard 48-hour structural recovery window applies before your next primary compound session.`;
  } else {
    synthesisBody = `Training load held consistent against a tightened <strong>${readiness}%</strong> readiness floor. Prioritize immediately accessible parasympathetic protocols — thermal down-regulation, mineral timing, and extended sleep architecture tonight — to fast-track baseline restoration.`;
    synthesisTag = 'autonomic strategy';
  }

  // ── Card 2: Tactical Recovery (existing sleep/HRV/RHR logic) ─────────────
  let tacticalTag  = 'tactical optimization';
  let tacticalBody = '';

  if (sleep !== null && sleep < 70) {
    tacticalBody = `Performance thresholds held constant relative to a restricted <strong>${sleep}%</strong> sleep efficiency window. Prioritize immediate parasympathetic down-regulation protocols — contrasted hydrotherapy or targeted 4-7-8 breathing windows — to protect baseline autonomic tone before the next session.`;
    tacticalTag  = 'recovery alert';
  } else if (hrv !== null && hrv < 45) {
    tacticalBody = `HRV reading of <strong>${hrv}ms</strong> indicates elevated autonomic stress post-session. Extend your passive recovery window by 24–36 hours before your next neuro-load block. Prioritize hydration and whole-food carbohydrate replenishment.`;
    tacticalTag  = 'hrv advisory';
  } else if (rhr !== null && rhr > 68) {
    tacticalBody = `Resting heart rate at <strong>${rhr}bpm</strong> — slightly elevated baseline suggests residual systemic fatigue. Monitor sleep architecture tonight; if pattern persists across two sessions, consider a deload micro-cycle.`;
    tacticalTag  = 'cardiovascular note';
  } else if (sleep !== null && sleep >= 85 && hrv !== null && hrv >= 55) {
    tacticalBody = `Optimal recovery architecture confirmed — <strong>${sleep}%</strong> sleep efficiency, <strong>${hrv}ms</strong> HRV. Autonomic tone is high. Physiological conditions favor a progressive overload push in your next session.`;
    tacticalTag  = 'readiness window';
  } else {
    tacticalBody = `Session logged. Sleep efficiency <strong>${sleep !== null ? sleep + '%' : '—'}</strong>, HRV <strong>${hrv !== null ? hrv + 'ms' : '—'}</strong>. Standard recovery protocols apply — prioritize 7–9 hours sleep and adequate protein synthesis window post-session.`;
    tacticalTag  = 'session complete';
  }

  const card = {
    id: entry.id,
    sessionId: entry.sessionId,
    sessionName: entry.sessionName,
    duration,
    ts: Date.now(),
    synthesisTag,
    synthesisBody,
    tacticalTag,
    tacticalBody,
  };

  LS.set('dcrgym_last_insight', card);
}

function getLastInsightCard() {
  return LS.get('dcrgym_last_insight', null);
}

function renderInsightCardHTML(card) {
  if (!card) return '';
  const timeAgo = (() => {
    const diff = Date.now() - (card.ts || 0);
    const h = Math.floor(diff / 3600000);
    const d = Math.floor(diff / 86400000);
    if (d > 0) return `${d}d ago`;
    if (h > 0) return `${h}h ago`;
    return 'just now';
  })();
  const meta = `${card.sessionName ? card.sessionName.toLowerCase() + ' · ' : ''}${formatDuration(card.duration)} · ${timeAgo}`;

  // Card 1 — Readiness Synthesis (new format) or legacy fallback
  const card1 = card.synthesisBody ? `
  <div class="insight-card" style="margin-bottom:8px">
    <div class="insight-card-eyebrow">${card.synthesisTag || 'readiness synthesis'}</div>
    <div class="insight-card-body">${card.synthesisBody}</div>
    <div class="insight-card-meta">${meta}</div>
  </div>` : `
  <div class="insight-card" style="margin-bottom:8px">
    <div class="insight-card-eyebrow">${card.tag || 'session complete'}</div>
    <div class="insight-card-body">${card.directive || ''}</div>
    <div class="insight-card-meta">${meta}</div>
  </div>`;

  // Card 2 — Tactical Recovery
  const card2 = card.tacticalBody ? `
  <div class="insight-card">
    <div class="insight-card-eyebrow">${card.tacticalTag || 'tactical optimization'}</div>
    <div class="insight-card-body">${card.tacticalBody}</div>
  </div>` : '';

  return card1 + card2;
}

function finishWorkout() {
  // Guard: warn if exercises incomplete — themed sheet, not a system dialog
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (sess) {
    const total = sess.exercises.length;
    const done = sess.exercises.filter((_, i) => ST.completedCards.has(`${sess.id}_${i}`)).length;
    if (done < total) {
      confirmSheet({
        title: 'Finish early?',
        body: `You've completed <strong>${done} of ${total}</strong> exercises. Everything logged so far will be saved.`,
        confirmLabel: 'Finish workout',
        cancelLabel: 'Keep training',
        onConfirm: () => commitWorkout(),
      });
      return;
    }
  }
  commitWorkout();
}

function commitWorkout() {
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (ST.durationTimer) clearInterval(ST.durationTimer);
  if (ST.wakeLock) ST.wakeLock.release().catch(()=>{});
  cancelRestTimer();
  const duration = ST.durationSecs;

  // Save to history
  const hist = getHistory();
  // Previous same session for comparison (prog/sess already declared above)
  const prevSame = hist.filter(w => w.sessionId === ST.currentSession).slice(-1)[0];
  const prevDur = prevSame ? prevSame.duration : null;

  // Biggest gain
  let biggestGain = null;
  if (prevSame && prevSame.sets) {
    let maxGain = 0;
    for (const [key, sets] of Object.entries(ST.workoutSets)) {
      const exIdx = parseInt(key.split('_').pop());
      const ex = sess && sess.exercises[exIdx];
      if (!ex) continue;
      const prevSets = prevSame.sets[key] || [];
      const curMax = sets.reduce((m,s)=>Math.max(m,s.w||0),0);
      const prevMax = prevSets.reduce((m,s)=>Math.max(m,s.w||0),0);
      const gainName = (sets.find(s => s && s._name) || {})._name || stripSuperset(ex.name);
      // Only a real gain if there was a prior load to beat — skips first-time
      // additions/exercises that would otherwise read as a spurious "+Xkg".
      if (prevMax > 0 && curMax - prevMax > maxGain) { maxGain = curMax - prevMax; biggestGain = { name: gainName, gain: maxGain }; }
    }
  }

  let entry;
  if (ST.editingWorkoutId) {
    const idx = hist.findIndex(w => String(w.id) === String(ST.editingWorkoutId));
    if (idx !== -1) {
      const original = hist[idx];
      entry = {
        ...original,
        duration,
        travelMode: ST.travelMode,
        sets: ST.workoutSets,
        notes: { ...ST.workoutNotes },
        subs: ST.workoutSubs || {},
        subMeta: ST.workoutSubMeta || {},
        additions: ST.workoutAdditions || [],
        completedCards: [...ST.completedCards],
        startTime: ST.workoutStart,
        endTime: ST.workoutEnd || (ST.workoutStart + duration * 1000)
      };
      hist[idx] = entry;
    } else {
      entry = {
        id: ST.editingWorkoutId,
        programId: ST.currentProgram,
        sessionId: ST.currentSession,
        sessionName: sess ? sess.name : '',
        startTime: ST.workoutStart,
        endTime: ST.workoutEnd || (ST.workoutStart + duration * 1000),
        duration,
        travelMode: ST.travelMode,
        sets: ST.workoutSets,
        notes: { ...ST.workoutNotes },
        subs: ST.workoutSubs || {},
        subMeta: ST.workoutSubMeta || {},
        additions: ST.workoutAdditions || [],
        completedCards: [...ST.completedCards],
      };
      hist.push(entry);
    }
  } else {
    const id = Date.now().toString();
    const startTime = ST.workoutStart || Date.now() - duration * 1000;
    const endTime = ST.isBackdated ? (startTime + duration * 1000) : Date.now();
    entry = {
      id,
      programId: ST.currentProgram,
      sessionId: ST.currentSession,
      sessionName: sess ? sess.name : '',
      startTime,
      endTime,
      duration,
      travelMode: ST.travelMode,
      sets: ST.workoutSets,
      notes: { ...ST.workoutNotes },
      subs: ST.workoutSubs || {},
      subMeta: ST.workoutSubMeta || {},
      additions: ST.workoutAdditions || [],
      completedCards: [...ST.completedCards],
    };
    if (ST.fitbit && ST.fitbit.connected) {
      entry.biometrics = {
        readiness: ST.fitbit.readinessScore ?? null,
        sleep: ST.fitbit.sleepScore ?? null,
        hrv: ST.fitbit.hrv ?? null,
        rhr: ST.fitbit.restingHR ?? null,
        deep: ST.fitbit.deepSleepMinutes ?? null,
        spo2: ST.fitbit.spo2 ?? null
      };
    }
    hist.push(entry);
  }

  saveHistory(hist);
  LS.remove('dcrgym_current_workout');
  // Workout is committed: block any in-flight saveNow (pending draft/save debounce,
  // visibilitychange, pagehide) from re-creating the snapshot — otherwise the
  // "Continue" pill reappears on Home after finishing. currentSession/currentProgram
  // intentionally stay set; the finish screen below still reads them.
  ST.workoutCommitted = true;
  clearTimeout(_draftTimeout);
  clearTimeout(_saveTimeout);

  const wasEditing = !!ST.editingWorkoutId;
  const wasBackdated = !!ST.isBackdated;

  ST.editingWorkoutId = null;
  ST.isBackdated = false;
  ST.workoutEnd = null;
  ST.workoutDrafts = {};
  ST.workoutSubs   = {};
  ST.workoutSubMeta = {};
  ST.workoutAdditions = [];
  
  bgSyncToSheets(entry);

  if (wasEditing || wasBackdated) {
    Maps('history');
    return;
  }

  // e1RM delta vs previous same session
  const currentProg = PROGRAMS.find(p => p.id === ST.currentProgram);
  const curE1RM  = getSessionE1RM(entry, currentProg);
  const prevEntry = getPrevSessionEntry(ST.currentSession, entry.id);
  const prevE1RM  = prevEntry ? getSessionE1RM(prevEntry, currentProg) : 0;
  let e1rmDelta = null;
  if (curE1RM > 0 && prevE1RM > 0) {
    e1rmDelta = Math.round(((curE1RM - prevE1RM) / prevE1RM) * 100);
  }

  generateInsightCard(entry, duration);

  ST.lastSummary = { duration, prevDur, biggestGain, e1rmDelta, curE1RM, programId: ST.currentProgram, sessionId: ST.currentSession };

  // Belt-and-suspenders: workout is fully done. Null the live session markers
  // so that saveNow() is blocked and the floating workout-pill is hidden immediately.
  ST.currentSession = null;
  ST.workoutStart = null;
  if (ST.durationTimer) {
    clearInterval(ST.durationTimer);
    ST.durationTimer = null;
  }

  const milestone = checkMilestone();
  if (milestone) {
    ST.milestoneN = milestone;
    showMilestone();
  } else {
    showFinish();
  }

  // PWA install: handled natively via Chrome "Add to Home screen"
}

// ── Finish screen ─────────────────────────────────────────────────────────────
function showFinish() {
  playSound('finish');
  haptic('finish');
  const s = ST.lastSummary || {};
  const progId = s.programId || ST.currentProgram;
  const sessId = s.sessionId || ST.currentSession;
  const prog = PROGRAMS.find(p => p.id === progId);
  const sess = prog && prog.sessions.find(ss => ss.id === sessId);

  // Build the program session table
  const hist = getHistory();
  const weekStart = (() => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); })();
  const msPerDay = 86400000;

  // Sessions done this week (excluding the one just finished)
  const doneThisWeek = {};
  for (const w of hist.slice(0, -1)) { // exclude the entry we just added
    if (w.programId !== (prog && prog.id) || w.endTime < weekStart) continue;
    if (!doneThisWeek[w.sessionId] || w.endTime > doneThisWeek[w.sessionId]) {
      doneThisWeek[w.sessionId] = w.endTime;
    }
  }

  const tableRows = prog ? prog.sessions.map(ps => {
    const isNow = ps.id === sessId;
    const priorDone = doneThisWeek[ps.id];
    if (isNow) {
      return `<div class="finish-row finish-row-now">
        <div class="fr-icon">✦</div>
        <div class="fr-info">
          <div class="fr-name">${ps.name}</div>
          <div class="fr-date">Just completed · ${formatDuration(s.duration||0)}</div>
        </div>
      </div>`;
    } else if (priorDone) {
      const daysAgo = Math.floor((Date.now() - priorDone) / msPerDay);
      const dateLabel = daysAgo === 0 ? 'Today' : daysAgo === 1 ? 'Yesterday' : daysAgo + ' days ago';
      return `<div class="finish-row finish-row-done-prior">
        <div class="fr-icon fr-icon-prior">✓</div>
        <div class="fr-info">
          <div class="fr-name">${ps.name}</div>
          <div class="fr-date">${dateLabel}</div>
        </div>
      </div>`;
    } else {
      return `<div class="finish-row finish-row-remaining">
        <div class="fr-icon">·</div>
        <div class="fr-info">
          <div class="fr-name">${ps.name}</div>
          <div class="fr-date">${ps.exercises.length} exercises</div>
        </div>
      </div>`;
    }
  }).join('') : '';

  // Stats — volume display removed per UI spec (III)
  const unit = getWeightUnit();
  const durText  = formatDuration(s.duration || 0);
  const gainText = s.biggestGain ? '+'+s.biggestGain.gain+' '+unit : '—';
  const gainLabel = s.biggestGain ? s.biggestGain.name : 'Top gain';

  // Set compliance %
  const prog2 = PROGRAMS.find(p => p.id === progId);
  const sess2 = prog2 && prog2.sessions.find(ss => ss.id === sessId);
  let compliancePct = '—';
  if (sess2) {
    const total   = sess2.exercises.length;
    const done    = sess2.exercises.filter((_,i) => ST.completedCards.has(`${sess2.id}_${i}`)).length;
    compliancePct = total > 0 ? Math.round((done / total) * 100) + '%' : '—';
  }

  // e1RM delta badge
  let e1rmBadgeHTML = '';
  if (s.e1rmDelta !== null && s.e1rmDelta !== undefined) {
    const up = s.e1rmDelta >= 0;
    e1rmBadgeHTML = `
      <div style="margin:0 auto 18px;padding:12px 20px;border-radius:14px;
        background:${up ? 'oklch(72.3% 0.190 145 / 0.08)' : 'oklch(48% 0.130 35 / 0.08)'};
        border:1px solid ${up ? 'oklch(72.3% 0.190 145 / 0.25)' : 'oklch(48% 0.130 35 / 0.25)'};
        text-align:center;max-width:320px">
        <div style="font-family:var(--font-body);font-size:26px;font-weight:300;font-variant-numeric:tabular-nums lining-nums;
          color:${up ? 'var(--green)' : 'var(--terracotta)'};letter-spacing:-0.5px">
          ${up ? '▲' : '▼'} ${up ? '+' : ''}${s.e1rmDelta}%
        </div>
        <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:12px;
          color:oklch(60% 0.018 55);margin-top:3px">e1RM vs previous session</div>
      </div>`;
  } else if (s.curE1RM > 0) {
    e1rmBadgeHTML = `
      <div style="margin:0 auto 18px;padding:10px 20px;border-radius:14px;
        background:oklch(91.2% 0.012 72 / 0.6);border:1px solid oklch(78% 0.030 60 / 0.4);
        text-align:center;max-width:320px">
        <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:13px;
          color:oklch(60% 0.018 55)">Baseline Established · ${s.curE1RM} ${unit} e1RM</div>
      </div>`;
  }

  const el = document.createElement('div');
  el.id = 'finish-screen';
  el.innerHTML = `
    <div class="finish-headline">Done.</div>
    <div class="finish-session-label">${sess ? sess.name : 'Session'} complete</div>
    ${e1rmBadgeHTML}
    <div class="finish-stats-row">
      <div class="finish-stat"><div class="finish-stat-val">${durText}</div><div class="finish-stat-lbl">Duration</div></div>
      <div class="finish-stat"><div class="finish-stat-val" ${compliancePct !== '—' ? `data-count="${parseInt(compliancePct)}" data-suffix="%"` : ''}>${compliancePct}</div><div class="finish-stat-lbl">Compliance</div></div>
      <div class="finish-stat"><div class="finish-stat-val" style="font-size:14px;line-height:1.2">${gainText}</div><div class="finish-stat-lbl">${gainLabel.split(' ')[0]}</div></div>
    </div>
    ${prog ? `<div class="finish-plan-table">${tableRows}</div>` : ''}
    <button class="btn btn-primary" style="max-width:360px;width:100%" onclick="dismissFinish()">Back to Home</button>
  `;
  document.body.appendChild(el);
  requestAnimationFrame(() => tickStats(el));
  launchConfetti(false);
}

function dismissFinish() {
  const el = document.getElementById('finish-screen');
  if (el) el.remove();

  // Belt-and-suspenders: workout is fully done and we're leaving for Home. Null the

  // guard nothing (late timer, visibilitychange, pagehide) can resurrect the
  // snapshot / "Continue" pill. currentProgram stays for the Home silhouette/streak.
  ST.currentSession = null;
  ST.workoutStart = null;
  Maps('home');
}
