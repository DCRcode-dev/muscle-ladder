function renderProgressGauges() {
  const progId = ST.defaultProgram || ST.currentProgram;
  const prog = progId ? PROGRAMS.find(p => p.id === progId) : null;

  if (!prog) {
    return `<div class="empty-state">
      <div class="empty-title">DCR Gym</div>
      <div class="empty-sub">Select a program to track completion.</div>
      <button class="btn btn-primary" style="width:200px" onclick="Maps('prog')">Choose Program</button>
    </div>`;
  }

  // ── Scheduled sets per muscle across the full program week ──
  const scheduledSets = {};
  for (const sess of prog.sessions) {
    for (const ex of sess.exercises) {
      const muscle = getMuscle(stripSuperset(ex.name));
      if (muscle === 'Other') continue;
      scheduledSets[muscle] = (scheduledSets[muscle] || 0) + (ex.workingSets || 3);
    }
  }

  // ── Completed sets this week per muscle ──
  const weekStart = (() => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); })();
  const completedSets = {};
  for (const w of getHistory()) {
    if (w.programId !== progId || w.endTime < weekStart || !w.sets) continue;
    const wp = PROGRAMS.find(p => p.id === w.programId);
    if (!wp) continue;
    const ws = wp.sessions.find(s => s.id === w.sessionId);
    if (!ws) continue;
    for (const [key, sets] of Object.entries(w.sets)) {
      const exIdx = parseInt(key.split('_').pop());
      const ex = ws.exercises[exIdx];
      if (!ex) continue;
      const muscle = getMuscle(stripSuperset(ex.name));
      if (muscle === 'Other') continue;
      completedSets[muscle] = (completedSets[muscle] || 0) + (sets || []).filter(Boolean).length;
    }
  }

  if (!Object.keys(scheduledSets).length) {
    return `<div style="padding:24px 20px;font-size:13px;color:var(--muted);font-style:italic">No exercises found for this program.</div>`;
  }

  // ── Sort by completion % desc — NO ghost tiles, only programmed muscles ──
  const sorted = Object.keys(scheduledSets).sort((a, b) => {
    const pa = (completedSets[a] || 0) / (scheduledSets[a] || 1);
    const pb = (completedSets[b] || 0) / (scheduledSets[b] || 1);
    return pb - pa;
  });
  // No padding — variable rows

  // ── SVG ring builder — 40% larger (r=46), success green at 100%, serif labels ──
  const BM_R    = 46;
  const BM_CIRC = +(2 * Math.PI * BM_R).toFixed(3);

  function buildRing(pct, idx) {
    const filled     = +((pct / 100) * BM_CIRC).toFixed(3);
    const hasFill    = pct > 0;
    const isComplete = pct >= 100;
    // Colour scheme: complete = success green, partial = charcoal, empty = muted
    const arcColor  = isComplete ? 'oklch(52% 0.18 145)' : 'oklch(22.8% 0.018 42)';
    const pctColor  = isComplete ? 'oklch(52% 0.18 145)' : (hasFill ? 'oklch(22.8% 0.018 42)' : 'oklch(65% 0.020 55)');
    const bgStroke  = 'oklch(78% 0.018 55 / 0.45)';
    const fontSize  = pct >= 100 ? 15 : (pct >= 10 ? 17 : 19);

    const filterDefs = hasFill && !isComplete ? `
      <defs>
        <filter id="bmsk${idx}" x="-6%" y="-6%" width="112%" height="112%" color-interpolation-filters="linearRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="${idx * 11 + 5}" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.5" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>` : '';

    const activeArc = hasFill ? `
      <circle cx="50" cy="50" r="${BM_R}"
        fill="none" stroke="${arcColor}" stroke-width="${isComplete ? 3.2 : 2.8}" stroke-linecap="round"
        stroke-dasharray="0 ${BM_CIRC}"
        transform="rotate(-90 50 50)"
        ${hasFill && !isComplete ? `filter="url(#bmsk${idx})"` : ''}
        class="bm-arc" data-filled="${filled}"/>` : '';

    return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" overflow="visible">
      ${filterDefs}
      <circle cx="50" cy="50" r="${BM_R}" fill="none" stroke="${bgStroke}" stroke-width="4" stroke-linecap="round"/>
      ${activeArc}
      <text x="50" y="53"
        text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="${fontSize}" font-weight="300"
        fill="${pctColor}"
        font-variant-numeric="tabular-nums lining-nums"
        letter-spacing="-0.5">${pct}%</text>
    </svg>`;
  }

  // ── Build tile HTML — no ghost tiles, only programmed muscles ──
  const tilesHTML = sorted.map((muscle, i) => {
    const row       = Math.floor(i / 4);
    const col       = i % 4;
    const isA       = (row + col) % 2 === 0;
    const scheduled = scheduledSets[muscle] || 1;
    const completed = Math.min(completedSets[muscle] || 0, scheduled);
    const pct       = Math.round((completed / scheduled) * 100);
    const isComplete = pct >= 100;

    return `<div class="bm-tile ${isA ? 'ta' : 'tb'}">
      <div class="bm-ring-box">${buildRing(pct, i)}</div>
      <span class="bm-label${isComplete ? ' complete' : ''}">${muscle}</span>
    </div>`;
  }).join('');

  // ── Kick off staggered arc animation after DOM paint ──
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.querySelectorAll('#hist-body .bm-arc').forEach((arc, i) => {
        const filled = arc.dataset.filled;
        if (!filled) return;
        setTimeout(() => {
          arc.style.transition = 'stroke-dasharray 0.85s cubic-bezier(0.16,1,0.3,1)';
          arc.setAttribute('stroke-dasharray', filled + ' ' + BM_CIRC);
        }, 60 + i * 28);
      });
    });
  });

  return `<div class="progress-grid-wrap">
    <div class="bio-matrix">${tilesHTML}</div>
  </div>`;
}

function renderFiveWeekCalendar() {
  const hist = getHistory();
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  // Map dateKey → array of workout entries
  const workoutByDay = {};
  for (const w of hist) {
    const d = new Date(w.endTime);
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if (!workoutByDay[key]) workoutByDay[key] = [];
    workoutByDay[key].push(w);
  }

  // Anchor to end of current week (Saturday)
  const currentDow = today.getDay();
  const weekEnd = new Date(today);
  weekEnd.setDate(today.getDate() + (6 - currentDow));

  const dows = ['S','M','T','W','T','F','S'];

  let weeksHTML = '';
  for (let wk = 4; wk >= 0; wk--) {
    const weekLabel = wk === 0 ? 'now' : `-${wk}w`;
    let daysHTML = '';
    for (let dow = 0; dow < 7; dow++) {
      const d = new Date(weekEnd);
      d.setDate(weekEnd.getDate() - wk * 7 - (6 - dow));
      const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      const dayNum = d.getDate();
      const isFuture = d > today;
      const workouts = workoutByDay[key] || [];
      const hasWorkout = workouts.length > 0;

      if (isFuture) {
        daysHTML += `<div class="cal-day-cell cal-day-blank"><span class="cal-day-num">${dayNum}</span></div>`;
      } else if (hasWorkout) {
        const w = workouts[0];
        const sessName = (w.sessionName || 'Workout').replace(/'/g, "\\'");
        const dateStr  = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }).replace(/'/g, "\\'");
        const dur  = formatDuration(w.duration || 0);
        const vol  = Math.round(Object.values(w.sets || {}).flat().filter(Boolean).reduce((s, x) => s + (x.w||0)*(x.r||0), 0));
        daysHTML += `<div class="cal-day-cell cal-day-done"
          onclick="openCalDay('${w.id || w.endTime}','${dateStr}')"
          title="${sessName}">
          <span class="cal-day-num">${dayNum}</span>
        </div>`;
      } else {
        const dateStrForClick = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }).replace(/'/g, "\\'");
        daysHTML += `<div class="cal-day-cell cal-day-open"
          onclick="clickOpenCalDay(${d.getTime()}, '${dateStrForClick}')"
          style="cursor:pointer;"
          title="Log past workout">
          <span class="cal-day-num">${dayNum}</span>
        </div>`;
      }
    }
    weeksHTML += `<div class="cal-week-row">
      <div class="cal-week-lbl">${weekLabel}</div>
      <div class="cal-days-row">${daysHTML}</div>
    </div>`;
  }

  return `<div class="cal-section">
    <div class="cal-section-hdr">5-Week Training Calendar</div>
    <div class="cal-dow-header">
      ${dows.map(d => `<div class="cal-dow-cell">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${weeksHTML}</div>
  </div>`;
}

function editCompletedWorkout(workoutId) {
  const existing = LS.get('dcrgym_current_workout');
  const hasLogged = existing && existing.sets &&
    Object.values(existing.sets).some(arr => Array.isArray(arr) && arr.some(s => s && s.r > 0));

  const proceed = () => {
    const w = getHistory().find(x => String(x.id) === String(workoutId) || String(x.endTime) === String(workoutId));
    if (!w) return;

    ST.editingWorkoutId = w.id || w.endTime;
    ST.isBackdated = false;
    ST.currentProgram = w.programId;
    ST.currentSession = w.sessionId;
    ST.travelMode = w.travelMode || false;
    ST.travelLocked = w.travelLocked || false;
    ST.workoutSets = JSON.parse(JSON.stringify(w.sets || {}));
    ST.workoutNotes = JSON.parse(JSON.stringify(w.notes || {}));
    ST.workoutDrafts = {};
    ST.workoutSubs = w.subs ? JSON.parse(JSON.stringify(w.subs)) : {};
    ST.workoutSubMeta = w.subMeta ? JSON.parse(JSON.stringify(w.subMeta)) : {};
    ST.workoutAdditions = w.additions ? JSON.parse(JSON.stringify(w.additions)) : [];
    
    // Reconstruct fields if they were not stored in this workout (for backward compatibility)
    if (!w.additions || w.additions.length === 0) {
      const additions = [];
      const addKeys = Object.keys(w.sets || {})
        .filter(k => k.startsWith('add_') && !k.endsWith('_wu'))
        .sort((a, b) => parseInt(a.slice(4)) - parseInt(b.slice(4)));
      for (const key of addKeys) {
        const id = parseInt(key.slice(4));
        const setArr = w.sets[key] || [];
        const name = (setArr.find(s => s && s._name) || {})._name || 'Added exercise';
        additions.push({
          id: id,
          name: name,
          muscle: getMuscle(name),
          sets: setArr.length,
          reps: setArr[0] && setArr[0].r ? String(setArr[0].r) : '8-10',
          rest: '2–3 min'
        });
      }
      ST.workoutAdditions = additions;
    }
    
    if (!w.subs) {
      const prog = PROGRAMS.find(p => p.id === w.programId);
      const sess = prog && prog.sessions.find(s => s.id === w.sessionId);
      if (sess) {
        sess.exercises.forEach((ex, i) => {
          const key = `${sess.id}_${i}`;
          const setArr = w.sets[key];
          if (Array.isArray(setArr)) {
            const programmed = stripSuperset(ex.name);
            const stamped = (setArr.find(s => s && s._name) || {})._name;
            if (stamped && normalizeEx(stamped) !== normalizeEx(programmed)) {
              ST.workoutSubs[key] = stamped;
              ST.workoutSubMeta[key] = {
                sets: setArr.length,
                reps: setArr[0] && setArr[0].r ? String(setArr[0].r) : String(ex.reps || '8-10')
              };
            }
          }
        });
      }
    }
    
    ST.completedCards = w.completedCards ? new Set(w.completedCards) : new Set();
    if (!w.completedCards) {
      for (const key of Object.keys(w.sets || {})) {
        if (key.endsWith('_wu')) continue;
        const setArr = w.sets[key] || [];
        if (setArr.some(s => s && s.r > 0)) {
          ST.completedCards.add(key);
        }
      }
    }
    
    ST.expandedCards = new Set();
    ST.durationSecs = w.duration || 0;
    ST.workoutStart = w.startTime || (w.endTime - ST.durationSecs * 1000);
    ST.workoutEnd = w.endTime || (ST.workoutStart + ST.durationSecs * 1000);
    
    if (ST.durationTimer) clearInterval(ST.durationTimer);
    ST.durationTimer = null;
    
    saveNow();
    Maps('workout');
  };

  if (existing && hasLogged) {
    confirmSheet({
      title: 'Workout in progress',
      body: 'You have a live workout session with logged sets. Editing an old workout will cancel and archive your current live session. Proceed?',
      confirmLabel: 'Yes, proceed',
      cancelLabel: 'Cancel',
      destructive: true,
      onConfirm: () => {
        archiveWorkoutToHistory(existing);
        LS.remove('dcrgym_current_workout');
        proceed();
      }
    });
  } else {
    if (existing) LS.remove('dcrgym_current_workout');
    proceed();
  }
}

  const durVal = parseInt(durEl.value) || 0;
  
  if (dtVal) {

    if (!isNaN(newStart)) {
      ST.workoutStart = newStart;
      ST.workoutEnd = newStart + (durVal * 60 * 1000);

function deleteWorkout(id) {
  confirmSheet({
    title: 'Delete this workout?',
    body: 'This will permanently remove this workout from your history and Google Sheets.',
    confirmLabel: 'Delete',
    cancelLabel: 'Cancel',
    destructive: true,
    onConfirm: () => {
      const hist = getHistory();
      const idx = hist.findIndex(w => String(w.id) === String(id));
      if (idx !== -1) {
        hist.splice(idx, 1);
        saveHistory(hist);
        
        // Sync delete to Google Sheets
        const s = getSettings();
        if (s.sheets) {
          postToSheets({ action: 'deleteWorkout', id: id }).catch(() => {});
          postToSheets({ action: 'saveState', history: hist, ts: Date.now() }).catch(() => {});
        }
      }
      
      // Clear state
      if (ST.durationTimer) clearInterval(ST.durationTimer);
      ST.durationTimer = null;
      if (ST.wakeLock) ST.wakeLock.release().catch(()=>{});
      cancelRestTimer();
      LS.remove('dcrgym_current_workout');
      ST.currentProgram = null; ST.currentSession = null;
      ST.editingWorkoutId = null; ST.isBackdated = false; ST.workoutEnd = null;
      ST.workoutSets = {}; ST.workoutStart = null; ST.durationSecs = 0;
      ST.workoutDrafts = {}; ST.workoutSubs = {}; ST.workoutNotes = {};
      ST.workoutSubMeta = {}; ST.workoutAdditions = [];
      ST.expandedCards = new Set(); ST.completedCards = new Set();
      ST.travelMode = false; ST.travelLocked = false;
      
      closeSheet();
      Maps('history');
    }
  });
}

function openCalDay(id, dateStr) {
  const popup = document.getElementById('cal-popup');
  if (!popup) return;
  const w = getHistory().find(x => String(x.id) === String(id) || String(x.endTime) === String(id));
  if (!w) return;
  const sessName = w.sessionName || 'Workout';
  const dur = formatDuration(w.duration || 0);
  const vol = Math.round(Object.values(w.sets || {}).flat().filter(Boolean).reduce((s, x) => s + (x.w||0)*(x.r||0), 0));

  const sets = w.sets || {};
  const prog = PROGRAMS.find(p => p.id === w.programId);
  const sess = prog && prog.sessions.find(s => s.id === w.sessionId);

  // One log row — "✓ Name  n × reps", with a "→ from X" badge when substituted
  const rowFor = (name, setArr, subFrom) => {
    const done = (setArr || []).filter(Boolean);
    if (done.length === 0) return '';
    const reps = done[0] ? done[0].r : '';
    return `<div class="cal-ex-row">
      <span class="cal-ex-check">✓</span>
      <span class="cal-ex-name">${name}${subFrom ? `<span class="cal-ex-sub">→ from ${subFrom}</span>` : ''}</span>
      <span class="cal-ex-vol">${done.length} × ${reps}</span>
    </div>`;
  };

  // Programmed exercises in their original order; detect substitutions via _name
  let progRows = '';
  if (sess) {
    sess.exercises.forEach((ex, i) => {
      const key = `${w.sessionId}_${i}`;
      const setArr = sets[key];
      if (!Array.isArray(setArr)) return;
      const programmed = stripSuperset(ex.name);
      const stamped = (setArr.find(s => s && s._name) || {})._name || programmed;
      const subFrom = (normalizeEx(stamped) !== normalizeEx(programmed)) ? programmed : null;
      progRows += rowFor(stamped, setArr, subFrom);
    });
  }

  // Accessory additions (add_* keys), in id order
  const addKeys = Object.keys(sets)
    .filter(k => k.indexOf('add_') === 0 && !k.endsWith('_wu'))
    .sort((a, b) => parseInt(a.slice(4)) - parseInt(b.slice(4)));
  let addRows = '';
  for (const key of addKeys) {
    const setArr = sets[key];
    if (!Array.isArray(setArr)) continue;
    const nm = (setArr.find(s => s && s._name) || {})._name || 'Added exercise';
    addRows += rowFor(nm, setArr, null);
  }

  const listHTML = (progRows || addRows) ? `
    <div class="cal-ex-list">
      ${progRows ? `<div class="cal-ex-group-lbl">programmed</div>${progRows}` : ''}
      ${addRows ? `<div class="cal-ex-group-lbl cal-ex-group-add">✚ additions</div>${addRows}` : ''}
    </div>` : '';

  document.getElementById('cal-popup-content').innerHTML = `
    <div class="cal-popup-date">${dateStr}</div>
    <div class="cal-popup-session">routine // ${sessName.toLowerCase()}</div>
    <div class="cal-popup-stats">
      <div class="cal-popup-stat">
        <div class="cal-popup-stat-val">${dur}</div>
        <div class="cal-popup-stat-lbl">Duration</div>
      </div>
      <div class="cal-popup-stat">
        <div class="cal-popup-stat-val">${vol}kg</div>
        <div class="cal-popup-stat-lbl">Volume</div>
      </div>
    </div>
    ${listHTML}
    <div style="margin-top:20px; display:flex; gap:10px;">
      <button class="btn btn-primary" style="flex:1; padding:10px; font-size:13px;" onclick="closeCalPopup(); editCompletedWorkout('${w.id || w.endTime}')">Edit Workout</button>
    </div>`;
  popup.style.display = 'flex';
  requestAnimationFrame(() => popup.classList.add('visible'));
}

function closeCalPopup() {
  const popup = document.getElementById('cal-popup');
  if (!popup) return;
  popup.classList.remove('visible');
  setTimeout(() => { popup.style.display = 'none'; }, 280);

function renderSparkline(values) {
  if (!values || values.length < 2) return '<line x1="0" y1="12" x2="60" y2="12" stroke="#E8E0D5" stroke-width="1.5"/>';
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * 58 + 1;
    const y = 22 - ((v - min) / range) * 20;
    return `${x},${y}`;
  }).join(' ');
  return `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function renderDetailChart(values) {
  if (values.length < 2) return '';
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * 298 + 1;
    const y = 95 - ((v - min) / range) * 85;
    return `${x},${y}`;
  }).join(' ');
  return `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function anaFmtDay(iso, withYear) {
  if (!iso) return '—';
  const p = iso.split('-'); if (p.length < 3) return iso;

  return d.toLocaleDateString('en-US', withYear ? { month: 'short', day: 'numeric', year: 'numeric' } : { month: 'short', day: 'numeric' });
}

// ── Biometric Calculators & Profile Matchers ──────────────────────────────────
function getAnalyzedWorkout() {
  const hist = getHistory();
  if (!hist || hist.length === 0) return null;
  return hist[hist.length - 1];
}

function getBiometricsForWorkout(w) {
  if (!w) return null;
  if (w.biometrics) return w.biometrics;
  const dateStr = ghLocalDate(w.endTime);
  const bioLog = ghGetBioLog();
  if (bioLog[dateStr]) return bioLog[dateStr];
  
  // Fallback to ST.fitbit if it matches the date
  const fb = ST.fitbit;
  if (fb && fb.asOf === dateStr) {
    return {
      readiness: fb.readinessScore ?? null,
      sleep: fb.sleepScore ?? null,
      hrv: fb.hrv ?? null,
      rhr: fb.restingHR ?? null,
      deep: fb.deepSleepMinutes ?? null,
      spo2: fb.spo2 ?? null
    };
  }
  
  // Try searching the trailing arrays
  if (fb && Array.isArray(fb.trailingDates)) {
    const idx = fb.trailingDates.indexOf(dateStr);
    if (idx >= 0) {
      return {
        readiness: fb.trailingReadiness[idx] ?? null,
        sleep: fb.trailingSleep[idx] ?? null,
        hrv: fb.trailingHRV[idx] ?? null,
        rhr: fb.trailingRHR[idx] ?? null,
        deep: null,
        spo2: null
      };
    }
  }
  return null;
}

function getEffectiveBiometrics(w) {
  const bio = getBiometricsForWorkout(w);
  if (bio) return { ...bio, isEstimated: false };
  // Default fallback values if no biometrics are synced/cached
  return {
    readiness: 75,
    sleep: 72,
    hrv: 52,
    rhr: 64,
    deep: 65,
    spo2: 97,
    isEstimated: true
  };
}

function getWorkoutSetsAndRpe(w) {
  let totalSets = 0;
  let sumRpe = 0;
  let rpeCount = 0;
  if (w && w.sets) {
    for (const [key, sets] of Object.entries(w.sets)) {
      if (key.endsWith('_wu')) continue;
      for (const s of sets) {
        if (s && s.r > 0) {
          totalSets++;
          if (s.rpe) {
            sumRpe += parseFloat(s.rpe);
            rpeCount++;
          }
        }
      }
    }
  }
  const avgRpe = rpeCount > 0 ? (sumRpe / rpeCount) : 7.5;
  return { totalSets, avgRpe };
}

function calculateWorkoutStrain(w) {
  if (!w) return 0;
  const durMin = (w.duration || 3600) / 60;
  const { totalSets, avgRpe } = getWorkoutSetsAndRpe(w);
  const strain = Math.round((durMin * 0.4 + totalSets * 1.5 + avgRpe * 3.0) / 1.4);
  return Math.min(100, Math.max(10, strain));
}

function calculateCNSCapacity(readiness, strain) {
  const val = Math.round(readiness - (strain * 0.25));
  return Math.min(100, Math.max(0, val));
}

function calculateHRRecovery(readiness, avgRpe) {
  const hrr = Math.round(28 + (readiness - 70) * 0.2 + (10 - avgRpe) * 1.5);
  return Math.min(50, Math.max(15, hrr));
}

function calculateSleepTarget(strain, sleepScore) {
  let hours = 7.5 + (strain * 0.018) + (Math.max(0, 80 - (sleepScore || 70)) * 0.035);
  hours = Math.min(10.5, Math.max(6.5, hours));
  const h = Math.floor(hours);
  const m = Math.round((hours - h) * 60);
  return { h, m, totalHours: hours };
}

function getWorkoutMuscleSignature(w) {
  if (!w || !w.sets) return null;
  const signature = {};
  let totalSets = 0;
  
  const wp = PROGRAMS.find(p => p.id === w.programId);
  const ws = wp ? wp.sessions.find(s => s.id === w.sessionId) : null;
  
  for (const [key, sets] of Object.entries(w.sets)) {
    if (key.endsWith('_wu')) continue;
    const exIdx = parseInt(key.split('_').pop());
    const ex = ws ? ws.exercises[exIdx] : null;
    for (const set of sets) {
      if (!set || !set.r) continue;
      const nm = set._name || (ex && stripSuperset(ex.name));
      if (!nm) continue;
      const muscle = getMuscle(nm);
      signature[muscle] = (signature[muscle] || 0) + 1;
      totalSets++;
    }
  }
  if (totalSets === 0) return null;
  for (const m in signature) {
    signature[m] = signature[m] / totalSets;
  }
  return signature;
}

function getSignatureSimilarity(sigA, sigB) {
  if (!sigA || !sigB) return 0;
  let sumMin = 0;
  const muscles = new Set([...Object.keys(sigA), ...Object.keys(sigB)]);
  muscles.forEach(m => {
    const valA = sigA[m] || 0;
    const valB = sigB[m] || 0;
    sumMin += Math.min(valA, valB);
  });
  return sumMin;
}

function findSimilarWorkouts(targetWorkout, limit = 5) {
  const hist = getHistory();
  const targetSig = getWorkoutMuscleSignature(targetWorkout);
  const matches = [];
  
  hist.forEach(w => {
    if (w.id === targetWorkout.id) return;
    const sig = getWorkoutMuscleSignature(w);
    const sim = getSignatureSimilarity(targetSig, sig);
    if (sim >= 0.80) {
      matches.push({ w, tier: 1, sim, score: sim });
    }
  });
  
  if (matches.length < limit) {
    hist.forEach(w => {
      if (w.id === targetWorkout.id) return;
      if (w.programId === targetWorkout.programId && w.sessionId === targetWorkout.sessionId) {
        if (!matches.some(m => m.w.id === w.id)) {
          matches.push({ w, tier: 2, sim: 1.0, score: 0.5 });
        }
      }
    });
  }
  
  if (matches.length < limit) {
    const thirtyDaysAgo = Date.now() - 30 * 86400 * 1000;
    hist.forEach(w => {
      if (w.id === targetWorkout.id) return;
      if (w.endTime >= thirtyDaysAgo) {
        if (!matches.some(m => m.w.id === w.id)) {
          matches.push({ w, tier: 3, sim: 0.5, score: 0.1 });
        }
      }
    });
  }
  
  matches.sort((a, b) => b.score - a.score || b.w.endTime - a.w.endTime);
  return matches.slice(0, limit).map(m => m.w);
}

function calculateEVR(w) {
  if (!w) return 0;
  const prog = PROGRAMS.find(p => p.id === w.programId);
  const e1rm = prog ? getSessionE1RM(w, prog) : 0;
  const sets = getSessionWorkingSetsCount(w);
  return sets > 0 ? (e1rm / sets) : 0;
}

function getSessionWorkingSetsCount(w) {
  let count = 0;
  if (!w || !w.sets) return 0;
  for (const [key, sets] of Object.entries(w.sets)) {
    if (key.endsWith('_wu')) continue;
    for (const set of sets) {
      if (set && set.r > 0) count++;
    }
  }
  return count;
}

function calculateFatigueTrend(targetWorkout) {
  const similar = findSimilarWorkouts(targetWorkout, 5);
  const currentEVR = calculateEVR(targetWorkout);
  if (similar.length === 0) return { deltaPct: 0, currentEVR, baselineEVR: currentEVR, values: [currentEVR] };
  const evrs = similar.map(w => calculateEVR(w)).filter(v => v > 0);
  if (evrs.length === 0) return { deltaPct: 0, currentEVR, baselineEVR: currentEVR, values: [currentEVR] };
  const baselineEVR = evrs.reduce((a, b) => a + b, 0) / evrs.length;
  const deltaPct = baselineEVR > 0 ? Math.round(((currentEVR - baselineEVR) / baselineEVR) * 1000) / 10 : 0;
  const values = [...evrs.reverse(), currentEVR];
  return { deltaPct, currentEVR, baselineEVR, values };
}

  openSheet(`

function renderSheetChart(values, dates, label) {
  if (!values || values.length < 2) return "";
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = max - min || 1;
  const W = 300, H = 60, padL = 10, padR = 10, padT = 10, padB = 15;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const N = values.length;
  
  const x = i => padL + (N === 1 ? innerW / 2 : (i / (N - 1)) * innerW);
  const y = v => padT + innerH - ((v - min) / range) * innerH;
  
  const points = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const poly = `<polyline points="${points}" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>`;
  const dots = values.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="var(--accent)"/>`).join('');
  
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="overflow:visible">
    <line x1="${padL}" y1="${padT + innerH}" x2="${W - padR}" y2="${padT + innerH}" stroke="rgba(42,36,33,0.12)" stroke-width="0.5"/>
    ${poly}
    ${dots}
    <text x="${padL}" y="${H}" font-size="7" fill="var(--muted)">${dates[0] ? anaFmtDay(dates[0]) : ''}</text>
    <text x="${W - padR}" y="${H}" text-anchor="end" font-size="7" fill="var(--muted)">${dates[N-1] ? anaFmtDay(dates[N-1]) : ''}</text>
  </svg>`;
}

function renderMiniSparkline(values) {
  if (!values || values.length < 2) return "";
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = max - min || 1;
  const W = 80, H = 14;
  const N = values.length;
  const x = i => (i / (N - 1)) * W;
  const y = v => H - ((v - min) / range) * H;
  const points = values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const diff = values[N - 1] - values[0];
  const stroke = diff > 0 ? '#28A745' : (diff < 0 ? '#DC3545' : '#8B7A5C');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="overflow:visible; display:block;">
    <polyline points="${points}" fill="none" stroke="${stroke}" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

function anaTrailPanel(fb) {

function buildBiometricChart(fb, range) {
  range = range || 7;
  const sliceN = a => (a || []).slice(-range);
  const R = sliceN(fb.trailingReadiness), SL = sliceN(fb.trailingSleep), HV = sliceN(fb.trailingHRV);
  const N = Math.max(R.length, SL.length, HV.length, 0);
  if (N < 2 || (R.concat(SL, HV).every(v => v == null))) {
    return `<svg viewBox="0 0 300 120" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
      <text x="150" y="60" text-anchor="middle" font-family="'Cormorant Garamond',serif" font-style="italic" font-size="15" fill="#1A1714" opacity="0.4">no trail yet — sync to begin</text></svg>`;
  }
  const W = 300, H = 120, padL = 6, padR = 6, padT = 10, padB = 16;
  const innerW = W - padL - padR, innerH = H - padT - padB;
  const x = i => padL + (N === 1 ? innerW / 2 : (i / (N - 1)) * innerW);
  const y100 = v => padT + innerH - (Math.max(0, Math.min(100, v)) / 100) * innerH;
  const hvVals = HV.filter(v => v != null);
  const hvMin = hvVals.length ? Math.min(...hvVals) : 0, hvMax = hvVals.length ? Math.max(...hvVals) : 1;
  const yHv = v => { if (hvMax === hvMin) return padT + innerH / 2; return padT + innerH - ((v - hvMin) / (hvMax - hvMin)) * innerH; };
  function path(arr, yfn) {
    let d = '', started = false, len = 0;
    arr.forEach((v, i) => { if (v == null) { started = false; return; } const cmd = started ? 'L' : 'M'; d += `${cmd}${x(i).toFixed(1)} ${yfn(v).toFixed(1)} `; started = true; len += 1; });
    return { d: d.trim(), len };
  }
  const pR = path(R, y100), pS = path(SL, y100), pH = path(HV, yHv);
  function poly(p, color, w) { if (!p.d) return ''; return `<path d="${p.d}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:600;stroke-dashoffset:600;animation:anaDraw 900ms cubic-bezier(0.16,1,0.3,1) forwards"/>`; }
  function dots(arr, yfn, color) { return arr.map((v, i) => v == null ? '' : `<circle cx="${x(i).toFixed(1)}" cy="${yfn(v).toFixed(1)}" r="1.7" fill="${color}"/>`).join(''); }
  // x labels: first / mid / last
  const dts = sliceN(fb.trailingDates);
  const lbl = i => dts[i] ? anaFmtDay(dts[i]) : '';
  const xlabels = `<text x="${x(0)}" y="${H-4}" font-size="6.5" fill="#1A1714" opacity="0.4" font-family="var(--font-body)">${lbl(0)}</text>
    <text x="${x(N-1)}" y="${H-4}" text-anchor="end" font-size="6.5" fill="#1A1714" opacity="0.4" font-family="var(--font-body)">${lbl(N-1)}</text>`;
  return `<svg id="ana-trail-svg" viewBox="0 0 ${W} ${H}" width="100%" height="100%" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <line id="ana-scrub-line" x1="0" y1="${padT}" x2="0" y2="${padT+innerH}" stroke="#1A1714" stroke-width="0.6" opacity="0"/>
    ${poly(pS, '#B8860B', 1.6)}${poly(pH, '#1A5276', 1.6)}${poly(pR, '#28A745', 2.1)}
    ${dots(SL, y100, '#B8860B')}${dots(HV, yHv, '#1A5276')}${dots(R, y100, '#28A745')}
    ${xlabels}
  </svg>`;
}
function initChartHover(fb) {
  const svg = document.getElementById('ana-trail-svg');
  const pop = document.getElementById('ana-popover');
  const line = document.getElementById('ana-scrub-line');
  if (!svg || !pop) return;
  const range = fb._range || 7;
  const sliceN = a => (a || []).slice(-range);
  const R = sliceN(fb.trailingReadiness), SL = sliceN(fb.trailingSleep), HV = sliceN(fb.trailingHRV), RH = sliceN(fb.trailingRHR), D = sliceN(fb.trailingDates);
  const N = Math.max(R.length, SL.length, HV.length, 0);
  if (N < 2) return;
  function at(clientX) {
    const rect = svg.getBoundingClientRect();
    const f = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    const i = Math.round(f * (N - 1));
    if (line) { line.setAttribute('x1', (6 + (i / (N - 1)) * 288).toFixed(1)); line.setAttribute('x2', (6 + (i / (N - 1)) * 288).toFixed(1)); line.setAttribute('opacity', '0.25'); }
    const rd = R[i], sl = SL[i], hv = HV[i], rh = RH[i];
    pop.innerHTML = `<div class="ana2-pop-d">${D[i] ? anaFmtDay(D[i]) : ''}</div>
      <div class="ana2-pop-r"><i style="background:#28A745"></i>${rd != null ? rd : '–'}<i style="background:#B8860B;margin-left:7px"></i>${sl != null ? sl : '–'}<i style="background:#1A5276;margin-left:7px"></i>${hv != null ? hv : '–'}${rh != null ? ' · ♥' + rh : ''}</div>`;
    pop.style.opacity = '1';
    try { if (typeof haptic === 'function') haptic('tick'); } catch (e) {}
  }
  function end() { pop.style.opacity = '0'; if (line) line.setAttribute('opacity', '0'); }
  svg.ontouchstart = svg.ontouchmove = e => { if (e.touches && e.touches[0]) { at(e.touches[0].clientX); e.preventDefault(); } };
  svg.ontouchend = end;
  svg.onmousemove = e => at(e.clientX);
  svg.onmouseleave = end;
}

// ╔══════════════════════════════════════════════════════════════════════════╗
// ║  GOOGLE HEALTH — SERVER PROXY (via Apps Script ?action=getFitbit)         ║
// ║  Direct client-side GSI was removed: the token popup is unreliable in an  ║
// ║  installed mobile PWA. The Apps Script web app now mints a HEALTH-ONLY    ║
// ║  OAuth token server-side and returns a parsed JSON payload, so the PWA    ║
// ║  just GETs it. No client secret, no scopes, no popup in the app.          ║
// ╚══════════════════════════════════════════════════════════════════════════╝

function ghLocalDate(d) {
  const dt = d ? new Date(d) : new Date();
  return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0');
}

// Persistent daily biometric log — accumulates across syncs so the correlation
// engine grows a real dataset over weeks. Pruned to a 120-day window.
function ghGetBioLog() { const l = LS.get('dcrgym_bio_log', {}); return (l && typeof l === 'object') ? l : {}; }
function ghMergeBioLog(fresh) {
  const log = ghGetBioLog();
  Object.keys(fresh || {}).forEach(day => {
    const cur = log[day] || {}, nx = fresh[day];
    log[day] = {
      readiness: nx.readiness != null ? nx.readiness : (cur.readiness != null ? cur.readiness : null),
      sleep:     nx.sleep     != null ? nx.sleep     : (cur.sleep     != null ? cur.sleep     : null),
      hrv:       nx.hrv       != null ? nx.hrv       : (cur.hrv       != null ? cur.hrv       : null),
      rhr:       nx.rhr       != null ? nx.rhr       : (cur.rhr       != null ? cur.rhr       : null),
      deep:      nx.deep      != null ? nx.deep      : (cur.deep      != null ? cur.deep      : null),
      spo2:      nx.spo2      != null ? nx.spo2      : (cur.spo2      != null ? cur.spo2      : null),
    };
  });
  const cutoff = ghLocalDate(Date.now() - 120 * 86400000);
  Object.keys(log).forEach(day => { if (day < cutoff) delete log[day]; });
  LS.set('dcrgym_bio_log', log);
  return log;
}

// Build a {date:{readiness,sleep,hrv,rhr,deep,spo2}} map from the server payload's
// trailing arrays so the offline correlation engine + trends accrue over time.
function ghBioFromPayload(p) {
  const out = {};
  const D = p.trailingDates || [], R = p.trailingReadiness || [], S = p.trailingSleep || [], H = p.trailingHRV || [], RH = p.trailingRHR || [];
  for (let i = 0; i < D.length; i++) {
    const day = D[i]; if (!day) continue;
    const e = { readiness: R[i] ?? null, sleep: S[i] ?? null, hrv: H[i] ?? null, rhr: RH[i] ?? null };
    if (e.readiness != null || e.sleep != null || e.hrv != null || e.rhr != null) out[day] = e;
  }
  if (p.asOf && out[p.asOf]) { out[p.asOf].deep = p.deepSleepMinutes ?? null; out[p.asOf].spo2 = p.spo2 ?? null; }
  return out;
}

// Strip transient (underscore-prefixed) keys before persisting.
function ghPersistableFitbit(fb) { const o = {}; for (const k in fb) { if (k.charAt(0) !== '_') o[k] = fb[k]; } return o; }

// Spin the refresh affordance + skeleton shimmer on the Analysis screen.
function ghSetAnaBusy(on) {
  const btn = document.getElementById('ana-refresh');
  if (btn) { btn.style.animation = on ? 'ana-spin 0.9s linear infinite' : ''; btn.style.opacity = on ? '0.65' : ''; btn.disabled = !!on; }

// One-time authorization prompt — opens the server's OAuth consent URL.
function ghPromptHealthAuth(authUrl) {
  if (!authUrl) return;
  if (typeof openSheet === 'function') {
    openSheet(

        '<div style="font-family:\'Cormorant Garamond\',serif;font-style:italic;font-weight:600;font-size:1.55rem;color:#1A1714;margin-bottom:8px">Connect Google Health</div>' +
        '<div style="font-family:var(--font-body);font-size:12.5px;line-height:1.55;color:#5A534A;margin-bottom:20px">One-time approval. Opens Google to authorize your biometrics, then return here and tap refresh.</div>' +
        '<a href="' + authUrl + '" target="_blank" rel="noopener" ' +
          'style="display:inline-block;padding:13px 30px;background:#1A1714;color:#FAF7F2;border-radius:26px;text-decoration:none;' +

    );

// User-gesture entry point — the reconnect chip taps this.
function ghConnect() { if (ST.fitbit) ST.fitbit.lastError = null; fetchFitbitData(true, true); }

// ── Biometric sync via the Apps Script proxy (GET ?action=getFitbit) ────────
// Re-entrancy guarded + failure-cooldown'd (the old render↔fetch strobe stays
// dead). Triggered only by nav into Analysis, the refresh/reconnect buttons,
// and boot. renderAnalysis is PURE and never calls this in a loop.
async function fetchFitbitData(force, interactive) {
  force = !!force; interactive = !!interactive;
  const fb = ST.fitbit;
  if (fb._fetching) return;                                              // hard re-entrancy guard
  if (!force && fb._failUntil && Date.now() < fb._failUntil) return;     // failure cooldown
  if (!force && fb.fetchedAt === ghLocalDate() && fb.dataState === 'synced') return; // fresh today

  const s = getSettings();
  if (!s.sheets) {                                                       // backend not configured
    fb.connected = false; fb.dataState = 'disconnected'; fb.lastError = 'no-backend-url';
    if (ST.screen === 'analysis') renderAnalysis();
    return;
  }

  fb._fetching = true;
  ghSetAnaBusy(true);
  try {
    const res  = await fetch(s.sheets + '?action=getFitbit', { method: 'GET' });
    const resp = await res.json();

    // ── Not authorized / server has no token ──────────────────────────────
    if (!resp || resp.connected === false) {
      fb.connected  = false;
      fb.dataState  = 'disconnected';
      fb.lastError  = (resp && resp.reason) || 'unauthorized';
      fb.authUrl    = (resp && resp.authUrl) || null;
      fb._failUntil = interactive ? 0 : Date.now() + 10 * 60 * 1000;     // silent: back off 10 min
      if (interactive && fb.authUrl) ghPromptHealthAuth(fb.authUrl);     // tap → open consent
      LS.set('dcrgym_fitbit', ghPersistableFitbit(fb));
      return;
    }

    // ── Connected — map the server payload onto ST.fitbit ─────────────────
    const p = resp.fitbit || {};
    const hasData = (p.readinessScore != null) || (p.sleepScore != null) || (p.restingHR != null) || (p.hrv != null)
                 || (Array.isArray(p.trailingReadiness) && p.trailingReadiness.some(v => v != null));
    Object.assign(fb, p);                                                // readinessScore, trailing*, asOf, etc.
    fb.connected  = true;
    fb.authUrl    = null;
    fb.lastSync   = Date.now();
    fb._failUntil = 0;
    fb.lastError  = hasData ? null : 'no-data';
    // Honest state — never claim "synced" on an empty/stale-cache payload.
    fb.dataState  = hasData ? (resp.stale ? 'stale' : 'synced') : 'connected-no-data';
    if (!fb.asOf) fb.asOf = p.fetchedAt || null;
    if (hasData) { try { ghMergeBioLog(ghBioFromPayload(p)); } catch (e) {} } // grow correlation dataset
    LS.set('dcrgym_fitbit', ghPersistableFitbit(fb));

  } catch (e) {
    fb.lastError  = 'network';
    fb._failUntil = Date.now() + 10 * 60 * 1000;
    console.error('[DCR Gym] Health fetch failed:', e && e.message);
  } finally {
    fb._fetching = false;
    ghSetAnaBusy(false);
    if (ST.screen === 'analysis') renderAnalysis();   // pure render — cannot re-trigger a fetch
    if (ST.screen === 'home')     renderHome();        // boarding-pass readiness chip stays live
  }
}

function exportCSV() {
  const hist = getHistory();
  let csv = 'Date,Program,Session,Exercise,Set,Weight,Reps\n';
  for (const w of hist) {
    const prog = PROGRAMS.find(p => p.id === w.programId);
    if (!prog) continue;
    const sess = prog.sessions.find(s => s.id === w.sessionId);
    if (!sess) continue;
    const date = new Date(w.endTime).toISOString().split('T')[0];
    for (const [key, sets] of Object.entries(w.sets || {})) {
      const exIdx = parseInt(key.split('_').pop());
      const ex = sess.exercises[exIdx];
      if (!ex) continue;
      sets.forEach((s, i) => {
        csv += `${date},${prog.name},${sess.name},${stripSuperset(ex.name)},${i+1},${s.w||0},${s.r||0}\n`;
      });
    }
  }
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'dcrgym-history.csv'; a.click();
  URL.revokeObjectURL(url);
}

function importStrongCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) { noticeSheet('Import failed', 'No data found in that CSV.'); return; }

    // Auto-detect separator
    const sep = lines[0].includes(';') ? ';' : ',';

    // Read header row and map column names → indices dynamically.
    // This handles all Strong export versions regardless of column order.
    const header = lines[0].split(sep).map(c => c.replace(/^"|"$/g,'').trim().toLowerCase());
    const col = name => header.findIndex(h => h === name || h.startsWith(name));
    const colDate     = col('date');
    const colExName   = col('exercise name');
    const colSetOrder = col('set order');
    const colWeight   = header.findIndex(h => h.startsWith('weight'));
    const colReps     = col('reps');

    if (colDate === -1 || colExName === -1 || colReps === -1) {
      noticeSheet('Import failed', 'Could not detect the required columns (Date, Exercise Name, Reps). Is this a Strong CSV export?');
      return;
    }

    const hist = getHistory();
    let parsed = 0;
    let currentDate = null, currentWorkout = null;

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(sep).map(c => c.replace(/^"|"$/g,'').trim());
      const dateStr   = cols[colDate]     || '';
      const exName    = cols[colExName]   || '';
      const setType   = colSetOrder !== -1 ? (cols[colSetOrder] || '') : '';
      const weightStr = colWeight  !== -1 ? (cols[colWeight]   || '0') : '0';
      const repsStr   = cols[colReps]     || '';

      if (!dateStr || !exName) continue;
      if (setType === 'W' || setType === 'Note' || exName === 'Rest Timer') continue;

      const date = new Date(dateStr).getTime();
      if (isNaN(date)) continue;

      if (!currentWorkout || currentDate !== dateStr) {
        if (currentWorkout) hist.push(currentWorkout);
        currentDate = dateStr;
        currentWorkout = { id: date.toString(), programId: 'import', sessionId: 'import', sessionName: 'Strong Import', startTime: date, endTime: date + 3600000, duration: 3600, travelMode: false, sets: {} };
        parsed++;
      }

      const clean = exName.replace(/\s*\([^)]*\)/g,'').trim();
      const key = 'import_' + clean.replace(/\s/g,'_').toLowerCase();
      if (!currentWorkout.sets[key]) currentWorkout.sets[key] = [];
      currentWorkout.sets[key].push({ w: parseFloat(weightStr)||0, r: parseInt(repsStr)||0, ts: date, _name: clean });
    }

    if (currentWorkout) hist.push(currentWorkout);
    saveHistory(hist);
    noticeSheet('Import complete', 'Imported ' + parsed + ' workouts from Strong.');
    input.value = '';
  };
  reader.readAsText(file);
}

// ── Cloud sync (bidirectional) ────────────────────────────────────────────────
async function pullFromSheets() {
  const s = getSettings();
  if (!s.sheets) return;
  try {
    const resp = await fetch(s.sheets + '?action=pullState');
    if (!resp.ok) return;
    const data = await resp.json();
    if (data.ok && Array.isArray(data.history) && data.history.length > 0) {
      const local = getHistory();
      const merged = mergeHistories(local, data.history);
      if (merged.length > local.length) saveHistory(merged);
    }
  } catch(e) { /* silent — background op */ }
}

// ── Sync queue — queue-first persistence layer ────────────────────────────────
// Every payload is enqueued before the fetch attempt. On fetch success, it is
// dequeued. On any failure (online or offline), it stays queued and drains on
// next boot or on connectivity restore. Nothing is ever silently dropped.

function enqueueSyncPayload(payload) {
  let queue = LS.get('dcrgym_sync_queue', []);
  // Deduplicate by action + ts to avoid pile-up on retries
  const key = (payload.action || '') + (payload.ts || '');
  if (key && queue.some(i => (i.payload.action || '') + (i.payload.ts || '') === key)) return;
  queue.push({ payload, ts: Date.now() });
  // Cap at 50 entries — keep newest, drop oldest saveState entries first
  if (queue.length > 50) {
    const saveStateIdxs = queue.map((i,n) => i.payload.action==='saveState'?n:-1).filter(n=>n>=0);
    if (saveStateIdxs.length > 1) queue.splice(saveStateIdxs[0], 1); // drop oldest saveState
    else queue.shift(); // drop oldest entry
  }
  LS.set('dcrgym_sync_queue', queue);
}

function dequeueSyncPayload(payload) {
  const key = (payload.action || '') + (payload.ts || '');
  if (!key) return;
  const queue = LS.get('dcrgym_sync_queue', []);
  const filtered = queue.filter(i => (i.payload.action || '') + (i.payload.ts || '') !== key);
  LS.set('dcrgym_sync_queue', filtered);
}

async function drainSyncQueue() {
  const s = getSettings();
  if (!s.sheets) return;
  const queue = LS.get('dcrgym_sync_queue', []);
  if (!queue.length) return;
  const failed = [];
  let anyOk = false;
  for (const item of queue) {
    try {
      const resp = await fetch(s.sheets, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(item.payload)
      });
      if (!resp.ok) failed.push(item);
      else anyOk = true;
      // success — item is NOT added to failed → effectively dequeued
    } catch(e) { failed.push(item); }
  }
  LS.set('dcrgym_sync_queue', failed);
  if (anyOk) LS.set('dcrgym_last_sync', Date.now());
}

// Drain on connectivity restore AND on every boot (see bootstrapApp)
window.addEventListener('online', () => { drainSyncQueue().catch(() => {}); });

// ── JSON full-fidelity backup export ─────────────────────────────────────────
function exportJSON() {
  const hist = getHistory();
  const blob = new Blob([JSON.stringify({ version: 2, exportedAt: Date.now(), history: hist }, null, 2)], { type: 'application/json' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  const date = new Date().toISOString().slice(0, 10);
  a.href = url; a.download = `dcrgym-backup-${date}.json`; a.click();
  URL.revokeObjectURL(url);
}

// ── JSON full-fidelity backup import ─────────────────────────────────────────
function importJSON(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      const incoming = Array.isArray(data) ? data : (data.history || []);
      if (!incoming.length) { noticeSheet('Restore failed', 'No workout history found in this backup file.'); return; }
      const local  = getHistory();
      const merged = mergeHistories(local, incoming);
      const added  = merged.length - local.length;
      saveHistory(merged);
      bgSyncToSheets().catch(() => {});
      noticeSheet('Backup restored', `Restored ${added} new workout${added !== 1 ? 's' : ''} from backup. Total: ${merged.length}.`);
    } catch(err) {
      noticeSheet('Restore failed', 'Could not read that backup file. Make sure it is a valid DCR Gym JSON export.');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

// ── Unified POST to Sheets ────────────────────────────────────────────────────
// CRITICAL: text/plain is a CORS-safelisted content type, so the browser sends
// NO preflight OPTIONS. application/json is NOT safelisted → it triggers a
// preflight that Apps Script web apps cannot answer, so the POST silently dies
// and nothing ever reaches the sheet. Apps Script's doPost reads
// e.postData.contents and JSON.parses it regardless of the declared type, so
// the body still arrives intact. Queue-first: enqueue as insurance, POST,
// dequeue on success, stamp the last-sync time.
async function postToSheets(payload) {
  const s = getSettings();
  if (!s.sheets) return false;
  enqueueSyncPayload(payload);
  try {
    const r = await fetch(s.sheets, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload),
    });
    if (r.ok) {
      dequeueSyncPayload(payload);
      LS.set('dcrgym_last_sync', Date.now());
      return true;
    }
  } catch(e) { /* stays queued — drains on next boot or reconnect */ }
  return false;
}

// ── Map history records → human-readable WorkoutLog rows ─────────────────────
// Exercise identity comes from the stored _name (schema v2); falls back to the
// program structure for legacy/import entries. Only working sets with reps>0;
// warm-ups excluded. Used for both the just-finished workout and the backfill.
function historyToWorkoutRows(records) {
  const out = [];
  for (const w of records || []) {
    if (!w || !w.sets) continue;
    const prog = PROGRAMS.find(p => p.id === w.programId);
    const sess = prog && prog.sessions.find(s => s.id === w.sessionId);
    const exMap = new Map();
    for (const [key, sets] of Object.entries(w.sets)) {
      if (!Array.isArray(sets) || key.endsWith('_wu')) continue;
      const exIdx = parseInt(key.split('_').pop());
      for (const s of sets) {
        if (!s || !(s.r > 0)) continue;
        let name = s._name;
        if (!name && sess && !isNaN(exIdx) && sess.exercises[exIdx]) name = stripSuperset(sess.exercises[exIdx].name);
        if (!name) name = 'Exercise';
        if (!exMap.has(name)) exMap.set(name, []);
        exMap.get(name).push({ weight: s.w, reps: s.r });
      }
    }
    const exercises = [...exMap.entries()].map(([name, sets]) => ({ name, sets }));
    if (!exercises.length) continue;
    out.push({
      id: w.id,
      date: w.endTime,
      programName: prog ? prog.name : (w.programId === 'import' ? 'Strong Import' : ''),
      sessionName: w.sessionName || (sess ? sess.name : ''),
      duration: w.duration || '',
      totalE1RM: prog ? getSessionE1RM(w, prog) : 0,
      totalSets: exercises.reduce((n, e) => n + e.sets.length, 0),
      exercises,
    });
  }
  return out;
}

// ── One-time backfill — push EVERY past workout as readable rows. The server ──
// dedups by row id, so retries are harmless; the flag just avoids re-sending.
async function backfillAllRows() {
  if (LS.get('dcrgym_rows_backfilled', false)) return;
  const s = getSettings();
  if (!s.sheets) return;
  const rows = historyToWorkoutRows(getHistory());
  if (!rows.length) return;
  const ok = await postToSheets({ action: 'syncWorkouts', workouts: rows });
  if (ok) LS.set('dcrgym_rows_backfilled', true);
}

// ── Cloud-sync status line for Settings ──────────────────────────────────────
function syncRelTime(ts) {
  if (!ts) return 'never';
  const d = Date.now() - ts;
  if (d < 60000)    return 'just now';
  if (d < 3600000)  return Math.floor(d / 60000) + 'm ago';
  if (d < 86400000) return Math.floor(d / 3600000) + 'h ago';
  return Math.floor(d / 86400000) + 'd ago';
}
function cloudSyncStatus() {
  const t = LS.get('dcrgym_last_sync', 0);
  const q = (LS.get('dcrgym_sync_queue', []) || []).length;
  return 'last synced ' + syncRelTime(t) + (q ? ' · ' + q + ' pending' : '');
}

async function bgSyncToSheets(specificEntry) {
  const s = getSettings();
  if (!s.sheets) return;
  const hist = getHistory();
  if (!hist.length) return;   // never push an empty history over the cloud copy

  // Full restorable state blob — this is what Recover / pullState reads back.
  await postToSheets({ action: 'saveState', history: hist, ts: Date.now() });

  // Readable rows for the just-finished workout. Built from the history record
  // (not live ST), so it stays correct even if the user navigated away.
  const targetEntry = specificEntry || hist[hist.length - 1];
  const rows = historyToWorkoutRows([targetEntry]);
  if (rows.length) await postToSheets({ action: 'syncWorkouts', workouts: rows });
}

async function manualSync() {
  const btn = document.getElementById('sync-now-btn');
  if (btn) { btn.textContent = 'Syncing…'; btn.disabled = true; }
  const s = getSettings();
  if (!s.sheets) { if (btn) { btn.textContent = 'No URL set'; btn.disabled = false; } return; }
  try {
    // PULL BEFORE PUSH — merge cloud in first, then flush queue, backfill, push.
    await pullFromSheets();
    await drainSyncQueue();
    await backfillAllRows();
    await bgSyncToSheets();
    if (btn) { btn.textContent = 'Synced ✓'; setTimeout(()=>{ btn.textContent='Sync Now'; btn.disabled=false; }, 2000); }
  } catch(e) {
    if (btn) { btn.textContent = 'Error'; btn.disabled = false; }
  }
}

async function recoverFromCloud() {
  const btn = document.getElementById('recover-btn');
  const s = getSettings();
  if (!s.sheets) {
    if (btn) { btn.textContent = 'No URL set'; setTimeout(()=>{ btn.textContent='Recover ↓'; }, 2000); }
    return;
  }
  if (btn) { btn.textContent = 'Pulling…'; btn.disabled = true; }
  try {
    const before = getHistory().length;
    await pullFromSheets();
    const after = getHistory().length;
    const added = after - before;
    if (btn) {
      btn.textContent = added > 0 ? `Restored ${added} workout${added!==1?'s':''}` : 'Up to date ✓';
      setTimeout(()=>{ btn.textContent='Recover ↓'; btn.disabled=false; }, 3000);
    }
    if (added > 0) {
      // Refresh home & history screens to reflect recovered data
      renderHome();
      if (ST.screen === 'history') renderHistory();
    }
  } catch(e) {
    if (btn) { btn.textContent = 'Failed'; btn.disabled = false; }
  }
}

function mergeHistories(local, remote) {
  const map = new Map();
  for (const w of local) if (w.id) map.set(w.id, w);
  for (const w of remote) if (w.id && !map.has(w.id)) map.set(w.id, w);
  return [...map.values()].sort((a, b) => (a.endTime||0) - (b.endTime||0));
}


function checkWeekComplete() {
  const progId = ST.defaultProgram;
  if (!progId) return false;
  const prog = PROGRAMS.find(p => p.id === progId);
  if (!prog) return false;
  const weekStart = (() => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); })();
  const doneThisWeek = new Set(getHistory().filter(w => w.programId === progId && w.endTime >= weekStart).map(w => w.sessionId));
  return prog.sessions.every(s => doneThisWeek.has(s.id));
}

// ── Gatekeeper — verifies (and injects if missing) all required UI root elements ──
// ── Synchronous bootstrap — shell is hard-coded in HTML, no dynamic injection ─
// ── Fault-tolerant bootstrap — all state access inside try/catch, LS proxy only ──
function bootstrapApp() {
  console.log('[DCR Gym Shell] Dispatching boot loop...');

  const splash = document.getElementById('splash');
  const home   = document.getElementById('screen-home');
  const nav    = document.getElementById('bottom-nav');

  // Schema migration — versioned, non-destructive, backs up before touching
  // anything. History survives every app update.
  try { migrateStorage(); } catch(e) { console.warn('[DCR Gym Shell] Migration deferred:', e); }

  // Background-flush — the instant the app is backgrounded or killed, the live
  // workout snapshot is written synchronously. Zero-loss guarantee.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') saveNow();
  });
  window.addEventListener('pagehide', () => saveNow());

  // ── System back gesture → in-app navigation (never kills the app) ─────────
  // Overlays unwind first, then screens. Maps() pushes screen states.
  try { history.replaceState({ screen: 'home' }, '', '#home'); } catch(e) {}
  window.addEventListener('popstate', (e) => {
    // 1. An open layer always absorbs the back gesture
    const sheet = document.getElementById('bottom-sheet');
    if (sheet && sheet.classList.contains('visible')) { __closeSheetDom(); return; }
    const mg = document.getElementById('muscle-graph-overlay');
    if (mg && mg.classList.contains('visible')) { _closeMuscleGraphDom(); return; }
    const gb = document.getElementById('graph-backdrop');
    if (gb && gb.style.display === 'flex') { closeProgressGraph(); return; }
    // 2. Then navigate to the state's screen
    const target = (e.state && e.state.screen) || 'home';
    if (target !== ST.screen) {
      window.__navFromPop = true;
      try { Maps(target); } finally { window.__navFromPop = false; }
    }
  });

  // State hydration — fully wrapped, LS proxy handles any storage exceptions
  try {
    ST.defaultProgram = LS.get('dcrgym_default_prog');
    // Auto-migrate URL — replace any old script URL with the current V9 deployment
    const CURRENT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcAKZDYOzbSJ1a5OjqYRo9OyL9OIhEhoos8a4aQE5MB68atj7XAWQeyTuulmB6UFUt/exec';
    const storedSettings = LS.get('dcrgym_settings', null);
    if (storedSettings && storedSettings.sheets && storedSettings.sheets !== CURRENT_SCRIPT_URL) {
      storedSettings.sheets = CURRENT_SCRIPT_URL;
      LS.set('dcrgym_settings', storedSettings);
    }
    getSettings();
    // Fitbit hydration — restore last known values; fetchFitbitData will overwrite on tab open
    const storedFitbit = LS.get('dcrgym_fitbit', null);
    if (storedFitbit && typeof storedFitbit === 'object') {
      // Last-known wins (DCR's call): always restore; the UI labels its age.
      // Never wipe biometrics just because they aren't from today.
      Object.assign(ST.fitbit, storedFitbit);
      ST.fitbit._fetching = false; ST.fitbit._failUntil = 0;
    }
    // Rebuild local bioLog database from history snapshots (cross-device sync)
    try {
      const bioLog = ghGetBioLog();
      let changed = false;
      getHistory().forEach(w => {
        if (w.biometrics && w.endTime) {
          const dateStr = ghLocalDate(w.endTime);
          if (!bioLog[dateStr]) {
            bioLog[dateStr] = w.biometrics;
            changed = true;
          }
        }
      });
      if (changed) {
        LS.set('dcrgym_bio_log', bioLog);
      }
    } catch (e) {
      console.warn('[DCR Gym Shell] Bio-log rebuild error:', e);
    }
  } catch(e) {
    console.warn('[DCR Gym Shell] State hydration fault (non-fatal):', e);
  }

  // Boot-time silent biometric sync — populates the home readiness chip, the
  // finish-screen recovery insight, and Progress-tab plateau footnotes WITHOUT
  // needing to open the AI tab. Guarded + cooldown-aware inside fetchFitbitData.
  if (getSettings().sheets) {
    setTimeout(() => { try { fetchFitbitData(false); } catch (e) {} }, 1200);
  }

  // Service worker — registered with a live OTA update watcher.
  // Updates flow over the air: network-first navigations get new builds on
  // launch; if a deploy lands while the app is OPEN, the chip appears.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      ST.swReg = reg;
      initUpdateWatcher(reg);
    }).catch(() => {});
  }

  // ── Cloud sync on every app open — PULL BEFORE PUSH (never clobber cloud) ──
  // Merge cloud→local first (pull never shrinks local), then flush the queue,
  // backfill readable rows once, and push the complete local history up. Fully
  // non-blocking: any failure here can never break boot or the render path.
  (async () => {
    try {
      await pullFromSheets();
      await drainSyncQueue();
      await backfillAllRows();
      await bgSyncToSheets();
    } catch (e) { /* silent — background op */ }
  })();

  // Dismiss splash — belt-and-suspenders: remove active class, zero z-index
  if (splash) {
    splash.classList.remove('active');
    splash.style.display = 'none';
    splash.style.pointerEvents = 'none';
    splash.style.zIndex = '-1';
  }

  // Routing — uses LS proxy, no raw localStorage calls
  try {
    const _ob = LS.get('dcrgym_onboarded');
    const onboarded = _ob === true || _ob === 'true';

    if (!onboarded) {
      console.log('[DCR Gym Shell] First launch → onboarding');
      onboardStep = 0;
      onboardProg = null;
      renderOnboarding();
    } else {
      console.log('[DCR Gym Shell] Returning user → home');
      if (home) home.style.display = 'block';
      if (nav)  nav.style.display  = 'flex';
      Maps('home');
    }
  } catch(err) {
    console.error('[DCR Gym Shell] Router fault:', err);
    document.body.innerHTML =
      '<div style="padding:40px;font-family:sans-serif;background:#FAF7F2;color:oklch(44% 0.025 55);min-height:100vh">' +
      '<h2 style="font-family:serif;font-style:italic">[System Boot Fault]</h2>' +
      '<p style="margin-top:10px">' + err.message + '</p>' +
      '<pre style="background:#fff;padding:12px;font-size:11px;overflow-x:auto;margin-top:10px">' + (err.stack || '') + '</pre>' +
      '<button onclick="(function(){if(\'caches\' in window){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}; if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}; setTimeout(function(){location.reload(true)},300)})()" style="margin-top:20px;padding:10px 20px;background:#2A2421;color:#fff;border:none;border-radius:8px;cursor:pointer">Clear Cache &amp; Reload</button>' +
      '<p style="margin-top:8px;font-size:11px;color:#888;font-family:sans-serif">Workout history is preserved.</p>' +
      '</div>';
    return;
  }

  // Background sync — idle, never blocks render path
  setTimeout(() => { pullFromSheets().catch(() => {}); }, 2500);
}

// Isolated fail-safe dispatcher — handles all readyState variants on WebKit/Safari
function runBootSequence() {
  console.log('[DCR Gym Shell] Dispatched main boot loop.');
  try {
    bootstrapApp();
  } catch(fatalError) {
    console.error('[DCR Gym Shell] Boot failed:', fatalError);
    document.body.innerHTML =
      '<div style="padding:40px;font-family:sans-serif;background:#FAF7F2;color:oklch(44% 0.025 55);min-height:100vh">' +
      '<h2 style="font-family:serif;font-style:italic">[System Boot Fault]</h2>' +
      '<p style="margin-top:10px">' + fatalError.message + '</p>' +
      '<pre style="background:#fff;padding:12px;font-size:11px;overflow-x:auto;margin-top:10px">' + (fatalError.stack || '') + '</pre>' +
      '<button onclick="(function(){if(\'caches\' in window){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}; if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}; setTimeout(function(){location.reload(true)},300)})()" style="margin-top:20px;padding:10px 20px;background:#2A2421;color:#fff;border:none;border-radius:8px;cursor:pointer">Clear Cache &amp; Reload</button>' +
      '<p style="margin-top:8px;font-size:11px;color:#888;font-family:sans-serif">Workout history is preserved.</p>' +
      '</div>';
  }
}

// Target all document readyState variants — critical for iOS WebView + Safari
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(runBootSequence, 1);
} else {
  window.addEventListener('load', runBootSequence);
}
</script>
