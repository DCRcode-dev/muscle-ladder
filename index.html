  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}


// ── Default swaps (per program slot) ─────────────────────────────────────────
function getSlotDefaults() { return LS.get('dcrgym_slot_defaults', {}) || {}; }
function saveSlotDefaults(d) { LS.set('dcrgym_slot_defaults', d); idbSet('dcrgym_slot_defaults', d); }
function slotDefaultFor(key, ex) {
  const d = getSlotDefaults()[key];
  if (!d || !d.name || !ex) return null;
  if (normalizeEx(d.from || '') !== normalizeEx(stripSuperset(ex.name))) return null; // program changed under this slot
  return d;
}
function applySlotDefaults() {
  if (!ST.workoutSubSource) ST.workoutSubSource = {};
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (!sess) return;
  sess.exercises.forEach((ex, i) => {
    const key = `${sess.id}_${i}`;
    if (ST.workoutSubs[key]) return;
    const d = slotDefaultFor(key, ex);
    if (!d || ST.blacklistedExercises.has(normalizeEx(d.name))) return;
    if (ST.travelMode && TRAVEL_MAP[normalizeEx(stripSuperset(ex.name))]) return; // hotel gym can't honour a machine default
    ST.workoutSubs[key] = d.name;
    ST.workoutSubMeta[key] = { sets: d.sets || ex.workingSets || 3, reps: String(d.reps || ex.reps || '8–10') };
    ST.workoutSubSource[key] = 'default';
  });
}
function clearDefaultSubsWithoutSets() {
  if (!ST.workoutSubSource) return;
  for (const [key, src] of Object.entries(ST.workoutSubSource)) {
    if (src !== 'default') continue;
    const logged = (ST.workoutSets[key] || []).some(s => s && s.r > 0);
    if (logged) continue;
    delete ST.workoutSubs[key]; delete ST.workoutSubMeta[key]; delete ST.workoutSubSource[key];
  }
}
// Exercises used in this slot before (history), newest first.
function pastPicksForSlot(key, originalName) {
  const out = [], seen = new Set([normalizeEx(originalName)]);
  const hist = getHistory().filter(w => w && w.sets).sort((a, b) => (b.endTime || 0) - (a.endTime || 0));
  for (const w of hist) {
    const sets = w.sets[key];
    if (!Array.isArray(sets)) continue;
    const nm = resolveWorkoutSetExName(w, key, sets);
    if (!nm || seen.has(normalizeEx(nm))) continue;
    if (!sets.some(s => s && s.r > 0)) continue;
    seen.add(normalizeEx(nm)); out.push(nm);
  }
  const d = getSlotDefaults()[key];
  if (d && d.name && !seen.has(normalizeEx(d.name))) out.unshift(d.name);
  return out;
}

// ── Custom exercises ─────────────────────────────────────────────────────────
function getCustomExercises() { const c = LS.get('dcrgym_custom_exercises', []); return Array.isArray(c) ? c : []; }
function mergeCustomExercises() {
  const have = new Set(EXERCISE_LIBRARY.map(it => normalizeEx(it.name)));
  let added = 0;
  for (const c of getCustomExercises()) {
    if (!c || !c.name || have.has(normalizeEx(c.name))) continue;
    EXERCISE_LIBRARY.push({ name: c.name, muscle: c.muscle || 'Other', subMuscle: c.subMuscle || c.muscle || 'Other', tag: 'Gym', custom: true, equip: c.equip || undefined });
    MUSCLE_MAP[normalizeEx(c.name)] = c.muscle || 'Other';
    have.add(normalizeEx(c.name)); added++;
  }
  if (added) EXERCISE_LIBRARY.sort((a, b) => a.name.localeCompare(b.name));
  return added;
}
function saveCustomExercise(name, muscle, subMuscle) {
  const list = getCustomExercises();
  if (!list.some(c => normalizeEx(c.name) === normalizeEx(name))) list.push({ name, muscle, subMuscle, createdAt: Date.now() });
  LS.set('dcrgym_custom_exercises', list); idbSet('dcrgym_custom_exercises', list);
  mergeCustomExercises();
}

// Search: tokens in any order + gym shorthand.
const LIB_SHORTHAND = { db: 'dumbbell', bb: 'barbell', sm: 'smith', kb: 'kettlebell', ohp: 'overhead press', rdl: 'romanian deadlift', sa: 'single arm', cs: 'chest supported', ez: 'ez bar', sl: 'single leg', ext: 'extension', lat: 'lat', tri: 'triceps', bi: 'biceps', delt: 'delt', hs: 'hammer strength' };
function libMatches(it, query) {
  const q = normalizeEx(query || '');
  if (!q) return true;
  const hay = ' ' + normalizeEx([it.name, it.muscle, it.subMuscle, it.tag, equipOf(it)].join(' ')) + ' ';
  return q.split(' ').every(t => {
    const exp = LIB_SHORTHAND[t];
    if (exp) return exp.split(' ').every(x => hay.indexOf(x) !== -1) || hay.indexOf(' ' + t) !== -1;
    return hay.indexOf(t) !== -1;
  });
}

// "last Tue" / "3d ago" — quiet relative date for the card memory chip
function relDay(ts) {
  if (!ts) return '';
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 7) return 'last ' + new Date(ts).toLocaleDateString('en-GB', { weekday: 'short' });
  if (days < 30) return Math.floor(days / 7) + 'w ago';
  return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function getStats() {
  const hist = getHistory();
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const weekStart = (() => { const d = new Date(now); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); })();
  const thisMonth = hist.filter(w => workoutDayTs(w) >= monthStart && !w._dupOf).length;
  const thisWeekVol = hist.filter(w => workoutDayTs(w) >= weekStart).reduce((sum, w) => sum + workoutVolume(w), 0);
  // Streak: count consecutive weeks with at least 1 workout
  let streak = 0;
  const msPerWeek = 7*24*3600*1000;
  let checkWeek = weekStart;
  for (let i = 0; i < 52; i++) {
    const inWeek = hist.some(w => !w._dupOf && workoutDayTs(w) >= checkWeek && workoutDayTs(w) < checkWeek + msPerWeek);
    if (inWeek) { streak++; checkWeek -= msPerWeek; }
    else break;
  }
  return { thisMonth, streak, weekVol: Math.round(thisWeekVol) };
}

function getNextSession() {
  const dp = ensureActiveProgram();
  if (!dp) return null;
  const prog = PROGRAMS.find(p => p.id === dp);
  if (!prog) return null;
  const allHist = getHistory();
  const rot = getProgramRotationState(prog, allHist);
  if (rot.isFirst || !rot.nextSession) return { prog, session: prog.sessions[0], isFirst: true };
  const session = rot.nextSession;
  const sessHist = allHist.filter(w => isCompletedProgramWorkout(w, dp) && w.sessionId === session.id && workoutDuration(w) && !w._durSuspect);
  const avgDur = sessHist.length > 0 ? Math.round(sessHist.reduce((s,w)=>s+workoutDuration(w),0)/sessHist.length) : null;
  return { prog, session, avgDur, isFirst: false };
}

function getWeeklyVolumeByMuscle(programId) {
  const prog = PROGRAMS.find(p => p.id === programId);
  if (!prog) return {};
  // Target: sum of all sets across all sessions for each muscle group
  const targets = {};
  for (const sess of prog.sessions) {
    for (const ex of sess.exercises) {
      const muscle = getMuscle(stripSuperset(ex.name));
      if (!targets[muscle]) targets[muscle] = 0;
      targets[muscle] += ex.workingSets || 0;
    }
  }
  // Actual: active rotation-pass workouts (and any completed this week) so Sunday never wipes an in-progress rotation
  const allHist = getHistory();
  const rot = getProgramRotationState(prog, allHist);
  const weekStart = (() => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); })();
  const activeWorkoutsMap = new Map();
  const rotWorkouts = (rot.justCompletedFullCycle && rot.lastWorkout && (Date.now() - (rot.lastWorkout.endTime || 0) < 18 * 3600 * 1000))
    ? rot.cycleWorkouts
    : Object.values(rot.doneMap || {}).map(d => d.workout).filter(Boolean);
  for (const w of rotWorkouts) {
    if (w && w.id) activeWorkoutsMap.set(String(w.id), w);
  }
  for (const w of allHist) {
    if (isCompletedProgramWorkout(w, programId) && workoutDayTs(w) >= weekStart) {
      activeWorkoutsMap.set(String(w.id), w);
    }
  }
  const actuals = {};
  for (const w of activeWorkoutsMap.values()) {
    if (!w || !w.sets) continue;
    const wp = PROGRAMS.find(p => p.id === w.programId);
    if (!wp) continue;
    const ws = wp.sessions.find(s => s.id === w.sessionId);
    if (!ws) continue;
    for (const [key, sets] of Object.entries(w.sets)) {
      if (key.endsWith('_wu')) continue;   // warm-ups never count toward volume
      const exIdx = parseInt(key.split('_').pop());
      const ex = ws.exercises[exIdx];
      for (const set of sets) {
        if (!set || !set.r) continue;
        // Stamped _name wins — substituted/travel sets credit the RIGHT muscle
        const nm = set._name || (ex && stripSuperset(ex.name));
        if (!nm) continue;
        const muscle = getMuscle(nm);
        if (!actuals[muscle]) actuals[muscle] = 0;
        actuals[muscle] += 1;
      }
    }
  }
  return { targets, actuals };
}

function getMuscleProgress() {
  const hist = getHistory();
  const muscles = ['Chest','Back','Quads','Hamstrings','Shoulders','Biceps','Triceps','Glutes','Calves','Core'];
  const fourWeeksAgo = Date.now() - 28*24*3600*1000;
  const result = {};
  for (const muscle of muscles) {
    // Group by week, get best 1RM per week
    const weekData = {};
    for (const w of hist) {
      if (!w.sets || w.endTime < fourWeeksAgo) continue;
      const weekKey = Math.floor(w.endTime / (7*24*3600*1000));
      const prog = PROGRAMS.find(p => p.id === w.programId);
      if (!prog) continue;
      const sess = prog.sessions.find(s => s.id === w.sessionId);
      if (!sess) continue;
      for (const [key, sets] of Object.entries(w.sets)) {
        if (key.endsWith('_wu')) continue;
        const exIdx = parseInt(key.split('_').pop());
        const ex = sess.exercises[exIdx];
        for (const set of sets) {
          if (!set || !set.r) continue;
          const nm = set._name || (ex && stripSuperset(ex.name));
          if (!nm || getMuscle(nm) !== muscle) continue;
          const rm = epley1RM(set.w||0, set.r||0);
          if (!weekData[weekKey] || rm > weekData[weekKey]) weekData[weekKey] = rm;
        }
      }
    }
    const weeks = Object.keys(weekData).sort((a,b)=>a-b);
    const values = weeks.map(w => weekData[w]);
    const latest = values[values.length-1] || 0;
    const prev = values[values.length-2] || 0;
    const flat3 = values.length >= 3 && values[values.length-1] <= values[values.length-2] && values[values.length-2] <= values[values.length-3];
    const flat2 = values.length >= 2 && values[values.length-1] <= values[values.length-2];
    const lastWorked = hist.filter(w => {
      if (!w.sets) return false;
      const p=PROGRAMS.find(pp=>pp.id===w.programId); if(!p) return false;
      const s=p.sessions.find(ss=>ss.id===w.sessionId); if(!s) return false;
      return Object.entries(w.sets).some(([key, sets])=>{
        if (key.endsWith('_wu')) return false;
        const i=parseInt(key.split('_').pop()); const ex=s.exercises[i];
        const nm = (Array.isArray(sets) && (sets.find(x=>x&&x._name)||{})._name) || (ex && stripSuperset(ex.name));
        return nm && getMuscle(nm)===muscle;
      });
    }).sort((a,b)=>b.endTime-a.endTime)[0];
    const daysSince = lastWorked ? Math.floor((Date.now()-lastWorked.endTime)/(24*3600*1000)) : 99;
    let dot = 'green';
    if (flat3 || daysSince >= 7) dot = 'red';
    else if (flat2) dot = 'amber';
    result[muscle] = { values, latest, dot, daysSince };
  }
  // Sort: red first, amber, green
  const order = {red:0, amber:1, green:2};
  return Object.entries(result).sort((a,b)=>order[a[1].dot]-order[b[1].dot]).map(([m,d])=>({muscle:m,...d}));
}

function checkDeload() {
  if (!ST.defaultProgram) return false;
  const hist = getHistory().filter(w => w.programId === ST.defaultProgram).sort((a,b)=>a.endTime-b.endTime);
  const prog = PROGRAMS.find(p => p.id === ST.defaultProgram);
  if (!prog) return false;
  const total = prog.sessions.length;
  if (hist.length < total * 4) return false;
  // Check last 4×sessions are all same program in order
  const recent = hist.slice(-total*4);
  let cycles = 0, idx = 0;
  for (const w of recent) {
    if (w.sessionId === prog.sessions[idx % total].id) { idx++; if (idx % total === 0) cycles++; }
    else { idx = 0; cycles = 0; }
  }
  return cycles >= 4;
}

function checkMilestone() {
  const total = getHistory().length;
  if ([1,10,25,50,100].includes(total)) return total;
  return null;
}


// ── Sound ─────────────────────────────────────────────────────────────────────
// ── Designed sound — Apple-quiet synthesis, zero file weight ─────────────────
// One shared voice helper: filtered sine/triangle partials with soft attack and
// natural exponential decay. No sawtooth, no square, no distortion — ever.
function _voice(ctx, { freq, type = 'sine', vol = 0.1, at = 0, attack = 0.004, decay = 0.22, cutoff = 4200, detune = 0 }) {
  const t0 = ctx.currentTime + at;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const f = ctx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t0); f.Q.value = 0.4;
  o.type = type; o.frequency.setValueAtTime(freq, t0); o.detune.value = detune;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  o.connect(f); f.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + attack + decay + 0.05);
}

function playSound(type) {
  const s = getSettings();
  if (!s.sound) return;
  try {
    if (!ST.audioCtx) ST.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = ST.audioCtx;
    if (ctx.state === 'suspended') ctx.resume().catch(()=>{});

    if (type === 'set') {
      // Soft glass tick — a fingernail on crystal
      _voice(ctx, { freq: 1320, vol: 0.25, decay: 0.085, cutoff: 5200 });
      _voice(ctx, { freq: 2640, vol: 0.08, decay: 0.055, cutoff: 6000 });
    } else if (type === 'chime') {
      // High-presence gym/headphone chime: crisp 3-tone ascending alert sequence (A5 → D6 → A6)
      for (let i = 0; i < 2; i++) {
        const delay = i * 0.75;
        _voice(ctx, { freq: 880,    type: 'triangle', vol: 0.65, at: delay + 0,    decay: 0.28, cutoff: 4200 });
        _voice(ctx, { freq: 1760,   type: 'sine',     vol: 0.25, at: delay + 0,    decay: 0.18, cutoff: 5200 });
        _voice(ctx, { freq: 1174.7, type: 'triangle', vol: 0.70, at: delay + 0.16, decay: 0.32, cutoff: 4400 });
        _voice(ctx, { freq: 2349.3, type: 'sine',     vol: 0.25, at: delay + 0.16, decay: 0.20, cutoff: 5400 });
        _voice(ctx, { freq: 1760,   type: 'triangle', vol: 0.75, at: delay + 0.32, decay: 0.45, cutoff: 4600 });
        _voice(ctx, { freq: 3520,   type: 'sine',     vol: 0.25, at: delay + 0.32, decay: 0.28, cutoff: 5800 });
      }
    } else if (type === 'finish') {
      // Muted swell — three stacked warm partials, slow bloom
      _voice(ctx, { freq: 440,  type: 'triangle', vol: 0.35, attack: 0.10, decay: 0.70, cutoff: 1900 });
      _voice(ctx, { freq: 554.4, type: 'triangle', vol: 0.25, at: 0.06, attack: 0.10, decay: 0.66, cutoff: 2100 });
      _voice(ctx, { freq: 659.3, type: 'sine',     vol: 0.20, at: 0.12, attack: 0.10, decay: 0.62, cutoff: 2300 });
    }
  } catch(e){}
}

// ── Rest timer ────────────────────────────────────────────────────────────────
function startRestTimer(seconds, exName, nextText, afterText, isLast) {
  if (ST.restGoTimeout) { clearTimeout(ST.restGoTimeout); ST.restGoTimeout = null; }
  if (ST.restHapticInterval) { clearInterval(ST.restHapticInterval); ST.restHapticInterval = null; }
  if (document.activeElement && typeof document.activeElement.blur === 'function') {
    document.activeElement.blur();
  }
  const endTime = Date.now() + seconds * 1000;
  ST.restActive    = true;
  ST.restExpired   = false;
  ST.restDuration  = seconds;   // full duration for ring progress
  ST.restEndTime   = endTime;
  ST.restExName    = exName;
  ST.restNextText  = nextText  || '';
  ST.restAfterText = afterText || '';
  ST.restIsLast    = !!isLast;
  document.body.classList.add('rest-active');
  LS.set('dcrgym_rest_end',  endTime);
  LS.set('dcrgym_rest_dur',  seconds);
  LS.set('dcrgym_rest_next', nextText || '');

  if (ST.swReg && ST.notifEnabled && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      type: 'SCHEDULE_NOTIFICATION', delay: seconds * 1000
    });
  }

  if (ST.restTicker) clearInterval(ST.restTicker);
  ST.restTicker = setInterval(tickRest, 200);

  renderRestIsland();
}

function addRestTime(secs) {
  if (!ST.restActive) return;
  ST.restEndTime += secs * 1000;
  ST.restDuration = (ST.restDuration || 0) + secs;
  LS.set('dcrgym_rest_end', ST.restEndTime);
  LS.set('dcrgym_rest_dur', ST.restDuration);
  const remaining = Math.ceil((ST.restEndTime - Date.now()) / 1000);
  const el = document.getElementById('rest-countdown');
  if (el) el.textContent = formatDuration(remaining);
  updateRestHudRing(remaining);
  if (ST.swReg && ST.notifEnabled && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      type: 'SCHEDULE_NOTIFICATION', delay: Math.max(0, ST.restEndTime - Date.now())
    });
  }
}

function cancelRestTimer() {
  ST.restActive = false;
  ST.restExpired = false;
  document.body.classList.remove('rest-active');
  LS.remove('dcrgym_rest_end');
  if (ST.restTicker) { clearInterval(ST.restTicker); ST.restTicker = null; }
  if (ST.restGoTimeout) { clearTimeout(ST.restGoTimeout); ST.restGoTimeout = null; }
  if (ST.restHapticInterval) { clearInterval(ST.restHapticInterval); ST.restHapticInterval = null; }
  if (navigator.serviceWorker && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({ type: 'CANCEL_NOTIFICATION' });
  }
  const island = document.getElementById('rest-island');
  if (island) island.classList.remove('visible', 'expanded', 'go');
}

function tickRest() {
  const remaining = Math.ceil((ST.restEndTime - Date.now()) / 1000);
  if (remaining <= 0) { restExpire(); return; }
  const el = document.getElementById('rest-countdown');
  if (el) el.textContent = formatDuration(remaining);
  updateRestHudRing(remaining);
}

// Expiry — the capsule morphs to the green GO state instead of vanishing,
// auto-expanding to show what's next, then dismisses itself.
function restExpire() {
  if (ST.restExpired) return;
  ST.restExpired = true;
  if (ST.restTicker) { clearInterval(ST.restTicker); ST.restTicker = null; }
  LS.remove('dcrgym_rest_end');
  playSound('chime');
  haptic('restDone');
  
  // Consistent pulsing haptic vibration: repeats every 1.2s for 4 cycles
  let pulses = 0;
  if (ST.restHapticInterval) clearInterval(ST.restHapticInterval);
  ST.restHapticInterval = setInterval(() => {
    pulses++;
    if (pulses >= 4 || !ST.restExpired) {
      clearInterval(ST.restHapticInterval);
      ST.restHapticInterval = null;
      return;
    }
    haptic('restDone');
  }, 1200);

  const island = document.getElementById('rest-island');
  const cd = document.getElementById('rest-countdown');
  const nx = document.getElementById('ri-next');
  if (cd) cd.textContent = 'GO';
  if (nx && !nx.textContent) nx.textContent = ST.restNextText || '';
  if (island) { island.classList.add('go'); island.classList.remove('expanded'); }
  const fill = document.getElementById('rest-hud-fill');
  if (fill) fill.style.strokeDashoffset = '0';
  ST.restGoTimeout = setTimeout(() => cancelRestTimer(), 7000);
}

function toggleRestIsland(e) {
  const island = document.getElementById('rest-island');
  if (!island) return;
  if (island.classList.contains('go')) { cancelRestTimer(); return; }
  haptic('tick');
  island.classList.toggle('expanded');
}

function initRestHudRing() {
  // Pre-compute strokeDasharray for the capsule ring (r=15, circ = 2πr)
  const r = 15, circ = 2 * Math.PI * r;
  const fill = document.getElementById('rest-hud-fill');
  if (fill) {
    fill.style.strokeDasharray  = circ.toFixed(2);
    fill.style.strokeDashoffset = '0'; // starts full
  }
}

function renderRestIsland() {
  const island = document.getElementById('rest-island');
  if (!island) return;
  const remaining = Math.ceil((ST.restEndTime - Date.now()) / 1000);
  if (remaining <= 0) { island.classList.remove('visible', 'expanded', 'go'); return; }
  ST.restExpired = false;
  island.classList.remove('go', 'expanded');
  const nx = document.getElementById('ri-next');
  if (nx) nx.textContent = ST.restNextText || '';
  if (!island.classList.contains('visible')) {
    requestAnimationFrame(() => island.classList.add('visible'));
  }
  const cd = document.getElementById('rest-countdown');
  if (cd) cd.textContent = formatDuration(remaining);
  initRestHudRing();
  updateRestHudRing(remaining);
}
// Legacy name — some render paths still call this
function renderRestBanner() { renderRestIsland(); }

function updateRestHudRing(remaining) {
  const fill = document.getElementById('rest-hud-fill');
  const r = 15, circ = 2 * Math.PI * r;
  if (fill && ST.restDuration > 0) {
    const pct = Math.max(0, Math.min(1, remaining / ST.restDuration));
    fill.style.strokeDashoffset = (circ * (1 - pct)).toFixed(2);
  }
}

// ── OTA update watcher — no more uninstall/reinstall, ever ──────────────────
// 1. Boot: if a new worker is already waiting, offer the restart chip.
// 2. updatefound: a deploy landed while the app is open → chip when ready.
// 3. Foregrounding the app re-checks for updates (throttled to 15 min).
// 4. Chip tap → SKIP_WAITING → controllerchange → seamless reload.
//    Never auto-reloads mid-workout — the user chooses the moment.
let _updateAccepted = false;
let _lastUpdateCheck = 0;

function initUpdateWatcher(reg) {
  if (reg.waiting && navigator.serviceWorker.controller) showUpdateChip();

  reg.addEventListener('updatefound', () => {
    const nw = reg.installing;
    if (!nw) return;
    nw.addEventListener('statechange', () => {
      if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateChip();
    });
  });

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (_updateAccepted) location.reload();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - _lastUpdateCheck < 15 * 60 * 1000) return;
    _lastUpdateCheck = Date.now();
    reg.update().catch(() => {});
  });
  reg.update().catch(() => {});
  _lastUpdateCheck = Date.now();
}

function showUpdateChip() {

  chip.onclick = acceptUpdate;

function acceptUpdate() {
  // Guard the live workout — everything is in localStorage already (saveNow),
  // but don't yank the floor mid-set without saving one last time.
  saveNow();
  _updateAccepted = true;
  haptic('tick');
  const reg = ST.swReg;
  if (reg && reg.waiting) {
    reg.waiting.postMessage({ type: 'SKIP_WAITING' });
  } else {
    location.reload();
  }
  const chip = document.getElementById('update-chip');
  if (chip) { chip.textContent = 'Restarting…'; chip.disabled = true; }
}

function checkForUpdateManual() {
  const reg = ST.swReg;
  if (!reg) { noticeSheet('Updates', 'Service worker not ready yet — try again in a moment.'); return; }
  _lastUpdateCheck = Date.now();
  reg.update().then(() => {
    setTimeout(() => {
      if (reg.waiting || reg.installing) showUpdateChip();
      else noticeSheet('Up to date', `You're on the latest build (${APP_BUILD}). New deploys also install themselves on the next launch.`);
    }, 1200);
  }).catch(() => noticeSheet('Updates', 'Could not reach the server — check your connection.'));
}

// ── Count-up ticker — numbers feel alive, never jumpy ────────────────────────
function countUp(el, target, opts = {}) {
  if (!el) return;
  const dur = opts.dur || 600;
  const decimals = opts.decimals || 0;
  const prefix = opts.prefix || '';
  const suffix = opts.suffix || '';
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.textContent = prefix + target.toFixed(decimals) + suffix;
    return;
  }
  const t0 = performance.now();
  function frame(t) {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 4);
    el.textContent = prefix + (target * eased).toFixed(decimals) + suffix;
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// Run count-up on every [data-count] element inside a container
function tickStats(container) {
  (container || document).querySelectorAll('[data-count]').forEach(el => {
    const raw = el.getAttribute('data-count');
    const target = parseFloat(raw);
    if (isNaN(target)) return;
    const suffix = el.getAttribute('data-suffix') || '';
    const decimals = raw.includes('.') ? 1 : 0;
    countUp(el, target, { suffix, decimals });
  });
}

// ── Haptic vocabulary — the hand learns the language without looking ────────
function haptic(type) {
  if (!navigator.vibrate) return;
  const P = {
    tick:      8,                              // feather: taps, toggles
    set:       [14, 40, 22],                   // crisp double-pulse: set logged
    exercise:  [16, 50, 16, 50, 32],           // rising triple: exercise complete
    restDone:  [300, 100, 300, 100, 400], // insistent: rest expired
    finish:    [24, 60, 24, 60, 24, 60, 90],   // celebration wave
    milestone: [30, 70, 30, 70, 30, 70, 150],  // long milestone wave
    pr:        [30, 50, 30, 50, 120],          // ota-34: new record, a rising burst
    nav:       6,                              // ota-34: tab change
    undo:      [10, 30, 10],                   // ota-34: set taken back
    saved:     [18, 60, 40],                   // ota-34: workout saved (Finish pressed / auto-finish)
  };
  try { navigator.vibrate(P[type] !== undefined ? P[type] : 10); } catch(e) {}
}

// ── Navigation ────────────────────────────────────────────────────────────────
const SCREENS = ['home','prog','session','workout','history','settings','workouts-browser'];

// ── Navigation tab order for slide direction resolution ─────────────────────
const SCREEN_ORDER = ['home', 'workouts-browser', 'history'];
let _transitionTimer = null;

function Maps(to, data={}) {
  const from = ST.screen;
  ST.screen = to;
  if (from && from !== to && SCREEN_ORDER.includes(to)) haptic('nav');   // ota-34 (10)
  if (typeof closeNumpad === 'function') closeNumpad();

  // Cancel any pending transition cleanup timer from a rapid previous navigation
  if (_transitionTimer) {
    clearTimeout(_transitionTimer);
    _transitionTimer = null;
  }

  // Render content into the destination screen BEFORE transition fires
  if (to === 'home')                  renderHome();
  else if (to === 'prog')             renderProg(data);
  else if (to === 'session')          renderSession(data);
  else if (to === 'workout')          renderWorkout();
  else if (to === 'history')          renderHistory();
  else if (to === 'settings')         renderSettings();
  else if (to === 'workouts-browser') renderWorkoutsBrowser();

  // Status bar melts seamlessly into the screen across all screens
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  if (themeMeta) themeMeta.setAttribute('content', '#FAF7F2');

  // Nav stays visible during workouts — browse history/weights mid-rest freely.
  // The live session keeps running; the workout pill brings you back.
  const nav = document.getElementById('bottom-nav');
  if (nav) nav.style.display = 'flex';
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset && b.dataset.nav === to);
  });

  updateWorkoutPill();

  // History API — Android's system back gesture navigates the app instead of
  // killing it. Overlays replace their temporary state so they don't corrupt history.
  if (!window.__navFromPop) {
    try {
      if (history.state && history.state.overlay) {
        history.replaceState({ screen: to }, '', '#' + to);
      } else if (!(history.state && history.state.screen === to)) {
        history.pushState({ screen: to }, '', '#' + to);
      }
    } catch(e) {}
  }

  // ── Kinetic transition engine ───────────────────────────────────────────────
  const fromEl = from ? document.getElementById('screen-' + from) : null;
  const toEl   = document.getElementById('screen-' + to);
  if (!toEl) return;
  // ota-34 (11): cards rise in softly when a tab opens (CSS; off with reduced motion)
  if (from && from !== to && SCREEN_ORDER.includes(to)) { toEl.classList.remove('tab-enter'); void toEl.offsetWidth; toEl.classList.add('tab-enter'); setTimeout(() => toEl.classList.remove('tab-enter'), 700); }

  // Instantly hide all screens that are neither source nor destination
  for (const id of SCREENS) {
    if (id !== from && id !== to) {
      const el = document.getElementById('screen-' + id);
      if (el) {
        el.style.display = 'none';
        el.classList.remove('active', 'slide-out-left', 'slide-out-right',
                                     'slide-in-left',  'slide-in-right');
      }
    }
  }

  if (!fromEl || from === to || from === null) {
    // First paint — no animation needed
    toEl.style.display = 'block';
    toEl.classList.remove('slide-out-left', 'slide-out-right', 'slide-in-left', 'slide-in-right');
    toEl.classList.add('active');
    return;
  }

  // Determine slide direction from the tab order
  const fromOrd = SCREEN_ORDER.indexOf(from);
  const toOrd   = SCREEN_ORDER.indexOf(to);
  const fromIsTab = SCREEN_ORDER.includes(from);
  const toIsTab   = SCREEN_ORDER.includes(to);
  let goRight = true;
  if (fromIsTab && toIsTab) {
    goRight = toOrd > fromOrd;
  } else if (!fromIsTab && toIsTab) {
    goRight = false;
  } else if (fromIsTab && !toIsTab) {
    goRight = true;
  } else {
    goRight = (to === 'workout');
  }

  // Phase 1 — Position incoming screen off-canvas (no transition yet)
  toEl.style.transition = 'none';
  toEl.style.display = 'block';
  toEl.classList.remove('active', 'slide-out-left', 'slide-out-right');
  toEl.classList.add(goRight ? 'slide-in-right' : 'slide-in-left');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      // Phase 2 — Restore transitions and animate simultaneously
      toEl.style.transition = '';
      fromEl.style.transition = '';
      fromEl.classList.remove('active');
      fromEl.classList.add(goRight ? 'slide-out-left' : 'slide-out-right');
      toEl.classList.remove('slide-in-right', 'slide-in-left');
      toEl.classList.add('active');

      // Phase 3 — Cleanup outgoing screen after transition completes
      _transitionTimer = setTimeout(() => {
        _transitionTimer = null;
        if (ST.screen === to && fromEl) {
          fromEl.style.display = 'none';
          fromEl.classList.remove('slide-out-left', 'slide-out-right');
        }
      }, 290);
    });
  });
}

function updateWorkoutPill() {
  const pill = document.getElementById('workout-pill');
  if (!pill) return;
  const hasActive = ST.currentProgram && ST.workoutStart && ST.durationTimer;
  const onWorkout = ST.screen === 'workout';
  if (hasActive && !onWorkout) {
    const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
    const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
    const nameEl = document.getElementById('pill-session-name');
    if (nameEl) nameEl.textContent = sess ? sess.name : 'Workout';
    const durEl = document.getElementById('pill-dur');
    if (durEl) durEl.textContent = formatDuration(ST.durationSecs);
    pill.classList.add('visible');
  } else {
    pill.classList.remove('visible');
  }
}

function getMuscleVolumeHistory(muscle) {
  const hist = getHistory();
  const now = Date.now();
  const msW = 7 * 24 * 3600 * 1000;
  return Array.from({ length: 5 }, (_, i) => {
    const wStart = now - (4 - i + 1) * msW;
    const wEnd   = i === 4 ? (now + 86400000) : (now - (4 - i) * msW);
    let sets = 0;
    for (const w of hist) {
      if (w.endTime < wStart || w.endTime >= wEnd || !w.sets || w._dupOf) continue;
      for (const [key, s] of Object.entries(w.sets)) {
        if (key.endsWith('_wu') || !Array.isArray(s) || s.length === 0) continue;
        const exName = resolveWorkoutSetExName(w, key, s);
        if (exName && getMuscle(exName) === muscle) {
          sets += s.filter(x => x && x.r > 0).length;
        }
      }
    }
    const labels = ['W-4','W-3','W-2','Last','This'];
    return { label: labels[i], sets };
  });
}

// ── e1RM helpers (Epley: weight × (1 + reps/30)) ─────────────────────────────
function calcE1RM(weight, reps) {
  if (!weight || !reps || reps <= 0) return 0;
  return Math.round(weight * (1 + reps / 30));
}

// Top set = heaviest weight; ties broken by highest reps
function getTopSetE1RM(sets) {
  if (!sets || !sets.length) return 0;
  const valid = sets.filter(s => s && s.w > 0 && s.r > 0 && !s._suspect);
  if (!valid.length) return 0;
  const top = valid.reduce((best, s) => {
    if (s.w > best.w) return s;
    if (s.w === best.w && s.r > best.r) return s;
    return best;
  }, valid[0]);
  return calcE1RM(top.w, top.r);
}

// Session aggregate e1RM = sum of all exercises' top-set e1RM
// excludes _wu warm-up keys
function getSessionE1RM(histEntry, prog) {
  if (!histEntry || !histEntry.sets || !prog) return 0;
  const sess = prog.sessions.find(s => s.id === histEntry.sessionId);
  if (!sess) return 0;
  let total = 0;
  for (const [key, sets] of Object.entries(histEntry.sets)) {
    if (key.endsWith('_wu')) continue;  // exclude warm-up sets
    total += getTopSetE1RM(sets);
  }
  return total;
}

// Returns the previous history entry for the same sessionId (excluding current)
function getPrevSessionEntry(sessionId, excludeId) {
  const hist = getHistory()
    .filter(w => isCompletedProgramWorkout(w) && w.sessionId === sessionId && String(w.id) !== String(excludeId))
    .sort((a, b) => (b.endTime || 0) - (a.endTime || 0));
  return hist[0] || null;
}

function getEpleyOverloadByMuscle(muscle, numWeeks = 5) {
  const hist = getHistory();
  const now = Date.now();
  const msW = 7 * 24 * 3600 * 1000;
  const exPeaks = {};      // latest-week per-exercise e1RM peaks (driver insight)
  const prevExPeaks = {};  // prior-week peaks for the delta
  const weeks = Array.from({ length: numWeeks }, (_, i) => {
    const wStart = now - (numWeeks - i) * msW;
    const wEnd   = i === numWeeks - 1 ? (now + 86400000) : (now - (numWeeks - 1 - i) * msW);
    let peakE1RM = 0;
    for (const w of hist) {
      if (w.endTime < wStart || w.endTime >= wEnd || !w.sets) continue;
      const prog = PROGRAMS.find(p => p.id === w.programId);
      const sess = prog && prog.sessions.find(s => s.id === w.sessionId);
      for (const [key, sets] of Object.entries(w.sets)) {
        if (key.endsWith('_wu') || !Array.isArray(sets)) continue;
        const exIdx = parseInt(key.split('_').pop());
        const ex = sess && sess.exercises[exIdx];
        // Stamped _name wins — substituted sets feed the right muscle's curve
        const nm = ((sets.find(x => x && x._name) || {})._name) || (ex && stripSuperset(ex.name));
        if (!nm || getMuscle(nm) !== muscle) continue;
        const e = getTopSetE1RM(sets);
        if (e > peakE1RM) peakE1RM = e;
        if (i === numWeeks - 1 && e > (exPeaks[nm] || 0)) exPeaks[nm] = e;
        if (i === numWeeks - 2 && e > (prevExPeaks[nm] || 0)) prevExPeaks[nm] = e;
      }
    }
    const d = new Date(wStart + msW / 2);
    return {
      label: `w${i + 1}`,
      dateLabel: d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }),
      value: peakE1RM,
    };
  });
  // Driver — which lift is moving this muscle's index
  let driver = null;
  const top = Object.entries(exPeaks).sort((a, b) => b[1] - a[1])[0];
  if (top) {
    const prev = prevExPeaks[top[0]] || 0;
    driver = { name: top[0], e1rm: top[1], delta: prev > 0 ? Math.round((top[1] - prev) * 10) / 10 : null };
  }
  return { weeks, driver };
}

function openMuscleGraph(eOrMuscle, muscleOpt) {

const MG_MUSCLES = ['Chest','Back','Shoulders','Biceps','Triceps','Core','Glutes','Quads','Hamstrings','Calves','Traps'];

function getTopExercisesForMuscle(muscle) {
  const hist = getHistory();
  const unit = getWeightUnit();
  const map = {};
  for (const w of hist) {
    if (!w.sets) continue;
    for (const [key, sets] of Object.entries(w.sets)) {
      if (key.endsWith('_wu') || !Array.isArray(sets)) continue;
      const name = resolveWorkoutSetExName(w, key, sets);
      if (!name || getMuscle(name) !== muscle) continue;
      const validSets = sets.filter(s => s && s.r > 0 && s.w > 0);
      if (validSets.length === 0) continue;
      const topSet = [...validSets].sort((a,b) => (b.w * (1 + b.r/30)) - (a.w * (1 + a.r/30)))[0];
      const e1rm = Math.round(topSet.w * (1 + topSet.r / 30));
      if (!map[name] || e1rm > map[name].e1rm) {
        map[name] = { name, bestSet: `${formatWeight(dispW(topSet.w))} ${unit} × ${topSet.r}`, e1rm, date: w.endTime };
      }
    }
  }
  return Object.values(map).sort((a,b) => b.e1rm - a.e1rm).slice(0, 3);
}

function renderMuscleGraphContent() {
  const muscle = ST.mgMuscle || 'Chest';
  const numWeeks = ST.mgRange || 5;
  const { weeks, driver } = getEpleyOverloadByMuscle(muscle, numWeeks);
  const vals  = weeks.map(w => w.value);
  const peak  = Math.max(...vals, 0);
  const thisWk = vals[vals.length - 1] || 0;
  const prevWk = vals[vals.length - 2] || 0;
  const hasData = vals.filter(v => v > 0).length >= 2;
  const unit = getWeightUnit();

  // Delta calculation
  let deltaBadge = '';
  if (!hasData || (thisWk === 0 && prevWk === 0)) {
    deltaBadge = `<span class="mg-delta mg-delta-none">Baseline</span>`;
  } else if (prevWk === 0) {
    deltaBadge = `<span class="mg-delta mg-delta-up">▲ New</span>`;
  } else {
    const pct = Math.round(((thisWk - prevWk) / prevWk) * 100);
    const up  = pct >= 0;
    deltaBadge = `<span class="mg-delta ${up ? 'mg-delta-up' : 'mg-delta-down'}">${up ? '▲ +' : '▼ '}${pct}%</span>`;
  }

  // 1. Rotation-pass Volume status & all-time lastTrainedTime for this muscle
  const progId = ensureActiveProgram();
  const prog = progId ? PROGRAMS.find(p => p.id === progId) : null;
  let scheduledSets = 6;
  let completedSets = 0;
  if (prog) {
    const volData = getWeeklyVolumeByMuscle(progId);
    if (volData.targets && volData.targets[muscle] > 0) scheduledSets = volData.targets[muscle];
    completedSets = (volData.actuals && volData.actuals[muscle]) || 0;
  } else {
    const weekStart = (() => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); })();
    for (const w of getHistory()) {
      if (workoutDayTs(w) >= weekStart && w.sets) {
        for (const [key, sets] of Object.entries(w.sets)) {
          if (key.endsWith('_wu') || !Array.isArray(sets)) continue;
          const nm = resolveWorkoutSetExName(w, key, sets);
          if (nm && getMuscle(nm) === muscle) {
            completedSets += sets.filter(s => s && s.r > 0).length;
          }
        }
      }
    }
  }
  let lastTrainedTime = 0;
  for (const w of getHistory()) {
    if (!w || !w.sets) continue;
    const endT = w.endTime || w.startTime || 0;
    if (endT <= lastTrainedTime) continue;
    for (const [key, sets] of Object.entries(w.sets)) {
      if (key.endsWith('_wu') || !Array.isArray(sets)) continue;
      if (!sets.some(s => s && s.r > 0)) continue;
      const nm = resolveWorkoutSetExName(w, key, sets);
      if (nm && getMuscle(nm) === muscle) {
        lastTrainedTime = endT;
        break;
      }
    }
  }

  const volPct = Math.min(100, Math.round((completedSets / scheduledSets) * 100));
  const trainedDaysAgo = lastTrainedTime > 0 ? Math.max(0, Math.floor((Date.now() - lastTrainedTime) / 86400000)) : null;
  const trainedText = trainedDaysAgo === 0 ? 'Today' : (trainedDaysAgo === 1 ? 'Yesterday' : (trainedDaysAgo !== null ? `${trainedDaysAgo}d ago` : 'Resting'));

  // Top driver exercises for this muscle
  const topExs = getTopExercisesForMuscle(muscle);
  let topExsHTML = '';
  if (topExs.length > 0) {
    topExsHTML = `
      <div style="margin-top:14px;">
        <div style="font-size:var(--fs-xs);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:6px;">Key Contributing Movements</div>
        <div class="mg-driver-list">
          ${topExs.map(ex => `
            <div class="mg-driver-card" onclick="showProgressGraph(event, '${ex.name.replace(/'/g, "\\'")}')" style="cursor:pointer;">
              <div>
                <div class="mg-dc-name">${ex.name}</div>
                <div class="mg-dc-sub">Best: ${ex.bestSet}</div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                <div class="mg-dc-val">${ex.e1rm} ${unit}</div>
                <span style="color:var(--accent-kinetic);font-size:var(--fs-sm);">↗</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  // ── Chart SVG ──
  const W = 310, H = 132;
  const pad = { l: 14, r: 14, t: 22, b: 22 };
  const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;
  const minV = Math.min(...vals.filter(v => v > 0)) * 0.92 || 0;
  const maxV = peak * 1.06 || 1;
  const range = maxV - minV || 1;
  const xs = vals.map((_, i) => pad.l + (i / Math.max(vals.length - 1, 1)) * cW);
  const ys = vals.map(v => v > 0 ? pad.t + cH - ((v - minV) / range) * cH : pad.t + cH);

  const linePts = vals.map((v, i) => v > 0 ? `${xs[i].toFixed(1)},${ys[i].toFixed(1)}` : null).filter(Boolean).join(' ');
  const areaPath = `M${xs[0].toFixed(1)},${(pad.t + cH).toFixed(1)} `
    + vals.map((v, i) => v > 0 ? `L${xs[i].toFixed(1)},${ys[i].toFixed(1)}` : '').join(' ')
    + ` L${xs[xs.length - 1].toFixed(1)},${(pad.t + cH).toFixed(1)} Z`;

  const dots = xs.map((x, i) => {
    if (!vals[i]) return '';
    const isNow = i === vals.length - 1;
    return `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${isNow ? 4.5 : 3}"
      fill="${isNow ? 'var(--accent-kinetic)' : 'rgba(240,78,35,0.4)'}"
      stroke="${isNow ? '#fff' : 'none'}" stroke-width="${isNow ? 2 : 0}"/>`;
  }).join('');

  const axis = weeks.map((w, i) =>
    `<text x="${xs[i].toFixed(1)}" y="${H - 5}" text-anchor="middle" font-size="8.5"
      fill="var(--text-tertiary)" font-family="var(--font-body)">${w.dateLabel}</text>`).join('');

  const chartSVG = hasData
    ? `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible">
        <defs>
          <linearGradient id="mgArea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="rgba(240, 78, 35, 0.22)"/>
            <stop offset="100%" stop-color="rgba(240, 78, 35, 0.01)"/>
          </linearGradient>
        </defs>
        <line x1="${pad.l}" y1="${(pad.t + cH).toFixed(1)}" x2="${(W - pad.r).toFixed(1)}" y2="${(pad.t + cH).toFixed(1)}"
          stroke="var(--border-subtle)" stroke-width="1"/>
        <path class="mg-area-draw" d="${areaPath}" fill="url(#mgArea)"/>
        <polyline class="mg-line-draw" pathLength="1" points="${linePts}" fill="none"
          stroke="var(--accent-kinetic)" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}${axis}
      </svg>`
    : `<p class="mg-empty">Log two or more sessions to generate your strength curve.</p>`;

  // Switcher chips
  const switcher = `<div class="mg-switcher">${MG_MUSCLES.map(m =>
    `<button class="mg-chip${m === muscle ? ' active' : ''}" onclick="switchMuscleGraph('${m}')">${m}</button>`
  ).join('')}</div>`;

  document.getElementById('muscle-graph-content').innerHTML = `
    <div class="mg-head">
      <div>
        <div class="mg-muscle-title">${muscle}</div>
        <div class="mg-meta">Strength Overload · ${numWeeks} Weeks</div>
      </div>
      ${deltaBadge}
    </div>
    ${switcher}

    <div class="mg-stats-row">
      <div class="mg-stat-box">
        <div class="mg-stat-lbl">Rotation Sets</div>
        <div class="mg-stat-num">${completedSets} / ${scheduledSets}</div>
      </div>
      <div class="mg-stat-box">
        <div class="mg-stat-lbl">Peak e1RM</div>
        <div class="mg-stat-num">${peak > 0 ? peak + ' ' + unit : '—'}</div>
      </div>
      <div class="mg-stat-box">
        <div class="mg-stat-lbl">Trained</div>
        <div class="mg-stat-num" style="color:${volPct >= 100 ? 'var(--accent-success)' : 'var(--text-primary)'}">${trainedText}</div>
      </div>
    </div>

    <div class="mg-chart-wrap">${chartSVG}</div>

    <div class="mg-foot">
      <div class="mg-range">
        <button class="mg-range-btn${numWeeks === 5 ? ' active' : ''}"  onclick="setMuscleGraphRange(5)">5W</button>
        <button class="mg-range-btn${numWeeks === 12 ? ' active' : ''}" onclick="setMuscleGraphRange(12)">12W</button>
      </div>
      <div class="mg-now">${thisWk > 0 ? `Current <strong>${thisWk} ${unit}</strong>` : ''}${peak > 0 && peak !== thisWk ? ` · Peak <strong>${peak} ${unit}</strong>` : ''}</div>
    </div>

    ${topExsHTML}
  `;

  // Touch scrubbing
  if (hasData) {
    const wrap = document.querySelector('#muscle-graph-content .mg-chart-wrap');
    if (wrap) {
      wrap.style.position = 'relative';
      const tip = document.createElement('div');
      tip.className = 'mg-scrub-tip';
      wrap.appendChild(tip);
      let lastIdx = -1;
      const onMove = (clientX) => {
        const r = wrap.getBoundingClientRect();
        const relX = (clientX - r.left) / r.width * W;
        let best = -1, bd = 1e9;
        xs.forEach((x, i) => {
          if (vals[i] > 0) { const d = Math.abs(x - relX); if (d < bd) { bd = d; best = i; } }
        });
        if (best >= 0 && best !== lastIdx) {
          lastIdx = best;
          haptic('tick');
          tip.textContent = `${weeks[best].dateLabel} · ${vals[best]} ${unit}`;
          tip.style.left = Math.min(Math.max((xs[best] / W) * 100, 15), 85) + '%';
          tip.classList.add('on');
        }
      };
      wrap.addEventListener('touchstart', e => onMove(e.touches[0].clientX), { passive: true });
      wrap.addEventListener('touchmove',  e => onMove(e.touches[0].clientX), { passive: true });
      const end = () => { tip.classList.remove('on'); lastIdx = -1; };
      wrap.addEventListener('touchend', end);
      wrap.addEventListener('touchcancel', end);
    }
  }
}

// Swipe-down dismisses the muscle panel — same physics as the sheets
(function initMusclePanelDrag() {
  const panel = document.getElementById('muscle-graph-panel');
  if (!panel) return;
  let sy = 0, cy = 0, drag = false;
  panel.addEventListener('touchstart', (e) => {
    if (e.target.closest('button')) return;
    drag = true; sy = cy = e.touches[0].clientY;
    panel.style.transition = 'none';
  }, { passive: true });
  panel.addEventListener('touchmove', (e) => {
    if (!drag) return;
    cy = e.touches[0].clientY;
    let dy = cy - sy;
    if (dy < 0) dy = -Math.pow(-dy, 0.7);
    panel.style.transform = `translateY(${Math.max(dy, -20)}px)`;
  }, { passive: true });
  const end = () => {
    if (!drag) return;
    drag = false;
    const dy = cy - sy;
    panel.style.transition = '';
    panel.style.transform = '';
    if (dy > 90) { haptic('tick'); closeMuscleGraph(); }
  };
  panel.addEventListener('touchend', end);
  panel.addEventListener('touchcancel', end);
})();

function renderHome() {
  const container = document.getElementById('screen-home');
  if (!container) return;

  // ── 1. Native data retrieval ───────────────────────────────────────────────────
  let nextSessionName = 'SESSION';
  let targets         = {};
  let actuals         = {};
  let ns              = null;

  // Active rotation pass progress (persists across Sundays until rotation pass completes)
  const progId    = ensureActiveProgram();
  const progObj   = progId ? PROGRAMS.find(p => p.id === progId) : null;
  const rotState  = progObj ? getProgramRotationState(progObj, getHistory()) : null;
  const justFinishedPassToday = !!(rotState && rotState.justCompletedFullCycle && rotState.lastWorkout && (Date.now() - (rotState.lastWorkout.endTime || 0) < 18 * 3600 * 1000));
  const streak    = rotState ? (justFinishedPassToday ? Object.keys(rotState.displayDoneMap || {}).length : rotState.completedCount) : 0;   // ota-35: a round closed at Legs shows what it held
  const totalSess = progObj ? progObj.sessions.length : 0;

  const resumedLast = resumed && !resumed.editingWorkoutId && !resumed.isBackdated ? lastSetTs(resumed.sets) : 0;
  const resumedIdle = resumedLast && (Date.now() - resumedLast > IDLE_PROMPT_MS);

        <div class="metric-item">
          <svg viewBox="0 0 24 24"><path d="M6.5 6.5A2.5 2.5 0 0 1 9 4h0a2.5 2.5 0 0 1 2.5 2.5V8"/><path d="M14.5 8V6.5A2.5 2.5 0 0 1 17 4h0a2.5 2.5 0 0 1 2.5 2.5v4A8.5 8.5 0 0 1 11 19h-1a8 8 0 0 1-8-8v-1.5A2.5 2.5 0 0 1 4.5 7H5a2.5 2.5 0 0 1 2.5 2.5V11"/><path d="M11.5 8H14"/></svg>

    const totemEl = container.querySelector('.premium-totem-container');

    // ota-31 (item 4): single tap waits a beat so a double-tap never opens the graph first.
    // Single tap = graph. Double-tap = start (or continue) the next session, scrolled to that muscle.
    let _tapTimer = null;
    let _tapMuscle = null;
    totemEl.addEventListener('click', (e) => {
      const el = e.target.closest('[data-muscle]');
      if (!el) return;
      const muscle = el.dataset.muscle;
      if (_tapTimer && _tapMuscle === muscle) {
        clearTimeout(_tapTimer); _tapTimer = null; _tapMuscle = null;
        quickStartForMuscle(muscle);
        return;
      }
      if (_tapTimer) clearTimeout(_tapTimer);
      const pt = { clientX: e.clientX, clientY: e.clientY };
      _tapMuscle = muscle;
      _tapTimer = setTimeout(() => { _tapTimer = null; _tapMuscle = null; openMuscleGraph(pt, muscle); }, 280);

        _lastHapticEl = muscleEl;
        if (navigator.vibrate) navigator.vibrate(10);
      }
      if (!muscleEl) _lastHapticEl = null;
    }, { passive: true });
  });

  // Launch awakening + stat tickers — once per app launch, never on re-render
  if (!ST._homeTicked) {
    ST._homeTicked = true;
    container.classList.add('awaken');
    setTimeout(() => container.classList.remove('awaken'), 1100);
    requestAnimationFrame(() => tickStats(container));
  }
}

function fitTitles(root) {
  const els = (root || document).querySelectorAll('.fit-title');
  els.forEach(h => {
    if (!h.dataset.fs) h.dataset.fs = h.style.fontSize || '';   // its own size, kept across re-fits
    h.style.fontSize = h.dataset.fs; h.style.whiteSpace = 'nowrap';
    if (!h.clientWidth) { h.style.whiteSpace = ''; return; }   // not on screen yet
    const cs = String(getComputedStyle(h).fontSize || '');
    let size = (/rem$/.test(cs) ? parseFloat(cs) * 16 : parseFloat(cs)) || 38;
    const min = 26;
    while (h.scrollWidth > h.clientWidth + 1 && size > min) { size = Math.max(min, Math.floor(size) === size ? size - 1 : Math.floor(size)); h.style.fontSize = size + 'px'; }
    if (h.scrollWidth > h.clientWidth + 1) h.style.whiteSpace = 'normal';   // wraps at the <wbr> after each slash
  });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { try { fitTitles(); } catch (e) {} });

  if (!zones.length) return '';
  const chips = zones.map(z => {
    const e = mem.byZone[z];
    let body;
    if (e) body = `${formatWeight(dispW(Number(e.sets[0].w) || 0))} ${unit} × ${e.sets.map(s => s.r).join(', ')} · ${relDay(e.endTime)}${z === active && mem.sameDay ? ' · same day' : ''}`;
    else if (z === active && mem.estimate) body = `est. ${formatWeight(dispW(mem.estimate.w))} ${unit} from your other sets`;
    else body = 'No history yet';
    const tgt = e ? e.target : (z === todayZone ? effTargetForKey(key) : null);
    return `<button class="zone-chip${e ? '' : ' empty'}" aria-pressed="${z === active}" onclick="event.stopPropagation();setZoneView('${key}','${z}')">
      <b>${ZONE_LABEL[z]} ${zoneRangeLabel(z, tgt)}</b><span>${body}</span></button>`;
  }).join('');
  return `<div class="zone-chips" role="group" aria-label="Weight memory by rep range">${chips}</div>`;
}
function effTargetForKey(key) { const slot = slotForKey(key); return slot ? effReps(key, slot.ex) : null; }
function verdictHTML(v, unit, exName, live) {
  if (!v) return '';
  const lead = live ? 'Next time: ' : '';
  if (v.kind === 'up') {
    const nw = suggestedUpWeight(v.weight, exName);
    const why = v.legacy ? `Last time every set reached ${v.top}.` : (live ? `Every set reached ${v.top} with ${v.lastRir} in reserve on the last.` : `Last time every set reached ${v.top} and your last set was ${v.lastRir} RIR.`);
    return `<div class="verdict up">${UI_ICON.up}<div><strong>${lead}${nw ? `Go up to ${formatWeight(dispW(nw))} ${unit}.` : 'Go up: add load or slow the tempo.'}</strong> ${why}</div></div>`;
  }
  if (v.kind === 'hold') {
    return `<div class="verdict hold">${UI_ICON.hold}<div><strong>${lead}Hold ${formatWeight(dispW(v.weight))} ${unit}.</strong> ${live ? `You hit ${v.top} on every set but the last one was at failure.` : `You hit ${v.top} on every set last time, but the last one was at failure.`}</div></div>`;
  }
  return `<div class="verdict build">${UI_ICON.build}<div><strong>${lead}Build reps at ${formatWeight(dispW(v.weight))} ${unit}.</strong> Aim for ${v.top} on every set.</div></div>`;
}
function liveVerdictFor(key) {
  const slot = slotForKey(key); if (!slot) return null;
  const total = effSetCount(key, slot.ex);
  const logged = (ST.workoutSets[key] || []).filter(s => s && s.r > 0);
  if (ST.editingWorkoutId || logged.length < total || !total) return null;
  return progressionVerdict(logged, effReps(key, slot.ex));
}
function refreshVerdict(key) {
  const body = document.querySelector('#excard-' + key + ' .ex-body-inner');
  if (!body) return;
  const slot = slotForKey(key); if (!slot) return;
  const v = liveVerdictFor(key);
  const old = body.querySelector('.verdict');
  if (!v) return;
  const tmp = document.createElement('div');
  tmp.innerHTML = verdictHTML(v, getWeightUnit(), liveExName(key, slot.ex), true);
  const el = tmp.firstElementChild;
  if (old) old.replaceWith(el); else body.prepend(el);
}
function setRIR(key, si, val) {
  const s = ST.workoutSets[key] && ST.workoutSets[key][si];
  if (!s) return;
  s.rir = s.rir === val ? 0 : val;
  saveNow();
  haptic('tick');
  const pills = document.getElementById('rir-' + key + '-' + si);
  if (pills) pills.outerHTML = rirPillsHTML(key, si, s.rir);
  refreshVerdict(key);
}
function setZoneView(key, zone) {
  if (!ST.workoutZoneView) ST.workoutZoneView = {};
  const today = repZone(effTargetForKey(key));
  if (!zone || zone === today) delete ST.workoutZoneView[key]; else ST.workoutZoneView[key] = zone;
  if (ST.workoutDrafts) for (const k of Object.keys(ST.workoutDrafts)) { if (k.indexOf(key + '-') === 0 && k !== key + '-wu') delete ST.workoutDrafts[k]; }
  haptic('tick');
  rerenderCard(key);
}
function rerenderCard(key) {
  const el = document.getElementById('excard-' + key);
  const slot = slotForKey(key);
  if (!el || !slot) return;
  const i = slot.isAddition ? slot.addId : slot.exIdx;
  el.outerHTML = exerciseCardHTML(slot.ex, key, i, slot.isAddition);
}

function exerciseCardHTML(ex, key, i, isAddition) {
  const notes = getNotes();
  const restTimes = getRestTimes();
  const unit = getWeightUnit();
  const name = isAddition ? liveExName(key, ex) : stripSuperset(ex.name);
  const isExpanded = ST.expandedCards.has(key);
  const isCompleted = ST.completedCards.has(key);
  const displayName = liveExName(key, ex);
  const muscle = getMuscle(displayName) !== 'Other' ? getMuscle(displayName) : getMuscle(name);
  const subbed = !isAddition && ST.workoutSubs && ST.workoutSubs[key];
  const subIsDefault = subbed && ST.workoutSubSource && ST.workoutSubSource[key] === 'default';
  const autoSubbed = !isAddition && ST.workoutAutoSubs && ST.workoutAutoSubs[key];
  const loggedSets = ST.workoutSets[key] || [];
  const totalSets = effSetCount(key, ex);
  const reps = effReps(key, ex);

  // Weight memory by rep range — today's zone unless the user tapped another chip.
  const zoneView = ST.workoutZoneView && ST.workoutZoneView[key];
  const todayZone = repZone(reps);
  const mem = getZoneMemory(displayName, reps, { zone: zoneView || null, excludeId: ST.editingWorkoutId, sessionId: ST.currentSession });
  let lastPerf = null, estimate = null;
  if (mem.entry) lastPerf = mem.entry.sets;
  else if (mem.estimate) estimate = mem.estimate;
  else if (mem.anyLast) lastPerf = mem.anyLast.sets;

  // Verdict from the last session in today's zone (live workouts only) and the weight it suggests.
  let verdict = null, suggestW = null;
  const liveV = liveVerdictFor(key);
  if (!ST.editingWorkoutId && !zoneView && mem.entry && mem.zone) {
    verdict = progressionVerdict(mem.entry.sets, reps);
    if (verdict && verdict.kind === 'up') suggestW = suggestedUpWeight(verdict.weight, displayName);
  }
  const bottomReps = repBottom(reps);

  let activeFocusIdx = -1;
  if (isExpanded && !isCompleted) {
    for (let idx = 0; idx < totalSets; idx++) { if (!loggedSets[idx] || !loggedSets[idx].r) { activeFocusIdx = idx; break; } }
  }

  let histAvgW = null;
  if (lastPerf && lastPerf.length > 0) {
    const wArr = lastPerf.filter(s => s && s.w > 0).map(s => s.w);
    if (wArr.length > 0) histAvgW = wArr.reduce((a, b) => a + b, 0) / wArr.length;
  }

  let setRows = '';
  for (let si = 0; si < totalSets; si++) {
    const logged = loggedSets[si];
    const lastSet = lastPerf && (lastPerf[si] != null ? lastPerf[si] : lastPerf[lastPerf.length - 1]);
    const draft = !logged && ST.workoutDrafts && ST.workoutDrafts[key + '-' + si];
    const prevLoggedThisSession = si > 0 && loggedSets[si - 1] ? loggedSets[si - 1] : null;
    const useSugg = !logged && !(draft && draft.w !== '') && suggestW != null;
    const useEst = !logged && !(draft && draft.w !== '') && !lastSet && estimate;
    const defaultR = ex && ex.reps ? (parseInt((String(reps).match(/(\d+)$/) || ['', '8'])[1]) || 8) : 8;

    let preW, preR;
    const _dw = v => (v === '' || v == null) ? v : formatWeight(dispW(v)); // ota-31: show stored lb in the chosen unit
    if (logged) { preW = _dw(logged.w); preR = logged.r; }
    else {
      preW = draft && draft.w !== '' ? draft.w : (useSugg ? _dw(suggestW) : (useEst ? _dw(estimate.w) : (lastSet != null && lastSet.w != null ? _dw(lastSet.w) : (prevLoggedThisSession ? _dw(prevLoggedThisSession.w) : ''))));
      preR = draft && draft.r !== '' ? draft.r : ((useSugg && !isNaN(bottomReps)) ? bottomReps : (useEst ? estimate.r : (lastSet != null && lastSet.r != null ? lastSet.r : (prevLoggedThisSession ? prevLoggedThisSession.r : defaultR))));
    }

    const isLastSet = si === totalSets - 1;
    const tech = isLastSet && ex.lastSetTechnique ? `<span class="technique-badge">${ex.lastSetTechnique}</span>` : '';
    const isLogged = !!logged;
    const isActiveFocus = si === activeFocusIdx;

    const prHtml = (isLogged && logged._isPR) ? `<div class="pr-toast">✦ New Record · ${logged.w > 0 ? formatWeight(dispW(logged.w)) + ' ' + unit : 'Bodyweight'} × ${logged.r}</div>` : '';

    let trendHtml = '';
    if (!isLogged && !useSugg && histAvgW !== null && preW !== '' && Number(preW) > 0) {
      const diff = Number(preW) - dispW(histAvgW);
      if (Math.abs(diff) >= 0.5) {
        const cls = diff > 0 ? 'trend-arrow-up' : 'trend-arrow-down';
        trendHtml = `<div class="set-trend"><span class="${cls}">${diff > 0 ? '↑' : '↓'}</span><span>${(diff > 0 ? '+' : '') + diff.toFixed(1)} ${unit} vs avg</span></div>`;
      }
    }
    const tileCls = useSugg ? ' sugg' : (useEst ? ' est' : '');

    setRows += `
    <div class="set-row${isActiveFocus ? ' active-focus' : ''}${isLogged ? ' is-logged' : ''}${isLastSet ? ' is-last' : ''}" id="setrow-${key}-${si}">
      <div class="set-num">${si + 1}</div>
      <label class="set-tile${tileCls}" data-unit="${unit}">
        <input class="set-input${isLogged ? ' logged' : ''}" id="wi-${key}-${si}" type="text" readonly inputmode="none"
          value="${preW}" placeholder="${unit}" autocomplete="off" aria-label="Set ${si + 1} weight"
          onclick="openNumpad(this,'${key}',${si},${i},'w')" oninput="markDraft('${key}',${si})">
      </label>
      <label class="set-tile${tileCls}" data-unit="reps">
        <input class="set-input${isLogged ? ' logged' : ''}" id="ri-${key}-${si}" type="text" readonly inputmode="none"
          value="${preR}" placeholder="reps" autocomplete="off" aria-label="Set ${si + 1} reps"
          onclick="openNumpad(this,'${key}',${si},${i},'r')" oninput="markDraft('${key}',${si})">
      </label>
      <div class="set-act">
        ${isLogged ? rirPillsHTML(key, si, logged.rir) : ''}
        <button class="set-log-btn${isLogged ? ' logged' : ''}" aria-label="${isLogged ? 'Undo' : 'Log'} set ${si + 1}"
          onclick="${isLogged ? `unlogSet('${key}',${si},${i})` : `logSet('${key}',${si},${i})`}">${isLogged ? checkSVG() : UI_ICON.arrow}</button>
      </div>
    </div>
    ${prHtml}
    ${trendHtml}
    ${tech ? `<div style="padding-left:30px;margin-bottom:6px">${tech}</div>` : ''}`;
  }

  const wuKey = `${key}_wu`;
  const wuDismissed = ST.dismissedWarmups.has(normalizeEx(name));
  const wuLogged = ST.workoutSets[wuKey] && ST.workoutSets[wuKey][0];
  const wuDraft = !wuLogged && ST.workoutDrafts && ST.workoutDrafts[key + '-wu'];
  const wuBase = lastPerf && lastPerf[0] && lastPerf[0].w != null ? Number(lastPerf[0].w) : (estimate ? estimate.w : null);
  const wuPreW = wuLogged ? formatWeight(dispW(wuLogged.w)) : (wuDraft && wuDraft.w !== '' ? wuDraft.w : (wuBase != null ? Math.round(dispW(wuBase) * 0.5) : ''));
  const wuPreR = wuLogged ? wuLogged.r : (wuDraft && wuDraft.r !== '' ? wuDraft.r : '');
  const warmupRowHtml = (!wuDismissed) ? `
    <div class="warmup-row" id="wurow-${key}">
      <span class="warmup-label">warm-up</span>
      <input class="warmup-input" id="wuwi-${key}" type="text" readonly inputmode="none"
        value="${wuPreW}" placeholder="${unit}" autocomplete="off"
        onclick="openNumpad(this,'${key}',0,${i},'w',true)" oninput="markDraftWu('${key}')">
      <span class="warmup-sep">×</span>
      <input class="warmup-input" id="wuri-${key}" type="text" readonly inputmode="none"
        value="${wuPreR}" placeholder="reps" autocomplete="off"
        onclick="openNumpad(this,'${key}',0,${i},'r',true)" oninput="markDraftWu('${key}')">
      <button class="warmup-dismiss" onclick="dismissWarmup(event,'${key}','${escAttr(normalizeEx(name))}')" title="Remove warm-up">✕</button>
    </div>` : '';

  const noteKey = normalizeEx(name);
  const noteVal = notes[noteKey] || '';
  const restSec = restTimes[normalizeEx(name)] || parseRestSeconds(ex.rest);
  const subNote = subbed
    ? (subIsDefault ? `<div class="ex-sub-note">${UI_ICON.swap}<span>Your default · program has ${escHtml(name)}</span></div>` : `<div class="ex-sub-note">${UI_ICON.swap}<span>Swapped from ${escHtml(name)} today</span></div>`)
    : (autoSubbed ? `<div class="ex-sub-note">${UI_ICON.swap}<span>Auto-swapped from ${escHtml(name)} (blacklisted)</span></div>`
      : (isAddition ? `<div class="ex-sub-note">${UI_ICON.plus}<span>Added exercise</span></div>` : ''));
  const verdictBlock = liveV ? verdictHTML(liveV, unit, displayName, true) : verdictHTML(verdict, unit, displayName, false);
  const gate = totalSets > 0 && !ST.editingWorkoutId ? `<div class="rir-gate">After a set, tap 1 or 2 for reps in reserve. Nothing lit = failure. The last set decides next time's weight.</div>` : '';

  return `
  <div class="ex-card${isExpanded ? ' expanded' : ''}${isCompleted ? ' completed' : ''}${isAddition ? ' ex-card-add' : ''}" id="excard-${key}">
    <div class="ex-card-header" onclick="toggleCard('${key}')">
      <div class="ex-card-header-left">
        <div class="ex-kicker">
          ${muscleBadgeHtml(muscle)}
          ${isCompleted ? '<span class="ex-check-pill">Done</span>' : ''}
        </div>
        <div class="ex-name">${escHtml(displayName)}</div>
        ${subNote}
        <div class="ex-meta">${totalSets} sets × ${reps} reps · ${formatDuration(restSec)} rest</div>
        ${zoneChipsHTML(key, mem, todayZone, unit)}
      </div>
      <div class="ex-card-actions" onclick="event.stopPropagation()">
        <button class="ex-note-btn${(ST.workoutNotes[key] || noteVal) ? ' has-note' : ''}" id="notebtn-${key}"
          onclick="toggleNotePanel(event,'${key}','${noteKey}')" title="Exercise notes" aria-label="Exercise notes">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
        </button>
        <button class="ex-menu-btn" onclick="showExerciseActionSheet(event,'${key}',${i},${isAddition})" title="Exercise options" aria-label="Exercise options">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
        </button>
        <button class="ex-chevron-btn" onclick="toggleCard('${key}')" aria-label="Toggle exercise">
          <svg class="ex-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
    </div>
    <div class="ex-body">
      <div class="ex-body-inner">
        ${verdictBlock}
        ${warmupRowHtml}
        ${setRows}
        ${gate}
        <div class="ex-foot">
          <div class="set-hint rest-time-row">
            <span class="ex-foot-lbl">Rest</span>
            <span class="rest-time-display" id="rest-lbl-${key}" onclick="editRestTime('${key}',${i},this)" title="Tap to edit">${formatDuration(restSec)}</span>
          </div>
          ${isBarbell(displayName) ? `
          <button class="plate-calc-trigger" onclick="showPlateCalcSheet('${escAttr(displayName)}','${key}')" title="Plate calculator">${UI_ICON.plates}<span>Plates</span></button>` : ''}
        </div>
        <div class="ex-note-panel${(ST.workoutNotes[key] || noteVal) ? ' open' : ''}" id="notepanel-${key}">
          <textarea class="ex-note-area" id="noteinput-${key}" placeholder="Session notes…"
            oninput="saveSessionNote('${key}','${noteKey}',this.value)"
          >${ST.workoutNotes[key] !== undefined ? ST.workoutNotes[key] : noteVal}</textarea>
        </div>
      </div>
    </div>
  </div>`;
}

function renderWorkout() {
  const el = document.getElementById('screen-workout');
  if (!el) return;
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (!prog || !sess) { Maps('home'); return; }
  const exList = sess.exercises;
  const notes = getNotes();
  const restTimes = getRestTimes();

  // Build exercise HTML — programmed slots first, then accessory additions
  const exCards = exList.map((ex, i) => exerciseCardHTML(ex, `${sess.id}_${i}`, i, false)).join('');
  const allProgDone = exList.length > 0 && exList.every((_, idx) => ST.completedCards.has(`${sess.id}_${idx}`));
  let addCards = '';
  if (ST.workoutAdditions && ST.workoutAdditions.length) {
    addCards = `<div class="add-group-lbl">✚ Additions</div>` +
      ST.workoutAdditions.map((a) => {
        const slot = slotForKey('add_' + a.id);
        return slot ? exerciseCardHTML(slot.ex, 'add_' + a.id, a.id, true) : '';
      }).join('');
  }
  const addPill = allProgDone
    ? `<button class="add-ex-pill" onclick="showAddSheet()"><span class="add-ex-plus">+</span> Add Exercise</button>`
    : '';

  const headerModeLabel = ST.editingWorkoutId ? 'Editing Workout' : (ST.isBackdated ? 'Past Workout' : 'Active Workout');
  const showDateHeader = ST.editingWorkoutId || ST.isBackdated;
  const finishBtnText = ST.editingWorkoutId ? 'Save Changes' : (ST.isBackdated ? 'Save Workout' : 'Finish Workout');

  const totalEx = exList.length;
  const doneEx = exList.filter((_, i) => ST.completedCards.has(`${sess.id}_${i}`)).length;
  const remainingEx = totalEx - doneEx;
  const vol = calcVolume();
  const unit = getWeightUnit();

  el.innerHTML = `
  <div id="workout-header${ST.travelLocked?' travel-locked':''}">
    <div class="wh-top-bar">
      <button onclick="cancelWorkout()" class="wh-exit-btn" aria-label="Exit workout">✕</button>
      <div class="wh-title-group">
        <div class="wh-mode-tag">${headerModeLabel}</div>
        <div class="wh-session">${sess.name}</div>
        ${showDateHeader ? `
          <div class="wh-date-chip" onclick="editWorkoutDateTime()">
            📅 ${new Date(ST.workoutStart).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })} <span style="font-size:var(--fs-xs);opacity:0.8;">(edit)</span>
          </div>
        ` : ''}
      </div>
      <div style="width:44px;flex-shrink:0"></div>
    </div>

    <!-- Active workout live metric ribbon -->
    <div class="wh-hud-strip">
      <div class="wh-hud-stat">
        <span class="wh-hud-label">Duration</span>
        <span class="wh-hud-val" id="wh-dur" ${showDateHeader ? 'onclick="editWorkoutDateTime()" style="cursor:pointer;"' : ''}>${formatDuration(ST.durationSecs)}</span>
      </div>
      <div class="wh-hud-divider"></div>
      <div class="wh-hud-stat">
        <span class="wh-hud-label">Volume</span>
        <span class="wh-hud-val" id="wh-vol-num">${vol.toLocaleString()} <span style="font-size:var(--fs-sm);font-weight:500;">${unit}</span></span>
      </div>
      <div class="wh-hud-divider"></div>
      <div class="wh-hud-stat">
        <span class="wh-hud-label">Status</span>
        <span class="wh-hud-val${remainingEx===0?' complete':''}" id="wh-pct-num">${remainingEx === 0 ? '✓ Complete' : `${remainingEx} left`}</span>
      </div>
    </div>

    <!-- Segmented exercise roadmap -->
    <div class="wh-roadmap-bar" id="wh-segs">
      ${exList.map((_, i) => {
        const k = `${sess.id}_${i}`;
        const isDone = ST.completedCards.has(k);
        return `<div class="wh-seg${isDone?' done':''}"></div>`;
      }).join('')}
    </div>

    ${!ST.travelLocked ? `
    <div class="travel-toggle-row">
      <span class="travel-toggle-lbl">✈ Travel Mode (no gym)</span>
      <label class="toggle-switch">
        <input type="checkbox" ${ST.travelMode?'checked':''} onchange="setTravel(this.checked)">
        <span class="toggle-slider"></span>
      </label>
    </div>` : ''}
  </div>
  <div class="exercise-list">${exCards}${addCards}${addPill}</div>
  <div style="padding:16px 16px calc(var(--nav-h) + 28px)">
    <button class="btn btn-primary" onclick="shimmerBtn(this);setTimeout(()=>finishWorkout(),220)">${finishBtnText}</button>
  </div>`;

  // Restore rest timer if active
  if (ST.restActive) {
    const remaining = Math.ceil((ST.restEndTime - Date.now())/1000);
    if (remaining > 0) {
      setTimeout(renderRestBanner, 100);
      if (!ST.restTicker) ST.restTicker = setInterval(tickRest, 250);
    } else {
      cancelRestTimer();
    }
  }

  // Auto-open first uncompleted exercise if nothing is expanded
  if (ST.expandedCards.size === 0) {
    const firstIdx = exList.findIndex((_, i) => !ST.completedCards.has(`${sess.id}_${i}`));
    if (firstIdx !== -1) {
      const firstKey = `${sess.id}_${firstIdx}`;
      ST.expandedCards.add(firstKey);
      const firstCard = document.getElementById('excard-' + firstKey);
      if (firstCard) firstCard.classList.add('expanded');
    }
  }
  if (ST.pendingMuscleFocus) applyPendingMuscleFocus(); // ota-31 item 4
}
