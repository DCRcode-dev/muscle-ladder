// Archive a live/abandoned workout's logged sets into history — nothing with
// reps in it is ever silently dropped.
function archiveWorkoutToHistory(snapshot) {
  if (!snapshot || !snapshot.sets) return false;
  const hasSets = Object.values(snapshot.sets).some(arr => Array.isArray(arr) && arr.some(s => s && s.r > 0));
  if (!hasSets) return false;
  const hist = getHistory();
  hist.push({
    id: (snapshot.startTime || Date.now()).toString(),
    programId: snapshot.programId,
    sessionId: snapshot.sessionId,
    sessionName: snapshot.sessionName || '',
    startTime: snapshot.startTime || Date.now(),
    endTime: Date.now(),
    duration: snapshot.durationSecs || 0,
    travelMode: snapshot.travelMode || false,
    sets: snapshot.sets,
    notes: snapshot.notes || {},
    partial: true,
  });
  saveHistory(hist);
  return true;
}

function getLastPerformance(exName) {
  const found = getLastPerformanceFull(exName);
  return found ? found.sets : null;
}

function getLastPerformanceFull(exName) {
  if (!exName) return null;
  const hist = getHistory()
    .filter(w => w && w.sets)
    .sort((a, b) => (b.endTime || 0) - (a.endTime || 0));

  for (const w of hist) {
    for (const [key, sets] of Object.entries(w.sets)) {
      if (!sets || sets.length === 0) continue;

      let storedName = null;
      // 1. Check set objects for stored _name
      for (const s of sets) {
        if (s && s._name) { storedName = s._name; break; }
      }

      // 2. Check substitutions in the workout entry
      if (!storedName && w.subs && w.subs[key]) {
        storedName = w.subs[key];
      }

      // 3. Check additions in the workout entry
      if (!storedName && key.startsWith('add_') && w.additions) {
        const addIdx = parseInt(key.slice(4));
        if (w.additions[addIdx]) storedName = w.additions[addIdx].name;
        else {
          const foundAdd = w.additions.find(a => a.id === key || a.name);
          if (foundAdd) storedName = foundAdd.name;
        }
      }

      // 4. Derive from import key
      if (!storedName && key.startsWith('import_')) {
        storedName = key.slice(7).replace(/_/g, ' ');
      }

      // 5. Program structure lookup
      if (!storedName && w.programId && w.programId !== 'import') {
        const prog = PROGRAMS.find(p => p.id === w.programId);
        if (prog) {
          const sess = prog.sessions.find(s => s.id === w.sessionId);
          if (sess) {
            const exIdx = parseInt(key.split('_').pop());
            if (!isNaN(exIdx) && sess.exercises[exIdx]) {
              storedName = stripSuperset(sess.exercises[exIdx].name);
            }
          }
        }
      }

      if (!storedName) continue;

      if (exercisesMatch(exName, storedName)) {
        const ws = sets.filter(s => s && s.r > 0 && (s.w != null && s.w !== ''));
        if (ws.length > 0) return { sets: ws, endTime: w.endTime || 0 };
      }
    }
  }
  return null;
}

// "last Tue" / "3d ago" — quiet relative date for the card memory chip
function relDay(ts) {
  if (!ts) return '';
  const days = Math.floor((Date.now() - ts) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 7) return 'last ' + new Date(ts).toLocaleDateString('en-GB', { weekday: 'short' });
  if (days < 30) return Math.floor(days / 7) + 'w ago';
  return new Date(ts).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function getStats() {
  const hist = getHistory();
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const weekStart = (() => { const d = new Date(now); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); })();
  const thisMonth = hist.filter(w => w.endTime >= monthStart).length;
  const thisWeekVol = hist.filter(w => w.endTime >= weekStart).reduce((sum,w) => {
    if (!w.sets) return sum;
    return sum + Object.values(w.sets).flat().reduce((s,set) => s+(set.w||0)*(set.r||0),0);
  }, 0);
  // Streak: count consecutive weeks with at least 1 workout
  let streak = 0;
  const msPerWeek = 7*24*3600*1000;
  let checkWeek = weekStart;
  for (let i = 0; i < 52; i++) {
    const inWeek = hist.some(w => w.endTime >= checkWeek && w.endTime < checkWeek + msPerWeek);
    if (inWeek) { streak++; checkWeek -= msPerWeek; }
    else break;
  }
  return { thisMonth, streak, weekVol: Math.round(thisWeekVol) };
}

function getNextSession() {
  const dp = ST.defaultProgram;
  if (!dp) return null;
  const prog = PROGRAMS.find(p => p.id === dp);
  if (!prog) return null;
  const hist = getHistory().filter(w => w.programId === dp).sort((a,b) => b.endTime - a.endTime);
  if (hist.length === 0) return { prog, session: prog.sessions[0], isFirst: true };
  const lastSessId = hist[0].sessionId;
  const lastIdx = prog.sessions.findIndex(s => s.id === lastSessId);
  const nextIdx = (lastIdx + 1) % prog.sessions.length;
  const session = prog.sessions[nextIdx];
  // Average duration for this session
  const sessHist = hist.filter(w => w.sessionId === session.id && w.duration);
  const avgDur = sessHist.length > 0 ? Math.round(sessHist.reduce((s,w)=>s+w.duration,0)/sessHist.length) : null;
  return { prog, session, avgDur, isFirst: false };
}

function getWeeklyVolumeByMuscle(programId) {
  const prog = PROGRAMS.find(p => p.id === programId);
  if (!prog) return {};
  // Target: sum of all sets across all sessions for each muscle group
  const targets = {};
  for (const sess of prog.sessions) {
    for (const ex of sess.exercises) {
      const muscle = getMuscle(stripSuperset(ex.name));
      if (!targets[muscle]) targets[muscle] = 0;
      targets[muscle] += ex.workingSets || 0;
    }
  }
  // Actual: this week's logged sets
  const weekStart = (() => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); })();
  const actuals = {};
  for (const w of getHistory()) {
    if (w.programId !== programId || w.endTime < weekStart) continue;
    if (!w.sets) continue;
    const wp = PROGRAMS.find(p => p.id === w.programId);
    if (!wp) continue;
    const ws = wp.sessions.find(s => s.id === w.sessionId);
    if (!ws) continue;
    for (const [key, sets] of Object.entries(w.sets)) {
      if (key.endsWith('_wu')) continue;   // warm-ups never count toward volume
      const exIdx = parseInt(key.split('_').pop());
      const ex = ws.exercises[exIdx];
      for (const set of sets) {
        if (!set || !set.r) continue;
        // Stamped _name wins — substituted/travel sets credit the RIGHT muscle
        const nm = set._name || (ex && stripSuperset(ex.name));
        if (!nm) continue;
        const muscle = getMuscle(nm);
        if (!actuals[muscle]) actuals[muscle] = 0;
        actuals[muscle] += 1;
      }
    }
  }
  return { targets, actuals };
}

function getMuscleProgress() {
  const hist = getHistory();
  const muscles = ['Chest','Back','Quads','Hamstrings','Shoulders','Biceps','Triceps','Glutes','Calves','Core'];
  const fourWeeksAgo = Date.now() - 28*24*3600*1000;
  const result = {};
  for (const muscle of muscles) {
    // Group by week, get best 1RM per week
    const weekData = {};
    for (const w of hist) {
      if (!w.sets || w.endTime < fourWeeksAgo) continue;
      const weekKey = Math.floor(w.endTime / (7*24*3600*1000));
      const prog = PROGRAMS.find(p => p.id === w.programId);
      if (!prog) continue;
      const sess = prog.sessions.find(s => s.id === w.sessionId);
      if (!sess) continue;
      for (const [key, sets] of Object.entries(w.sets)) {
        if (key.endsWith('_wu')) continue;
        const exIdx = parseInt(key.split('_').pop());
        const ex = sess.exercises[exIdx];
        for (const set of sets) {
          if (!set || !set.r) continue;
          const nm = set._name || (ex && stripSuperset(ex.name));
          if (!nm || getMuscle(nm) !== muscle) continue;
          const rm = epley1RM(set.w||0, set.r||0);
          if (!weekData[weekKey] || rm > weekData[weekKey]) weekData[weekKey] = rm;
        }
      }
    }
    const weeks = Object.keys(weekData).sort((a,b)=>a-b);
    const values = weeks.map(w => weekData[w]);
    const latest = values[values.length-1] || 0;
    const prev = values[values.length-2] || 0;
    const flat3 = values.length >= 3 && values[values.length-1] <= values[values.length-2] && values[values.length-2] <= values[values.length-3];
    const flat2 = values.length >= 2 && values[values.length-1] <= values[values.length-2];
    const lastWorked = hist.filter(w => {
      if (!w.sets) return false;
      const p=PROGRAMS.find(pp=>pp.id===w.programId); if(!p) return false;
      const s=p.sessions.find(ss=>ss.id===w.sessionId); if(!s) return false;
      return Object.entries(w.sets).some(([key, sets])=>{
        if (key.endsWith('_wu')) return false;
        const i=parseInt(key.split('_').pop()); const ex=s.exercises[i];
        const nm = (Array.isArray(sets) && (sets.find(x=>x&&x._name)||{})._name) || (ex && stripSuperset(ex.name));
        return nm && getMuscle(nm)===muscle;
      });
    }).sort((a,b)=>b.endTime-a.endTime)[0];
    const daysSince = lastWorked ? Math.floor((Date.now()-lastWorked.endTime)/(24*3600*1000)) : 99;
    let dot = 'green';
    if (flat3 || daysSince >= 7) dot = 'red';
    else if (flat2) dot = 'amber';
    result[muscle] = { values, latest, dot, daysSince };
  }
  // Sort: red first, amber, green
  const order = {red:0, amber:1, green:2};
  return Object.entries(result).sort((a,b)=>order[a[1].dot]-order[b[1].dot]).map(([m,d])=>({muscle:m,...d}));
}

function checkDeload() {
  if (!ST.defaultProgram) return false;
  const hist = getHistory().filter(w => w.programId === ST.defaultProgram).sort((a,b)=>a.endTime-b.endTime);
  const prog = PROGRAMS.find(p => p.id === ST.defaultProgram);
  if (!prog) return false;
  const total = prog.sessions.length;
  if (hist.length < total * 4) return false;
  // Check last 4×sessions are all same program in order
  const recent = hist.slice(-total*4);
  let cycles = 0, idx = 0;
  for (const w of recent) {
    if (w.sessionId === prog.sessions[idx % total].id) { idx++; if (idx % total === 0) cycles++; }
    else { idx = 0; cycles = 0; }
  }
  return cycles >= 4;
}

function checkMilestone() {
  const total = getHistory().length;
  if ([1,10,25,50,100].includes(total)) return total;
  return null;
}


// ── Sound ─────────────────────────────────────────────────────────────────────
// ── Designed sound — Apple-quiet synthesis, zero file weight ─────────────────
// One shared voice helper: filtered sine/triangle partials with soft attack and
// natural exponential decay. No sawtooth, no square, no distortion — ever.
function _voice(ctx, { freq, type = 'sine', vol = 0.1, at = 0, attack = 0.004, decay = 0.22, cutoff = 4200, detune = 0 }) {
  const t0 = ctx.currentTime + at;
  const o = ctx.createOscillator();
  const g = ctx.createGain();
  const f = ctx.createBiquadFilter();
  f.type = 'lowpass'; f.frequency.setValueAtTime(cutoff, t0); f.Q.value = 0.4;
  o.type = type; o.frequency.setValueAtTime(freq, t0); o.detune.value = detune;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + attack + decay);
  o.connect(f); f.connect(g); g.connect(ctx.destination);
  o.start(t0); o.stop(t0 + attack + decay + 0.05);
}

function playSound(type) {
  const s = getSettings();
  if (!s.sound) return;
  try {
    if (!ST.audioCtx) ST.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = ST.audioCtx;
    if (ctx.state === 'suspended') ctx.resume().catch(()=>{});

    if (type === 'set') {
      // Soft glass tick — a fingernail on crystal
      _voice(ctx, { freq: 1320, vol: 0.25, decay: 0.085, cutoff: 5200 });
      _voice(ctx, { freq: 2640, vol: 0.08, decay: 0.055, cutoff: 6000 });
    } else if (type === 'chime') {
      // Warm two-note marimba — E5 → A5, felt mallet (double-chime for background prominence)
      for (let i = 0; i < 2; i++) {
        const delay = i * 0.8;
        _voice(ctx, { freq: 659.3,  type: 'triangle', vol: 0.45, at: delay + 0, decay: 0.40, cutoff: 2600 });
        _voice(ctx, { freq: 1318.5, vol: 0.15, at: delay + 0, decay: 0.25, cutoff: 3400 });
        _voice(ctx, { freq: 880,    type: 'triangle', vol: 0.50, at: delay + 0.17, decay: 0.50, cutoff: 2600 });
        _voice(ctx, { freq: 1760,   vol: 0.15, at: delay + 0.17, decay: 0.30, cutoff: 3400 });
      }
    } else if (type === 'finish') {
      // Muted swell — three stacked warm partials, slow bloom
      _voice(ctx, { freq: 440,  type: 'triangle', vol: 0.35, attack: 0.10, decay: 0.70, cutoff: 1900 });
      _voice(ctx, { freq: 554.4, type: 'triangle', vol: 0.25, at: 0.06, attack: 0.10, decay: 0.66, cutoff: 2100 });
      _voice(ctx, { freq: 659.3, type: 'sine',     vol: 0.20, at: 0.12, attack: 0.10, decay: 0.62, cutoff: 2300 });
    }
  } catch(e){}
}

// ── Rest timer ────────────────────────────────────────────────────────────────
function startRestTimer(seconds, exName, nextText, afterText, isLast) {
  const endTime = Date.now() + seconds * 1000;
  ST.restActive    = true;
  ST.restExpired   = false;
  ST.restDuration  = seconds;   // full duration for ring progress
  ST.restEndTime   = endTime;
  ST.restExName    = exName;
  ST.restNextText  = nextText  || '';
  ST.restAfterText = afterText || '';
  ST.restIsLast    = !!isLast;
  document.body.classList.add('rest-active');
  LS.set('dcrgym_rest_end',  endTime);
  LS.set('dcrgym_rest_dur',  seconds);
  LS.set('dcrgym_rest_next', nextText || '');

  if (ST.swReg && ST.notifEnabled && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      type: 'SCHEDULE_NOTIFICATION', delay: seconds * 1000
    });
  }

  if (ST.restTicker) clearInterval(ST.restTicker);
  ST.restTicker = setInterval(tickRest, 200);

  renderRestIsland();
}

function addRestTime(secs) {
  if (!ST.restActive) return;
  ST.restEndTime += secs * 1000;
  LS.set('dcrgym_rest_end', ST.restEndTime);
  const remaining = Math.ceil((ST.restEndTime - Date.now()) / 1000);
  const el = document.getElementById('rest-countdown');
  if (el) el.textContent = formatDuration(remaining);
}

function cancelRestTimer() {
  ST.restActive = false;
  ST.restExpired = false;
  document.body.classList.remove('rest-active');
  LS.remove('dcrgym_rest_end');
  if (ST.restTicker) { clearInterval(ST.restTicker); ST.restTicker = null; }
  if (ST.restGoTimeout) { clearTimeout(ST.restGoTimeout); ST.restGoTimeout = null; }
  if (navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({ type: 'CANCEL_NOTIFICATION' });
  }
  const island = document.getElementById('rest-island');
  if (island) island.classList.remove('visible', 'expanded', 'go');
}

function tickRest() {
  const remaining = Math.ceil((ST.restEndTime - Date.now()) / 1000);
  if (remaining <= 0) { restExpire(); return; }
  const el = document.getElementById('rest-countdown');
  if (el) el.textContent = formatDuration(remaining);
  updateRestHudRing(remaining);
}

// Expiry — the capsule morphs to the green GO state instead of vanishing,
// auto-expanding to show what's next, then dismisses itself.
function restExpire() {
  if (ST.restExpired) return;
  ST.restExpired = true;
  if (ST.restTicker) { clearInterval(ST.restTicker); ST.restTicker = null; }
  LS.remove('dcrgym_rest_end');
  playSound('chime');
  haptic('restDone');
  const island = document.getElementById('rest-island');
  const cd = document.getElementById('rest-countdown');
  const nx = document.getElementById('ri-next');
  if (cd) cd.textContent = 'GO';
  if (nx && !nx.textContent) nx.textContent = ST.restNextText || '';
  if (island) { island.classList.add('go'); island.classList.remove('expanded'); }
  const fill = document.getElementById('rest-hud-fill');
  if (fill) fill.style.strokeDashoffset = '0';
  ST.restGoTimeout = setTimeout(() => cancelRestTimer(), 7000);
}

function toggleRestIsland(e) {
  const island = document.getElementById('rest-island');
  if (!island) return;
  if (island.classList.contains('go')) { cancelRestTimer(); return; }
  haptic('tick');
  island.classList.toggle('expanded');
}

function initRestHudRing() {
  // Pre-compute strokeDasharray for the capsule ring (r=15, circ = 2πr)
  const r = 15, circ = 2 * Math.PI * r;
  const fill = document.getElementById('rest-hud-fill');
  if (fill) {
    fill.style.strokeDasharray  = circ.toFixed(2);
    fill.style.strokeDashoffset = '0'; // starts full
  }
}

function renderRestIsland() {
  const island = document.getElementById('rest-island');
  if (!island) return;
  const remaining = Math.ceil((ST.restEndTime - Date.now()) / 1000);
  if (remaining <= 0) { island.classList.remove('visible', 'expanded', 'go'); return; }
  ST.restExpired = false;
  island.classList.remove('go', 'expanded');
  const nx = document.getElementById('ri-next');
  if (nx) nx.textContent = ST.restNextText || '';
  if (!island.classList.contains('visible')) {
    requestAnimationFrame(() => island.classList.add('visible'));
  }
  const cd = document.getElementById('rest-countdown');
  if (cd) cd.textContent = formatDuration(remaining);
  initRestHudRing();
  updateRestHudRing(remaining);
}
// Legacy name — some render paths still call this
function renderRestBanner() { renderRestIsland(); }

function updateRestHudRing(remaining) {
  const fill = document.getElementById('rest-hud-fill');
  const r = 15, circ = 2 * Math.PI * r;
  if (fill && ST.restDuration > 0) {
    const pct = Math.max(0, Math.min(1, remaining / ST.restDuration));
    fill.style.strokeDashoffset = (circ * (1 - pct)).toFixed(2);
  }
}

// ── OTA update watcher — no more uninstall/reinstall, ever ──────────────────
// 1. Boot: if a new worker is already waiting, offer the restart chip.
// 2. updatefound: a deploy landed while the app is open → chip when ready.
// 3. Foregrounding the app re-checks for updates (throttled to 15 min).
// 4. Chip tap → SKIP_WAITING → controllerchange → seamless reload.
//    Never auto-reloads mid-workout — the user chooses the moment.
let _updateAccepted = false;
let _lastUpdateCheck = 0;

function initUpdateWatcher(reg) {
  if (reg.waiting && navigator.serviceWorker.controller) showUpdateChip();

  reg.addEventListener('updatefound', () => {
    const nw = reg.installing;
    if (!nw) return;
    nw.addEventListener('statechange', () => {
      if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateChip();
    });
  });

  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (_updateAccepted) location.reload();
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    if (Date.now() - _lastUpdateCheck < 15 * 60 * 1000) return;
    _lastUpdateCheck = Date.now();
    reg.update().catch(() => {});
  });
  reg.update().catch(() => {});
  _lastUpdateCheck = Date.now();
}

function showUpdateChip() {
  if (document.getElementById('update-chip')) return;
  const chip = document.createElement('button');
  chip.id = 'update-chip';
  chip.innerHTML = '<span class="uc-dot"></span>Update ready · tap to restart';
  chip.onclick = acceptUpdate;
  document.body.appendChild(chip);
  requestAnimationFrame(() => chip.classList.add('on'));
}

function acceptUpdate() {
  // Guard the live workout — everything is in localStorage already (saveNow),
  // but don't yank the floor mid-set without saving one last time.
  saveNow();
  _updateAccepted = true;
  haptic('tick');
  const reg = ST.swReg;
  if (reg && reg.waiting) {
    reg.waiting.postMessage({ type: 'SKIP_WAITING' });
  } else {
    location.reload();
  }
  const chip = document.getElementById('update-chip');
  if (chip) { chip.textContent = 'Restarting…'; chip.disabled = true; }
}

function checkForUpdateManual() {
  const reg = ST.swReg;
  if (!reg) { noticeSheet('Updates', 'Service worker not ready yet — try again in a moment.'); return; }
  _lastUpdateCheck = Date.now();
  reg.update().then(() => {
    setTimeout(() => {
      if (reg.waiting || reg.installing) showUpdateChip();
      else noticeSheet('Up to date', `You're on the latest build (${APP_BUILD}). New deploys also install themselves on the next launch.`);
    }, 1200);
  }).catch(() => noticeSheet('Updates', 'Could not reach the server — check your connection.'));
}

// ── Count-up ticker — numbers feel alive, never jumpy ────────────────────────
function countUp(el, target, opts = {}) {
  if (!el) return;
  const dur = opts.dur || 600;
  const decimals = opts.decimals || 0;
  const prefix = opts.prefix || '';
  const suffix = opts.suffix || '';
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.textContent = prefix + target.toFixed(decimals) + suffix;
    return;
  }
  const t0 = performance.now();
  function frame(t) {
    const p = Math.min(1, (t - t0) / dur);
    const eased = 1 - Math.pow(1 - p, 4);
    el.textContent = prefix + (target * eased).toFixed(decimals) + suffix;
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

// Run count-up on every [data-count] element inside a container
function tickStats(container) {
  (container || document).querySelectorAll('[data-count]').forEach(el => {
    const raw = el.getAttribute('data-count');
    const target = parseFloat(raw);
    if (isNaN(target)) return;
    const suffix = el.getAttribute('data-suffix') || '';
    const decimals = raw.includes('.') ? 1 : 0;
    countUp(el, target, { suffix, decimals });
  });
}

// ── Checkmark stroke-draw — the ✓ draws itself on completion ────────────────
function checkSVG() {

    stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

// ── Haptic vocabulary — the hand learns the language without looking ────────
function haptic(type) {
  if (!navigator.vibrate) return;
  const P = {
    tick:      8,                              // feather: taps, toggles
    set:       [14, 40, 22],                   // crisp double-pulse: set logged
    exercise:  [16, 50, 16, 50, 32],           // rising triple: exercise complete
    restDone:  [200, 100, 200, 100, 200, 100, 400], // insistent: rest expired
    finish:    [24, 60, 24, 60, 24, 60, 90],   // celebration wave
    milestone: [30, 70, 30, 70, 30, 70, 150],  // long milestone wave
  };
  try { navigator.vibrate(P[type] !== undefined ? P[type] : 10); } catch(e) {}
}

// ── Navigation ────────────────────────────────────────────────────────────────
const SCREENS = ['home','prog','session','workout','history','settings','workouts-browser'];

// ── Navigation tab order for slide direction resolution ─────────────────────
const SCREEN_ORDER = ['home', 'workouts-browser', 'history'];

function Maps(to, data={}) {
  const from = ST.screen;
  ST.screen = to;
  if (typeof closeNumpad === 'function') closeNumpad();

  // Render content into the destination screen BEFORE transition fires
  if (to === 'home')             renderHome();
  else if (to === 'prog')        renderProg(data);
  else if (to === 'session')     renderSession(data);
  else if (to === 'workout')     renderWorkout();
  else if (to === 'history')     renderHistory();
  else if (to === 'settings')    renderSettings();
  else if (to === 'workouts-browser') renderWorkoutsBrowser();

  // Status bar melts into the screen — charcoal cockpit in workout, cream elsewhere
  const themeMeta = document.querySelector('meta[name="theme-color"]');
  if (themeMeta) themeMeta.setAttribute('content', to === 'workout' ? '#1A1A1A' : '#FAF7F2');

  // Nav stays visible during workouts — browse history/weights mid-rest freely.
  // The live session keeps running; the workout pill brings you back.
  const nav = document.getElementById('bottom-nav');
  if (nav) nav.style.display = 'flex';
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === to);
  });

  updateWorkoutPill();

  // History API — Android's system back gesture navigates the app instead of
  // killing it. Overlays are handled in the popstate listener.
  if (!window.__navFromPop) {
    try {
      if (!(history.state && history.state.screen === to && !history.state.overlay)) {
        history.pushState({ screen: to }, '', '#' + to);
      }
    } catch(e) {}
  }

  // ── Kinetic transition engine ───────────────────────────────────────────────
  const fromEl = from ? document.getElementById('screen-' + from) : null;
  const toEl   = document.getElementById('screen-' + to);
  if (!toEl) return;

  // Instantly hide all screens that are neither source nor destination
  for (const id of SCREENS) {
    if (id !== from && id !== to) {
      const el = document.getElementById('screen-' + id);
      if (el) {
        el.style.display = 'none';
        el.classList.remove('active', 'slide-out-left', 'slide-out-right',
                                     'slide-in-left',  'slide-in-right');
      }
    }
  }

  if (!fromEl || from === to || from === null) {
    // First paint — no animation needed
    toEl.style.display = 'block';
    toEl.classList.add('active');
    return;
  }

  // Determine slide direction from the tab order
  const fromOrd = SCREEN_ORDER.indexOf(from);
  const toOrd   = SCREEN_ORDER.indexOf(to);
  // workout/prog/session are modals — always slide in from right
  const goRight = (fromOrd === -1 || toOrd === -1) ? true : toOrd > fromOrd;

  // Phase 1 — Position incoming screen off-canvas (no transition yet)
  toEl.style.transition = 'none';
  toEl.style.display = 'block';
  toEl.classList.remove('active');
  toEl.classList.add(goRight ? 'slide-in-right' : 'slide-in-left');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      // Phase 2 — Restore transitions and animate simultaneously
      toEl.style.transition = '';
      fromEl.style.transition = '';
      fromEl.classList.remove('active');
      fromEl.classList.add(goRight ? 'slide-out-left' : 'slide-out-right');
      toEl.classList.remove('slide-in-right', 'slide-in-left');
      toEl.classList.add('active');

      // Phase 3 — Cleanup outgoing screen after transition completes
      setTimeout(() => {
        fromEl.style.display = 'none';
        fromEl.classList.remove('slide-out-left', 'slide-out-right');
      }, 270);
    });
  });
}

function updateWorkoutPill() {
  const pill = document.getElementById('workout-pill');
  if (!pill) return;
  const hasActive = ST.currentProgram && ST.workoutStart && ST.durationTimer;
  const onWorkout = ST.screen === 'workout';
  if (hasActive && !onWorkout) {
    const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
    const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
    const nameEl = document.getElementById('pill-session-name');
    if (nameEl) nameEl.textContent = sess ? sess.name : 'Workout';
    const durEl = document.getElementById('pill-dur');
    if (durEl) durEl.textContent = formatDuration(ST.durationSecs);
    pill.classList.add('visible');
  } else {
    pill.classList.remove('visible');
  }
}

function buildSilhouetteSVG(targets, actuals, weekComplete) {
  // ── 4 unmistakable states ─────────────────────────────────────────────────
  //  dormant   (no sets)   flat warm-grey ink — clearly asleep
  //  behind    (<50%)      DEEP TERRACOTTA — attention, not reward
  //  on-track  (50–99%)    warm peach-gold
  //  complete  (≥100%)     darker-sage bloom — calm "done" reward, on-theme
  // The old encoding returned the SAME gold for 50% and 95% — never again.
  function pct(muscle) {
    const t = targets[muscle] || 0, a = actuals[muscle] || 0;
    if (!t || !a) return null;             // dormant
    return a / t;
  }
  function col(muscle) {
    const p = pct(muscle);
    if (p === null)  return 'oklch(76% 0.014 60 / 0.30)';  // dormant ink
    if (p < 0.50)    return 'oklch(48% 0.130 35 / 0.85)';  // behind — deep terracotta
    if (p < 1.00)    return 'oklch(70% 0.110 82 / 0.86)';  // on-track — peach-gold
    return 'oklch(56% 0.075 145 / 0.92)';                  // complete — darker muted sage (warm theme)
  }
  function isActive(muscle) {
    const t = targets[muscle] || 0, a = actuals[muscle] || 0;
    return t > 0 && a > 0;
  }
  function glowFilter(muscle) {
    const p = pct(muscle);
    if (p === null) return 'none';
    if (p >= 1.00)  return 'url(#glowGreen)';  // bloom is EARNED, only at 100% — emerald
    if (p >= 0.50)  return 'url(#glowLight)';  // soft halo on the way up
    return 'none';                             // behind = flat urgency, no reward glow
  }
  function pulse(muscle) {
    // Only neglected muscles breathe — the eye goes where the work is owed
    const p = pct(muscle);
    return p !== null && p < 0.50;

      stroke-linecap="round"

function getMuscleVolumeHistory(muscle) {
  const hist = getHistory();
  const now = Date.now();
  const msW = 7 * 24 * 3600 * 1000;
  return Array.from({ length: 5 }, (_, i) => {
    const wStart = now - (4 - i + 1) * msW;
    const wEnd   = now - (4 - i) * msW;
    let sets = 0;
    for (const w of hist) {
      if (w.endTime < wStart || w.endTime >= wEnd || !w.sets) continue;
      const prog = PROGRAMS.find(p => p.id === w.programId);
      if (!prog) continue;
      const sess = prog.sessions.find(s => s.id === w.sessionId);
      if (!sess) continue;
      for (const [key, s] of Object.entries(w.sets)) {
        const ex = sess.exercises[parseInt(key.split('_').pop())];
        if (ex && getMuscle(stripSuperset(ex.name)) === muscle) sets += s.length;
      }
    }
    const labels = ['W-4','W-3','W-2','Last','This'];
    return { label: labels[i], sets };
  });
}

// ── Muscle tap → premium glass overlay with SVG polyline chart ───────────────

// ── e1RM helpers (Epley: weight × (1 + reps/30)) ─────────────────────────────
function calcE1RM(weight, reps) {
  if (!weight || !reps || reps <= 0) return 0;
  return Math.round(weight * (1 + reps / 30));
}

// Top set = heaviest weight; ties broken by highest reps
function getTopSetE1RM(sets) {
  if (!sets || !sets.length) return 0;
  const valid = sets.filter(s => s && s.w > 0 && s.r > 0);
  if (!valid.length) return 0;
  const top = valid.reduce((best, s) => {
    if (s.w > best.w) return s;
    if (s.w === best.w && s.r > best.r) return s;
    return best;
  }, valid[0]);
  return calcE1RM(top.w, top.r);
}

// Session aggregate e1RM = sum of all exercises' top-set e1RM
// excludes _wu warm-up keys
function getSessionE1RM(histEntry, prog) {
  if (!histEntry || !histEntry.sets || !prog) return 0;
  const sess = prog.sessions.find(s => s.id === histEntry.sessionId);
  if (!sess) return 0;
  let total = 0;
  for (const [key, sets] of Object.entries(histEntry.sets)) {
    if (key.endsWith('_wu')) continue;  // exclude warm-up sets
    total += getTopSetE1RM(sets);
  }
  return total;
}

// Returns the previous history entry for the same sessionId (excluding current)
function getPrevSessionEntry(sessionId, excludeId) {
  const hist = getHistory()
    .filter(w => w.sessionId === sessionId && w.id !== excludeId)
    .sort((a, b) => (b.endTime || 0) - (a.endTime || 0));
  return hist[0] || null;
}

function getEpleyOverloadByMuscle(muscle, numWeeks = 5) {
  const hist = getHistory();
  const now = Date.now();
  const msW = 7 * 24 * 3600 * 1000;
  const exPeaks = {};      // latest-week per-exercise e1RM peaks (driver insight)
  const prevExPeaks = {};  // prior-week peaks for the delta
  const weeks = Array.from({ length: numWeeks }, (_, i) => {
    const wStart = now - (numWeeks - i) * msW;
    const wEnd   = now - (numWeeks - 1 - i) * msW;
    let peakE1RM = 0;
    for (const w of hist) {
      if (w.endTime < wStart || w.endTime >= wEnd || !w.sets) continue;
      const prog = PROGRAMS.find(p => p.id === w.programId);
      const sess = prog && prog.sessions.find(s => s.id === w.sessionId);
      for (const [key, sets] of Object.entries(w.sets)) {
        if (key.endsWith('_wu') || !Array.isArray(sets)) continue;
        const exIdx = parseInt(key.split('_').pop());
        const ex = sess && sess.exercises[exIdx];
        // Stamped _name wins — substituted sets feed the right muscle's curve
        const nm = ((sets.find(x => x && x._name) || {})._name) || (ex && stripSuperset(ex.name));
        if (!nm || getMuscle(nm) !== muscle) continue;
        const e = getTopSetE1RM(sets);
        if (e > peakE1RM) peakE1RM = e;
        if (i === numWeeks - 1 && e > (exPeaks[nm] || 0)) exPeaks[nm] = e;
        if (i === numWeeks - 2 && e > (prevExPeaks[nm] || 0)) prevExPeaks[nm] = e;
      }
    }
    const d = new Date(wStart + msW / 2);
    return {
      label: `w${i + 1}`,
      dateLabel: d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }),
      value: peakE1RM,
    };
  });
  // Driver — which lift is moving this muscle's index
  let driver = null;
  const top = Object.entries(exPeaks).sort((a, b) => b[1] - a[1])[0];
  if (top) {
    const prev = prevExPeaks[top[0]] || 0;
    driver = { name: top[0], e1rm: top[1], delta: prev > 0 ? Math.round((top[1] - prev) * 10) / 10 : null };
  }
  return { weeks, driver };
}

function openQuickLogModal(muscle) {
  // Quick-log: jump directly to workout screen filtered to this muscle
  const ns = typeof getNextSession === 'function' ? getNextSession() : null;
  if (ns && ns.prog && ns.session) {
    Maps('workout');
    setTimeout(() => {
      // Scroll/highlight first exercise matching this muscle group
      const cards = document.querySelectorAll('.exercise-card');
      for (const card of cards) {
        const title = card.querySelector('.exercise-name');
        if (!title) continue;
        const m = typeof getMuscle === 'function' ? getMuscle(title.textContent.trim()) : '';
        if (m === muscle) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.style.outline = '2px solid oklch(58.5% 0.210 32 / 0.70)';
          setTimeout(() => { card.style.outline = ''; }, 1800);
          break;
        }
      }
    }, 320);
  } else {
    // Fallback: open the overload graph
    openMuscleGraph(null, muscle);
  }
}

function openMuscleGraph(eOrMuscle, muscleOpt) {
  // Accept (event, muscle) or legacy (muscle) string signature
  let muscle, clientX, clientY;
  if (typeof eOrMuscle === 'string') {
    muscle = eOrMuscle; clientX = null; clientY = null;
  } else {
    muscle = muscleOpt;
    clientX = eOrMuscle ? eOrMuscle.clientX : null;
    clientY = eOrMuscle ? eOrMuscle.clientY : null;
  }

  // Focus vignette: dim all other muscle groups
  const totemEl = document.querySelector('.premium-totem-container');
  if (totemEl) {
    totemEl.classList.add('silhouette-focus-active');
    const focusedEl = totemEl.querySelector(`[data-muscle="${muscle}"]`);
    if (focusedEl) focusedEl.classList.add('muscle-focused');
  }

  // Set coordinate-driven transform-origin on the panel
  const panel = document.getElementById('muscle-graph-panel');
  if (panel && clientX !== null && clientY !== null) {
    const rect = panel.parentElement ? panel.parentElement.getBoundingClientRect()
                                     : { left: 0, top: 0 };
    const ox = (clientX - rect.left).toFixed(0);
    const oy = (clientY - rect.top).toFixed(0);
    panel.style.transformOrigin = `${ox}px ${oy}px`;
  } else if (panel) {
    panel.style.transformOrigin = 'center center';
  }

  // Render + show
  ST.mgMuscle = muscle;
  if (!ST.mgRange) ST.mgRange = 5;
  renderMuscleGraphContent();

  const ov = document.getElementById('muscle-graph-overlay');
  ov.style.display = 'flex';
  requestAnimationFrame(() => ov.classList.add('visible'));
  // Back gesture closes the panel, not the app
  try { history.pushState({ screen: ST.screen, overlay: 'muscle' }, '', '#muscle'); } catch(e) {}
}

// Switch muscle inside the open panel — no close-reopen-retap loop
function switchMuscleGraph(muscle) {
  ST.mgMuscle = muscle;
  haptic('tick');
  // Move the vignette focus with the selection
  const totemEl = document.querySelector('.premium-totem-container');
  if (totemEl) {
    totemEl.querySelectorAll('.muscle-focused').forEach(el => el.classList.remove('muscle-focused'));
    const focusedEl = totemEl.querySelector(`[data-muscle="${muscle}"]`);
    if (focusedEl) focusedEl.classList.add('muscle-focused');
  }
  renderMuscleGraphContent();
}

function setMuscleGraphRange(weeks) {
  ST.mgRange = weeks;
  haptic('tick');
  renderMuscleGraphContent();
}

const MG_MUSCLES = ['Chest','Back','Shoulders','Biceps','Triceps','Core','Glutes','Quads','Hamstrings','Calves','Traps'];

function renderMuscleGraphContent() {
  const muscle = ST.mgMuscle;
  const numWeeks = ST.mgRange || 5;
  const { weeks, driver } = getEpleyOverloadByMuscle(muscle, numWeeks);
  const vals  = weeks.map(w => w.value);
  const peak  = Math.max(...vals, 1);
  const thisWk = vals[vals.length - 1] || 0;
  const prevWk = vals[vals.length - 2] || 0;
  const hasData = vals.filter(v => v > 0).length >= 2;

  // Delta badge — light & airy numerals, token colors
  let deltaBadge;
  if (!hasData || (thisWk === 0 && prevWk === 0)) {
    deltaBadge = `<span class="mg-delta mg-delta-none">Baseline</span>`;
  } else if (prevWk === 0) {
    deltaBadge = `<span class="mg-delta mg-delta-up">▲ New</span>`;
  } else {
    const pct = Math.round(((thisWk - prevWk) / prevWk) * 100);
    const up  = pct >= 0;
    deltaBadge = `<span class="mg-delta ${up ? 'mg-delta-up' : 'mg-delta-down'}">${up ? '▲' : '▼'} ${up ? '+' : ''}${pct}%</span>`;
  }

  // ── Chart — full-width, dated axis, value chips, draw-in ──────────────────
  const W = 292, H = 132;
  const pad = { l: 12, r: 12, t: 22, b: 22 };
  const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;
  const minV = Math.min(...vals.filter(v => v > 0)) * 0.92 || 0;
  const maxV = peak * 1.06 || 1;
  const range = maxV - minV || 1;
  const xs = vals.map((_, i) => pad.l + (i / Math.max(vals.length - 1, 1)) * cW);
  const ys = vals.map(v => v > 0 ? pad.t + cH - ((v - minV) / range) * cH : pad.t + cH);

  const linePts = vals.map((v, i) => v > 0 ? `${xs[i].toFixed(1)},${ys[i].toFixed(1)}` : null).filter(Boolean).join(' ');
  const firstIdx = vals.findIndex(v => v > 0);
  const lastIdx  = vals.length - 1 - [...vals].reverse().findIndex(v => v > 0);
  const peakIdx  = vals.indexOf(Math.max(...vals));
  const areaPath = `M${xs[0].toFixed(1)},${(pad.t + cH).toFixed(1)} `
    + vals.map((v, i) => v > 0 ? `L${xs[i].toFixed(1)},${ys[i].toFixed(1)}` : '').join(' ')
    + ` L${xs[xs.length - 1].toFixed(1)},${(pad.t + cH).toFixed(1)} Z`;

  const dots = xs.map((x, i) => {
    if (!vals[i]) return '';
    const isNow = i === lastIdx;
    return `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${isNow ? 4 : 2.5}"
      fill="${isNow ? 'oklch(58.5% 0.210 32)' : 'oklch(58.5% 0.210 32 / 0.38)'}"
      stroke="${isNow ? '#fff' : 'none'}" stroke-width="${isNow ? 1.5 : 0}"/>`;
  }).join('');

  const unit = getWeightUnit();
  // Value chips on first / peak / last (deduped)
  const chipIdxs = [...new Set([firstIdx, peakIdx, lastIdx])].filter(i => i >= 0 && vals[i] > 0);
  const chips = chipIdxs.map(i => {
    const cx = Math.min(Math.max(xs[i], pad.l + 14), W - pad.r - 14);
    return `<g>
      <rect x="${(cx - 16).toFixed(1)}" y="${(ys[i] - 18).toFixed(1)}" width="32" height="13" rx="6.5"
        fill="#fff" stroke="oklch(91.2% 0.012 72)" stroke-width="0.5"/>
      <text x="${cx.toFixed(1)}" y="${(ys[i] - 8.4).toFixed(1)}" text-anchor="middle"
        font-size="8" font-weight="600" fill="oklch(22.8% 0.018 42)"
        font-family="var(--font-body)" style="font-variant-numeric:tabular-nums">${vals[i]} ${unit}</text>
    </g>`;
  }).join('');

  // Dated x-axis — first, middle, last
  const axisIdxs = [...new Set([0, Math.floor((weeks.length - 1) / 2), weeks.length - 1])];
  const axis = axisIdxs.map(i =>
    `<text x="${xs[i].toFixed(1)}" y="${H - 5}" text-anchor="middle" font-size="8.5"
      fill="oklch(60% 0.018 55)" font-family="var(--font-body)">${weeks[i].dateLabel}</text>`).join('');

  const chartSVG = hasData
    ? `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible">
        <defs>
          <linearGradient id="mgArea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="oklch(58.5% 0.210 32 / 0.13)"/>
            <stop offset="100%" stop-color="oklch(58.5% 0.210 32 / 0.01)"/>
          </linearGradient>
        </defs>
        <line x1="${pad.l}" y1="${(pad.t + cH).toFixed(1)}" x2="${(W - pad.r).toFixed(1)}" y2="${(pad.t + cH).toFixed(1)}"
          stroke="oklch(72% 0.030 60 / 0.25)" stroke-width="0.75"/>
        <path class="mg-area-draw" d="${areaPath}" fill="url(#mgArea)"/>
        <polyline class="mg-line-draw" pathLength="1" points="${linePts}" fill="none"
          stroke="oklch(58.5% 0.210 32 / 0.75)" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}${chips}${axis}
      </svg>`
    : `<p class="mg-empty">Log two weeks of training to see this curve.</p>`;

  // Driver insight — which lift is moving this index
  const driverHTML = driver
    ? `<div class="mg-driver">Driven by <strong>${driver.name}</strong>${
        driver.delta !== null ? ` <span class="${driver.delta >= 0 ? 'mg-driver-up' : 'mg-driver-down'}">${driver.delta >= 0 ? '+' : ''}${driver.delta} ${unit} e1RM</span>` : ''
      }</div>`
    : '';

  // Muscle switcher chips — jump between muscles without closing
  const switcher = `<div class="mg-switcher">${MG_MUSCLES.map(m =>
    `<button class="mg-chip${m === muscle ? ' active' : ''}" onclick="switchMuscleGraph('${m}')">${m}</button>`
  ).join('')}</div>`;

  document.getElementById('muscle-graph-content').innerHTML = `
    <div class="mg-head">
      <div>
        <div class="mg-muscle-title">${muscle}</div>
        <div class="mg-meta">e1RM · Epley · ${numWeeks} weeks</div>
      </div>
      ${deltaBadge}
    </div>
    ${switcher}
    <div class="mg-chart-wrap">${chartSVG}</div>
    ${driverHTML}
    <div class="mg-foot">
      <div class="mg-range">
        <button class="mg-range-btn${numWeeks === 5 ? ' active' : ''}"  onclick="setMuscleGraphRange(5)">5W</button>
        <button class="mg-range-btn${numWeeks === 12 ? ' active' : ''}" onclick="setMuscleGraphRange(12)">12W</button>
      </div>
      <div class="mg-now">${thisWk > 0 ? `now <strong>${thisWk} ${unit}</strong>` : ''}${peak > 0 && peak !== thisWk ? ` · peak <strong>${peak} ${unit}</strong>` : ''}</div>
    </div>`;

  // ── Scrubbing — drag a finger across the chart, the data follows ──────────
  if (hasData) {
    const wrap = document.querySelector('#muscle-graph-content .mg-chart-wrap');
    if (wrap) {
      wrap.style.position = 'relative';
      const tip = document.createElement('div');
      tip.className = 'mg-scrub-tip';
      wrap.appendChild(tip);
      let lastIdx = -1;
      const onMove = (clientX) => {
        const r = wrap.getBoundingClientRect();
        const relX = (clientX - r.left) / r.width * W;
        let best = -1, bd = 1e9;
        xs.forEach((x, i) => {
          if (vals[i] > 0) { const d = Math.abs(x - relX); if (d < bd) { bd = d; best = i; } }
        });
        if (best >= 0 && best !== lastIdx) {
          lastIdx = best;
          haptic('tick');
          tip.textContent = `${weeks[best].dateLabel} · ${vals[best]} ${unit}`;
          tip.style.left = Math.min(Math.max((xs[best] / W) * 100, 15), 85) + '%';
          tip.classList.add('on');
        }
      };
      wrap.addEventListener('touchstart', e => onMove(e.touches[0].clientX), { passive: true });
      wrap.addEventListener('touchmove',  e => onMove(e.touches[0].clientX), { passive: true });
      const end = () => { tip.classList.remove('on'); lastIdx = -1; };
      wrap.addEventListener('touchend', end);
      wrap.addEventListener('touchcancel', end);
    }
  }
}

// Swipe-down dismisses the muscle panel — same physics as the sheets
(function initMusclePanelDrag() {
  const panel = document.getElementById('muscle-graph-panel');
  if (!panel) return;
  let sy = 0, cy = 0, drag = false;
  panel.addEventListener('touchstart', (e) => {
    if (e.target.closest('button')) return;
    drag = true; sy = cy = e.touches[0].clientY;
    panel.style.transition = 'none';
  }, { passive: true });
  panel.addEventListener('touchmove', (e) => {
    if (!drag) return;
    cy = e.touches[0].clientY;
    let dy = cy - sy;
    if (dy < 0) dy = -Math.pow(-dy, 0.7);
    panel.style.transform = `translateY(${Math.max(dy, -20)}px)`;
  }, { passive: true });
  const end = () => {
    if (!drag) return;
    drag = false;
    const dy = cy - sy;
    panel.style.transition = '';
    panel.style.transform = '';
    if (dy > 90) { haptic('tick'); closeMuscleGraph(); }
  };
  panel.addEventListener('touchend', end);
  panel.addEventListener('touchcancel', end);
})();

function _clearSilhouetteFocus() {
  const totemEl = document.querySelector('.premium-totem-container');
  if (!totemEl) return;
  totemEl.classList.remove('silhouette-focus-active');
  totemEl.querySelectorAll('.muscle-focused').forEach(el => el.classList.remove('muscle-focused'));
}

  const container = document.getElementById('screen-home');
  if (!container) return;

  // ── 1. Native data retrieval ───────────────────────────────────────────────────
  let nextSessionName = 'SESSION';
  let targets         = {};
  let actuals         = {};
  let ns              = null;

  // Streak = distinct sessions completed this week for the active program
  const progId    = ST.defaultProgram || ST.currentProgram;
  const progObj   = progId ? PROGRAMS.find(p => p.id === progId) : null;
  const weekStartMs = (() => { const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); })();
  const doneThisWeek = new Set(
    getHistory()
      .filter(w => w.programId === progId && w.endTime >= weekStartMs)
      .map(w => w.sessionId)
  );
  const streak     = doneThisWeek.size;
  const totalSess  = progObj ? progObj.sessions.length : 0;
  const volPct     = totalSess > 0 ? Math.min(100, Math.round((streak / totalSess) * 100)) : 0;

  if (typeof getNextSession === 'function') {
    ns = getNextSession();
    if (ns && ns.session) {
      nextSessionName = (ns.session.name || 'SESSION').toUpperCase();
      if (typeof getWeeklyVolumeByMuscle === 'function' && ST.defaultProgram) {
        const vMuscle = getWeeklyVolumeByMuscle(ST.defaultProgram);
        if (vMuscle) {
          targets = vMuscle.targets || {};
          actuals = vMuscle.actuals || {};
        }
      }
    }
  }

  // ── 2. Resume strip — borderless, no card, no background ─────────────────────
  const resumed    = LS.get('dcrgym_current_workout');

        <div class="premium-resume-label">In Progress</div>
        <div class="premium-resume-name">${resumed.sessionName}</div>

        <button class="premium-resume-discard"  onclick="discardWorkout()">Discard</button>

  container.innerHTML = `

      </button>
    </div>

    <div class="premium-totem-container">
      ${typeof buildSilhouetteSVG === 'function' ? buildSilhouetteSVG(targets, actuals, checkWeekComplete()) : ''}
    </div>
    <div class="totem-legend">
      <span><span class="tl-dot tl-behind"></span>behind</span>
      <span><span class="tl-dot tl-track"></span>on track</span>
      <span><span class="tl-dot tl-done"></span>complete</span>

          <svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
          streak <span data-count="${streak}">${streak}</span>
        </div>
        <span style="opacity:0.15;font-style:normal;">│</span>
        <div class="metric-item">
          <svg viewBox="0 0 24 24"><path d="M6.5 6.5A2.5 2.5 0 0 1 9 4h0a2.5 2.5 0 0 1 2.5 2.5V8"/><path d="M14.5 8V6.5A2.5 2.5 0 0 1 17 4h0a2.5 2.5 0 0 1 2.5 2.5v4A8.5 8.5 0 0 1 11 19h-1a8 8 0 0 1-8-8v-1.5A2.5 2.5 0 0 1 4.5 7H5a2.5 2.5 0 0 1 2.5 2.5V11"/><path d="M11.5 8H14"/></svg>

      return `<div class="boarding-card" style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 20px 22px;">

        <button class="premium-action-pill" onclick="${ctaOnclick}">START WORKOUT</button>
      </div>`;
    })() : `<button class="premium-action-pill" onclick="${ctaOnclick}">CHOOSE A PROGRAM</button>`}`;

  // ── Silhouette interactive layer ─────────────────────────────────────────────
  requestAnimationFrame(() => {
    const totemEl = container.querySelector('.premium-totem-container');
    if (!totemEl) return;

    // Double-tap velocity state
    let _lastTapTime = 0;
    let _lastTapMuscle = null;

    // Delegated click: single tap = graph, rapid double-tap = quick-log
    totemEl.addEventListener('click', (e) => {
      const el = e.target.closest('[data-muscle]');
      if (!el) return;
      const muscle = el.dataset.muscle;
      const now = Date.now();
      const delta = now - _lastTapTime;
      if (_lastTapMuscle === muscle && delta < 300) {
        _lastTapTime = 0;
        _lastTapMuscle = null;
        openQuickLogModal(muscle);
      } else {
        _lastTapTime = now;
        _lastTapMuscle = muscle;
        openMuscleGraph(e, muscle);
      }
    });

    // Haptic topography: vibrate(10) on muscle boundary crossing
    let _lastHapticEl = null;
    totemEl.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      const hit = document.elementFromPoint(touch.clientX, touch.clientY);
      const muscleEl = hit ? hit.closest('[data-muscle]') : null;
      if (muscleEl && muscleEl !== _lastHapticEl) {
        _lastHapticEl = muscleEl;
        if (navigator.vibrate) navigator.vibrate(10);
      }
      if (!muscleEl) _lastHapticEl = null;
    }, { passive: true });
  });

  // Launch awakening + stat tickers — once per app launch, never on re-render
  if (!ST._homeTicked) {
    ST._homeTicked = true;
    container.classList.add('awaken');
    setTimeout(() => container.classList.remove('awaken'), 1100);
    requestAnimationFrame(() => tickStats(container));
  }
}

function renderSession(data={}) {
  const el = document.getElementById('screen-session');
  if (!el) return;
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  if (!prog) { Maps('prog'); return; }

  // Figure out next recommended session and which are done this week
  const hist = getHistory();
  const weekStart = (() => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); })();
  const msPerDay = 86400000;

  // Last completed session for this program (to determine next)
  const progHist = hist.filter(w => w.programId === prog.id).sort((a,b) => b.endTime - a.endTime);
  const lastSessId = progHist[0] ? progHist[0].sessionId : null;
  const lastIdx = lastSessId ? prog.sessions.findIndex(s => s.id === lastSessId) : -1;
  const nextSessId = prog.sessions[(lastIdx + 1) % prog.sessions.length].id;

  // Done sessions this week
  const doneThisWeek = {};
  for (const w of hist) {
    if (w.programId !== prog.id || w.endTime < weekStart) continue;
    const daysAgo = Math.floor((Date.now() - w.endTime) / msPerDay);
    if (!doneThisWeek[w.sessionId] || w.endTime > doneThisWeek[w.sessionId].endTime) {
      doneThisWeek[w.sessionId] = { daysAgo, endTime: w.endTime };
    }
  }

  el.innerHTML = `
  <div class="screen-content">
    <div class="prog-picker-header">
      <button class="back-btn" onclick="Maps('prog')">← Back</button>
      <h2>${prog.name}</h2>
      <p>${prog.daysPerWeek} days/week · Program #${prog.number}</p>
    </div>
    <div class="session-list">
      ${prog.sessions.map(s => {
        const isNext = s.id === nextSessId;
        const done = doneThisWeek[s.id];
        const doneLabel = done ? (done.daysAgo === 0 ? 'Today' : done.daysAgo === 1 ? 'Yesterday' : done.daysAgo + ' days ago') : null;
        return `
        <div class="session-card${isNext ? ' next-session' : ''}">
          <div style="flex:1;cursor:pointer" onclick="startWorkoutFromHome('${prog.id}','${s.id}')">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
              <h3>${s.name}</h3>
              ${isNext && !done ? `<span class="sess-next-badge">Next</span>` : ''}
              ${done ? `<span class="sess-done-chip">✓ ${doneLabel}</span>` : ''}
            </div>
            <p>${s.exercises.length} exercises</p>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <button class="preview-btn" onclick="previewSession('${prog.id}','${s.id}')" style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--text-secondary);cursor:pointer;min-height:36px">Preview</button>
            <div class="start-arrow" style="color:var(--muted);font-size:20px;cursor:pointer" onclick="startWorkoutFromHome('${prog.id}','${s.id}')">→</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function renderWorkoutsBrowser() {
  const el = document.getElementById('screen-workouts-browser');
  if (!el) return;

  // ── Resolve active program ────────────────────────────────────────────────
  const progId = ST.defaultProgram || ST.currentProgram;
  const prog   = progId ? PROGRAMS.find(p => p.id === progId) : null;

  // ── History helpers ───────────────────────────────────────────────────────
  const hist      = getHistory();
  const weekStart = (() => {
    const d = new Date(); d.setHours(0,0,0,0);
    d.setDate(d.getDate() - d.getDay());
    return d.getTime();
  })();

  // Last completed session per program → determine "Next" badge
  function getNextSessId(p) {
    const ph = hist.filter(w => w.programId === p.id).sort((a,b) => b.endTime - a.endTime);
    const lastIdx = ph[0] ? p.sessions.findIndex(s => s.id === ph[0].sessionId) : -1;
    return p.sessions[(lastIdx + 1) % p.sessions.length].id;
  }

  // Done-this-week map for a program
  function getDoneThisWeek(p) {
    const map = {};
    for (const w of hist) {
      if (w.programId !== p.id || w.endTime < weekStart) continue;
      const daysAgo = Math.floor((Date.now() - w.endTime) / 86400000);
      if (!map[w.sessionId] || w.endTime > map[w.sessionId].endTime)
        map[w.sessionId] = { daysAgo, endTime: w.endTime };
    }
    return map;
  }

  function doneLabel(d) {
    if (!d) return null;
    if (d.daysAgo === 0) return 'Today';
    if (d.daysAgo === 1) return 'Yesterday';
    return `${d.daysAgo}d ago`;

  // ── No program selected — show picker ────────────────────────────────────

        <p style="margin-top:16px;font-size:0.85rem;color:var(--text-secondary);line-height:1.5">Choose a program to begin logging sessions.</p>
      </div>
      <div style="padding:20px 20px 0">
        ${PROGRAMS.map(p => `
          <div onclick="selectProgramFromBrowser('${p.id}')"
               style="display:flex;align-items:center;gap:20px;padding:20px 4px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent">
            <div style="font-family:var(--font-hero);font-size:2rem;font-weight:700;color:var(--accent);min-width:36px;line-height:1">${p.daysPerWeek}</div>
            <div style="flex:1">
              <div style="font-size:0.92rem;font-weight:600;color:var(--charcoal);margin-bottom:3px">${p.name}</div>
              <div style="font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">${p.sessions.length} sessions · ${p.timeEstimate || '45–60 min'}</div>
            </div>
            <div style="color:var(--muted);font-size:18px;padding-right:4px">›</div>
          </div>`).join('')}

    return;
  }

  // ── Program selected — render session list ────────────────────────────────
  const nextSessId  = getNextSessId(prog);
  const doneThisWeek = getDoneThisWeek(prog);

  el.innerHTML = `
  <div class="screen-content" style="padding:0 0 calc(var(--nav-h) + 24px)">

        return `
