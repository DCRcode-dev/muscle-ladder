<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#FAF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>DCR Gym</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════════════════
   DCR GYM  ·  Ultra-Luxury Biometric Interface  ·  Phase 1-5 Production Rewrite
   ═══════════════════════════════════════════════════════════════════════════════ */

:root {
  /* ── OKLCH Surface & Spatial Architecture ── */
  --bg:                  oklch(97.8% 0.008 72);     /* #FAF7F2 vellum */
  --card:                oklch(100% 0 0);           /* pure white */
  --border:              oklch(91.2% 0.012 72);     /* #EDE8E0 warm divide */
  --accent:              oklch(58.5% 0.210 32);     /* #F04E23 terracotta */
  --green:               oklch(72.3% 0.190 145);    /* #22C55E emerald */
  --charcoal:            oklch(22.8% 0.018 42);     /* #2A2421 warm espresso */
  --muted:               oklch(72.0% 0.030 60);     /* #B8A99A sand */
  --text:                oklch(22.8% 0.018 42);     /* #2A2421 */
  --text-secondary:      oklch(44.0% 0.025 55);     /* #6B6259 mid-warm */
  --gold:                oklch(70.0% 0.110 82);     /* #C9A84C antique gold */
  --glow-coral:          oklch(72% 0.140 32);       /* silhouette bloom fill */
  --glow-peach:          oklch(84% 0.090 52);       /* silhouette mid fill */

  /* ── Semantic Surface Tokens ── */
  --surface-canvas:      var(--bg);
  --surface-card:        var(--card);
  --surface-raised:      oklch(99.2% 0.004 72);
  --surface-sunken:      oklch(94.8% 0.012 72);
  --surface-glass:       rgba(255, 255, 255, 0.82);
  --surface-glass-dark:  rgba(26, 24, 22, 0.92);

  /* ── Structural Borders & Dividers ── */
  --border-subtle:       var(--border);
  --border-strong:       oklch(84.0% 0.022 68);
  --border-accent:       oklch(58.5% 0.210 32 / 0.35);

  /* ── High-Contrast Typography Tokens ── */
  --text-primary:        var(--text);
  --text-tertiary:       var(--muted);
  --text-ghost:          oklch(78.0% 0.020 65);

  /* ── Functional Athletic Accents ── */
  --accent-kinetic:      var(--accent);             /* Primary Action / Kinetic */
  --accent-success:      var(--green);              /* Completed Set / Success */
  --accent-timer:        oklch(78.0% 0.160 85);     /* Active Countdown Amber-Gold */
  --accent-pr:           oklch(78.0% 0.150 88);     /* Specular Gold Milestone */
  --accent-danger:       oklch(55.0% 0.220 25);     /* Destructive / Burnout */

  /* ── Typography ── */
  --font-body: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, sans-serif;
  --font-hero: 'Cormorant Garamond', 'Didot', 'Bodoni MT', Georgia, serif;
  --font-mono: ui-monospace, 'SF Mono', 'Roboto Mono', 'JetBrains Mono', Menlo, monospace;

  /* ── Golden Ratio Spatial Scale (×8 / ×13 / ×21 / ×34 / ×55) ── */
  --space-xs:  8px;
  --space-sm: 13px;
  --space-md: 21px;
  --space-lg: 34px;
  --space-xl: 55px;

  /* ── 5-Step Mathematically Smooth Shadow Stack ── */
  --shadow-sm:
    0 1px  2px rgba(42,36,33,0.040),
    0 2px  4px rgba(42,36,33,0.025);
  --shadow:
    0 1px  2px rgba(42,36,33,0.040),
    0 2px  6px rgba(42,36,33,0.036),
    0 4px 12px rgba(42,36,33,0.028),
    0 8px 24px rgba(42,36,33,0.018),
    0 16px 40px rgba(42,36,33,0.010);
  --shadow-deep:
    0 2px  4px rgba(42,36,33,0.060),
    0 4px 12px rgba(42,36,33,0.055),
    0 8px 24px rgba(42,36,33,0.045),
    0 16px 48px rgba(42,36,33,0.030),
    0 32px 80px rgba(42,36,33,0.018);
  --shadow-cta:
    0 2px  4px rgba(42,36,33,0.100),
    0 4px 12px rgba(42,36,33,0.090),
    0 8px 24px rgba(42,36,33,0.075),
    0 16px 40px rgba(42,36,33,0.055),
    0 24px 64px rgba(42,36,33,0.030);

  /* ── Shape ── */
  --radius:    24px;
  --radius-sm: 16px;

  /* ── Layout ── */
  --nav-h:    72px;
  --header-h: 64px;

  /* ── Status palette ── */
  --amber:        oklch(76% 0.130 85);          /* flat-2-sessions amber */
  --terracotta:   oklch(48% 0.130 35);          /* deep burnt attention */

  /* ── Motion DNA — iOS Physics & Spring Curves ── */
  --ease:           cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring:    cubic-bezier(0.34, 1.56, 0.64, 1);
  --spring-snappy:  cubic-bezier(0.16, 1, 0.3, 1);
  --spring-bounce:  cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-instant:    120ms;
  --dur-fast:       180ms;
  --dur-med:        250ms;
  --dur-smooth:     260ms;
  --dur-slow:       340ms;
  --dur-deliberate: 400ms;
}

/* ── Native-feel guards ── */
button, .nav-btn, .ex-card-header, .hist-tab, .set-log-btn, .sub-card-header,
.stat-card, .finish-row, label, h1, h2, h3, .ex-name, .ex-meta {
  user-select: none; -webkit-user-select: none;
}
input, textarea { user-select: text; -webkit-user-select: text; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ── Global resets ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100svh; max-height: 100svh; overflow: hidden;
  background: var(--bg);
  font-family: var(--font-body);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  font-feature-settings: "liga" 1, "dlig" 1;
}

#app { height: 100svh; overflow: hidden; position: relative; background: transparent; }

/* ── Micro-noise grain overlay  (0.025 opacity per spec) ── */
#app::after {
  content: '';
  position: fixed; inset: 0; z-index: 999; pointer-events: none;
  opacity: 0.025; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
  background-repeat: repeat;
  background-size: 128px 128px;
}

/* ── Screen transitions ── */
.screen {
  position: absolute; inset: 0;
  background: var(--bg);
  overflow-y: auto; overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  will-change: transform, opacity;
  transition: transform 350ms cubic-bezier(0.16,1,0.3,1),
              opacity  350ms cubic-bezier(0.16,1,0.3,1);
  opacity: 0; pointer-events: none; z-index: 0;
}
.screen.active        { transform: translateX(0);   opacity: 1; pointer-events: all; z-index: 10; }
.screen.slide-out-left  { transform: translateX(-30%); opacity: 0; pointer-events: none; }
.screen.slide-out-right { transform: translateX(30%);  opacity: 0; pointer-events: none; }
.screen.slide-in-right  { transform: translateX(30%);  opacity: 0; pointer-events: none; }
.screen.slide-in-left   { transform: translateX(-30%); opacity: 0; pointer-events: none; }
.screen-content { padding-bottom: calc(var(--nav-h) + 24px); }
/* Island non-occlusion: every screen glides down beneath the rest capsule */
.screen { transition: transform 350ms cubic-bezier(0.16,1,0.3,1),
                      opacity  350ms cubic-bezier(0.16,1,0.3,1),
                      padding-top 340ms cubic-bezier(0.16,1,0.3,1); }
body.rest-active .screen { padding-top: calc(env(safe-area-inset-top, 0px) + 58px); }

/* ── Bottom nav ── */
#bottom-nav {
  position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  left: 50%; transform: translateX(-50%);
  width: calc(100% - 32px); max-width: 400px;
  background: rgba(250,247,242,0.82);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-radius: 24px;
  box-shadow: var(--shadow-deep);
  display: flex; align-items: center; justify-content: space-around;
  height: 56px; z-index: 100; padding: 0 8px;
}
.nav-btn {
  display: flex; flex-direction: column; align-items: center;
  gap: 3px; flex: 1; padding: 8px; border: none;
  background: none; cursor: pointer;
  color: var(--muted); font-size: 10px;
  font-family: var(--font-body);
  transition: color 350ms cubic-bezier(0.16,1,0.3,1);
  min-height: 44px; justify-content: center;
  letter-spacing: 0.04em;
}
.nav-btn.active { color: var(--charcoal); }
.nav-btn svg { width: 20px; height: 20px; stroke-width: 1.5; }

/* ── Masthead gear icon ── */
.masthead-gear {
  position: absolute; top: 48px; right: 28px;
  background: none; border: none; cursor: pointer; padding: 8px;
  color: var(--muted); opacity: 0.55;
  transition: opacity 200ms ease, transform 300ms ease;
  -webkit-tap-highlight-color: transparent;
}
.masthead-gear:active { transform: rotate(45deg); opacity: 1; }
.masthead-gear svg { width: 18px; height: 18px; display: block; }

/* ── Post-workout insight card ── */
.insight-card {
  margin: 16px 16px 0;
  background: rgba(250,247,242,0.90);
  backdrop-filter: blur(12px) saturate(1.2);
  -webkit-backdrop-filter: blur(12px) saturate(1.2);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px 18px;
  box-shadow: 0 2px 12px rgba(44,36,26,0.06), 0 8px 32px rgba(44,36,26,0.04);
}
.insight-card-eyebrow {
  font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.18em;
  color: var(--muted); opacity: 0.6; margin-bottom: 8px;
}
.insight-card-body {
  font-size: 12.5px; line-height: 1.65; color: var(--text-secondary);
  font-family: var(--font-body);
}
.insight-card-body strong {
  color: var(--charcoal); font-weight: 600;
}
.insight-card-meta {
  margin-top: 10px; font-size: 9.5px; color: var(--muted);
  opacity: 0.5; letter-spacing: 0.06em;
}

/* ── Splash — hard-coded inside #app, purely cosmetic ── */
#splash {
  position: absolute; inset: 0; background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  z-index: 999; transition: opacity 350ms ease-out;
  pointer-events: none;
}

/* ── Onboarding ── */
.ob-screen {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 100%;
  padding: 56px 28px 72px; text-align: center;
}
.ob-eyebrow {
  font-size: 0.7rem; text-transform: uppercase;
  letter-spacing: 0.18em; color: var(--muted); margin-bottom: 24px;
}
.ob-question {
  font-family: var(--font-hero); font-size: 2.5rem; font-weight: 600;
  font-style: italic; color: var(--charcoal);
  line-height: 1.12; margin-bottom: 10px;
}
.ob-hint {
  font-size: 14px; color: var(--text-secondary);
  margin-bottom: 44px; line-height: 1.55;
}
.ob-dots { display: flex; gap: 6px; margin-bottom: 40px; }
.ob-dot {
  width: 5px; height: 5px; border-radius: 3px;
  background: var(--border);
  transition: all var(--dur-slow) var(--ease);
}
.ob-dot.active { background: var(--accent); width: 22px; }
.ob-pill-grid {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 10px; width: 100%; max-width: 360px; margin-bottom: 32px;
}
.ob-pill {
  background: transparent; border: 1.5px solid var(--border);
  border-radius: 20px; padding: 20px 14px;
  cursor: pointer; text-align: left;
  transition: all 350ms cubic-bezier(0.16,1,0.3,1);
}
.ob-pill:active { transform: scale(0.96); }
.ob-pill.selected {
  border-color: var(--accent);
  background: rgba(240,78,35,0.04);
  box-shadow: 0 0 0 4px rgba(240,78,35,0.10), 0 8px 28px rgba(240,78,35,0.18);
}
.ob-pill-days {
  font-family: var(--font-hero); font-size: 2.4rem; font-weight: 700;
  color: var(--accent); line-height: 1;
}
.ob-pill-sub {
  font-size: 0.68rem; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--text-secondary); margin-top: 4px;
}
.ob-pill-name { font-size: 10.5px; color: var(--muted); margin-top: 5px; line-height: 1.35; }
.ob-cta {
  width: 100%; max-width: 300px; padding: 18px 28px;
  border-radius: 20px; border: none;
  background: var(--charcoal); color: #fff;
  font-family: var(--font-body); font-size: 15px; font-weight: 600;
  cursor: pointer; box-shadow: var(--shadow-cta);
  transition: transform 150ms, box-shadow 150ms; margin-bottom: 12px;
}
.ob-cta:active { transform: scale(0.97); }
.ob-cta-ghost {
  background: none; border: none; color: var(--muted);
  font-size: 14px; cursor: pointer; padding: 12px 20px;
  font-family: var(--font-body); transition: color 150ms;
}

/* ── Buttons ── */
.btn {
  display: block; width: 100%; padding: 16px 24px;
  border-radius: 16px; border: none;
  font-family: var(--font-body); font-size: 16px; font-weight: 600;
  cursor: pointer; transition: all var(--dur-fast) var(--ease);
  min-height: 52px;
}
.btn:active { transform: scale(0.97); opacity: 0.9; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-secondary { background: var(--border); color: var(--text-secondary); }
.btn-ghost { background: none; color: var(--muted); border: 1px solid var(--border); }

/* ── Themed confirm / notice sheets — system dialogs are banned ── */
.confirm-body {
  font-size: 14.5px; line-height: 1.55; color: var(--text-secondary);
  margin: 4px 0 18px;
}
.confirm-actions { display: flex; flex-direction: column; gap: 10px; padding-bottom: 4px; }
.confirm-actions .btn { margin: 0; }
.btn-destructive { background: #C0432A; color: #fff; }
.btn-sheet-secondary {
  background: #fff; color: var(--text);
  border: 1px solid var(--border); font-weight: 600;
}
.btn-sheet-ghost { background: none; border: none; color: var(--muted); font-weight: 500; min-height: 44px; }
.ex-sub-note {
  font-size: 11.5px; color: var(--muted); font-style: italic;
  margin: 1px 0 3px; letter-spacing: 0.01em;
}

/* ── Long-press card menu ── */
.ex-card.lifted { transform: scale(0.985); box-shadow: var(--shadow-deep); transition: transform var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease); }
#card-menu {
  position: fixed; left: 24px; z-index: 600;
  background: var(--card); border-radius: 16px;
  box-shadow: var(--shadow-deep); border: 0.5px solid var(--border);
  min-width: 218px; overflow: hidden;
  opacity: 0; transform: scale(0.94) translateY(-4px); transform-origin: top left;
  transition: opacity var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
}
#card-menu.open { opacity: 1; transform: none; }
#card-menu button {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 13px 16px; border: none; background: none; text-align: left;
  font-family: var(--font-body); font-size: 14px; color: var(--text);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
#card-menu button:active { background: rgba(42,36,33,0.04); }
#card-menu button + button { border-top: 0.5px solid var(--border); }
.cm-ic { width: 20px; text-align: center; color: var(--text-secondary); font-size: 15px; }

/* ── Boarding-pass Next Session card ── */
.boarding-card {
  margin: 10px 20px 0; background: var(--card); border-radius: 22px;
  box-shadow: var(--shadow); padding: 16px 18px 14px;
  text-align: left;
}
.bc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.bc-label { font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.bc-name { font-family: var(--font-hero); font-style: italic; font-size: 21px; font-weight: 600; color: var(--charcoal); line-height: 1.1; }
.bc-chip {
  flex-shrink: 0; font-size: 10px; padding: 5px 10px; border-radius: 11px;
  background: var(--bg); border: 0.5px solid var(--border); color: var(--text-secondary);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.bc-chip.bc-ready-high { color: var(--green); border-color: oklch(72.3% 0.190 145 / 0.3); }
.bc-chip.bc-ready-low  { color: var(--terracotta); border-color: oklch(48% 0.130 35 / 0.3); }
.bc-manifest { margin: 10px 0 12px; }
.bc-ex {
  display: flex; align-items: baseline; justify-content: space-between;
  font-size: 12px; color: var(--text-secondary); padding: 3.5px 0;
}
.bc-ex + .bc-ex { border-top: 0.5px solid var(--border); }
.bc-ex .bc-sets { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; flex-shrink: 0; margin-left: 12px; }
.bc-more { font-size: 10.5px; color: var(--muted); font-style: italic; padding-top: 5px; }
.boarding-card .premium-action-pill { margin: 0 auto !important; width: auto !important; min-width: 220px !important; max-width: 280px !important; }

/* ── Launch awakening — once per boot, the app wakes rather than loads ── */
.awaken .premium-masthead        { animation: awakenUp 520ms var(--ease) both; }
.awaken .premium-totem-container { animation: awakenBloom 680ms var(--ease) 90ms both; }
.awaken .totem-legend,
.awaken .premium-metrics-strip   { animation: awakenUp 520ms var(--ease) 190ms both; }
.awaken .premium-resume,
.awaken .boarding-card,
.awaken .premium-action-pill     { animation: awakenUp 560ms var(--ease) 280ms both; }
@keyframes awakenUp    { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes awakenBloom { from { opacity: 0; transform: scale(0.975); }    to { opacity: 1; transform: scale(1); } }

/* ── Chart scrub tooltip ── */
.mg-scrub-tip {
  position: absolute; top: -4px; transform: translateX(-50%);
  background: var(--charcoal); color: #FAF7F2;
  font-size: 10.5px; font-weight: 600; padding: 4px 9px; border-radius: 9px;
  white-space: nowrap; pointer-events: none; opacity: 0;
  font-variant-numeric: tabular-nums;
  transition: opacity var(--dur-fast) var(--ease), left 90ms linear;
}
.mg-scrub-tip.on { opacity: 1; }

/* ── OTA update chip — quiet, charcoal, never blocking ── */
#update-chip {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + var(--nav-h) + 26px);
  left: 50%; transform: translateX(-50%) translateY(16px);
  z-index: 380;
  display: flex; align-items: center; gap: 8px;
  background: var(--charcoal); color: #FAF7F2;
  border: none; border-radius: 19px;
  padding: 10px 18px;
  font-family: var(--font-body); font-size: 12.5px; font-weight: 600;
  letter-spacing: 0.01em; cursor: pointer;
  box-shadow: var(--shadow-deep);
  opacity: 0;
  transition: opacity var(--dur-med) var(--ease), transform var(--dur-slow) var(--ease);
  -webkit-tap-highlight-color: transparent;
}
#update-chip.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#update-chip:active { transform: translateX(-50%) scale(0.96); }
.uc-dot {
  width: 7px; height: 7px; border-radius: 4px; background: var(--green);
  animation: pillPulse 1.6s ease-in-out infinite;
}

/* ── Checkmark stroke-draw ── */
.check-draw { display: block; }
.check-draw path {
  stroke-dasharray: 30; stroke-dashoffset: 30;
  animation: checkDraw 340ms var(--ease) 50ms forwards;
}
@keyframes checkDraw { to { stroke-dashoffset: 0; } }
.set-log-btn { display: inline-flex; align-items: center; justify-content: center; }

/* ── HOME SCREEN — Premium 3-Zone Layout ── */
#screen-home {
  overflow: hidden !important;
  height: 100svh !important; max-height: 100svh !important;
  background: var(--bg) !important;
}
#screen-home.premium-home-wrapper {
  overflow: hidden !important;
}
.premium-home-wrapper {
  display: flex !important; flex-direction: column !important;
  justify-content: space-between !important; align-items: center !important;
  height: 100svh !important; max-height: 100svh !important; width: 100% !important;
  padding: 52px 32px calc(20px + 64px + 16px) !important;
  background: var(--bg) !important;
  box-sizing: border-box !important; overflow: hidden !important;
  position: relative !important;
}
.premium-masthead {
  display: flex !important; flex-direction: column !important;
  align-items: center !important; width: 100% !important; flex-shrink: 0 !important;
}
.premium-masthead .brand-title {
  font-family: 'Cormorant Garamond', 'Didot', serif !important;
  font-size: 3.0rem !important; font-style: italic !important;
  font-weight: 300 !important; letter-spacing: -0.01em !important;
  color: var(--charcoal) !important; line-height: 1.1 !important;
  font-feature-settings: "liga" 1, "dlig" 1 !important;
  margin-bottom: 4px !important;
}
.premium-totem-container {
  width: 100% !important; height: 44svh !important; max-height: 44svh !important;
  display: flex !important; align-items: center !important; justify-content: center !important;
  position: relative !important; background: transparent !important;
  flex-shrink: 0 !important; overflow: hidden !important;
}
.premium-totem-container svg {
  height: 100% !important; width: auto !important;
  max-height: 42svh !important; max-width: 100% !important;
  display: block !important; margin: 0 auto !important;
  background: transparent !important;
  filter: drop-shadow(0 24px 50px rgba(42,36,33,0.05))
          drop-shadow(0 6px 16px rgba(184,169,154,0.18)) !important;

}
.premium-totem-container svg path {

}
.premium-totem-container div {
  background: transparent !important;
}
.premium-metrics-strip {
  width: 100% !important; text-align: center !important;
  margin: 12px 0 !important; flex-shrink: 0 !important;
}
.premium-metrics-grid {
  display: flex !important; justify-content: center !important;
  align-items: center !important; gap: 16px !important;
  font-family: 'Cormorant Garamond', serif !important;
  font-size: 1.1rem !important; font-style: italic !important;
  color: var(--charcoal) !important;
}
.premium-metrics-grid .metric-item {
  display: flex !important; align-items: center !important; gap: 6px !important;
}
.premium-metrics-grid .metric-item svg {
  width: 18px !important; height: 18px !important;
  fill: none !important; stroke: var(--charcoal) !important;
  stroke-width: 1.5 !important; stroke-linecap: round !important;
  stroke-linejoin: round !important; flex-shrink: 0 !important;
  max-height: none !important; filter: none !important;

}
.premium-metrics-grid span {
  font-family: var(--font-body) !important;
  font-size: 0.85rem !important; font-weight: 700 !important;
  font-style: normal !important; color: var(--charcoal) !important;
  font-variant-numeric: tabular-nums lining-nums !important;
  margin-left: 2px !important;
}
.premium-resume {
  width: 100%; display: flex; align-items: center;
  justify-content: space-between; gap: 10px; flex-shrink: 0;
}
.premium-resume-info { flex: 1; min-width: 0; }
.premium-resume-label {
  font-size: 0.58rem; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--muted); margin-bottom: 2px;
}
.premium-resume-name {
  font-size: 13px; font-weight: 600; color: var(--charcoal);

}
.premium-resume-btns { display: flex; gap: 6px; flex-shrink: 0; }
.premium-resume-btns button {
  padding: 8px 14px; border-radius: 12px; font-size: 11px;
  font-weight: 600; border: none; cursor: pointer;
  font-family: var(--font-body); min-height: 36px;
