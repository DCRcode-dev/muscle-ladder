function getLastPerformance(exName) {
  // Lookup engine — scans ALL history indiscriminately by name alone.
  // Three resolution paths tried in order for every entry; no programId branching.
  // History sorted newest-to-oldest by endTime so we always return the most
  // recent match regardless of insertion order (e.g. Strong CSV bulk imports).
  const hist = getHistory()
    .filter(w => w && w.sets)
    .sort((a, b) => (b.endTime || 0) - (a.endTime || 0));

  for (const w of hist) {
    for (const [key, sets] of Object.entries(w.sets)) {
      if (!sets || sets.length === 0) continue;

      // ── Path 1: _name tag on set objects (Strong CSV imports) ──────────────
      // importStrongCSV stores _name: cleanExerciseName on every set row.
      let storedName = null;
      for (const s of sets) {
        if (s && s._name) { storedName = s._name; break; }
      }

      // ── Path 2: derive name from key ("import_bench_press" → "bench press") ─
      if (!storedName && key.startsWith('import_')) {
        storedName = key.slice(7).replace(/_/g, ' ');
      }

      // ── Path 3: program structure lookup (native app workouts) ─────────────
      // Key format: "{sessionId}_{exerciseIndex}" — e.g. "p7_s1_0"
      if (!storedName && w.programId && w.programId !== 'import') {
        const prog = PROGRAMS.find(p => p.id === w.programId);
        if (prog) {
          const sess = prog.sessions.find(s => s.id === w.sessionId);
          if (sess) {
            const exIdx = parseInt(key.split('_').pop());
            if (!isNaN(exIdx) && sess.exercises[exIdx]) {
              storedName = stripSuperset(sess.exercises[exIdx].name);
            }
          }
        }
      }

      if (!storedName) continue;

      // ── Match: fuzzy name comparison with alias resolution + parenthetical strip
      if (exercisesMatch(exName, storedName)) {
        const ws = sets.filter(s => s && s.r > 0);
        if (ws.length > 0) return ws;
      }
    }
  }
  return null;
}

function getStats() {
  const hist = getHistory();
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const weekStart = (() => { const d = new Date(now); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return d.getTime(); })();
  const thisMonth = hist.filter(w => w.endTime >= monthStart).length;
  const thisWeekVol = hist.filter(w => w.endTime >= weekStart).reduce((sum,w) => {
    if (!w.sets) return sum;
    return sum + Object.values(w.sets).flat().reduce((s,set) => s+(set.w||0)*(set.r||0),0);
  }, 0);
  // Streak: count consecutive weeks with at least 1 workout
  let streak = 0;
  const msPerWeek = 7*24*3600*1000;
  let checkWeek = weekStart;
  for (let i = 0; i < 52; i++) {
    const inWeek = hist.some(w => w.endTime >= checkWeek && w.endTime < checkWeek + msPerWeek);
    if (inWeek) { streak++; checkWeek -= msPerWeek; }
    else break;
  }
  return { thisMonth, streak, weekVol: Math.round(thisWeekVol) };
}

function getNextSession() {
  const dp = ST.defaultProgram;
  if (!dp) return null;
  const prog = PROGRAMS.find(p => p.id === dp);
  if (!prog) return null;
  const hist = getHistory().filter(w => w.programId === dp).sort((a,b) => b.endTime - a.endTime);
  if (hist.length === 0) return { prog, session: prog.sessions[0], isFirst: true };
  const lastSessId = hist[0].sessionId;
  const lastIdx = prog.sessions.findIndex(s => s.id === lastSessId);
  const nextIdx = (lastIdx + 1) % prog.sessions.length;
  const session = prog.sessions[nextIdx];
  // Average duration for this session
  const sessHist = hist.filter(w => w.sessionId === session.id && w.duration);
  const avgDur = sessHist.length > 0 ? Math.round(sessHist.reduce((s,w)=>s+w.duration,0)/sessHist.length) : null;
  return { prog, session, avgDur, isFirst: false };
}

function getWeeklyVolumeByMuscle(programId) {
  const prog = PROGRAMS.find(p => p.id === programId);
  if (!prog) return {};
  // Target: sum of all sets across all sessions for each muscle group
  const targets = {};
  for (const sess of prog.sessions) {
    for (const ex of sess.exercises) {
      const muscle = getMuscle(stripSuperset(ex.name));
      if (!targets[muscle]) targets[muscle] = 0;
      targets[muscle] += ex.workingSets || 0;
    }
  }
  // Actual: this week's logged sets
  const weekStart = (() => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); })();
  const actuals = {};
  for (const w of getHistory()) {
    if (w.programId !== programId || w.endTime < weekStart) continue;
    if (!w.sets) continue;
    const wp = PROGRAMS.find(p => p.id === w.programId);
    if (!wp) continue;
    const ws = wp.sessions.find(s => s.id === w.sessionId);
    if (!ws) continue;
    for (const [key, sets] of Object.entries(w.sets)) {
      const exIdx = parseInt(key.split('_').pop());
      const ex = ws.exercises[exIdx];
      if (!ex) continue;
      const muscle = getMuscle(stripSuperset(ex.name));
      if (!actuals[muscle]) actuals[muscle] = 0;
      actuals[muscle] += sets.length;
    }
  }
  return { targets, actuals };
}

function getMuscleProgress() {
  const hist = getHistory();
  const muscles = ['Chest','Back','Quads','Hamstrings','Shoulders','Biceps','Triceps','Glutes','Calves','Core'];
  const fourWeeksAgo = Date.now() - 28*24*3600*1000;
  const result = {};
  for (const muscle of muscles) {
    // Group by week, get best 1RM per week
    const weekData = {};
    for (const w of hist) {
      if (!w.sets || w.endTime < fourWeeksAgo) continue;
      const weekKey = Math.floor(w.endTime / (7*24*3600*1000));
      const prog = PROGRAMS.find(p => p.id === w.programId);
      if (!prog) continue;
      const sess = prog.sessions.find(s => s.id === w.sessionId);
      if (!sess) continue;
      for (const [key, sets] of Object.entries(w.sets)) {
        const exIdx = parseInt(key.split('_').pop());
        const ex = sess.exercises[exIdx];
        if (!ex) continue;
        if (getMuscle(stripSuperset(ex.name)) !== muscle) continue;
        for (const set of sets) {
          const rm = epley1RM(set.w||0, set.r||0);
          if (!weekData[weekKey] || rm > weekData[weekKey]) weekData[weekKey] = rm;
        }
      }
    }
    const weeks = Object.keys(weekData).sort((a,b)=>a-b);
    const values = weeks.map(w => weekData[w]);
    const latest = values[values.length-1] || 0;
    const prev = values[values.length-2] || 0;
    const flat3 = values.length >= 3 && values[values.length-1] <= values[values.length-2] && values[values.length-2] <= values[values.length-3];
    const flat2 = values.length >= 2 && values[values.length-1] <= values[values.length-2];
    const lastWorked = hist.filter(w => {
      if (!w.sets) return false;
      const p=PROGRAMS.find(pp=>pp.id===w.programId); if(!p) return false;
      const s=p.sessions.find(ss=>ss.id===w.sessionId); if(!s) return false;
      return Object.entries(w.sets).some(([key])=>{
        const i=parseInt(key.split('_').pop()); const ex=s.exercises[i];
        return ex && getMuscle(stripSuperset(ex.name))===muscle;
      });
    }).sort((a,b)=>b.endTime-a.endTime)[0];
    const daysSince = lastWorked ? Math.floor((Date.now()-lastWorked.endTime)/(24*3600*1000)) : 99;
    let dot = 'green';
    if (flat3 || daysSince >= 7) dot = 'red';
    else if (flat2) dot = 'amber';
    result[muscle] = { values, latest, dot, daysSince };
  }
  // Sort: red first, amber, green
  const order = {red:0, amber:1, green:2};
  return Object.entries(result).sort((a,b)=>order[a[1].dot]-order[b[1].dot]).map(([m,d])=>({muscle:m,...d}));
}

function checkDeload() {
  if (!ST.defaultProgram) return false;
  const hist = getHistory().filter(w => w.programId === ST.defaultProgram).sort((a,b)=>a.endTime-b.endTime);
  const prog = PROGRAMS.find(p => p.id === ST.defaultProgram);
  if (!prog) return false;
  const total = prog.sessions.length;
  if (hist.length < total * 4) return false;
  // Check last 4×sessions are all same program in order
  const recent = hist.slice(-total*4);
  let cycles = 0, idx = 0;
  for (const w of recent) {
    if (w.sessionId === prog.sessions[idx % total].id) { idx++; if (idx % total === 0) cycles++; }
    else { idx = 0; cycles = 0; }
  }
  return cycles >= 4;
}

function checkMilestone() {
  const total = getHistory().length;
  if ([1,10,25,50,100].includes(total)) return total;
  return null;
}


// ── Sound ─────────────────────────────────────────────────────────────────────
function playSound(type) {
  const s = getSettings();
  if (!s.sound) return;
  try {
    if (!ST.audioCtx) ST.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const ctx = ST.audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'set') {
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
      osc.start(); osc.stop(ctx.currentTime + 0.15);
    } else if (type === 'chime') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, ctx.currentTime);
      osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.15, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
      osc.start(); osc.stop(ctx.currentTime + 0.5);
    }
  } catch(e){}
}

// ── Rest timer ────────────────────────────────────────────────────────────────
function startRestTimer(seconds, exName, nextText, afterText, isLast) {
  const endTime = Date.now() + seconds * 1000;
  ST.restActive    = true;
  ST.restDuration  = seconds;   // full duration for ring progress
  ST.restEndTime   = endTime;
  ST.restExName    = exName;
  ST.restNextText  = nextText  || '';
  ST.restAfterText = afterText || '';
  ST.restIsLast    = !!isLast;
  document.body.classList.add('rest-active');
  LS.set('dcrgym_rest_end',  endTime);
  LS.set('dcrgym_rest_next', nextText || '');

  if (ST.swReg && ST.notifEnabled && navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({
      type: 'SCHEDULE_NOTIFICATION', delay: seconds * 1000
    });
  }

  if (ST.restTicker) clearInterval(ST.restTicker);
  ST.restTicker = setInterval(tickRest, 200);

  renderRestBanner();
  // renderRestOverlay() — replaced by non-blocking HUD; overlay disabled.
  initRestHudRing();
}

function addRestTime(secs) {
  if (!ST.restActive) return;
  ST.restEndTime += secs * 1000;
  LS.set('dcrgym_rest_end', ST.restEndTime);
  const remaining = Math.ceil((ST.restEndTime - Date.now()) / 1000);
  const el = document.getElementById('rest-countdown');
  if (el) el.textContent = formatDuration(remaining);
  updateRestOverlayUI(remaining);
}

function cancelRestTimer() {
  ST.restActive = false;
  document.body.classList.remove('rest-active');
  LS.remove('dcrgym_rest_end');
  if (ST.restTicker) { clearInterval(ST.restTicker); ST.restTicker = null; }
  if (navigator.serviceWorker.controller) {
    navigator.serviceWorker.controller.postMessage({ type: 'CANCEL_NOTIFICATION' });
  }

  // Hide floating pill
  const banner = document.getElementById('rest-banner');
  if (banner) {
    banner.classList.remove('visible');
    setTimeout(() => { banner.style.display = 'none'; }, 350);
  }

  // Dismiss ambient overlay
  const ov = document.getElementById('rest-overlay');
  if (ov) {
    ov.classList.remove('visible');
    // Focus first non-logged input in active exercise after overlay fades
    setTimeout(() => {
      const inp = document.querySelector('.set-input:not(.logged)');
      if (inp) inp.focus();
    }, 340);
  }
}

function tickRest() {
  const remaining = Math.ceil((ST.restEndTime - Date.now()) / 1000);
  if (remaining <= 0) {
    playSound('chime');
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    cancelRestTimer();
    return;
  }
  const el = document.getElementById('rest-countdown');
  if (el) el.textContent = formatDuration(remaining);
  updateRestHudRing(remaining);
  updateRestOverlayUI(remaining); // kept for backward compat (overlay is hidden)
}

function initRestHudRing() {
  // Pre-compute strokeDasharray for the HUD ring (r=19, circ = 2πr)
  const r = 19, circ = 2 * Math.PI * r;
  const fill = document.getElementById('rest-hud-fill');
  if (fill) {
    fill.style.strokeDasharray  = circ.toFixed(2);
    fill.style.strokeDashoffset = '0'; // starts full
  }
}

function renderRestBanner() {
  const banner = document.getElementById('rest-banner');
  if (!banner) return;
  const remaining = Math.ceil((ST.restEndTime - Date.now()) / 1000);
  if (remaining <= 0) { banner.style.display = 'none'; banner.classList.remove('visible'); return; }
  if (!banner.classList.contains('visible')) {
    banner.style.display = 'flex';
    requestAnimationFrame(() => banner.classList.add('visible'));
  }
  const cd = document.getElementById('rest-countdown');
  if (cd) cd.textContent = formatDuration(remaining);
  updateRestHudRing(remaining);
}

function updateRestHudRing(remaining) {
  // Update mini SVG ring in HUD
  const fill  = document.getElementById('rest-hud-fill');
  const digit = document.getElementById('rest-hud-digit');
  const r = 19, circ = 2 * Math.PI * r;
  if (fill && ST.restDuration > 0) {
    const pct = Math.max(0, Math.min(1, remaining / ST.restDuration));
    fill.style.strokeDashoffset = (circ * (1 - pct)).toFixed(2);
  }
  if (digit) {
    // Show seconds only if ≤99s, else formatted
    digit.textContent = remaining > 99 ? formatDuration(remaining) : remaining + 's';
  }
}

// ── Ambient fullscreen rest overlay ─────────────────────────────────────────
function renderRestOverlay() {
  const ov = document.getElementById('rest-overlay');
  if (!ov) return;

  // Pre-compute ring geometry
  const r = 88;
  const circ = 2 * Math.PI * r;
  const fill = document.getElementById('rest-ring-fill');
  if (fill) {
    fill.style.strokeDasharray  = circ;
    fill.style.strokeDashoffset = 0;   // starts full
  }

  // Populate next-text
  const nxEl = document.getElementById('rest-overlay-next');
  if (nxEl) nxEl.textContent = ST.restNextText || '';

  // Animate in
  requestAnimationFrame(() => ov.classList.add('visible'));
  updateRestOverlayUI(Math.ceil((ST.restEndTime - Date.now()) / 1000));
}

function updateRestOverlayUI(remaining) {
  const digits = document.getElementById('rest-overlay-digits');
  if (digits) digits.textContent = formatDuration(Math.max(0, remaining));

  // Ring fill: strokeDashoffset from 0 (full) → circ (empty)
  const fill = document.getElementById('rest-ring-fill');
  if (fill && ST.restDuration > 0) {
    const r    = 88;
    const circ = 2 * Math.PI * r;
    const pct  = Math.max(0, Math.min(1, remaining / ST.restDuration));
    fill.style.strokeDashoffset = circ * (1 - pct);
  }
}

// ── Navigation ────────────────────────────────────────────────────────────────
const SCREENS = ['home','prog','session','workout','history','settings','workouts-browser','analysis'];

// ── Navigation tab order for slide direction resolution ─────────────────────
const SCREEN_ORDER = ['home', 'workouts-browser', 'history', 'analysis'];

function Maps(to, data={}) {
  const from = ST.screen;
  ST.screen = to;

  // Render content into the destination screen BEFORE transition fires
  if (to === 'home')             renderHome();
  else if (to === 'prog')        renderProg(data);
  else if (to === 'session')     renderSession(data);
  else if (to === 'workout')     renderWorkout();
  else if (to === 'history')     renderHistory();
  else if (to === 'settings')    renderSettings();
  else if (to === 'workouts-browser') renderWorkoutsBrowser();
  else if (to === 'analysis')    renderAnalysis();

  // Nav visibility: hidden only during active training session
  const nav = document.getElementById('bottom-nav');
  if (nav) nav.style.display = (to === 'workout') ? 'none' : 'flex';
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.nav === to);
  });

  updateWorkoutPill();

  // ── Kinetic transition engine ───────────────────────────────────────────────
  const fromEl = from ? document.getElementById('screen-' + from) : null;
  const toEl   = document.getElementById('screen-' + to);
  if (!toEl) return;

  // Instantly hide all screens that are neither source nor destination
  for (const id of SCREENS) {
    if (id !== from && id !== to) {
      const el = document.getElementById('screen-' + id);
      if (el) {
        el.style.display = 'none';
        el.classList.remove('active', 'slide-out-left', 'slide-out-right',
                                     'slide-in-left',  'slide-in-right');
      }
    }
  }

  if (!fromEl || from === to || from === null) {
    // First paint — no animation needed
    toEl.style.display = 'block';
    toEl.classList.add('active');
    return;
  }

  // Determine slide direction from the tab order
  const fromOrd = SCREEN_ORDER.indexOf(from);
  const toOrd   = SCREEN_ORDER.indexOf(to);
  // workout/prog/session are modals — always slide in from right
  const goRight = (fromOrd === -1 || toOrd === -1) ? true : toOrd > fromOrd;

  // Phase 1 — Position incoming screen off-canvas (no transition yet)
  toEl.style.transition = 'none';
  toEl.style.display = 'block';
  toEl.classList.remove('active');
  toEl.classList.add(goRight ? 'slide-in-right' : 'slide-in-left');

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      // Phase 2 — Restore transitions and animate simultaneously
      toEl.style.transition = '';
      fromEl.style.transition = '';
      fromEl.classList.remove('active');
      fromEl.classList.add(goRight ? 'slide-out-left' : 'slide-out-right');
      toEl.classList.remove('slide-in-right', 'slide-in-left');
      toEl.classList.add('active');

      // Phase 3 — Cleanup outgoing screen after transition completes
      setTimeout(() => {
        fromEl.style.display = 'none';
        fromEl.classList.remove('slide-out-left', 'slide-out-right');
      }, 270);
    });
  });
}

function updateWorkoutPill() {
  const pill = document.getElementById('workout-pill');
  if (!pill) return;
  const hasActive = ST.currentProgram && ST.workoutStart && ST.durationTimer;
  const onWorkout = ST.screen === 'workout';
  if (hasActive && !onWorkout) {
    const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
    const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
    const nameEl = document.getElementById('pill-session-name');
    if (nameEl) nameEl.textContent = sess ? sess.name : 'Workout';
    const durEl = document.getElementById('pill-dur');
    if (durEl) durEl.textContent = formatDuration(ST.durationSecs);
    pill.classList.add('visible');
  } else {
    pill.classList.remove('visible');
  }
}

function getMuscleVolumeHistory(muscle) {
  const hist = getHistory();
  const now = Date.now();
  const msW = 7 * 24 * 3600 * 1000;
  return Array.from({ length: 5 }, (_, i) => {
    const wStart = now - (4 - i + 1) * msW;
    const wEnd   = now - (4 - i) * msW;
    let sets = 0;
    for (const w of hist) {
      if (w.endTime < wStart || w.endTime >= wEnd || !w.sets) continue;
      const prog = PROGRAMS.find(p => p.id === w.programId);
      if (!prog) continue;
      const sess = prog.sessions.find(s => s.id === w.sessionId);
      if (!sess) continue;
      for (const [key, s] of Object.entries(w.sets)) {
        const ex = sess.exercises[parseInt(key.split('_').pop())];
        if (ex && getMuscle(stripSuperset(ex.name)) === muscle) sets += s.length;
      }
    }
    const labels = ['W-4','W-3','W-2','Last','This'];
    return { label: labels[i], sets };
  });
}

// ── Muscle tap → premium glass overlay with SVG polyline chart ───────────────

function getEpleyOverloadByMuscle(muscle) {
  const hist = getHistory();
  const now = Date.now();
  const msW = 7 * 24 * 3600 * 1000;
  return Array.from({ length: 5 }, (_, i) => {
    const wStart = now - (5 - i) * msW;
    const wEnd   = now - (4 - i) * msW;
    let peakOverload = 0;
    for (const w of hist) {
      if (w.endTime < wStart || w.endTime >= wEnd || !w.sets) continue;
      const prog = PROGRAMS.find(p => p.id === w.programId);
      if (!prog) continue;
      const sess = prog.sessions.find(s => s.id === w.sessionId);
      if (!sess) continue;
      for (const [key, sets] of Object.entries(w.sets)) {
        const ex = sess.exercises[parseInt(key.split('_').pop())];
        if (!ex) continue;
        if (getMuscle(stripSuperset(ex.name)) !== muscle) continue;
        const validSets = sets.filter(Boolean);
        const totalReps  = validSets.reduce((s, x) => s + (x.r || 0), 0);
        const maxWeight  = validSets.reduce((m, x) => Math.max(m, x.w || 0), 0);
        if (maxWeight > 0 && totalReps > 0) {
          const overload = Math.round(maxWeight * (1 + 0.033 * totalReps));
          if (overload > peakOverload) peakOverload = overload;
        }
      }
    }
    return { label: `w${i + 1}`, value: peakOverload };
  });
}

function openQuickLogModal(muscle) {
  // Quick-log: jump directly to workout screen filtered to this muscle
  const ns = typeof getNextSession === 'function' ? getNextSession() : null;
  if (ns && ns.prog && ns.session) {
    Maps('workout');
    setTimeout(() => {
      // Scroll/highlight first exercise matching this muscle group
      const cards = document.querySelectorAll('.exercise-card');
      for (const card of cards) {
        const title = card.querySelector('.exercise-name');
        if (!title) continue;
        const m = typeof getMuscle === 'function' ? getMuscle(title.textContent.trim()) : '';
        if (m === muscle) {
          card.scrollIntoView({ behavior: 'smooth', block: 'center' });
          card.style.outline = '2px solid oklch(58.5% 0.210 32 / 0.70)';
          setTimeout(() => { card.style.outline = ''; }, 1800);
          break;
        }
      }
    }, 320);
  } else {
    // Fallback: open the overload graph
    openMuscleGraph(null, muscle);
  }
}

function openMuscleGraph(eOrMuscle, muscleOpt) {
  // Accept (event, muscle) or legacy (muscle) string signature
  let muscle, clientX, clientY;
  if (typeof eOrMuscle === 'string') {
    muscle = eOrMuscle; clientX = null; clientY = null;
  } else {
    muscle = muscleOpt;
    clientX = eOrMuscle ? eOrMuscle.clientX : null;
    clientY = eOrMuscle ? eOrMuscle.clientY : null;
  }

  // Focus vignette: dim all other muscle groups
  const totemEl = document.querySelector('.premium-totem-container');
  if (totemEl) {
    totemEl.classList.add('silhouette-focus-active');
    const focusedEl = totemEl.querySelector(`[data-muscle="${muscle}"]`);
    if (focusedEl) focusedEl.classList.add('muscle-focused');
  }

  // Set coordinate-driven transform-origin on the panel
  const panel = document.getElementById('muscle-graph-panel');
  if (panel && clientX !== null && clientY !== null) {
    const rect = panel.parentElement ? panel.parentElement.getBoundingClientRect()
                                     : { left: 0, top: 0 };
    const ox = (clientX - rect.left).toFixed(0);
    const oy = (clientY - rect.top).toFixed(0);
    panel.style.transformOrigin = `${ox}px ${oy}px`;
  } else if (panel) {
    panel.style.transformOrigin = 'center center';
  }

  const weeks  = getEpleyOverloadByMuscle(muscle);
  const vals   = weeks.map(w => w.value);
  const labels = weeks.map(w => w.label);
  const peak   = Math.max(...vals, 1);
  const thisWk = vals[4];
  const lastWk = vals[3];
  const delta  = thisWk - lastWk;
  const deltaColor = delta >= 0 ? 'rgba(96,184,110,0.95)' : 'rgba(228,88,68,0.95)';
  const deltaStr   = (delta >= 0 ? '+' : '') + delta;

  // Luxury SVG line chart
  const W = 292, H = 98;
  const pad = { l: 14, r: 14, t: 18, b: 26 };
  const cW = W - pad.l - pad.r, cH = H - pad.t - pad.b;
  const minV = Math.min(...vals.filter(v => v > 0)) || 0;
  const maxV = peak;
  const range = maxV - minV || 1;

  const xs = vals.map((_, i) => pad.l + (i / (vals.length - 1)) * cW);
  const ys = vals.map(v  => pad.t + cH - ((Math.max(v, minV) - minV) / range) * cH);

  const linePts  = xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  const areaPath = `M${xs[0].toFixed(1)},${ys[0].toFixed(1)} `
    + xs.map((x, i) => `L${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ')
    + ` L${xs[xs.length-1].toFixed(1)},${(H-pad.b).toFixed(1)}`
    + ` L${xs[0].toFixed(1)},${(H-pad.b).toFixed(1)} Z`;

  const hasData = vals.filter(v => v > 0).length >= 2;

  const gridLines = [0, 0.5, 1].map(f => {
    const y   = pad.t + cH * (1 - f);
    const val = Math.round(minV + f * range);
    return val > 0 ? `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${(W-pad.r).toFixed(1)}"
      y2="${y.toFixed(1)}" stroke="rgba(255,255,255,0.09)"
      stroke-width="1" stroke-dasharray="2,5"/>
      <text x="${pad.l}" y="${(y-3).toFixed(1)}" font-size="7.5"
        fill="rgba(255,255,255,0.26)" font-family="-apple-system,sans-serif">${val}</text>` : '';
  }).join('');

  const dots = xs.map((x, i) => {
    if (!vals[i]) return '';
    const isNow = i === vals.length - 1;
    return `<circle cx="${x.toFixed(1)}" cy="${ys[i].toFixed(1)}"
      r="${isNow ? 4.5 : 2.5}"
      fill="${isNow ? '#F0826A' : 'rgba(240,148,118,0.65)'}">
      ${isNow ? `<animate attributeName="opacity" values="1;0.6;1" dur="2.2s" repeatCount="indefinite"/>` : ''}
    </circle>`;
  }).join('');

  const lbls = labels.map((lbl, i) =>
    `<text x="${xs[i].toFixed(1)}" y="${H - 5}" text-anchor="middle"
      font-size="8" fill="rgba(255,255,255,0.38)"
      font-family="'Courier New', monospace">${lbl}</text>`
  ).join('');

  const chartSVG = hasData
    ? `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible">
        <defs>
          <linearGradient id="epleyAreaGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="rgba(240,130,105,0.30)"/>
            <stop offset="100%" stop-color="rgba(240,130,105,0.02)"/>
          </linearGradient>
        </defs>
        ${gridLines}
        <path d="${areaPath}" fill="url(#epleyAreaGrad)"/>
        <polyline points="${linePts}" fill="none" stroke="rgba(240,148,118,0.88)"
          stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        ${dots}${lbls}
      </svg>`
    : `<p style="font-size:12px;color:rgba(255,255,255,0.40);font-style:italic;margin:18px 0;text-align:center">Log 2+ weeks to see your overload trend.</p>`;

  document.getElementById('muscle-graph-content').innerHTML = `
    <div class="mg-muscle-title">${muscle}</div>
    <div class="mg-meta">Progressive Overload · Epley Index</div>
    <div style="margin:10px 0 6px">${chartSVG}</div>
    <div class="mg-stat-row">
      <div class="mg-stat">
        <div class="mg-stat-val">${thisWk > 0 ? thisWk : '—'}</div>
        <div class="mg-stat-lbl">This Week</div>
      </div>
      <div class="mg-stat">
        <div class="mg-stat-val" style="color:${deltaColor};font-size:${Math.abs(delta)>99?'14px':'18px'}">
          ${thisWk > 0 && lastWk > 0 ? deltaStr : '—'}
        </div>
        <div class="mg-stat-lbl">vs Last</div>
      </div>
      <div class="mg-stat">
        <div class="mg-stat-val">${peak > 0 ? peak : '—'}</div>
        <div class="mg-stat-lbl">Peak</div>
      </div>
    </div>`;

  const ov = document.getElementById('muscle-graph-overlay');
  ov.style.display = 'flex';
  requestAnimationFrame(() => ov.classList.add('visible'));
}

    // Delegated click: single tap = graph, rapid double-tap = quick-log
    totemEl.addEventListener('click', (e) => {
      const el = e.target.closest('[data-muscle]');
      if (!el) return;
      const muscle = el.dataset.muscle;
      const now = Date.now();
      const delta = now - _lastTapTime;
      if (_lastTapMuscle === muscle && delta < 300) {
        _lastTapTime = 0;

      }
    });

    // Haptic topography: vibrate(10) on muscle boundary crossing
    let _lastHapticEl = null;

        if (navigator.vibrate) navigator.vibrate(10);
      }
      if (!muscleEl) _lastHapticEl = null;
    }, { passive: true });
  });

    </div>
    <div class="prog-list">
      ${progs.map(p=>`
        <div class="prog-card" onclick="selectProgram('${p.id}')">
          <div class="prog-card-days">${p.daysPerWeek}</div>
          <div class="prog-card-info">
            <h3>${p.name}</h3>
            <p>Program #${p.number} · ${p.sessions.length} sessions · ${p.timeEstimate||'45–60 min'}</p>
          </div>
        </div>`).join('')}
    </div>
  </div>`;
}

function renderSession(data={}) {
  const el = document.getElementById('screen-session');
  if (!el) return;
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  if (!prog) { Maps('prog'); return; }

  // Figure out next recommended session and which are done this week
  const hist = getHistory();
  const weekStart = (() => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); })();
  const msPerDay = 86400000;

  // Last completed session for this program (to determine next)
  const progHist = hist.filter(w => w.programId === prog.id).sort((a,b) => b.endTime - a.endTime);
  const lastSessId = progHist[0] ? progHist[0].sessionId : null;
  const lastIdx = lastSessId ? prog.sessions.findIndex(s => s.id === lastSessId) : -1;
  const nextSessId = prog.sessions[(lastIdx + 1) % prog.sessions.length].id;

  // Done sessions this week
  const doneThisWeek = {};
  for (const w of hist) {
    if (w.programId !== prog.id || w.endTime < weekStart) continue;
    const daysAgo = Math.floor((Date.now() - w.endTime) / msPerDay);
    if (!doneThisWeek[w.sessionId] || w.endTime > doneThisWeek[w.sessionId].endTime) {
      doneThisWeek[w.sessionId] = { daysAgo, endTime: w.endTime };
    }
  }

  el.innerHTML = `
  <div class="screen-content">
    <div class="prog-picker-header">
      <button class="back-btn" onclick="Maps('prog')">← Back</button>
      <h2>${prog.name}</h2>
      <p>${prog.daysPerWeek} days/week · Program #${prog.number}</p>
    </div>
    <div class="session-list">
      ${prog.sessions.map(s => {
        const isNext = s.id === nextSessId;
        const done = doneThisWeek[s.id];
        const doneLabel = done ? (done.daysAgo === 0 ? 'Today' : done.daysAgo === 1 ? 'Yesterday' : done.daysAgo + ' days ago') : null;
        return `
        <div class="session-card${isNext ? ' next-session' : ''}">
          <div style="flex:1;cursor:pointer" onclick="startWorkoutFromHome('${prog.id}','${s.id}')">
            <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
              <h3>${s.name}</h3>
              ${isNext && !done ? `<span class="sess-next-badge">Next</span>` : ''}
              ${done ? `<span class="sess-done-chip">✓ ${doneLabel}</span>` : ''}
            </div>
            <p>${s.exercises.length} exercises</p>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <button class="preview-btn" onclick="previewSession('${prog.id}','${s.id}')" style="background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:6px 12px;font-size:12px;color:var(--text-secondary);cursor:pointer;min-height:36px">Preview</button>
            <div class="start-arrow" style="color:var(--muted);font-size:20px;cursor:pointer" onclick="startWorkoutFromHome('${prog.id}','${s.id}')">→</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}


// ── Workouts Browser ─────────────────────────────────────────────────────────
function renderWorkoutsBrowser() {
  const el = document.getElementById('screen-workouts-browser');
  if (!el) return;

  // ── Resolve active program ────────────────────────────────────────────────
  const progId = ST.defaultProgram || ST.currentProgram;
  const prog   = progId ? PROGRAMS.find(p => p.id === progId) : null;

  // ── History helpers ───────────────────────────────────────────────────────
  const hist      = getHistory();
  const weekStart = (() => {
    const d = new Date(); d.setHours(0,0,0,0);
    d.setDate(d.getDate() - d.getDay());
    return d.getTime();
  })();

  // Last completed session per program → determine "Next" badge
  function getNextSessId(p) {
    const ph = hist.filter(w => w.programId === p.id).sort((a,b) => b.endTime - a.endTime);
    const lastIdx = ph[0] ? p.sessions.findIndex(s => s.id === ph[0].sessionId) : -1;
    return p.sessions[(lastIdx + 1) % p.sessions.length].id;
  }

  // Done-this-week map for a program
  function getDoneThisWeek(p) {
    const map = {};
    for (const w of hist) {
      if (w.programId !== p.id || w.endTime < weekStart) continue;
      const daysAgo = Math.floor((Date.now() - w.endTime) / 86400000);
      if (!map[w.sessionId] || w.endTime > map[w.sessionId].endTime)
        map[w.sessionId] = { daysAgo, endTime: w.endTime };
    }
    return map;
  }

  function doneLabel(d) {
    if (!d) return null;
    if (d.daysAgo === 0) return 'Today';
    if (d.daysAgo === 1) return 'Yesterday';
    return `${d.daysAgo}d ago`;
  }

  // ── No program selected — show picker ────────────────────────────────────
  if (!prog) {
    el.innerHTML = `
    <div class="screen-content" style="padding:0 0 calc(var(--nav-h) + 24px)">
      <div style="padding:56px 28px 8px">
        <div style="font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px">Training</div>
        <h1 style="font-family:var(--font-hero);font-size:2.4rem;font-weight:700;color:var(--charcoal);line-height:1.05;letter-spacing:-0.5px">Program<br><em style="font-weight:400;font-style:italic">Library</em></h1>
        <p style="margin-top:16px;font-size:0.85rem;color:var(--text-secondary);line-height:1.5">Choose a program to begin logging sessions.</p>
      </div>
      <div style="padding:20px 20px 0">
        ${PROGRAMS.map(p => `
          <div onclick="selectProgramFromBrowser('${p.id}')"
               style="display:flex;align-items:center;gap:20px;padding:20px 4px;border-bottom:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent">
            <div style="font-family:var(--font-hero);font-size:2rem;font-weight:700;color:var(--accent);min-width:36px;line-height:1">${p.daysPerWeek}</div>
            <div style="flex:1">
              <div style="font-size:0.92rem;font-weight:600;color:var(--charcoal);margin-bottom:3px">${p.name}</div>
              <div style="font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">${p.sessions.length} sessions · ${p.timeEstimate || '45–60 min'}</div>
            </div>
            <div style="color:var(--muted);font-size:18px;padding-right:4px">›</div>
          </div>`).join('')}
      </div>
    </div>`;
    return;
  }

  // ── Program selected — render session list ────────────────────────────────
  const nextSessId  = getNextSessId(prog);
  const doneThisWeek = getDoneThisWeek(prog);

  el.innerHTML = `
  <div class="screen-content" style="padding:0 0 calc(var(--nav-h) + 24px)">

    <!-- ── Header ── -->
    <div style="padding:56px 28px 0">
      <div style="font-size:0.65rem;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-bottom:14px">Training Program</div>
      <h1 style="font-family:var(--font-hero);font-size:2.4rem;font-weight:700;color:var(--charcoal);line-height:1.05;letter-spacing:-0.5px">${prog.name}</h1>
      <div style="margin-top:10px;font-size:0.7rem;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted)">${prog.daysPerWeek} days / week · Program #${prog.number} · ${prog.timeEstimate || '45–60 min'}</div>
    </div>

    <!-- ── Change program link ── -->
    <div style="padding:20px 28px 4px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:0.72rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted)">${prog.sessions.length} Sessions</div>
      <button onclick="Maps('prog')"
              style="font-size:0.72rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--accent);background:none;border:none;cursor:pointer;padding:0;font-family:var(--font-body)">
        Change →
      </button>
    </div>

    <!-- ── Session rows ── -->
    <div style="padding:0 20px">
      ${prog.sessions.map((s, idx) => {
        const isNext = s.id === nextSessId;
        const done   = doneThisWeek[s.id];
        const dl     = doneLabel(done);
        const exCount = s.exercises.length;

        // Pull primary muscle groups from first 3 exercises for the subtitle
        const muscles = [...new Set(
          s.exercises.slice(0, 4).map(e => e.muscles || e.primary || '').filter(Boolean)
        )].slice(0, 3).join(' · ');

        return `
        <div style="display:flex;align-items:center;gap:0;padding:22px 4px;border-bottom:1px solid var(--border)">

          <!-- Day number -->
          <div style="font-family:var(--font-hero);font-size:1.6rem;font-weight:700;color:${done ? 'var(--muted)' : isNext ? 'var(--accent)' : 'var(--charcoal)'};min-width:44px;line-height:1;flex-shrink:0">

            ›

        </div>`;

    </div>

    <!-- ── Week summary footer ── -->
    <div style="padding:28px 28px 0;text-align:center">

// Select a program from the workouts browser (no-nav version of selectProgram)
function selectProgramFromBrowser(id) {
  ST.currentProgram = id;
  ST.defaultProgram = id;
  LS.set('dcrgym_default_prog', id);
  Maps('workouts-browser');  // re-render in place with the chosen program
}

// ── Workout renderer ──────────────────────────────────────────────────────────
function renderWorkout() {
  const el = document.getElementById('screen-workout');
  if (!el) return;
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (!prog || !sess) { Maps('home'); return; }
  const exList = sess.exercises;
  const notes = getNotes();
  const restTimes = getRestTimes();

  // Build exercise HTML
  const exCards = exList.map((ex, i) => {
    const key = `${sess.id}_${i}`;
    const name = stripSuperset(ex.name);
    const isExpanded = ST.expandedCards.has(key);
    const isCompleted = ST.completedCards.has(key);
    const muscle = getMuscle(name);
    const barbell = isBarbell(name);
    const cueAvail = !!FORM_CUES[normalizeEx(name)];
    const travel = ST.travelMode && TRAVEL_MAP[normalizeEx(name)];
    const displayName = travel ? travel.name : name;
    const loggedSets = ST.workoutSets[key] || [];

    // Sets count for this exercise
    const totalSets = ex.workingSets || 3;
    const reps = ex.reps || '8–10';

    // Last performance (pre-fill)
    const lastPerf = getLastPerformance(name);

    // Weight suggestion for new exercises
    let suggestion = null;
    if (!lastPerf) {
      suggestion = suggestWeight(name, muscle);
    }

    // Overload nudge check
    let overloadNudge = '';
    if (loggedSets.length === totalSets && totalSets > 0) {
      const topRep = parseInt((reps.match(/(\d+)$/) || ['',reps])[1]);
      if (!isNaN(topRep) && loggedSets.every(s => s.r >= topRep)) {
        overloadNudge = `<div class="overload-nudge">⬆ All sets hit ${topRep} reps — increase weight next session!</div>`;
      }
    }

    // ── Build set rows with trend micro-indicators ───────────────────────────
    // Compute historical average weight across all logged sets for this exercise
    let histAvgW = null;
    if (lastPerf && lastPerf.length > 0) {
      const wArr = lastPerf.filter(s => s && s.w > 0).map(s => s.w);
      if (wArr.length > 0) histAvgW = wArr.reduce((a, b) => a + b, 0) / wArr.length;
    }

    let setRows = '';
    for (let si = 0; si < totalSets; si++) {
      const logged = loggedSets[si];
      const lastSet = lastPerf && (lastPerf[si] != null ? lastPerf[si] : lastPerf[lastPerf.length - 1]);
      const preW = logged ? logged.w : (lastSet != null ? lastSet.w : '');
      const preR = logged ? logged.r : (lastSet != null ? lastSet.r : '');
      const isLastSet = si === totalSets - 1;
      const tech = isLastSet && ex.lastSetTechnique ? `<span class="technique-badge">${ex.lastSetTechnique}</span>` : '';
      const isLogged = !!logged;
      const plateHtml = barbell && isExpanded && ST.openPlate === `${key}_${si}` ? renderPlatePopover(preW || 0) : '';

      // ── Trend micro-indicator: compare pre-filled weight to historic average ─
      let trendHtml = '';
      if (!isLogged && histAvgW !== null && preW !== '' && Number(preW) > 0) {
        const diff = Number(preW) - histAvgW;
        const absDiff = Math.abs(diff);
        if (absDiff >= 0.5) {
          const arrow   = diff > 0 ? '↑' : '↓';
          const cls     = diff > 0 ? 'trend-arrow-up' : 'trend-arrow-down';
          const diffStr = (diff > 0 ? '+' : '') + diff.toFixed(1) + ' kg vs avg';
          trendHtml = `<div class="set-trend">
            <span class="${cls}">${arrow}</span>
            <span>${diffStr}</span>
          </div>`;
        }
      }

      setRows += `
      <div class="set-row" id="setrow-${key}-${si}">
        <div class="set-num">${si+1}</div>
        <input class="set-input${isLogged?' logged':''}" id="wi-${key}-${si}" type="number" inputmode="decimal"
          value="${preW}" placeholder="kg" min="0" step="0.5"
          enterkeyhint="next"
          onclick="this.select()"
          onkeydown="if(event.key==='Enter'){event.preventDefault();document.getElementById('ri-${key}-${si}').focus();document.getElementById('ri-${key}-${si}').select();}"
          ${barbell?`onfocus="showPlate('${key}',${si})" onblur="hidePlate('${key}',${si})"`:''}>
        <div class="set-sep">×</div>
        <input class="set-input${isLogged?' logged':''}" id="ri-${key}-${si}" type="number" inputmode="numeric"
          value="${preR}" placeholder="reps" min="0"
          enterkeyhint="done"
          onclick="this.select()"
          onkeydown="if(event.key==='Enter'){event.preventDefault();logSet('${key}',${si},${i});}">
        <button class="set-log-btn${isLogged?' logged':''}" onclick="${isLogged ? `unlogSet('${key}',${si},${i})` : `logSet('${key}',${si},${i})`}"
          >${isLogged ? '✓' : '→'}</button>
      </div>
      ${trendHtml}
      ${tech ? `<div style="padding-left:30px;margin-bottom:6px">${tech}</div>` : ''}
      ${plateHtml}`;
    }

    const warmupText = ex.warmupSets && ex.warmupSets !== '0' ?
      `<div class="warmup-hint">↑ ${ex.warmupSets} warmup sets before working sets</div>` : '';

    const noteKey = normalizeEx(name);
    const noteVal = notes[noteKey] || '';

    const restSec = restTimes[normalizeEx(name)] || parseRestSeconds(ex.rest);

    return `
    <div class="ex-card${isExpanded?' expanded':''}${isCompleted?' completed':''}" id="excard-${key}">
      <div class="ex-card-header" onclick="toggleCard('${key}')">
        <div class="ex-card-header-left">
          <div class="ex-name">${displayName} ${isCompleted ? '<span class="ex-check">✓</span>' : ''}</div>
          ${muscleBadgeHtml(muscle)}
          ${lastPerf ? `<div class="ex-last-perf">Last: ${lastPerf.slice(0,3).map((s,idx)=>`${idx+1}×${s.r}@${s.w}kg`).join(' · ')}</div>` : ''}
          <div class="ex-meta">${totalSets} × ${travel ? travel.reps : reps} · ${formatDuration(restSec)} rest</div>
        </div>
        <div class="ex-card-actions">
          <button class="ex-graph-btn" onclick="showProgressGraph(event,'${name}')" title="Progress">⬆</button>
          ${cueAvail || true ? `<button class="ex-cue-btn" onclick="showCue(event,'${key}',${i})">?</button>` : ''}
          ${travel ? '' : `<button class="ex-cue-btn" onclick="showSubs(event,'${key}',${i})" title="Substitutions">⇄</button>`}
          <button class="ex-note-btn${(ST.workoutNotes[key] || noteVal) ? ' has-note' : ''}" id="notebtn-${key}"
            onclick="toggleNotePanel(event,'${key}','${noteKey}')" title="Add note">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>
            </svg>
          </button>
          <svg class="ex-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </div>
      <div class="ex-body">
        <div class="ex-body-inner">
          ${warmupText}
          ${suggestion ? `<div class="weight-suggestion">💡 Suggested start: ~${suggestion.w}kg (based on ${suggestion.basis})</div>` : ''}
          ${overloadNudge}
          ${setRows}
          <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
            <div class="set-hint rest-time-row">
              <span style="color:var(--muted)">Rest</span>
              <span class="rest-time-display" id="rest-lbl-${key}" onclick="editRestTime('${key}',${i},this)" title="Tap to edit">${formatDuration(restSec)}</span>
            </div>
          </div>
          <!-- Inline note panel — revealed by header pen icon -->
          <div class="ex-note-panel${(ST.workoutNotes[key] || noteVal) ? ' open' : ''}" id="notepanel-${key}">
            <textarea class="ex-note-area" id="noteinput-${key}"
              placeholder="Session notes…"
              oninput="saveSessionNote('${key}','${noteKey}',this.value)"
            >${ST.workoutNotes[key] !== undefined ? ST.workoutNotes[key] : noteVal}</textarea>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `
  <div id="workout-header${ST.travelLocked?' travel-locked':''}">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
      <button onclick="cancelWorkout()" style="background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;padding:4px 8px 4px 0;flex-shrink:0;font-family:var(--font-body);width:44px;text-align:left">✕</button>
      <div class="wh-session">${sess.name}</div>
      <div style="width:44px;flex-shrink:0"></div>
    </div>
    <div class="wh-top">
      <div class="wh-duration" id="wh-dur">${formatDuration(ST.durationSecs)}</div>
      ${(()=>{
        const total = exList.length;
        const done = exList.filter((_,i)=>ST.completedCards.has(`${sess.id}_${i}`)).length;
        const remaining = total - done;
        return `<div class="wh-pct-badge${remaining===0?' complete':''}" id="wh-pct">
          <div class="wh-pct-num" id="wh-pct-num">${remaining}</div>
          <div class="wh-pct-unit">left</div>
        </div>`;
      })()}
    </div>
    <div class="wh-progress">
      ${exList.map((_,i)=>{
        const k=`${sess.id}_${i}`;
        return `<div class="wh-seg${ST.completedCards.has(k)?' done':''}"></div>`;
      }).join('')}
    </div>
    ${!ST.travelLocked ? `
    <div class="travel-toggle-row">
      <span class="travel-toggle-lbl">✈ Travel Mode (no gym)</span>
      <label class="toggle-switch">
        <input type="checkbox" ${ST.travelMode?'checked':''} onchange="setTravel(this.checked)">
        <span class="toggle-slider"></span>
      </label>
    </div>` : ''}
  </div>
  <div class="exercise-list">${exCards}</div>
  <div style="padding:16px">
    <button class="btn btn-primary" onclick="shimmerBtn(this);setTimeout(()=>finishWorkout(),220)">Finish Workout</button>
  </div>`;

  // Restore rest timer if active
  if (ST.restActive) {
    const remaining = Math.ceil((ST.restEndTime - Date.now())/1000);
    if (remaining > 0) {
      setTimeout(renderRestBanner, 100);
      if (!ST.restTicker) ST.restTicker = setInterval(tickRest, 250);
    } else {
      cancelRestTimer();
    }
  }

  // Auto-open first uncompleted exercise if nothing is expanded
  if (ST.expandedCards.size === 0) {
    const firstIdx = exList.findIndex((_, i) => !ST.completedCards.has(`${sess.id}_${i}`));
    if (firstIdx !== -1) {
      const firstKey = `${sess.id}_${firstIdx}`;
      ST.expandedCards.add(firstKey);
      const firstCard = document.getElementById('excard-' + firstKey);
      if (firstCard) firstCard.classList.add('expanded');
    }
  }
}

function renderPlatePopover(totalKg) {
  const plates = plateCalc(parseFloat(totalKg) || 0);
  if (!plates || plates.length === 0) return `<div class="plate-popover"><div class="plate-title">Plate Calculator · Bar only</div></div>`;
  const counts = {};
  for (const p of plates) counts[p] = (counts[p]||0) + 1;
  const chips = Object.entries(counts).map(([p,n]) =>
    `<div class="plate-chip${p==25||p==20?' orange':''}">${n>1?n+'×':''}${p}kg</div>`
  ).join('');
  return `<div class="plate-popover"><div class="plate-title">Each side · 20kg bar</div><div class="plate-row">${chips}</div></div>`;
}

function calcVolume() {
  let v = 0;
  for (const sets of Object.values(ST.workoutSets)) {
    for (const s of sets) v += (s.w||0)*(s.r||0);
  }
  return Math.round(v);
}

function updateProgressBadge() {
  const badge = document.getElementById('wh-pct');
  const numEl = document.getElementById('wh-pct-num');
  if (!badge || !numEl || !ST.currentSession) return;
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  if (!prog) return;
  const sess = prog.sessions.find(s => s.id === ST.currentSession);
  if (!sess) return;
  const exList = sess.exercises || [];
  const total = exList.length;
  const done = exList.filter((_, i) => ST.completedCards.has(`${sess.id}_${i}`)).length;
  const remaining = total - done;
  numEl.textContent = remaining;
  badge.classList.toggle('complete', remaining === 0);
}

function suggestWeight(exName, muscle) {
  const hist = getHistory();
  const muscleExes = [];
  for (const w of hist.slice(-20)) {
    if (!w.sets) continue;
    const prog = PROGRAMS.find(p=>p.id===w.programId);
    if (!prog) continue;
    const sess = prog.sessions.find(s=>s.id===w.sessionId);
    if (!sess) continue;
    for (const [key,sets] of Object.entries(w.sets)) {
      const i = parseInt(key.split('_').pop());
      const ex = sess.exercises[i];
      if (!ex || getMuscle(stripSuperset(ex.name)) !== muscle) continue;
      const best = sets.reduce((b,s)=>Math.max(b,s.w||0),0);
      if (best > 0) muscleExes.push({name:stripSuperset(ex.name), w:best});
    }
  }
  if (muscleExes.length === 0) return null;
  const best = muscleExes.sort((a,b)=>b.w-a.w)[0];
  const estimated = Math.round(best.w * 0.8 / 2.5) * 2.5;
  return { w: estimated, basis: best.name };
}


// ── Workout actions ───────────────────────────────────────────────────────────
function toggleCard(key) {
  const isExpanded = ST.expandedCards.has(key);
  // Collapse all other cards first (accordion)
  for (const k of [...ST.expandedCards]) {
    if (k !== key) {
      ST.expandedCards.delete(k);
      const c = document.getElementById('excard-' + k);
      if (c) c.classList.remove('expanded');
    }
  }
  // Toggle the tapped card
  if (isExpanded) {
    ST.expandedCards.delete(key);
  } else {
    ST.expandedCards.add(key);
  }
  const card = document.getElementById('excard-' + key);
  if (!card) return;
  const nowExpanded = ST.expandedCards.has(key);
  card.classList.toggle('expanded', nowExpanded);

  // Spotlight: dim all other non-completed cards
  document.querySelectorAll('.ex-card').forEach(c => {
    if (c.id !== 'excard-' + key) {
      c.classList.toggle('dimmed', nowExpanded && !c.classList.contains('completed'));
    }
  });

  // Auto-focus first unlogged weight input on expand
  if (nowExpanded) {
    setTimeout(() => {
      const inputs = card.querySelectorAll('.set-input:not(.logged)');
      for (const inp of inputs) {
        if (inp.id && inp.id.startsWith('wi-')) { inp.focus(); inp.select(); break; }
      }
    }, 320);
  }
}

function logSet(key, si, exIdx) {
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (!sess) return;
  const ex = sess.exercises[exIdx];
  const wi = document.getElementById('wi-' + key + '-' + si);
  const ri = document.getElementById('ri-' + key + '-' + si);
  if (!wi || !ri) return;
  const w = parseFloat(wi.value) || 0;
  const r = parseInt(ri.value) || 0;
  if (r === 0) { ri.focus(); return; }

  // Lock travel mode after first set
  const wasLocked = ST.travelLocked;
  ST.travelLocked = true;

  // Dismiss travel toggle from DOM on first ever set logged
  if (!wasLocked) {
    const tRow = document.querySelector('.travel-toggle-row');
    if (tRow) {
      tRow.classList.add('dismissing');
      tRow.style.maxHeight = tRow.offsetHeight + 'px'; // freeze before collapse
      requestAnimationFrame(() => { tRow.style.maxHeight = '0'; });
      setTimeout(() => { tRow.remove(); }, 260);
    }
    const hdr = document.getElementById('workout-header');
    if (hdr) hdr.classList.add('travel-locked');
  }

  if (!ST.workoutSets[key]) ST.workoutSets[key] = [];
  ST.workoutSets[key][si] = { w, r, ts: Date.now() };

  // Auto-save
  autoSave();

  // Haptic
  if (navigator.vibrate) navigator.vibrate(20);
  playSound('set');

  // Update UI for this set row
  wi.classList.add('logged');
  ri.classList.add('logged');
  const btn = wi.closest('.set-row') && wi.closest('.set-row').querySelector('.set-log-btn');
  if (btn) { btn.classList.add('logged'); btn.textContent = '✓'; }

  // Ripple
  const row = document.getElementById('setrow-' + key + '-' + si);
  if (row) {
    const ripple = document.createElement('div');
    ripple.className = 'set-ripple';
    row.style.position = 'relative';
    row.appendChild(ripple);
    setTimeout(() => ripple.remove(), 400);
  }

  // Update progress badge
  updateProgressBadge();

  // Check if exercise complete
  const totalSets = ex.workingSets || 3;
  const loggedSets = ST.workoutSets[key] || [];
  const doneCount = loggedSets.filter(Boolean).length;

  if (doneCount >= totalSets) {
    // Auto-collapse with delay
    ST.completedCards.add(key);
    setTimeout(() => {
      ST.expandedCards.delete(key);
      const card = document.getElementById('excard-' + key);
      if (card) {
        card.classList.remove('expanded');
        card.classList.add('completed');
        const nameEl = card.querySelector('.ex-name');
        if (nameEl) nameEl.innerHTML = stripSuperset(ex.name) + ' <span class="ex-check">✓</span>';
      }
      // Update progress bar + badge
      const segs = document.querySelectorAll('.wh-seg');
      if (segs[exIdx]) segs[exIdx].classList.add('done');
      updateProgressBadge();

      // Auto-advance to next exercise
      const _prog = PROGRAMS.find(p => p.id === ST.currentProgram);
      const _sess = _prog && _prog.sessions.find(s => s.id === ST.currentSession);
      if (_sess) {
        const nextIdx = exIdx + 1;
        if (nextIdx < _sess.exercises.length) {
          const nextKey = `${_sess.id}_${nextIdx}`;
          if (!ST.completedCards.has(nextKey)) {
            setTimeout(() => {
              toggleCard(nextKey);
              const nextCard = document.getElementById('excard-' + nextKey);
              if (nextCard) nextCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 250);
          }
        }
      }
    }, 300);
  }

  // Check overload nudge
  const reps = ex.reps || '8–10';
  const topRep = parseInt((reps.match(/(\d+)$/) || ['', '10'])[1]);
  if (doneCount >= totalSets && !isNaN(topRep) && loggedSets.every(s => s && s.r >= topRep)) {
    const body = document.querySelector('#excard-' + key + ' .ex-body-inner');
    if (body && !body.querySelector('.overload-nudge')) {
      const nudge = document.createElement('div');
      nudge.className = 'overload-nudge';
      nudge.textContent = '⬆ All sets hit ' + topRep + ' reps — increase weight next session!';
      body.prepend(nudge);
    }
  }

  // Rest timer
  const name = stripSuperset(ex.name);
  const restTimes = getRestTimes();
  const restSec = restTimes[normalizeEx(name)] || parseRestSeconds(ex.rest);
  if (restSec > 0) {
    // Build next-set info text
    let nextText = '', afterText = '';
    const isLastSet = si === totalSets - 1;
    if (isLastSet) {
      // Find next exercise
      const nextExIdx = exIdx + 1;
      if (nextExIdx < sess.exercises.length) {
        const nextEx = sess.exercises[nextExIdx];
        const nextName = stripSuperset(nextEx.name);
        const nextLast = getLastPerformance(nextName);
        const nextW = nextLast && nextLast[0] ? nextLast[0].w + 'kg' : '?';
        nextText = 'Exercise done ✓  Up next: ' + nextName + ' · ' + nextW;
      } else {
        nextText = 'Last exercise done ✓';
      }
    } else {
      const nextSi = si + 1;
      const preW = ST.workoutSets[key] && ST.workoutSets[key][si] ? ST.workoutSets[key][si].w : w;
      nextText = 'Next: Set ' + (nextSi + 1) + ' · ' + preW + 'kg × ' + r;
      if (si === totalSets - 2) {
        // Second to last — also show next exercise
        const nextExIdx = exIdx + 1;
        if (nextExIdx < sess.exercises.length) {
          const nextEx = sess.exercises[nextExIdx];
          afterText = 'After: ' + stripSuperset(nextEx.name);
        }
      }
    }
    startRestTimer(restSec, name, nextText, afterText, isLastSet);
  }
}

function unlogSet(key, si, exIdx) {
  if (!ST.workoutSets[key]) return;
  ST.workoutSets[key][si] = null;
  autoSave();

  // Update UI
  const wi = document.getElementById('wi-' + key + '-' + si);
  const ri = document.getElementById('ri-' + key + '-' + si);
  const row = document.getElementById('setrow-' + key + '-' + si);
  const btn = row && row.querySelector('.set-log-btn');
  if (wi) wi.classList.remove('logged');
  if (ri) ri.classList.remove('logged');
  if (btn) {
    btn.classList.remove('logged');
    btn.textContent = '→';
    btn.onclick = () => logSet(key, si, exIdx);
  }

  // Un-complete the card if it was marked done
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (sess) {
    const ex = sess.exercises[exIdx];
    const totalSets = ex ? (ex.workingSets || 3) : 3;
    const remaining = (ST.workoutSets[key] || []).filter(Boolean).length;
    if (remaining < totalSets) {
      ST.completedCards.delete(key);
      const card = document.getElementById('excard-' + key);
      if (card) {
        card.classList.remove('completed');
        const nameEl = card.querySelector('.ex-name');
        if (nameEl) nameEl.innerHTML = stripSuperset(ex.name);
      }
      const segs = document.querySelectorAll('.wh-seg');
      if (segs[exIdx]) segs[exIdx].classList.remove('done');
    }
  }
  updateProgressBadge();
}

function editRestTime(key, exIdx, el) {
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (!sess) return;
  const ex = sess.exercises[exIdx];
  const name = stripSuperset(ex.name);
  const restTimes = getRestTimes();
  const current = restTimes[normalizeEx(name)] || parseRestSeconds(ex.rest);

  // Replace the display with an inline seconds input
  const input = document.createElement('input');
  input.type = 'number';
  input.className = 'rest-time-input';
  input.value = current;
  input.min = 0;
  input.inputMode = 'numeric';
  el.replaceWith(input);
  input.focus();
  input.select();

  const commit = () => {
    const secs = parseInt(input.value);
    if (!isNaN(secs) && secs >= 0) {
      restTimes[normalizeEx(name)] = secs;
      saveRestTimes(restTimes);
    }
    const display = document.createElement('span');
    display.className = 'rest-time-display';
    display.id = 'rest-lbl-' + key;
    display.title = 'Tap to edit';
    display.textContent = formatDuration(isNaN(secs) || secs < 0 ? current : secs);
    display.onclick = () => editRestTime(key, exIdx, display);
    input.replaceWith(display);
  };

  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } if (e.key === 'Escape') { input.value = current; input.blur(); } });
}

function saveNote(nameKey, text) {

function showSubs(e, key, exIdx) {
  e.stopPropagation();
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (!sess) return;
  const ex = sess.exercises[exIdx];
  const name = stripSuperset(ex.name);
  const muscle = getMuscle(name);
  const nippardSubs = (ex.substitutions || []).filter(s => s && s.trim());
  const libSubs = (SUB_LIBRARY[muscle] || []).filter(s => !nippardSubs.includes(s.name) && s.name !== name);

  let nippardHtml = nippardSubs.map(s => buildSubCard(s, 'Gym', key, exIdx)).join('');
  let libHtml = libSubs.slice(0, 8).map(s => buildSubCard(s.name, s.tag, key, exIdx)).join('');

  openSheet(`
    <div class="bs-title">Substitutions for ${name}</div>
    ${nippardSubs.length ? `<div class="bs-section-lbl">Nippard Recommends</div>
    <div style="margin-bottom:12px">${nippardHtml}</div>` : ''}
    <div class="bs-section-lbl">More Options</div>
    ${libHtml}
  `);
}

function buildSubCard(name, tag, workoutKey, exIdx) {
  const last = getLastPerformance(name);
  const lastText = last && last[0] ? last[0].w + 'kg × ' + last[0].r : 'No history';
  const muscle = getMuscle(name);
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  const ex = sess && sess.exercises[exIdx];
  return `
  <div class="sub-card highlighted" id="subcard-${workoutKey}-${name.replace(/\s/g,'_')}">
    <div class="sub-card-header" onclick="toggleSubCard('${workoutKey}-${name.replace(/\s/g,'_')}')">
      <span class="sub-card-name">${name}</span>
      <span class="sub-card-tag">${tag}</span>
    </div>
    <div class="sub-card-body">
      <div class="sub-card-detail">${ex ? (ex.workingSets||3) + ' × ' + (ex.reps||'8–10') : ''} · Last: ${lastText}</div>
      <button class="sub-use-btn" onclick="useSubstitution('${workoutKey}',${exIdx},'${name}')">Use This Exercise</button>
    </div>
  </div>`;
}

function toggleSubCard(id) {
  const card = document.getElementById('subcard-' + id);
  if (!card) return;
  if (ST.openSubCard && ST.openSubCard !== id) {
    const prev = document.getElementById('subcard-' + ST.openSubCard);
    if (prev) prev.classList.remove('open');
  }

function useSubstitution(key, exIdx, subName) {
  // Record this substitution in notes
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (!sess) return;
  const ex = sess.exercises[exIdx];
  const notes = getNotes();
  notes[normalizeEx(stripSuperset(ex.name))] = 'Using: ' + subName;
  saveNotes(notes);
  closeSheet();
  renderWorkout();
}

function openSheet(html) {

  document.getElementById('bottom-sheet').classList.add('visible');

// ── Workout flow ──────────────────────────────────────────────────────────────
function startWorkoutFromHome(progId, sessId) {
  const existing = LS.get('dcrgym_current_workout');
  if (existing && (existing.programId !== progId || existing.sessionId !== sessId)) {
    if (!confirm('You have an unfinished workout. Start a new one?')) return;
    // Save any logged sets from the abandoned workout to history so pre-fill works next time
    const hasSets = existing.sets && Object.values(existing.sets).some(arr => Array.isArray(arr) && arr.some(s => s && s.r > 0));
    if (hasSets) {
      const hist = getHistory();
      hist.push({
        id: (existing.startTime || Date.now()).toString(),
        programId: existing.programId,
        sessionId: existing.sessionId,
        sessionName: existing.sessionName || '',
        startTime: existing.startTime || Date.now(),
        endTime: Date.now(),
        duration: existing.durationSecs || 0,
        travelMode: existing.travelMode || false,
        sets: existing.sets,
      });
      saveHistory(hist);
    }
    LS.remove('dcrgym_current_workout');
  }
  ST.currentProgram = progId;
  ST.currentSession = sessId;
  ST.travelMode = false;
  ST.travelLocked = false;
  ST.workoutSets   = {};
  ST.workoutNotes  = {};   // reset session-scoped notes for fresh workout
  ST.expandedCards = new Set();
  ST.completedCards = new Set();
  ST.durationSecs = 0;
  ST.workoutStart = Date.now();
  if (ST.durationTimer) clearInterval(ST.durationTimer);
  ST.durationTimer = setInterval(() => {
    ST.durationSecs = Math.floor((Date.now() - ST.workoutStart) / 1000);
    const el = document.getElementById('wh-dur');
    if (el) el.textContent = formatDuration(ST.durationSecs);
    const pd = document.getElementById('pill-dur');
    if (pd) pd.textContent = formatDuration(ST.durationSecs);
  }, 1000);
  // Wake lock
  if (navigator.wakeLock) {
    navigator.wakeLock.request('screen').then(wl => { ST.wakeLock = wl; }).catch(() => {});
  }
  autoSave();
  Maps('workout');
}

function resumeWorkout() {
  const saved = LS.get('dcrgym_current_workout');
  if (!saved) return;
  ST.currentProgram = saved.programId;
  ST.currentSession = saved.sessionId;
  ST.workoutSets = saved.sets || {};
  ST.travelMode = saved.travelMode || false;
  ST.travelLocked = saved.travelLocked || false;
  ST.workoutStart = Date.now() - (saved.durationSecs || 0) * 1000;
  ST.durationSecs = saved.durationSecs || 0;
  ST.expandedCards = new Set(saved.expandedCards || []);
  ST.completedCards = new Set(saved.completedCards || []);
  if (ST.durationTimer) clearInterval(ST.durationTimer);
  ST.durationTimer = setInterval(() => {
    ST.durationSecs = Math.floor((Date.now() - ST.workoutStart) / 1000);
    const el = document.getElementById('wh-dur');
    if (el) el.textContent = formatDuration(ST.durationSecs);
    const pd = document.getElementById('pill-dur');
    if (pd) pd.textContent = formatDuration(ST.durationSecs);
  }, 1000);
  if (navigator.wakeLock) navigator.wakeLock.request('screen').then(wl => ST.wakeLock = wl).catch(()=>{});
  // Restore rest timer
  const savedEnd = LS.get('dcrgym_rest_end');
  if (savedEnd && savedEnd > Date.now()) {
    ST.restActive = true;
    ST.restEndTime = savedEnd;
    ST.restNextText = LS.get('dcrgym_rest_next') || '';
    if (ST.restTicker) clearInterval(ST.restTicker);
    ST.restTicker = setInterval(tickRest, 250);
  }
  Maps('workout');
}

function discardWorkout() {
  LS.remove('dcrgym_current_workout');
  renderHome();
}

let _saveTimeout = null;
function autoSave() {
  clearTimeout(_saveTimeout);
  _saveTimeout = setTimeout(() => {
    LS.set('dcrgym_current_workout', {
      programId: ST.currentProgram,
      sessionId: ST.currentSession,
      sessionName: (() => { const p=PROGRAMS.find(pp=>pp.id===ST.currentProgram); const s=p&&p.sessions.find(ss=>ss.id===ST.currentSession); return s?s.name:''; })(),
      sets: ST.workoutSets,
      travelMode: ST.travelMode,
      travelLocked: ST.travelLocked,
      durationSecs: ST.durationSecs,
      expandedCards: [...ST.expandedCards],
      completedCards: [...ST.completedCards],
      startTime: ST.workoutStart,
    });
  }, 500);
}

function abandonPrompt() {
  // Leave workout without discarding — timer keeps running, pill appears
  autoSave();
  Maps('home');
}

function cancelWorkout() {
  if (!confirm('Cancel this workout? All logged sets will be lost.')) return;
  if (ST.durationTimer) clearInterval(ST.durationTimer);
  ST.durationTimer = null;
  if (ST.wakeLock) ST.wakeLock.release().catch(()=>{});
  cancelRestTimer();
  LS.remove('dcrgym_current_workout');
  ST.currentProgram = null; ST.currentSession = null;
  ST.workoutSets = {}; ST.workoutStart = null; ST.durationSecs = 0;
  ST.expandedCards = new Set(); ST.completedCards = new Set();
  ST.travelMode = false; ST.travelLocked = false;
  Maps('home');
}

// ── Post-workout insight engine ───────────────────────────────────────────────
function generateInsightCard(entry, duration, volume) {
  const fb      = ST.fitbit;
  const sleep   = fb.sleepScore;
  const hrv     = fb.hrv;
  const rhr     = fb.restingHR;
  const readiness = fb.readinessScore;

  // ── Card 1: Readiness Synthesis ───────────────────────────────────────────
  let synthesisTag  = 'readiness synthesis';
  let synthesisBody = '';

  if (readiness >= 85) {
    synthesisBody = `Programmed training parameters sustained completely against a commanding <strong>${readiness}%</strong> systemic readiness pool. Central nervous system recovery efficiency remains exceptional. Conditions favor progressive overload on your next neuro-load block.`;
  } else if (readiness >= 75) {
    synthesisBody = `Volume profile executed within a steady <strong>${readiness}%</strong> readiness baseline. Autonomic reserve is intact — standard 48-hour structural recovery window applies before your next primary compound session.`;
  } else {
    synthesisBody = `Training load held consistent against a tightened <strong>${readiness}%</strong> readiness floor. Prioritize immediately accessible parasympathetic protocols — thermal down-regulation, mineral timing, and extended sleep architecture tonight — to fast-track baseline restoration.`;
    synthesisTag = 'autonomic strategy';
  }

  // ── Card 2: Tactical Recovery (existing sleep/HRV/RHR logic) ─────────────
  let tacticalTag  = 'tactical optimization';
  let tacticalBody = '';

  if (sleep !== null && sleep < 70) {
    tacticalBody = `Performance thresholds held constant relative to a restricted <strong>${sleep}%</strong> sleep efficiency window. Prioritize immediate parasympathetic down-regulation protocols — contrasted hydrotherapy or targeted 4-7-8 breathing windows — to protect baseline autonomic tone before the next session.`;
    tacticalTag  = 'recovery alert';
  } else if (hrv !== null && hrv < 45) {
    tacticalBody = `HRV reading of <strong>${hrv}ms</strong> indicates elevated autonomic stress post-session. Extend your passive recovery window by 24–36 hours before your next neuro-load block. Prioritize hydration and whole-food carbohydrate replenishment.`;
    tacticalTag  = 'hrv advisory';
  } else if (rhr !== null && rhr > 68) {
    tacticalBody = `Resting heart rate at <strong>${rhr}bpm</strong> — slightly elevated baseline suggests residual systemic fatigue. Monitor sleep architecture tonight; if pattern persists across two sessions, consider a deload micro-cycle.`;
    tacticalTag  = 'cardiovascular note';
  } else if (sleep !== null && sleep >= 85 && hrv !== null && hrv >= 55) {
    tacticalBody = `Optimal recovery architecture confirmed — <strong>${sleep}%</strong> sleep efficiency, <strong>${hrv}ms</strong> HRV. Autonomic tone is high. Physiological conditions favor a progressive overload push in your next session.`;
    tacticalTag  = 'readiness window';
  } else {
    tacticalBody = `Session logged. Sleep efficiency <strong>${sleep !== null ? sleep + '%' : '—'}</strong>, HRV <strong>${hrv !== null ? hrv + 'ms' : '—'}</strong>. Standard recovery protocols apply — prioritize 7–9 hours sleep and adequate protein synthesis window post-session.`;
    tacticalTag  = 'session complete';
  }

  const card = {
    id: entry.id,
    sessionId: entry.sessionId,
    sessionName: entry.sessionName,
    volume: Math.round(volume),
    duration,
    ts: Date.now(),
    synthesisTag,
    synthesisBody,
    tacticalTag,
    tacticalBody,
  };

  LS.set('dcrgym_last_insight', card);
}

function getLastInsightCard() {
  return LS.get('dcrgym_last_insight', null);
}

function renderInsightCardHTML(card) {
  if (!card) return '';
  const timeAgo = (() => {
    const diff = Date.now() - (card.ts || 0);
    const h = Math.floor(diff / 3600000);
    const d = Math.floor(diff / 86400000);
    if (d > 0) return `${d}d ago`;
    if (h > 0) return `${h}h ago`;
    return 'just now';
  })();
  const meta = `${card.sessionName ? card.sessionName.toLowerCase() + ' · ' : ''}${formatDuration(card.duration)} · ${card.volume}kg · ${timeAgo}`;

  // Card 1 — Readiness Synthesis (new format) or legacy fallback
  const card1 = card.synthesisBody ? `
  <div class="insight-card" style="margin-bottom:8px">
    <div class="insight-card-eyebrow">${card.synthesisTag || 'readiness synthesis'}</div>
    <div class="insight-card-body">${card.synthesisBody}</div>
    <div class="insight-card-meta">${meta}</div>
  </div>` : `
  <div class="insight-card" style="margin-bottom:8px">
    <div class="insight-card-eyebrow">${card.tag || 'session complete'}</div>
    <div class="insight-card-body">${card.directive || ''}</div>
    <div class="insight-card-meta">${meta}</div>
  </div>`;

  // Card 2 — Tactical Recovery
  const card2 = card.tacticalBody ? `
  <div class="insight-card">
    <div class="insight-card-eyebrow">${card.tacticalTag || 'tactical optimization'}</div>
    <div class="insight-card-body">${card.tacticalBody}</div>
  </div>` : '';

  return card1 + card2;
}

function finishWorkout() {
  // Guard: warn if exercises incomplete
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(s => s.id === ST.currentSession);
  if (sess) {
    const total = sess.exercises.length;
    const done = sess.exercises.filter((_, i) => ST.completedCards.has(`${sess.id}_${i}`)).length;
    if (done < total) {
      const remaining = total - done;
      const msg = `You've only done ${done} of ${total} exercise${total>1?'s':''}. Finish anyway?`;
      if (!confirm(msg)) return;
    }
  }
  if (ST.durationTimer) clearInterval(ST.durationTimer);
  if (ST.wakeLock) ST.wakeLock.release().catch(()=>{});
  cancelRestTimer();
  const duration = ST.durationSecs;
  const volume = calcVolume();

  // Save to history
  const hist = getHistory();
  // Previous same session for comparison (prog/sess already declared above)
  const prevSame = hist.filter(w => w.sessionId === ST.currentSession).slice(-1)[0];
  const prevVol = prevSame ? Object.values(prevSame.sets || {}).flat().reduce((s,x)=>s+(x.w||0)*(x.r||0),0) : null;
  const prevDur = prevSame ? prevSame.duration : null;

  // Biggest gain
  let biggestGain = null;
  if (prevSame && prevSame.sets) {
    let maxGain = 0;
    for (const [key, sets] of Object.entries(ST.workoutSets)) {
      const exIdx = parseInt(key.split('_').pop());
      const ex = sess && sess.exercises[exIdx];
      if (!ex) continue;
      const prevSets = prevSame.sets[key] || [];
      const curMax = sets.reduce((m,s)=>Math.max(m,s.w||0),0);
      const prevMax = prevSets.reduce((m,s)=>Math.max(m,s.w||0),0);
      if (curMax - prevMax > maxGain) { maxGain = curMax - prevMax; biggestGain = { name: stripSuperset(ex.name), gain: maxGain }; }
    }
  }

  const entry = {
    id: Date.now().toString(),
    programId: ST.currentProgram,
    sessionId: ST.currentSession,
    sessionName: sess ? sess.name : '',
    startTime: ST.workoutStart,
    endTime: Date.now(),
    duration,
    travelMode: ST.travelMode,
    sets: ST.workoutSets,
    notes: { ...ST.workoutNotes },   // session-scoped exercise notes snapshot
  };
  hist.push(entry);
  saveHistory(hist);
  LS.remove('dcrgym_current_workout');
  bgSyncToSheets(); // optimistic background push

  // Generate and persist post-workout insight card
  generateInsightCard(entry, duration, volume);

  ST.lastSummary = { duration, volume, prevDur, prevVol, biggestGain };
  const milestone = checkMilestone();
  if (milestone) {
    ST.milestoneN = milestone;
    showMilestone();
  } else {
    showFinish();
  }

  // PWA install: handled natively via Chrome "Add to Home screen"
}

// ── Finish screen ─────────────────────────────────────────────────────────────
function showFinish() {
  const s = ST.lastSummary || {};
  const prog = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess = prog && prog.sessions.find(ss => ss.id === ST.currentSession);

  // Build the program session table
  const hist = getHistory();
  const weekStart = (() => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-d.getDay()); return d.getTime(); })();
  const msPerDay = 86400000;

  // Sessions done this week (excluding the one just finished)
  const doneThisWeek = {};
  for (const w of hist.slice(0, -1)) { // exclude the entry we just added
    if (w.programId !== (prog && prog.id) || w.endTime < weekStart) continue;
    if (!doneThisWeek[w.sessionId] || w.endTime > doneThisWeek[w.sessionId]) {
      doneThisWeek[w.sessionId] = w.endTime;
    }
  }

  const tableRows = prog ? prog.sessions.map(ps => {
    const isNow = ps.id === ST.currentSession;
    const priorDone = doneThisWeek[ps.id];
    if (isNow) {
      return `<div class="finish-row finish-row-now">
        <div class="fr-icon">✦</div>
        <div class="fr-info">
          <div class="fr-name">${ps.name}</div>
          <div class="fr-date">Just completed · ${formatDuration(s.duration||0)}</div>
        </div>
      </div>`;
    } else if (priorDone) {
      const daysAgo = Math.floor((Date.now() - priorDone) / msPerDay);
      const dateLabel = daysAgo === 0 ? 'Today' : daysAgo === 1 ? 'Yesterday' : daysAgo + ' days ago';
      return `<div class="finish-row finish-row-done-prior">
        <div class="fr-icon fr-icon-prior">✓</div>
        <div class="fr-info">
          <div class="fr-name">${ps.name}</div>
          <div class="fr-date">${dateLabel}</div>
        </div>
      </div>`;
    } else {
      return `<div class="finish-row finish-row-remaining">
        <div class="fr-icon">·</div>
        <div class="fr-info">
          <div class="fr-name">${ps.name}</div>
          <div class="fr-date">${ps.exercises.length} exercises</div>
        </div>
      </div>`;
    }
  }).join('') : '';

  // Stats — volume display removed per UI spec (III)
  const durText  = formatDuration(s.duration || 0);
  const gainText = s.biggestGain ? '+'+s.biggestGain.gain+'kg' : '—';
  const gainLabel = s.biggestGain ? s.biggestGain.name : 'Top gain';

  // Set compliance %
  const prog2 = PROGRAMS.find(p => p.id === ST.currentProgram);
  const sess2 = prog2 && prog2.sessions.find(ss => ss.id === ST.currentSession);
  let compliancePct = '—';
  if (sess2) {
    const total   = sess2.exercises.length;
    const done    = sess2.exercises.filter((_,i) => ST.completedCards.has(`${sess2.id}_${i}`)).length;
    compliancePct = total > 0 ? Math.round((done / total) * 100) + '%' : '—';
  }

  const el = document.createElement('div');
  el.id = 'finish-screen';
  el.innerHTML = `
    <div class="finish-headline">Done.</div>
    <div class="finish-session-label">${sess ? sess.name : 'Session'} complete</div>
    <div class="finish-stats-row">
      <div class="finish-stat"><div class="finish-stat-val">${durText}</div><div class="finish-stat-lbl">Duration</div></div>
      <div class="finish-stat"><div class="finish-stat-val">${compliancePct}</div><div class="finish-stat-lbl">Compliance</div></div>
      <div class="finish-stat"><div class="finish-stat-val" style="font-size:14px;line-height:1.2">${gainText}</div><div class="finish-stat-lbl">${gainLabel.split(' ')[0]}</div></div>
    </div>
    ${prog ? `<div class="finish-plan-table">${tableRows}</div>` : ''}
    <button class="btn btn-primary" style="max-width:360px;width:100%" onclick="dismissFinish()">Back to Home</button>
  `;
  document.body.appendChild(el);
  launchConfetti(false);
}

  const el = document.getElementById('finish-screen');
  if (el) el.remove();
  stopConfetti();
  Maps('home');
}
