function getWeeklyVolumeProgression(numWeeks = 6) {
  const hist = getHistory();
  const now = Date.now();
  const msW = 7 * 24 * 3600 * 1000;
  return Array.from({ length: numWeeks }, (_, i) => {
    const wStart = now - (numWeeks - i) * msW;
    const wEnd = now - (numWeeks - 1 - i) * msW;
    let vol = 0;
    for (const w of hist) {
      if (w.endTime >= wStart && w.endTime < wEnd && w.sets) vol += workoutVolume(w);
    }
    vol = dispW(vol);
    const d = new Date(wStart + msW / 2);
    return {
      dateLabel: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }),
      volume: Math.round(vol)
    };
  });
}

function renderWeeklyVolumeChart(weeks) {
  const unit = getWeightUnit();
  const vals = weeks.map(w => w.volume);
  const maxV = Math.max(...vals, 1);
  const W = 320, H = 84;
  const barW = 28;
  const spacing = (W - (barW * weeks.length)) / (weeks.length + 1);
  
  let barsHTML = '';
  weeks.forEach((w, i) => {
    const x = spacing + i * (barW + spacing);
    const barH = w.volume > 0 ? Math.max((w.volume / maxV) * 46, 4) : 3;
    const y = 58 - barH;
    const isPeak = w.volume === maxV && maxV > 0;
    const fill = isPeak ? 'var(--accent-kinetic)' : (w.volume > 0 ? 'rgba(240, 78, 35, 0.45)' : 'var(--surface-sunken)');
    const valLabel = w.volume >= 1000 ? (w.volume / 1000).toFixed(1) + 'k' : (w.volume > 0 ? w.volume : '');
    
    barsHTML += `
      <g>
        <rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW}" height="${barH.toFixed(1)}" rx="4" fill="${fill}"/>
        ${valLabel ? `<text x="${(x + barW / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="700" fill="var(--text-primary)" font-family="var(--font-mono)" style="font-variant-numeric:tabular-nums">${valLabel}</text>` : ''}
        <text x="${(x + barW / 2).toFixed(1)}" y="74" text-anchor="middle" font-size="8.5" font-weight="500" fill="var(--text-tertiary)" font-family="var(--font-body)">${w.dateLabel}</text>
      </g>
    `;
  });
  
  return `
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;display:block;overflow:visible">
      ${barsHTML}
    </svg>
  `;
}

// ── ota-34 (1): workouts this month and the 4.5-a-week target ────────────────
function monthWorkoutTarget(nowTs) {
  const now = new Date(nowTs || Date.now());
  const start = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const end = new Date(now.getFullYear(), now.getMonth() + 1, 1).getTime();
  const days = Math.round((end - start) / 86400000);
  const count = getHistory().filter(w => w && !w._dupOf && workoutDayTs(w) >= start && workoutDayTs(w) < end).length;
  return { count, target: Math.round(4.5 * days / 7), days, monthName: now.toLocaleDateString('en-US', { month: 'long' }) };
}

// ── ota-34 (3): estimated 1RM change by muscle, this month vs last month ─────
// Per exercise: best estimated 1RM this month vs last month (exercises done in both).
// A muscle's change is the median of its exercises' changes.
const GROWTH_MUSCLES = ['Chest','Back','Shoulders','Biceps','Triceps','Core','Glutes','Quads','Hamstrings','Calves','Traps'];
function getMonthlyGrowthByMuscle(nowTs) {
  const now = new Date(nowTs || Date.now());
  const thisStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();
  const lastStart = new Date(now.getFullYear(), now.getMonth() - 1, 1).getTime();
  const best = {};   // muscle -> exercise -> { cur, prev, name }
  for (const w of getHistory()) {
    if (!w || !w.sets || w._dupOf || w.partial) continue;
    const t = workoutDayTs(w);
    if (t < lastStart) continue;
    const slot = t >= thisStart ? 'cur' : 'prev';
    for (const [key, sets] of Object.entries(w.sets)) {
      if (key.endsWith('_wu') || !Array.isArray(sets) || !sets.length) continue;
      const nm = resolveWorkoutSetExName(w, key, sets);
      if (!nm) continue;
      const m = getMuscle(nm);
      if (!m || GROWTH_MUSCLES.indexOf(m) < 0) continue;
      const e = getTopSetE1RM(sets);
      if (!(e > 0)) continue;
      const k = normalizeEx(nm);
      const b = ((best[m] = best[m] || {})[k] = best[m][k] || { cur: 0, prev: 0, name: stripSuperset(nm) });
      if (e > b[slot]) b[slot] = e;
    }
  }
  const out = {};
  for (const m of GROWTH_MUSCLES) {
    const exs = Object.values(best[m] || {}).filter(x => x.cur > 0 && x.prev > 0)
      .map(x => ({ name: x.name, prev: x.prev, cur: x.cur, pct: (x.cur - x.prev) / x.prev * 100 }))
      .sort((a, b) => b.pct - a.pct);
    if (!exs.length) { out[m] = { pct: null, exercises: [], onlyThis: Object.values(best[m] || {}).some(x => x.cur > 0) }; continue; }
    const ps = exs.map(x => x.pct).sort((a, b) => a - b);
    const mid = ps.length % 2 ? ps[(ps.length - 1) / 2] : (ps[ps.length / 2 - 1] + ps[ps.length / 2]) / 2;
    out[m] = { pct: Math.round(mid * 10) / 10, exercises: exs };
  }
  return { muscles: out, thisMonth: now.toLocaleDateString('en-US', { month: 'long' }), lastMonth: new Date(lastStart).toLocaleDateString('en-US', { month: 'long' }) };
}
function growthColor(p) {
  if (p === null || p === undefined) return 'oklch(76% 0.014 60 / 0.30)';   // no data to compare
  if (p >= 1)  return 'oklch(56% 0.075 145 / 0.92)';                         // growing: sage
  if (p <= -1) return 'oklch(48% 0.130 35 / 0.85)';                          // down: terracotta
  return 'oklch(66% 0.020 60 / 0.62)';                                       // holding: warm grey
}
function renderGrowthFigure() {
  let g;
  try { g = getMonthlyGrowthByMuscle(); } catch (e) { return ''; }
  ST._growth = g;
  const svg = buildSilhouetteSVG({}, {}, false, { color: m => growthColor(g.muscles[m] ? g.muscles[m].pct : null), glow: () => 'none', noPulse: true })
    .replace(/id="([^"]+)"/g, 'id="hg-$1"').replace(/url\(#([^)]+)\)/g, 'url(#hg-$1)');
  const ups = GROWTH_MUSCLES.filter(m => g.muscles[m].pct !== null && g.muscles[m].pct >= 1).length;
  const downs = GROWTH_MUSCLES.filter(m => g.muscles[m].pct !== null && g.muscles[m].pct <= -1).length;
  return `<div class="growth-card">
    <div class="gc-head"><span class="hsi-label">Strength by muscle</span><span class="gc-sub">${g.thisMonth} vs ${g.lastMonth}</span></div>
    <div class="gc-body">
      <div class="gc-figure" onclick="growthMuscleTap(event)" role="img" aria-label="Estimated 1RM change by muscle">${svg}</div>
      <div class="gc-legend">
        <div><span class="gc-dot" style="background:${growthColor(5)}"></span>Stronger${ups ? ' · ' + ups : ''}</div>
        <div><span class="gc-dot" style="background:${growthColor(0)}"></span>Holding</div>
        <div><span class="gc-dot" style="background:${growthColor(-5)}"></span>Weaker${downs ? ' · ' + downs : ''}</div>
        <div><span class="gc-dot" style="background:${growthColor(null)}"></span>Not enough data</div>
        <div class="gc-hint">Tap a muscle for its %</div>
      </div>
    </div>
  </div>`;
}
function growthMuscleTap(e) {
  const el = e && e.target && e.target.closest ? e.target.closest('[data-muscle]') : null;
  if (!el) return;
  haptic('tick');
  const m = el.dataset.muscle, g = ST._growth || getMonthlyGrowthByMuscle(), d = g.muscles[m];
  const sign = p => (p > 0 ? '+' : '') + (Math.round(p * 10) / 10) + '%';
  const unit = getWeightUnit();
  const fmtE = v => Math.round(dispW(v));
  let body;
  if (!d || d.pct === null) {
    body = d && d.onlyThis ? `Trained in ${g.thisMonth}, but none of these exercises were done in ${g.lastMonth} to compare.` : `No ${m.toLowerCase()} lifts with weight in both ${g.lastMonth} and ${g.thisMonth} yet.`;
  } else {
    body = `<div style="margin-bottom:8px"><b>${sign(d.pct)}</b> estimated 1RM, ${g.thisMonth} vs ${g.lastMonth}.</div>` +
      d.exercises.slice(0, 5).map(x => `<div>${x.name}: ${fmtE(x.prev)} → ${fmtE(x.cur)} ${unit} (${sign(x.pct)})</div>`).join('');
  }
  noticeSheet(m, body);
}

// ── ota-35: workouts per month as an average weekly rate (target 4.5 a week) ──
// Same counting as the monthly total: duplicate copies skipped, late sessions on their start day.
// Each month = its workouts ÷ (its days ÷ 7). The current month uses the days so far.
function monthlyWorkoutRates(nowTs, maxMonths) {
  const now = new Date(nowTs || Date.now());
  const hist = getHistory().filter(w => w && !w._dupOf && (w.endTime || w.startTime));
  if (!hist.length) return [];
  const first = new Date(Math.min(...hist.map(w => workoutDayTs(w))));
  let y = first.getFullYear(), m = first.getMonth();
  const months = [];
  while (y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())) {
    const start = new Date(y, m, 1).getTime(), end = new Date(y, m + 1, 1).getTime();
    const current = y === now.getFullYear() && m === now.getMonth();
    const days = Math.round((end - start) / 86400000);
    const daysUsed = current ? now.getDate() : days;
    const count = hist.filter(w => { const t = workoutDayTs(w); return t >= start && t < end; }).length;
    months.push({ y, m, current, days, daysUsed, count, rate: Math.round(count / (daysUsed / 7) * 10) / 10,
      short: new Date(y, m, 1).toLocaleDateString('en-US', { month: 'short' }),
      long: new Date(y, m, 1).toLocaleDateString('en-US', { month: 'long' }) + (y !== now.getFullYear() ? ' ' + y : '') });
    if (++m > 11) { m = 0; y++; }
  }
  return months.slice(-(maxMonths || 12));
}
const WEEKLY_TARGET = 4.5;
function renderMonthlyChart() {
  const ms = monthlyWorkoutRates();
  if (!ms.length) return '<div class="mc-empty">Your months show here after your first workout.</div>';
  const W = 340, H = 210, L = 26, R = 6, T = 20, B = 26;
  const yMax = Math.max(6, Math.ceil(Math.max(...ms.map(x => x.rate)) + 0.5));
  const y = v => T + (H - T - B) * (1 - v / yMax);
  const slot = (W - L - R) / ms.length, bw = Math.min(26, slot * 0.62);
  const grid = [];
  for (let v = 0; v <= yMax; v += 2) grid.push(`<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="mc-grid"/><text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end" class="mc-axis">${v}</text>`);
  const bars = ms.map((x, i) => {
    const cx = L + slot * i + slot / 2, top = y(x.rate), h = Math.max(0, y(0) - top);
    const cls = 'mc-bar' + (x.rate >= WEEKLY_TARGET ? ' mc-hit' : '') + (x.current ? ' mc-now' : '');
    return `<rect x="${(cx - bw / 2).toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(5, bw / 3).toFixed(1)}" class="${cls}"/>` +
      (x.count ? `<text x="${cx.toFixed(1)}" y="${(top - 5).toFixed(1)}" text-anchor="middle" class="mc-val">${x.rate.toFixed(1)}</text>` : '') +
      `<text x="${cx.toFixed(1)}" y="${H - 9}" text-anchor="middle" class="mc-axis${x.current ? ' mc-axis-now' : ''}">${x.short}</text>`;
  }).join('');
  const ty = y(WEEKLY_TARGET);
  const done = ms.filter(x => !x.current && x.count);
  const avg = done.length ? Math.round(done.reduce((a, x) => a + x.count, 0) / done.reduce((a, x) => a + x.days / 7, 0) * 10) / 10 : null;
  const hits = done.filter(x => x.rate >= WEEKLY_TARGET).length;
  const rows = ms.slice().reverse().map(x => `<div class="mc-row${x.rate >= WEEKLY_TARGET ? ' mc-row-hit' : ''}">
      <span class="mc-row-m">${x.long}${x.current ? ' <span class="mc-so-far">so far</span>' : ''}</span>
      <span class="mc-row-n">${x.count} workout${x.count === 1 ? '' : 's'}</span>
      <span class="mc-row-r">${x.rate.toFixed(1)}<span class="mc-row-u"> / wk</span></span></div>`).join('');
  return `<div class="month-chart-card">
    <div class="gc-head"><span class="hsi-label">Workouts per week, by month</span><span class="gc-sub">Target ${WEEKLY_TARGET}</span></div>
    <svg viewBox="0 0 ${W} ${H}" class="mc-svg" role="img" aria-label="Average workouts per week for each month, target ${WEEKLY_TARGET}">
      ${grid.join('')}${bars}
      <line x1="${L}" x2="${W - R}" y1="${ty}" y2="${ty}" class="mc-target"/>
      <text x="${L + 4}" y="${ty - 5}" text-anchor="start" class="mc-target-label">target ${WEEKLY_TARGET} a week</text>
    </svg>
    <div class="mc-note">Each bar is that month's workouts divided by its weeks. This month counts the days so far.</div>
    ${avg !== null ? `<div class="mc-summary"><span><b>${avg.toFixed(1)}</b> a week in the ${done.length} full month${done.length === 1 ? '' : 's'} you trained</span><span>${hits} of ${done.length} at ${WEEKLY_TARGET}+</span></div>` : ''}
    <div class="mc-list">${rows}</div>
  </div>`;
}

function renderFiveWeekCalendar() {
  const hist = getHistory();
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  // Map dateKey → array of workout entries
  const workoutByDay = {};
  for (const w of hist) {
    const d = new Date(workoutDayTs(w));   // ota-34 (5): past-midnight sessions sit on their start day
    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if (!workoutByDay[key]) workoutByDay[key] = [];
    workoutByDay[key].push(w);
  }

  // Anchor to end of current week (Saturday)
  const currentDow = today.getDay();
  const weekEnd = new Date(today);
  weekEnd.setDate(today.getDate() + (6 - currentDow));

  const dows = ['S','M','T','W','T','F','S'];
  const monthName = today.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  let cellsHTML = '';
  for (let wk = 4; wk >= 0; wk--) {
    for (let dow = 0; dow < 7; dow++) {
      const d = new Date(weekEnd);
      d.setDate(weekEnd.getDate() - wk * 7 - (6 - dow));
      const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      const dayNum = d.getDate();
      const isFuture = d > today;
      const isToday = d.toDateString() === today.toDateString();
      const workouts = workoutByDay[key] || [];
      const hasWorkout = workouts.length > 0;

      if (isFuture) {
        cellsHTML += `<div class="cal-day-cell cal-day-blank"><span class="cal-day-num">${dayNum}</span></div>`;
      } else if (hasWorkout) {
        const w = workouts[0];
        const sessName = escHtml(w.sessionName || 'Workout');
        const dateStr  = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }).replace(/'/g, "\\'");
        cellsHTML += `<div class="cal-day-cell cal-day-done${isToday ? ' cal-day-today' : ''}"
          onclick="openCalDay('${w.id || w.endTime}','${dateStr}')"
          title="${sessName}">
          <span class="cal-day-num">${dayNum}</span>
        </div>`;
      } else {
        const dateStrForClick = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }).replace(/'/g, "\\'");
        cellsHTML += `<div class="cal-day-cell cal-day-open${isToday ? ' cal-day-today' : ''}"
          onclick="clickOpenCalDay(${d.getTime()}, '${dateStrForClick}')"
          title="Log past workout">
          <span class="cal-day-num">${dayNum}</span>
        </div>`;
      }
    }
  }

  return `
    <div class="cal-card">
      <div class="cal-card-head">
        <div class="cal-card-title">${monthName}</div>
        <div class="cal-card-legend">
          <span><span class="cal-legend-dot done"></span>Workout</span>
          <span><span class="cal-legend-dot rest"></span>Rest</span>
        </div>
      </div>
      <div class="cal-grid-7" style="margin-bottom: 6px;">
        ${dows.map(d => `<div class="cal-dow-cell">${d}</div>`).join('')}
      </div>
      <div class="cal-grid-7">
        ${cellsHTML}
      </div>
    </div>
  `;
}

function renderRecentWorkoutsFeed() {
  const hist = getHistory().slice().sort((a, b) => (b.endTime || 0) - (a.endTime || 0));

  if (hist.length === 0) {
    return `<div style="padding:24px 20px;text-align:center;color:var(--text-tertiary);font-size:var(--fs-md);font-style:italic">No workouts logged yet. Start your first session from the Home tab!</div>`;
  }

  return hist.slice(0, 15).map(w => {
    const wid = String(w.id || w.endTime);
    const dateStr = new Date(w.endTime || w.startTime).toLocaleDateString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'
    });
    const durStr = formatDuration(workoutDuration(w));
    const exNames = [];
    if (w.sets) {
      for (const [k, sArr] of Object.entries(w.sets)) {

    return `

        <div class="whfc-head">
          <div style="flex:1;min-width:0;">
            <div class="whfc-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escHtml(w.sessionName || 'Workout Session')}</div>
            <div class="whfc-date">📅 ${dateStr}</div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;flex-shrink:0;" onclick="event.stopPropagation()">

            <button class="btn-sheet-ghost" style="font-size:var(--fs-sm);padding:4px 9px;border-radius:10px;color:#C04E2A;border-color:rgba(192,78,42,0.25);" onclick="deleteCompletedWorkout('${wid}')">Delete</button>
          </div>
        </div>
        <div class="whfc-ribbon">
          <span>⏱ ${durStr}</span>
          <span>🏋️ ${volStr} ${unit}</span>

          ${w._dupOf ? '<span class="whfc-dup">Duplicate copy, not counted</span>' : ''}
        </div>
      </div>
    `;
  }).join('');
}

function editCompletedWorkout(workoutId) {
  const existing = LS.get('dcrgym_current_workout');
  const hasLogged = existing && existing.sets &&
    Object.values(existing.sets).some(arr => Array.isArray(arr) && arr.some(s => s && s.r > 0));

  const proceed = () => {
    const w = getHistory().find(x => String(x.id) === String(workoutId) || String(x.endTime) === String(workoutId));
    if (!w) return;

    ST.workoutCommitted = false; // editing a workout — re-enable snapshot autosave
    cancelRestTimer();
    ST.editingWorkoutId = w.id || w.endTime;
    ST.isBackdated = false;
    ST.currentProgram = w.programId;
    ST.currentSession = w.sessionId;
    ST.travelMode = w.travelMode || false;
    ST.travelLocked = w.travelLocked || false;
    ST.workoutSets = JSON.parse(JSON.stringify(w.sets || {}));
    ST.workoutNotes = JSON.parse(JSON.stringify(w.notes || {}));
    ST.workoutDrafts = {};
    ST.workoutSubs = w.subs ? JSON.parse(JSON.stringify(w.subs)) : {};
    ST.workoutSubMeta = w.subMeta ? JSON.parse(JSON.stringify(w.subMeta)) : {};
    ST.workoutSubSource = w.subSource ? JSON.parse(JSON.stringify(w.subSource)) : {};
    ST.workoutZoneView = {};
    ST.workoutAutoSubs = {};
    ST.workoutAutoSubMeta = {};
    ST.workoutAdditions = w.additions ? JSON.parse(JSON.stringify(w.additions)) : [];
    
    // Reconstruct fields if they were not stored in this workout (for backward compatibility)
    if (!w.additions || w.additions.length === 0) {
      const additions = [];
      const addKeys = Object.keys(w.sets || {})
        .filter(k => k.startsWith('add_') && !k.endsWith('_wu'))
        .sort((a, b) => parseInt(a.slice(4)) - parseInt(b.slice(4)));
      for (const key of addKeys) {
        const id = parseInt(key.slice(4));
        const setArr = w.sets[key] || [];
        const name = (setArr.find(s => s && s._name) || {})._name || 'Added exercise';
        additions.push({
          id: id,
          name: name,
          muscle: getMuscle(name),
          sets: setArr.length,
          reps: setArr[0] && setArr[0].r ? String(setArr[0].r) : '8-10',
          rest: '2–3 min'
        });
      }
      ST.workoutAdditions = additions;
    }
    
    {
      const prog = PROGRAMS.find(p => p.id === w.programId);
      const sess = prog && prog.sessions.find(s => s.id === w.sessionId);
      if (sess) {
        sess.exercises.forEach((ex, i) => {
          const key = `${sess.id}_${i}`;
          const setArr = w.sets[key];
          if (Array.isArray(setArr)) {
            const programmed = stripSuperset(ex.name);
            const stamped = (setArr.find(s => s && s._name) || {})._name;
            if (stamped && normalizeEx(stamped) !== normalizeEx(programmed)) {
              if (!ST.workoutSubs[key]) ST.workoutSubs[key] = stamped;
              if (!ST.workoutSubMeta[key]) {
                ST.workoutSubMeta[key] = {
                  sets: setArr.length,
                  reps: setArr[0] && setArr[0].r ? String(setArr[0].r) : String(ex.reps || '8-10')
                };
              }
            }
          }
        });
      }
    }
    
    ST.completedCards = w.completedCards ? new Set(w.completedCards) : new Set();
    if (!w.completedCards) {
      for (const key of Object.keys(w.sets || {})) {
        if (key.endsWith('_wu')) continue;
        const setArr = w.sets[key] || [];
        if (setArr.some(s => s && s.r > 0)) {
          ST.completedCards.add(key);
        }
      }
    }
    
    ST.expandedCards = new Set();
    ST.durationSecs = w.duration || 0;
    ST.workoutStart = w.startTime || (w.endTime - ST.durationSecs * 1000);
    ST.workoutEnd = w.endTime || (ST.workoutStart + ST.durationSecs * 1000);
    
    if (ST.durationTimer) clearInterval(ST.durationTimer);
    ST.durationTimer = null;
    
    saveNow();
    Maps('workout');
  };

  if (existing && hasLogged) {
    confirmSheet({
      title: 'Workout in progress',
      body: 'You have a live workout session with logged sets. Editing an old workout will cancel and archive your current live session. Proceed?',
      confirmLabel: 'Yes, proceed',
      cancelLabel: 'Cancel',
      destructive: true,
      onConfirm: () => {
        archiveWorkoutToHistory(existing);
        LS.remove('dcrgym_current_workout');
        proceed();
      }
    });
  } else {
    if (existing) LS.remove('dcrgym_current_workout');
    proceed();
  }
}

function deleteCompletedWorkout(workoutId) {
  const w = getHistory().find(x => String(x.id) === String(workoutId) || String(x.endTime) === String(workoutId));
  if (!w) return;
  const name = w.sessionName || 'Workout Session';
  const dateStr = new Date(w.endTime || w.startTime).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  confirmSheet({
    title: 'Delete this workout?',
    body: `<strong>${escHtml(name)}</strong> (${dateStr}) leaves your history. You can bring it back from Settings › Deleted workouts.`,
    confirmLabel: 'Delete Workout',
    cancelLabel: 'Keep Workout',
    destructive: true,
    onConfirm: () => {
      softDeleteWorkout(workoutId);   // ota-36: hidden, with Restore in Settings
      showToastMsg('Workout deleted · Restore in Settings');
      if (ST.screen === 'history') renderHistory();
      else if (ST.screen === 'home') renderHome();
    }
  });
}

    const dayStart = new Date(timestamp);

        html += `

            <div style="flex:1">
              <div style="font-size:var(--fs-md);font-weight:600;color:var(--charcoal)">${s.name}</div>

            </div>
            <div style="color:var(--accent);font-size:var(--fs-lg);font-weight:bold;padding-right:8px">＋</div>

  if (existing && hasLogged) {
    confirmSheet({

        proceed();
      }
    });
  } else {
    if (existing) LS.remove('dcrgym_current_workout');
    proceed();

function beginBackdatedWorkout(progId, sessId, timestamp) {
  ST.workoutCommitted = false; // new backdated log — re-enable snapshot autosave
  ST.currentProgram = progId;
  ST.currentSession = sessId;
  ST.isBackdated = true;
  ST.editingWorkoutId = null;
  ST.travelMode = false;
  ST.travelLocked = false;
  cancelRestTimer();
  ST.workoutSets   = {};
  ST.workoutNotes  = {};
  ST.workoutDrafts = {};
  ST.workoutSubs   = {};
  ST.workoutSubMeta = {};
  ST.workoutAutoSubs = {};
  ST.workoutAutoSubMeta = {};
  ST.workoutAdditions = [];
  ST.workoutSubSource = {};
  ST.workoutZoneView = {};
  ST.expandedCards = new Set();
  ST.completedCards = new Set();
  ST.durationSecs = 45 * 60; // default 45 min
  
  // Set the time to 12:00 PM (noon) on that calendar date
  const d = new Date(timestamp);
  d.setHours(12, 0, 0, 0);
  ST.workoutStart = d.getTime();
  ST.workoutEnd = ST.workoutStart + (ST.durationSecs * 1000);
  
  if (ST.durationTimer) clearInterval(ST.durationTimer);
  ST.durationTimer = null;
  
  applySlotDefaults();
  applyAutoSubstitutions();
  saveNow();
  Maps('workout');
}

  let deleteBtnHtml = '';
  if (ST.editingWorkoutId) {
    deleteBtnHtml = `
      <div style="margin-top: 12px; border-top: 1px solid var(--border); padding-top: 16px;">
        <button class="btn btn-primary btn-destructive" style="width: 100%; display: block;" onclick="deleteWorkout('${ST.editingWorkoutId}')">Delete Workout</button>

        <input type="datetime-local" id="edit-workout-datetime" style="width: 100%; border: 1px solid var(--border); border-radius: 12px; padding: 12px; font-size: var(--fs-md); background: rgba(255,255,255,0.6); color: var(--charcoal); -webkit-appearance: none; box-sizing: border-box;" value="${localISOTime}">

      </div>
      <div style="display: flex; gap: 10px; margin-top: 8px;">
        <button class="btn btn-primary" style="flex: 1;" onclick="saveWorkoutDetails()">Apply</button>
        <button class="btn btn-sheet-ghost" onclick="closeSheet()">Cancel</button>

function saveWorkoutDetails() {
  const dtEl = document.getElementById('edit-workout-datetime');
  const durEl = document.getElementById('edit-workout-duration');
  if (!dtEl || !durEl) return;
  
  const dtVal = dtEl.value;
  const durVal = parseInt(durEl.value) || 0;
  
  if (dtVal) {
    const newStart = new Date(dtVal).getTime();
    if (!isNaN(newStart)) {
      ST.workoutStart = newStart;
      ST.workoutEnd = newStart + (durVal * 60 * 1000);
    }
  }
  
  ST.durationSecs = durVal * 60;
  
  saveNow();
  closeSheet();
  renderWorkout();
}

function deleteWorkout(id) {
  confirmSheet({
    title: 'Delete this workout?',
    body: 'This workout leaves your history. You can bring it back from Settings › Deleted workouts.',
    confirmLabel: 'Delete',
    cancelLabel: 'Cancel',
    destructive: true,
    onConfirm: () => {
      if (softDeleteWorkout(id)) showToastMsg('Workout deleted · Restore in Settings');   // ota-36
      
      // Clear state
      if (ST.durationTimer) clearInterval(ST.durationTimer);
      ST.durationTimer = null;
      if (ST.wakeLock) ST.wakeLock.release().catch(()=>{});
      cancelRestTimer();
      LS.remove('dcrgym_current_workout');
      ST.currentProgram = null; ST.currentSession = null;
      ST.editingWorkoutId = null; ST.isBackdated = false; ST.workoutEnd = null;
      ST.workoutSets = {}; ST.workoutStart = null; ST.durationSecs = 0;
      ST.workoutDrafts = {}; ST.workoutSubs = {}; ST.workoutNotes = {};
      ST.workoutSubMeta = {}; ST.workoutAdditions = [];
      ST.expandedCards = new Set(); ST.completedCards = new Set();
      ST.travelMode = false; ST.travelLocked = false;
      
      closeSheet(false);
      Maps('history');
    }
  });
}

function openCalDay(id, dateStr) {
  const popup = document.getElementById('cal-popup');
  if (!popup) return;
  const w = getHistory().find(x => String(x.id) === String(id) || String(x.endTime) === String(id));
  if (!w) return;
  const sessName = w.sessionName || 'Workout';
  const dur = formatDuration(workoutDuration(w));
  let vol = Math.round(dispW(workoutVolume(w) || (w._dupOf ? 0 : 0)));
  if (w._dupOf) { // a flagged copy still shows its own numbers in its own popup
    for (const [k, sArr] of Object.entries(w.sets || {})) {
      if (k.endsWith('_wu') || !Array.isArray(sArr)) continue;
      for (const s of sArr) if (s && s.w > 0 && s.r > 0 && !s._suspect) vol += dispW(s.w * s.r);
    }
    vol = Math.round(vol);
  }
  const prevW = prevSameSessionWorkout(w); // ota-31 item 3
  const notes = w.notes || {};
  const prog = PROGRAMS.find(p => p.id === w.programId);
  const sess = prog && prog.sessions.find(s => s.id === w.sessionId);
  const unit = getWeightUnit();

  const sets = w.sets || {};
  let completedExCount = 0;
  let rowsHTML = '';

  const renderExRow = (name, setArr, subFrom, key) => {
    const done = (setArr || []).filter(s => s && s.r > 0);
    if (done.length === 0) return '';
    completedExCount++;
    const muscle = getMuscle(name);
    const topSet = topSetOf(done) || done[0];
    const topText = topSet ? `${topSet.w > 0 ? formatWeight(dispW(topSet.w)) + ' ' + unit : 'BW'} × ${topSet.r}` : `${done.length} sets`;
    // ota-31 item 3: this session vs the previous same session
    const cmp = compareToLastText(prevW, name);
    const cmpText = typeof cmp === 'string' ? cmp : (cmp.prevTop ? `${diffText(topSet, cmp.prevTop)} vs last ${escHtml(sessName.split(' ')[0] || 'time')}` : 'Not done last time');
    const cmpCls = typeof cmp === 'string' ? 'flat' : (/^\+/.test(cmpText) ? 'up' : (/^-/.test(cmpText) ? 'down' : 'flat'));
    const noteKey = Object.keys(notes).find(nk => nk === key || exercisesMatch(nk, name));
    const note = noteKey && notes[noteKey] ? String(notes[noteKey]).replace(/</g, '&lt;') : '';
    const flagged = (setArr || []).map((st, si) => ({ st, si })).filter(o => o.st && o.st._suspect);
    const flagHTML = flagged.map(o => `<div class="cal-flag-line" onclick="event.stopPropagation()">Set ${o.si + 1}: ${formatWeight(dispW(o.st.w))} ${unit} × ${o.st.r} looks like a typo and is left out of records and tonnage. <button class="cal-flag-btn" onclick="event.stopPropagation(); setSetSuspect('${w.id}','${key}',${o.si},false); openCalDay('${w.id}','${String(dateStr).replace(/'/g, "\\'")}')">Count it</button></div>`).join('');
    return `
      <div class="cal-ex-row" onclick="showProgressGraph(event, '${escAttr(name)}')" style="cursor:pointer;">
        <span class="cal-ex-check">✓</span>
        <div class="cal-ex-name">
          <div>${escHtml(name)}</div>
          ${subFrom ? `<span class="cal-ex-sub">Substituted from ${escHtml(subFrom)}</span>` : `<span class="cal-ex-sub">${escHtml(muscle)}</span>`}
        </div>
        <div style="text-align:right;">
          <div class="cal-ex-vol">${done.length} sets</div>
          <div style="font-size:var(--fs-xs);color:var(--text-tertiary);">${topText}</div>
        </div>
      </div>
      <div class="cal-cmp ${cmpCls}">${cmpText}</div>
      ${note ? `<div class="cal-ex-note">“${note}”</div>` : ''}
      ${flagHTML}
    `;
  };

  if (sess) {
    sess.exercises.forEach((ex, i) => {
      const key = `${w.sessionId}_${i}`;
      const setArr = sets[key];
      if (!Array.isArray(setArr)) return;
      const programmed = stripSuperset(ex.name);
      const stamped = (setArr.find(s => s && s._name) || {})._name || programmed;
      const subFrom = (normalizeEx(stamped) !== normalizeEx(programmed)) ? programmed : null;
      rowsHTML += renderExRow(stamped, setArr, subFrom, key);
    });
  }

  // Accessories
  const addKeys = Object.keys(sets)
    .filter(k => k.indexOf('add_') === 0 && !k.endsWith('_wu'))
    .sort((a, b) => parseInt(a.slice(4)) - parseInt(b.slice(4)));
  for (const key of addKeys) {
    const setArr = sets[key];
    if (!Array.isArray(setArr)) continue;
    const nm = (setArr.find(s => s && s._name) || {})._name || 'Added exercise';
    rowsHTML += renderExRow(nm, setArr, null, key);
  }

  // Safety net: render any logged sets not caught above
  const handledKeys = new Set([
    ...(sess ? sess.exercises.map((_, i) => w.sessionId + '_' + i) : []),
    ...addKeys
  ]);
  for (const [key, setArr] of Object.entries(sets)) {
    if (handledKeys.has(key) || key.endsWith('_wu')) continue;
    if (!Array.isArray(setArr) || setArr.length === 0) continue;
    const nm = (setArr.find(s => s && s._name) || {})._name || 'Workout Exercise';
    rowsHTML += renderExRow(nm, setArr, null, key);
  }

  const volStr = vol.toLocaleString();
  const progName = prog ? prog.name : 'Custom Routine';

  document.getElementById('cal-popup-content').innerHTML = `
    <div class="cal-popup-head">
      <div class="cal-popup-session">${escHtml(sessName)}</div>
      <div class="cal-popup-date">📅 ${dateStr}</div>
      <span class="cal-popup-prog">${progName}</span>
      ${w._dupOf ? `<div class="cal-dup-note">This looks like a second copy of another saved workout, so it isn't counted twice. Nothing was deleted.</div>` : ''}
      ${w._durFix ? `<div class="cal-dup-note">Duration shown ends at your last set. Saved timer said ${formatDuration(w.duration || 0)}.</div>` : ''}
      ${w._redate && (w._redate.by === 'ota-32' || w._redate.by === 'ota-33') ? `<div class="cal-dup-note">Moved back to the day of its sets. It had been finished on ${new Date(Number(w._redate.from.endTime)).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}. Undo in Settings.</div>` : ''}
    </div>

    <div class="cal-popup-stats">
      <div class="cal-popup-stat">
        <div class="cal-popup-stat-val">${dur}</div>
        <div class="cal-popup-stat-lbl">Duration</div>
      </div>
      <div class="cal-popup-stat">
        <div class="cal-popup-stat-val">${volStr} ${unit}</div>
        <div class="cal-popup-stat-lbl">Tonnage</div>
      </div>
      <div class="cal-popup-stat">
        <div class="cal-popup-stat-val">${completedExCount}</div>
        <div class="cal-popup-stat-lbl">Exercises</div>
      </div>
    </div>

    <div style="font-size:var(--fs-xs);font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-tertiary);margin-bottom:8px;">Completed Movements</div>
    <div class="cal-ex-list">${rowsHTML || '<div style="padding:12px;color:var(--text-tertiary);text-align:center;font-size:var(--fs-sm);">No logged sets found.</div>'}</div>

    <div class="cal-popup-actions">
      <button class="btn btn-primary" style="width:100%;font-size:var(--fs-md);padding:12px;" onclick="closeCalPopup(false); editCompletedWorkout('${w.id || w.endTime}')">Edit Workout & Sets</button>
      <button class="btn btn-sheet-ghost" style="width:100%;font-size:var(--fs-sm);" onclick="closeCalPopup(false); ST.editingWorkoutId='${w.id || w.endTime}'; ST.workoutStart=${w.startTime || w.endTime}; ST.durationSecs=${w.duration || 0}; editWorkoutDateTime()">Change Date, Time or Delete</button>
    </div>
  `;
  popup.style.display = 'flex';
  requestAnimationFrame(() => popup.classList.add('visible'));
  try {
    if (history.state && history.state.overlay) {
      history.replaceState({ screen: ST.screen, overlay: 'cal' }, '', '#cal');
    } else if (!history.state || history.state.overlay !== 'cal') {
      history.pushState({ screen: ST.screen, overlay: 'cal' }, '', '#cal');
    }
  } catch(err) {}
}

function closeCalPopup(unwindHistory = true) {
  _closeCalPopupDom();
  if (unwindHistory && history.state && history.state.overlay === 'cal') {
    try { history.back(); } catch(err) {}
  }
}

function _closeCalPopupDom() {
  const popup = document.getElementById('cal-popup');
  if (!popup) return;
  popup.classList.remove('visible');
  setTimeout(() => { popup.style.display = 'none'; }, 280);
}

function renderSparkline(values) {
  if (!values || values.length < 2) return '<line x1="0" y1="12" x2="60" y2="12" stroke="#E8E0D5" stroke-width="1.5"/>';
  const max = Math.max(...values);
  const min = Math.min(...values);
  const range = max - min || 1;
  const pts = values.map((v, i) => {
    const x = (i / (values.length - 1)) * 58 + 1;
    const y = 22 - ((v - min) / range) * 20;
    return `${x},${y}`;
  }).join(' ');
  return `<polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
}

function showMuscleDetail(muscle) {
  const unit = getWeightUnit();
  const step = unit === 'lb' ? '5 lbs' : '2.5 kg';
  const progress = getMuscleProgress();
  const p = progress.find(x => x.muscle === muscle);
  if (!p) return;
  const chartSvg = p.values.length > 1 ? `
    <svg viewBox="0 0 300 100" style="width:100%;height:80px;margin:12px 0">
      ${renderDetailChart(p.values)}
    </svg>` : '<p style="color:var(--muted);font-size:var(--fs-md);margin:12px 0">Not enough data yet — log more sessions.</p>';
  const insight = p.dot === 'red' && p.daysSince >= 7 ? `${muscle} hasn't been worked in ${p.daysSince} days. Get it in this week.`
    : p.dot === 'red' ? `${muscle} has been flat for 3+ sessions. Consider pushing intensity or adding a set.`
    : p.dot === 'amber' ? `${muscle} has been flat for 2 sessions. Try adding ${step} next time.`
    : `${muscle} is progressing well. Keep it up.`;

  openSheet(`
    <div class="bs-title">${muscle} Progress</div>
    <div style="font-size:var(--fs-md);color:var(--muted)">Estimated 1RM (Epley) · 4 weeks</div>
    ${chartSvg}
    <div style="background:rgba(240,78,35,0.06);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:12px 14px;font-size:var(--fs-md);color:var(--text-secondary);margin-top:8px">${insight}</div>
    <div style="margin-top:16px;font-size:var(--fs-md);color:var(--text-secondary)">Current 1RM estimate: <b>${p.latest > 0 ? p.latest + ' ' + unit : 'No data'}</b></div>
  `);
}

function exportCSV() {
  const hist = getHistory();
  let csv = 'Date,Program,Session,Exercise,Set,Weight,Reps,Flag\n';
  for (const w of hist) {
    if (!w || !w.sets) continue;
    const prog = PROGRAMS.find(p => p.id === w.programId);
    const sess = prog && prog.sessions.find(s => s.id === w.sessionId);
    const progName = prog ? prog.name : (w.programId === 'import' ? 'Strong Import' : 'Workout');
    const sessName = w.sessionName || (sess ? sess.name : 'Session');
    const date = localDateKey(w.endTime || w.startTime || Date.now()); // ota-31 (G): your local day, not UTC
    for (const [key, sets] of Object.entries(w.sets || {})) {
      if (!Array.isArray(sets) || key.endsWith('_wu')) continue;
      const exIdx = parseInt(key.split('_').pop());
      const fallbackName = (sess && !isNaN(exIdx) && sess.exercises[exIdx]) ? stripSuperset(sess.exercises[exIdx].name) : 'Exercise';
      const escapeCsv = (str) => `"${String(str || '').replace(/"/g, '""')}"`;
      (sets || []).filter(s => s && s.r > 0).forEach((s, i) => {
        const exName = (s && s._name) || fallbackName;
        const flag = w._dupOf ? 'duplicate copy' : (s._suspect ? 'suspect' : '');
        csv += `${escapeCsv(date)},${escapeCsv(progName)},${escapeCsv(sessName)},${escapeCsv(stripSuperset(exName))},${i+1},${(s && s.w)||0},${(s && s.r)||0},${escapeCsv(flag)}\n`;
      });
    }
  }
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'dcrgym-history.csv'; a.click();
  URL.revokeObjectURL(url);
}

function importStrongCSV(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const text = e.target.result;
    const lines = text.split('\n').filter(l => l.trim());
    if (lines.length < 2) { noticeSheet('Import failed', 'No data found in that CSV.'); return; }

    // Auto-detect separator
    const sep = lines[0].includes(';') ? ';' : ',';

    // Read header row and map column names → indices dynamically.
    // This handles all Strong export versions regardless of column order.
    const header = lines[0].split(sep).map(c => c.replace(/^"|"$/g,'').trim().toLowerCase());
    const col = name => header.findIndex(h => h === name || h.startsWith(name));
    const colDate     = col('date');
    const colExName   = col('exercise name');
    const colSetOrder = col('set order');
    const colWeight   = header.findIndex(h => h.startsWith('weight'));
    const colReps     = col('reps');

    if (colDate === -1 || colExName === -1 || colReps === -1) {
      noticeSheet('Import failed', 'Could not detect the required columns (Date, Exercise Name, Reps). Is this a Strong CSV export?');
      return;
    }

    let headerWeightUnit = null;
    if (colWeight !== -1) {
      const hText = header[colWeight];
      if (hText.includes('kg')) headerWeightUnit = 'kg';
      else if (hText.includes('lb')) headerWeightUnit = 'lb';
    }
    const activeWeightUnit = getWeightUnit();

    const hist = getHistory();
    let parsed = 0;
    let currentDate = null, currentWorkout = null;

    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(sep).map(c => c.replace(/^"|"$/g,'').trim());
      const dateStr   = cols[colDate]     || '';
      const exName    = cols[colExName]   || '';
      const setType   = colSetOrder !== -1 ? (cols[colSetOrder] || '') : '';
      const weightStr = colWeight  !== -1 ? (cols[colWeight]   || '0') : '0';
      const repsStr   = cols[colReps]     || '';

      if (!dateStr || !exName) continue;
      if (setType === 'W' || setType === 'Note' || exName === 'Rest Timer') continue;

      const date = new Date(dateStr).getTime();
      if (isNaN(date)) continue;

      if (!currentWorkout || currentDate !== dateStr) {
        if (currentWorkout) hist.push(currentWorkout);
        currentDate = dateStr;
        currentWorkout = { id: date.toString(), programId: 'import', sessionId: 'import', sessionName: 'Strong Import', startTime: date, endTime: date + 3600000, duration: 3600, travelMode: false, sets: {} };
        parsed++;
      }

      const clean = exName.replace(/\s*\([^)]*\)/g,'').trim();
      const key = 'import_' + clean.replace(/\s/g,'_').toLowerCase();
      if (!currentWorkout.sets[key]) currentWorkout.sets[key] = [];

      let parsedWeight = parseFloat(weightStr) || 0;
      if (headerWeightUnit === 'kg' && activeWeightUnit === 'lb') {
        parsedWeight = Math.round(parsedWeight * 2.20462 * 2) / 2;
      } else if (headerWeightUnit === 'lb' && activeWeightUnit === 'kg') {
        parsedWeight = Math.round((parsedWeight / 2.20462) * 10) / 10;
      }

      currentWorkout.sets[key].push({ w: parsedWeight, r: parseInt(repsStr)||0, ts: date, _name: clean });
    }

    if (currentWorkout) hist.push(currentWorkout);
    saveHistory(hist);
    noticeSheet('Import complete', 'Imported ' + parsed + ' workouts from Strong.');
    input.value = '';
  };
  reader.readAsText(file);
}

// ── Cloud sync (bidirectional) ────────────────────────────────────────────────
// Apps Script answers with an HTML page (not JSON) when the script needs to be
// re-authorized. resp.json() used to throw and the error showed as "offline",
// hiding the real cause. Read as text and say what actually happened.
// ── ota-36: private sync key + time limit on every call to the Google script ────
// The key lives only on this phone (localStorage + the IndexedDB vault), never in the code.
// ota-37: the phone makes it and registers it once (see pairKeyIfOpen).
const SHEETS_TIMEOUT_MS = 25000;
const SYNC_KEY_MSG = 'sync key needed';
function getSyncKey() { const k = LS.get('dcrgym_sync_key', null); return (typeof k === 'string' && k) ? k : ''; }
function setSyncKey(k) {
  k = String(k || '').trim();
  if (!/^[^\s&#]{16,200}$/.test(k)) return false;
  LS.set('dcrgym_sync_key', k); idbSet('dcrgym_sync_key', k);
  return true;
}
// ota-37: no key ever travels through a link or a chat. The phone makes its own key, keeps it
// (localStorage + the IndexedDB vault, never the Sheet or the restore copy) and registers it once
// with the script while the script's short pairing window is open. First phone wins.
function dropKeyFromLink() {   // an old pairing link: the key in it is retired, so it is never saved
  try {
    if (/(?:^#|&)(?:k|synckey)=/.test(location.hash || '')) history.replaceState(history.state, '', location.pathname + location.search);
  } catch (e) {}
}
function makeSyncKey() {
  const b = new Uint8Array(24);
  (window.crypto || self.crypto).getRandomValues(b);
  let bin = ''; for (const x of b) bin += String.fromCharCode(x);
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');   // 32 characters
}
function ensurePhoneKey() {
  if (getSyncKey()) return getSyncKey();
  const k = makeSyncKey();
  return setSyncKey(k) ? k : '';
}
function isKeyPaired() { const p = LS.get('dcrgym_key_paired', null); return !!(p && p.at); }
function markKeyPaired() {
  if (isKeyPaired()) return;
  const v = { at: Date.now(), build: APP_BUILD };
  LS.set('dcrgym_key_paired', v); idbSet('dcrgym_key_paired', v);
}
// Called after each ping. Registers at most once per open, and only when the script says its
// pairing window is open and it holds no key. Never sends anything to an older script.
async function pairKeyIfOpen(ping) {
  if (IS_PREVIEW || !ping || !ping.ok) return false;
  if (ping.keyOk === true) { markKeyPaired(); ST.pairState = 'paired'; return true; }
  if (isKeyPaired() && ping.keyHeld === true) { ST.pairState = ping.keyOk === false ? 'other' : 'paired'; return false; }
  if (ping.keyHeld === true) { ST.pairState = 'other'; return false; }   // another phone already paired
  if (ping.pairingOpen !== true) { ST.pairState = 'waiting'; return false; }
  if (ST._pairTried) return false;
  ST._pairTried = true;
  const key = ensurePhoneKey();
  if (!key) return false;
  try {
    const s = getSettings();
    const r = await sheetsFetch(s.sheets, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'registerKey', key }) });
    const data = r && r.ok ? await readSheetsJson(r) : null;
    if (data && data.ok && data.paired === true) { markKeyPaired(); ST.keyOk = true; ST.pairState = 'paired'; return true; }
    const err = String((data && (data.error || data.message)) || '');
    ST.pairState = /already-paired/.test(err) ? 'other' : 'waiting';
  } catch (e) { ST.pairState = 'waiting'; }
  return false;
}
function sheetsGetUrl(base, action) {
  const k = getSyncKey();
  return base + '?action=' + encodeURIComponent(action) + (k ? '&key=' + encodeURIComponent(k) : '');
}
function sheetsBody(payload) {
  const k = getSyncKey();
  return JSON.stringify(k ? Object.assign({}, payload, { key: k }) : payload);
}
async function sheetsFetch(url, init) {
  if (IS_PREVIEW) throw new TypeError('preview: cloud sync is off');
  const ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  let timedOut = false;
  const t = ctl ? setTimeout(() => { timedOut = true; try { ctl.abort(); } catch (e) {} }, window.__dcrSheetsTimeoutMs || SHEETS_TIMEOUT_MS) : null;
  try { return await fetch(url, ctl ? Object.assign({}, init || {}, { signal: ctl.signal }) : init); }
  catch (e) { if (timedOut) throw new TypeError('timed out'); throw e; }
  finally { if (t) clearTimeout(t); }
}
function isKeyRefusal(data) {
  return !!(data && data.ok === false && /^key$|unauthori[sz]ed|bad key|invalid key|wrong key|key missing/i.test(String(data.error || data.message || '').trim()));
}

async function readSheetsJson(resp) {
  const text = await resp.text();
  try {
    const data = JSON.parse(text);
    if (isKeyRefusal(data)) { data.error = SYNC_KEY_MSG; ST.keyRefused = true; }
    return data;
  } catch (e) {
    ST.lastCloudSyncError = /authoriz|sign in|signin|accounts\.google/i.test(text)
      ? 'needs Google re-authorization' : 'unexpected response';
    return null;
  }
}

// Rows ledger — which workouts are confirmed in WorkoutLog/WorkoutSummary.

// relying on a queue entry that may have been dropped.
function getRowsSyncedIds() { return new Set((LS.get('dcrgym_rows_synced', []) || []).map(String)); }

// sync-v2 server is append-only and idempotent; only then is a bulk catch-up safe.
async function probeSheetsServer() {
  const s = getSettings();

function enqueueSyncPayload(payload) {

  // Supersede older full-state snapshots or identical full-history backfills so queue stays lean

  } else if (payload.action === 'syncWorkouts' && Array.isArray(payload.workouts)) {

    // rule let one 10-workout batch erase a different queued batch, and every
    // app open stacked another copy of the same last workout.

      }

      ST.lastCloudSyncError = `HTTP ${r.status}`;
    }
  } catch(e) {
    ST.lastCloudSyncError = 'offline';
    if (payload.action === 'saveState') ST._stateThrewAt = Date.now();   // ota-35: see backupBlockedByOldScript
    else ST._sheetsOkAt = 0;                                              // a row upload failing means no connection
    /* stays queued — drains on next boot or reconnect */
  }
  return false;
}

// ota-35: the old script can no longer take the 171 KB backup at all, so the upload now fails like a
// lost connection instead of answering "cell full". When the script did answer in this same sync
// (ping or workout rows went through) the backup is blocked, not offline: stop showing it as
// waiting and try it at most once a day. Never applies once the script is the sync-v2 one.
function backupBlockedByOldScript() {
  if (ST.serverV2) return false;
  const now = Date.now();
  if (!ST._stateThrewAt || now - ST._stateThrewAt > 5 * 60 * 1000) return false;
  if (!ST._sheetsOkAt || now - ST._sheetsOkAt > 5 * 60 * 1000) return false;
  LS.set('dcrgym_sync_queue', (LS.get('dcrgym_sync_queue', []) || []).filter(i => !(i && i.payload && i.payload.action === 'saveState')));
  LS.set('dcrgym_backup_blocked', { at: now, err: 'upload refused (too large for the current script)' });
  ST.lastCloudSyncError = BACKUP_FULL_MSG;
  ST._stateThrewAt = 0;
  return true;
}

// ── Map history records → human-readable WorkoutLog rows ─────────────────────
// Exercise identity comes from the stored _name (schema v2); falls back to the
// program structure for legacy/import entries. Only working sets with reps>0;
// warm-ups excluded. Used for both the just-finished workout and the backfill.
function historyToWorkoutRows(records) {
  const out = [];
  for (const w of records || []) {
    if (!w || !w.sets) continue;
    const prog = PROGRAMS.find(p => p.id === w.programId);
    const sess = prog && prog.sessions.find(s => s.id === w.sessionId);
    const exMap = new Map();
    for (const [key, sets] of Object.entries(w.sets)) {
      if (!Array.isArray(sets) || key.endsWith('_wu')) continue;
      const exIdx = parseInt(key.split('_').pop());
      for (const s of sets) {
        if (!s || !(s.r > 0)) continue;
        let name = s._name;
        if (!name && sess && !isNaN(exIdx) && sess.exercises[exIdx]) name = stripSuperset(sess.exercises[exIdx].name);
        if (!name) name = 'Exercise';
        if (!exMap.has(name)) exMap.set(name, []);
        const row = { weight: s.w, reps: s.r };
        if (s._suspect) row.flag = 'suspect';          // ota-31: Sheet notes it; the value itself is never changed
        if (s._orig) row.was = { weight: s._orig.w, reps: s._orig.r };
        exMap.get(name).push(row);
      }
    }
    const exercises = [...exMap.entries()].map(([name, sets]) => ({ name, sets }));
    if (!exercises.length) continue;
    out.push({
      id: w.id,
      date: w.endTime,
      programName: prog ? prog.name : (w.programId === 'import' ? 'Strong Import' : ''),
      sessionName: w.sessionName || (sess ? sess.name : ''),
      duration: w.duration || '',
      totalE1RM: prog ? getSessionE1RM(w, prog) : 0,
      totalVolume: Math.round(workoutVolume(w)),     // ota-31 (A): the Sheet's "Total Volume" column reads this first
      totalSets: exercises.reduce((n, e) => n + e.sets.length, 0),
      duplicateOf: w._dupOf || '',
      unit: 'lb',                                     // ota-36: every weight the app sends is in lb
      exercises,
    });
  }
  return out;
}

// ── One-time backfill — push EVERY past workout as readable rows. The server ──
// dedups by row id, so retries are harmless; the flag just avoids re-sending.
async function backfillAllRows() {
  if (LS.get('dcrgym_rows_backfilled', false)) return;
  const s = getSettings();
  if (!s.sheets) return;
  // ota-33: only workouts the Sheet hasn't confirmed. The current Google script adds a
  // WorkoutSummary row for every workout it is sent, even ones it already has.
  const done = getRowsSyncedIds();
  const rows = historyToWorkoutRows(getHistory().filter(w => w && !done.has(String(w.id))));
  if (!rows.length) { LS.set('dcrgym_rows_backfilled', true); return; }
  const ok = await postToSheets({ action: 'syncWorkouts', workouts: rows });
  if (ok) LS.set('dcrgym_rows_backfilled', true);
}

// ── Cloud-sync status line for Settings ──────────────────────────────────────
function syncRelTime(ts) {
  if (!ts) return 'never';
  const d = Date.now() - ts;
  if (d < 60000)    return 'just now';
  if (d < 3600000)  return Math.floor(d / 60000) + 'm ago';
  if (d < 86400000) return Math.floor(d / 3600000) + 'h ago';
  return Math.floor(d / 86400000) + 'd ago';
}
function cloudSyncStatus() {
  const t = LS.get('dcrgym_last_sync', 0);
  const q = (LS.get('dcrgym_sync_queue', []) || []).length;
  const err = ST.lastCloudSyncError ? ` · cloud ${ST.lastCloudSyncError}` : '';
  const pend = ST.serverV2 ? unsyncedRowWorkouts().length : 0;
  return 'last synced ' + syncRelTime(t) + (q ? ' · ' + q + ' queued' : '') + (pend ? ' · ' + pend + ' not in sheet yet' : '') + err;
}

async function bgSyncToSheets(specificEntry, onlyState) {
  const s = getSettings();
  if (!s.sheets) return false;
  const hist = getHistory();
  if (!hist.length) return false;   // never push an empty history over the cloud copy

  // ota-33: while the old script's backup cell is full, automatic syncs try the 171 KB backup
  // at most every 12 hours (Sync Now always tries, so a script update shows at once).
  const blocked = LS.get('dcrgym_backup_blocked', null);
  const skipState = !ST._manualSync && !ST.serverV2 && blocked && (Date.now() - (blocked.at || 0) < 24 * 3600 * 1000);   // ota-35: once a day
  // Full restorable state blob — this is what Recover / pullState reads back.
  const stateOk = skipState ? (ST.lastCloudSyncError = BACKUP_FULL_MSG, false) : await postToSheets({
    action: 'saveState',
    history: hist,
    defaultProgram: ST.defaultProgram || LS.get('dcrgym_default_prog', null),
    notes: getNotes(),
    slotDefaults: getSlotDefaults(),          // ota-30 (current server ignores; kept for a later server paste)
    customExercises: getCustomExercises(),    // ota-30
    extras: buildCloudExtras(),               // ota-36: everything else that used to live only on the phone
    ts: Date.now()
  });

  let _stateErr = stateOk ? null : (ST.lastCloudSyncError || null);
  if (onlyState) { ST.lastSyncDetail = Object.assign({}, ST.lastSyncDetail || {}, { stateOk, stateErr: _stateErr, at: Date.now() }); return stateOk; }

  // No specific workout (app open / Sync Now): with the sync-v2 server, push
  // every workout the sheet doesn't have yet, not just the latest one.
  if (!specificEntry && ST.serverV2) {
    await catchUpRows();
    const pending = unsyncedRowWorkouts().length;
    if (!stateOk && pending === 0 && backupBlockedByOldScript()) _stateErr = BACKUP_FULL_MSG;
    ST.lastSyncDetail = { stateOk, rowsOk: pending === 0, rowsPending: pending, stateErr: _stateErr, err: ST.lastCloudSyncError || null, at: Date.now() };
    return stateOk && pending === 0;
  }

  // Readable rows for the just-finished workout. Built from the history record
  // (not live ST), so it stays correct even if the user navigated away.
  // ota-33: on app open / Sync Now, don't resend the latest workout when the Sheet already has
  // it. The current Google script adds a WorkoutSummary row on every send, so each open added
  // a copy. (No bulk catch-up against that script, for the same reason.)
  const targetEntry = specificEntry || hist[hist.length - 1];
  const alreadyIn = !specificEntry && targetEntry && getRowsSyncedIds().has(String(targetEntry.id));
  const rows = alreadyIn ? [] : historyToWorkoutRows([targetEntry]);
  let rowsOk = true;
  if (rows.length) rowsOk = await postToSheets({ action: 'syncWorkouts', workouts: rows });
  if (!stateOk && rowsOk && backupBlockedByOldScript()) _stateErr = BACKUP_FULL_MSG;   // ota-35
  ST.lastSyncDetail = { stateOk, rowsOk, rowsPending: rowsOk ? 0 : 1, stateErr: _stateErr, err: ST.lastCloudSyncError || null, at: Date.now() };
  return stateOk && rowsOk;
}

// ota-31 (A): one Sync Now used by Settings and the Home badge. Returns rows and backup as separate results.
async function runSyncNow() {
  const s = getSettings();
  if (!s.sheets) return { stateOk: false, rowsOk: false, err: 'no Sheets URL set', added: 0 };
  ST.lastCloudSyncError = null;
  ST.keyRefused = false;
  if (IS_PREVIEW) return { stateOk: false, rowsOk: false, err: 'preview: cloud sync is off', added: 0 };
  const seedAdded = ensureSeedHistoryMerged();
  await probeSheetsServer();
  const cloudAdded = await pullFromSheets();
  const added = seedAdded + cloudAdded;
  let pushOk = false;
  if (!ST.lastCloudSyncError) {
    await drainSyncQueue();
    await backfillAllRows();
  }
  ST._manualSync = true;
  try { pushOk = await bgSyncToSheets(); } finally { ST._manualSync = false; }
  const d = Object.assign({ stateOk: false, rowsOk: false }, ST.lastSyncDetail || {}, { added, pushOk });
  if (!d.err && ST.lastCloudSyncError) d.err = ST.lastCloudSyncError;
  ST.lastSyncDetail = d;
  return d;
}

async function manualSync() {
  const btn = document.getElementById('sync-now-btn');
  if (btn) { btn.textContent = 'Syncing…'; btn.disabled = true; }
  const s = getSettings();
  if (!s.sheets) { if (btn) { btn.textContent = 'No URL set'; btn.disabled = false; } return; }
  try {
    // PULL BEFORE PUSH — merge cloud in first, then flush queue, backfill, push.
    const d = await runSyncNow();
    const added = d.added || 0;
    const pushOk = !!d.pushOk;
    const det = document.getElementById('sync-detail');
    if (det) det.innerHTML = syncResultLines(d).join('<br>');
    else if (ST.screen === 'settings' && typeof renderSettings === 'function') setTimeout(() => { try { renderSettings(); } catch (e) {} }, 2600);
    if (added > 0) {
      renderHome();
      if (ST.screen === 'history') renderHistory();
    }
    if (btn) {
      if (pushOk) {
        btn.textContent = added > 0 ? `Synced (+${added}) ✓` : 'Synced ✓';
      } else {
        btn.textContent = added > 0 ? `Local +${added} (Cloud Offline)` : `Saved Locally (${getHistory().length})`;
      }
      setTimeout(()=>{ btn.textContent='Sync Now'; btn.disabled=false; }, 2500);
    }
  } catch(e) {
    if (btn) { btn.textContent = 'Saved Locally'; setTimeout(()=>{ btn.textContent='Sync Now'; btn.disabled=false; }, 2500); }
  }
}

async function recoverFromCloud() {
  const btn = document.getElementById('recover-btn');
  const s = getSettings();
  if (btn) { btn.textContent = 'Pulling…'; btn.disabled = true; }
  try {
    let added = 0;
    const idbHist = await idbGet('dcrgym_history');
    if (Array.isArray(idbHist) && idbHist.length > 0) {
      const local = getHistory();
      const m = mergeHistories(local, idbHist);
      if (m.length > local.length) {
        added += (m.length - local.length);
        saveHistory(m);
      }
    }
    added += ensureSeedHistoryMerged();
    if (s.sheets) {
      added += await pullFromSheets();
    }
    ensureActiveProgram();
    if (btn) {
      btn.textContent = added > 0 ? `Restored ${added} workout${added!==1?'s':''}` : `Vault Ready (${getHistory().length}) ✓`;
      setTimeout(()=>{ btn.textContent='Recover ↓'; btn.disabled=false; }, 3000);
    }
    if (added > 0) {
      renderHome();
      if (ST.screen === 'history') renderHistory();
    }
  } catch(e) {
    if (btn) { btn.textContent = 'Failed'; btn.disabled = false; }
  }
}

function mergeHistories(local, remote) {
  const deletedIds = new Set((LS.get('dcrgym_deleted_ids', []) || []).map(String));
  const cloudDeleted = new Set((LS.get('dcrgym_cloud_deleted_ids', []) || []).map(String));   // ota-36: incoming only
  const frozen = !!LS.get('dcrgym_repairs_frozen', null);
  const map = new Map();
  for (const rawW of (local || [])) {
    if (!rawW || !rawW.id) continue;
    const id = String(rawW.id);
    if (deletedIds.has(id)) continue;
    // ota-36: once frozen, records already cleaned are kept exactly as stored (no every-open rewrite);
    // only a record that never went through the clean-up gets it, once.
    const w = (frozen && rawW._unitLb) ? rawW : normalizeWorkoutUnits(rawW);
    map.set(id, w);
  }
  for (const rawW of (remote || [])) {
    if (!rawW || !rawW.id) continue;
    const id = String(rawW.id);
    if (deletedIds.has(id) || cloudDeleted.has(id)) continue;
    if (!hasLoggedWorkingSets(rawW)) continue;
    const w = normalizeWorkoutUnits(JSON.parse(JSON.stringify(rawW)));
    if (!map.has(id)) {
      map.set(id, w);
    } else {
      // Local workout ALWAYS wins; only fill in any exercise completely missing from local
      const existing = map.get(id);
      if (existing && existing.sets && w.sets) {
        const existingExNames = [];
        for (const [ek, eSets] of Object.entries(existing.sets)) {
          if (ek.endsWith('_wu') || !Array.isArray(eSets) || eSets.length === 0) continue;
          const eName = resolveWorkoutSetExName(existing, ek, eSets);
          if (eName) existingExNames.push(eName);
        }
        const removedKeys = new Set((existing._removedKeys || []).map(String)); // ota-31 (G)
        for (const [k, rSets] of Object.entries(w.sets)) {
          if (!Array.isArray(rSets) || rSets.length === 0) continue;
          if (removedKeys.has(k)) continue;
          if (!existing.sets[k] || (Array.isArray(existing.sets[k]) && existing.sets[k].length === 0)) {
            const rName = resolveWorkoutSetExName(w, k, rSets);
            const alreadyPresentByName = rName && existingExNames.some(en => exercisesMatch(en, rName));
            if (!alreadyPresentByName) {
              existing.sets[k] = rSets;
              if (rName) existingExNames.push(rName);
            }
          }
        }
      }
      if (existing && w.notes && typeof w.notes === 'object') {
        existing.notes = Object.assign({}, w.notes, existing.notes || {});
      }
    }
  }
  return [...map.values()].sort((a, b) => ((a.endTime || a.startTime || 0) - (b.endTime || b.startTime || 0)));
}


function checkWeekComplete() {
  const progId = ensureActiveProgram();
  if (!progId) return false;
  const prog = PROGRAMS.find(p => p.id === progId);
  if (!prog) return false;
  const rot = getProgramRotationState(prog, getHistory());
  return !!(rot && rot.justCompletedFullCycle && rot.lastWorkout && (Date.now() - (rot.lastWorkout.endTime || 0) < 18 * 3600 * 1000));
}

// ── Gatekeeper — verifies (and injects if missing) all required UI root elements ──
// ── Synchronous bootstrap — shell is hard-coded in HTML, no dynamic injection ─
// ── Fault-tolerant bootstrap — all state access inside try/catch, LS proxy only ──
async function bootstrapApp() {
  console.log('[DCR Gym Shell] Booting application...');
  // ota-37: keys never come in through a link; an old pairing link is cleared from the address bar
  if (!IS_PREVIEW) dropKeyFromLink();
  if (IS_PREVIEW) { try { document.documentElement.classList.add('is-preview'); } catch (e) {} }

  // ota-30: one-time copy of the full history in the IndexedDB vault before this build touches anything.
  // Read-only snapshot; nothing ever restores over live data automatically.
  try {
    if (!LS.get('dcrgym_ota30_backup_at', null)) {
      const _h = getHistory();
      if (_h.length) { idbSet('dcrgym_history_backup_ota30', { at: Date.now(), build: APP_BUILD, history: _h }); LS.set('dcrgym_ota30_backup_at', Date.now()); }
    }
  } catch (e) { console.warn('[DCR Gym] pre-update backup skipped', e); }
  try { mergeCustomExercises(); } catch (e) { console.warn('[DCR Gym] custom exercises not merged', e); }

  // Dismiss splash early if user was previously onboarded
  const splash = document.getElementById('splash');
  const home   = document.getElementById('screen-home');
  const nav    = document.getElementById('bottom-nav');

  // Fast-path: read synchronous localStorage for immediate render
  const _obFast = LS.get('dcrgym_onboarded');
  if (_obFast === true || _obFast === 'true') {
    if (splash) {
      splash.classList.remove('active');
      splash.style.display = 'none';
      splash.style.pointerEvents = 'none';
      splash.style.zIndex = '-1';
    }
    if (home) home.style.display = 'block';
    if (nav)  nav.style.display  = 'flex';
  }

  // Handle hardware / browser back button navigation
  window.addEventListener('popstate', (e) => {
    let handledOverlay = false;

    // Check if bottom-sheet is visible in DOM
    const sheet = document.getElementById('bottom-sheet');
    if (sheet && sheet.classList.contains('visible')) {
      __closeSheetDom();
      handledOverlay = true;
    }

    // Check if muscle-graph-overlay is visible in DOM
    const muscleOv = document.getElementById('muscle-graph-overlay');
    if (muscleOv && (muscleOv.classList.contains('visible') || (muscleOv.style && muscleOv.style.display !== 'none' && muscleOv.style.display !== ''))) {
      _closeMuscleGraphDom();
      handledOverlay = true;
    }

    // Check if graph-backdrop (progress graph) is visible in DOM
    const graphBd = document.getElementById('graph-backdrop');
    if (graphBd && (graphBd.classList.contains('visible') || (graphBd.style && graphBd.style.display !== 'none' && graphBd.style.display !== ''))) {
      if (typeof _closeProgressGraphDom === 'function') _closeProgressGraphDom();
      handledOverlay = true;
    }

    // Check if cal-popup is open
    const calPopup = document.getElementById('cal-popup');
    if (calPopup && (calPopup.classList.contains('visible') || (calPopup.style && calPopup.style.display !== 'none' && calPopup.style.display !== ''))) {
      if (typeof _closeCalPopupDom === 'function') _closeCalPopupDom();
      handledOverlay = true;
    }

    // Check if numpad is open
    if (document.body.classList.contains('numpad-open')) {
      if (typeof closeNumpad === 'function') closeNumpad();
      handledOverlay = true;
    }

    // Check if finish-screen is open
    const finishScreen = document.getElementById('finish-screen');
    if (finishScreen) {
      if (typeof dismissFinish === 'function') dismissFinish();
      return;
    }

    // Check if milestone-screen is open
    const milestoneScreen = document.getElementById('milestone-screen');
    if (milestoneScreen) {
      if (typeof dismissMilestone === 'function') dismissMilestone();
      return;
    }

    const target = (e.state && e.state.screen) || 'home';

    // If popstate was triggered by dismissing an overlay (and screen hasn't changed), don't navigate screens
    if (handledOverlay && target === ST.screen) {
      return;
    }

    if (target !== ST.screen) {
      window.__navFromPop = true;
      try { Maps(target); } finally { window.__navFromPop = false; }
    }
  });

  // State hydration & IndexedDB Vault recovery — guarantees zero data loss
  try {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().then(persistent => {
        console.log('[DCR Gym Vault] Storage persistence:', persistent ? 'guaranteed' : 'default');
      }).catch(() => {});
    }

    // 0. Rehydrate deleted workout IDs from IndexedDB if needed
    const localDel = LS.get('dcrgym_deleted_ids', null);
    if (!localDel) {
      const idbDel = await idbGet('dcrgym_deleted_ids');
      if (Array.isArray(idbDel)) LS.set('dcrgym_deleted_ids', idbDel);
    }
    // ota-36: measurements, swaps, custom and hidden exercises, rest times, the deleted archive,
    // the sync key and the schema/freeze markers come back from the vault if the phone lost them.
    try { await restoreVaultExtras(); } catch (eV) { console.warn('[ota-36] vault extras skipped', eV); }

    // 1. Dual-layer non-destructive union merge between localStorage, IndexedDB, and embedded historical vault!
    const localHist = LS.get('dcrgym_history', []);
    const idbHist = await idbGet('dcrgym_history');
    const combinedLocal = mergeHistories(
      Array.isArray(localHist) ? localHist : [],
      Array.isArray(idbHist) ? idbHist : []
    );
    if (combinedLocal.length > 0) {
      saveHistory(combinedLocal);
    }

    // Merge embedded recovered workout history non-destructively (local/today's workouts always win)
    ensureSeedHistoryMerged();

    // Rehydrate in-progress workout snapshot if localStorage was evicted mid-session
    const localLive = LS.get('dcrgym_current_workout', null);
    if (!localLive) {
      const idbLive = await idbGet('dcrgym_current_workout');
      if (idbLive && idbLive.sessionId && idbLive.startTime) {
        LS.set('dcrgym_current_workout', idbLive);
      }
    } else {
      idbSet('dcrgym_current_workout', localLive);
    }

    // 2. Rehydrate settings, notes, default program from vault if localStorage was wiped
    const localSettings = LS.get('dcrgym_settings', null);
    if (!localSettings) {
      const idbSettings = await idbGet('dcrgym_settings');
      if (idbSettings) saveSettings(idbSettings);
    } else {
      idbSet('dcrgym_settings', localSettings);
    }

    const localNotes = LS.get('dcrgym_notes', null);
    if (!localNotes) {
      const idbNotes = await idbGet('dcrgym_notes');
      if (idbNotes) saveNotes(idbNotes);
    } else {
      idbSet('dcrgym_notes', localNotes);

    backfillNotesFromHistory(getHistory());

    const idbProg = await idbGet('dcrgym_default_prog');
    ST.defaultProgram = LS.get('dcrgym_default_prog') || idbProg || null;
    ensureActiveProgram();
    ST.blacklistedExercises = new Set(LS.get('dcrgym_blacklist', []));
    getSettings();
    migrateStorage();
    try { await restoreFixFlags(); } catch (e34) {}
    // ota-36: the ota-31/32/33 one-time repairs have run on his phone. They keep their results (and
    // their Undo in Settings) but no longer run on open. A phone that never ran them runs them once.
    if (!LS.get('dcrgym_repairs_frozen', null)) {
      try { runOta31DataFlags(); } catch (e31) { console.warn('[ota-31] data check skipped:', e31); }
      try { runOta32Fixes(); } catch (e32) { console.warn('[ota-32] date check skipped:', e32); }
      try { runOta33Fixes(); } catch (e33) { console.warn('[ota-33] Monday fix skipped:', e33); }
      const fz = { at: Date.now(), build: APP_BUILD };
      LS.set('dcrgym_repairs_frozen', fz); idbSet('dcrgym_repairs_frozen', fz);
    }
    try { mirrorFixFlags(); } catch (e34) {}
    try { if (!IS_PREVIEW) fixStartsAfterEnd(); } catch (e38) { console.warn('[ota-38] start-time check skipped:', e38); }
    try { idbSet('dcrgym_schema_version', LS.get('dcrgym_schema_version', null)); } catch (e36) {}
  } catch(e) {
    console.warn('[DCR Gym Shell] State hydration notice (non-fatal):', e);
  }

  // Service worker — registered with a live OTA update watcher. (Never from a preview copy.)
  if ('serviceWorker' in navigator && !IS_PREVIEW) {
    if ('Notification' in window) {
      ST.notifEnabled = Notification.permission === 'granted';
    }
    navigator.serviceWorker.register('sw.js').then(reg => {
      ST.swReg = reg;
      initUpdateWatcher(reg);
    }).catch(() => {});
  }

  // ── Cloud sync & Auto-Hydration for fresh devices ──────────────────────────
  let didInitialPull = false;
  if (getHistory().length === 0 && !IS_PREVIEW) {
    try {
      const added = await pullFromSheets();
      didInitialPull = true;
      if (added > 0 || getHistory().length > 0) {
        LS.set('dcrgym_onboarded', true);
      }
    } catch(e) {
      console.warn('[DCR Gym Shell] Initial cloud auto-hydration notice:', e);
    }
  }

  // ── Cloud sync on every app open — PULL BEFORE PUSH (never clobber cloud) ──
  if (!IS_PREVIEW) (async () => {
    try {
      await probeSheetsServer();
      if (!didInitialPull) {
        const added = await pullFromSheets();
        if (added > 0) {
          // If we were on onboarding and cloud restored past workouts, bypass onboarding immediately!
          const currentHist = getHistory();
          if (currentHist.length > 0 && !LS.get('dcrgym_onboarded')) {
            LS.set('dcrgym_onboarded', true);
            const obEl = document.getElementById('screen-home');
            if (obEl) { obEl.innerHTML = ''; obEl.style.display = 'none'; obEl.classList.remove('active'); }
            const nav = document.getElementById('bottom-nav');
            if (nav) nav.style.display = 'flex';
            Maps('home');
          } else {
            if (ST.screen === 'home') renderHome();
            else if (ST.screen === 'history') renderHistory();
          }
        }
      }
      if (!ST.lastCloudSyncError) {
        await drainSyncQueue();
        await backfillAllRows();
        await bgSyncToSheets();
        // ota-36: heart rate for the strain stat (read-only; quietly skipped if the script can't yet)
        try { if (await fetchWorkoutHeartRates() > 0 && ST.screen === 'home') renderHome(); } catch (eH) {}
      }
    } catch (e) { /* silent — background op */ }
  })();

  // Dismiss splash — belt-and-suspenders: remove active class, zero z-index
  if (splash) {
    splash.classList.remove('active');
    splash.style.display = 'none';
    splash.style.pointerEvents = 'none';
    splash.style.zIndex = '-1';
  }

  // Routing — uses LS proxy, no raw localStorage calls
  try {
    const _ob = LS.get('dcrgym_onboarded');
    const onboarded = _ob === true || _ob === 'true' || getHistory().length > 0;

    if (!onboarded && getHistory().length === 0) {
      console.log('[DCR Gym Shell] First launch → onboarding');
      onboardStep = 0;
      onboardProg = null;
      renderOnboarding();
    } else {
      console.log('[DCR Gym Shell] Returning user → home');
      if (home) home.style.display = 'block';
      if (nav)  nav.style.display  = 'flex';
      Maps('home');
      if (!IS_PREVIEW) setTimeout(() => { try { autoFinishSavedIfIdle(); } catch (e) { console.warn('[ota-32] auto-finish skipped:', e); } }, 300); // ota-32 (2)
      if (IS_PREVIEW) setTimeout(() => { try { noticeSheet('Preview build', 'This is a look-only copy of the next update, using the workouts on this phone. Nothing you do here is saved or sent to the Sheet. Close it and open the app as usual to go back.'); } catch (e) {} }, 400);

    }
  } catch(err) {
    console.error('[DCR Gym Shell] Router fault:', err);
    document.body.innerHTML =
      '<div style="padding:40px;font-family:sans-serif;background:#FAF7F2;color:oklch(44% 0.025 55);min-height:100vh">' +
      '<h2 style="font-family:serif;font-style:italic">[System Boot Fault]</h2>' +
      '<p style="margin-top:10px">' + err.message + '</p>' +
      '<pre style="background:#fff;padding:12px;font-size:var(--fs-sm);overflow-x:auto;margin-top:10px">' + (err.stack || '') + '</pre>' +
      '<button onclick="(function(){if(\'caches\' in window){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}; if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}; setTimeout(function(){location.reload(true)},300)})()" style="margin-top:20px;padding:10px 20px;background:#2A2421;color:#fff;border:none;border-radius:8px;cursor:pointer">Clear Cache &amp; Reload</button>' +
      '<p style="margin-top:8px;font-size:var(--fs-sm);color:#888;font-family:sans-serif">Workout history is preserved.</p>' +
      '</div>';
    return;
  }

  // ota-36: one cloud pull per open (the open-time sync above already pulled).
}

function runBootSequence() {
  console.log('[DCR Gym Shell] Dispatched main boot loop.');
  try {
    bootstrapApp();
  } catch(fatalError) {
    console.error('[DCR Gym Shell] Boot failed:', fatalError);
    document.body.innerHTML =
      '<div style="padding:40px;font-family:sans-serif;background:#FAF7F2;color:oklch(44% 0.025 55);min-height:100vh">' +
      '<h2 style="font-family:serif;font-style:italic">[System Boot Fault]</h2>' +
      '<p style="margin-top:10px">' + fatalError.message + '</p>' +
      '<pre style="background:#fff;padding:12px;font-size:var(--fs-sm);overflow-x:auto;margin-top:10px">' + (fatalError.stack || '') + '</pre>' +
      '<button onclick="(function(){if(\'caches\' in window){caches.keys().then(function(k){k.forEach(function(n){caches.delete(n)})})}; if(\'serviceWorker\' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})})}; setTimeout(function(){location.reload(true)},300)})()" style="margin-top:20px;padding:10px 20px;background:#2A2421;color:#fff;border:none;border-radius:8px;cursor:pointer">Clear Cache &amp; Reload</button>' +
      '<p style="margin-top:8px;font-size:var(--fs-sm);color:#888;font-family:sans-serif">Workout history is preserved.</p>' +
      '</div>';
  }
}

// Target all document readyState variants — critical for iOS WebView + Safari
if (document.readyState === 'complete' || document.readyState === 'interactive') {
  setTimeout(runBootSequence, 1);
} else {
  window.addEventListener('load', runBootSequence);
}
</script>

<div id="cal-popup" onclick="closeCalPopup()">
  <div id="cal-popup-panel" onclick="event.stopPropagation()">
    <button class="cal-popup-close" onclick="closeCalPopup()">&#x2715;</button>
    <div id="cal-popup-content"></div>
  </div>
</div>

<script src="fitbit-overlay.js"></script>
</body>
